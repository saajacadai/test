"في أي ثوب ولو كان يصف لون البشرة"],"answer":1,"why":"ويُسنّ للمرأة أن تصلي في ثلاثة أثواب: خمار تغطي به الرأس والعنق، ودرع يغطي به البدن والرجلين، وملحفة صفيقة تستر الثياب؛ فعن عمر رضي الله عنه: «تصلي المرأة في ثلاثة أثواب: درع وخمار وإزار».","ref":"ص 6–7"},{"q":"ماذا قال النبي ﷺ للرجل الذي أساء في صلاته؟","options":["«ارجع فصلِّ فإنك لم تصلِّ»","«أحسنتَ فلا إعادة عليك»","«صلِّ بعدها نافلة»","«اجلس حتى تهدأ ثم أكمل»"],"answer":0,"why":"في حديث أبي هريرة: دخل رجل المسجد فصلى، فجاء فسلّم على النبي ﷺ فردّ عليه السلام، فقال: «ارجع فصلِّ فإنك لم تصلِّ» ثلاثًا، ثم علّمه: «إذا قمت إلى الصلاة فكبّر ثم اقرأ ما تيسر معك من القرآن...».","ref":"ص 7"},{"q":"ما حكم القيام في النافلة، وما أجر من صلى قاعدًا بحسب حديث عمران رضي الله عنه الوارد في الدرس؟","options":["يشترط القيام في النافلة كالفريضة","من صلى قاعدًا فله أجر القائم كاملًا","من صلى قاعدًا لا أجر له","لا يُشترط القيام في النافلة للقادر، ولكن أجره النصف؛ فمن صلى قاعدًا فله نصف أجر القائم"],"answer":3,"why":"ولا يُشترط القيام في النافلة للقادر، ولكن أجره النصف؛ فعن عمران: «من صلى قائمًا فهو أفضل، ومن صلى قاعدًا فله نصف أجر القائم، ومن صلى نائمًا فله نصف أجر القاعد» (أخرجه البخاري).","ref":"ص 8"},{"q":"كيف يكون التعامل مع الأولاد بعد سن العاشرة إن لم تُجْدِ الأساليب التربوية المنضبطة في حثهم على الصلاة بحسب الدرس؟","options":["يُضرب ضربًا شديدًا ليرتدع","يُترك الأمر دون متابعة","يُلجأ إلى الضرب ضربًا رفيقًا غير عنيف؛ لأنه للتأديب لا للعقوبة","يُهدَّد بالحرمان من كل شيء"],"answer":2,"why":"وبعد العاشرة: إن لم تُجدِ الأساليب التربوية المنضبطة في حث الأولاد على الصلاة، يُلجأ إلى الضرب ضربًا رفيقًا غير عنيف؛ لأنه للتأديب لا للعقوبة؛ ليشعر الأولاد أن الصلاة أمرٌ جِدّ لا تهاون فيه.","ref":"ص 11"}],"8":[{"q":"إلى أي قسمين تنقسم سنن الصلاة عند الشافعية؟","options":["الهيئات والأبعاض","الأركان والشروط","الواجبات والمندوبات","الفرائض والنوافل"],"answer":0,"why":"تنقسم السنن عند الشافعية إلى قسمين: الهيئات (التي لا تحتاج إلى سجود السهو إن تُركت)، والأبعاض (التي تُجبر بسجود السهو إن تُركت، وسُميت كذلك لقربها من الفرض).","ref":"ص 2"},{"q":"كم عدد أبعاض الصلاة، وما هي؟","options":["ثلاثة: التكبير والتعوذ والتأمين","خمسة: الاستعاذة والسكوت والجهر والإسرار والخشوع","ستة: كل سنن الهيئات","أربعة: التشهد الأول والجلوس له، والصلاة على النبي ﷺ في التشهد الأول، والصلاة على الآل في التشهد الأخير، والقنوت والقيام له"],"answer":3,"why":"الأبعاض أربعة: التشهد الأول والجلوس له، والصلاة على النبي ﷺ في التشهد الأول، والصلاة على الآل في التشهد الأخير، والقنوت والقيام له بعد الاعتدال من الركوع الثاني من فرض الصبح.","ref":"ص 5"},{"q":"في كم موضع يُسنّ رفع اليدين في الصلاة بحسب الدرس؟","options":["في موضع واحد مع تكبيرة الإحرام فقط","في موضعين: عند السجود وعند السلام","في أربعة مواضع: مع تكبيرة الإحرام، وعند الهوي للركوع، وعند الرفع من الركوع، وعند القيام من التشهد الأول","في كل ركن من أركان الصلاة"],"answer":2,"why":"رفع اليدين -وكفاه مكشوفتان متوجهتان إلى القبلة، مفرّجتا الأصابع- حذو المنكبين، ويكون الرفع في أربعة مواضع: مع تكبيرة الإحرام، وعند الهوي للركوع، والرفع عند الانتهاء من الركوع، والرفع عند القيام من التشهد الأول.","ref":"ص 2"},{"q":"أين يكون موضع نظر المصلي طلبًا للخشوع بحسب الدرس؟","options":["إلى السماء","إلى موضع السجود","إلى الكعبة دائمًا ولو كانت أمامه","إلى يمينه ويساره"],"answer":1,"why":"من الهيئات: النظر إلى موضع السجود في قيامه وقعوده طلبًا للخشوع وغضًّا للبصر عما يلهي ولو كان عند الكعبة، أما في التشهد فينظر إلى مسبحته عند قوله «إلا الله».","ref":"ص 2"},{"q":"ما الصيغة التي ذكرها الدرس لدعاء الافتتاح عن أبي هريرة رضي الله عنه؟","options":["«اللهم باعد بيني وبين خطاياي كما باعدت بين المشرق والمغرب...»","«سبحان ربي الأعلى»","«اللهم اغفر لي وارحمني واجبرني»","«ربنا لك الحمد ملء السماوات»"],"answer":0,"why":"رُوي عن أبي هريرة: كان رسول الله ﷺ إذا كبّر في الصلاة سكت هُنيّة قبل أن يقرأ، فسأله عن سكوته بين التكبير والقراءة فقال: «أقول: اللهم باعد بيني وبين خطاياي كما باعدت بين المشرق والمغرب، اللهم نقني من الخطايا كما يُنقّى الثوب الأبيض من الدنس...».","ref":"ص 2-3"},{"q":"ماذا يقول المصلي بين السجدتين بحسب حديث ابن عباس رضي الله عنهما؟","options":["«سبحان ربي العظيم وبحمده»","«ربنا لك الحمد»","«سمع الله لمن حمده»","«اللهم اغفر لي، وارحمني، واجبرني، واهدني، وارزقني»"],"answer":3,"why":"ويقول ما روى ابن عباس رضي الله عنهما أن النبي ﷺ كان يقول بين السجدتين: «اللهم اغفر لي، وارحمني، واجبرني، واهدني، وارزقني».","ref":"ص 4"},{"q":"ما أسباب سجود السهو الخمسة التي ذكرها الدرس؟","options":["السفر والمرض والخوف والنوم والنسيان","تأخير الصلاة عن وقتها وتركها وتعجيلها","نسيان ركن، وترك بعض من الأبعاض، والشك في عدد الركعات، وارتكاب فعل منهي عنه سهوًا يبطل عمده الصلاة، ونقل شيء من أفعال الصلاة إلى غير موضعه","الجهر في موضع الإسرار فقط"],"answer":2,"why":"أسباب سجود السهو: (1) نسيان ركن من أركان الصلاة، (2) أن يترك المصلي بعضًا من أبعاض الصلاة، (3) الشك في عدد ما أتى به من الركعات، (4) ارتكاب فعل منهي عنه سهوًا إذا كان يبطل عمده الصلاة، (5) نقل شيء من أفعال الصلاة ركنًا كان أو بعضًا أو سورة نقلها إلى غير موضعه.","ref":"ص 6-7"},{"q":"ماذا يفعل المصلي إذا شك هل صلّى ثلاثًا أم أربعًا بحسب الحديث الذي ذكره الدرس؟","options":["يترك الصلاة ويعيدها من الأول","يطرح الشك ويبني على ما استيقن، ثم يسجد سجدتين قبل أن يسلم","يبني على الأكثر ويسلّم فورًا","لا شيء عليه"],"answer":1,"why":"عن أبي سعيد الخدري أن النبي ﷺ قال: «إذا شك أحدكم في صلاته فلم يدر كم صلّى؟ ثلاثًا أم أربعًا؟ فليطرح الشك وليبنِ على ما استيقن، ثم يسجد سجدتين قبل أن يسلّم».","ref":"ص 7"},{"q":"ماذا يلزم المأموم من سجود السهو إذا سها وهو مقتدٍ بالإمام؟","options":["يحمله الإمام، ولا يلزمه سجود السهو بعد سلام الإمام؛ لقوله ﷺ: «الإمام ضامن»","يلزمه أن يسجد وحده بعد التسليم","يعيد الصلاة كاملة","يقطع الصلاة"],"answer":0,"why":"وسهو المأموم حال اقتدائه بالإمام يحمله الإمام، ولا يلزم المأموم سجود السهو بعد سلام الإمام؛ لقوله ﷺ: «الإمام ضامن» (أخرجه الترمذي).","ref":"ص 7"},{"q":"ماذا يقول المصلي في الركوع، وكم مرة يُسنّ ذلك؟","options":["«سبحان ربي الأعلى» مرة واحدة فقط","«سمع الله لمن حمده» ثلاثًا","لا يُسنّ فيه ذكر","«سبحان ربي العظيم وبحمده»، وتتحقق السنة بواحدة لكن الأفضل ثلاث وذلك أدنى الكمال"],"answer":3,"why":"ويسنّ في الركوع مدّ الظهر والعنق، ويقول في الركوع «سبحان ربي العظيم وبحمده»، وتتحقق السنة بواحدة، لكن الأفضل قولها ثلاثًا وذلك أدنى الكمال.","ref":"ص 3"}],"9":[{"q":"ما الأمور التي ذكرها الدرس من مبطلات الصلاة بسبب فقد شرط من شروط صحتها مع القدرة عليه؟","options":["الابتسام والتثاؤب","الانحراف عن القبلة، والحدث قبل التسليمة الأولى، وانكشاف العورة أو شيء منها","الالتفات بلمح العين","رفع اليدين عند الركوع"],"answer":1,"why":"من مبطلات الصلاة: فقد شرط من شروط صحتها مع القدرة عليه، فيبطلها مثل: الانحراف عن القبلة، والحدث قبل التسليمة الأولى، وانكشاف العورة أو شيء منها.","ref":"ص 2"},{"q":"ما حكم الصلاة إذا أحدث المصلي بعد التسليمة الأولى وقبل الثانية؟","options":["صلاته صحيحة وقد تمّت","صلاته باطلة وتجب إعادتها","تبطل بمجرد الحدث","عليه سجود السهو فقط"],"answer":0,"why":"الحدث قبل التسليمة الأولى لا فرق فيه بين أن يكون عمدًا أو سهوًا؛ لفقدان شرط الطهارة قبل تمام أركانها، أما إن أحدث بعد التسليمة الأولى وقبل الثانية فقد تمت صلاته صحيحة.","ref":"ص 3"},{"q":"ما ضابط تغيّر النية المبطل للصلاة؟","options":["أن يفكر في أمور الدنيا أثناء الصلاة","أن ينسى ما قرأه","أن يتثاءب في الصلاة","أن يعزم على الخروج من الصلاة أو يعلّق خروجه منها على أمر كمجيء شخص ونحوه، فتبطل بمجرد طروء هذا القصد"],"answer":3,"why":"تغيّر النية: أن يعزم على الخروج من الصلاة، أو يعلّق خروجه منها على أمر كمجيء شخص ونحوه، فإن صلاته تبطل بمجرد طروء هذا القصد عليه؛ لأن الصلاة لا تصلح إلا بنية جازمة، وهذا العزم يتنافى مع النية الجازمة.","ref":"ص 3"},{"q":"ما حكم قطع الصلاة المكتوبة بعد الدخول فيها؟","options":["يجوز قطعها لأي سبب","يجب قطعها إذا طلب أحدهم","يحرم قطعها إلا لضرورة كإنقاذ حياة طفل أو تجنب ضرر شديد كنشوب حريق","يكره فقط"],"answer":2,"why":"ويحرم على المصلي إذا دخل في الصلاة المكتوبة قطعها إلا لضرورة؛ كإنقاذ حياة طفل، أو تجنب حصول ضرر شديد كنشوب حريق، ويجوز قطع النافلة إجابةً لأحد الوالدين إن لم يعلم أنه في صلاة وكان يشق عليه عدم الإجابة.","ref":"ص 3"},{"q":"ما أقل ما يبطل الصلاة من الكلام العمد، وما الذي لا يبطلها؟","options":["كلمة واحدة طويلة فقط ويبطلها الذكر","أقله حرفان أو حرف مفهِم، ولا تبطل بكلام الله تعالى أو الذكر أو الدعاء","جملة كاملة ولا يبطلها الدعاء","لا يبطلها أي كلام"],"answer":1,"why":"الكلام العمد: ويقصد به ما عدا القرآن والذكر والدعاء، أو الذي يخاطب به البشر، وأقله حرفان أو حرف مفهِم، أما كلام الله تعالى أو الذكر أو الدعاء فلا تبطل به الصلاة.","ref":"ص 3"},{"q":"ما ضابط الكثرة في الفعل الكثير المبطل للصلاة؟","options":["ثلاث حركات فصاعدًا، بشرط أن تتوالى؛ وضابط الموالاة أن تُعدّ الأعمال متتابعة بالعرف","حركة واحدة فقط","عشر حركات متفرقة","لا ضابط له"],"answer":0,"why":"الفعل الكثير: المقصود به الفعل المخالف لأفعال الصلاة بشرط أن يكثر ويتوالى؛ لأنه يتنافى مع نظام الصلاة، وضابط الكثرة ثلاث حركات فصاعدًا، وضابط الموالاة أن تُعدّ الأعمال متتابعة بالعرف.","ref":"ص 4"},{"q":"ما حكم الأكل والشرب في الصلاة بحسب الدرس؟","options":["لا يبطلان بحال","يبطلان القليل والكثير ولو كان ناسيًا","يبطلان إن كانا في السجود فقط","الكثيران يبطلان ولو من الناسي أو المعذور، والقليلان لا يبطلان إن فعلهما ناسيًا أو جاهلًا"],"answer":3,"why":"الأكل والشرب الكثيران يبطلان الصلاة ولو كان الفاعل ناسيًا أو معذورًا، أما العامد فتبطل صلاته، والأكل والشرب القليلان لا يبطلان إن فعلهما ناسيًا أو جاهلًا بإبطاله الصلاة.","ref":"ص 4"},{"q":"ما تعريف المكروه في الصلاة بحسب الدرس؟","options":["كل ما يبطل الصلاة","كل ما يُعاقب عليه فاعله","كل ما يُثاب المصلي على تركه امتثالًا ولا يُعاقب فاعله","كل ما يجب فعله"],"answer":2,"why":"مكروهات الصلاة: وهي كل ما يُثاب المصلي على تركه امتثالًا، ولا يُعاقب فاعله.","ref":"ص 4"},{"q":"ما الحديث الذي استدل به الدرس على كراهة الصلاة مع مدافعة الأخبثين أو بحضرة الطعام؟","options":["قوله ﷺ: «الصلاة عماد الدين»","قول النبي ﷺ: «لا صلاة بحضرة الطعام، ولا هو يدافعه الأخبثان»","قوله ﷺ: «صلوا كما رأيتموني أصلي»","قوله ﷺ: «أرحنا بها يا بلال»"],"answer":1,"why":"من المكروهات: الصلاة حاقنًا أو حاقبًا أو حازقًا، بل تحرم إن ضرّته المدافعة؛ لحديث عائشة رضي الله عنها: «لا صلاة بحضرة الطعام ولا هو يدافعه الأخبثان» (أخرجه مسلم).","ref":"ص 5"},{"q":"ماذا تفعل المرأة إذا نابها شيء أثناء الصلاة وأرادت أن تنبّه أحدًا، وبماذا يختلف الرجل؟","options":["تصفّق بأن تضرب يدها اليمنى على ظهر كف اليسرى، أما الرجل فيسبّح بصوت مرتفع","تسبّح بصوت مرتفع كالرجل","تقطع صلاتها","تتكلم بصوت منخفض"],"answer":0,"why":"إذا نابت المرأة شيء أثناء الصلاة وأرادت أن تنبّه أحدًا لأمر ما فإنها تصفّق بأن تضرب يدها اليمنى على ظهر كف اليسرى، أما الرجل فيسنّ إذا نابه شيء في الصلاة أن يسبّح بصوت مرتفع.","ref":"ص 7"}],"10":[{"q":"ما الموضوعات الأربعة التي يتناولها الدرس العاشر؟","options":["صلاة الاستسقاء، والكسوف، والجنازة، والتراويح","صلاة الجمعة، والجنازة، والضحى، والتراويح","صلاة الجمعة، وصلاة العيدين، وصلاة الوتر، والسنن الرواتب","صلاة الجمعة، والعيدين، والاستخارة، والتهجد"],"answer":2,"why":"موضوعات الدرس: 1- صلاة الجمعة، 2- صلاة العيدين، 3- صلاة الوتر، 4- السنن الرواتب.","ref":"ص 2"},{"q":"على من تجب صلاة الجمعة وجوب عين؟","options":["على كل مسلم حتى المسافر والمريض","على كل مسلم بالغ عاقل حر صحيح مقيم","على كل رجل وامرأة دون شروط","على الرجال دون النساء والأطفال فقط"],"answer":1,"why":"الجمعة فرض عين على كل مسلم بالغ عاقل حر صحيح مقيم؛ لحديث النبي ﷺ: «الجمعة حق واجب على كل مسلم في جماعة إلا أربعة: عبد مملوك، أو امرأة، أو صبي، أو مريض» (أخرجه أبو داود).","ref":"ص 2"},{"q":"من هم الأربعة الذين تُستثنى منهم الجمعة بحسب الحديث؟","options":["عبد مملوك، أو امرأة، أو صبي، أو مريض","مسافر، أو مريض، أو شيخ، أو طالب","عبد، أو امرأة، أو صبي، أو أعمى","امرأة، أو مسافر، أو فقير، أو مجنون"],"answer":0,"why":"قال النبي ﷺ: «الجمعة حق واجب على كل مسلم في جماعة إلا أربعة: عبد مملوك، أو امرأة، أو صبي، أو مريض».","ref":"ص 2"},{"q":"ما الآية التي ورد فيها الأمر بالسعي إلى الجمعة؟","options":["﴿وأقم الصلاة طرفي النهار﴾","﴿إن الصلاة كانت على المؤمنين كتابًا موقوتًا﴾","﴿وأقيموا الصلاة وآتوا الزكاة﴾","﴿يا أيها الذين آمنوا إذا نودي للصلاة من يوم الجمعة فاسعوا إلى ذكر الله وذروا البيع﴾"],"answer":3,"why":"من أدلة وجوب الجمعة قوله تعالى: ﴿يا أيها الذين آمنوا إذا نودي للصلاة من يوم الجمعة فاسعوا إلى ذكر الله وذروا البيع ذلكم خير لكم إن كنتم تعلمون﴾ [الجمعة: 9].","ref":"ص 2"},{"q":"ما الذي يُشترط لصحة صلاة الجمعة زيادةً على شروط صحة الصلاة؟","options":["أن تُقام في الصحراء بين الخيام","أن تُصلَّى فرادى","أن تُقام في أبنية مجتمعة، وفي وقت الظهر، وفي جماعة، وألّا تتعدد الجمعة في البلد بغير حاجة، وخطبتان قبل الصلاة","أن تُقام بعد العصر"],"answer":2,"why":"من الشروط الزائدة: الإقامة في أبنية مجتمعة، ووقت الظهر، والجماعة، وعدم تعدد الجمع في البلد الواحد بغير حاجة، وخطبتان قبل الصلاة يُجلس بينهما.","ref":"ص 3"},{"q":"ماذا يفعل من فاته وقت الجمعة؟","options":["تُقضى جمعة في المسجد","لا تُقضى جمعة، بل يصليها ظهرًا","تسقط عنه ولا يصلي شيئًا","يصليها بعد العصر جمعة"],"answer":1,"why":"لا تُقضى صلاة الجمعة إن فات وقتها، ولو ضاق الوقت صُلّيت ظهرًا.","ref":"ص 3"},{"q":"ما كيفية خطبة الجمعة كما ورد في حديث جابر بن سمرة؟","options":["كان النبي ﷺ يخطب قائمًا ثم يجلس ثم يقوم فيخطب قائمًا","كان يخطب جالسًا كل الخطبة","كان يخطب خطبة واحدة طويلة","كان يخطب بعد الصلاة"],"answer":0,"why":"عن جابر بن سمرة: «أن رسول الله ﷺ كان يخطب قائمًا ثم يجلس ثم يقوم فيخطب قائمًا» (أخرجه أبو داود).","ref":"ص 3"},{"q":"ما فضل قراءة سورة الكهف يوم الجمعة؟","options":["غفر الله له ما تقدم من ذنبه","كُتب له أجر حجة","فُتحت له أبواب الجنة الثمانية","أضاء له من النور ما بين الجمعتين"],"answer":3,"why":"قال النبي ﷺ: «من قرأ الكهف في يوم الجمعة أضاء له من النور ما بين الجمعتين» (أخرجه الحاكم).","ref":"ص 3"},{"q":"ما حكم صلاة العيدين وما دليل ذلك بحسب الدرس؟","options":["فرض عين على كل مسلم","مستحبة غير مؤكدة","سنة مؤكدة؛ لأن النبي ﷺ لم يتركها منذ شُرعت حتى توفاه الله","فرض كفاية فقط"],"answer":2,"why":"صلاة العيد سنة مؤكدة؛ لأنه ﷺ لم يتركها منذ شُرعت حتى توفاه الله عز وجل، وواظب عليها أصحابه من بعده، وتُشرع جماعة وتصح فرادى.","ref":"ص 5"},{"q":"من الذي يُشرع له شهود صلاة العيد من النساء بحسب حديث أم عطية؟","options":["العجائز فقط","كل النساء حتى البكر من خدرها والحيّض، يعتزلن المصلى ويشهدن الخير ودعوة المسلمين","المتزوجات فقط","المسافرات فقط"],"answer":1,"why":"قالت أم عطية: كنا نؤمر أن نخرج يوم العيد حتى نخرج البكر من خدرها، حتى نخرج الحيّض فيكنّ خلف الناس فيكبّرن بتكبيرهم ويدعون بدعائهم، يرجون بركة ذلك اليوم وطُهرته.","ref":"ص 5"},{"q":"متى يبدأ وقت صلاة العيد ومتى ينتهي؟","options":["يبدأ بطلوع الشمس ويستمر إلى زوالها","يبدأ بعد الفجر ويستمر إلى الظهر","يبدأ بعد الظهر ويستمر إلى العصر","يبدأ عند الضحى ولا ينتهي"],"answer":0,"why":"يبدأ وقت صلاة العيد بطلوع الشمس ويستمر إلى زوالها، ووقتها المفضل عند ارتفاع الشمس قدر رمح.","ref":"ص 5"},{"q":"كم تكبيرة يكبّرها المصلي في الركعة الأولى والثانية من صلاة العيد بحسب الدرس؟","options":["ثلاثًا في كل ركعة","خمسًا في الأولى وسبعًا في الثانية","اثنتين في كل ركعة","سبعًا في الأولى بعد تكبيرة الإحرام والدعاء، وخمسًا في الثانية قبل القراءة"],"answer":3,"why":"صلاة العيد ركعتان، يبدؤهما بتكبيرة الإحرام ثم دعاء الافتتاح ثم سبع تكبيرات، وفي الثانية خمس تكبيرات عدا تكبيرة الانتقال قبل أن يبدأ القراءة؛ فعن عمرو بن عوف المزني: كبّر في العيدين في الأولى سبعًا قبل القراءة وفي الآخرة خمسًا.","ref":"ص 5"},{"q":"ماذا يُسنّ فعله لمن يذهب إلى صلاة العيد في الطريق؟","options":["أن يذهب راكبًا ويعود بنفس الطريق","أن يذهب مسرعًا بلا ذكر","أن يذهب ماشيًا من طريق ويعود من طريق أخرى","أن يبقى في المصلى حتى الظهر"],"answer":2,"why":"من سنن صلاة العيد: أن يذهب ماشيًا إلى المصلى أو المسجد من طريق، وأن يعود من طريق أخرى؛ فعن جابر: كان النبي ﷺ إذا كان يوم عيد خالف الطريق.","ref":"ص 6"},{"q":"ما أقل الوتر وأكثره؟","options":["أقله ثلاث ركعات، وأكثره سبع","أقله ركعة واحدة، وأكثره إحدى عشرة ركعة","أقله ركعتان، وأكثره عشر","أقله ركعة، وأكثره ثلاث عشرة ركعة"],"answer":1,"why":"أقل الوتر واحدة، وأكثره إحدى عشرة ركعة؛ فعن عائشة: ما كان رسول الله ﷺ يزيد في رمضان ولا في غيره على إحدى عشرة ركعة.","ref":"ص 6"},{"q":"متى يبدأ وقت الوتر ومتى ينتهي، وما أفضل وقته؟","options":["من بعد صلاة العشاء إلى طلوع الفجر، وأفضله آخر الليل","من الظهر إلى المغرب، وأفضله بعد العصر","من منتصف الليل إلى الضحى","من المغرب إلى منتصف الليل فقط"],"answer":0,"why":"وقت الوتر من بعد صلاة العشاء إلى طلوع الفجر، وأفضل وقتها آخر الليل، فإن خاف ألا يستيقظ استُحب له أن يوتر بعد العشاء وسنتها.","ref":"ص 6"},{"q":"بماذا يُستحب أن يقرأ بعد الفاتحة من أوتر بثلاث؟","options":["في الأولى «الإخلاص»، وفي الثانية «الفلق»، وفي الثالثة «الناس»","في الأولى «الكافرون»، وفي الثانية «الأعلى»، وفي الثالثة «الإخلاص»","يقرأ سورة البقرة كاملة","في الأولى «سبح اسم ربك الأعلى»، وفي الثانية «الكافرون»، وفي الثالثة «الإخلاص» والمعوذتين"],"answer":3,"why":"يُستحب لمن أوتر بثلاث أن يقرأ بعد الفاتحة: في الأولى بسورة الأعلى، وفي الثانية بسورة الكافرون، وفي الثالثة بسورة الإخلاص والمعوذتين.","ref":"ص 7"},{"q":"كم عدد السنن الرواتب المؤكدة وما هي؟","options":["ست ركعات فقط","ثماني ركعات","عشر ركعات: ركعتان قبل الفجر، وركعتان قبل الظهر وركعتان بعده، وركعتان بعد المغرب، وركعتان بعد العشاء","اثنتا عشرة ركعة كلها مؤكدة"],"answer":2,"why":"السنن الرواتب هي السنن التابعة للفرائض، ومنها سنن مؤكدة وهي عشر ركعات: ركعتان قبل الفجر، وركعتان قبل الظهر وركعتان بعده، وركعتان بعد المغرب، وركعتان بعد العشاء.","ref":"ص 7-8"},{"q":"ما فضل ركعتي الفجر كما ورد في الحديث؟","options":["«من صلاهما غُفر له ما تقدم من ذنبه»","«ركعتا الفجر خير من الدنيا وما فيها»","«من صلاهما بُني له بيت في الجنة»","«من صلاهما حرّمه الله على النار»"],"answer":1,"why":"عن عائشة رضي الله عنها أن النبي ﷺ قال: «ركعتا الفجر خير من الدنيا وما فيها» (أخرجه مسلم).","ref":"ص 7"},{"q":"ما ثواب من صلى اثنتي عشرة ركعة تطوعًا غير الفريضة كل يوم، بحسب حديث أم حبيبة؟","options":["«بنى الله له بيتًا في الجنة»","«غفر الله له ما تقدم من ذنبه»","«كُتب له أجر قيام ليلة»","«دخل الجنة من أي أبوابها شاء»"],"answer":0,"why":"عن أم حبيبة: «ما من عبد مسلم يصلي لله كل يوم ثنتي عشرة ركعة تطوعًا غير فريضة إلا بنى الله له بيتًا في الجنة».","ref":"ص 8"},{"q":"ماذا يفعل المسلم إذا فاتته سنة راتبة؟","options":["تسقط عنه ولا يقضيها","يقضيها بعد شهر","يتصدق بدلًا عنها","يُستحب له قضاؤها"],"answer":3,"why":"لو فات وقت صلاة منها يُستحب قضاؤها؛ لحديث أنس: «من نسي صلاة فليصلّها إذا ذكرها»، ولأنه ﷺ فعل ذلك، فقضى ركعتي سنة الظهر البعدية بعد العصر.","ref":"ص 8-9"}],"11":[{"q":"ما معنى الزكاة في اللغة؟","options":["الحفظ والادخار","الجمع والتخزين","العطاء والسخاء","الطهارة والنماء"],"answer":3,"why":"الزكاة لغةً: الطهارة والنماء، قال تعالى: ﴿قد أفلح من زكاها﴾، وسُمّيت بذلك لأنها مما يُرجى بها زيادة المال ونماؤه، وطهارة للمزكّي من الذنوب.","ref":"ص 2"},{"q":"ما حكم الزكاة؟","options":["سنة مؤكدة","فرض كفاية","ركن من أركان الإسلام، وأدلتها قطعية، ويكفر جاحدها","مستحبة لمن كان غنيًّا"],"answer":2,"why":"الزكاة ركن من أركان الإسلام، وأدلتها قطعية الثبوت والدلالة؛ فهي من المعروف من الدين بالضرورة، بحيث يكفر جاحدها، والأمر بها مكرر في القرآن في اثنين وثلاثين موضعًا.","ref":"ص 3"},{"q":"كم موضعًا تكرر فيه الأمر بالزكاة في القرآن بحسب الدرس؟","options":["عشرة مواضع","اثنين وثلاثين موضعًا","خمسة عشر موضعًا","ستين موضعًا"],"answer":1,"why":"الأمر بالزكاة مكرر في القرآن في اثنين وثلاثين موضعًا.","ref":"ص 3"},{"q":"أيٌّ مما يلي من فوائد الزكاة للمعطي بحسب الدرس؟","options":["أنها تعوّده الكرم والبذل وتقتلع من نفسه جذور الشح والبخل","أنها تُنقص ماله وتزيد تعبه","أنها تعفيه من الصلاة","أنها تضمن له عدم الحاجة أبدًا"],"answer":0,"why":"من فوائد الزكاة: أنها تعوّد المعطي الكرم والبذل وتقتلع من نفسه جذور الشح وعوامل البخل وتكفّ تطلّع الناس إليه، إضافةً إلى الثواب العظيم.","ref":"ص 3"},{"q":"ما الأصناف الخمسة من الأموال التي تجب فيها الزكاة؟","options":["الأراضي والبيوت والسيارات والأثاث والمجوهرات","الذهب والفضة والحديد والنحاس والياقوت","الأسهم والسندات والأموال المحجوزة والأوقاف والخيول","النقدان، والمعدن والركاز، وعروض التجارة، والزروع والثمار، والأنعام الأهلية السائمة"],"answer":3,"why":"الأموال التي تجب فيها الزكاة خمسة أصناف: النقدان (ولو غير مضروبين) وما يحل محلهما من الأوراق النقدية، والمعدن والركاز، وعروض التجارة، والزروع والثمار، والأنعام الأهلية السائمة.","ref":"ص 4"},{"q":"ما معنى «النصاب» في الزكاة؟","options":["مقدار المال الواجب إخراجه","جميع المال المملوك","المقدار الذي إذا بلغه المال أو زاد عنه وجبت فيه الزكاة","مقدار الحاجة الأصلية للمزكّي"],"answer":2,"why":"النصاب هو المقدار الذي إذا بلغه المال أو زاد عنه وجبت فيه الزكاة، وسُمّي نصابًا لأن الشرع نصبه علامةً على الغنى، ويختلف مقداره بحسب نوع المال المزكّى.","ref":"ص 4"},{"q":"ما الشرط الذي يُستثنى منه الزروع والثمار والدفائن في وجوب الزكاة؟","options":["الإسلام؛ فلا يشترط فيها","مرور حول قمري كامل؛ فتجب فيها الزكاة فور تحصيلها","الحرية؛ فلا تُشترط فيها","ملك النصاب؛ فلا يُشترط فيها"],"answer":1,"why":"يُشترط مرور حول قمري كامل على ملكية النصاب إلا في الزروع والثمار والدفائن حيث تجب الزكاة فيها فور تحصيلها.","ref":"ص 4"},{"q":"ما نصاب الذهب بحسب الدرس؟","options":["عشرون دينارًا، أي ما يعادل 85 غرامًا من الذهب الصافي (عيار 24)","أربعون غرامًا","ستون غرامًا","مئة غرام"],"answer":0,"why":"لا زكاة في الذهب حتى يبلغ قدره عشرين دينارًا، أي ما يعادل (85) غرامًا ذهبًا صافيًا (عيار 24).","ref":"ص 5"},{"q":"ما نصاب الفضة بحسب الدرس؟","options":["خمسون درهمًا","مئة درهم","ألف درهم","مئتا درهم، أي ما يعادل 595 غرامًا من الفضة الصافية"],"answer":3,"why":"لا زكاة في الفضة حتى تبلغ (200) درهم، أي ما يعادل (595) غرامًا فضة صافية (عيار 999).","ref":"ص 5"},{"q":"ما القدر الواجب إخراجه من النقدين بعد حولان الحول؟","options":["العشر","نصف العشر","ربع العشر، أي اثنان ونصف في المئة","الخمس"],"answer":2,"why":"القدر الواجب إخراجه في النقدين بعد حولان الحول عليهما في ملك صاحبهما: ربع العشر، أي نسبة اثنين ونصف في المئة.","ref":"ص 5"},{"q":"في أي الحُلي تجب الزكاة؟","options":["في كل أنواع الحُلي","في حلي الذهب والفضة فقط، دون الماس واللؤلؤ والياقوت","في اللؤلؤ والياقوت فقط","في الحُلي كلها إلا الذهب"],"answer":1,"why":"تجب الزكاة في الحلي من الذهب والفضة فقط، ولا زكاة في غيرها كالماس واللؤلؤ والياقوت.","ref":"ص 5"},{"q":"ما أنواع الأنعام التي تجب فيها الزكاة؟","options":["الإبل والبقر والغنم، ويُلحق بها المعز","الخيل والبغال والحمير","الإبل والخيل والغنم","الدجاج والأرانب والغنم"],"answer":0,"why":"الأنعام هي: الإبل والبقر والغنم، ويُلحق بها المعز، وقد ذكر أبو بكر رضي الله عنه في كتابه إلى البحرين فريضة الصدقة وبيّن أنصبتها.","ref":"ص 6"},{"q":"كم أول نصاب الإبل وما الواجب فيه؟","options":["عشر إبل، والواجب فيها شاتان","ثلاث إبل، والواجب فيها شاة","خمس عشرة إبل، والواجب فيها ثلاث شياه","خمس إبل، والواجب فيها شاة واحدة"],"answer":3,"why":"أول نصاب الإبل أن تبلغ خمسة رؤوس، فلا زكاة فيما دون ذلك، ومن 5 إلى 9 من الإبل شاة واحدة.","ref":"ص 6"},{"q":"كم أول نصاب البقر وما الواجب فيه؟","options":["عشرون رأسًا، والواجب فيها شاة","أربعون رأسًا، والواجب فيها مسنّة","ثلاثون رأسًا، والواجب فيها تبيع (له سنة)","خمسون رأسًا، والواجب فيها تبيعان"],"answer":2,"why":"أول نصاب البقر أن تبلغ ثلاثين رأسًا، ومن 30 إلى 39 من البقر: تبيع (وهو ما له سنة من البقر)، ومن 40 إلى 59: مسنّة (ما لها سنتان).","ref":"ص 7"},{"q":"كم أول نصاب الغنم وما الواجب فيه؟","options":["عشرون رأسًا، والواجب فيها شاة","أربعون رأسًا، والواجب فيها شاة واحدة","ستون رأسًا، والواجب فيها شاتان","ثلاثون رأسًا، والواجب فيها شاة واحدة"],"answer":1,"why":"أول نصاب الغنم أن تبلغ أربعين رأسًا، فإذا بلغتها وجب فيها واحدة منها (ذات عام إن كانت ضأنًا وعامين إن كانت معزًا)، من 40 إلى 120 شاة واحدة.","ref":"ص 8"},{"q":"ما معنى «السائمة» في شروط زكاة الأنعام؟","options":["التي ترعى الكلأ المباح أكثر السنة بحيث لا تتوقف حياتها وصحتها على أكثر من ذلك","التي تُعلَف في البيت طوال العام","التي تُستخدم للحراثة","التي تُباع في السوق"],"answer":0,"why":"من الشروط الخاصة لوجوب الزكاة في الأنعام: أن تكون سائمة، أي ترعى الكلأ المباح (غير المملوك) أكثر السنة، وأن تُتخذ للدر أو النسل أو التسمين لا للعمل.","ref":"ص 8-9"},{"q":"ما نصاب الزروع والثمار؟","options":["عشرة أوسق","وسق واحد","عشرون وسقًا","خمسة أوسق"],"answer":3,"why":"نصاب الزروع والثمار: خمسة أوسق كيلًا، لقوله ﷺ: «ليس فيما دون خمسة أوسق صدقة»، والوسق ما يعادل ستين صاعًا، والصاع أربعة أمداد.","ref":"ص 9"},{"q":"ما القدر الواجب في الزرع الذي يُسقى بماء المطر أو الأنهار بلا كلفة؟","options":["نصف العُشر","ربع العُشر","العُشر","الخُمس"],"answer":2,"why":"إذا كان الزرع أو الثمر يُسقى بماء المطر أو بماء الأنهار دون الحاجة إلى بذل كلفة أو نفقة وجب فيه العُشر، وإن كان يُسقى بالنواضح أو المحركات مما يسبب كلفة فزكاته نصف العُشر.","ref":"ص 9-10"},{"q":"ما الشرطان لوجوب الزكاة في عروض التجارة؟","options":["أن يكون من الذهب والفضة، وأن يُباع في السوق","أن يملكه بعقد فيه عوض، وأن ينوي عند تملّكه المتاجرة به وتستمر النية","أن يملكه بميراث، وأن يتجر به سنتين","أن يكون في صورة نقود، وأن يتجاوز نصف مليون"],"answer":1,"why":"تجب الزكاة في عروض التجارة بشرطين: أن يملكه بعقد فيه عوض كالبيع والإجارة والمهر، وأن ينوي عند تملّكه المتاجرة به وتستمر هذه النية.","ref":"ص 10"},{"q":"كم الواجب في الركاز؟","options":["الخُمس فور وجوده، ولا يشترط له حولان الحول","ربع العُشر بعد سنة","العُشر بعد سنة","نصف العُشر فور وجوده"],"answer":0,"why":"الركاز هو دفائن الجاهلية المعثور عليها في عصر الإسلام، وعليه علامة الكفار، ونصابه نصاب النقدين، ولا يُشترط لزكاته حولان الحول، بل يجب فيه الخُمس فور وجوده؛ لحديث: «وفي الركاز الخمس».","ref":"ص 10-11"},{"q":"من هم الفقراء بحسب الدرس؟","options":["من له مال يكفيه سنة","من يملك أرضًا فقط","من عليه دين فقط","من لا مال له يقع موقعًا من كفايته، كمن يحتاج إلى عشرة فلا يقدر إلا على ثلاثة"],"answer":3,"why":"الفقراء جمع فقير، وهو: من لا مال له يقع موقعًا من كفايته، كمن يحتاج إلى عشرة فلا يقدر إلا على ثلاثة. أما المساكين فهم من له شيء يسدّ مسدًّا من حاجته ولكنه لا يكفيه.","ref":"ص 11"},{"q":"كم عدد الأصناف المستحقين للزكاة بحسب آية التوبة؟","options":["خمسة أصناف","سبعة أصناف","ثمانية أصناف","عشرة أصناف"],"answer":2,"why":"ذكر الله تعالى المستحقين الذين تُصرف إليهم الزكاة في قوله: ﴿إنما الصدقات للفقراء والمساكين والعاملين عليها والمؤلفة قلوبهم وفي الرقاب والغارمين وفي سبيل الله وابن السبيل﴾، وهي ثمانية أصناف.","ref":"ص 11"},{"q":"ما هي زكاة الفطر وما حكمتها؟","options":["صدقة تطوع في العيد فقط","زكاة واجبة بالفطر من رمضان، شُرعت طُهرةً للصائم من اللغو والرفث وطُعمةً للمساكين","زكاة المال التي تجب بعد الحول","صدقة تُعطى للأقارب فقط"],"answer":1,"why":"زكاة الفطر زكاة واجبة بالفطر من رمضان، وهي زكاة للبدن، شُرعت جبرًا للخلل الواقع في الصوم؛ فعن ابن عباس: فرض رسول الله ﷺ زكاة الفطر طُهرةً للصائم من اللغو والرفث، وطُعمةً للمساكين.","ref":"ص 12-13"},{"q":"ما مقدار زكاة الفطر ومتى يبدأ وقت وجوبها؟","options":["صاع من غالب قوت أهل البلد، ويبدأ وقت وجوبها بغروب شمس آخر يوم من رمضان","نصف صاع، ويبدأ وقت وجوبها منتصف رمضان","صاعان، ويبدأ وقت وجوبها أول رمضان","ربع العشر من المال، ويبدأ وقت وجوبها عند الحول"],"answer":0,"why":"مقدار الواجب فيها صاع من غالب قوت أهل البلد، ويبدأ وقت وجوبها بغروب شمس آخر أيام رمضان، ويجوز إخراجها في جميع شهر رمضان واليوم الأول من العيد.","ref":"ص 13"}],"12":[{"q":"ما تعريف الصيام؟","options":["الإمساك عن المفطرات من طلوع الفجر إلى غروب الشمس مع النية","الامتناع عن الكلام طوال النهار","ترك الطعام والشراب في أي وقت من اليوم","الإمساك عن الطعام فقط من الظهر إلى المغرب"],"answer":0,"why":"الصيام هو الإمساك عن المفطرات من طلوع الفجر إلى غروب الشمس مع النية، وكان مفروضًا على الأمم السابقة.","ref":"ص 3"},{"q":"ما الآية التي تدل على أن الصيام كان مفروضًا على الأمم السابقة؟","options":["﴿وأقيموا الصلاة وآتوا الزكاة﴾","﴿شهر رمضان الذي أُنزل فيه القرآن﴾","﴿وأتموا الصيام إلى الليل﴾","﴿يا أيها الذين آمنوا كُتب عليكم الصيام كما كُتب على الذين من قبلكم لعلكم تتقون﴾"],"answer":3,"why":"قال تعالى: ﴿يا أيها الذين آمنوا كتب عليكم الصيام كما كتب على الذين من قبلكم لعلكم تتقون﴾ [البقرة: 183].","ref":"ص 3"},{"q":"بماذا وصف النبي ﷺ الصيام حين طلب أبو أمامة الباهلي أن يأمره بأمر ينفعه الله به؟","options":["«عليك بالصدقة فإنها تطفئ الخطيئة»","«عليك بالحج فإنه يهدم ما قبله»","«عليك بالصوم فإنه لا مثل له»","«عليك بالجهاد فإنه ذروة الإسلام»"],"answer":2,"why":"عن أبي أمامة الباهلي رضي الله عنه قال: قلت: يا رسول الله، مرني بأمر ينفعني الله به، قال: «عليك بالصوم فإنه لا مثل له» (أخرجه أحمد).","ref":"ص 4"},{"q":"من الذي يشفعان للعبد يوم القيامة بحسب حديث عبد الله بن عمرو؟","options":["الصلاة والزكاة","الصيام والقرآن","الحج والعمرة","الصدقة والذكر"],"answer":1,"why":"قال النبي ﷺ: «الصيام والقرآن يشفعان للعبد يوم القيامة، يقول الصيام: رب منعته الطعام والشهوات بالنهار فشفّعني فيه، ويقول القرآن: رب منعته النوم بالليل فشفّعني فيه، فيشفعان».","ref":"ص 4"},{"q":"ما اسم الباب الذي في الجنة ولا يدخل منه إلا الصائمون؟","options":["باب الريّان","باب الصلاة","باب الصدقة","باب الجهاد"],"answer":0,"why":"عن سهل بن سعد رضي الله عنه: «إن في الجنة بابًا يقال له الريّان، يدخل منه الصائمون يوم القيامة لا يدخل منه أحد غيرهم» (متفق عليه).","ref":"ص 4"},{"q":"أيٌّ من الدعوات التالية من الدعوات المستجابات بحسب حديث أبي هريرة؟","options":["دعوة الغني، ودعوة المريض، ودعوة الطفل","دعوة الحاكم، ودعوة العالم، ودعوة الوالد","دعوة المتصدق، ودعوة الحاج، ودعوة المجاهد","دعوة الصائم، ودعوة المظلوم، ودعوة المسافر"],"answer":3,"why":"عن أبي هريرة: «ثلاث دعوات مستجابات: دعوة الصائم، ودعوة المظلوم، ودعوة المسافر» (أخرجه البيهقي).","ref":"ص 4"},{"q":"ما أنواع الصبر الثلاثة التي تجتمع في الصيام؟","options":["الصبر على الجوع، والعطش، والتعب","الصبر على الناس، والمال، والمرض","الصبر على الطاعة، والصبر عن المعصية، والصبر على أقدار الله تعالى","الصبر على الفقر، والغنى، والصحة"],"answer":2,"why":"من أسرار الصيام التربية على الصبر؛ حيث يجتمع في الصيام أنواع الصبر الثلاثة: الصبر على الطاعة، والصبر عن المعصية، والصبر على أقدار الله تعالى.","ref":"ص 5"},{"q":"ما حكم إفراد الجمعة بالصيام بلا يوم قبله أو بعده؟","options":["حرام","مكروه","مستحب","واجب"],"answer":1,"why":"من الصيام المكروه: إفراد الجمعة بالصيام بلا يوم قبله أو بعده، وصيام المريض والمسافر والحامل والمرضع إن خافوا مشقة شديدة.","ref":"ص 6"},{"q":"أي الأيام يحرم صيامها بحسب الدرس؟","options":["يوما العيد وأيام التشريق، وصيام المرأة تطوعًا وزوجها حاضر إلا بإذنه","الاثنين والخميس","يوم عرفة ويوم عاشوراء","الأيام البيض من كل شهر"],"answer":0,"why":"من الصيام الحرام: صيام يومي العيد، وأيام التشريق، وصيام المرأة تطوعًا وزوجها حاضر إلا بإذنه. أما الاثنين والخميس والأيام البيض وعاشوراء وعرفة فسنة.","ref":"ص 5-6"},{"q":"ما الأعذار المانعة من الصوم، والأعذار المبيحة للفطر؟","options":["المانعة: المرض والسفر؛ والمبيحة: الحيض والنفاس","المانعة: العمل الشاق؛ والمبيحة: الصداع الخفيف","المانعة: الحيض فقط؛ والمبيحة: كل ما يشق","المانعة: الحيض والنفاس والإغماء والجنون طوال النهار؛ والمبيحة: المرض والسفر الطويل والعجز عن الصيام"],"answer":3,"why":"يُشترط لوجوب الصيام الخلو عن الأعذار؛ فالمانعة: الحيض، والنفاس، والإغماء، والجنون طوال نهار الصيام، والمبيحة للفطر: المرض، والسفر الطويل، والعجز عن الصيام.","ref":"ص 6"},{"q":"ما ركنا الصوم؟","options":["النية، والسحور","الإفطار على التمر، والنية","النية، والإمساك عن المفطرات من الفجر إلى الغروب","الإمساك عن الكلام، والنية"],"answer":2,"why":"يتكون الصيام من ركنين أساسيين: النية، والإمساك عن المفطرات من الفجر إلى الغروب.","ref":"ص 6-7"},{"q":"ما الذي يُشترط في نية صيام رمضان؟","options":["النطق بها باللسان فقط","التبييت من الليل، والتعيين، والتكرار لكل يوم","نية واحدة للشهر كله","التلفظ بها قبل الإفطار"],"answer":1,"why":"إن كانت النية لصيام رمضان اشتُرط فيها التبييت (قصد الصيام من الليل)، والتعيين (أن ينوي صيام الغد عن رمضان)، والتكرار (النية لكل يوم قبل الفجر)، ولا تغني نية واحدة عن الشهر كله، ومحلها القلب ولا يُشترط التلفظ بها.","ref":"ص 6"},{"q":"أيٌّ مما يلي يُعدّ من المفطرات؟","options":["القيء المتعمَّد","قطرة العين","حقنة الوريد","القيء الذي غلب صاحبه"],"answer":0,"why":"من المفطرات: القيء المتعمَّد؛ لحديث أبي هريرة: «من ذرعه قيء وهو صائم فليس عليه قضاء، وإن استقاء فليقضِ». أما قطرة العين وحقنة الوريد فلا تفطر؛ لأن العين والوريد غير مفتوحين.","ref":"ص 7"},{"q":"ما حكم من أكل ظانًّا أن الفجر لم يطلع ثم تبيّن خطؤه؟","options":["صومه صحيح ولا شيء عليه","يتم صومه ولا قضاء عليه","يكفّر ولا يقضي","بطل صومه، وأمسك النهار حرمة للشهر، وقضى يومًا بدلًا عنه"],"answer":3,"why":"إذا باشر الصائم شيئًا من المفطرات ظانًّا أن الفجر لم يطلع بعد فتبيّن خطؤه بطل صومه، وأمسك النهار حرمة للشهر، وقضى يومًا بدلًا عنه.","ref":"ص 7"},{"q":"ما الأفضل أن يفطر عليه الصائم؟","options":["الماء فقط","اللبن فقط","رطب، فإن لم يجد فتمر، فإن لم يجد فماء","أي طعام يشتهيه"],"answer":2,"why":"عن أنس: كان النبي ﷺ يفطر قبل أن يصلي على رطبات، فإن لم يكن فعلى تمرات، فإن لم يكن حسا حسوات من ماء (أخرجه أبو داود).","ref":"ص 8"},{"q":"ما السنة في توقيت الفطر والسحور؟","options":["تأخير الفطر وتعجيل السحور","تعجيل الفطر وتأخير السحور","تعجيل الفطر والسحور معًا","تأخير الفطر والسحور معًا"],"answer":1,"why":"قال النبي ﷺ: «لا يزال الناس بخير ما عجّلوا الإفطار وأخّروا السحور» (أخرجه أحمد).","ref":"ص 8"},{"q":"ماذا يقول الصائم عند فطره من الأدعية الواردة؟","options":["«ذهب الظمأ، وابتلت العروق، وثبت الأجر إن شاء الله»","«اللهم لك صمت وبك آمنت فقط»","«الحمد لله الذي رزقني ولم أطلب»","«اللهم بارك لنا في رمضان»"],"answer":0,"why":"من سنن الصيام أن يقول عند فطره الأدعية الواردة مثل: «ذهب الظمأ، وابتلت العروق، وثبت الأجر إن شاء الله» (أخرجه أبو داود).","ref":"ص 8"},{"q":"ما أجر من فطّر صائمًا بحسب الحديث؟","options":["له نصف أجره","لا أجر له","له أجر الصائم كله دون أن يصوم","له مثل أجره، غير أنه لا ينقص من أجر الصائم شيئًا"],"answer":3,"why":"قال النبي ﷺ: «من فطّر صائمًا كان له مثل أجره، غير أنه لا ينقص من أجر الصائم شيئًا» (أخرجه الترمذي).","ref":"ص 9"},{"q":"ما حكم صيام الصغير غير المكلف بحسب الدرس؟","options":["يجب عليه كالكبير","يُمنع منه تمامًا","لا يلزمه، والمقصود في هذه المرحلة التعويد لا التكليف، ويُراعى طاقته دون قسوة","يُلزَم بإكمال الصيام ولو تعب"],"answer":2,"why":"الصغير غير مكلف، فلا يجوز تحميله فوق طاقته أو إلزامه بإكمال الصيام إن بلغ به التعب مبلغًا كبيرًا، وإنما المقصود التعويد لا التكليف، حتى لا يكره العبادة أو يلجأ إلى الكذب لتجنبها.","ref":"ص 9-10"},{"q":"ما أول الوسائل في غرس محبة الصيام في الأولاد بحسب الدرس؟","options":["المكافآت المادية","القدوة","التهديد بالعقاب","النوم طوال النهار"],"answer":1,"why":"القدوة هي أول الوسائل في غرس محبة الصيام والتشجيع عليه، فإذا رأى الأولاد والديهم يقبلون عليه برضا ومحبة وشوق أدركوا عظمة الصيام وتأثروا بسلوك والديهم أكثر من كلامهم ووعظهم.","ref":"ص 10"}],"13":[{"q":"ما المقصود بمكروهات الصيام بحسب الدرس؟","options":["ما يفسد الصوم ويوجب القضاء","ما خالف السنن المشروعة في الصيام والآداب المناسبة له","ما يبطل الصوم ويوجب الكفارة","ما يُباح للصائم عند الحاجة"],"answer":1,"why":"عرّفها الدرس بأنها ما خالف السنن المشروعة في الصيام والآداب المناسبة له.","ref":"ص 2"},{"q":"ما الحديث الذي استدل به الدرس على كراهة تأخير الإفطار؟","options":["«لا يزال الناس بخير ما عجّلوا الفطر»","«من صام رمضان إيمانًا واحتسابًا غُفر له»","«الصيام جُنّة»","«تسحّروا فإن في السحور بركة»"],"answer":0,"why":"رواه سهل بن سعد رضي الله عنه (متفق عليه).","ref":"ص 2"},{"q":"لماذا يُكره للصائم الترفّه بالمباحات كشمّ الأزهار وأنواع الطيب والاستحمام لغير حاجة؟","options":["لأنه يفطر الصائم","لأنه يؤدي إلى العطش","لأنه محرّم في كل الأحوال","لأن فيه من الترفه ما لا يناسب حكمة الصوم"],"answer":3,"why":"ذكر الدرس أن في ذلك من الترفه ما لا يناسب حكمة الصوم، وليقوى الصائم على التقوى ومخالفة الهوى.","ref":"ص 2"},{"q":"لماذا تُكره الحجامة والفصد للصائم؟","options":["لأنها تفطر مطلقًا","لأنها محرّمة","لأنها تُضعف الصائم وربما أحوجته إلى الإفطار","لأنها تُذهب الأجر"],"answer":2,"why":"ذكر الدرس أنها تضعف الصائم وربما أحوجته إلى الإفطار.","ref":"ص 2"},{"q":"ما حكم مضغ العلك الذي يتفتت ويُبتلع شيء من أجزائه أثناء الصوم؟","options":["مكروه فقط","حرام ويفطر فاعله","مباح","سنة"],"answer":1,"why":"ذكر الدرس أن مضغ العلك الذي ليس له طعم مكروه، أما إن كان مما يتفتت ويُبتلع شيء من أجزائه فمضغه حرام ويفطر فاعله.","ref":"ص 2"},{"q":"ما الحديث الذي ذُكر في كراهة السواك بعد الزوال للصائم؟","options":["«والذي نفسي بيده لخلوف فم الصائم أطيب عند الله تعالى من ريح المسك»","«لولا أن أشقّ على أمتي لأمرتهم بالسواك عند كل صلاة»","«السواك مطهرة للفم مرضاة للرب»","«الصيام لي وأنا أجزي به»"],"answer":0,"why":"ذكر الدرس أن السواك بعد الزوال يُكره لأنه يذهب رائحة الفم، واستدل بحديث أبي هريرة (متفق عليه).","ref":"ص 2"},{"q":"ما حكم المبالغة في المضمضة والاستنشاق للصائم؟","options":["مستحبة","واجبة","مباحة دون كراهة","مكروهة؛ مخافة وصول شيء إلى الحلق"],"answer":3,"why":"ذكر الدرس أنها تُكره مخافة وصول شيء إلى الحلق، وكذا المضمضة بعد الزوال في غير الوضوء ولغير حاجة لشبهها بالسواك.","ref":"ص 2"},{"q":"ماذا قال النبي ﷺ فيمن لم يدع قول الزور والعمل به؟","options":["«فصيامه باطل ويُقضى»","«فعليه كفارة الظهار»","«فليس لله حاجة في أن يدع طعامه وشرابه»","«فقد أفطر ولا شيء عليه»"],"answer":2,"why":"أخرجه البخاري عن أبي هريرة، وذُكر في الدرس في كراهة الغيبة والنميمة وقول الزور وكل كلام فاحش للصائم.","ref":"ص 2"},{"q":"ماذا يقول الصائم إذا سابّه أحد أو قاتله؟","options":["«سلام عليكم»","«إني امرؤ صائم»","«حسبي الله ونعم الوكيل»","«لا حول ولا قوة إلا بالله»"],"answer":1,"why":"ورد في الحديث: «فإن سابّه أحد أو قاتله فليقل: إني امرؤ صائم» (متفق عليه).","ref":"ص 3"},{"q":"ما حكم الوصال في الصوم بحسب الدرس؟","options":["من خواص النبي ﷺ، وحرام في حق غيره مع صحة صيامه","مستحب لكل الصائمين","مكروه فقط","واجب في رمضان"],"answer":0,"why":"ذكر الدرس أنه من خواص النبي ﷺ وأنه حرام في حق غيره مع صحة صيامه، لقوله ﷺ: «إني لست كهيئتكم، إني أبيت يطعمني ربي ويسقيني».","ref":"ص 3"},{"q":"ما حكم التقبيل للصائم بحسب الدرس؟","options":["مباح مطلقًا","حرام مطلقًا","سنة","مكروه إذا لم يحرّك الشهوة، حرام إذا حرّكها"],"answer":3,"why":"ذكر الدرس أنه مكروه إذا لم يحرك الشهوة، وأما ما يحرك الشهوة فحرام، وضابط تحريك الشهوة إنزال المني.","ref":"ص 3"},{"q":"ماذا يلزم من أفطر بغير عذر في نهار رمضان فيما يوجب القضاء فقط؟","options":["كفارة فقط","الفدية فقط","قضاء اليوم مع الإمساك بقية النهار","لا شيء عليه"],"answer":2,"why":"ذكر الدرس أنه يجب الإمساك بقية النهار على من أفطر بغير عذر، وعليه قضاء اليوم.","ref":"ص 4"},{"q":"ما الذي يوجب القضاء والكفارة والتعزير بحسب الدرس؟","options":["الأكل ناسيًا","الجماع الذي يفسد صوم يوم من رمضان","الاستمناء","القيء غير المتعمد"],"answer":1,"why":"ذكر الدرس أنه يوجب القضاء والكفارة مع التعزير وإمساك بقية اليوم لمن جامع بعد أكله أو شربه ناويًا للصوم عالمًا بالتحريم متعمدًا مختارًا.","ref":"ص 4"},{"q":"ما أول خصال كفارة الجماع في نهار رمضان؟","options":["عتق رقبة مؤمنة","صيام شهرين متتابعين","إطعام ستين مسكينًا","صيام ثلاثة أيام"],"answer":0,"why":"ذكر الدرس أن الكفارة: عتق رقبة مؤمنة، فإن لم يجد فصيام شهرين متتابعين، فإن لم يستطع فإطعام ستين مسكينًا.","ref":"ص 4"},{"q":"ماذا يحدث لو أفطر الصائم يومًا ولو بعذر أثناء صيام الشهرين المتتابعين في الكفارة؟","options":["يكمل الصيام ويقضي اليوم","لا يؤثر على الصيام","تسقط الكفارة","ينقطع التتابع ويجب الاستئناف"],"answer":3,"why":"ذكر الدرس أنه لو أفطر يومًا ولو بعذر كسفر أو مرض انقطع التتابع ووجب الاستئناف، ولو كان الإفطار في اليوم الأخير.","ref":"ص 4"},{"q":"بماذا أمر النبي ﷺ الرجل الذي جامع أهله في رمضان وعجز عن خصال الكفارة؟","options":["«اذهب فاقضِ يومًا»","«ادفع ثمنها لبيت المال»","«اذهب فأطعمه أهلك»","«لا شيء عليك»"],"answer":2,"why":"في الحديث المتفق عليه أُتي النبي ﷺ بعرق فيه تمر، فقال: «تصدق بهذا»، فلما ذكر الرجل حاجته ضحك النبي ﷺ ثم قال: «اذهب فأطعمه أهلك».","ref":"ص 4"},{"q":"ما الذي يوجب الفدية بحسب الدرس؟","options":["الأكل ناسيًا","العجز عن الصيام كالشيخ الكبير والمريض الذي لا يُرجى برؤه","السفر القصير","الاحتلام"],"answer":1,"why":"ذكر الدرس أن من أسباب الفدية العجز عن الصيام، وقد فسّر ابن عباس الآية بالشيخ الكبير والمرأة الكبيرة، فيطعمان مكان كل يوم مسكينًا.","ref":"ص 5"},{"q":"ما مقدار الفدية بحسب الدرس؟","options":["إطعام مسكين بمقدار مُدّ من غالب قوت البلد عن كل يوم","صاع من الذهب","ثلاثة أمداد","نصف صاع"],"answer":0,"why":"ذكر الدرس أن الفدية أن يُطعم مسكينًا بمقدار مدّ من غالب قوت البلد.","ref":"ص 5"},{"q":"ماذا يلزم من أخّر قضاء رمضان إلى رمضان آخر بلا عذر؟","options":["يقضي فقط","يخرج فدية فقط","لا شيء عليه","يقضي ما أفطره ويخرج فدية عن كل يوم"],"answer":3,"why":"ذكر الدرس أن من أخر قضاء ما عليه إلى رمضان آخر بلا عذر فيقضي ما أفطره ويخرج فدية عن كل يوم.","ref":"ص 5"},{"q":"ماذا يُندب لولي من مات وعليه صيام من رمضان أو غيره وتمكن من القضاء ولم يقض؟","options":["أن يحجّ عنه","أن يتصدق بمال فقط","أن يصوم عنه","لا شيء"],"answer":2,"why":"استدل الدرس بحديث ابن عباس: «نعم فدَين الله أحق أن يُقضى»، فإن لم يصم عنه أحد وجب على وليه أن يدفع الفدية من التركة.","ref":"ص 5"},{"q":"ماذا يلزم الحامل أو المرضع إذا أفطرت خوفًا على طفلها فقط؟","options":["القضاء فقط","القضاء والفدية عن كل يوم أفطرت فيه","الفدية فقط","الكفارة والقضاء"],"answer":1,"why":"ذكر الدرس أنه يجب عليهما الفطر والقضاء والفدية عن كل يوم، وأما إن أفطرت خوفًا على نفسها فقط أو نفسها وولدها فعليها القضاء فقط.","ref":"ص 5–6"},{"q":"ما حكم استعمال بخاخ الربو للصائم عند جمهور المعاصرين الذين ذكرهم الدرس؟","options":["لا يفطر؛ لأن اليقين لا يزول إلا بيقين مثله","يفطر مطلقًا","يفطر إن كان المريض قادرًا على الصوم","يفطر ويجب القضاء"],"answer":0,"why":"ذكر الدرس أن رأي ابن باز والعثيمين وابن جبرين واللجنة الدائمة أنه لا يفطر، لأن معظمه يذهب إلى الرئة ويبقى قدر يسير جدًّا في البلعوم.","ref":"ص 6"},{"q":"متى تُفطّر قطرة الأذن بحسب الدرس؟","options":["إذا كانت الطبلة سليمة","إذا كانت قطرة واحدة فقط","في كل الأحوال","إذا كانت طبلة الأذن مثقوبة ووضع قطرات كثيرة تسربت إلى الجوف"],"answer":3,"why":"ذكر الدرس أن الأذن ليست منفذًا للجوف إلا إذا كانت الطبلة مثقوبة، فإن كانت سليمة فلا يحصل الفطر، وإن كانت مثقوبة فالكميات اليسيرة معفو عنها.","ref":"ص 6"},{"q":"ما حكم الحقن غير المغذية كالأنسولين والمضاد الحيوي للصائم؟","options":["تفطر","تُكره فقط","لا تفطر","تفطر ويجب القضاء"],"answer":2,"why":"ذكر الدرس أن الحقن إن كانت مغذية تأخذ حكم الأكل والشرب، وإن لم تكن مغذية كحقن الأنسولين والمضاد الحيوي والتطعيمات العلاجية فلا تفطر آخذها.","ref":"ص 7"},{"q":"ما تعريف الاعتكاف شرعًا؟","options":["الإقامة في أي مكان للعبادة","اللبث في المسجد بنية مخصوصة","الاعتزال عن الناس","الصيام في المسجد"],"answer":1,"why":"عرّفه الدرس لغةً: الإقامة على الشيء وملازمته، وشرعًا: اللبث في المسجد بنية مخصوصة.","ref":"ص 7"},{"q":"ما حكم الاعتكاف في العشر الأواخر من رمضان؟","options":["سنة مؤكدة","واجب","مباح","مكروه"],"answer":0,"why":"ذكر الدرس أن الاعتكاف سنة في كل وقت، وسنة مؤكدة في العشر الأواخر تحريًا لليلة القدر، وفرض إن نذره على نفسه.","ref":"ص 7"},{"q":"ما شرطا صحة الاعتكاف بحسب الدرس؟","options":["الصيام والطهارة","القيام والتلاوة","السكوت والبقاء في المسجد","النية واللبث في المسجد"],"answer":3,"why":"ذكر الدرس أنه يشترط لصحة الاعتكاف شرطان: النية، واللبث في المسجد.","ref":"ص 7"},{"q":"ما حكم من خرج من المسجد لغير عذر أثناء الاعتكاف؟","options":["لا يبطل","يكره فقط","يبطل اعتكافه","تلزمه فدية"],"answer":2,"why":"ذكر الدرس أنه إن خرج من المسجد لغير عذر بطل اعتكافه، أما إذا خرج لعذر وعاد لم يبطل.","ref":"ص 7"},{"q":"ما الذي يُستحب للمعتكف؟","options":["الإكثار من النوم","الاشتغال بطاعة الله وعدم الكلام إلا بخير","الكلام مع الناس","ترك العبادة"],"answer":1,"why":"ذكر الدرس أنه يستحب الاشتغال بطاعة الله كالذكر وقراءة القرآن ومذاكرة العلم والصيام، وعدم الكلام إلا بخير.","ref":"ص 8"}],"14":[{"q":"ما تعريف الحج شرعًا بحسب الدرس؟","options":["الزيارة في غير وقت الحج","الإقامة في المسجد الحرام","القصد إلى بيت الله الحرام لأداء عبادة مخصوصة بشروط مخصوصة","الطواف حول الكعبة فقط"],"answer":2,"why":"ذكر الدرس أن الحج لغةً: القصد، وشرعًا: القصد إلى بيت الله الحرام لأداء عبادة مخصوصة بشروط مخصوصة.","ref":"ص 2"},{"q":"بماذا تختلف العمرة عن الحج من حيث الزمان؟","options":["العمرة لها أشهر معلومات والحج طوال العام","للحج أشهر معلومات لا يجوز في غيرها","لا فرق بينهما في الزمان","الحج في يوم واحد فقط"],"answer":1,"why":"ذكر الدرس أن الحج يختلف عن العمرة من حيث الزمان، فله أشهر معلومات لا يجوز في غيرها، ويختلف أيضًا في بعض الأحكام الخاصة به.","ref":"ص 2"},{"q":"ما حكم الحج بحسب الدرس؟","options":["فرض وركن من أركان الإسلام","سنة مؤكدة","مستحب","فرض كفاية"],"answer":0,"why":"ذكر الدرس أن الحج فرض وركن من أركان الإسلام، لقوله تعالى: ﴿ولله على الناس حج البيت من استطاع إليه سبيلًا﴾ [آل عمران: 97].","ref":"ص 3"},{"q":"ماذا قال النبي ﷺ لعائشة حين سألته: «هل على النساء جهاد؟»","options":["«لا، ليس عليهن جهاد»","«نعم، الجهاد بالمال»","«الصيام جهادهن»","«نعم، جهاد لا قتال فيه: الحج والعمرة»"],"answer":3,"why":"أخرجه ابن ماجه، وذكره الدرس دليلًا على فرضية العمرة كالحج.","ref":"ص 3"},{"q":"ما أحد المنافع الدنيوية والأخروية للحج التي ذكرها الدرس؟","options":["الحصول على الغنائم","التجارة وحدها","اجتماع المسلمين وتوحدهم وتقرير المساواة بينهم","طلب الشهرة"],"answer":2,"why":"ذكر الدرس من المنافع: اجتماع المسلمين وتوحدهم، وتقرير المساواة بينهم، والتذكير بحال آبائهم وأسلافهم من الأنبياء، وتربية الجسم والنفس على الخشونة والصبر.","ref":"ص 3–4"},{"q":"ما أول شرط من شروط وجوب الحج بحسب الدرس؟","options":["الاستطاعة","الإسلام","الحرية","أمن الطريق"],"answer":1,"why":"شروط وجوب الحج: الإسلام، والتكليف (البلوغ والعقل)، والحرية، وأمن الطريق، والاستطاعة.","ref":"ص 4"},{"q":"لماذا لا يجب الحج والعمرة على العبد بحسب الدرس؟","options":["لأنه لا يملك مالًا، بل هو وماله ملك سيده","لأنه غير مسلم","لأنه غير بالغ","لأنه لا يعرف المناسك"],"answer":0,"why":"ذكر الدرس شرط الحرية: فلا يجب الحج والعمرة على العبد لأنه لا يملك مالًا، بل هو وماله ملك سيده.","ref":"ص 4"},{"q":"ما معنى الاستطاعة في الحج بحسب الحديث الذي ذكره الدرس؟","options":["صحة البدن فقط","وجود المحرم فقط","الدين الذي لا يحتاج إلى سداد","«الزاد والراحلة»"],"answer":3,"why":"ذكر الدرس حديث ابن عمر عند الترمذي، وأن الاستطاعة تتحقق بأن يملك الإنسان المال اللازم لأداء الحج والعمرة ذهابًا وإيابًا، زائدًا عن دينه ونفقة عياله مدة غيابه.","ref":"ص 4"},{"q":"ما الشرط الزائد في حج المرأة وعمرتها المتعلق بالسفر؟","options":["أن تكون في جماعة من النساء فقط","أن تكون بلغت الأربعين","أن تكون مع زوجها أو محرم","أن تحصل على إذن القاضي"],"answer":2,"why":"ذكر الدرس الشروط الزائدة للمرأة: أن تكون مع زوجها أو محرم، وألا تكون معتدة، وإذن الزوج لها بالخروج للحج.","ref":"ص 5"},{"q":"ما أعمال العمرة بحسب الدرس؟","options":["الإحرام والوقوف بعرفة والطواف والسعي","الإحرام والطواف والسعي بين الصفا والمروة والحلق أو التقصير","الإحرام والرمي والمبيت والطواف","الطواف والسعي والتحلل فقط"],"answer":1,"why":"ذكر الدرس أن أعمال العمرة أربعة: الإحرام، والطواف، والسعي بين الصفا والمروة، والحلق أو التقصير.","ref":"ص 5"},{"q":"ما الإحرام بحسب الدرس؟","options":["نية الدخول في النسك من حج أو عمرة","لبس الإزار والرداء فقط","دخول مكة","الطواف حول البيت"],"answer":0,"why":"عرّفه الدرس بأنه نية الدخول في النسك من حج أو عمرة والتزام ذلك النسك وعدم الخروج عنه إلا بعد إتمامه، ومحلّه القلب.","ref":"ص 5"},{"q":"ماذا قالت ضباعة بنت الزبير للنبي ﷺ، وبماذا أجابها؟","options":["قالت إنها مريضة وتريد العودة، فأمرها بالرجوع","قالت إنها خائفة، فأمرها بالدعاء","قالت إنها حائض، فأمرها بالغسل","قالت إنها ثقيلة وتريد الحج، فقال: «أهلّي واشترطي أن محلّي حيث حبستني»"],"answer":3,"why":"ذكر الدرس أنه يجوز الاشتراط في الإحرام، لحديث ابن عباس المتفق عليه.","ref":"ص 5"},{"q":"بماذا يحرم الرجل بحسب الدرس؟","options":["بلبس العباءة السوداء","بكشف الرأس فقط","بتجرده من المخيط ولبس الإزار والرداء","بحلق شعره"],"answer":2,"why":"ذكر الدرس أن الرجل يحرم بتجرده من المخيط ولبس الإزار والرداء، وتحرم المرأة بكشف وجهها ويديها.","ref":"ص 6"},{"q":"كم ميقاتًا مكانيًّا وقّته رسول الله ﷺ؟","options":["ثلاثة مواقيت","خمسة مواقيت","أربعة مواقيت","ستة مواقيت"],"answer":1,"why":"وقّت النبي ﷺ: ذو الحليفة لأهل المدينة، والجحفة لأهل الشام، وقرن المنازل لأهل نجد، ويلملم لأهل اليمن، وذات عرق لأهل العراق.","ref":"ص 6"},{"q":"ما ميقات أهل المدينة؟","options":["ذو الحليفة","الجحفة","يلملم","قرن المنازل"],"answer":0,"why":"ذكر الدرس أن ذا الحليفة ميقات أهل المدينة.","ref":"ص 6"},{"q":"من أين يُحرم أهل مكة للعمرة؟","options":["من بيوتهم","من داخل المسجد الحرام","من جبل عرفة","من الحِلّ كالتنعيم"],"answer":3,"why":"ذكر الدرس أن أهل مكة ميقاتهم للحج الحرم، وللعمرة الحلّ، فيُحرم المكي للعمرة من الحلّ وهو التنعيم أو غيره.","ref":"ص 6"},{"q":"لماذا يُسنّ الغسل للإحرام حتى للحائض والنفساء بحسب الدرس؟","options":["لأنه شرط لصحة الإحرام","لأنه يرفع الحدث الأكبر","لأنه للنظافة لا للطهارة","لأنه واجب"],"answer":2,"why":"ذكر الدرس أن الغسل أفضل من الوضوء لأنه أتمّ نظافة، وهو للنظافة لا للطهارة، ولذا تفعله الحائض والنفساء وتُحرم وتقضي المناسك كلها غير ألا تطوف بالبيت.","ref":"ص 6"},{"q":"كم محظورًا يحرم على المتلبّس بالإحرام بحسب الدرس؟","options":["خمسة محظورات","عشرة محظورات","سبعة محظورات","اثنا عشر محظورًا"],"answer":1,"why":"ذكر الدرس أنه يحرم على المتلبس بالإحرام عشرة أشياء، منها لبس المخيط وتغطية الرأس للرجال، وترجيل الشعر وحلقه وتقليم الأظافر والتطيب وقتل الصيد وعقد النكاح والجماع والمباشرة بشهوة.","ref":"ص 7"},{"q":"أي المحظورين التاليين يختص بالرجال دون النساء؟","options":["لبس المخيط وتغطية الرأس","التطيب وتقليم الأظافر","حلق الشعر وقتل الصيد","عقد النكاح والجماع"],"answer":0,"why":"ذكر الدرس أن هذين الأمرين يحرمان على الرجال خاصة دون النساء.","ref":"ص 7"},{"q":"ماذا قال النبي ﷺ عن عقد النكاح للمحرم؟","options":["«يجوز للمحرم أن ينكح»","«يُكره للمحرم أن ينكح»","«ينكح المحرم بإذن القاضي»","«لا يَنكِح المحرم ولا يُنكَح ولا يخطب»"],"answer":3,"why":"رواه مسلم عن عثمان رضي الله عنه، وذكر الدرس أنه إن فعل ذلك فالعقد باطل.","ref":"ص 8"},{"q":"ما شروط الطواف الصحيح بحسب الدرس؟","options":["الصيام والنية فقط","الركوب والإحرام فقط","ما يُشترط لصحة الصلاة، وألا يدخل بشيء من جسمه حدود الكعبة، وأن يجعل البيت عن يساره، وسبعة أشواط","الطواف تسعة أشواط"],"answer":2,"why":"ذكر الدرس أن للطواف شروطًا: ما يشترط لصحة الصلاة من نية وطهارة وستر عورة، وألا يدخل شيئًا من جسمه إلا حدود الكعبة، وأن يجعل البيت عن يساره بادئًا بالحجر الأسود، وأن يكمل سبعة أشواط.","ref":"ص 8"},{"q":"لماذا يطوف الطائف من خارج الحِجر؟","options":["لأنه مكان الصلاة","لأنه من ضمن الكعبة","لأنه ملك الحرم","لأنه محرّم"],"answer":1,"why":"ذكر الدرس أنه يطوف بالبيت من خارج حدود الحِجر لأنه من ضمن الكعبة.","ref":"ص 8"},{"q":"ما الرَّمَل في الطواف؟","options":["المشي السريع مع مقاربة الخطى في الأشواط الثلاثة الأولى","الركض الشديد في كل الأشواط","المشي البطيء مع الدعاء","الجري بين الميلين الأخضرين"],"answer":0,"why":"ذكر الدرس أن الرمل هو المشي السريع مع مقاربة الخطى، وأن المرأة لا ترمل.","ref":"ص 9"},{"q":"ماذا يُسنّ أن يقال بين الركن اليماني والحجر الأسود في الطواف؟","options":["﴿قل هو الله أحد﴾","«سبحان الله وبحمده»","«لا إله إلا الله وحده لا شريك له»","﴿ربنا آتنا في الدنيا حسنة وفي الآخرة حسنة وقنا عذاب النار﴾"],"answer":3,"why":"رواه أبو داود عن عبد الله بن السائب، وذكره الدرس من الدعاء في الطواف.","ref":"ص 9"},{"q":"ماذا يُسنّ بعد الطواف؟","options":["الاغتسال","الإحرام من جديد","صلاة ركعتين خلف المقام","الوقوف بعرفة"],"answer":2,"why":"ذكر الدرس أن من سنن الطواف صلاة ركعتين بعد الطواف خلف المقام، لحديث ابن عمر المتفق عليه.","ref":"ص 9"},{"q":"ما شروط السعي بين الصفا والمروة؟","options":["أن يبدأ بالمروة","أن يكون عقب طواف، وسبعة أشواط مبدوءة بالصفا مختومة بالمروة","أن يكون قبل الطواف","أن يكون في أي مكان"],"answer":1,"why":"ذكر الدرس شروط السعي: أن يكون عقب طواف، وأن يسعى سبعة أشواط مبدوءة بالصفا مختومة بالمروة، وأن يقطع جميع المسافة، وأن يتابع ويوالي بين الأشواط.","ref":"ص 9"},{"q":"ما الفرق بين الأركان والواجبات في الحج بحسب الدرس؟","options":["الواجبات يُجبر تركها بإراقة دم ويصح الحج بدونها، أما الأركان فلا يتم الحج إلا بها ولا يُجبر ترك ركن بدم","لا فرق بينهما","الواجبات لا يصح الحج بدونها والأركان يصح بدونها","كلاهما يُجبر بإراقة دم"],"answer":0,"why":"ذكر الدرس أن الأركان والواجبات كلاهما لا بد منه، إلا أن الواجبات يُجبر تركها بإراقة دم ويصح الحج بدونها، أما الأركان فلا يتم الحج إلا بها.","ref":"ص 10"},{"q":"كم ركنًا للحج بحسب الدرس، وما هي؟","options":["أربعة: الإحرام والطواف والسعي والرمي","ستة: الإحرام والوقوف والمبيت والطواف والسعي والحلق","ثلاثة: الإحرام والوقوف والطواف","خمسة: الإحرام والوقوف بعرفة والطواف والسعي والحلق أو التقصير"],"answer":3,"why":"ذكر الدرس أن أركان الحج خمسة: الإحرام، والوقوف بعرفة، والطواف، والسعي، والحلق أو التقصير.","ref":"ص 10"},{"q":"ما أوجه الإحرام بالحج الثلاثة؟","options":["الإفراد والتقديم والتأخير","التمتع والتحلل والتبكير","الإفراد والتمتع والقِران","الإحرام والتلبية والنية"],"answer":2,"why":"ذكر الدرس أنه يجوز للحاج أن يحرم بالحج والعمرة على ثلاثة أوجه هي: الإفراد، والتمتع، والقران.","ref":"ص 10"},{"q":"ما الأفضل من الأوجه الثلاثة عند الشافعية بحسب الدرس؟","options":["القران","الإفراد بالحج إن اعتمر عامه","التمتع","كلها سواء"],"answer":1,"why":"ذكر الدرس أن الإفراد أفضل عند الشافعية لأنه لا يجب معه هدي ولأن النبي ﷺ حج مفردًا.","ref":"ص 10"},{"q":"ماذا قال النبي ﷺ عن الوقوف بعرفة؟","options":["«الحج عرفة»","«الحج الطواف»","«الحج المبيت»","«الحج الرمي»"],"answer":0,"why":"ذكر الدرس أن الوقوف بعرفة هو لبّ أعمال الحج وأهمها، لحديث: «الحج عرفة، من جاء ليلة جمع قبل طلوع الفجر فقد أدرك الحج».","ref":"ص 11"},{"q":"متى يبدأ وقت الوقوف بعرفة وينتهي؟","options":["من فجر يوم عرفة إلى غروبها","من غروب اليوم التاسع إلى ظهر يوم النحر","من ظهر الثامن إلى ظهر التاسع","من ظهر اليوم التاسع من ذي الحجة إلى فجر يوم النحر"],"answer":3,"why":"ذكر الدرس أنه يكفي أن يحضر ولو لحظة واحدة من نهار أو ليل، والأفضل أن يجمع بين جزء من النهار وجزء من الليل.","ref":"ص 11"},{"q":"متى يبدأ وقت الحلق في الحج بحسب الدرس؟","options":["قبل الوقوف بعرفة","بعد طواف الوداع","بعد منتصف ليلة النحر","بعد زوال الشمس يوم عرفة"],"answer":2,"why":"ذكر الدرس أنه لو حلق قبل ذلك كان آثمًا واستوجب الفدية.","ref":"ص 11"},{"q":"ما عدد الحصيات التي يرمى بها كل جمرة؟","options":["ثلاث حصيات","سبع حصيات","خمس حصيات","عشر حصيات"],"answer":1,"why":"ذكر الدرس أنه يرمي جمرة العقبة بسبع حصيات، وكل جمرة من الجمرات الثلاث في أيام التشريق بسبع حصيات.","ref":"ص 12"},{"q":"بأي الجمرات يبدأ الرمي في أيام التشريق؟","options":["الصغرى ثم الوسطى ثم جمرة العقبة","جمرة العقبة ثم الوسطى ثم الصغرى","الوسطى ثم الصغرى ثم العقبة","لا ترتيب بينها"],"answer":0,"why":"ذكر الدرس أنه يبدأ بالصغرى ثم الوسطى ثم جمرة العقبة، ويبدأ وقت رميها من بعد زوال الشمس.","ref":"ص 12"},{"q":"أين يجب المبيت ليلة العيد (بعد النزول من عرفة)؟","options":["بمنى","بمكة","بعرفة","بمزدلفة إلى ما بعد منتصف الليل"],"answer":3,"why":"ذكر الدرس أن المبيت بمزدلفة واجب إلى ما بعد منتصف الليل، وهي مكان بين عرفة ومنى.","ref":"ص 12"},{"q":"أي الطوافين يسقط عن الحائض؟","options":["طواف الإفاضة","طواف القدوم","طواف الوداع","الطواف في العمرة"],"answer":2,"why":"ذكر الدرس أن طواف الوداع واجب إذا أتمّ مناسكه كلها أو أراد الخروج من مكة، وأنه يسقط عن المرأة الحائض.","ref":"ص 12"},{"q":"ما لفظ التلبية الواردة عن النبي ﷺ؟","options":["«الحمد لله رب العالمين»","«لبيك اللهم لبيك، لبيك لا شريك لك لبيك، إن الحمد والنعمة لك والملك، لا شريك لك»","«الله أكبر كبيرًا»","«سبحان الله وبحمده»"],"answer":1,"why":"ذكر الدرس أنها من سنن الحج، ويُسنّ الإكثار منها أثناء الإحرام ويرفع الرجل صوته بها.","ref":"ص 13"},{"q":"ماذا قال النبي ﷺ عن «خير الدعاء»؟","options":["«خير الدعاء دعاء يوم عرفة»","«خير الدعاء دعاء المسافر»","«خير الدعاء دعاء الليل»","«خير الدعاء دعاء المظلوم»"],"answer":0,"why":"أخرجه الترمذي، وذكره الدرس في سنن الحج من الإكثار من الدعاء والتهليل خصوصًا يوم عرفة.","ref":"ص 14"},{"q":"ماذا يقول الرامي مع كل حصاة بدل التلبية؟","options":["التلبية","التسبيح","الحمد","التكبير: «الله أكبر…»"],"answer":3,"why":"ذكر الدرس أنه يقطع التلبية عند ابتداء الرمي، ويكبّر مع كل حصاة.","ref":"ص 14"},{"q":"ما فدية لبس المخيط للحاجة كالمداواة أو الحر أو البرد بحسب الدرس؟","options":["إطعام مسكين واحد","صيام يوم","ذبح شاة","لا فدية"],"answer":2,"why":"ذكر الدرس أن لبس المخيط محظور في حق الرجال، ويجوز لحاجة وتجب الفدية وهي ذبح شاة مجزئة في الأضحية.","ref":"ص 14"},{"q":"ماذا يجب على من جامع قبل التحلل بحسب الدرس؟","options":["أن يذبح شاة","أن يذبح بعيرًا","أن يصوم ثلاثة أيام","لا شيء عليه"],"answer":1,"why":"ذكر الدرس أنه يجب على من جامع قبل التحلل أن يذبح بعيرًا، فإن عجز فبقرة، فإن عجز فسبع شياه، ثم الإطعام ثم الصيام على الترتيب.","ref":"ص 15"}],"15":[{"q":"كم محورًا تناولها الدرس في أحكام اللباس والزينة الخاصة بالمرأة؟","options":["ثلاثة محاور","خمسة محاور","ستة محاور","أربعة محاور"],"answer":3,"why":"المحاور: الحجاب الشرعي (صفته وضوابطه)، وضوابط زينة المرأة، وأحكام لباس المرأة أمام المحارم وغيرهم، وغرس العفة والحياء في الأسرة.","ref":"ص 2"},{"q":"ما أول ضابط من ضوابط الحجاب الشرعي بحسب الدرس؟","options":["تغطية الشعر فقط","أن يكون أسود اللون","استيعاب جميع البدن بما في ذلك الوجه والكفان على الراجح من أقوال العلماء","أن يكون مطرّزًا"],"answer":2,"why":"ذكر الدرس أن من الضوابط استيعاب جميع البدن، بما في ذلك الوجه والكفان على الراجح من أقوال العلماء، خاصة في زمن الفتن.","ref":"ص 2"},{"q":"ماذا قال الألباني عن الجلباب بحسب ما نقله الدرس؟","options":["الجلباب يجب أن يكون ملوّنًا","المقصود من الأمر بالجلباب ستر زينة المرأة، فلا يُعقل أن يكون الجلباب نفسه زينة","الجلباب للنساء الكبيرات فقط","الجلباب اختياري"],"answer":1,"why":"نقل الدرس قوله في «جلباب المرأة المسلمة»: «والمقصود من الأمر بالجلباب إنما هو ستر زينة المرأة، فلا يعقل حينئذ أن يكون الجلباب نفسه زينة».","ref":"ص 2–3"},{"q":"ما الحديث الذي استدل به الدرس على اشتراط أن يكون الحجاب صفيقًا ثخينًا لا يشف؟","options":["«ونساء كاسيات عاريات مميلات مائلات…»","«إن الله جميل يحب الجمال»","«الحياء من الإيمان»","«المرأة عورة»"],"answer":0,"why":"أخرجه مسلم، وذكر الدرس قول النووي في تفسيره: أن تلبس ثوبًا رقيقًا يصف لون بدنها.","ref":"ص 3"},{"q":"لماذا أمر النبي ﷺ أسامة بن زيد رضي الله عنهما أن تجعل امرأته تحت القبطية غلالة؟","options":["لأنها كانت قصيرة","لأنها ثقيلة","لأنها قديمة","لأنه خاف أن تصف حجم عظامها"],"answer":3,"why":"في الحديث: «مُرها فلتجعل تحتها غلالة، فإني أخاف أن تصف حجم عظامها» (أخرجه أحمد)، وهو في شرط أن يكون فضفاضًا واسعًا غير ضيق.","ref":"ص 3–4"},{"q":"ماذا قال عمر رضي الله عنه لمن قال إن القباطي لا تشف؟","options":["«لا بأس بها»","«يجوز لبسها في البيت»","«إن لم يكن يشف فإنه يصف»","«هي من لباس النساء»"],"answer":2,"why":"أخرجه البيهقي، وذكره الدرس شاهدًا على أن اللباس يجب ألا يصف حجم الجسم وإن لم يكن شفافًا.","ref":"ص 4"},{"q":"ما حكم من استعطرت فمرت على قوم ليجدوا ريحها؟","options":["«فهي مكروهة»","«فهي زانية»","«فهي مخطئة وتتوب»","«فهي معذورة»"],"answer":1,"why":"أخرجه النسائي، وذكره الدرس في شرط ألا يكون الحجاب مطيّبًا أو مبخّرًا.","ref":"ص 4"},{"q":"ما حكم تشبه المرأة بلباس الرجال بحسب الدرس؟","options":["حرام، ولعن النبي ﷺ المرأة تلبس لبسة الرجل","مباح","مستحب","مكروه"],"answer":0,"why":"روى أبو هريرة في مسند أحمد: «لعن رسول الله ﷺ الرجل يلبس لبسة المرأة، والمرأة تلبس لبسة الرجل».","ref":"ص 4"},{"q":"ما معنى «لباس الشهرة» بحسب ما نقله الدرس عن ابن الأثير؟","options":["لباس الحرير","اللباس القصير","اللباس الأبيض","أن يشتهر ثوبه بين الناس لمخالفة لونه لألوان ثيابهم، فيرفع الناس إليه أبصارهم ويختال بالعجب والتكبر"],"answer":3,"why":"قال الحديث: «من لبس ثوب شهرة في الدنيا ألبسه الله ثوب مذلة يوم القيامة ثم ألهب فيه نارًا» (أخرجه أبو داود).","ref":"ص 4"},{"q":"ما الشروط الثلاثة الأخيرة من شروط الحجاب التي تحرم على المرأة مطلقًا داخل البيت وخارجه؟","options":["ألا يكون ثخينًا، وألا يكون واسعًا، وألا يكون مطيّبًا","أن يكون أسود وفضفاضًا ومسدلًا","ألا يشبه لباس الرجال، وألا يشبه لباس الكافرات أو الفاسقات، وألا يكون لباس شهرة","ألا يكون مطرزًا ولا ملوّنًا ولا مستعملًا"],"answer":2,"why":"ذكر الدرس أن الشروط الثلاثة الأخيرة (عدم التشبه بالرجال، وعدم التشبه بالكافرات أو الفاسقات، وعدم لباس الشهرة) تحرم على المرأة مطلقًا سواء داخل البيت أو خارجه.","ref":"ص 4"},{"q":"ما الحكمة من ضوابط الحجاب بحسب الدرس؟","options":["مجرد اتباع العادات","ستر العورات وسد ذرائع المحرمات وقطع أطماع الفساق وتربية المجتمع على العفة والحياء","التمييز الطبقي","التزيّن"],"answer":1,"why":"ذكر الدرس أن الشرع حريص على ستر العورات وسدّ ذرائع المحرمات وصيانة المجتمع، وقطع الأطماع الشيطانية في نفوس الفساق، وتربية المجتمع على العفة والحياء.","ref":"ص 4–5"},{"q":"ماذا قال ابن عباس رضي الله عنهما في تفسير آية الجلابيب؟","options":["أمر الله نساء المؤمنين إذا خرجن من بيوتهن في حاجة أن يغطين وجوههن من فوق رؤوسهن بالجلابيب ويبدين عينًا واحدة","أمرهن أن يلبسن الأسود","أمرهن ألا يخرجن إلا للضرورة","أمرهن أن يتزين"],"answer":0,"why":"نقل الدرس هذا التفسير في أدلة وجوب الحجاب عند قوله تعالى: ﴿يا أيها النبي قل لأزواجك وبناتك ونساء المؤمنين يدنين عليهن من جلابيبهن﴾.","ref":"ص 5"},{"q":"ما الحديث الذي ذكره الدرس عن المرأة في أدلة وجوب الحجاب؟","options":["«المرأة مخلوقة من ضلع»","«النساء شقائق الرجال»","«خيركم خيركم لنسائه»","«إن المرأة عورة، فإذا خرجت استشرفها الشيطان، وأقرب ما تكون من وجه ربها وهي في قعر بيتها»"],"answer":3,"why":"أخرجه الترمذي، وذكره الدرس في أدلة وجوب الحجاب.","ref":"ص 5"},{"q":"لمن يجوز للمرأة إظهار زينتها بحسب آية النور؟","options":["لجميع الرجال","للأقارب غير المحارم","للزوج ولمن ذكرهم الله من المحارم كالآباء والأبناء والإخوة","لجميع النساء والرجال"],"answer":2,"why":"ذكر الدرس أنه يجب على المرأة أن تستر زينتها عن الرجال الأجانب ولا تُظهرها إلا لمن أباح الله لهم ذلك كالمحارم والزوج.","ref":"ص 5"},{"q":"ما حكم التزين بما يشبه هيئات الكافرات أو الفاجرات بحسب الدرس؟","options":["مباح","حرام، وإن سمّاها المجتمع بالموضة","مستحب","مكروه"],"answer":1,"why":"ذكر الدرس أنه يحرم على المرأة أن تتزين بما يشبه الهيئات التي تُعرف بها الكافرات أو الفاجرات، وكذا ما يشبه الهيئات التي يُعرف بها الرجال مثل لبس البنطال.","ref":"ص 5–6"},{"q":"ماذا تفعل المرأة بالزينة التي تمنع وصول ماء الوضوء إلى البشرة؟","options":["يلزم إزالتها قبل الوضوء أو الغسل الواجب","يستحب إزالتها","تكره","لا بأس ببقائها"],"answer":0,"why":"ذكر الدرس أنه إذا كانت الزينة مما يمنع وصول ماء الوضوء إلى الأعضاء لزم إزالتها قبل الوضوء أو الغسل الواجب.","ref":"ص 6"},{"q":"أي مما يلي من الزينة المحرمة بحسب الدرس؟","options":["الكحل","الحناء","السواك","النمص والوشم ووصل الشعر بشعر آخر وتفليج الأسنان"],"answer":3,"why":"ذكر الدرس أن من الزينة المحرمة: النمص، والوشم، ووصل الشعر بشعر آخر، وتركيب الرموش الصناعية، وتفليج الأسنان، وكل ما فيه تغيير لخلق الله.","ref":"ص 6"},{"q":"من هم المحارم بحسب الدرس؟","options":["أبناء العم وأبناء الخال","الجيران","من يحرم نكاحهن على التأبيد كالأب والأخ والعم والخال وأبناء الإخوة وأبناء الأخوات وأب الزوج","زوج الأخت"],"answer":2,"why":"ذكر الدرس أن المحارم هم الأب والأخ والعم والخال وأبناء الإخوة وأبناء الأخوات وأب الزوج وغيرهم ممن يحرم نكاحه على التأبيد.","ref":"ص 6"},{"q":"ما عورة المرأة أمام محارمها بحسب الدرس؟","options":["جميع بدنها إلا الوجه والكفين","جميع بدنها إلا ما يظهر غالبًا كالرأس والوجه والرقبة والذراعين والقدمين","ما بين السرة والركبة","جميع بدنها بلا استثناء"],"answer":1,"why":"ذكر الدرس أن عورتها أمام المحارم جميع بدنها إلا ما يظهر غالبًا مثل: الرأس، والوجه، والرقبة، والذراعان، والقدمان.","ref":"ص 6"},{"q":"ما عورة المرأة أمام النساء المسلمات عند جمهور العلماء بحسب الدرس؟","options":["ما بين السرة والركبة","جميع البدن","البدن إلا الوجه والكفين","الصدر فقط"],"answer":0,"why":"ذكر الدرس أن جمهور العلماء اتفقوا على أنها ما بين السرة والركبة، مع أن الأولى والأليق بالمسلمة أن تلتزم الحشمة والحياء والستر.","ref":"ص 7"},{"q":"ما أول ما يبدأ به غرس العفة والحياء في الأسرة بحسب الدرس؟","options":["شراء الملابس","منع الأبناء من الخروج","التوبيخ","سلوك الوالدين قبل كلامهما"],"answer":3,"why":"ذكر الدرس أن غرس هذه القيم يبدأ من سلوك الوالدين قبل كلامهما، فحين يرى الأولاد الوالدين ملتزمين بالحشمة والستر ينشؤون على ذلك تلقائيًّا.","ref":"ص 8"},{"q":"ما الحديث الذي ذكره الدرس في قرن الحياء بالإيمان؟","options":["«الحياء لا يأتي إلا بخير»","«الحياء شعبة من الإيمان»","«إن الحياء والإيمان قُرِنا جميعًا، فإذا رُفع أحدهما رُفع الآخر»","«إذا لم تستحِ فاصنع ما شئت»"],"answer":2,"why":"أخرجه البيهقي عن ابن عمر، وذكره الدرس في الوسيلة الأولى (المجلس الإيماني المنتظم في البيت).","ref":"ص 8"},{"q":"في أي سن تُعوَّد البنات تغطية شعرهن عند الخروج بحسب الدرس؟","options":["منذ الثالثة","منذ السابعة","منذ العاشرة","منذ البلوغ فقط"],"answer":1,"why":"ذكر الدرس أن البنات يُعوَّدن منذ السابعة تغطية شعرهن عند الخروج ويُرغَّبن في لبس الحجاب، ويؤمرن بلباس الصلاة عند أدائها من الصغر بلطف وترغيب.","ref":"ص 8"}]},"s5":{"1":[{"q":"ما معنى «الثوابت» بحسب الدرس؟","options":["العادات والتقاليد المتغيرة","الأصول الشرعية المهمة للمرأة المسلمة؛ والشيء الثابت هو الشيء المستقر","البيئة المحيطة بالمرأة","كل ما يتغير بتغير الزمان"],"answer":1,"why":"الثوابت من الثبات، والشيء الثابت هو الشيء المستقر، وتعرَّف الثوابت بأنها الأصول الشرعية المهمة للمرأة المسلمة.","ref":"ص 2"},{"q":"لماذا لا تكفي المعرفة بأركان الإيمان وحدها لتثبيت الإيمان في قلب المؤمن بحسب الدرس؟","options":["لأن هناك أصولًا وثوابت بدأ التنازل والانحراف عنها في هذا الزمان، وهي ثوابت فطرية وثوابت شرعية، وكلاهما منبثق عن الآخر","لأن أركان الإيمان لا علاقة لها بالثوابت","لأن الثوابت تتغير بتغير الزمان","لأن الثوابت خاصة بالرجال دون النساء"],"answer":0,"why":"إن المعرفة بأركان الإيمان وحدها لا تكفي ليثبت الإيمان في قلب المؤمن؛ لأن هناك أصولًا وثوابت بدأ التنازل والانحراف عنها في هذا الزمان؛ وهي ثوابت فطريّة وثوابت شرعيّة وكلاهما منبثق عن الآخر.","ref":"ص 2"},{"q":"ما سر انحراف الكثير من النساء عن الثوابت التي خلقهن الله عليها بحسب الدرس؟","options":["قلة المال","كثرة العلم الشرعي","شدة الحجاب","اتباع الهوى"],"answer":3,"why":"سرُّ انحراف الكثير من النساء عن الثوابت التي خلقهنَّ الله عليها من أجلها هو اتباعُ الهوى، وقد قال ربُّ العالمين: ﴿أَفَرَأَيْتَ مَنِ اتَّخَذَ إِلَٰهَهُ هَوَاهُ...﴾.","ref":"ص 3"},{"q":"أي مما يلي من أسباب البُعد عن الثوابت الشرعية بحسب الدرس؟","options":["الاهتمام بتحصين النفس أمام الغزو الفكري","التمسك بالحجاب والقرار في البيت","عدم تحصين النفس أمام الغزو الفكري، وإقصاء الإسلام العملي عن واقع المسلمين وحشره في زوايا المساجد","طلب العلم الشرعي"],"answer":2,"why":"من أسباب البعد عن الثوابت الشرعية: عدم تحصين النفس أمام الغزو الفكري، فتح القلوب أمام الجراثيم القادمة من كل مكان، غزو وسائل الإعلام، توظيف الأموال والاختراعات في السيطرة على العقول، انفتاح المسلمين على الغرب، إقصاء الإسلام العملي عن واقع المسلمين وحشره في زوايا المساجد، سنّ القوانين التي تحارب الأسرة.","ref":"ص 5"},{"q":"ماذا قال النبي ﷺ في حديث أبي هريرة رضي الله عنه عن المولود وفطرته؟","options":["«ما من مولود إلا يولد على الكفر فيُسلمه أبواه»","«ما من مولود إلا يولد على الفطرة، فأبواه يهوّدانه أو ينصّرانه أو يمجّسانه»","«ما من مولود إلا يولد على العلم»","«ما من مولود إلا يولد على الخطيئة»"],"answer":1,"why":"قال ﷺ: «ما من مولودٍ إلا يولد على الفطرة، فأبواه يهوِّدانه أو ينصِّرانه أو يمجِّسانه، كما تُنتج البهيمةُ بهيمةً جمعاء، هل تُحسُّون فيها من جدعاء؟»، ثم يقول أبو هريرة: ﴿فِطْرَتَ اللَّهِ الَّتِي فَطَرَ النَّاسَ عَلَيْهَا﴾ (أخرجه البخاري).","ref":"ص 6"},{"q":"أي مما يلي من أقوال العلماء في تعريف الفطرة بحسب الدرس؟","options":["أنها الخِلقة الموجودة في أصل الإنسان، وأنها الميثاق الأول أو العهد، وقيل هي الإسلام","أنها العادات والتقاليد","أنها البيئة المحيطة بالإنسان","أنها التطور الفكري المعاصر"],"answer":0,"why":"للعلماء في تعريف الفطرة خمسة أقوال: أن الفطرة هي الخلقة الموجودة في أصل الإنسان، وهي البداءة أي الخلق، وبمعنى ما فطر الله عليه الخلق وهي الإنكار والمعرفة والكفر والإيمان، وهي الميثاق الأول أو العهد، وقيل هي الإسلام.","ref":"ص 6–7"},{"q":"ما مغيّرات الفطرة بحسب الدرس؟","options":["الغنى والفقر","الصحة والمرض","الليل والنهار","الشيطان، والبيئة الفاسدة"],"answer":3,"why":"مغيّرات الفطرة: ١. الشيطان، ٢. البيئة الفاسدة؛ وهي كل ما يؤثر في الإنسان ويسبب تغيير سلوكه سواءً من الأسباب المادية أو المعنوية.","ref":"ص 7"},{"q":"كيف يكون تكوين البيئة الطيبة بداية بحسب الدرس؟","options":["بتقليد الغرب في الأفكار والأوضاع","بترك الأبناء يختارون ما يشاؤون دون توجيه","باختيار الزوجة/الزوج الصالح الذي يحافظ على فطرة أبنائه، وتنشئ جيلًا صالحًا، وتجعل القوامة للرجل ليرعى الأسرة وينفق مما رزقه الله","بالانفتاح على كل ما يعرض في وسائل الإعلام"],"answer":2,"why":"وتكوين البيئة الطيبة يكون بداية باختيار الزوجة/الزوج الصالح الذي يحافظ على فطرة أبنائه، وتُنشئ جيلًا صالحًا، وتجعل القوامة للرجل ليرعى الأسرة وينفق مما رزقه الله.","ref":"ص 7"},{"q":"ما الآية التي استشهد بها الدرس على أهمية اختيار الصديق الصالح؟","options":["﴿وَالَّذِينَ جَاهَدُوا فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا﴾","﴿وَلَا تُطِعْ مَنْ أَغْفَلْنَا قَلْبَهُ عَن ذِكْرِنَا وَاتَّبَعَ هَوَاهُ وَكَانَ أَمْرُهُ فُرُطًا﴾","﴿إِنَّ الصَّلَاةَ تَنْهَىٰ عَنِ الْفَحْشَاءِ وَالْمُنكَرِ﴾","﴿وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ﴾"],"answer":1,"why":"من المهم اختيار الصديق الصالح الذي يسحب صديقه إلى أي اتجاه يذهب فيه، قال تعالى: ﴿وَلَا تُطِعْ مَنْ أَغْفَلْنَا قَلْبَهُ عَن ذِكْرِنَا وَاتَّبَعَ هَوَاهُ وَكَانَ أَمْرُهُ فُرُطًا﴾ [الكهف: 28].","ref":"ص 8"},{"q":"ماذا يجب على المرأة المسلمة بصفتها صانعة الجيل بحسب فائدة الدرس عن الانحراف عن الفطرة؟","options":["التمسك بالثوابت والعودة بأبنائها إلى الطريق المستقيم، بعيدًا عن الضلال والشرك وأصحاب الأهواء","ترك الثوابت لمواكبة العصر","الانشغال عن الأبناء بالعمل خارج البيت","الاكتفاء بالعلم النظري دون تربية"],"answer":0,"why":"إنَّ الانحراف عنِ الفطرة يجعلُ الإنسانَ يبتعد عن الثوابت الشرعية، ويميلُ عن طريقِ الحقّ؛ ومن أجل ذلك وجبَ على المرأة المسلمة بصفتها صانعةَ هذا الجيل التمسّكُ بالثوابت والعودةُ بأبنائها إلى الطريق المستقيم، بعيدًا عن الضلال والشرك وأصحاب الأهواء.","ref":"ص 8"}],"2":[{"q":"ما نهاية قصة العالِم والطبيب الواردة في الدرس؟","options":["اعترف الطبيب بأنه يعرف وظيفة الإنسان","أجاب العالم عن سؤال الوظيفة بنفسه","قال العالم للطبيب: ألا تخجل من نفسك، تعرف وظيفة حذائك ولا تعلم وظيفة وجودك!!","انصرف العالم دون أن يعلّق"],"answer":2,"why":"سأل العالم الطبيب عن وظيفة أعضاء الجسم، ثم عن وظيفة الإنسان فأجاب الطبيب أن هذا السؤال ليس عنده وأنه ليس تخصصه، فسأله عن وظيفة حذائه فأجابه: التنقل! فقال العالم: «ألا تخجل من نفسك، تعرف وظيفة حذائك ولا تعلم وظيفة وجودك!!».","ref":"ص 2"},{"q":"بحسب الدرس، ما وظيفة العبد في هذه الحياة؟","options":["أن يجمع المال ويتمتع بالحياة","أن يكون منغمسًا في العبودية لربّ العالمين، وأن يحقّق العبودية وألّا ينحرف عن هذا المسار إلى أن يلقى الله","أن يحصّل أعلى درجات العلم الظاهر","أن يعيش بلا غاية محددة"],"answer":1,"why":"فوظيفةُ العبد أن يكون منغمسًا في العبودية لربّ العالمين، وأن يحقّق العبودية وألّا ينحرف عن هذا المسار إلى أن يلقى الله ﷻ؛ قال تعالى: ﴿وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ﴾.","ref":"ص 3"},{"q":"أي مما يلي من الفروق بين العبد وسيده في صورة السيد وعبيده بحسب الدرس؟","options":["اتّسام العبد بالطاعة والاستسلام، والتقرّب للسيد ومحاولة إرضائه، والإذعان له وملازمته، والاعتماد عليه في معيشته","اتسام العبد بالتمرد على السيد","استغناء العبد عن سيده","إهمال العبد لأمر سيده"],"answer":0,"why":"ومن بين الفروق في صورة السيّد وعبيده: اتّسام العبد بالطاعة والاستسلام، والتقرُّب للسيد ومحاولة إرضائه، والإذعان للسيّد وملازمته له والسعي لطلب مرضاته، والاعتماد على السيّد في معيشته.","ref":"ص 3"},{"q":"ما الاعتراف بحسب الدرس؟","options":["اعتراف العبد بذنوبه فقط","الاعتزاز بالدين","التصديق بأمر الله دون تلكؤ","اعتراف العبد بهويّته، وهو أوّل الأبواب للدخول تحت مقام العبودية"],"answer":3,"why":"الاعتراف: هو اعتراف العبد بهويّته، وهو أوّلُ الأبواب للدُّخول تحت هذا المقام العظيم.","ref":"ص 4"},{"q":"ماذا يعني قول «لا إله إلا الله، محمد رسول الله» بحسب الدرس؟","options":["لا يُطاع أحد في الأرض","لا يُتبع إلا العلماء","لا معبود بحق إلا الله المالك الحقيقي للكون، فلا يخرج العبد عن أمره، ولا متبوع بحق إلا الرسول ﷺ","لا معبود إلا الله فقط دون الحاجة لاتباع الرسول"],"answer":2,"why":"الاعتراف بـ«لا إله إلا الله» أي: لا معبودَ بحقٍّ إلا الله ﷻ، هو المالكُ الحقيقيُّ للكون، فلا يخرجُ العبدُ عن أمره، و«أنَّ محمدٌ رسول الله» أي: لا متبوعَ بحقٍّ إلا الرسولُ ﷺ.","ref":"ص 5"},{"q":"ما أول لوازم الاعتراف بحسب الدرس؟","options":["الاعتماد على النفس","الاعتزاز بالدين؛ فالاعتزاز لا يكون إلا بالدين","الإعراض عن الأوامر","التفلت من التكاليف"],"answer":1,"why":"من لوازم الاعتراف: ١. الاعتزاز؛ ﴿وَلِلَّهِ الْعِزَّةُ وَلِرَسُولِهِ وَلِلْمُؤْمِنِينَ﴾، والاعتزاز لا يكون إلا بالدين؛ فلا تخجلي أن تخرجي بحجابك الكامل، فاعتزازك بحجابك الذي فرضه الله تعالى على المسلمة شرفٌ وفخر.","ref":"ص 5"},{"q":"ما أساسيات الإذعان والخضوع بحسب الدرس؟","options":["غاية الذل لله وغاية الحب له؛ وهما ثمرة التفكر بين الخالق والمخلوق","غاية الغنى وغاية القوة","غاية العلم وغاية العمل","غاية الشك وغاية التردد"],"answer":0,"why":"قال العلماء: «في أساسيّات الإذعان والخضوع شيئان: غاية الذُّل لله، وغاية الحبّ له؛ وهما ثمرة التفكُّر بين الخالق والمخلوق».","ref":"ص 6"},{"q":"ما الفرق بين منهاج سيدنا إبراهيم عليه السلام ومنهاج اليهود بحسب الدرس؟","options":["منهاج إبراهيم «سمعنا وعصينا» ومنهاج اليهود «سمعنا وأطعنا»","كلاهما «سمعنا وأطعنا»","كلاهما «سمعنا وعصينا»","منهاج إبراهيم عليه السلام «سمعنا وأطعنا»، ومنهاج اليهود منذ القِدم «سمعنا وعصينا»"],"answer":3,"why":"«سمعنا وأطعنا» هو منهاج سيّدنا إبراهيم عليه السلام، بينما كان منهاج اليهود منذ القِدم «سمعنا وعصينا».","ref":"ص 7"},{"q":"أي مما يلي من ملامح أصحاب منهاج «سمعنا وأطعنا» بحسب الدرس؟","options":["التسويف والتأجيل","الجدال في الأوامر","التوبة، والمسارعة بالسمع والطاعة، والتصديق بأمر الله دون تلكؤ وتباطؤ","التأويل لإسقاط التكاليف"],"answer":2,"why":"ملامح أصحاب منهاج «سمعنا وأطعنا»: التوبة، المسارعة بالسمع والطاعة، التصديق بأمر الله تعالى وتقديمه دون تلكؤ وتباطؤ.","ref":"ص 7"},{"q":"ما مواصفات الطاعة التي يدخل تحتها حديث النبي ﷺ لعبد الله بن رواحة: «زادك الله حرصًا على طواعية الله وطواعية رسوله»؟","options":["الشمولية","الفور؛ أي منهج التلقّي مباشرةً فالتنفيذ","الاتباع","الإخلاص"],"answer":1,"why":"الفور: أي منهج التلقّي مباشرةً فالتنفيذ، وقد ورد في الحديث أنه ﷺ كان يخطب فدخل عبد الله بن رواحة، فسمعه يقول: «اجلسوا»، فجلس مكانه خارج المسجد، فلما فرغ قال له: «زادك الله حرصًا على طواعية الله وطواعية رسوله».","ref":"ص 8"}],"3":[{"q":"ما المقصود بمركزية الاتباع بحسب الدرس؟","options":["اتباع العادات والتقاليد السائدة","اتباع آراء الناس والأهواء","الاكتفاء بحب النبي ﷺ دون اتباعه","السير على نهج رسول الله ﷺ، واتباع خطاه كما أمر الله تعالى، بمقتضى شهادة أن محمدًا رسول الله"],"answer":3,"why":"تعني مركزية الاتباع: السير على نهج رسول الله ﷺ، واتباع خطاه كما أمر الله تعالى، بمقتضى شهادة أن محمدًا رسول الله ﷺ، وهي مركزية المسلم التي ينبغي أن تكون من ضمن ثوابته التي لا يحيد عنها.","ref":"ص 2"},{"q":"ماذا قال النبي ﷺ عن غربة الإسلام في الحديث الوارد في الدرس؟","options":["«بدأ الإسلام قويًّا وسيبقى كذلك»","«بدأ الإسلام غريبًا وسيبقى غريبًا إلى الأبد»","«بدأ الإسلام غريبًا، وسيعود كما بدأ غريبًا، فطوبى للغرباء»","«بدأ الإسلام ظاهرًا وسيعود خفيًّا»"],"answer":2,"why":"قال النبي ﷺ كما في مسند الإمام أحمد وصحيح مسلم: «بدأ الإسلام غريبًا، وسيعود كما بدأ غريبًا، فطوبى للغرباء»؛ والمرأة التي تسير على السنّة في هذا الزمان غريبة، فطوبى لها.","ref":"ص 2"},{"q":"بأي آية زكّى الله تعالى أخلاق النبي ﷺ بحسب الدرس؟","options":["﴿مَا زَاغَ الْبَصَرُ وَمَا طَغَىٰ﴾","﴿وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٍ﴾","﴿أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ﴾","﴿وَرَفَعْنَا لَكَ ذِكْرَكَ﴾"],"answer":1,"why":"زكّاه الله في بصره: ﴿مَا زَاغَ الْبَصَرُ وَمَا طَغَىٰ﴾، وفي عقله: ﴿مَا ضَلَّ صَاحِبُكُمْ وَمَا غَوَىٰ﴾، وفي صدره: ﴿أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ﴾، وفي ذكره: ﴿وَرَفَعْنَا لَكَ ذِكْرَكَ﴾، وفي أخلاقه: ﴿وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٍ﴾.","ref":"ص 3"},{"q":"ماذا قال النبي ﷺ في حديث أبي هريرة رضي الله عنه عمّن يدخل الجنة من أمته؟","options":["«كل أمتي يدخلون الجنة إلا من أبى»، قيل: ومن يأبى؟ قال: «من أطاعني دخل الجنة، ومن عصاني فقد أبى»","«كل أمتي يدخلون الجنة بلا استثناء»","«لا يدخل الجنة إلا من حفظ القرآن كله»","«كل أمتي يدخلون النار إلا من أطاعني»"],"answer":0,"why":"قال ﷺ: «كل أمتي يدخلون الجنة إلا من أبى»، قالوا: يا رسول الله، ومن يأبى؟ قال: «من أطاعني دخل الجنة، ومن عصاني فقد أبى» (أخرجه البخاري).","ref":"ص 3–4"},{"q":"كم موضعًا أمر الله فيه بطاعة النبي ﷺ في القرآن بحسب كلام الإمام أحمد الوارد في الدرس؟","options":["في موضعين فقط","في عشرة مواضع","في ثلاثة مواضع","في أكثر من سبعين موضعًا"],"answer":3,"why":"قال الإمام أحمد رحمه الله: «أمر الله بطاعته -أي النبي ﷺ- في أكثر من سبعين موضعًا في القرآن».","ref":"ص 4"},{"q":"ما قول ابن القيم رحمه الله في «التوحيدين» اللذين لا نجاة للعبد من عذاب الله إلا بهما؟","options":["توحيد الربوبية وتوحيد الألوهية فقط","توحيد الأسماء وتوحيد الصفات فقط","توحيد المُرسِل (الله سبحانه وتعالى)، وتوحيد متابعة الرسول ﷺ","توحيد القلب وتوحيد اللسان"],"answer":2,"why":"قال ابن القيم: «هما توحيدان لا نجاة للعبد من عذاب الله إلا بهما: توحيد المُرسِل -أي الله سبحانه وتعالى- وتوحيد متابعة الرسول ﷺ».","ref":"ص 4"},{"q":"ماذا قال ابن عباس رضي الله عنهما في تفسير قوله تعالى: ﴿يَوْمَ تَبْيَضُّ وُجُوهٌ وَتَسْوَدُّ وُجُوهٌ﴾؟","options":["تبيض وجوه أهل الغنى وتسود وجوه الفقراء","«تبيضّ وجوه أهل السنّة والجماعة، وأمّا الذين اسودّت وجوههم فأهل البدع والضلالة»","تبيض وجوه الحكام وتسود وجوه المحكومين","تبيض وجوه الرجال وتسود وجوه النساء"],"answer":1,"why":"قال تعالى: ﴿يَوْمَ تَبْيَضُّ وُجُوهٌ وَتَسْوَدُّ وُجُوهٌ﴾، قال ابن عباس: «تبيضّ وجوه أهل السنّة والجماعة، وأمّا الذين اسودّت وجوههم فأهل البدع والضلالة».","ref":"ص 5"},{"q":"بماذا أوصى النبي ﷺ في حديث العرباض بن سارية رضي الله عنه حين رأى أصحابه اختلافًا كثيرًا بعده؟","options":["فعليكم بسنتي وسنة الخلفاء الراشدين المهديين من بعدي، تمسّكوا بها وعضّوا عليها بالنواجذ، وإياكم ومحدثات الأمور؛ فإن كل بدعة ضلالة","فعليكم بآراء العلماء وحدها","فعليكم بما اعتاده الناس","فعليكم بالسكوت وترك الاتباع"],"answer":0,"why":"في حديث العرباض بن سارية: «أوصيكم بالسمع والطاعة... فعليكم بسنتي وسنة الخلفاء الراشدين المهديين من بعدي، تمسكوا بها، وعضوا عليها بالنواجذ، وإياكم ومحدثات الأمور؛ فإن كل بدعة ضلالة» (أخرجه أبو داود).","ref":"ص 5"},{"q":"بماذا استجابت نساء الأنصار حين قال النبي ﷺ للنساء: «استأخرن؛ فإنه ليس لكن أن تحقُقن الطريق، عليكن بحافات الطريق»؟","options":["لم يلتزمن بالأمر","ناقشن الأمر طويلًا قبل تنفيذه","امتنعن عن الخروج من بيوتهن نهائيًّا","التصقت المرأة بالجدار حتى إن ثوبها ليتعلّق بالجدار من لصوقها به"],"answer":3,"why":"استجابت النساء للأمر النبوي؛ «فكانت المرأة تلتصق بالجدار، حتى إن ثوبها ليتعلّق بالجدار من لصوقها به»؛ من شدة التزامهن بأمر النبي ﷺ.","ref":"ص 7"},{"q":"بحسب الدرس، ما الأمور الثلاثة التي يحصل بها تطبيق السيرة والأخلاق؟","options":["الحفظ، والتسميع، والمراجعة","الصبر، والشكر، والرضا","المعرفة، والمحبة، والاتباع","القراءة، والاستماع، والمذاكرة"],"answer":2,"why":"يحصل تطبيق السيرة والأخلاق من خلال ثلاثة أمور: المعرفة، المحبة، الاتباع.","ref":"ص 8"}],"4":[{"q":"ما الدليل الذي استنبطه القرطبي من قوله تعالى: ﴿شَهِدَ اللَّهُ أَنَّهُ لَا إِلَٰهَ إِلَّا هُوَ وَالْمَلَائِكَةُ وَأُولُو الْعِلْمِ﴾؟","options":["دليل على فضل العلم وشرف العلماء وفضلهم؛ إذ لو كان أحدٌ أشرف من العلماء لقرنهم الله باسمه واسم ملائكته","أن العلم خاص بالملائكة","أن العلماء لا يحتاجون إلى العمل","أن العلم لا فضل له على العبادة"],"answer":0,"why":"قال القرطبي: «في هذه الآية دليلٌ على فضل العلم وشرف العلماء وفضلهم؛ فإنه لو كان أحدٌ أشرف من العلماء لقرَنهم الله باسمه واسم ملائكته كما قرَن اسمَ العلماء».","ref":"ص 2"},{"q":"ما الذي استدل به الدرس من قوله تعالى: ﴿وَقُل رَّبِّ زِدْنِي عِلْمًا﴾ على شرف العلم؟","options":["أن العلم أمر خاص بالأنبياء","أن النبي ﷺ لم يكن عالمًا","أن العلم لا حاجة إليه","أنه لو كان شيء أشرف من العلم لأمر الله نبيه ﷺ أن يسأله المزيد منه كما أُمر أن يستزيد من العلم"],"answer":3,"why":"وقال في شرف العلم لنبيه ﷺ: ﴿وَقُل رَّبِّ زِدْنِي عِلْمًا﴾، فلو كان شيءٌ أشرف من العلم لأمر الله نبيَّه ﷺ أن يسأله المزيد منه كما أمر أن يستزيد من العلم.","ref":"ص 2"},{"q":"ما الأحكام الثلاثة التي استنبطها الحافظ ابن حجر من حديث «من يرد الله به خيرًا يفقهه في الدين»؟","options":["وجوب الجهاد، وفضل الصدقة، وفضل الصيام","وجوب الصلاة، ووجوب الزكاة، ووجوب الحج","فضل التفقه في الدين، وأن المُعطي في الحقيقة هو الله، وأن بعض هذه الأمة يبقى على الحق أبدًا","فضل الغنى، وفضل القوة، وفضل الشجاعة"],"answer":2,"why":"قال الحافظ ابن حجر: «هذا الحديث مشتمل على ثلاثة أحكام، أحدها فضل التفقه في الدين، وثانيها أن المعطي في الحقيقة هو الله، وثالثها أن بعض هذه الأمة يبقى على الحق أبدًا».","ref":"ص 3"},{"q":"ما الذي أوصى به علي رضي الله عنه كُمَيْل بن زياد النخعي في فضل العلم على المال؟","options":["أن المال خير من العلم لأنه يحمي صاحبه","أن العلم خير من المال؛ العلم يحرسك وأنت تحرس المال، والعلم يزكو على الإنفاق، والمال تنقصه النفقة","أن العلم والمال سواء","أن العلم ينقص بالإنفاق والمال يزكو"],"answer":1,"why":"أوصى عليٌّ رضي الله عنه كُمَيْل بن زياد النخعي بقوله: «يا كُمَيْلُ، العلمُ خيرٌ من المال؛ العلمُ يحرسُك وأنت تحرسُ المال، والعلمُ يزكو على الإنفاق، والمالُ تنقصُه النفقةُ، ومنفعةُ المال تزول بزواله».","ref":"ص 4"},{"q":"ما قصة رحلة جابر بن عبد الله رضي الله عنه في طلب الحديث بحسب الدرس؟","options":["رحل إلى بلاد الشام مسيرة شهر ليسمع حديثًا واحدًا من عبد الله بن أُنيس رضي الله عنه","رحل إلى مصر ليسمع حديثًا من عقبة بن عامر","رحل إلى مكة ليسمع خطبة النبي ﷺ","رحل إلى العراق ليتعلم الفقه"],"answer":0,"why":"كان بعضهم يرحل من أجل حديثٍ واحدٍ؛ لإدراكهم فضل العلم ومنزلته، فقد رحل جابر بن عبد الله رضي الله عنه إلى بلاد الشام مسيرة شهر ليسمع حديثًا واحدًا من عبد الله بن أُنيس وهو قوله ﷺ: «يُحشر الناس يوم القيامة حفاة عراة غرلًا» (متفق عليه).","ref":"ص 4"},{"q":"ماذا قال الدرس عمّا يحدث في البيت إذا أدخلت المرأة المسلمة العلم النافع إليه؟","options":["يصبح مكانًا للهو والغناء","لا يتغير شيء في البيت","يصبح مكانًا للجدل والخصام","يتحوّل إلى روضة من رياض المغفرة، وبستان من بساتين المعرفة، وحديقة للحسنات"],"answer":3,"why":"إذا أدخلت المرأة المسلمة العلم النافع لبيتها تحوّل إلى روضةٍ من رياض المغفرة، وبستانٍ من بساتين المعرفة، وحديقةٍ للحسنات؛ لأنه يجعلها تزداد علمًا وفهمًا لأمور الدين.","ref":"ص 5"},{"q":"كيف قسّم الإمام ابن قدامة العلوم الشرعية بحسب الدرس؟","options":["إلى فقه وحديث وتفسير فقط","إلى علوم عقلية وعلوم نقلية","إلى أصول، وفروع، ومقدّمات، ومتمّمات","إلى علوم واجبة وعلوم مباحة"],"answer":2,"why":"قسّم الإمام ابن قدامة العلوم الشرعية إلى أصول، وفروع، ومقدمات، ومتمّمات؛ فالأصول: كتاب الله، وسنة رسوله ﷺ، وإجماع الأمة، والفروع ما فُهم من هذه الأصول، والمقدمات تجري مجرى الآلات مثل علم النحو واللغة، والمتمّمات هي علم القراءات والتفسير وغيرها.","ref":"ص 6"},{"q":"ما الحقوق التي ينبغي أن تهتم بها المسلمة في القرآن الكريم بحسب الدرس؟","options":["السرعة، والتكرار، والترتيب، والغناء","الفهم، والتلاوة، والتدبر والاستنباط، والحفظ","الكتابة فقط","الاستماع في رمضان فقط"],"answer":1,"why":"للقرآن حقوقٌ كثيرة ينبغي أن تهتمّ بها المسلمة: الفهم، التلاوة (أن تقرأ القرآن قراءة صحيحة)، التدبر والاستنباط، الحفظ (فمن كانت حافظة تحرص أن يكون أبناؤها حفظة لكتاب الله أيضًا).","ref":"ص 7"},{"q":"ما طرق طلب العلم الشرعي المذكورة في الدرس؟","options":["القراءة، والاستماع، والمذاكرة","الحفظ، والتسميع، والتكرار","الكتابة، والنسخ، والتصوير","الجدال، والمناظرة، والمحاورة"],"answer":0,"why":"من طرق طلب العلم الشرعي: ١. القراءة، ٢. الاستماع (إن لم يكن لدى المرأة وقتٌ للقراءة فالاستماع وسيلة نافعة)، ٣. المذاكرة (وهي تدارس العلوم الشرعية بين الأخوات المسلمات).","ref":"ص 8"},{"q":"كم حديثًا روت عائشة رضي الله عنها عن رسول الله ﷺ بحسب الدرس؟","options":["أكثر من مئة حديث","أكثر من عشرة آلاف حديث","حديثًا واحدًا فقط","أكثر من ألفي حديث"],"answer":3,"why":"كانت زوجات النبي ﷺ يطلبن العلم، بل كانت منهن عالمات بالدين، فقد روت عائشة رضي الله عنها أكثر من ألفي حديث عن رسول الله ﷺ، وكذلك روت عنه أم سلمة وأم سليم وغيرهن من الصحابيات.","ref":"ص 6"}],"5":[{"q":"كم عدد الآيات التي وردت في كتاب الله تتحدث عن الأسرة بحسب الدرس؟","options":["50 آية","146 آية، وجاءت سور كاملة متعلقة بالأسرة مثل: النساء والطلاق والمجادلة","300 آية","10 آيات"],"answer":1,"why":"ورد في كتاب الله ﷻ 146 آية تتحدث عن الأسرة، وجاءت سورٌ كاملة متعلقة بالأسرة، مثل: سورة النساء، سورة الطلاق، سورة المجادلة الت
