/* Layout: خلفية زرقاء بصورة باهتة من دليل الهوية على اليسار، عناوين بيضاء مباشرة عليها، وبطاقات وردية فاتحة للمحتوى. أزرار وردية وسماوية فاتحة. */
:root {
  --bg: #023373;
  --on-dark: #FFFFFF;
  --on-dark-soft: #CFE0F5;
  --on-dark-pink: #FBC4D8;
  --surface: #FDEFF4;
  --surface-2: #FFF8FB;
  --ink: #023373;
  --ink-soft: #4A5F86;
  --line: #F2C2D5;
  --navy-tint: #DCE3F0;
  --pink: #F280AA;
  --pink-ink: #B03A67;
  --pink-tint: #F9C9DB;
  --cyan: #38B5DA;
  --cyan-ink: #0B6F93;
  --cyan-tint: #D8EFF8;
  --btn-pink: #F9C9DB;
  --btn-pink-hover: #F5B5CC;
  --btn-cyan: #BDE5F3;
  --btn-cyan-hover: #A6DBEE;
  --ok: #1E7A55;
  --ok-tint: #E4F5EC;
  --bad: #A33A3A;
  --bad-tint: #FBE6E6;
  --f-head: 'Alexandria', 'Tajawal', system-ui, sans-serif;
  --f-body: 'Tajawal', 'Alexandria', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.8;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

#root { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding-block: 20px 40px; }
h1, h2, h3 { font-family: var(--f-head); margin: 0; text-wrap: balance; line-height: 1.5; }
p { margin: 0; }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--btn-cyan); outline-offset: 2px; border-radius: 6px; }

/* شريط علوي */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 6px 18px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-head); font-weight: 700; font-size: 17px; color: var(--on-dark); }
.brand img { height: 44px; width: auto; }
.topbar .slogan { color: var(--on-dark-pink); font-family: var(--f-head); font-weight: 500; font-size: 14px; }

/* هيرو على الخلفية الزرقاء مباشرة */
.hero { position: relative; padding: 28px 4px 10px; }
.hero::before {
  content: ""; position: absolute; inset-block-start: 4px; inset-inline-start: 0;
  width: 150px; height: 96px;
  background-image: radial-gradient(var(--cyan) 1.6px, transparent 1.7px);
  background-size: 16px 16px; opacity: .6; pointer-events: none;
}
.hero h1 { position: relative; color: var(--on-dark); font-weight: 700; font-size: clamp(30px, 6vw, 50px); }
.hero .lead { position: relative; margin-top: 10px; max-width: 46ch; color: var(--on-dark-soft); font-size: 18px; }
.hero .motto { position: relative; margin-top: 14px; font-family: var(--f-head); font-weight: 500; color: var(--on-dark-pink); font-size: 17px; }
.hero .rule { position: relative; width: 72px; height: 5px; background: var(--pink); border-radius: 3px; margin-top: 18px; }

/* بحث */
.search { position: relative; margin-top: 22px; max-width: 560px; }
.search label { display: block; font-family: var(--f-head); font-weight: 500; font-size: 15px; margin-bottom: 6px; }
.hero .search label { color: var(--on-dark); }
.search input {
  width: 100%; padding: 12px 16px; border-radius: 12px;
  border: 1.5px solid #E4DFC8; color: var(--ink); min-height: 48px;
  background-color: #F2EFE2;

  var QBANK = {"s1":{"1":[{"q":"بحسب المحاضرة، كيف تنظر الثقافة الغربية الشاذّة إلى النفس الإنسانية؟","options":["جزء مادي وجزء آخر غير مادي كما بيّن الإسلام","روح خالصة لا علاقة لها بالجسد","عمليات عقلية فقط: مدخلات تُنتج مخرجات بشكل مادي بحت","غرائز فطرية لا تتأثر بالتربية"],"answer":2,"why":"ترى هذه الثقافة أن النفس عمليات عقلية تتلقى مدخلات وتنتج مخرجات بشكل مادي بحت، إلا أن النفس في الحقيقة أعقد من هذا التصور المتطرف.","ref":"ص 2"},{"q":"ما فائدة الاعتقاد بأن أول إنسان هو آدم عليه السلام كما ورد في المحاضرة؟","options":["يعطي قراءة جيدة للتاريخ وللصراع بين أنصار الرحمن وأتباع الشيطان، وفهمًا عميقًا لاحتياجات النفس","يثبت أن الإنسان تطوّر عن كائن آخر عبر الزمن","يجعل النفس مجرد عمليات مادية بحتة","يُغني عن الوحي في فهم النفس"],"answer":0,"why":"اعتقاد أن الإنسان الأول هو آدم يعطي قراءة جيدة للتاريخ وللصراع القائم في الكون، وفهمًا عميقًا لاحتياجات النفس وأمراضها وعلاقتها بالوحي وبالدنيا والآخرة.","ref":"ص 2"},{"q":"عندما رأى إبليس آدم عليه السلام قبل نفخ الروح فيه، ما نقطة الضعف التي عرفها؟","options":["أنه سريع النسيان","أنه لا يعرف عدوّه","أنه يغترّ بقوته","أن جسده فارغ بحاجة إلى أن يُملأ؛ فإن لم يُملأ بالخير امتلأ بالشر"],"answer":3,"why":"جاء في الحديث أن إبليس لما رآه أجوف عرف أنه خُلق خلقًا لا يتمالك؛ فالجسد فارغ بحاجة إلى أن يُملأ، وإذا لم يُملأ بالخير سيمتلئ بالشر.","ref":"ص 3"},{"q":"حين عطس آدم عليه السلام وقال «الحمد لله»، ماذا قال له ربه سبحانه؟","options":["اسكن أنت وزوجك الجنة","يرحمك الله يا آدم","اتق الله حيث كنت","لا تقربا هذه الشجرة"],"answer":1,"why":"جاء في الحديث أن الله قال له: «يرحمك الله يا آدم»، وكانت أول كلمة سمعها آدم من ربه، و«الحمد لله» هي الكلمة التي تبدأ بها سورة الفاتحة.","ref":"ص 3"},{"q":"ماذا يدل سجود الملائكة لآدم على علاقة النفس بالملائكة؟","options":["علاقة عداوة وتنافس","علاقة خوف وحذر","علاقة تكريم وتشريف امتثالًا لأمر الله","علاقة تساوٍ في المنزلة"],"answer":2,"why":"كُرّم الإنسان بسجود الملائكة امتثالًا لأمر الله، فعلاقة النفس بالملائكة علاقة تكريم وتشريف، وقد كرّموا هذه النفس واحترموها لأن الله أمرهم بذلك.","ref":"ص 3"},{"q":"ما سبب العداوة التي بدأت بين الشيطان والنفس الإنسانية؟","options":["تكبّر إبليس وحسده من تكريم الله لآدم","رغبة آدم في الخلود","عصيان آدم لأمر ربه فقط","خلق الأنثى من الذكر"],"answer":0,"why":"بدأت العداوة بسبب تكبّر إبليس وحسده من تكريم الله للنفس، فهو يعمل للانتقام منها ولا يتحقق ذلك إلا باتباعها الهوى وعدم اتباعها لأمر الله.","ref":"ص 4"},{"q":"ما وظيفة العقل بالنسبة إلى النفس بحسب المحاضرة؟","options":["يرغّبها ويرهّبها","يرشدها ويوجّهها","يضعفها ويخدعها","يجعلها تهوى وتخطئ"],"answer":1,"why":"الراجح أن الروح تنقسم إلى قوتين: قوة النفس وقوة العقل؛ فالنفس هي التي ترغب وترهب، والعقل يرشدها ويوجّهها.","ref":"ص 5"},{"q":"أي التصرفات التالية يوافق المنهج الوقائي في التعامل مع النفس؟","options":["أن تعرّض المرأة نفسها للفتنة لتختبر قوة إرادتها","الاعتماد على الإرادة وحدها عند مواجهة الفتن","تأجيل التعامل مع الفتن حتى تقع","الابتعاد عن مواطن الفتن ووضع النفس في بيئة تسهّل عليها أداء واجباتها"],"answer":3,"why":"منهج الإسلام وقائي، يدعو إلى وضع النفس في بيئة يسهل عليها النجاح في أداء واجباتها، فالنفس ضعيفة وكلما اقتربت من مواطن الفتن فُتنت أكثر.","ref":"ص 5"},{"q":"أي العبارات التالية تمثّل منهج آدم عليه السلام بعد ارتكابه الخطأ؟","options":["نسبة الخطأ إلى القدر وعدم تحمّل المسؤولية","إخفاء الخطأ والتظاهر بأنه لم يقع","الاعتراف بالخطأ والتوبة: «ربنا ظلمنا أنفسنا وإن لم تغفر لنا وترحمنا لنكونن من الخاسرين»","تأجيل التوبة حتى يتضح سبب الخطأ"],"answer":2,"why":"منهج آدم عليه السلام هو الاعتراف بالخطأ وطلب المغفرة، وهو أكثر ما يقوّي العقل والنفس المطمئنة، أما منهج إبليس فنسبة الخطأ إلى القدر.","ref":"ص 6"},{"q":"ما مسؤولية الأم تجاه أخطاء أولادها وزوجها بحسب المحاضرة؟","options":["ليست مسؤولة عن أخطائهم، لكنها مسؤولة عن تعاملها معها بشكل سليم","مسؤولة عن أخطائهم كلها مسؤولية كاملة","غير مسؤولة عنها ولا عن طريقة تعاملها معها","مسؤولة فقط عن أخطاء أولادها دون زوجها"],"answer":0,"why":"التعامل مع الأخطاء يشمل أخطاء النفس وأخطاء من يحيط بها أيضًا؛ فالأم ليست مسؤولة عن أخطاء أولادها وزوجها، لكنها مسؤولة عن تعاملها معها بشكل سليم.","ref":"ص 6"}],"2":[{"q":"ما المقصود بـ«قانون الجذب» كما عُرض في المحاضرة؟","options":["أن الأسباب الشرعية تجلب النتائج بإذن الله","أن مجرد التفكير بشيء أو تصوّره بقوة كافٍ لجذب نتائجه إلى الواقع","أن العمل الجاد وحده يضمن تحقق كل ما يتمناه الإنسان","أن الدعاء يغني عن الأخذ بالأسباب"],"answer":1,"why":"هو مفهوم شائع لا يقوم على أساس علمي صحيح، وفكرته أن مجرد التفكير بشيء أو تصوّره بقوة كافٍ لجذب النتائج، عبر ما يسمّى «ذبذبات» تصدر من الدماغ وتتواصل مع الكون.","ref":"ص 2"},{"q":"لماذا يُعدّ قانون الجذب مخالفًا للسنن الإلهية بحسب المحاضرة؟","options":["لأنه يدعو إلى كثرة الدعاء","لأنه يطلب من الإنسان أن يسعى ويعمل","لأنه يجعل الإنسان يعتمد على الناس","لأن الله ربط النتائج بأسبابها وأمر بالسعي والعمل، ولا يعطي بالأماني المجردة"],"answer":3,"why":"الله تعالى حكيم جعل لهذا الكون سننًا ثابتة لا تتحقق فيها النتائج إلا بأسبابها، وهو سبحانه لا يُعطي بالأماني وإنما يُعطي من أخذ بالأسباب وسلك طريقها.","ref":"ص 3"},{"q":"امرأة تجلس كل يوم تتخيّل أن مشروعها سينجح، وتعتقد أن ذلك سيأتيها دون أي سعي أو عمل. أيّ وصف يناسب موقفها بحسب المحاضرة؟","options":["اتكال على الأماني بدل الأخذ بالأسباب، وهو ما يخالف التوكل الصحيح","توكّل صحيح على الله","أخذ بالأسباب الشرعية","صبر محمود على الابتلاء"],"answer":0,"why":"هذه الخرافة تضعف قيمة السعي والعمل، وتغرس في النفس الاتكال على الأماني والتصورات الذهنية بدل الأخذ بالأسباب، وهو ما يُعرف في ثقافتنا الإسلامية بالتواكل.","ref":"ص 4"},{"q":"ما فكرة «قانون الوفرة» كما وردت في المحاضرة؟","options":["أن الرزق لا يتحقق إلا بالعمل المتواصل","أن الله يرزق من يشاء من أبواب متعددة","أن الإنسان يستطيع استجلاب النعم والنجاحات بمجرد تغيير طريقة تفكيره وتبنّي قناعات معينة، مع التقليل من شأن السنن والأسباب","أن النعم تأتي بالصبر والدعاء فقط"],"answer":2,"why":"يُعدّ «قانون الوفرة» امتدادًا للأفكار المرتبطة بقانون الجذب، إذ يقوم على فكرة أن الإنسان يستطيع استجلاب النعم والنجاحات بمجرد تغيير طريقة تفكيره، مع التقليل من شأن السنن الإلهية والأسباب الواقعية.","ref":"ص 4"},{"q":"ما أبرز خطورة خرافة قانون الجذب على النفس البشرية؟","options":["أنها تجعل النفس أكثر انشغالًا بالعمل","أنها تبثّ آمالًا وأوهامًا لا تقوم على أسس صحيحة فتعرّض صاحبها لخيبات أمل متكررة، وتضعف قيمة السعي والعمل","أنها تدفع الإنسان إلى الإكثار من الأسباب الشرعية","أنها تقوّي علاقة الإنسان بربه"],"answer":1,"why":"تكمن خطورتها في أنها تبثّ في الإنسان آمالًا وأوهامًا لا تقوم على أسس صحيحة، مما يجعله عرضة لخيبات أمل متكررة، كما أنها تضعف قيمة السعي والعمل.","ref":"ص 4"},{"q":"لماذا تُعدّ فكرة تصفية الذهن من كل الأفكار في اليوغا خاطئة بحسب المحاضرة؟","options":["لأنها تُتعب الجسد","لأنها تحتاج إلى وقت طويل","لأنها تمنع الإنسان من الكلام مع الناس","لأن الإنسان كلما فرّغ عقله وتفكيره كان أكثر عرضة لتلبّس الشياطين، والمعنى المراد بها في نفسه كفري وشركي"],"answer":3,"why":"معنى اليوغا الاتصال بالعقل الكلي أو الطبيعة الخارقة، وهو في نفسه كفري وشركي، وهو قائم على تصفية الذهن من كل الأفكار، وهذا كذب لأن من فرّغ عقله كان أكثر عرضة لتلبّس الشياطين.","ref":"ص 5"},{"q":"وقعت مسلمة في زلّة في خلوتها. ما التصرف الأنسب بحسب نشاط «حجاب النفس»؟","options":["أن تتحدث بها في مجالس الصديقات تلقائيةً وصدقًا مع النفس","أن تتجاهلها تمامًا دون توبة","أن تستتر وتعترف بالخطأ سرًّا بينها وبين الله طلبًا للمعافاة والتوبة","أن تُظهرها للناس ليتقبّلوها كما هي"],"answer":2,"why":"النشاط يدرّب المسلمة على التمييز بين الصدق المحمود والمجاهرة المذمومة، فإذا وقعت في زلة في خلوتها فلا تتحدث بها في مجالس الصديقات كنوع من التلقائية، بل تستتر وتعترف بخطئها سرًّا بينها وبين الله.","ref":"ص 7"},{"q":"بحسب المحاضرة، ما مصدر القوة الأعظم عند الثقافة الغربية؟","options":["النفس (تأليه النفس)","الطبيعة","الله تعالى","العقل الكلي"],"answer":0,"why":"مصدر القوة الأعظم عند الديانات الشرقية هو الطبيعة، أما عند الثقافة الغربية فهو النفس (يؤلّهون النفس)، بينما مصدره عند المسلمين هو الله تعالى نستعين به مع الأخذ بالأسباب.","ref":"ص 5"},{"q":"ما الخطأ في خرافة «كن أنت» رغم أن جزءًا منها صحيح؟","options":["أنها تطلب من الإنسان أن يضبط كلامه","أنها جعلت العفوية معيارًا للقوة، فينطق الإنسان بكل ما يخطر بباله دون وزن لكلامه","أنها تدعو إلى الرفق في العلاقات","أنها تمنع الإنسان من الاعتراف بخطئه"],"answer":1,"why":"هذه الخرافة وإن كان جزء منها صحيحًا إلا أنها جعلته أصلًا ومعيارًا للقوة، وجعلت العفوية صفة قوة وهذا خاطئ؛ فالإنسان ينبغي أن يزن كلامه وردود أفعاله قبل أن تصدر منه.","ref":"ص 6"},{"q":"أيّ الصور التالية تمثّل العفوية المحمودة بحسب المحاضرة؟","options":["أن تقول المرأة كل ما يجول في نفسها ولو جرحت من حولها","أن تتحدث عن كلام تعلم أن زوجها يتحسس منه باسم الصدق مع النفس","المزاح اللطيف الطيب وبعض الصراحة غير المخلّة التي لا يدخل فيها الجهر بالحرام","الجهر بالزلات في مجالس الصديقات"],"answer":2,"why":"العفوية المحمودة هي المزاح اللطيف الطيب وبعض الصراحة غير المخلّة التي لا يدخل فيها الجهر بالحرام، أما العفوية المذمومة فهي سبب للمشكلات الأسرية.","ref":"ص 6"}],"3":[{"q":"ما الذي يجعل مصطلح «تحقيق الذات» خطيرًا بحسب المحاضرة؟","options":["أنه مصطلح قرآني يُساء فهمه","أنه يدعو إلى العمل الجاد فقط","أنه مصطلح مجمل ظاهره الحق وباطنه الشر، يُستخدم في تدمير استعداد الأنثى لأدوارها الرئيسية","أنه يمنع الأنثى من طلب العلم"],"answer":2,"why":"«تحقيق الذات» مصطلح مجمل فيه معانٍ صحيحة ومعانٍ خاطئة، ظاهره فيه الحق وباطنه فيه الشر، وتكمن خطورته في طريقة إسقاطه على الواقع، حيث يُستخدم في تدمير استعداد الأنثى لأدوارها الرئيسية.","ref":"ص 2"},{"q":"من أين نشأ مصطلح «تحقيق الذات» بحسب المحاضرة؟","options":["من مدرسة «الإنسانية» في علم النفس الغربي، حيث وضع ماسلو هرم الاحتياجات وجعل أعلاه تحقيق الذات","من التراث الإسلامي في تزكية النفس","من الحكمة الشرقية القديمة","من علماء التربية المسلمين"],"answer":0,"why":"ظهرت مدرسة «الإنسانية» في ستينيات القرن الماضي تقريبًا، واشتهر من منظّريها «أبراهام ماسلو» الذي رسم هرم الاحتياجات النفسية ووضع أعلاه تحقيق الذات، وهو مصطلح آتٍ من الثقافة الغربية.","ref":"ص 2"},{"q":"كيف انعكس صراع الغرب الطويل مع الكنيسة على مفهوم النجاح لديهم؟","options":["أصبح النجاح الأسري أهم معايير النجاح","أصبح النجاح الجماعي هو المقياس الوحيد","صار النجاح مرتبطًا بالتدين فقط","أصبح النجاح الفردي يحتل مكانة مركزية بينما تراجع الاهتمام بالنجاح الأسري والاجتماعي"],"answer":3,"why":"كان من نتائج صراع الغرب مع الكنيسة ردّ فعل اتجه إلى التحرر من كثير من القيود، فأصبح النجاح الفردي يحتل مكانة مركزية، بينما تراجع الاهتمام بالنجاح الأسري والاجتماعي.","ref":"ص 2–3"},{"q":"كيف انتقلت التصورات الغربية إلى المجتمعات الإسلامية بحسب المحاضرة؟","options":["عبر المدارس الدينية فقط","عبر القوة السياسية والعسكرية، وعبر التأثير الثقافي والإعلامي بواسطة مسوخ المثقفين من أبناء جلدتنا والمنافقين","عبر التجارة وحدها","عبر الهجرة فقط"],"answer":1,"why":"اتسع النفوذ الغربي فانتقلت كثير من هذه التصورات تارةً عبر القوة السياسية والعسكرية، وتارةً عبر التأثير الثقافي والإعلامي والفكري عن طريق مسوخ المثقفين من أبناء جلدتنا والمنافقين والسماعين لهم.","ref":"ص 3"},{"q":"لماذا وُصف تيار «النسوية» في المحاضرة بأنه «المساواة الظالمة»؟","options":["لأنه ساوى بين الرجال والنساء في كل شيء حتى في العبادات","لأنه منع المرأة من العمل","لأنه ساوى بين مختلفين هما الذكر والأنثى","لأنه فضّل الأنثى على الذكر"],"answer":2,"why":"النسوية هي تيار «المساواة الظالمة» لأنها ساوت بين مختلفين: الذكر والأنثى.","ref":"ص 3"},{"q":"ما الأسلوب الذي اتبعه الفوج الثاني من النسوية بحسب المحاضرة؟","options":["تضخيم معاناة المرأة وتشويه أدوارها المنزلية واعتبارها ظلمًا وإهانة، عبر الأفلام والمسلسلات والروايات","الدعوة إلى بقاء المرأة في بيتها","الدعوة إلى تعليم الفتيات فقط","الاهتمام بتربية الأبناء"],"answer":0,"why":"قام الفوج الثاني بتضخيم معاناة المرأة وتشويه أدوارها المنزلية واعتبارها ظلمًا وإهانة عن طريق الأفلام والمسلسلات والروايات، واعتبر أن سبب المعاناة هو بقاؤها في المنزل، فوضعوا حلًّا هو خروجها من المنزل.","ref":"ص 3"},{"q":"أيّ مما يلي يُعدّ من الردود على خرافة «الشهادة سلاح» بحسب المحاضرة؟","options":["أن الجامعات هي المكان الوحيد للعلم النافع","أن كل ما يُدرس في الجامعات مفيد","أن العلم لا قيمة له أصلًا","أن كثيرًا من العلوم التي تُدرس غير مفيدة، وأن أماكن التعليم النافع ليست مقصورة على الجامعات والمدارس"],"answer":3,"why":"من الردود: أن كثيرًا من العلوم التي تُدرس غير مفيدة، وأن أماكن التعليم النافع ليست مقصورة على الجامعات والمدارس، لكن لكل مجتمع حاجته، وتُقدَّر الضرورة بقدرها.","ref":"ص 5"},{"q":"ما الذي تواجهه المرأة التي لا تنجرّ خلف خرافة «تحقيق الذات» بحسب المحاضرة؟","options":["تكريمًا من الاتفاقيات العالمية","عقوبات اجتماعية، فتُعدّ «عاطلة» في المنظمات العالمية وتواجه هجمات مثل «ضيّعت حياتها!» و«فقط أمًّا!»","دعمًا من المجتمع","لا تواجه شيئًا"],"answer":1,"why":"جُهّزت عقوبات اجتماعية لمن لا تنجرّ خلف الخرافة؛ فاعتُبرت المرأة التي تعمل داخل منظومة البيت «عاطلة» في اتفاقية «سيداو» وغيرها، وتواجه هجمات مجتمعية بعبارات مثل: «ضيّعت حياتها!» و«فقط أمًّا!».","ref":"ص 4"},{"q":"كيف تردّ المحاضرة على خرافة «كل الناس تفعل كذا»؟","options":["الأصل في الصواب أن يفعله الأكثرون","الحق لا يُعرف بكثرة السالكين بل بموافقته لشرع الله، وقد وصف القرآن أكثر الناس بصفات مثل: لا يعلمون، ولا يشكرون","كثرة الفاعلين دليل على صحة الفعل","لا ينبغي مخالفة الناس مطلقًا"],"answer":1,"why":"الحق لا يُعرف بكثرة السالكين، بل بموافقته لشرع الله، وقد جاء في القرآن وصف «أكثر الناس» بأنهم لا يعلمون ولا يشكرون ولا يؤمنون، قال تعالى: «قل لا يستوي الخبيث والطيب ولو أعجبك كثرة الخبيث».","ref":"ص 4–5"},{"q":"وفق الاتجاه الرابع من «منازل إياك نعبد»، ما معيار الأفضلية عند حضور الضيف؟","options":["ما يحبّه الله تعالى في ذلك الوقت، فيكون الأولى حسن ضيافته والقيام بحقه","ما كان أشقّ على النفس من الأعمال","الاشتغال بنافلة الصلاة ولو انشغلت عن الضيف","ما كان أسهل على النفس"],"answer":0,"why":"في الاتجاه الرابع يكون العمل على إرضاء الله في كل وقت بحسب وظيفته، فعند حضور الضيف يكون الأولى الانشغال بحسن ضيافته، فليس معيار الأفضلية ما كان أشقّ على النفس أو أسهل، وإنما ما يحبّه الله في ذلك الوقت.","ref":"ص 7"}],"4":[{"q":"ما موقف المحاضرة من عبارة «كلما كان الإنسان أقوى كان أكثر سعادة» و«يجب أن تكون شخصيتك قوية»؟","options":["أصلها موجود في التراث الإسلامي وتُعدّ أساسًا للتربية","هي من مفردات علم النفس الغربي الذي يؤلّه الذات، وأصلها غير موجود في التراث الإسلامي، وهي المظلة التي تُظلّ كل الخرافات","هي حديث نبوي صحيح","هي من علوم التزكية عند السلف"],"answer":1,"why":"أصل هذه الخرافة غير موجود في التراث الإسلامي، وهي المظلة التي تُظلّ كل الخرافات، وهي كذلك من مفردات علم النفس الغربي الذي يؤلّه الذات والإنسان.","ref":"ص 2"},{"q":"أيّ مما يلي يُعدّ من مكوّنات الشخصية القوية في النموذج الغربي بحسب المحاضرة؟","options":["العفو عن الآخرين","مراعاة الرفق والتلطف في العلاقات","التوسط والحكمة في الاستجابة لطلبات الآخرين","فعل ما تريد وقت ما تريد، والانتقام للنفس وعدم العفو عن الآخرين"],"answer":3,"why":"من مكوّنات الشخصية القوية في النموذج الغربي: التعبير وقول «لا» لما لا يعجبها، والوضوح والصراحة، وفرض الرأي والسيطرة على المجالس، وفعل ما تريد وقت ما تريد، وأخذ حق النفس والمبالغة فيه، والانتقام للنفس وعدم العفو عن الآخرين.","ref":"ص 2"},{"q":"ما معنى القوة الحقيقية بحسب «إضاءة» المحاضرة؟","options":["مخالفة الفطرة لإثبات الذات","فرض الرأي في كل موقف","وضع الأشياء في مواضعها؛ فالكمال في حسن توظيف الفطرة لا في مخالفتها","التخلي عن اللين والسهولة"],"answer":2,"why":"القوة الحقيقية هي وضع الأشياء في مواضعها، والأنوثة في حقيقتها تدور معانيها حول اللين والسهولة؛ فالكمال ليس في مخالفة الفطرة، وإنما في حسن توظيفها في موضعها الصحيح.","ref":"ص 3"},{"q":"أيّ مما يلي يُعدّ من الانحرافات الموجودة عند بعض المسلمين أو في الفهم الخاطئ المنسوب للإسلام؟","options":["التسامح الدائم ولو في حدود الله تعالى","التوسط والحكمة في الاستجابة لطلبات الآخرين","مراعاة غيرة الزوج بحكمة","الاعتدال في الاستقلالية"],"answer":0,"why":"من هذه الانحرافات: الإفراط في الاستجابة لطلبات الآخرين دون حدود، والمداراة مطلقًا، وإلغاء إرادة الزوجة والأبناء تمامًا، والتسامح الدائم ولو في حدود الله تعالى، مع أن الإسلام يدعو إلى التوسط والحكمة.","ref":"ص 4"},{"q":"لم يتكلم النبي ﷺ عن «قوة الشخصية»، وإنما تكلم عن ماذا؟","options":["القوة البدنية","الإيمان القوي، فالمؤمن القوي خير وأحب إلى الله من المؤمن الضعيف","قوة الرأي والسيطرة","قوة الكلام والجدال"],"answer":1,"why":"لم يتكلم الرسول ﷺ في «قوة الشخصية» وإنما تكلم في «الإيمان القوي»، والمؤمن القوي بالتأصيل العام هو الذي يفعل الفرائض ويترك المحرمات.","ref":"ص 4"},{"q":"ماذا يُفهم من قوله ﷺ: «الناس معادن كمعادن الفضة والذهب»؟","options":["أن الناس كلهم متساوون في الأدوار","أن لكل إنسان ما يناسبه من الأدوار والمسارات التي يظهر فيها أثره وتتحقق فيها طاقاته، فالمعدن إذا لم يوضع في موضعه لم يؤدّ وظيفته","أن الغني أفضل من الفقير","أن الإنسان لا يتغير طبعه أبدًا"],"answer":1,"why":"معدن الذهب وإن كان من أنفس المعادن إذا لم يوضع في موضعه المناسب لم يؤدّ وظيفته على الوجه الصحيح، وكذلك الإنسان؛ فلكلٍّ منا ما يناسبه من الأدوار والمسارات التي يظهر فيها أثره وتتحقق فيها طاقاته.","ref":"ص 4"},{"q":"ما الذي يدلّ عليه موقف الأعراب الذين ناداوا النبي ﷺ من وراء الحجرات بحسب المحاضرة؟","options":["أنهم أكثر الناس أدبًا","أنهم أحرص الناس على المقامات","أنهم كانوا يُعبّرون بأريحية دون مراعاة لمقامات الناس، مع رعونة وسوء أدب، والإسلام لا يدعو إلى ذلك","أنهم كانوا قريبين من حواضر العلم"],"answer":2,"why":"كان الأعراب يُعبّرون بكل أريحية دون مراعاة لمقامات الناس، وكانت لديهم رعونة وسوء أدب مع الله تعالى، والإسلام لا يدعو إلى هذا؛ لأنهم بعيدون عن حواضر العلم والعلماء وقليلو الاحتكاك بالبشر.","ref":"ص 5"},{"q":"ماذا نتعلّم من موقف النبي ﷺ مع الغلام والأشياخ حين أُتي بشراب؟","options":["أن الإسلام يجمع بين إنزال الناس منازلهم وحفظ الحقوق، فمراعاة الكبار معتبرة لكن صاحب الحق لا يُلزم بالتنازل عنه إلا برضاه","أن صاحب الحق يتنازل عنه دائمًا للكبار","أن الكبار لا حق لهم في التقديم","أن الحقوق مقدَّمة على المقامات دائمًا"],"answer":0,"why":"في الحديث تعليم نبوي دقيق: مراعاة الكبار والأشياخ معتبرة، لكن صاحب الحق لا يُلزم بالتنازل عنه إلا برضاه؛ فالإسلام يجمع بين إنزال الناس منازلهم وبين حفظ الحقوق.","ref":"ص 5"},{"q":"ماذا يُستفاد من موقف أسماء بنت أبي بكر رضي الله عنها مع الرجل الفقير الذي استأذن أن يبيع في ظل دارها؟","options":["أنها رفضت دون أن تراعي حاجته","أنها أجابته مباشرة دون أن تسأل زوجها","أنها تصرفت بحكمة وذكاء، فراعت غيرة زوجها","أنها تركت الأمر كله للصدفة"],"answer":2,"why":"استأذنها الرجل فأحالته إلى ما يرضي زوجها الزبير، فراعت غيرة زوجها وتصرفت بحكمة وذكاء.","ref":"ص 6"},{"q":"ما التوجيه النبوي لعائشة رضي الله عنها حين ردّت على اليهود الذين قالوا «السام عليك»؟","options":["أن تردّ عليهم بمثل أسلوبهم","«مهلًا يا عائشة، عليك بالرفق، وإياك والعنف والفحش»","أن تسكت وتعرض عنهم دائمًا","أن تشتد عليهم في القول"],"answer":1,"why":"ردّ النبي ﷺ عليهم بقوله «وعليكم»، ثم وجّه عائشة قائلًا: «مهلًا يا عائشة، عليك بالرفق، وإياك والعنف والفحش»، وذكر أنه يُستجاب له فيهم ولا يُستجاب لهم فيه، وهو مثال للقوة الإيمانية.","ref":"ص 6"}],"5":[{"q":"ما القوة الحقيقية في التصور الإسلامي بحسب مقدمة المحاضرة؟","options":["شحّ النفس والتمحور حول الذات","فرض الرأي على الآخرين","ضبط الأهواء والغرائز والشهوات المحرمة وكبح الغضب عند هيجانه","الاستجابة لكل رغبات النفس"],"answer":2,"why":"القوة النفسية في التصور الإسلامي ليست القوة القائمة على شحّ النفس والتمحور حولها، بل تقوم الحكمة على التوازن، وتتمثل القوة الحقيقية في ضبط الأهواء والغرائز والشهوات المحرمة وكبح الغضب عند هيجانه.","ref":"ص 2"},{"q":"ما تعريف الحكمة كما ورد في المحاضرة؟","options":["الشدة في كل الأمور","وضع الأشياء في مواضعها من غير إفراط ولا تفريط","التساهل في كل الأحوال","الاكتفاء بالعلم دون العمل"],"answer":1,"why":"الحكمة هي وضع الأشياء في مواضعها من غير إفراط ولا تفريط، وهي كذلك جمع بين العلم بما يجب والعمل به بقدر المستطاع.","ref":"ص 2–3"},{"q":"ما القاعدة الواردة في المحاضرة عن العلم بالحق والعمل به؟","options":["العلم بالحق واجب مطلقًا، أما العمل به فبحسب القدرة والاستطاعة والوسع","العلم بالحق مستحب والعمل به واجب مطلقًا","كلاهما بحسب الوسع","كلاهما مباح"],"answer":0,"why":"قاعدة: العلم بالحق واجب مطلقًا، أما العمل به فبحسب القدرة والاستطاعة والوسع.","ref":"ص 3"},{"q":"ما حكم من يغيّر المنكر بمنكر أكبر منه كما نقلت المحاضرة عن العلماء؟","options":["مأجور على كل حال","فعل مستحب","فعل مباح","اقترف محرمًا"],"answer":3,"why":"التغيير يكون بالوسع وبالحكمة، وقد قال العلماء: «الذي يغيّر المنكر بمنكر أكبر منه فقد اقترف محرّمًا».","ref":"ص 3"},{"q":"بحسب مثال هجر العصاة، متى تكون المصلحة في عدم هجر العاصي؟","options":["إذا كان الهجر يزيده بعدًا أو يدفعه إلى الارتماء في أحضان أهل المعاصي، فيُستمر في نصحه ودعوته وتأليفه","إذا كان يرتدع بالهجر","إذا كان الهجر مقصودًا لذاته","إذا كان لا يتأثر بشيء"],"answer":0,"why":"الهجر ليس مقصودًا لذاته، وإنما يُنظر فيه إلى ما يترتب عليه من مصالح ومفاسد؛ فإن كان العاصي يرتدع به كان وسيلة نافعة، وإن زاده بعدًا فالمصلحة في الاستمرار في نصحه ودعوته وتأليفه؛ لأن المقصود هدايته.","ref":"ص 3–4"},{"q":"ما المقصود بتزكية النفس بحسب المحاضرة؟","options":["الاكتفاء بترك المحرمات","الإكثار من النوافل فقط","زيادة خير النفس بأخلاق الخير، وتقليل شرها بتخليصها من أخلاق السوء","إهمال حظوظ النفس كلها"],"answer":2,"why":"المقصود بتزكية النفس زيادة خير النفس (بأخلاق الخير) وتقليل شرّها (تخليصها من أخلاق السوء)، وبدون حكمة تتحوّل التزكية إلى تدسية.","ref":"ص 4"},{"q":"ما ترتيب التزكية في الحديث القدسي: «ما تقرّب إليّ عبدي بشيء أحبّ إليّ مما افترضت عليه»؟","options":["النوافل أولًا ثم الفرائض","النوافل وحدها تكفي","الفرائض أولًا ثم النوافل، ومن الخطر فعل النوافل على حساب الفرائض","لا ترتيب بينهما"],"answer":2,"why":"طريق التزكية يكون بأداء الفرائض أولًا ثم أداء النوافل، ومن الخطر فعل النوافل على حساب الفرائض.","ref":"ص 4"},{"q":"بحسب كلام ابن حجر الذي نقلته المحاضرة، ما حال من شغله نفلُه عن فرضه؟","options":["فهو معذور","فهو مأجور","فهو مغرور","فهو مجتهد"],"answer":2,"why":"قال العلماء: «من شغله فرضه عن نفله فهو معذور، ومن شغله نفله عن فرضه فهو مغرور».","ref":"ص 5"},{"q":"ماذا يدلّ قول عائشة رضي الله عنها: «كان رسول الله ﷺ إذا أمرهم، أمرهم من الأعمال بما يطيقون»؟","options":["أنه كان يأمرهم بأشق الأعمال","أنه كان يأمرهم بأفضل الأعمال وأحسنها دائمًا","أنه كان يراعي وسعهم وقدراتهم","أنه كان يترك أمرهم بالأعمال"],"answer":2,"why":"خصّت عائشة الهدي العام لتربية النبي ﷺ للصحابة؛ فلم تقل «يأمرنا من الأعمال أفضلها وأحسنها»، فكان ﷺ يراعي وسعهم وقدراتهم.","ref":"ص 5"},{"q":"لماذا كان عبد الله بن مسعود رضي الله عنه يُذكّر الناس يوم الخميس فقط من كل أسبوع؟","options":["لانشغاله بغير ذلك في بقية الأيام","كراهية أن يملّهم، اقتداءً بالنبي ﷺ الذي كان يتخوّلهم بالموعظة في الأيام كراهية السآمة عليهم","لأن الموعظة لا تجوز إلا يوم الخميس","لأن الناس لا يرغبون في الموعظة"],"answer":1,"why":"قال: «ما يمنعني أن أحدّثكم إلا كراهية أن أُملّكم، إن رسول الله ﷺ كان يتخوّلنا بالموعظة في الأيام، كراهية السآمة علينا»، فالمنهج النبوي في التربية هو السماحة ومراعاة الوسع والطاقة وعدم الغلو.","ref":"ص 6"}],"6":[{"q":"ما أولى ما يبدأ به الإنسان في تزكية نفسه بحسب بداية المحاضرة؟","options":["الانشغال بمحاربة العادات السيئة وحدها","فعل الطاعات والتدرج فيه، فهو يملأ القلب ويقوّي الإيمان والعقل والامتثال لله","ترك المحرمات دون الاشتغال بالطاعات","الإكثار من النوافل دون النظر إلى الفرائض"],"answer":1,"why":"الإنسان في تزكيته قد يتصارع مع عاداته السيئة فإن شُفي من عادة ابتُلي بأخرى، أما الذي يفعل الطاعات فيملأ قلبه ويستحوذ عليه بها، فيتقوّى إيمانه وعقله وامتثاله لله، وهذا أولى ما يُبدأ به.","ref":"ص 2"},{"q":"ما الذي ينبغي للفتاة أن تنظر إليه عند تقييم نفسها وفهم وسعها؟","options":["دورًا واحدًا من أدوارها فقط","صورة مثالية تتخيلها","ما تفعله صديقاتها","مجموع أدوارها، وتوزّع جهدها ووقتها بحسب ما تستطيع لا بحسب صورة مثالية"],"answer":3,"why":"ينبغي للفتاة عند تقييم نفسها أن تنظر إلى مجموع أدوارها لا إلى دور واحد فقط، وأن توزّع جهدها ووقتها بحسب ما تستطيع، لا بحسب صورة مثالية تتخيلها.","ref":"ص 2"},{"q":"ما المطلوب من المرأة في أدوارها بحسب المحاضرة؟","options":["الكمال المطلق في كل شيء","الكمال الممكن لا الكمال المتخيَّل","ترك الأدوار الصعبة","الاعتماد على الغير في كل شيء"],"answer":1,"why":"طلب الكمال في كل شيء وفي كل وقت ليس من الواقعية، بل هو من صور التكلف التي تورث التعب والإحباط؛ والمطلوب هو الكمال الممكن لا الكمال المتخيّل.","ref":"ص 2–3"},{"q":"استيقظت فتاة وهي تشعر بالتعب والألم بعد يوم شاق. ما التصرف الأنسب بحسب المحاضرة؟","options":["أن تحمّل نفسها ما فعلته في الأيام الأخرى","أن تترك واجباتها كلها","أن تراعي حالها وتدرك أن وسعها في هذا اليوم ليس كوسعها في الأيام الأخرى","أن تتجاهل التعب تمامًا"],"answer":2,"why":"من مراعاة الظروف الصحية أن تراعي حالها وتدرك أن وسعها في ذلك اليوم ليس كوسعها في الأيام الأخرى، وأن الله تعالى لا يكلّف نفسًا إلا وسعها.","ref":"ص 3"},{"q":"ما الأنسب في التعامل مع اختلاف الطباع الشخصية بحسب المحاضرة؟","options":["أن يقيس الإنسان وسعه بوسع غيره","أن يستسلم لما في نفسه من طباع مذمومة","أن ينكر على كل من يختلف طبعه عنه","أن يعرف طبعه واستعداداته، فيستثمر نقاط قوته ويجاهد نفسه في إصلاح جوانب الضعف دون أن يقيس وسعه بوسع غيره"],"answer":3,"why":"من الحكمة أن يعرف الإنسان طبعه واستعداداته، فيستثمر ما وهبه الله من نقاط القوة، ويجاهد نفسه في إصلاح جوانب الضعف، دون أن يقيس وسعه بوسع غيره.","ref":"ص 4"},{"q":"أيّ العبارات التالية صحيحة في التعامل مع طاعات المنشط وطاعات المكره؟","options":["الفرائض يُنظر فيها إلى موافقة الهوى أو مخالفته","الفرائض يجب القيام بها في المنشط والمكره، ولا يُنظر فيها إلى موافقة الهوى","طاعات المنشط أولى بالتقديم على الفرائض","يُترك كل ما فيه مشقة"],"answer":1,"why":"الفرائض لا يُنظر فيها إلى موافقة الهوى أو مخالفته، بل يجب القيام بها في حال المنشط والمكره؛ ولذلك بايع الصحابة رسول الله ﷺ على السمع والطاعة في المنشط والمكره.","ref":"ص 5"},{"q":"ما المقصود بـ«الكمالية الحالمة» كأحد مذهبات الوسع؟","options":["الاعتدال في الأعمال","محاولة فعل الأفضل مطلقًا في كل أمور الحياة مع الغفلة عن القدرات والظروف","التدرج في العبادة","مراعاة الظروف الصحية"],"answer":1,"why":"الكمالية الحالمة هي محاولة فعل الأفضل مطلقًا؛ وقد قال ابن تيمية: «فعل الأفضل مطلقًا ليس الأفضل لكل أحد، بل هو الأسوأ لأغلب الناس؛ لأن أغلب الناس لا يستطيع حمل مؤنة الأفضل».","ref":"ص 6"},{"q":"فتاة لا تستطيع أن تصلي قائمة بسبب ألم في ظهرها. بأي قاعدة فقهية تعمل بحسب المحاضرة؟","options":["لا ضرر ولا ضرار فقط","الأمور بمقاصدها","اليقين لا يزول بالشك","المشقة تجلب التيسير، فتصلي قاعدة ثم على جنب إن لم تستطع"],"answer":3,"why":"أجمع العلماء على قاعدة «المشقة تجلب التيسير»؛ وقد قال النبي ﷺ: «صلّ قائمًا، فإن لم تستطع فقاعدًا، فإن لم تستطع فعلى جنب».","ref":"ص 7"},{"q":"طلب الزوج من زوجته إعداد طعام يحتاج وقتًا وجهدًا كبيرين وهي مرهقة. ما الأنسب بحسب المحاضرة؟","options":["تنفذ دون أن تفكر في العواقب","ترفض بحدّة","تستأذن زوجها وتتلطف في الكلام وتطلب تأجيله إلى وقت أنسب، فإن أرادت القيام به نظرت في العواقب حتى لا تحل مشكلة بمشكلة أكبر","تُهمل أولادها حتى تنجز الطعام"],"answer":2,"why":"قاعدة «لا ضرر ولا ضرار» تقوم على عدم دفع مضرة بمضرة أكبر منها؛ فلا بأس أن تستأذن زوجها وتتلطف في الكلام وتطلب التأجيل، وإن أرادت القيام بما طلب فلتنظر في العواقب والمآلات.","ref":"ص 7–8"},{"q":"فتاة لم تلتزم بورد يومي من القرآن مدة طويلة ثم أرادت أن تبدأ مباشرة بختم القرآن كل عشرة أيام. ما الأنسب بحسب المحاضرة؟","options":["الانتقال المفاجئ لأنه أسرع في التقدم","ترك الورد نهائيًا","التدرج حتى تألف النفس العبادة وتستقر عليها، ثم رفع الهمة شيئًا فشيئًا بحسب القدرة والالتزام","مقارنة نفسها بمن يختم بسرعة"],"answer":2,"why":"من مذهبات الوسع طلب ما لا يملك وسعه في الحال؛ فالانتقال المفاجئ غالبًا لا يكون عمليًا ولا مستدامًا، وإنما الأنسب فيه التدرج حتى تألف النفس العبادة وتستقر عليها، ثم تُرفع الهمة شيئًا فشيئًا.","ref":"ص 9"}],"7":[{"q":"لماذا لم يجعل الله تعالى للوسع مقدارًا واحدًا ينطبق على جميع الناس؟","options":["لأنه يختلف باختلاف الأشخاص والظروف والقدرات، وتُعرف حدوده بالتقوى والقواعد الشرعية وكلام العلماء الراسخين","لأن الوسع لا حدود له","لأن الناس كلهم متساوون في القدرة","لأن كل إنسان يحدد وسعه بهواه"],"answer":0,"why":"من عظيم حكمة الله أنه لم يجعل للوسع مقدارًا واحدًا، بل يختلف باختلاف الأشخاص والظروف والقدرات؛ ولذلك تُعرف حدوده من خلال التقوى والقواعد الشرعية وكلام العلماء الراسخين.","ref":"ص 2"},{"q":"ما المثال الذي ذكرته المحاضرة على مراعاة الله تعالى للوسع في الأحكام؟","options":["إسقاط الصلاة عن كل متعب","إباحة ترك الفرائض عند الانشغال","أنه رخّص للمريض أن يصلي جالسًا إذا كان قيامه يؤخر برأه أو يزيد مرضه","منع المريض من أداء الصلاة"],"answer":2,"why":"من مظاهر رحمة الله ومراعاته للوسع أنه رخّص للمريض في بعض الأحكام؛ فإذا كان قيامه في الصلاة يؤخر برأه أو يزيد مرضه شُرع له أن يصلي جالسًا مراعاةً لحاله وقدرته.","ref":"ص 2"},{"q":"ما العقبة السادسة من عقبات الشيطان كما ذكرها ابن القيم رحمه الله؟","options":["الكفر والشرك","الكبائر","عقبة الأعمال المفضولة المرجوحة من الطاعات، فيشغله بها عمّا هو أفضل منها","الصغائر"],"answer":2,"why":"هي عقبة الأعمال المفضولة المرجوحة من الطاعات؛ فالشيطان إذا عجز عن تخسير العبد أصل الثواب طمع في تخسيره كماله ودرجاته العالية، فيشغله بالمفضول عن الفاضل وبالمرجوح عن الراجح.","ref":"ص 2–3"},{"q":"عند تزاحم الأعمال والعبادات في يوم الإنسان، بماذا يُنظر بحسب المحاضرة؟","options":["إلى كثرة العمل فقط","إلى ما هو أسهل على النفس","إلى نوع العمل دون النظر لغيره","إلى الأولويات وفق الفقه والبصيرة، لا بمجرد كثرة العمل أو نوعه"],"answer":3,"why":"عند تزاحم الأعمال والعبادات يُنظر إلى الأولويات وفق الفقه والبصيرة، لا بمجرد كثرة العمل أو نوعه.","ref":"ص 3"},{"q":"امرأة مترددة بين صيام النفل وبين طاعة زوجها في المعروف والقيام بحقوق أولادها. ما الأولى بحسب المحاضرة ولماذا؟","options":["صيام النفل لأنه أشق على النفس","طاعة الزوج والقيام بحقوق الأولاد؛ لأن الحقوق المتعدية لا يُستدرك تفريطها بسهولة بخلاف النوافل التي يسعها التقديم والتأخير","كلاهما سواء","تركهما معًا"],"answer":1,"why":"تُقدَّم الواجبات على النوافل؛ فطاعة الزوج في المعروف والقيام بحقوق الأولاد وتربيتهم أولى من صيام النفل الذي يمكن تأجيله؛ لأن الحقوق المتعدية لا يُستدرك تفريطها بسهولة.","ref":"ص 3"},{"q":"ماذا ينبّه عليه قول بعض السلف: «من عبد الله بغير علم كان ما يفسد أكثر مما يصلح»؟","options":["أن العبادة تحتاج إلى علم يوجّهها حتى لا تتحول كثرة العمل إلى سبب للخلل، وميزان القبول موافقة الشرع مع الحكمة في تنزيله","أن العلم لا قيمة له في العبادة","أن كثرة العبادة تغني عن العلم","أن العبادة تُترك حتى يكتمل العلم"],"answer":0,"why":"هو تنبيه إلى أن العبادة تحتاج إلى علم يوجّهها، حتى لا تتحول كثرة العمل إلى سبب للخلل بدل الإصلاح، وأن ميزان القبول هو موافقة الشرع مع الحكمة في تنزيله على الواقع.","ref":"ص 3"},{"q":"أيّ الترتيب التالي لرتب المعروف صحيح بحسب المحاضرة؟","options":["الصلاة ثم التوحيد ثم الصيام","الصيام والزكاة والحج ثم التوحيد ثم الصلاة","التوحيد ثم الصلاة وما يلزمها ثم الصيام والزكاة والحج","فروض الكفاية ثم التوحيد ثم الصلاة"],"answer":2,"why":"الرتبة الأولى: تعلّم التوحيد وهو أعظم فرض عين، والثانية: الصلاة وما يلزمها من الطهارة وغيرها، والثالثة: الصيام والزكاة والحج.","ref":"ص 3–4"},{"q":"ما حكم فرض الكفاية إذا لم يؤدّه أحد من المسلمين؟","options":["لا إثم على أحد","يأثم المسلمون جميعًا","تأثم النساء فقط","يسقط تلقائيًا"],"answer":1,"why":"فروض الكفاية تقوم بها مجموعة من المسلمين، فإن لم يؤدّها أحد منهم أثموا جميعًا؛ ومن لم تستطع القيام بفرض الكفاية فلتكن من المعينين عليه.","ref":"ص 4"},{"q":"ما الذي ذكرته المحاضرة عن رتبة المباحات؟","options":["أنها تكون بحسب الحاجة، وترتفع رتبتها أحيانًا من الإباحة إلى الوجوب","أنها دائمًا أعلى من الواجبات","أنها لا تتغير أبدًا","أنها محرّمة إذا كثرت"],"answer":0,"why":"الرتبة الثامنة من رتب المعروف هي المباحات، وتكون بحسب الحاجة لها، وترتفع رتبتها أحيانًا من الإباحة إلى الوجوب.","ref":"ص 5"},{"q":"أيّ الأمثلة التالية تقع في الرتبة الأولى من رتب المنكر (الكفر والشرك والكبائر المكفِّرة)؟","options":["إطلاق البصر","الربا","ضرب الوالدين","الاستهزاء بالشريعة"],"answer":3,"why":"الرتبة الأولى من رتب المنكر: الكفر والشرك بأقسامه، والكبائر المكفِّرة كاستبدال قوانين الشريعة الإسلامية وتحريم الحلال أو تحليل الحرام، والعلمانية، وشتم الله، والاستهزاء بالشريعة، ودعاء وعبادة غير الله.","ref":"ص 5"}],"8":[{"q":"ما الخصلتان اللتان قال النبي ﷺ للأشج عبد القيس إنه جُبل عليهما، وأي مصطلح أُخذ من الحديث؟","options":["الحلم والأناة، ومصطلح «الجبلة»","الشجاعة والكرم، ومصطلح «الفطرة»","الصدق والأمانة، ومصطلح «السجية»","العلم والعمل، ومصطلح «الخُلق»"],"answer":0,"why":"الجبلة مصطلح مأخوذ من حديث النبي ﷺ مع الأشج عبد القيس، فقال له: «إن فيك خصلتين يحبهما الله: الحلم والأناة»، فقال: أخلقًا تخلقت بهما أم جُبلت عليهما؟ فقال: «بل جُبلت عليهما» (أخرجه أبو داود).","ref":"ص 2-3"},{"q":"ما الفرق بين الجَبْر والجَبْل بحسب الدرس؟","options":["الجبر والجبل بمعنى واحد","الجبل أن يفقد الإنسان الاختيار تمامًا","الجبر يزيد الاختيار ويقويه","الجبر أن يفقد الإنسان التحكم والاختيار فيما هو مجبور عليه، أما الجبل فلا يفقد الإنسان الاختيار بل قد يسهله عليه أو يصعبه"],"answer":3,"why":"هناك فرق بين مصطلحي الجَبْر والجَبْل؛ فالجبر هو أن يفقد الإنسان التحكم والاختيار والتصرف فيما هو مجبور عليه، أما الجبل فلا يفقد الإنسان الاختيار، بل قد يسهله عليه أو يصعبه حسب الأمر.","ref":"ص 3"},{"q":"ما الهدف من تعلّم تزكية الجبلات النفسية بحسب الدرس؟","options":["القضاء على الجبلات من جذورها","تغيير الطباع كلها إلى طبع واحد","تحديد الأهواء والتفضيلات الشخصية، ومعرفة خير النفس لزيادته وتوجيهه لنصرة دين الله، أي زيادة نقاط القوة وتقليل نقاط الضعف","ترك الجبلات دون توجيه"],"answer":2,"why":"الهدف من تعلم تزكية الجبلات: تحديد الأهواء والتفضيلات الشخصية لتمييزها إذا تداخلت وأعاقت عن فعل أمر الله، ومعرفة خير النفس لزيادته وتوجيهه لنصرة دين الله، وهذا ما يسمى لدى المعاصرين بزيادة نقاط القوة وتقليل نقاط الضعف.","ref":"ص 3"},{"q":"ماذا أثبت القرآن للإنسان في مسألة البيئة والوراثة بحسب الدرس؟","options":["أن الإنسان لا يملك تغيير ما ورثه","حرّره من أسر التحجج بالبيئة والتربية، وأثبت له أنه مسؤول أمام الله عن مراجعة جبلاته وكل ما تربى عليه","أن البيئة وحدها تحكم سلوكه","أن مشيئته معطلة تمامًا"],"answer":1,"why":"أعطى الله سبحانه الإنسان المشيئة لتزكية نفسه، وأثبتها في القرآن في مواضع كثيرة، فالقرآن الكريم حرّر الإنسان من أسر التحجج بالبيئة والتربية، وأثبت له أنه مسؤول أمام الله عن مراجعة جبلاته وكل ما تربّى عليه وما أوتي من صفات حسنة أو سيئة.","ref":"ص 4"},{"q":"على أي أساس يكون الحساب عند الله بحسب حديث «الناس معادن» في الدرس؟","options":["على قدر المجاهدة والتزكية، لا على طبيعة المعدن","على طبيعة المعدن فقط","على النتائج التي يراها الناس","على المال الذي يملكه الإنسان"],"answer":0,"why":"الحساب عند الله تعالى ليس على طبيعة المعدن ولكن على قدر المجاهدة والتزكية، وفي الحديث: «سبق درهمٌ مائةَ ألف درهم»؛ فصاحب معدن الذهب لا يتعب في تزكية نفسه بقدر ما يتعب من هو دونه، وبذلك قد يسبقه في الأجر والمكانة.","ref":"ص 5-6"},{"q":"ما المقصود بعدم المبالغة والغلو في تزكية بعض الطباع الشخصية؟","options":["أن نستأصل جبلاتنا بالكامل","أن نتجاهل التزكية","أن نقلد طباع الآخرين","ألا نحاول استئصال الجبلات من جذورها، بل نوقفها عندما تتعارض مع ما يحبه الله ورسوله ﷺ"],"answer":3,"why":"يحاول بعض الناس نتيجة غلو وتنطع وعدم اقتصاد في فهم التزكية استئصال جبلاتهم من جذورها، وليس هذا هو المطلوب في منهج الإسلام الحكيم، ولكن المراد أن توقف هذه الجبلات عندما تتعارض مع ما يحبه الله تعالى ورسوله ﷺ.","ref":"ص 6"},{"q":"ما الدرس من مثال المسابقة بين السمكة والحمار والفهد في الدرس؟","options":["أن نجاري غيرنا في نقاط ضعفنا","أن نترك المنافسة تمامًا","أن التسابق في الخير يكون في نقاط القوة، أما نقاط الضعف فيأتي منها بالحد الأدنى بحيث لا يترك فرضًا ولا يرتكب حرامًا","أن نتسابق في ما لا نتقنه"],"answer":2,"why":"التسابق في الخير والمنافسة في أبواب الجنة يكون في نقاط القوة، أما نقاط الضعف فينبغي للإنسان أن يقلل منها ويأتي بالحد الأدنى مما يستطيعه من المطلوب منه شرعًا، بحيث لا تجعله يترك فرضًا أو يرتكب حرامًا.","ref":"ص 7"},{"q":"لماذا لم يستعمل النبي ﷺ أبا ذر الغفاري رضي الله عنه على الولاية رغم شهادته له بالصدق؟","options":["لأنه لم يكن صادقًا","لأن صدقه وشدته في الحق يقابلهما ضعف في مداراة الناس وتحمل زلاتهم، فقال له: «يا أبا ذر، إنك ضعيف، وإنها أمانة»","لأنه كان قليل العلم","لأنه رفض أن يُستعمل"],"answer":1,"why":"قال أبو ذر: يا رسول الله ألا تستعملني؟ فضرب بيده على منكبه ثم قال: «يا أبا ذر إنك ضعيف، وإنها أمانة، وإنها يوم القيامة خزي وندامة إلا من أخذها بحقها وأدى الذي عليه فيها». ومن يملك مستويات عالية من الصدق غالبًا ما تكون لديه نقاط ضعف في مداراة الناس.","ref":"ص 7-8"},{"q":"ماذا قال النبي ﷺ عن عثمان رضي الله عنه حين دخل عليه ولم يُظهر له ما يخجله؟","options":["«ألا أستحي من رجل تستحي منه الملائكة»","«ما أشد حياءه فاحذروه»","«ليس في عثمان خير»","«كفوا عن مدحه»"],"answer":0,"why":"كان عثمان رضي الله عنه شديد الحياء، والرسول ﷺ راعى فيه هذا ولم يعبه، بل كان يمدحه، كما في حديث عائشة: لما دخل عثمان جلس رسول الله ﷺ وسوّى ثيابه، فقال: «ألا أستحي من رجل تستحي منه الملائكة».","ref":"ص 8"},{"q":"ما الفرق بين الطبع التفصيلي والطبع الإجمالي في الكلام بحسب الدرس؟","options":["التفصيليون قليلو الكلام والإجماليون كثيروه","لا فرق بينهما","التفصيليون يكرهون الكلام","التفصيليون يحبون ذكر التفاصيل الدقيقة لكل الأمور، والإجماليون يميلون إلى قلة التعبير وقد يُتّهمون بقلة العاطفة"],"answer":3,"why":"التفصيليون: كثيرو الكلام تحب الشخصية التفصيلية ذكر التفاصيل الدقيقة لكل الأمور. والإجماليون: يميل أصحاب هذا الطبع إلى قلة التعبير، وكثيرًا ما يُتّهمون بقلة العاطفة ويتعرضون لسوء الفهم بسبب قلة ذكرهم للتفاصيل المهمة.","ref":"ص 9"}],"9":[{"q":"بماذا تتميز الجبلة الحذرة، وماذا يُخشى عليها إذا لم تُزكَّ؟","options":["تتميز بالإقدام والاندفاع، ويُخشى عليها التهور","تتميز بالحذر والاحتياط والقلق والإحجام، ويُخشى عليها أن تصبح جبانة","تتميز بالسيطرة على كل شيء","تتميز بسهولة الرضا والانبساط"],"answer":1,"why":"الجبلات الحذرة: تتميز بالحذر والاحتياط والقلق والإحجام، ويكثر هذا الطبع عند النساء أكثر من الرجال، ويُخشى على هذه الجبلة -إذا لم تُزكَّ- أن تصبح جبانة.","ref":"ص 2"},{"q":"ما أبرز أخطاء مهندسة الأجيال الحذرة التي ذكرها الدرس؟","options":["أن تترك تربية أولادها على ما يحبه الله ورسوله ﷺ خشية كلام الناس وضغطهم، وأن تكثر التخوفات والتحذيرات لزوجها وأولادها","أن تهمل أولادها تمامًا","أن تقدم على كل أمر دون تفكير","أن تتساهل في كل حقوقها"],"answer":0,"why":"من تجليات هذا الطبع لدى مهندسة الأجيال أن تترك تربية أولادها على ما يحبه الله ورسوله ﷺ لأنها تخشى كلام الناس من حولها وضغطهم، ومن أخطائها أنها تكثر التخوفات والتحذيرات لزوجها وأولادها فيضجروا منها ويسأموا.","ref":"ص 2-3"},{"q":"ما الخلق الإسلامي الذي يتوسط بين الحذر والتهور بحسب الدرس، وماذا يأخذ من كل منهما؟","options":["الجبن؛ يأخذ من الحذر الخوف ومن التهور الاندفاع","الغضب؛ يأخذ من الحذر القلق ومن التهور العناد","الكرم؛ يأخذ من الحذر التقتير ومن التهور الإسراف","الشجاعة؛ تأخذ من الحذر النظر للنتائج، ومن التهور الإقبال والإقدام"],"answer":3,"why":"الشجاعة خلق إسلامي وسط بين الحذر والتهور، أخذت من الحذر النظر للنتائج، ومن التهور الإقبال والإقدام. ومن مواقفه ﷺ في الشجاعة الحكيمة موقفه في غزوة الخندق حيث لم يسمح بحدوث قتال بين عشرة آلاف كافر مقابل ألفين من المسلمين وحفر خندقًا.","ref":"ص 4"},{"q":"بمَ تتميز جبلة السيطرة بحسب الدرس؟","options":["عدم رسم أي خطط أو توقعات","سهولة الرضا بأبسط الأشياء","هوى أصحابها ألا يخرج أي أمر عما خططوا له، وتكثر من التعليمات والتوجيهات ولا تعرف الراحة إلا إذا شعرت أنها مسيطرة على كل شيء","الإفراط في السكوت ومراعاة نفوس الآخرين"],"answer":2,"why":"السيطرة: هوى أصحاب هذه الجبلة ألا يخرج أي أمر عما خططوا له، وتكثر من التعليمات والتوجيهات، ولا تعرف الراحة إلا عندما تشعر أنها مسيطرة على كل شيء، ولديها غلو في التحكم في الأشياء، فقد تتحكم في زوجها.","ref":"ص 5"},{"q":"ماذا فعل إبراهيم عليه السلام حين زار إسماعيل عليه السلام فوجد زوجته كثيرة الشكوى والتسخط؟","options":["أقام عندهم يعلّمها الرضا","أوصاها أن تبلّغ زوجها أن يغيّر عتبة بابه، ففارقها إسماعيل","دعا لها ثم رحل دون وصية","أعطاها مالًا ليصلح حالها"],"answer":1,"why":"أخذت الزوجة تشكو لرجل لا تعرفه، فقال لها إبراهيم: «فإذا جاء زوجك فاقرئي عليه السلام وقولي له: غيّر عتبة بابك»، فلما جاء إسماعيل قال: «ذاك أبي، وقد أمرني أن أفارقك، الحقي بأهلك»، فطلقها.","ref":"ص 6"},{"q":"متى تكون الشكوى محرمة بحسب ضوابط التشكي في الدرس؟","options":["حين تكون لشخص قليل العقل أو العلم أو الدين، كأن تشتكي المرأة لمن تغتاب زوجها أو تحرضها على الإساءة إليه","حين تكون لأهل العلم والخبرة","حين تكون لأجل التخفيف عن النفس فقط","حين تكون واجبة لدفع الحرام"],"answer":0,"why":"الوجه المحرم للتشكي هو حين يكون لشخص قليل العقل أو العلم أو الدين، كأن تشتكي المرأة لمن تغتاب زوجها أو تحرّضها على الإساءة إليه. والوضع الاعتيادي للشكوى لشخص يماثل المشتكي في التدين والعلم من باب التخفيف عن النفس مباح.","ref":"ص 7"},{"q":"ماذا قال النبي ﷺ لعائشة رضي الله عنها حين قالت: «وارأساه»؟","options":["«اصبري يا عائشة فهذا بلاء»","«لا تشتكي ولا تتذمري»","«ليس هذا من الدين»","«بل أنا يا عائشة وارأساه»"],"answer":3,"why":"عن عائشة رضي الله عنها قالت: رجع إليّ رسول الله ﷺ ذات يوم من جنازة بالبقيع وأنا أجد صداعًا في رأسي وأنا أقول: وارأساه، قال: «بل أنا يا عائشة وارأساه» (رواه ابن حبان). وهذا من هدي النبي ﷺ في الأمر الموافق لحسن الخلق.","ref":"ص 8"},{"q":"ما الذي حذّر منه النبي ﷺ في قوله: «إياكم والشح»؟","options":["من الكرم لأنه يضيع المال","من العفو لأنه يُضعف الحق","من الشح لأنه أهلك من كان قبلنا؛ أمرهم بالبخل فبخلوا، وبالقطيعة فقطعوا، وبالفجور ففجروا","من الحياء لأنه يمنع الكلام"],"answer":2,"why":"شح النفس من أسوأ الأخلاق، وقد حذّر منه رسول الله ﷺ فقال: «إياكم والشح، فإنما هلك من كان قبلكم بالشح، أمرهم بالبخل فبخلوا، وأمرهم بالقطيعة فقطعوا، وأمرهم بالفجور ففجروا» (رواه أبو داود).","ref":"ص 10"},{"q":"ماذا قال النبي ﷺ لوحشي بن حرب رضي الله عنه حين أسلم وجاءه، وما الذي يستفاد منه في المسامحة؟","options":["قال له: «أنت حر، لا شيء عليك»","قال له: «هل تستطيع أن تغيّب وجهك عني»؛ فلم يسامحه مسامحة كاملة لكنه قبل إسلامه وكان من الصحابة","رفض إسلامه","أمر بقتله"],"answer":1,"why":"قال النبي ﷺ لوحشي لما رآه: «آنت وحشي؟ أنت قتلتَ حمزة؟» قال: نعم، قال: «فهل تستطيع أن تغيّب وجهك عني»، ولم يسامحه مسامحة كاملة لكنه قبل إسلامه وكان من الصحابة.","ref":"ص 10"},{"q":"ما الذي يُنصح به أصحاب الجبلة المتسامحة لتزكية طبعهم؟","options":["أن يضع صاحبها شروطًا ضابطة للآخرين، وأن يحدّث من أخطأ بلطف بعد تكرار الخطأ ويوضح ما يؤذيه","أن يتنازل عن كل حقوقه دائمًا","أن يغضب فورًا عند أول خطأ","أن يقطع العلاقة بمن أخطأ"],"answer":0,"why":"من تزكية هذه الجبلة أن يضع صاحبها شروطًا ضابطة للآخرين، فإذا تسامحت الزوجة مع زوجها في أمر ما أربع أو خمس مرات فينبغي أن تحدثه بلطف عن ذلك الخطأ بعد ذلك، وأن توضح له ما يؤذيها فيه.","ref":"ص 9"}],"10":[{"q":"ما الفرق بين الجبلة المتسامحة والجبلة المشاحّة في الحقوق؟","options":["المتسامحة تطالب بكل حقها والمشاحّة تتنازل عنه","لا فرق بينهما","المتسامحة يسهل عليها التسامح في تقصير غيرها في حقها، أما المشاحّة فتستصعب التنازل عما تظنه حقًّا لها وتريد استيفاء جميع حقها","المشاحّة تتسامح دائمًا"],"answer":2,"why":"الجبلة المتسامحة: السهل عليها أن تتسامح في تقصير غيرها في حقها، أما الجبلة المشاحّة فتستصعب التنازل عما تظنه حقًّا لها، وتستصعب العفو والمغفرة، وتريد دائمًا أن تستوفي جميع حقها.","ref":"ص 2"},{"q":"من هو مثال المشاحّين الذي ذكره الدرس، وماذا قال للنبي ﷺ عند توزيع الغنائم؟","options":["أبو لهب، وقال: «تبًّا لك»","عبد الله ذو الخويصرة، وقال: «اعدل يا محمد»","عبد الله بن أبي، وقال: «لا تنفقوا»","وحشي، وقال: «اعف عني»"],"answer":1,"why":"من أمثلة المشاحّين عبد الله ذو الخويصرة، بل هو رأس المشاحّين، وقد حذّر منه رسول الله ﷺ؛ ففي معركة حنين وزّع النبي ﷺ الغنائم فلم يتحمل ذلك ووصل به شح نفسه إلى أن قال لرسول الله ﷺ: «اعدل يا محمد»!","ref":"ص 2"},{"q":"ما سبب المشاحّة بحسب الدرس، وما الآية التي ذُكرت؟","options":["شدة الحرص على الدنيا، والآية: ﴿ومن يوق شح نفسه فأولئك هم المفلحون﴾","الجهل بالأحكام، والآية: ﴿وما خلقت الجن والإنس﴾","قلة المال، والآية: ﴿ولا تقتلوا أنفسكم﴾","كثرة العلم، والآية: ﴿اقرأ باسم ربك﴾"],"answer":0,"why":"المشاحّة سببها شدة الحرص على الدنيا، لذلك قال الله سبحانه وتعالى: ﴿فاتقوا الله ما استطعتم واسمعوا وأطيعوا وأنفقوا خيرًا لأنفسكم ومن يوق شح نفسه فأولئك هم المفلحون﴾ [التغابن: 16].","ref":"ص 2"},{"q":"ما الخطأ الذي يقع فيه المتسامح بحسب الدرس؟","options":["أن يطالب بجميع حقوقه","أن يتأخر في العفو","أن يتكلم قليلًا","تجاوز حقوق الله جل جلاله فيسامح من يتطاولون أو يكررون أخطاء جسيمة، فينفجر بعد وقت ويصبح من أشد الناس مشاحّة"],"answer":3,"why":"ومن الأخطاء التي يقع فيها المتسامح: تجاوز حقوق الله جل جلاله فيسامح من يتطاولون أو يكررون أخطاء جسيمة، فينفجر بعد وقت ويصبح من أشد الناس مشاحّة، فيؤذي نفسه وغيره. فالتسامح له مكانه والمشاحّة لها مكانها.","ref":"ص 3"},{"q":"بمَ تتميز النفوس صاحبة الكمالية الحالمة، وما عكسها؟","options":["تتساهل في محاسبة نفسها، وعكسها المتشددون","تتميز بالهدوء وقلة الحركة","تميل إلى المبالغة والتوقعات العالية من النفس وتسعى للكمالية المطلقة، وعكسها الكسالى الذين يتساهلون في ارتكاب الأخطاء","تتميز بكثرة الشكوى"],"answer":2,"why":"تميل النفوس صاحبة الكمالية الحالمة إلى المبالغة والتوقعات العالية من النفس، وتسعى للكمالية المطلقة وتضع أهدافًا خيالية بعيدة عنها. وعكس أصحاب هذه الجبلة الكسالى الذين يتساهلون في ارتكاب الأخطاء، وكلاهما مخطئ.","ref":"ص 3-4"},{"q":"بماذا أجاب الرجل الأنصاري عبد الله بن عمرو بن العاص رضي الله عنهما حين سأله عن عمله الذي بلغ به أن يقول النبي ﷺ: «يطلع عليكم الآن رجل من أهل الجنة»؟","options":["«أصوم الدهر وأقوم الليل كله»","«لا أجد في نفسي لأحد من المسلمين غشًّا، ولا أحسد أحدًا على خير أعطاه الله إياه»","«أحفظ القرآن كاملًا»","«أتصدق بكل مالي»"],"answer":1,"why":"قال: ما هو إلا ما رأيت، غير أني لا أجد في نفسي لأحد من المسلمين غشًّا ولا أحسد أحدًا على خير أعطاه الله إياه. فقال عبد الله: هذه التي بلغت بك، وهي التي لا نطيق (رواه أحمد).","ref":"ص 4"},{"q":"ما المقصود بالجبلة العنيدة بحسب الدرس، وما الضابط في طاعة الأمير؟","options":["جبلة هواها أن تبحث دائمًا عن الإقناع ولا تقتنع بسهولة، وضابط الطاعة أن تكون في المعروف وألا تكون في معصية الله","جبلة تميل للطاعة المطلقة","جبلة تحب الصمت","جبلة لا تهتم بالأمر"],"answer":0,"why":"هوى الجبلة العنيدة أنها تبحث دائمًا عن الإقناع ولا تقتنع بسهولة بما يُملى عليها، والضابط في الطاعة هو أن تكون في المعروف، وألا تكون في معصية الله، وقد هدد رسول الله ﷺ تهديدًا شديدًا من يطيع في الباطل والضرر. «إنما الطاعة في المعروف».","ref":"ص 6-7"},{"q":"ماذا قال النبي ﷺ عن الذين أمرهم أميرهم بدخول النار فهمّوا بدخولها؟","options":["«أحسنوا في طاعته»","«لا حرج عليهم لو دخلوها»","«كان عليهم أن يدخلوها جميعًا»","«لو دخلوها ما خرجوا منها إلى يوم القيامة؛ الطاعة في المعروف»"],"answer":3,"why":"فهمّوا بدخولها وجعل بعضهم يمسك بعضًا ويقولون: فررنا إلى النبي ﷺ من النار، فما زالوا حتى خمدت النار فسكن غضبه، فبلغ ذلك النبي ﷺ فقال: «لو دخلوها ما خرجوا منها إلى يوم القيامة؛ الطاعة في المعروف» (رواه البخاري).","ref":"ص 6-7"},{"q":"ما الخطوة الأولى لاستقبال النقد الصحيح بحسب نشاط الدرس؟","options":["الدفاع عن النفس فورًا","الانهيار والحزن","قبوله دون تبرير، بقول: «معك حق، شكرًا على تنبيهي»","تجاهل المتكلم"],"answer":2,"why":"في نشاط «كيف أستقبل النقد؟»: إذا كان النقد صحيحًا فتدربي على قبوله دون تبرير، وذلك بقول: «معك حق، شكرًا على تنبيهي». وإذا كان غير صحيح فاسألي نفسك: هل سيؤدي التوضيح إلى فائدة؟ فإن غلب على ظنك ذلك فوضّحي بهدوء.","ref":"ص 7-8"},{"q":"ما نصيحة الدرس لمن تتوقع من الآخرين توقعات عالية؟","options":["أن ترفع سقف توقعاتها أكثر","ألا تسمح لنفسها بالتأمل والأوهام، وأن تبني توقعات واقعية لا خيالية؛ لأن ذلك أدفع للهم والغم","أن تنتظر تحقق ما لم يتحقق لسنوات","أن تتجاهل الجميع"],"answer":1,"why":"فائدة: لا تسمحي لنفسك بالتأمل والأوهام وانتظار أمور غير واقعية من الآخرين، فما لم يتحقق منهم لسنوات طويلة من غير المنطقي الاستمرار في انتظار تحققه، فألزمي نفسك ببناء توقعات واقعية لا خيالية، فهذا أدفع للهم والغم.","ref":"ص 8"}],"11":[{"q":"ما استراتيجية الشيطان في جعل الإنسان يتفلّت من الخير بحسب الدرس؟","options":["أن يدفعه إلى المنكرات الكبيرة فقط","أن يمنعه من النوم","أن يزيّن له الطاعات الكبيرة فقط","أن يأتي إلى المسلم في الطاعات البسيطة فيصغّرها في عينه ويحقّرها له فيتركها"],"answer":3,"why":"استراتيجية الشيطان في جعل الإنسان يتفلّت من الخير وينزلق نحو الشر هي أن يأتي إلى المسلم في الطاعات البسيطة فيصغّرها في عينه ويحقّرها له ويجعله يزدريها فيتركها لشدة احتقاره لها، وكذلك في المعاصي يجعله يستصغر المنكرات فيفعلها ولا يتركها.","ref":"ص 3"},{"q":"ما الشطر الأول في بناء عادات الخير بحسب الدرس؟","options":["البداية بأهداف كبيرة","تجويد العادة قبل اكتسابها","البداية تكون بالقليل الذي يُستحقر","الانتظار حتى يتوفر الوقت"],"answer":2,"why":"الشطر الأول: البداية تكون بالقليل الذي يُستحقر؛ فالبدايات البسيطة وما يحتقره العبد من الطاعات الصغيرة هي ما يصنع الفارق، وهي ما يجب البدء به في بناء عادات الخير الكبيرة والمستمرة.","ref":"ص 3"},{"q":"بمَ يبدأ بر الوالدين وحسن التبعّل وخلق الإحسان والبذل بحسب الدرس؟","options":["كلها تبدأ بالمال","بر الوالدين من التبسم في وجههما، وحسن التبعّل من استقبال الزوج، وخلق الإحسان والبذل من مساعدة بسيطة","كلها تبدأ بالسفر","كلها تبدأ بالنوافل الطويلة"],"answer":1,"why":"فبر الوالدين يبدأ من التبسم في وجههما، وحسن التبعّل يبدأ من استقبال الزوج، وخلق الإحسان والبذل يبدأ من مساعدة بسيطة.","ref":"ص 3"},{"q":"ما المثال الذي ضربه الدرس لمن أرادت صنع عادة تلاوة القرآن وهي لا تقرأ إلا مرة في الأسبوع؟","options":["تبدأ بدقيقتين وتثبت عليهما لشهرين أو ثلاثة قبل الزيادة","تبدأ بجزء كامل كل يوم","تبدأ بختمة في أسبوع","تنتظر رمضان لتبدأ"],"answer":0,"why":"من أرادت أن تصنع عادة تلاوة القرآن وهي لا تقرأ القرآن إلا مرة في الأسبوع مثلًا، فينبغي أن تبدأ بدقيقتين وتثبت عليهما لشهرين أو ثلاثة قبل الزيادة، فبدلًا من الوصول لمرحلة النفور من القرآن لا بد من بناء لياقة إيمانية تتلذذ بتلاوته.","ref":"ص 3"},{"q":"ما الخطوة الثالثة في نشاط «عادة واحدة في كل مرة»؟","options":["رفع الهدف كل يوم","ترك العادة بعد يومين","اختيار عشر عادات","الالتزام بالهدف مدة لا تقل عن أسبوعين دون زيادة"],"answer":3,"why":"خطوات النشاط: ١) اختيار عادة واحدة ترغبين في اكتسابها أكثر من غيرها، ٢) تحديد هدف صغير جدًا يمكن الالتزام به يوميًّا، ٣) الالتزام بهذا الهدف مدة لا تقل عن أسبوعين دون زيادة، ٤) بعد أن يصبح عادة مستقرة الانتقال إلى رفع مستواه أو بدء عادة جديدة.","ref":"ص 4"},{"q":"ما معنى «المعروف» في قوله ﷺ: «لا تحقرنّ من المعروف شيئًا ولو أن تلقى أخاك بوجه طلق»؟","options":["المال فقط","الصلاة فقط","كل خير وطاعة ونفع، وعكسه المنكر","العلم فقط"],"answer":2,"why":"قول رسول الله ﷺ: «لا تحقرنّ من المعروف شيئًا ولو أن تلقى أخاك بوجه طلق» (رواه مسلم): المعروف هو الخير والطاعة والنفع، وعكسه المنكر.","ref":"ص 4"},{"q":"ما حكم عبوس الزوجين في وجه بعضهما دون سبب عند بعض علماء الشريعة بحسب الدرس؟","options":["مستحب","حرّمه بعضهم باعتباره مخلًّا بالمعاملة بالمعروف","مباح دائمًا","واجب"],"answer":1,"why":"ذكر علماء المسلمين خُلق العبوس وتقطيب الجبين ضمن الأخلاق السيئة، والتبسم في وجه الآخرين هو أبسط الأخلاق الحسنة، وهناك من علماء الشريعة من حرّم على الزوجين أن يعبسا في وجه بعضهما دون سبب باعتبار أنه مخلّ بالمعاملة بالمعروف.","ref":"ص 4"},{"q":"ما الذي تدل عليه قصة المرأة البغي التي سقت الكلب بحسب الدرس؟","options":["أنها لو احتقرت عملها هذا أو احتقرت نفسها لربما حُرمت من جنة عرضها السماوات والأرض","أن الكلاب أفضل من الناس","أن المعاصي لا تضر","أن العمل الصغير لا يُكتب"],"answer":0,"why":"قال ﷺ: «بينما كلب يطيف بركية يكاد يقتله العطش إذ رأته بغيّ من بغايا بني إسرائيل فنزعت موقها فسقته فغفر لها به» (رواه البخاري). فلو أن هذه المرأة احتقرت عملها هذا أو احتقرت نفسها لربما حُرمت من جنة عرضها السماوات والأرض.","ref":"ص 5"},{"q":"ما العمل البسيط الذي ذكره بلال رضي الله عنه وسبب سماع النبي ﷺ خشخشة نعليه في الجنة؟","options":["صيام الدهر","قيام الليل كله","ختم القرآن كل يوم","ما أحدث قط إلا توضأ، وما توضأ قط إلا صلى ركعتين"],"answer":3,"why":"أجاب بلال رضي الله عنه: «يا رسول الله ما أذّنت قط إلا صليت ركعتين، وما أصابني حدث قط إلا توضأت عندها ورأيت أن لله عليّ ركعتين» فقال رسول الله ﷺ: «بهما» (رواه الترمذي).","ref":"ص 5-6"},{"q":"ما الشطر الثاني في بناء عادات الخير، وما الحديث الذي استدل به الدرس عليه؟","options":["السرعة في الزيادة، وحديث: «أكثروا ولو شق عليكم»","ترك العادة عند الملل","الثبات والاستمرارية، وحديث: «أحب الأعمال إلى الله أدومها وإن قلّ»","التنويع كل يوم"],"answer":2,"why":"الشطر الثاني: الثبات والاستمرارية؛ فتثبيت الخير والانضباط في عادات الخير لا يمكن تصوّر نفعه وفوائده، ومن أكثر الأدلة دلالة على ذلك لمّا سُئل النبي ﷺ: «أي الأعمال أحب إلى الله؟» قال: «أدومها وإن قلّ» (رواه البخاري).","ref":"ص 6"}],"12":[{"q":"ما العدوان الأساسيان في بناء العادات بحسب الدرس؟","options":["التسرع والفوضى","الكسل والنوم","المال والوقت","الخوف والحياء"],"answer":0,"why":"كل الأشخاص الناجحين في بناء عادات الخير الدنيوية والأخروية هم الذين أدركوا العدوّين الأساسيين في بناء العادات المتمثلين في: التسرع والفوضى، وبنوا أنفسهم من خلال العمل على أهداف وعادات صغيرة واضحة.","ref":"ص 2"},{"q":"ما الذي يؤدي إلى انتكاس كثير من النفوس في العبادات بحسب الدرس؟","options":["الإقبال عليها بتدرج وحكمة","الاقتصار على الفرائض","كثرة المراجعة","الإقبال الكبير عليها بشكل عشوائي فوضوي متسرع (كختمات متتالية وصلوات كثيرة)"],"answer":3,"why":"قد تملّ كثير من النفوس من العبادات بسبب إقبالها الكبير عليها بشكل عشوائي فوضوي متسرع (ختمات متتالية، صلوات كثيرة...)، مما يؤدي إلى الانتكاس في نهاية الأمر.","ref":"ص 2"},{"q":"ما القاعدة الأولى للاستمرار والانضباط في بناء العادات؟ وما الحديث الذي ذُكر فيها؟","options":["الاعتماد على التخطيط وحده، وحديث: «إنما الأعمال بالنيات»","تقليد الآخرين، وحديث: «من تشبه بقوم»","الاستعانة بالله تعالى، وحديث: «احرص على ما ينفعك واستعن بالله ولا تعجز»","الانتظار، وحديث: «إذا أقبلت فخذها»"],"answer":2,"why":"من القواعد: الاستعانة بالله تعالى؛ قال رسول الله ﷺ: «احرص على ما ينفعك واستعن بالله ولا تعجز» (رواه مسلم). وحضور القلب واستشعار الاستعانة بالله والتوكل عليه هو أعظم ما يعين على الالتزام بالعادات، مع عدم تضخيم الأسباب وعدم احتقارها.","ref":"ص 3"},{"q":"ما الذي ينبغي أن يدعو به المسلم يوميًّا ليوفقه الله لخطط خاصة تناسبه بحسب الدرس؟","options":["﴿قل هو الله أحد﴾ مئة مرة","﴿إياك نعبد وإياك نستعين﴾ سبع عشرة مرة على الأقل","﴿ربنا آتنا في الدنيا حسنة﴾ مرة واحدة","﴿ألا بذكر الله تطمئن القلوب﴾ ثلاث مرات"],"answer":1,"why":"يدعو المسلم ربه يوميًّا بـ ﴿إياك نعبد وإياك نستعين﴾ [الفاتحة: 5] سبع عشرة مرة على الأقل، وذلك ليوفقه الله تعالى لخطط خاصة تناسبه في مختلف عاداته وأعماله.","ref":"ص 4"},{"q":"ما الصحيح في وضع الخطة عند بدء التغيير بحسب الدرس؟","options":["أن يبدأ الإنسان بوضع خطة بسيطة ويسير عليها، فيجد أن كل مرحلة تمهّد لما بعدها تلقائيًّا","أن يضع خطة كاملة متكاملة قبل أي بداية","أن يكثر من الخطط على الورق","أن ينتظر خطة تناسب الجميع"],"answer":0,"why":"كثير من الناس يسعون إلى وضع خطة كاملة متكاملة قبل أن يبدؤوا في تحقيق أهدافهم، وهذا ما يسبب لهم التماطل والتأخر في البدء، والصحيح أن يبدأ الإنسان في التغيير بوضع خطة بسيطة ويسير عليها، ليجد بعد انضباطه عليها أن كل مرحلة تمهّد لما بعدها تلقائيًّا.","ref":"ص 4"},{"q":"ماذا قال عمر بن الخطاب رضي الله عنه عن إقبال القلوب وإدبارها؟","options":["«القلوب كلها مقبلة دائمًا»","«إذا أدبرت فاتركوا العبادة»","«الفرائض عند الإقبال والنوافل عند الإدبار»","«إن لهذه القلوب إقبالًا وإدبارًا، فإذا أقبلت فخذوها بالنوافل، وإن أدبرت فألزموها الفرائض»"],"answer":3,"why":"يقول عمر بن الخطاب رضي الله عنه: «إن لهذه القلوب إقبالًا وإدبارًا، فإذا أقبلت فخذوها بالنوافل، وإن أدبرت فألزموها الفرائض».","ref":"ص 4"},{"q":"ماذا قال النبي ﷺ لحنظلة وأبي بكر لمّا وجدا في نفسيهما فتورًا بعد مفارقة مجلسه؟","options":["«استمرا على ما أنتما عليه دائمًا»","«اتركا العبادة حتى يعود النشاط»","«ولكن يا حنظلة ساعة وساعة» ثلاث مرات","«عليكما بقيام الليل كله»"],"answer":2,"why":"قال ﷺ: «والذي نفسي بيده، إن لو تدومون على ما تكونون عندي وفي الذكر لصافحتكم الملائكة على فُرُشكم وفي طرقكم، ولكن يا حنظلة ساعة وساعة، ثلاث مرات» (رواه مسلم).","ref":"ص 5"},{"q":"ما القول المنقول عن أحد السلف في مجاهدة النفس على القيام؟","options":["«قمت الليل فوجدت اللذة من أول ليلة»","«كابدت نفسي على القيام عشرين سنة، وتلذذت به عشرين سنة»","«تركت القيام لقلة الخشوع»","«كابدت نفسي على الصيام يومًا»"],"answer":1,"why":"يقول أحد السلف: «كابدت نفسي على القيام عشرين سنة، وتلذذت به عشرين سنة»؛ فالصفاء والإقبال الكامل نادر، لذلك ينبغي تدريب النفس على العمل رغم عدم الصفاء والانبساط.","ref":"ص 5"},{"q":"ما الواجب على من ارتكب ذنبًا بحسب قاعدة «إتباع السيئة الحسنة»؟","options":["أن يأتي بالحسنة أسرع ما يمكن بعد الذنب، وكلما أسرع كان أفضل في تقوية الإرادة","أن يترك الطاعات لأنه لا يستحق الوقوف بين يدي الله","أن ينتظر حتى يزول الشعور بالذنب","أن يؤخر الحسنة إلى اليوم التالي"],"answer":0,"why":"من يتوقف عن فعل الطاعات بسبب شعوره بالسوء الناتج عن ارتكاب الذنب، ويسيطر عليه شعور أنه لا يستحق الوقوف بين يدي الله، فهذا من وساوس الشيطان، إذ ينبغي أن يأتي المسلم بالحسنة أسرع ما يمكن بعد ارتكابه للذنب.","ref":"ص 6"},{"q":"كيف يكون التعويض عند عدم الالتزام بالعادة بحسب الدرس؟","options":["في اليوم التالي بمضاعفة المقدار","يُشترط فيه الإتيان بالعادة كاملة","لا يُشرع التعويض أبدًا","في اليوم نفسه فور الاستطاعة، ويكفي 40% أو 50% منها أو أقل"],"answer":3,"why":"التعويض فورًا عند الاستطاعة في نفس اليوم، ولا يشترط فيه الإتيان بالعادة كاملة، يكفي 40% أو 50% منها أو حتى أقل، والمهم أن يكون التعويض في اليوم نفسه. ويُمنع التعويض في اليوم التالي، فما لم يتم تعويضه في اليوم نفسه لا يُعوّض في اليوم التالي.","ref":"ص 6-7"}],"13":[{"q":"ما الذي حدث لعلم النبي ﷺ بموعد ليلة القدر بحسب حديث عبادة بن الصامت رضي الله عنه؟","options":["نسيها النبي ﷺ لمرض أصابه","تلاحى رجلان من المسلمين فرُفعت، فقال ﷺ: «خرجت لأخبركم بليلة القدر فتلاحى فلان وفلان فرُفعت»","نزل الوحي بإخفائها دون سبب","أخبر بها الصحابة جميعًا"],"answer":1,"why":"عن عبادة بن الصامت رضي الله عنه: خرج النبي ﷺ يخبرنا بليلة القدر، فتلاحى رجلان من المسلمين فقال: «خرجت لأخبركم بليلة القدر، فتلاحى فلان وفلان فرُفعت، وعسى أن يكون خيرًا لكم، فالتمسوها في التاسعة والسابعة والخامسة» (رواه البخاري). وهذا يدل على عظم أمر الخصومة وسوء الخلق.","ref":"ص 2"},{"q":"ما أصل سوء الخلق بحسب الدرس؟","options":["شح النفس وبخلها على الآخرين بوقتها وجهدها وخدماتها ومدحها وشكرها وثنائها","قلة العلم بالأحكام","كثرة الأموال","طول الصحبة"],"answer":0,"why":"أصل سوء الخلق هو شح النفس وبخلها على الآخرين بوقتها وجهدها وخدماتها وبالمدح والشكر والثناء. فالتزكية مع الآخرين هي تقديم حسن الخلق بحكمة وتأخير شح النفس.","ref":"ص 2"},{"q":"ما الآية التي مدح الله بها رسوله ﷺ في الخلق بحسب الدرس؟","options":["﴿إنا أعطيناك الكوثر﴾","﴿ورفعنا لك ذكرك﴾","﴿ألم نشرح لك صدرك﴾","﴿وإنك لعلى خلق عظيم﴾"],"answer":3,"why":"قال الله جل جلاله عندما مدح رسوله ﷺ: ﴿وإنك لعلى خلق عظيم﴾ [القلم: 4]. وقال ﷺ مبيّنًا إحدى أولويات بعثته: «إنما بعثت لأتمم مكارم الأخلاق» (أخرجه البيهقي).","ref":"ص 2"},{"q":"ما الذي يبلغه المؤمن بحسن خلقه بحسب الحديث الوارد في الدرس؟","options":["درجة الشهيد فقط","درجة الأنبياء","درجة الصائم القائم","لا شيء"],"answer":2,"why":"يقول ﷺ: «إن المؤمن ليدرك بحسن خلقه درجة الصائم القائم» (رواه أبو داود)، وهذا لشدة صعوبة تزكية الأخلاق على النفس، ولأن حسن الخلق يحتاج إلى احتساب ومجاهدة وإلى إسكات شح النفس والجود بالأخلاق الحسنة بمختلف جوانبها.","ref":"ص 3"},{"q":"ما الذي ذكره الدرس من علامات سوء الخلق؟","options":["كثرة الصمت","أن يجد الشخص استثقالًا من معظم من حوله في التعامل معه، وألا يتسامح مع من أخطأ في حقه، وأن تستثقل نفسه تأدية طلبات الآخرين","كثرة قراءة القرآن","حب النظافة"],"answer":1,"why":"من علامات سوء الخلق: أن يجد الشخص استثقالًا من معظم من حوله في التعامل معه في أغلب الأحيان، وألا يتسامح مع من أخطأ في حقه، وأن تستثقل نفسه تأدية طلبات الآخرين.","ref":"ص 3"},{"q":"إلى أي شقّين قسّم الدرس تزكية النفس مع الآخرين، وما الآية الدالة على ذلك؟","options":["العدل والإحسان، وقوله تعالى: ﴿إن الله يأمر بالعدل والإحسان وإيتاء ذي القربى﴾","الصبر والشكر، وقوله تعالى: ﴿إن مع العسر يسرًا﴾","الصدق والأمانة، وقوله تعالى: ﴿وقولوا للناس حسنًا﴾","العلم والعمل، وقوله تعالى: ﴿اقرأ باسم ربك﴾"],"answer":0,"why":"أمر الله عباده بتزكية النفس مع الآخرين على شقين رئيسيين، قال جل جلاله: ﴿إن الله يأمر بالعدل والإحسان وإيتاء ذي القربى وينهى عن الفحشاء والمنكر والبغي يعظكم لعلكم تذكرون﴾ [النحل: 90].","ref":"ص 3"},{"q":"ما معنى العدل في المعاملة بحسب الدرس، وما الآية المذكورة؟","options":["التنازل عن الحق دائمًا","إعطاء الآخر فوق حقه","ترك الحقوق كلها","المعاملة بالمثل، وقوله تعالى: ﴿وإن عاقبتم فعاقبوا بمثل ما عوقبتم به ولئن صبرتم لهو خير للصابرين﴾"],"answer":3,"why":"العدل لغةً هو المعاملة بالمثل، فمن وصله يصله ومن قطعه يقطعه، قال تعالى: ﴿وإن عاقبتم فعاقبوا بمثل ما عوقبتم به ولئن صبرتم لهو خير للصابرين﴾ [النحل: 126].","ref":"ص 3"},{"q":"ما شقّا الإحسان بحسب الدرس؟","options":["أخذ الحق كاملًا وإعطاء الحق كاملًا","الانتقام ثم العفو","إعطاء الآخر فوق حقه، والتنازل عن حق النفس احتسابًا للأجر (العفو والصفح والمغفرة)","ترك الناس وعدم الاختلاط بهم"],"answer":2,"why":"الإحسان فيه شقان: إعطاء الآخر فوق حقه، فهو درجة فوق الواجب، والتنازل عن حق النفس احتسابًا للأجر عند الله تعالى وإيمانًا بوعد الله لمن حسّن خلقه (العفو والصفح والمغفرة).","ref":"ص 4"},{"q":"ماذا قال النبي ﷺ في صلة الرحم بحسب الدرس؟","options":["«الواصل من وصل من وصله فقط»","«ليس الواصل بالمكافئ، ولكن الواصل الذي إذا قُطعت رحمه وصلها»","«صلة الرحم مستحبة لمن أحب فقط»","«لا تصل من قطعك»"],"answer":1,"why":"يقول ﷺ في صلة الرحم: «ليس الواصل بالمكافئ، ولكن الواصل الذي إذا قُطعت رحمه وصلها» (رواه البخاري)، فمن يتعامل بالمثل مع رحمه ليس واصلًا في الحقيقة بل هو مكافئ.","ref":"ص 4"},{"q":"ما الأصل في العلاقة الزوجية بحسب الدرس، وما موضع الاستثناء في العدل؟","options":["هي مبنية على الفضل لا على العدل باتفاق فقهاء المذاهب الأربعة، ويُلجأ إلى العدل عند الخلاف بحكمة دون كثرة لجوء إليه","مبنية على العدل المحض دون إحسان","لا علاقة للإحسان بها","مبنية على المكافأة فقط"],"answer":0,"why":"الأصل في العلاقة الزوجية — باتفاق فقهاء المذاهب الأربعة — أنها مبنية على الفضل لا على العدل؛ فالإحسان هو الأصل في كل العلاقات القريبة، مع اللجوء إلى العدل عند الخلاف بحكمة وعدم كثرة اللجوء إليه.","ref":"ص 4"}],"14":[{"q":"ما القاعدة التي لا ينبغي أن يربطها المسلم بأخطاء من حوله بحسب الدرس؟","options":["أخطاء الآخرين فقط","أخطاء الماضي البعيد فقط","أخطاؤه هو، فلا يبرّرها بسوء تعامل من حوله معه حتى إن كانوا مخطئين فعلًا","لا قاعدة في ذلك"],"answer":2,"why":"القاعدة الخامسة: لا تربطي أخطاءك وتبريرها بسوء تعامل من حولك معك، حتى إن كانوا مخطئين فعلًا؛ فالقرآن الكريم يعلّم المسلم في كثير من المواضع أن يراجع نفسه، وأنه ليس لأحد سلطان على أحد فيضلّه أو يخطئه.","ref":"ص 3"},{"q":"ما الآية التي استدل بها الدرس على أن الشيطان لا سلطان له على الإنسان إلا بدعوته؟","options":["﴿إن الله لا يغفر أن يشرك به﴾","﴿وما كان لي عليكم من سلطان إلا أن دعوتكم فاستجبتم لي﴾","﴿قل هو الله أحد﴾","﴿ولقد يسرنا القرآن للذكر﴾"],"answer":1,"why":"قال تعالى: ﴿وما كان لي عليكم من سلطان إلا أن دعوتكم فاستجبتم لي﴾ [إبراهيم: 22]؛ فالشيطان لا يسيطر على الإنسان إلا بسبب غضبه وضعفه وأهوائه وبسبب الانتقام الذي يحمله، فيأتي على نقاط الضعف هذه ويملي عليه ما يفعله.","ref":"ص 3"},{"q":"ما الفرق بين آدم وإبليس في التعامل مع الأخطاء كما ذكر العلماء بحسب الدرس؟","options":["تعليق الأخطاء على الغير من عمل الشيطان، بينما آدم اعترف بخطئه","آدم علّق خطأه على غيره وإبليس اعترف","كلاهما اعترف بخطئه","كلاهما علّق خطأه على غيره"],"answer":0,"why":"العلماء لمّا تحدثوا عن الفرق بين آدم وإبليس في التعامل مع الأخطاء بيّنوا أن تعليق الأخطاء على الغير من عمل الشيطان، بينما آدم اعترف بخطئه. فلا يحق لأحد أن يلقي مساوئه على غيره.","ref":"ص 3"},{"q":"ما الذي ينبغي أن يدركه الابن بشأن سوء خلقه وتربية والديه بحسب الدرس؟","options":["أنه معذور دائمًا بسوء تربيتهما","أنه لا يستطيع تغيير خلقه أبدًا","أنه يلوم والديه ليتغير","أنه مأمور بالفرار من قدر سوء التربية إلى قدر حسن التزكية، فما تربّى عليه ليس إجبارًا له على خلقه ولا يلغي اختياره"],"answer":3,"why":"كثيرًا ما يحدث أن يبرر الابن سوء خلقه بسوء تربية والديه له، فينبغي الحذر منه؛ فالمسلم مأمور بالفرار من قدر سوء التربية إلى قدر حسن التزكية، لأن ما تربّى عليه ليس إجبارًا له على خلقه ولا يلغي اختياره ولا تزكيته لنفسه.","ref":"ص 3"},{"q":"ما المثال الذي ذكره الدرس لمراعاة أولويات الطرف الآخر في فتح المواضيع؟","options":["أن تفتح الأم مواضيع لا تهم الابنة","أن يتحدث الزوج عن عمله فقط","إذا كانت الأم تهتم بالطبخ فمن البر الحديث معها حول هذا الأمر، وإذا كان الزوج يحب الحديث عن السياسة فمن حسن الخلق أن تطّلع الزوجة على بعض الأخبار السياسية وتجاذبه أطراف الحديث","ألا يتحدثوا في أي موضوع"],"answer":2,"why":"من حسن التزكية في فتح المواضيع: معرفة أولويات الطرف الآخر والمواضيع التي يحب الحديث عنها ليتحدث معه بما يحب في حدود ما يرضي الله؛ فإذا كانت الأم تهتم بالطبخ فمن البر الحديث معها حول هذا الأمر، وإذا كان الزوج يحب الحديث عن السياسة فمن حسن الخلق والحكمة أن تطلع الزوجة على بعض الأخبار السياسية وإن لم تكن تحب ذلك.","ref":"ص 3"},{"q":"ما الذي ينبغي عند الحديث مع الأم أو غيرها من المقرّبات حين تتحدث عن مشكلاتها وإخفاقاتها؟","options":["الإكثار من النصائح فورًا","إبداء التعاطف والتقدير لما تمرّ به، وعدم التسرع في النصح أو النقد، وعدم التخفيف عنها بطريقة قد تكسرها","لومها وإشعارها بالذنب","تجاهل حديثها"],"answer":1,"why":"تحب المرأة الحديث عن المشكلات والإخفاقات أكثر؛ لذلك من المهم عند الحديث مع الأم (أو غيرها من المقرّبات) إبداء التعاطف والتقدير لما تمر به، وعدم التسرع في النصح أو المبالغة فيه، وعدم التسرع في النقد، وعدم التخفيف عنها بطريقة قد تكسرها؛ فالأنثى تحتاج إلى من يخفف من لومها لنفسها.","ref":"ص 4"},{"q":"ما معيار الخطأ في العلاقات القريبة القائمة على الإحسان بحسب الدرس؟","options":["حزن الطرف الآخر أو غضبه، حتى إن كان الفعل الذي سبّب الغضب أو الحزن صحيحًا تمامًا وموضوعيًّا","الخطأ ما حدده القانون فقط","لا يوجد معيار","الخطأ ما فعله الآخرون فقط"],"answer":0,"why":"القاعدة السابعة: أعتذر عندما يصدر مني خطأ؛ فمعيار الخطأ في العلاقات القريبة القائمة على الإحسان هو حزن الطرف الآخر أو غضبه، حتى إن كان الفعل الذي سبّب الغضب أو الحزن صحيحًا تمامًا وموضوعيًّا.","ref":"ص 5"},{"q":"ما النصيحة التي ذكرها الدرس عند الاعتذار؟","options":["أن تبرري خطأك مطولًا","ألا تعتذري أبدًا","أن تعتذري عن أمر آخر لا علاقة له بالموضوع","الاعتذار دون تبرير الخطأ إلا إن طلب الطرف الآخر شرحًا، وأن يكون الاعتذار عمّا يؤذيه تحديدًا"],"answer":3,"why":"نصيحة: عندما تخطئين اعتذري دون تبرير لخطئك، إلا إن طلب الطرف الآخر شرحًا، وعند الاعتذار أحسني اختيار موضوع الاعتذار؛ بأن تعتذري عمّا يؤذي الطرف الآخر تحديدًا، فكثيرًا ما يحزن منا من حولنا لأننا أسأنا اختيار التعبير أو الأسلوب أو التوقيت.","ref":"ص 6"},{"q":"ما الذي ذكره الدرس في قاعدة «أشكر الآخرين» عن المدح؟","options":["المدح محرم دائمًا","المدح يكون في أعمال القلوب كالإخلاص","ثقافة الإسلام قائمة على الشكر والمدح والثناء، والبخل بالمدح والثناء والكلام اللطيف من سوء الخلق ومن الشح والفظاظة","الشكر لا يشرع للأقارب"],"answer":2,"why":"ثقافة الإسلام قائمة على الشكر والمدح والثناء، وليس المقصود تزكية الآخرين بمدحهم في أعمال القلوب (التقوى والإخلاص...) وإنما في سياق الصفات الظاهرة (الصبر، تحمل المسؤولية، المواظبة على الصلاة...)، فمدح الناس لتشجيعهم على الطاعة قد يكون واجبًا أحيانًا، والبخل بالمدح والثناء والكلام اللطيف هو من سوء الخلق ومن الشح والفظاظة.","ref":"ص 6"},{"q":"كيف ينبغي التعامل مع الأشخاص حادّي الطباع عند غضبهم بحسب الدرس؟","options":["الرد عليهم بالمثل فورًا","تجنب ما يثير غضبهم، وعدم أخذ كلامهم في مواقف الغضب بعين الاعتبار","مناقشتهم أثناء غضبهم","مقاطعتهم دائمًا"],"answer":1,"why":"بعض الأشخاص حادّو الطباع، عند انتهاك أمر كبير بالنسبة لهم قد يتكلمون بكلام جارح ومؤذٍ، ومن حسن التزكية معهم: تجنب ما يثير غضبهم، وعدم أخذ كلامهم في مواقف الغضب بعين الاعتبار، فما يتفوهون به هو من وساوس الشيطان ولا يعني بالضرورة أنه يجول بخواطرهم أو يعتقدونه.","ref":"ص 7"}],"15":[{"q":"ما المفتاح العظيم الذي أرشد إليه النبي ﷺ للاستعداد للبلاء؟","options":["«أكثر من المال في الرخاء»","«اترك الأسباب عند البلاء»","«انتظر البلاء ثم استعد»","«تعرّف إلى الله في الرخاء يعرفك في الشدة»"],"answer":3,"why":"أرشد رسول الله ﷺ إلى مفتاح عظيم للاستعداد للبلاء حيث قال: «تعرّف إلى الله في الرخاء يعرفك في الشدة» (أخرجه أحمد)؛ فكلما أحسن العبد الاستعداد قبل البلاء حوّل البلاء إلى عطاء.","ref":"ص 2"},{"q":"ما المقامات الثلاثة التي يشبه فيها التعامل مع الله في الرخاء التعامل مع البلاء؟","options":["الخوف، والرجاء، والمحبة","العلم، والعمل، والدعوة","الصبر، والرضا والتسليم، والحمد والشكر","الصلاة، والصيام، والزكاة"],"answer":2,"why":"التعامل مع الله تعالى في الرخاء (عبادات الرخاء) يشبه إلى حد كبير التعامل مع البلاء من بعض الوجوه، خاصة في هذه المقامات الثلاثة: الصبر، والرضا والتسليم، والحمد والشكر.","ref":"ص 2"},{"q":"ماذا قال ابن القيم رحمه الله عن الإيمان في الصبر والشكر؟","options":["«الإيمان كله صبر»","«الإيمان نصفان: نصف صبر ونصف شكر»","«الإيمان ثلاثة أثلاث»","«الإيمان قول فقط»"],"answer":1,"why":"قال ابن القيم رحمه الله: «الإيمان نصفان: نصف صبر ونصف شكر»، وقال ابن تيمية رحمه الله: «بل الشكر خاصة يحتاج إلى صبر»، قال تعالى: ﴿وأما من خاف مقام ربه ونهى النفس عن الهوى﴾ [النازعات: 40].","ref":"ص 2"},{"q":"ما الذي يسبق الرضا والتسليم في الترتيب بحسب الدرس؟","options":["الصبر؛ فاعتياد الصبر متطلب سابق للرضا والتسليم","الحمد","الجزع","التسخط"],"answer":0,"why":"الصبر متطلب سابق للرضا والتسليم، فاعتياد الصبر يقوي النفس ويسهل عليها الرضا، أما النفس الضعيفة العجولة التي لا تصبر ولا تحتمل المعاناة والألم فلن تصل للرضا.","ref":"ص 3"},{"q":"ما الحديث الذي استدل به الدرس على أن شدة الدنيا ونعيمها ينسيان بمجرد غمسة في النار أو الجنة؟","options":["حديث الأعمال بالنيات","حديث جبريل عليه السلام","حديث الجارية والفأر","يُؤتى بأنعم أهل الدنيا من أهل النار فيُصبغ في النار صبغة فيُسأل: هل رأيت خيرًا قط؟ فيقول: لا والله يا رب"],"answer":3,"why":"قال ﷺ: «يُؤتى بأنعم أهل الدنيا من أهل النار يوم القيامة فيُصبغ في النار صبغة، ثم يقال: يا ابن آدم هل رأيت خيرًا قط؟ هل مرّ بك نعيم قط؟ فيقول: لا والله يا رب...» (رواه مسلم)؛ هذا هو شقاء الدنيا ونعيمها ينسى بمجرد غمسة واحدة.","ref":"ص 3"},{"q":"ما معنى «إن الله تعالى لم يأمر بأمر إلا لحكمة، ولم ينه عن أمر إلا لحكمة» بحسب الدرس؟","options":["أن كل حكمة يدركها الإنسان تمامًا","أن الأوامر بلا حكمة","لم يأمر بأمر إلا لأن مصلحته أكبر من ضرره، ولم ينه عن أمر إلا لأن ضرره أكبر من نفعه","أن الحكمة للنوافل فقط"],"answer":2,"why":"يقول العلماء: «إن الله تعالى لم يأمر بأمر إلا لحكمة، ولم ينه عن أمر إلا لحكمة»؛ أي لم يأمر بأمر إلا لأن مصلحته أكبر من ضرره، ولم ينه عن أمر إلا لأن ضرره أكبر من نفعه.","ref":"ص 3"},{"q":"ما الذي ذكره الدرس من أضرار الغيبة مثالًا على الحكمة من التحريم؟","options":["لا ضرر لها","تشوّه صورة الناس في نفوس بعضهم بعضًا، وتزرع الحقد بين الأفراد، وتفقد الشعور بالأمان، وتجعل الإنسان محتقرًا للآخرين","تزيد الرزق","تقوّي العلاقات"],"answer":1,"why":"الحكمة من تحريم الغيبة أن لها أضرارًا كثيرة منها أنها: تشوّه صورة الناس في نفوس بعضهم بعضًا، تزرع الحقد بين الأفراد، تفقد الشعور بالأمان، وتجعل الإنسان محتقرًا للآخرين. والله تعالى لم يحرّم الغيبة إلا لضررها الذي يفوق نفعها.","ref":"ص 3-4"},{"q":"ما المستوى الأعلى والأخير من المقامات الثلاثة؟","options":["الحمد والشكر، وهو أعلى مراتب اليقين","الصبر","الرضا","التسخط"],"answer":0,"why":"الحمد والشكر هو المستوى الأعلى والأخير، ويكون بالعلم بالحكم التفصيلية والخيرات من الأوامر والنواهي، فيصبح المؤمن في هذه المرتبة حامدًا لله أن فرض عليه الفرائض وحرّم عليه المحرمات. فالصبر حبس للنفس على الطاعات وترك المحرمات، والرضا تسليم بالأوامر الشرعية لإدراك حكمتها، أما الحمد فهو أعلى مراتب اليقين.","ref":"ص 4-5"},{"q":"ما حكم الصبر في الشدة وما قسما التسخط بحسب الدرس؟","options":["الصبر مستحب، والتسخط قسم واحد","الصبر مباح، والتسخط بالقلب فقط","الصبر مكروه، والتسخط ثلاثة أقسام","الصبر فرض بإجماع العلماء، والتسخط قسمان: بالقول وبالفعل"],"answer":3,"why":"الصبر: هو حبس النفس عن التسخط، وهو فرض بإجماع العلماء، والتسخط يكون بترك الفرائض أو فعل المحرمات، وهو قسمان: تسخط بالقول (أي قول كل كلمة لا ترضي الله جل جلاله)، وتسخط بالفعل (مثل ترك الصلاة، ترك الحجاب، العلاقات المحرمة بعد الطلاق...).","ref":"ص 5"},{"q":"ماذا تقول المؤمنة عند وقوع المصيبة بحسب حديث أم سلمة رضي الله عنها؟","options":["«حسبي الله» فقط ثم الصمت","«لا حول ولا قوة إلا بالله» فقط","﴿إنا لله وإنا إليه راجعون﴾، «اللهم أجرني في مصيبتي، وأخلف لي خيرًا منها»","لا تقول شيئًا"],"answer":2,"why":"عن أم سلمة رضي الله عنها أن رسول الله ﷺ قال: «ما من مسلم تصيبه مصيبة فيقول ما أمره الله: ﴿إنا لله وإنا إليه راجعون﴾ [البقرة: 156]، اللهم أجرني في مصيبتي، وأخلف لي خيرًا منها، إلا أخلف الله له خيرًا منها» (رواه مسلم).","ref":"ص 8"}]},"s2":{"1":[{"q":"من هما أفضل أمهات المؤمنين بحسب الدرس؟","options":["أم سلمة وحفصة رضي الله عنهما","خديجة وعائشة رضي الله عنهما","زينب وجويرية رضي الله عنهما","سودة وصفية رضي الله عنهما"],"answer":1,"why":"أفضل أمهات المؤمنين هنّ خديجة وعائشة رضي الله عنهما؛ فقد وردت نصوص كثيرة في فضلهما.","ref":"ص 4"},{"q":"أيّ الصحابيات أكثر رواية للحديث بحسب الدرس؟","options":["عائشة رضي الله عنها","أم سلمة رضي الله عنها","حفصة رضي الله عنها","أسماء بنت أبي بكر رضي الله عنها"],"answer":0,"why":"رُوي عن عائشة رضي الله عنها أكثر من ألفي حديث، وكانت من أعلم الناس بالفقه والحديث.","ref":"ص 4"},{"q":"بأي لقب اشتهرت زينب بنت خزيمة رضي الله عنها؟","options":["ذات النطاقين","الصديقة","أم الشهداء","أم المساكين"],"answer":3,"why":"اشتهرت زينب بنت خزيمة بالكرم حتى لُقبت بـ«أم المساكين» لكثرة عطائها وصدقاتها.","ref":"ص 5"},{"q":"بماذا اشتهرت أم عمارة (نسيبة بنت كعب) رضي الله عنها؟","options":["التجارة والمال","الشعر والبيان","التضحية يوم أحد، حين ربطت جرح ابنها وشجعته على مواصلة القتال","الهجرة وحدها إلى المدينة"],"answer":2,"why":"كانت مثالًا في التضحية يوم أُحد، فقال عنها النبي ﷺ: «من يطيق ما تطيقين يا أم عمارة».","ref":"ص 5"},{"q":"ما الموقف الذي ظهرت فيه حكمة أم سلمة رضي الله عنها وحسن رأيها؟","options":["يوم أحد حين ثبتت في القتال","يوم الحديبية، حين أشارت على النبي ﷺ أن ينحر الهدي أمام الناس ليقتدوا به","يوم الهجرة إلى الحبشة","حين باعت بستانها طمعًا في نخلة بالجنة"],"answer":1,"why":"عُرفت أم سلمة بالحكمة والرشد، وكان في رأيها يوم الحديبية الخير والفرج.","ref":"ص 5"},{"q":"ماذا قالت أم الدحداح رضي الله عنها لما باع زوجها بستانه طمعًا في نخلة بالجنة؟","options":["«ربح البيع»","«خسر البيع»","«إنا لله وإنا إليه راجعون» ورفضت","«لا بد من استشارة الأهل»"],"answer":0,"why":"قالت دون تردد: «ربح البيع»، فكانت نموذجًا في طاعة الزوج والتسليم لأمر الله والتصدق بما تحب.","ref":"ص 5"},{"q":"ما الذي نزل القرآن مؤيدًا لموقف أم كلثوم بنت عقبة رضي الله عنها؟","options":["صبرها على الغربة في الحبشة","إنفاقها على المساكين","تضحيتها يوم أحد","ثباتها على الدين حين خرجت وحدها مهاجرة إلى المدينة"],"answer":3,"why":"خرجت وحدها مهاجرة إلى المدينة فنزل قوله تعالى: ﴿فَإِنْ عَلِمْتُمُوهُنَّ مُؤْمِنَاتٍ فَلَا تَرْجِعُوهُنَّ إِلَى الْكُفَّارِ﴾ [الممتحنة: 10].","ref":"ص 6"},{"q":"من كانت أول من آمن برسالة النبي ﷺ بحسب الدرس؟","options":["عائشة رضي الله عنها","أسماء بنت أبي بكر رضي الله عنها","خديجة رضي الله عنها","أم سلمة رضي الله عنها"],"answer":2,"why":"كانت خديجة رضي الله عنها الصدّيقة الأولى، أول من آمن برسالة النبي ﷺ ووقفت بجانبه تثبته وتخفف عنه ما يلاقيه من تكذيب المشركين.","ref":"ص 4"},{"q":"كم سنة صبرت أسماء بنت عميس رضي الله عنها على الغربة في الحبشة؟","options":["سبع سنوات","خمس عشرة سنة","عشر سنوات","ثلاثين سنة"],"answer":1,"why":"صبرت على الغربة في الحبشة خمس عشرة سنة، ناشرةً الإسلام بعلمها وحكمتها، قبل أن تعود إلى المدينة.","ref":"ص 5"},{"q":"ما العبارة التي نقلها الدرس عن محمد بن جميل زينو في بيان أثر المرأة في الأمة؟","options":["«إن المرأة هي نصف الأمة، ثم هي التي تلد لنا النصف الآخر، فهي أمة بأسرها»","«المرأة تابعة للرجل في كل شأن»","«المرأة مكانها البيت فقط»","«المرأة لا أثر لها في بناء المجتمع»"],"answer":0,"why":"نقل الدرس قوله: «إن المرأة هي نصف الأمة، ثم هي التي تلد لنا النصف الآخر، فهي أمة بأسرها».","ref":"ص 7"}],"2":[{"q":"بأي لقب عُرفت خديجة رضي الله عنها في الجاهلية والإسلام بحسب الدرس؟","options":["ذات النطاقين","أم المساكين","الطاهرة","أم الشهداء"],"answer":2,"why":"نقل الدرس عن السهيلي: «وخديجة بنت خويلد تُسمّى: الطاهرة في الجاهلية والإسلام».","ref":"ص 3"},{"q":"كيف كانت خديجة رضي الله عنها تتاجر مع أنها لم تكن تخرج للتجارة بنفسها؟","options":["كانت توكّل أقاربها بلا أجر","كانت تستأجر الرجال وتضاربهم بأجر معلوم","كانت تبيع في بيتها فقط","كانت تتاجر مع النبي ﷺ وحده"],"answer":1,"why":"كانت تاجرة ذات شرف ومال، لكنها لم تكن تخرج للتجارة بنفسها، بل تستأجر الرجال وتضاربهم بأجر معلوم.","ref":"ص 3"},{"q":"ماذا قالت خديجة رضي الله عنها للنبي ﷺ حين رجع إليها يرتجف بعد نزول الوحي؟","options":["«كلا، أبشر، فوالله لا يخزيك الله أبدًا، إنك لتصل الرحم وتصدق الحديث وتحمل الكلّ...»","«ارجع إلى قومك واعتزلهم»","«لا تُخبر أحدًا بما رأيت»","«اطلب من ورقة أن يكتم الأمر»"],"answer":0,"why":"طمأنته بقولها: «كلا، أبشر، فوالله لا يخزيك الله أبدًا، إنك لتصل الرحم وتصدق الحديث وتحمل الكلّ وتكسب المعدوم وتقري الضيف وتعين على نوائب الحق».","ref":"ص 3"},{"q":"بماذا وصف النبي ﷺ موقف خديجة رضي الله عنها منه؟","options":["«ساعدتني في التجارة فقط»","«سكنت معي ولم تتكلم في أمر الدعوة»","«طلبت مني ترك الدعوة حفاظًا على الأسرة»","«آمنت بي إذ كفر بي الناس، وصدّقتني إذ كذّبني الناس، وواستني بمالها إذ حرمني الناس»"],"answer":3,"why":"قال ﷺ: «ما أبدلني الله عز وجل خيرًا منها، قد آمنت بي إذ كفر بي الناس، وصدّقتني إذ كذّبني الناس، وواستني بمالها إذ حرمني الناس، ورزقني الله عز وجل ولدها إذ حرمني أولاد النساء».","ref":"ص 4"},{"q":"بماذا بشّر جبريل عليه السلام خديجة رضي الله عنها؟","options":["بقصر من ذهب في الدنيا","بأن يُكتب لها ملك عظيم","ببيت في الجنة من قصب لا صخب فيه ولا نصب","بنهر في الجنة خاص بها"],"answer":2,"why":"في الحديث المتفق عليه: «وبشّرها ببيت في الجنة من قصب، لا صخب فيه ولا نصب»، وأقرأها السلام من ربها عز وجل ومنه.","ref":"ص 4"},{"q":"ماذا يعني «القصب» في قوله ﷺ: «ببيت في الجنة من قصب»، بحسب ما نقله الدرس عن جمهور العلماء؟","options":["النبات الأخضر الطويل","اللؤلؤ المجوَّف كالقصر المنيف","الذهب الخالص","الحجر المصقول"],"answer":1,"why":"نقل الدرس: «قال جمهور العلماء: المراد به قصب اللؤلؤ المجوّف كالقصر المنيف».","ref":"ص 4–5"},{"q":"لماذا سُمّي العام الذي توفيت فيه خديجة رضي الله عنها (بعد خروجها من شعب أبي طالب بعام) بعام الحزن؟","options":["لأنها توفيت فيه بعد صبرها مع النبي ﷺ على المقاطعة والحصار وبقيت ذكراها ماثلة في قلبه ﷺ","لأن النبي ﷺ هاجر فيه إلى المدينة","لأن المشركين انتصروا فيه في معركة","لأن أبا طالب أسلم فيه"],"answer":0,"why":"أنفقت مالها في سبيل الدعوة وصبرت مع النبي ﷺ في شعب أبي طالب حتى توفيت بعده بعام سُمي عام الحزن، وبقيت ذكراها ماثلة في قلبه ﷺ.","ref":"ص 5"},{"q":"ما الذي قالته عائشة رضي الله عنها عن غيرتها من خديجة؟","options":["«ما غرت منها لأني لم أسمع عنها»","«لم أغر من أحد من نسائه قط»","«غرت منها لأنها كانت أكبر مني فقط»","«ما غرت على أحد من نساء النبي ﷺ ما غرت على خديجة»، لكثرة ذكره لها"],"answer":3,"why":"قالت: «ما غرت على أحد من نساء النبي ﷺ ما غرت على خديجة ... ولكن كان يُكثر ذكرها»، فكان يقول: «إنها كانت وكانت وكان لي منها ولد».","ref":"ص 5"},{"q":"ماذا يُفهم من وصف بيت خديجة مع النبي ﷺ بأنه «أول بيت مسلم في الإسلام»؟","options":["أنه كان أكبر بيت في مكة","أنه كان بيتًا لا يدخله غير النساء","أن بيتها ضمّ النبي ﷺ وأبناءه وبناته وعليًّا وزيد بن حارثة وأم أيمن، وكان أول بيت إسلام على الأرض","أنه كان بناه النبي ﷺ بنفسه"],"answer":2,"why":"قال السهيلي: «أول من بنى بيتًا في الإسلام»؛ فكان أول بيت مسلم يضم النبي ﷺ وأبناءه وبناته وعليًّا وزيد بن حارثة وأم أيمن رضي الله عنهم.","ref":"ص 4"},{"q":"بحسب درس الحكمة في إدارة الأزمات من سيرة خديجة رضي الله عنها، ما المقصود بالحكمة في مشكلات البيت؟","options":["ألا تقع أي مشكلة في البيت أصلًا","ليست انعدام المشكلات، وإنما أن تُدار بهدوء واتزان وتحويل المواقف المتوترة إلى لحظات مراجعة","أن تُنقل الخلافات إلى فضاء العلن","أن يُتَّخذ ردّ فعل سريع يُنهي الأمر"],"answer":1,"why":"الحكمة لا تعني انعدام المشكلات، وإنما أن تُدار بهدوء واتزان؛ فمشكلات البيت تُقدَّر بقدرها بعيدًا عن التضخيم، لا في فضاء العلن.","ref":"ص 6"}],"3":[{"q":"كم أقامت عائشة رضي الله عنها في صحبة النبي ﷺ؟","options":["عشرة أعوام كاملة","سبعة أعوام وثلاثة أشهر","ثلاثة أعوام","ثمانية أعوام وخمسة أشهر"],"answer":3,"why":"تزوجها النبي ﷺ في شوال بعد وقعة بدر، فأقامت في صحبته ثمانية أعوام وخمسة أشهر حتى مات عنها ﷺ وهي ابنة ثماني عشرة سنة.","ref":"ص 3"},{"q":"ما الخصيصة التي تفردت بها عائشة رضي الله عنها فيما يتعلق بنزول الوحي؟","options":["أنها ال
