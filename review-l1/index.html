 أخذت القصص القرآنية مساحة عظيمة في القرآن الكريم بحسب الدرس؟","options":["للتشويق وتسلية القارئ فقط","لتحقيق مقاصد تربوية وأخلاقية وعقائدية، فهي ليست مجرد حكايات تُروى ولا للتشويق فقط","لحفظ تاريخ الأمم السابقة فقط","لتحديد الزمان والمكان لكل حدث"],"answer":1,"why":"أخذت القصص القرآنية مساحة عظيمة، ولم تكن مجرد حكايات تُروى ولا لغاية التشويق فقط، بل لتحقيق مقاصد تربوية وأخلاقية وعقائدية.","ref":"ص 3"},{"q":"ما المقصود من القصص القرآني بحسب الدرس فيما يتعلق بالأسماء والأماكن والتفاصيل الثانية؟","options":["ليس المقصود تحديد الزمان والمكان، بل تجريد المعنى وتكرار الموقف البشري في صوره المتعددة","تحديد الزمان والمكان بدقة","تتبع أسماء الأشخاص والأماكن","الدخول في التكلف لمعرفة التفاصيل الثانوية"],"answer":0,"why":"فليس المقصود منها تحديد الزمان والمكان، بل تجريد المعنى، وتكرار الموقف البشري في صوره المتعددة.","ref":"ص 4"},{"q":"ما العبرة التي يستخلصها الدرس من قصة موسى والخضر عليهما السلام؟","options":["أن العلم لا يُطلب إلا من الأنبياء","أن السرعة في الحكم دليل الفطنة","أن الحكمة لا تُفهم أبدًا","أن الصبر على العلم والتأني في الفهم من لوازم طريق العلم والقيادة، وعدم التسرع في الحكم على الأفعال قبل فهم الحكمة"],"answer":3,"why":"قصة موسى والخضر نموذج حيّ لتعليم الإنسان الرضا بقدر الله والثقة بعلمه وعدم التسرع في الحكم على الأفعال قبل فهم الحكمة؛ والصبر على العلم والتأني في الفهم من لوازم طريقه.","ref":"ص 4"},{"q":"أي مما يلي من السنن الربانية التي ذكرها الدرس مثالًا عند استخراجها من القصة؟","options":["التمكين، والتسلط، والنسيان","الاستبدال، والحصر، والتأجيل","التمكين، والاستبدال، والابتلاء، والجزاء","الابتلاء، والتجريد، والتحريف"],"answer":2,"why":"من وسائل التدريب على التدبر بالقصة: استخراج السنن الربانية من القصة، مثل سنة التمكين، الاستبدال، الابتلاء، والجزاء.","ref":"ص 4"},{"q":"ما الوسيلة السادسة من وسائل تدبر القرآن؟","options":["القراءة بتأنٍّ وهدوء","استخراج الحِكَم","عرض النفس على القرآن","استخدام القصة في التدبر"],"answer":1,"why":"الوسيلة الخامسة: استخدام القصة في التدبر، والوسيلة السادسة: استخراج الحِكَم، والوسيلة السابعة: القراءة بتأنٍّ وهدوء.","ref":"ص 5"},{"q":"ما فوائد معرفة الحُكم للمتدبر بحسب الدرس؟","options":["تعميق الفهم لنصوص الكتاب، ومعرفة غاية ما سيقومون بعمله، وإمكان القياس عليه والعمل به في المواقف الشبيهة","الاستغناء عن الأحكام الشرعية","الاستغناء عن التفسير","الاقتصار على المصالح الدنيوية دون الأخروية"],"answer":0,"why":"وفوائد معرفة الحكم للمتدبر: تعميق الفهم لنصوص الكتاب، ومعرفة غاية ما سيقومون بعمله، كما أن فهم الحكمة وعلة الأعمال سيمكنهم من القياس عليها والعمل بها في المواقف الشبيهة.","ref":"ص 6"},{"q":"ما المنهج الذي فضّله ابن عباس رضي الله عنهما في تلاوة القرآن بحسب الدرس؟","options":["قراءة القرآن كله في ليلة واحدة ولو دون فهم","الجمع بين القراءات المختلفة في الختمة الواحدة","الإكثار من الختمات في الشهر","قراءة سورة واحدة بتفكّر وتدبر، أحبّ إليه من قراءة القرآن كله في ليلة بسرعة"],"answer":3,"why":"قال ابن عباس: «لأن أقرأ سورةً واحدةً أعجبُ إليَّ من أن أفعلَ مثل الذي تفعل، فإن كنتَ فاعلًا لا بُدَّ فاقرأه قراءةً تسمعُ أذنيك ويعيه قلبك».","ref":"ص 6، 12"},{"q":"أي الآيات قام بها النبي ﷺ ليلة كاملة يرددها حتى أصبح بحسب حديث أبي ذر؟","options":["﴿فَمَنَّ اللَّهُ عَلَيْنَا وَوَقَانَا عَذَابَ السَّمُومِ﴾","﴿أَمْ حَسِبَ الَّذِينَ اجْتَرَحُوا السَّيِّئَاتِ أَن نَّجْعَلَهُمْ كَالَّذِينَ آمَنُوا وَعَمِلُوا﴾","﴿إِن تُعَذِّبْهُمْ فَإِنَّهُمْ عِبَادُكَ وَإِن تَغْفِرْ لَهُمْ فَإِنَّكَ أَنتَ الْعَزِيزُ الْحَكِيمُ﴾","﴿وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا﴾"],"answer":2,"why":"قال أبو ذر: «قام النبي ﷺ بآية حتى أصبح يرددها، والآية: ﴿إِن تُعَذِّبْهُمْ فَإِنَّهُمْ عِبَادُكَ...﴾ [المائدة: 118]» (أخرجه ابن ماجه). أما ﴿فمن الله علينا﴾ فكررتها أسماء، و﴿أم حسب الذين اجترحوا﴾ كررها تميم الداري.","ref":"ص 7، 12"},{"q":"حين عرض مطرّف بن الشخير نفسه على القرآن، في أي صنف من الناس وجد الأمل والرجاء لنفسه؟","options":["في صفات أهل الجنة الذين لا ينامون الليل","في الذين اعترفوا بذنوبهم، خلطوا عملًا صالحًا وآخر سيئًا ﴿وَآخَرُونَ اعْتَرَفُوا بِذُنُوبِهِم﴾","في السابقين الأولين من المهاجرين والأنصار","في الذين قالوا: لم نك من المصلين"],"answer":1,"why":"قال مطرّف: «فأرى القوم مكذبين فأمر بهذه الآية: ﴿وَآخَرُونَ اعْتَرَفُوا بِذُنُوبِهِمْ خَلَطُوا عَمَلًا صَالِحًا وَآخَرَ سَيِّئًا﴾ [التوبة: 102]؛ فأرجو أن أكون أنا وأنتم يا إخوتاه منهم».","ref":"ص 8، 12"},{"q":"بماذا أجاب أبو حازم حين سأله سليمان بن عبد الملك عن مكانه عند الله وكيف يعرفه؟","options":["طلب منه أن يعرض عمله على كتاب الله ليرى موقعه","أمره بالنظر في كثرة أمواله وأولاده","أمره بالاستبشار لأنه الخليفة","طلب منه أن يسأل العلماء"],"answer":0,"why":"قال أبو حازم لسليمان: «اعرض عملك على كتاب الله»، قال: وأي مكان أجده؟ قال: ﴿إِنَّ الْأَبْرَارَ لَفِي نَعِيمٍ، وَإِنَّ الْفُجَّارَ لَفِي جَحِيمٍ﴾.","ref":"ص 8، 12–13"}],"7":[{"q":"ما الغاية العظمى من نزول القرآن الكريم بحسب الدرس؟","options":["إتقان حفظه وتحسين الصوت به","قراءته بسرعة وإنهاء السور","التبرك به دون استحضار رسالته","تدبره؛ فهو ليس كتابًا للقراءة العابرة أو الحفظ فحسب، بل خطاب من الله إلى عباده يدعوهم فيه إلى الهداية والبصيرة والتزكية"],"answer":3,"why":"إن تدبر القرآن الكريم هو الغاية العظمى من نزول هذا الكتاب الخالد؛ فهو ليس كتابًا للقراءة العابرة أو الحفظ فحسب، بل هو خطاب من الله جل جلاله إلى عباده يدعوهم فيه إلى الهداية والبصيرة والتزكية. قال تعالى: ﴿كتاب أنزلناه إليك مبارك ليدبروا آياته وليتذكر أولوا الألباب﴾.","ref":"ص 2"},{"q":"ما أول موانع تدبر القرآن الذي ذكره الدرس، وبأي حديث استُدل على أثر القلب؟","options":["الذنوب، وحديث: «إنما الأعمال بالنيات»","قصر الهمة على القراءة، وحديث: «خيركم من تعلم القرآن وعلمه»","أمراض القلوب، وحديث: «ألا وإن في الجسد مضغة، إذا صلحت صلح الجسد كله، وإذا فسدت فسد الجسد كله، ألا وهي القلب»","الخطأ في فهم الآيات، وحديث: «الدين النصيحة»"],"answer":2,"why":"المانع الأول: أمراض القلوب، وقد أشار النبي ﷺ إلى عمق أثر القلب في صلاح الإنسان فقال: «ألا وإن في الجسد مضغة، إذا صلحت صلح الجسد كله، وإذا فسدت فسد الجسد كله، ألا وهي القلب».","ref":"ص 3"},{"q":"ما الذي قاله الزركشي عمّن لا يحصل له فهم معاني الوحي حقيقةً؟","options":["من لم يحفظ القرآن كاملًا","من كان في قلبه بدعة أو إصرار على ذنب، أو كِبر أو هوى، أو حب الدنيا، أو لم يكن متحقق الإيمان","من لم يتقن أحكام التجويد","من قرأ القرآن في وقت قصير"],"answer":1,"why":"نبّه الزركشي إلى هذه الحقيقة فقال: «واعلم أنه لا يحصل للناظر فهم معاني الوحي حقيقةً، ولا تظهر له أسرار العلم من غيب المعرفة، وفي قلبه بدعة أو إصرار على ذنب، أو في قلبه كِبر أو هوى، أو حب الدنيا، أو يكون غير متحقق الإيمان».","ref":"ص 4"},{"q":"ما العقوبة الإلهية للمتكبرين التي تحول بينهم وبين القرآن كما في قوله تعالى: ﴿سأصرف عن آياتي الذين يتكبرون في الأرض بغير الحق﴾؟","options":["الحرمان من فهم الآيات ومعانيها","فقدان القدرة على الحفظ","التعرض للفقر والمرض","منعهم من دخول المساجد"],"answer":0,"why":"هؤلاء لا يُصرفون فقط عن الإيمان، بل يُصرفون عن فهم الآيات ومعانيها؛ جزاء تكبرهم وجفائهم. وقال مجاهد: «لا يتعلم العلم مستحيٍ ولا مستكبر».","ref":"ص 4"},{"q":"ما المقصود بمظاهر الغفلة عن القرآن بحسب الدرس؟","options":["الاهتمام بالمعنى دون اللفظ","الإكثار من تلاوته بتدبر وخشوع","حفظ الأحكام وتطبيقها","الاهتمام باللفظ دون المعنى، والاقتصار على التجويد والحفظ دون التدبر والامتثال، والتعامل مع القرآن كمصدر للتبرك فقط"],"answer":3,"why":"من مظاهر الغفلة: الاهتمام باللفظ دون المعنى، والاقتصار على التجويد والحفظ دون التدبر والامتثال، والتعامل التقليدي مع القرآن باعتباره مجرد مصدر للتبرك دون استحضار رسالته.","ref":"ص 5"},{"q":"ماذا يحدث في القلب إذا أذنب العبد ولم يتب بحسب الحديث الذي ذكره الدرس؟","options":["يزداد نوره","لا يتغير شيء","تُنكت فيه نكتة سوداء، فإن عاد زِيد فيها حتى تعلو قلبه فذلك الران","تُنكت فيه نكتة بيضاء"],"answer":2,"why":"قال رسول الله ﷺ: «إذا أذنب العبد كان نكتة سوداء في قلبه، فإن تاب ونزع واستغفر صقل منها، وإن عاد زيد فيها حتى تعلو قلبه، فذلك الران الذي قال الله: ﴿كلا بل ران على قلوبهم ما كانوا يكسبون﴾».","ref":"ص 5-6"},{"q":"ماذا قال ابن القيم رحمه الله عن اجتماع القرآن والغناء في القلب؟","options":["إنهما يجتمعان ويتكاملان","إن القرآن والغناء لا يجتمعان في القلب؛ لما بينهما من التضاد","الغناء يعين على فهم القرآن","لا علاقة بينهما"],"answer":1,"why":"قال ابن القيم: «فإن القرآن والغناء لا يجتمعان في القلب؛ لما بينهما من التضاد؛ فإن القرآن ينهى عن اتباع الهوى، ويأمر بالعفة ومجانبة شهوات النفوس، وينهى عن اتباع خطوات الشيطان، والغناء يأمر بضد ذلك كله».","ref":"ص 6"},{"q":"بماذا يكون التخلص من مانع الذنوب بحسب الدرس؟","options":["بكثرة الاستغفار والتوبة، وصحبة الصالحين، والعودة إلى القرآن تلاوةً وتدبرًا وعملًا","بتجنب قراءة القرآن حتى تزول الذنوب","بالانشغال بالدنيا","بالسكوت عن الذنوب"],"answer":0,"why":"التخلص من هذا المانع يكون بكثرة الاستغفار والتوبة لتطهير القلب وإزالة الران، وصحبة الصالحين الذين يعينون على طاعة الله ويذكّرون به، والعودة إلى القرآن تلاوةً وتدبرًا وعملًا للتزكّي به.","ref":"ص 7"},{"q":"ماذا قال ابن مسعود رضي الله عنه في طريقة قراءة القرآن؟","options":["«أكثروا من قراءته بسرعة»","«اقرؤوا القرآن دون أن تقفوا عند آياته»","«اقتصروا على حفظ الحروف»","«لا تهذّوا القرآن هذّ الشعر، ولا تنثروه نثر الدقل، وقفوا عند عجائبه، وحركوا به القلوب»"],"answer":3,"why":"قال ابن مسعود رضي الله عنه: «لا تهذوا القرآن هذّ الشعر، ولا تنثروه نثر الدقل، وقفوا عند عجائبه، وحركوا به القلوب». ومعنى «ينثره نثر الدقل»: كما يتساقط الرطب اليابس من العذق إذا هُزّ، والمراد القراءة السريعة دون فهم.","ref":"ص 7"},{"q":"ما المعنى الصحيح لكلمة «قاموا» في قوله تعالى: ﴿وإذا أظلم عليهم قاموا﴾ بحسب جدول الأمثلة في الدرس؟","options":["كانوا قعودًا فوقفوا","نهضوا للصلاة","ثبتوا مكانهم متحيّرين","أدّوا الصلاة قيامًا"],"answer":2,"why":"من أمثلة الخطأ في فهم بعض الآيات (المانع الرابع): كلمة «قاموا» في الآية؛ فالمعنى غير المقصود (الخاطئ) أنهم كانوا قعودًا فوقفوا، والمعنى المقصود (الصحيح) أنهم ثبتوا مكانهم متحيّرين.","ref":"ص 9"}],"8":[{"q":"إلى أي أمر أرشد القرآن في احترام إرادة أفراد الأسرة، وما نتائج تجاهله؟","options":["أرشد إلى احترام إرادتهم خاصة في الزواج: ﴿فلا تعضلوهن أن ينكحن أزواجهن﴾، ومن نتائج تجاهله التمرد أو الطلاق أو البرود العاطفي","أرشد إلى فرض قرارات الأب وحده، ونتيجتها الطاعة التامة","أرشد إلى ترك الأبناء دون توجيه، ونتيجتها السكينة","أرشد إلى إكراه البنت على الزواج، ونتيجته الاستقرار"],"answer":0,"why":"أرشد القرآن إلى احترام إرادة أفراد الأسرة، وخاصة في موضوع الزواج، فقال تعالى: ﴿فلا تعضلوهن أن ينكحن أزواجهن إذا تراضوا﴾، فلم يُجز الإكراه أو فرض قرارات مصيرية على الآخر، ولا يخفى ما أدّى إليه تجاهل هذا المبدأ من نتائج مثل: التمرد أو الطلاق أو البرود العاطفي داخل الأسرة.","ref":"ص 3"},{"q":"ما الآية التي ذكرها الدرس أساسًا للحياة الزوجية؟","options":["﴿وجعلنا الليل لباسًا﴾","﴿وأمرهم شورى بينهم﴾","﴿فاتقوا الله ما استطعتم﴾","﴿وجعل بينكم مودة ورحمة﴾"],"answer":3,"why":"أكد القرآن أن أساس الحياة الزوجية ينطلق من قوله تعالى: ﴿وجعل بينكم مودة ورحمة﴾، وحين يضعف الحب يبقى الحد الأدنى: ﴿وعاشروهن بالمعروف﴾.","ref":"ص 4"},{"q":"ما المثال الذي ذكره الدرس للشورى مع الأبناء في القرآن؟","options":["موقف لقمان مع ابنه في النهي عن الشرك","موقف زكريا مع ابنه في الدعاء","موقف إبراهيم عليه السلام مع ابنه: ﴿فانظر ماذا ترى﴾","موقف نوح مع ابنه في السفينة"],"answer":2,"why":"دعا القرآن الكريم إلى إشراك جميع الأطراف حتى الأولاد، كما في موقف إبراهيم عليه السلام مع ابنه: ﴿يا بني إني أرى في المنام أني أذبحك فانظر ماذا ترى﴾. وغياب الشورى يخلق النزاع والتمرد والكراهية والضجر بين جميع أفراد الأسرة.","ref":"ص 4"},{"q":"لماذا ذكر الدرس أن القصة ليست لمجرد التسلية في تربية الأولاد؟","options":["لأن القرآن كله قصص","لأن القصص جاء في ثلث القرآن تقريبًا","لأن الأولاد لا يفهمون غير القصص","لأن القصة تغني عن الحوار"],"answer":1,"why":"من وسائل التفعيل: قصة قبل النوم؛ يسرد أحد الوالدين قصة قصيرة من القرآن قبل نوم الطفل، مع التركيز على القيمة التربوية المستفادة، والقصة ليست لمجرد التسلية فقد جاء القصص في ثلث القرآن تقريبًا.","ref":"ص 5"},{"q":"ما الغاية التربوية من تكرار لقمان الحكيم نداء ﴿يا بني﴾ في وصاياه لابنه؟","options":["التودد إليه؛ لجذب قلبه قبل عقله","إشعار الابن بصغر سنه وقلة خبرته","فرض الهيبة الأبوية","الاختصار في الكلام"],"answer":0,"why":"من القيم التربوية في نموذج لقمان عليه السلام مع ولده: أسلوب التربية بالرفق واللين؛ حيث كرر النداء بـ ﴿يا بني﴾ تودّدًا إليه؛ لجذب قلبه قبل عقله.","ref":"ص 7"},{"q":"ما القيمة التي أرساها لقمان في ابنه بقوله: ﴿يا بني إنها إن تك مثقال حبة من خردل...﴾؟","options":["الاعتماد على الناس في الرقابة","الإكثار من الأموال","الاعتزال عن الناس","بناء الرقابة الذاتية ومراقبة الله في السر والعلن"],"answer":3,"why":"من القيم: بناء الرقابة الذاتية ومراقبة الله في السر والعلن، وهذه التربية على الوازع الداخلي تجعل من الطفل رقيبًا على نفسه حتى حين يغيب الرقيب البشري.","ref":"ص 7-8"},{"q":"ما القيمة التربوية التي تميّز بها نموذج إبراهيم عليه السلام مع ولده في حادثة الرؤيا والذبح؟","options":["القدرة على المناظرة وإقامة الحجة","الحرص على طلب العلم الشرعي","القدوة العملية في الطاعة والتسليم","الاعتزال عن الناس"],"answer":2,"why":"من القيم التربوية في نموذج إبراهيم عليه السلام: القدوة العملية في الطاعة والتسليم؛ قال تعالى: ﴿يا بني إني أرى في المنام أني أذبحك فانظر ماذا ترى قال يا أبت افعل ما تؤمر ستجدني إن شاء الله من الصابرين﴾.","ref":"ص 7"},{"q":"ما معنى قوله تعالى في تربية يحيى عليه السلام: ﴿خذ الكتاب بقوة﴾ بحسب الدرس؟","options":["أي بسرعة دون تدبر","أي بجد؛ فهو حثّ على العزيمة والجد","أي بعنف وشدة","أي بالتخلي عن العمل"],"answer":1,"why":"من القيم التربوية في تربية يحيى عليه السلام: الحث على العزيمة والجد؛ في قوله تعالى: ﴿خذ الكتاب بقوة﴾ أي بجد، فجاء الوحي يشجعه على العلم والعمل منذ الصغر وملازمة ذلك، وحمل الأمة عليه.","ref":"ص 8"},{"q":"كيف يتحقق الاتزان النفسي والعاطفي كأحد ثمرات التربية بالقرآن؟","options":["بربط القلب بالقرآن كتوجيه إلهي في كل الأحوال، مما يولد الطمأنينة والثبات في الشدائد","بالاعتماد على النفس والاستغناء عن الآخرين","بكثرة السفر والتنقل للتأمل في الكون","بتجنب الاختلاط بالناس"],"answer":0,"why":"من ثمرات التربية بالقرآن: تحقيق الاتزان النفسي والعاطفي من خلال ربط القلب بالقرآن كتوجيه إلهي في كل الأحوال؛ مما يولد الطمأنينة والثبات في الشدائد.","ref":"ص 6"},{"q":"ما الذي يُنصح به عند سرد القصة لضمان فاعلية تأثيرها التربوي بشأن العبرة؟","options":["ذكر العبرة في كل مشهد من مشاهد القصة","إطالة القصة وتفاصيلها لتستغرق وقتًا أطول","تجنب أي عبرة في القصة","ترك العبرة حتى نهاية القصة أو ذكرها بالبداية ثم سرد القصة، وعدم تشتيت التركيز بوقفات تحليلية متكررة أثناء السرد"],"answer":3,"why":"من كيفية توظيف القصة: ترك العبرة حتى نهاية القصة أو ذكرها بالبداية ثم القصة، وعدم تشتيت التركيز بوقفات تحليلية متكررة أثناء السرد لذكر العبرة؛ واختصار القصة في حوالي سبعة مشاهد، فالإطالة الزائدة تدفع للملل.","ref":"ص 10"}],"9":[{"q":"لماذا تُعدّ السنوات الأولى من عمر الطفل فرصة ذهبية للبدء بمشروع حفظ القرآن؟","options":["لأن الطفل يستطيع فيها تحليل النصوص واستنباط الأحكام","لأن العقل يكون في أعلى درجات استعداده للاستقبال والتخزين، والقلب أكثر صفاءً","لأن الطفل لا ينشغل فيها بأي شيء آخر","لأن الطفل يحفظ فيها القرآن كاملًا قبل دخول المدرسة"],"answer":1,"why":"السنوات الأولى فرصة ذهبية لتكوين القيم الوجدانية واستقبال المعارف، حيث يكون العقل في أعلى درجات استعداده للاستقبال والتخزين، والقلب أكثر صفاءً واستعدادًا للارتباط بالمعاني الإيمانية.","ref":"ص 2"},{"q":"ما الجوانب الثلاثة الرئيسة التي يتناولها الدرس؟","options":["تحفيظ القرآن للأولاد، ومشاركة أفراد الأسرة في المشروع، وأبرز المعوّقات العملية وسبل التعامل معها","تجويد الحروف، وحفظ المتون، وتفسير الآيات","اختيار المدرسة، وتحديد الميزانية، وشراء المصاحف","حفظ القرآن، والتفسير، والمقارنة بين الأجيال"],"answer":0,"why":"من الجوانب الثلاثة: تحفيظ القرآن لألوالد؛ ضوابطه وأساليبه، ومشاركة أفراد الأسرة في هذا المشروع الإيماني الجماعي، وأبرز المعوقات العملية وسبل التعامل معها بحلول واقعية.","ref":"ص 2"},{"q":"ما الوسيلة التي يبدأ بها طريق الأولاد مع القرآن من الولادة حتى ثلاث سنوات؟","options":["التلقين المباشر الإجباري","تدوين الآيات وكتابتها","التسميع أمام الأقارب","سماع التلاوة الهادئة الجميلة أثناء النوم أو الاستيقاظ"],"answer":3,"why":"من الولادة حتى ثلاث سنوات يبدأ طريق الأولاد مع القرآن عبر سماع التلاوة الهادئة الجميلة أثناء النوم أو الاستيقاظ، وتألف آذانهم سماع القرآن.","ref":"ص 4"},{"q":"ما الهدف الرئيس من تحفيظ القرآن للأطفال في المرحلة من الرابعة إلى السادسة؟","options":["المحاسبة على الاستظهار","حفظ القرآن كاملًا قبل دخول المدرسة","التعلّق بالقرآن، لا التلقين الإجباري الذي سيحاسَبون على استظهاره","ربط الآيات بالسلوك اليومي فقط"],"answer":2,"why":"من الرابعة إلى السادسة يمكن بدء التحفيظ بالتلقين المباشر، لا بهدف التلقين الإجباري الذي سيحاسَبون على استظهاره، بل بهدف التعلق بالقرآن.","ref":"ص 4-5"},{"q":"ماذا يمكن فعله بعد تجاوز الحادية عشرة من عمر الطفل بحسب الدرس؟","options":["ترك التحفيظ حتى يختار الطفل بنفسه","تنظيم ورد يومي ثابت وجداول مراجعة مدروسة، مع ربط الآيات بالواقع والسلوك اليومي","الاقتصار على سماع التلاوة فقط","التلقين الإجباري المحاسَب عليه"],"answer":1,"why":"بعد تجاوز الحادية عشرة يمكن تنظيم ورد يومي ثابت وجداول مراجعة مدروسة، وربط الآيات بالواقع والسلوك اليومي، مع استثمار نضجهم في فهم معاني الآيات، ومن أكثر ما يؤثر في هذه المرحلة أصدقاؤهم.","ref":"ص 5"},{"q":"ما السورة القصيرة التي ذكرها الدرس نموذجًا عمليًّا للتحفيظ؟","options":["سورة الفيل","سورة الإخلاص","سورة الفاتحة","سورة الكوثر"],"answer":0,"why":"ذكر الدرس تحفيظ سورة الفيل نموذجًا عمليًّا، ويبدأ بالتمهيد بأن تتحدث الأم لطفلها عن قصة أصحاب الفيل وماذا فعل الله عز وجل بهم.","ref":"ص 5"},{"q":"لماذا ينبغي التنويع في طرق الترديد داخل المجلس الواحد؟","options":["لأن الترديد بطريقة واحدة ممنوع","لإنهاء الحفظ في وقت أقصر","لأن كل الطرق يجب تطبيقها دائمًا","لكسر الملل وتوفير قدر جيد من التفاعل والنشاط والانتباه الدائم"],"answer":3,"why":"الترديد بطرق متنوعة في المجلس الواحد يكسر الملل ويوفّر تفاعلًا ونشاطًا وانتباهًا دائمًا، ولا يجب تطبيقها جميعًا، وإنما ثلاث أو أربع طرق تكفي على حسب السياق.","ref":"ص 6"},{"q":"ما الملاحظة التي ينبّه إليها الدرس عند استخدام الوسائل التقنية في التحفيظ؟","options":["أن تكون هي الوسيلة الوحيدة للتحفيظ","أن تُستخدم بلا تحديد وقت","ألّا تنقلب إلى وسائل تشتيت وأن تكون على قدر الهدف المطلوب","أن تحلّ محل مراجعة المحفوظ"],"answer":2,"why":"ننتبه للوسائل التقنية ألا تنقلب وسائل تشتيت، وأن تكون على قدر الهدف المطلوب.","ref":"ص 6"},{"q":"ماذا أوصى الشافعي مؤدّب أولاد هارون الرشيد أن يبدأ به؟","options":["أن يمنعهم من اللعب حتى يحفظوا","«ليكن أول ما تبدأ به من إصلاح أولاد أمير المؤمنين إصلاحك نفسك»","أن يعلّمهم الشعر واللغة أولًا","أن يُكرههم على الحفظ ليتعودوا"],"answer":1,"why":"قال: «ليكن أول ما تبدأ به من إصلاح أولاد أمير المؤمنين إصلاحك نفسك؛ فإن أعينهم معقودة بعينك… علّمهم كتاب الله، ولا تُكرههم عليه فيملّوه، ولا تتركهم منه فيهجروه».","ref":"ص 7"},{"q":"ما فائدة توفير البيئة القرآنية في المنزل بحسب الدرس؟","options":["شعور الطفل أن القرآن جزء أساسي من حياته وحفظه بسهولة دون شعور بالإجبار","ضمان حفظ الطفل للقرآن في مدة قصيرة","إعفاء الوالدين من المتابعة المستمرة","الاستغناء عن مراجعة المحفوظ"],"answer":0,"why":"من فوائد البيئة القرآنية: شعور الطفل بأن القرآن جزء أساسي من حياته، وحفظه بسهولة دون شعور بالإجبار.","ref":"ص 8"},{"q":"ما المحذور الذي يجب تجنبه عند استخدام التعزيز السلبي أو العتاب الرقيق مع الطفل المقصّر؟","options":["أن يقترن العتاب بتوجيه بديل","أن يكون بصوت منخفض وهادئ","أن يكون في جو آمن خالٍ من الخوف","استخدامه في المواقف المؤلمة التي يشعر فيها الطفل بالخجل واللوم لنفسه"],"answer":3,"why":"يمكن للأم أن تُظهر حزنًا خفيفًا أو تدعو له دعاء يحمل نبرة عتاب رقيق، لكن من المهم عدم استخدامه مع المواقف المؤلمة التي يشعر فيها الطفل بالخجل واللوم لنفسه أو عند ضعف الولد بعد أن بذل قصارى جهده.","ref":"ص 8"},{"q":"ماذا ذكر الدرس عن عدد سنوات الإمام الشافعي حين حفظ القرآن؟","options":["حفظ القرآن وهو ابن خمس سنين","حفظ القرآن وهو ابن عشر سنين","حفظ القرآن وهو ابن سبع سنين","حفظ القرآن وهو ابن خمس عشرة سنة"],"answer":2,"why":"قال الشافعي: «حفظت القرآن وأنا ابن سبع سنين، وحفظت الموطأ وأنا ابن عشر».","ref":"ص 10"}],"10":[{"q":"لماذا تُعدّ المرأة محورًا في تنشئة الأولاد على القرآن داخل البيت؟","options":["لأن الأب لا يستطيع تعليم الأولاد القرآن","لأن الأولاد يفضلون الأمهات في كل الأمور","لأنها أكثر ملازمة للأولاد من الأب، وأشد حنوًّا عليهم والتصاقًا بهم، وجُبلت على الصبر في خدمتهم","لأن الشرع خصّها وحدها بتعليم القرآن"],"answer":2,"why":"للمرأة الدور المحوري في هذه التنشئة في البيت لأنها أكثر ملازمة للأولاد من الأب لانشغاله بالكدّ خارج المنزل، شديدة الحنو عليهم، وجُبلت على الصبر الشديد في خدمة الطفل والسهر عليه.","ref":"ص 2"},{"q":"ما المقصود برسالة القرآن بحسب الدرس؟","options":["أحكام العبادات فقط","المنهج الرباني الشامل الهادف إلى إعادة بناء النفس البشرية وعمارة الأرض وفق مراد الله","علوم التفسير فقط","قصص الأنبياء فقط"],"answer":1,"why":"رسالة القرآن هي المنهج الرباني الشامل الهادف إلى إعادة بناء النفس البشرية وعمارة الأرض وفق مراد الله، من خلال تحويل آيات القرآن إلى سلوك راسخ وواقع عملي ومنهج حياة.","ref":"ص 3"},{"q":"ما الآية التي تتلخص فيها رسالة القرآن بحسب الدرس؟","options":["﴿لقد منّ الله على المؤمنين إذ بعث فيهم رسولًا من أنفسهم يتلو عليهم آياته ويزكيهم ويعلمهم الكتاب والحكمة﴾","﴿وما أرسلناك إلا رحمة للعالمين﴾","﴿إن هذا القرآن يهدي للتي هي أقوم﴾","﴿ونزلنا عليك الكتاب تبيانًا لكل شيء﴾"],"answer":0,"why":"تتلخص الرسالة في قول الله تعالى: ﴿لقد منّ الله على المؤمنين إذ بعث فيهم رسولًا من أنفسهم يتلو عليهم آياته ويزكيهم ويعلمهم الكتاب والحكمة﴾ [آل عمران: 164].","ref":"ص 3"},{"q":"بأي شيء شبّه النبي ﷺ المؤمن الذي يقرأ القرآن؟","options":["الريحانة، ريحها طيب وطعمها مر","التمرة، لا ريح لها وطعمها حلو","الحنظلة، ريحها طيب وطعمها مر","الأترجّة، ريحها طيب وطعمها طيب"],"answer":3,"why":"قال النبي ﷺ: «مثل المؤمن الذي يقرأ القرآن مثل الأترجّة، ريحها طيب وطعمها طيب» (متفق عليه).","ref":"ص 4"},{"q":"بماذا أجابت عائشة رضي الله عنها حين سُئلت عن خُلق رسول الله ﷺ؟","options":["قالت: «كان أحسن الناس هيئة»","قالت: «كان لا يغضب أبدًا»","قالت: «كان خُلقه القرآن»","قالت: «كان يتبسم دائمًا»"],"answer":2,"why":"سُئلت أم المؤمنين عائشة رضي الله عنها عن خلق رسول الله ﷺ، فقالت: «كان خُلقه القرآن» (أخرجه أحمد). والمرأة الداعية تمتثل أخلاق القرآن في كل تفاصيل حياتها.","ref":"ص 5"},{"q":"ما الآية التي ورد فيها قيام الليل في نشاط «محراب الليل»؟","options":["﴿وأقم الصلاة طرفي النهار﴾","﴿تتجافى جنوبهم عن المضاجع﴾","﴿قم الليل إلا قليلًا﴾","﴿واستعينوا بالصبر والصلاة﴾"],"answer":1,"why":"طُلب في النشاط تخصيص وقت تقف فيه المرأة بين يدي الله مستشعرة قوله تعالى: ﴿تتجافى جنوبهم عن المضاجع﴾ [السجدة: 16]، تصلي ركعتين بخشوع وتدبّر.","ref":"ص 5"},{"q":"ما المحاور الثلاثة الرئيسة التي ركّزت عليها وصايا لقمان لابنه؟","options":["تصحيح العلاقة بالله، وبالأسرة، وبالمجتمع","الصلاة، والزكاة، والصيام","الصدق، والأمانة، والعدل","العلم، والعمل، والدعوة"],"answer":0,"why":"وصايا لقمان لابنه ركّزت على ثلاثة محاور: تصحيح العلاقة بالله (تحريم الشرك واليقين بمراقبة الله)، وتصحيح العلاقة بالأسرة (بر الوالدين)، وتصحيح العلاقة بالمجتمع (الأمر بالمعروف والنهي عن المنكر والصبر).","ref":"ص 7"},{"q":"ما معنى «وقاية الأنفس والأهل» في قوله تعالى: ﴿قوا أنفسكم وأهليكم نارًا﴾ بحسب تفسير السعدي المذكور في الدرس؟","options":["الاكتفاء بحفظ الأولاد من الأخطار الدنيوية","الاعتماد على الدعاء دون تعليم","ترك الأولاد حتى يختاروا طريقهم","وقاية الأنفس بإلزامها أمر الله، ووقاية الأهل والأولاد بتأديبهم وتعليمهم وإجبارهم على أمر الله"],"answer":3,"why":"ووقاية الأنفس بإلزامها أمر الله والقيام بأمره امتثالًا ونهيه اجتنابًا، ووقاية الأهل والأولاد بتأديبهم وتعليمهم وإجبارهم على أمر الله.","ref":"ص 7"},{"q":"ما جوهر التربية القرآنية الأسرية بحسب الدرس؟","options":["جعل الأولاد يحفظون القرآن كاملًا في أقصر وقت","منع الأولاد من الاختلاط بالمجتمع","حماية الأهل من النار بحماية قلوبهم وجوارحهم بالقرآن","التركيز على الأحكام دون الأخلاق"],"answer":2,"why":"هذا هو جوهر التربية القرآنية الأسرية: حماية الأهل من النار بحماية قلوبهم وجوارحهم بالقرآن.","ref":"ص 7"},{"q":"أيٌّ مما يلي من الوسائل التي تحوّل البيت إلى محضن قرآني بحسب الدرس؟","options":["الألعاب الإلكترونية","إقامة «مجالس القرآن» داخل البيت يجتمع فيها الزوجان والأولاد لتلاوة القرآن وتدارسه","الرحلات الترفيهية","المسابقات الرياضية"],"answer":1,"why":"من وسائل تحويل البيت إلى محضن قرآني: إقامة مجالس القرآن داخل البيت، وتوفير المصاحف والتفاسير المناسبة والتطبيقات القرآنية، وتخصيص مكتبة أسرية، ووضع ألواح حفظ ولوحات تحفيزية.","ref":"ص 8"},{"q":"ما نوعا التحفيز اللذان ذكرهما الدرس لدعم الحلقات القرآنية؟","options":["تحفيز معنوي وتحفيز مادي","تحفيز فردي وتحفيز جماعي","تحفيز دائم وتحفيز مؤقت","تحفيز علني وتحفيز سري"],"answer":0,"why":"ينقسم التحفيز إلى نوعين: معنوي (بالتذكير بفضل حفظ القرآن وأجره العظيم)، ومادي (بتقديم الجوائز العينية والهدايا والمكافآت والشهادات التقديرية وإقامة حفلات التكريم).","ref":"ص 9-10"},{"q":"ما الحل الذي وُصف في الدرس بأنه «صمّام الأمان» الذي يحفظ سفينة المجتمع من الغرق؟","options":["الصدقة","الحجاب","التوبة","تفعيل الأمر بالمعروف والنهي عن المنكر"],"answer":3,"why":"تفعيل الأمر بالمعروف والنهي عن المنكر هو صمّام الأمان الذي يحفظ سفينة المجتمع من الغرق.","ref":"ص 12"},{"q":"إلى أي شيء يعود سبب كل فساد مجتمعي في جذوره بحسب الدرس؟","options":["قلة المال","كثرة الانشغال بالتعليم","البعد عن منهج الله وهجران كتابه تلاوةً وتدبرًا وعملًا","ضعف وسائل التقنية"],"answer":2,"why":"الداعية القرآنية المستبصرة تعلم أن سبب كل فساد مجتمعي يعود في جذوره إلى البعد عن منهج الله وهجران كتابه تلاوةً وتدبرًا وعملًا، وهذا الهجران بأنواعه هو منبع الفساد والزيغ.","ref":"ص 12"}],"11":[{"q":"ما الغاية الجوهرية لبعثة النبي ﷺ بحسب الدرس؟","options":["نشر العلوم الكونية","تدوين تاريخ الأمم السابقة","بناء القصور والحصون","إتمام مكارم الأخلاق وتزكية النفوس"],"answer":3,"why":"أكد النبي ﷺ أن الغاية العظيمة من بعثته تعبيد الناس لله ونشر التوحيد، وقال: «إنما بُعثت لأتمم صالح الأخلاق» (أخرجه أحمد)، فبعثته بعثة تربوية تزكوية.","ref":"ص 3"},{"q":"لماذا كانت النفس أخطر أعداء الإنسان؟","options":["لأنها لا تحب الطاعة بطبعها","لأنها لا تتغير أبدًا","لأنها إذا لم تُزكَّ ولم تُربَّ انحرفت","لأنها تقبل الشهوات وحدها"],"answer":2,"why":"بعثته ﷺ بعثة تربوية تزكوية؛ وذلك لأن النفس أخطر أعداء الإنسان، وإذا لم تُرَبَّ وتُزكَّ انحرفت.","ref":"ص 3"},{"q":"كم قسمًا متتاليًا أقسم الله به في سورة الشمس قبل قوله: ﴿قد أفلح من زكاها﴾؟","options":["ثلاثة أقسام","أحد عشر قسمًا","سبعة أقسام","عشرون قسمًا"],"answer":1,"why":"أقسم الله تعالى أحد عشر قسمًا متتاليًا في سورة الشمس، وهذا القسم العظيم جاء ليلفت نظر الإنسان إلى أمر من أعظم الأمور وهو تزكية نفسه.","ref":"ص 3"},{"q":"ما أول جريمة قتل في التاريخ التي ذكر الدرس أن النفس كانت سببها؟","options":["قتل أحد ابني آدم لأخيه: ﴿فطوّعت له نفسه قتل أخيه﴾","قتل قوم لوط لنبيهم","قتل فرعون لموسى","قتل قريش لحمزة"],"answer":0,"why":"تضييع تزكية النفس يؤدي إلى الخيبة في الدنيا والآخرة؛ فقد كانت سبب أول جريمة قتل في التاريخ: ﴿فطوّعت له نفسه قتل أخيه فقتله فأصبح من الخاسرين﴾.","ref":"ص 3"},{"q":"ما الذي كان النبي ﷺ يقوله في معظم خطبه تعليمًا للأمة العناية بأمر النفس؟","options":["«اللهم اجعل نفوسنا راضية»","«ونسأل الله علو النفس»","«ونعوذ بالله من شر الأعداء»","«ونعوذ بالله من شرور أنفسنا ومن سيئات أعمالنا»"],"answer":3,"why":"علّم رسول الله ﷺ الأمة العناية بأمر النفس؛ ففي معظم خطبه كان يقول: «ونعوذ بالله من شرور أنفسنا ومن سيئات أعمالنا» (أخرجه ابن ماجه).","ref":"ص 3"},{"q":"ما أعظم وسائل التزكية بحسب الدرس؟","options":["كثرة الأوراد وحدها","الاعتزال عن الناس","الوحي الشريف، فهو خير وسيلة للتخلية والتحلية","جمع المال وإنفاقه"],"answer":2,"why":"إن أعظم وسائل التزكية هو الوحي الشريف؛ فهو خير وسيلة للتخلية والتحلية، وقد جاءت أول السور المكية لتؤكد الأمر بتطهير النفس قبل الفرائض.","ref":"ص 4"},{"q":"بماذا تميزت سورة النور في منهج التزكية عن سورتي المزمل والحجرات؟","options":["أنها تعتمد على ركن البناء والتحلية فقط","أنها تعتمد على ركن الهدم والتخلية: هدم الأخلاق السيئة وتخلية النفس منها","أنها تعتمد على القصص التاريخي","أنها خاصة بالعبادات دون الأخلاق"],"answer":1,"why":"سورتا المزمل (التزكية بالعبادة) والحجرات (التربية على الأخلاق الفاضلة) تعتمدان على ركن البناء، أما سورة النور فهي سورة تزكوية عن طريق الهدم والتخلية، وهو الركن الآخر للتزكية، أي هدم الأخلاق السيئة وتخلية النفس منها.","ref":"ص 4"},{"q":"كيف وصف ابن القيم النفس في أحوالها؟","options":["تكون تارة أمّارة، وتارة لوّامة، وتارة مطمئنة، والحكم للغالب عليها","هي مطمئنة دائمًا لا تتغير","هي أمّارة بالسوء في كل الأحوال","هي لوّامة في كل الأحوال"],"answer":0,"why":"قال ابن القيم: «والنفس قد تكون تارة أمّارة، وتارة لوّامة، وتارة مطمئنة، بل في اليوم الواحد والساعة الواحدة يحصل منها هذا وهذا، والحكم للغالب عليها من أحوالها».","ref":"ص 4"},{"q":"كيف جاءت سورة النور بضوابط للشهوة من جانب التخلية؟","options":["أمرت بكبت الشهوة تمامًا","أباحت الاختلاط بضوابط عامة","تركت الأمر لعادات الناس","حرّم الله الكلام في الفواحش والاختلاط، وحرّم على المرأة إظهار زينتها لغير محارمها، وحذّر من اتباع خطوات الشيطان"],"answer":3,"why":"جاءت سورة النور بضوابط تحمي الإنسان من سوء استغلال الشهوة؛ فمن جانب التخلية: حرّم الله الكلام في الفواحش والاختلاط، وحرّم على المرأة إظهار زينتها لغير محارمها، وحذّر من اتباع خطوات الشيطان والبيئات الفاسدة.","ref":"ص 5"},{"q":"ما نوعا الفتن التي تُعرض على العبد بحسب الدرس؟","options":["فتنة المال وفتنة الولد","فتنة السلطان وفتنة العلم","فتنة الشبهات وفتنة الشهوات","فتنة الغنى وفتنة الفقر"],"answer":2,"why":"الفتن التي تُعرض على العبد نوعان: فتنة الشبهات، وفتنة الشهوات. وأنزل الله سورًا كاملة لحماية المسلم من خطرها.","ref":"ص 6"},{"q":"ما السورة التي أُنزلت للحماية من فتنة الشهوات بحسب الدرس؟","options":["سورة آل عمران","سورة النور","سورة البقرة","سورة المائدة"],"answer":1,"why":"جاءت سورة النور للحماية من انحراف الشهوة، حيث تتحدث عن حالات الضعف البشري أمام الشهوات وتُرشد المسلم إلى الطرق الصحيحة ليكون قويًّا أمامها ويعالجها. أما سورة آل عمران فنزلت للقضاء على فتنة الشبهات.","ref":"ص 6"},{"q":"كم عدد آيات سورة النور وما ترتيبها في المصحف؟","options":["أربع وستون آية، وهي الرابعة والعشرون في ترتيب المصحف","ثمانون آية، وهي الثانية والعشرون","ستون آية، وهي الخامسة والعشرون","اثنتان وسبعون آية، وهي العشرون"],"answer":0,"why":"سورة النور مدنية، وهي السورة الرابعة والعشرون في ترتيب المصحف، والمئة في ترتيب النزول، نزلت بعد سورة الحشر وقبل سورة الحج، وعدد آياتها أربع وستون آية.","ref":"ص 7"},{"q":"ما أبرز الأحداث التي عالجتها سورة النور في المجتمع المدني الناشئ؟","options":["غزوة بدر","حادثة الهجرة","صلح الحديبية","حادثة الإفك التي افتُري فيها على عائشة رضي الله عنها وكشفت كيد المنافقين"],"answer":3,"why":"نزلت سورة النور لمعالجة قضايا أخلاقية وأحداث حساسة، من أهمها حادثة الإفك حيث افتُري على أم المؤمنين عائشة رضي الله عنها فأنزل الله براءتها في هذه السورة، وكشف كيد المنافقين وعلى رأسهم عبد الله بن أبي ابن سلول.","ref":"ص 7"},{"q":"لماذا سُمّيت سورة النور بهذا الاسم بحسب الدرس؟","options":["لأن فيها وصفًا للشمس والقمر","لأنها نزلت عند الفجر","لما تميّزت به من إشراق الهداية والتشريعات التي تنير طريق المؤمنين، ولورود لفظ «النور» ومشتقاته فيها سبع مرات","لأنها أول سورة نزلت في المدينة"],"answer":2,"why":"سُمّيت بـ«النور» لما تميّزت به من إشراق الهداية والتشريعات التي تنير طريق المؤمنين في حياتهم، ولورود لفظ النور ومشتقاته فيها سبع مرات، منها آية النور.","ref":"ص 7"},{"q":"ماذا قال عمر بن الخطاب رضي الله عنه في خطبته بخصوص تعليم سورة النور؟","options":["«علّموا رجالكم سورة النور، وعلّموا نساءكم سورة المائدة»","«علّموا رجالكم سورة المائدة، وعلّموا نساءكم سورة النور»","«علّموا الجميع سورة البقرة»","«علّموا نساءكم سورة الفاتحة»"],"answer":1,"why":"وروى سعيد بن منصور في سننه أن عمر بن الخطاب رضي الله عنه قام في الناس خطيبًا فقال: «أيها الناس! علّموا رجالكم سورة المائدة، وعلّموا نساءكم سورة النور».","ref":"ص 8"},{"q":"ما المحاور الثلاثة التي ذكرها الدرس للتربية الإيمانية في سورة النور؟","options":["خطر الذنوب، والمراقبة، والحديث عن يوم القيامة","الصبر، والشكر، والتوكل","الخوف، والرجاء، والمحبة","الصلاة، والزكاة، والحج"],"answer":0,"why":"نقف مع ثلاثة محاور من التربية الإيمانية في سورة النور: خطر الذنوب، والمراقبة، والحديث عن يوم القيامة.","ref":"ص 11"},{"q":"كيف عرّف ابن القيم المراقبة بحسب الدرس؟","options":["«الخوف من الناس في السر والعلن»","«كثرة النوافل والأوراد»","«الابتعاد عن الناس مخافة الذنب»","«دوام علم العبد وتيقّنه باطلاع الحق سبحانه وتعالى على ظاهره وباطنه»"],"answer":3,"why":"عرّفها ابن القيم بأنها: «دوام علم العبد وتيقنه باطلاع الحق سبحانه وتعالى على ظاهره وباطنه»، وإذا علم العبد بذلك دعاه إلى اجتناب المعصية والمبادرة بالطاعة.","ref":"ص 13"},{"q":"ما الذي يشهد على العبد يوم القيامة بحسب قوله تعالى: ﴿يوم تشهد عليهم ألسنتهم وأيديهم وأرجلهم بما كانوا يعملون﴾؟","options":["الملائكة وحدهم","الأنبياء والرسل","ألسنتهم وأيديهم وأرجلهم","أهل بيته"],"answer":2,"why":"في الآية يشهد على العبد جوارحه التي كان يظنها في قبضته: اللسان الذي نطق بالبهتان، واليد التي امتدت للحرام، والرجل التي مشت للفاحشة.","ref":"ص 14-15"}],"12":[{"q":"كيف يُعرَّف الخُلُق بحسب الدرس نقلًا عن «إحياء علوم الدين»؟","options":["هيئة في النفس راسخة تصدر عنها الأفعال بسهولة ويسر من غير حاجة إلى فكر وروية","سلوك مؤقت يتغير بتغير الظروف","معرفة الإنسان بما يجوز وما لا يجوز","التزام الإنسان بالعادات الاجتماعية"],"answer":0,"why":"الخلق: هيئة في النفس راسخة عنها تصدر الأفعال بسهولة ويسر من غير حاجة إلى فكر وروية، والتربية الأخلاقية هي عملية تهذيب تلك الأخلاق وتنمية الشريف منها.","ref":"ص 3"},{"q":"على أي نوعين من القواعد ترتكز التربية الأخلاقية بحسب الدرس؟","options":["القواعد المدنية والقواعد الدينية","القواعد الفردية والقواعد الجماعية","القواعد القديمة والقواعد الحديثة","القواعد الناهية والقواعد الآمرة"],"answer":3,"why":"ترتكز التربية الأخلاقية على نوعين: القواعد الناهية التي تحذّر من الأخلاق السيئة وتدعو للتخلي عن الرذائل، والقواعد الآمرة التي تحثّ على التحلي بالفضائل والالتزام بها.","ref":"ص 3"},{"q":"ما الأحكام الثلاثة في القاذف التي تضمنتها الآية بحسب القرطبي؟","options":["سجنه، ونفيه، وتغريمه","جلده، وتغريمه، وطلاقه","جلده، ورد شهادته أبدًا، وفسقه","حبسه، وقطع يده، ونفيه"],"answer":2,"why":"قال القرطبي: «فتضمنت الآية ثلاثة أحكام في القاذف: جلده، ورد شهادته أبدًا، وفسقه».","ref":"ص 3"},{"q":"ما العقوبة التي توعّد الله بها من يحب أن تشيع الفاحشة في المؤمنين؟","options":["حرمانه من الميراث","عذاب أليم في الدنيا والآخرة","النفي من البلد","القطيعة من الأهل فقط"],"answer":1,"why":"قال تعالى: ﴿إن الذين يحبون أن تشيع الفاحشة في الذين آمنوا لهم عذاب أليم في الدنيا والآخرة﴾ [النور: 19].","ref":"ص 4"},{"q":"بماذا عاتب الله المؤمنين في حادثة الإفك بحسب قوله تعالى: ﴿إذ تلقونه بألسنتكم﴾؟","options":["على التسرع في تناقل الخبر دون تحقق","على السكوت عن الإفك","على الدفاع عن عائشة","على التبليغ للنبي ﷺ"],"answer":0,"why":"عاتب الله المؤمنين على التسرع في تناقل حادثة الإفك دون تحقق، وفي الآية تعريض بحرصهم على تلقي هذا الخبر والمبادرة إلى الإخبار به بلا تروٍّ.","ref":"ص 4"},{"q":"ما الذي حلف أبو بكر رضي الله عنه ألا يفعله فنزل قوله تعالى: ﴿ولا يأتل أولو الفضل منكم والسعة﴾؟","options":["أن لا يكلم عائشة","أن لا يصلي خلف أحد","أن لا يخرج من بيته","أن لا ينفق على مسطح بن أثاثة"],"answer":3,"why":"كان أبو بكر ينفق على مسطح بن أثاثة ابن خالته وكان من فقراء المهاجرين، فلما علم بخوضه في قصة الإفك أقسم أن لا ينفق عليه، فنزلت الآية.","ref":"ص 5"},{"q":"ماذا يدعو إليه قوله تعالى: ﴿وليعفوا وليصفحوا ألا تحبون أن يغفر الله لكم﴾؟","options":["الانتقام ممن أساء","الإعراض عن الناس","العفو والصفح عمّن أساء، رجاء مغفرة الله","الصمت عن الظلم"],"answer":2,"why":"حثّت السورة على تجاوز الأخطاء والإحسان لمن أساء، كما فعل أبو بكر الصديق رضي الله عنه مع مسطح بن أثاثة.","ref":"ص 9"},{"q":"كيف وجّهت سورة النور المرأة المسلمة في اللباس والزينة؟","options":["بترك الزينة في كل الأوقات حتى مع المحارم","بغض البصر وحفظ الفرج وعدم إبداء الزينة للأجانب وإسدال الخمار على الجيب","بالتبرج في المناسبات فقط","بترك الأمر للعرف دون توجيه"],"answer":1,"why":"جاء في السورة توجيه واضح للمرأة المسلمة بغض البصر وحفظ الفرج وعدم إبداء الزينة للأجانب عنها، وأُمرت بإسدال الخمار على الجيب: ﴿وليضربن بخمرهن على جيوبهن﴾، ونُهيت عن الضرب بالأرجل لإظهار صوت الحلي.","ref":"ص 6"},{"q":"لماذا حذّرت السورة من بقاء المنافقين في المجتمع؟","options":["لما يبثونه من الشكوك والإشاعات، ولأن وجودهم عائق أمام صفاء العلاقات بين المؤمنين","لأنهم يضعفون الاقتصاد","لأنهم قلّة لا قيمة لهم","لأنهم يغيّرون الأحكام الفقهية"],"answer":0,"why":"بيّنت السورة حال المنافقين وخطر بقائهم في المجتمع لما يبثونه من الشكوك والإشاعات، وأن وجودهم عائق أمام صفاء العلاقات بين المؤمنين كما فعلوا في حادثة الإفك.","ref":"ص 6"},{"q":"ماذا قالت امرأة أبي أيوب لزوجها حين سمعت كلام الناس في عائشة رضي الله عنها؟","options":["«يجب أن نصدّق ما يقوله الناس»","«لنسأل عائشة عن الحقيقة»","«لنخرج من المدينة حتى تهدأ الفتنة»","«أكنتَ فاعلًا ذلك؟»، فقال: «لا والله»، فقالت: «فعائشة خير منكِ»"],"answer":3,"why":"قالت امرأته: يا أبا أيوب، ألا تسمع ما يقول الناس في عائشة؟ قال: بلى وذلك الكذب، أكنتِ فاعلةً ذلك يا أم أيوب؟ قالت: لا والله ما كنتُ لأفعله، قال: فعائشة والله خير منكِ. وهذا من حسن الظن بالمؤمنين.","ref":"ص 6-7"},{"q":"ما القاعدة العظيمة التي أرستها السورة بخصوص الحكم على الناس أو نشر خبر عنهم؟","options":["يجوز ذلك إن كثر ناقلوه","يجوز ذلك إن كان المتكلم عالمًا","لا يجوز ذلك إلا بعلم يقيني ودليل قاطع","يجوز ذلك إذا كان الخبر يهم الجماعة"],"answer":2,"why":"أرست السورة قاعدة عظيمة: لا يجوز الحكم على الناس أو نشر خبر عنهم إلا بعلم يقيني ودليل قاطع، قال تعالى: ﴿لولا جاءوا عليه بأربعة شهداء فإذ لم يأتوا بالشهداء فأولئك عند الله هم الكاذبون﴾.","ref":"ص 8"},{"q":"ما أوقات العورات الثلاث التي يُربّى فيها الأولاد على الاستئذان قبل البلوغ؟","options":["بعد الفجر، ووقت الضحى، وقبل المغرب","قبل الفجر، ووقت القيلولة، وبعد العشاء","وقت الظهر، ووقت العصر، ووقت المغرب","بعد العصر، وبعد المغرب، قبل الظهر"],"answer":1,"why":"تأمر السورة بتربية الأولاد قبل البلوغ على الاستئذان في أوقات العورات الثلاث: قبل الفجر، ووقت القيلولة، وبعد العشاء. وبعد البلوغ يلتزم الولد بأدب الاستئذان في جميع الأوقات.","ref":"ص 8"},{"q":"لماذا شدّدت السورة على تحريم الزنا وأقامت له الحدود الصارمة؟","options":["حماية للأنساب من الاختلاط وصيانةً للأسرة من الانهيار الأخلاقي","لتقليل عدد الأسر في المجتمع","لتشجيع الزواج المبكر فقط","للحد من الاختلاط في الأسواق"],"answer":0,"why":"شددت السورة على تحريم الزنا وأقامت له الحدود الصارمة حماية للأنساب من الاختلاط وصيانةً للأسرة من الانهيار الأخلاقي، كما جاءت أحكام اللعان بين الزوجين لحسم الخلافات التي تمس الشرف والكرامة.","ref":"ص 9"}],"13":[{"q":"كم محورًا أساسيًّا جاء الدرس في ضوئها؟","options":["ثلاثة محاور","خمسة محاور","أربعة محاور","ستة محاور"],"answer":1,"why":"ذكر الدرس أنه يأتي في خمسة محاور: مبادئ التربية العفيفة، والاستئذان، وذم الزنا والبغاء، والعفة بغض البصر وحفظ الفرج، وأحكام الحجاب.","ref":"ص 2"},{"q":"ما تعريف العفة الذي أورده ابن سيده بحسب الدرس؟","options":["«الكفّ عما لا يحلّ ولا يجمل»","«طلب الرزق الحلال والاستغناء عن الناس»","«الامتناع عن الزواج لمن لا يستطيع الباءة»","«الصبر على فقد المال»"],"answer":0,"why":"نقل الدرس قول ابن سيده: «العفة: الكفّ عما لا يحل ولا يجمل».","ref":"ص 3"},{"q":"ما تعريف الراغب الأصفهاني للعفة؟","options":["بذل المال في سبيل الله","الصبر على الابتلاء","الحياء من الناس","حصول حالة للنفس تمتنع بها عن غلبة الشهوة"],"answer":3,"why":"قال الراغب: «العفّة: حصول حالة للنفس تمتنع بها عن غلبة الشهوة».","ref":"ص 3"},{"q":"ما اللفظ القرآني القريب من العفة الذي ذُكر في قوله تعالى: ﴿وليستعفف الذين لا يجدون نكاحًا حتى يغنيهم الله من فضله﴾؟","options":["الإحصان","القنوت","الاستعفاف","الغض"],"answer":2,"why":"ذكر الدرس أن من الألفاظ القرآنية القريبة منها: الاستعفاف، كما في سورة النور آية 33.","ref":"ص 4"},{"q":"كيف عرّف الدرس «التربية العفيفة»؟","options":["مجموعة عقوبات تُطبّق على المخالفين","منهج متكامل لتنشئة الفرد على ضوابط الشرع في التعامل مع الغرائز","تعليم الأبناء الصبر على الفقر","منع الاختلاط في كل الأحوال"],"answer":1,"why":"عرّفها الدرس بأنها منهج متكامل يهدف إلى تنشئة الفرد على ضوابط الشرع في التعامل مع الغرائز، بحيث يُربّى على الطهارة الظاهرة والباطنة.","ref":"ص 4"},{"q":"ما الذي حذّر الله منه بقوله: ﴿ويريد الذين يتبعون الشهوات أن تميلوا ميلًا عظيمًا﴾ بحسب الدرس؟","options":["غياب العفة وانتشار الفواحش وفساد القلوب والأخلاق","إهمال الصلاة","قطع الأرحام","التقصير في طلب العلم"],"answer":0,"why":"ذكر الدرس أنه متى غابت العفة تفككت الأسر وانتشرت الفواحش وفسدت القلوب والأخلاق، وهو ما حذّر الله منه بهذه الآية من سورة النساء.","ref":"ص 5"},{"q":"أي مما يلي من أسباب ضياع العفة في المجتمعات بحسب الدرس؟","options":["كثرة الاشتغال بطلب العلم الشرعي","الإفراط في تعليم الأبناء آداب الاستئذان","تيسير الزواج وتقليل المهور","إهمال إقامة الحدود، وضعف الوازع الإيماني، والغزو الفكري والإعلامي"],"answer":3,"why":"من الأسباب المذكورة: ضعف الوازع الإيماني، وغياب الرادع الشرعي بإهمال إقامة الحدود، والغزو الفكري والإعلامي، وإهمال التربية الأسرية، وتعسير الحلال وتيسير الحرام.","ref":"ص 5–6"},{"q":"ما أثر المغالاة في المهور وتكاليف الزواج بحسب الدرس؟","options":["تزيد من استقرار الأسرة","تقلل من الطلاق","تدفع الشباب إلى الطرق المحرمة","تقوي الوازع الإيماني"],"answer":2,"why":"ذكر الدرس أن من صور تعسير الحلال وتيسير الحرام: المغالاة في المهور وتكاليف الزواج، مما يدفع الشباب إلى الطرق المحرمة.","ref":"ص 6"},{"q":"ما أبرز ما يحرص عليه الأبوان في مرحلة «ما دون السادسة» لغرس العفة؟","options":["تعليمهم أحكام الغسل والحيض","إبعاد الأولاد عن غرفة نوم الوالدين، وتدريبهم على آداب الاستئذان، وتعليمهم مفهوم العورة","التفريق بينهم في المضاجع","مناقشة قضايا البلوغ"],"answer":1,"why":"ذكر الدرس في هذه المرحلة: إبعاد الأولاد عن غرفة نوم الوالدين، وتدريبهم على الاستئذان، وتعليمهم الحدود الجسدية، وتبديل الملبس وقضاء الحاجة بأنفسهم، وتعليمهم مفهوم العورة.","ref":"ص 7"},{"q":"ما الإجراء الذي يحرص عليه المربي في مرحلة «ما بعد السابعة» لتعزيز العفة؟","options":["التفريق بين الأولاد في المضاجع","تعليمهم قضاء الحاجة بأنفسهم","مناقشة أحكام الغسل والحيض","إبعادهم عن غرفة نوم الوالدين"],"answer":0,"why":"ذكر الدرس في مرحلة ما بعد السابعة: التفريق بين الأولاد في المضاجع، وتعليمهم آداب النظر وضوابط الخلوة، وغرس مراقبة الله والخوف منه.","ref":"ص 7–8"},{"q":"ماذا ينبغي في مرحلة المراهقة والشباب بحسب الدرس؟","options":["الاكتفاء بالتفريق بين الأولاد في المضاجع","ترك الأمر دون متابعة","منعهم من الاختلاط بالصحبة تمامًا","مناقشة القضايا المرتبطة بالعفة والبلوغ وما يتعلق بها من أحكام الغسل والحيض"],"answer":3,"why":"ذكر الدرس تقوية الجانب الإيماني، وتزويدهم بالقدوة الصالحة ومتابعة الصحبة، ومناقشة قضايا العفة والبلوغ وأحكام الغسل والحيض.","ref":"ص 8"},{"q":"ما المعنى الذي أشار إليه التعبير بلفظ «تستأنسوا» في آية الاستئذان بحسب الدرس؟","options":["أن يستأذن الزائر ثلاث مرات","أن يدخل الزائر بصمت","أعلى من الاستئذان، حتى يشعر الزائر بأنس أهل البيت به","أن يسلّم من وراء الباب"],"answer":2,"why":"نقل الدرس أن «تستأنسوا» أعلى من الاستئذان، حتى تستشعروا أنس أهل البيت بكم، فلا يدخل الزائر إذا تبين له أن صاحب البيت لا يرغب في دخوله.","ref":"ص 8"},{"q":"ما الأوقات الثلاثة (العورات) التي يجب أن يستأذن فيها الخدم والأطفال بحسب آية سورة النور؟","options":["عند شروق الشمس وعند غروبها ومنتصف الليل","من قبل صلاة الفجر، وحين تضعون ثيابكم من الظهيرة، ومن بعد صلاة العشاء","قبل صلاة الظهر وبعد صلاة العصر وبعد صلاة العشاء","وقت الفجر والعصر والمغرب"],"answer":1,"why":"ذكر الدرس في الاستئذان الخاص (النور: 58) أنها العورات الثلاث: قبل صلاة الفجر، وحين وضع الثياب من الظهيرة، ومن بعد صلاة العشاء.","ref":"ص 9"},{"q":"كم مرة يكون الاستئذان، وماذا يفعل من لم يُؤذن له؟","options":["ثلاث مرات، فإن لم يؤذن له رجع","مرة واحدة ثم يدخل","سبع مرات ثم ينتظر","مرتين ثم ينتظر عند الباب"],"answer":0,"why":"ورد في حديث أبي سعيد الخدري: «إذا استأذن أحدكم ثلاثًا فلم يؤذن له فليرجع» (متفق عليه).","ref":"ص 9"},{"q":"لماذا نُهي عن مواجهة الباب عند الاستئذان بحسب الحديث الذي ذكره الدرس؟","options":["لأن الباب يكون مغلقًا","لأن صاحب البيت قد يكون نائمًا","لأن الوقوف أمام الباب يزعج الجيران","حتى لا يرى الداخل ما بداخل البيت، فإنما جُعل الاستئذان من النظر"],"answer":3,"why":"ذكر الدرس حديثًا أن النبي ﷺ قال لمن وقف مستقبل الباب: «هكذا عنك، فإنما الاستئذان من النظر» (أخرجه أبو داود).","ref":"ص 10"},{"q":"ما معنى «غضّ البصر» كما ورد في الدرس؟","options":["إغلاق العينين عند الخروج","عدم النظر إلى الناس مطلقًا","خفضه وكفّه عن النظر المحرم، وليس إغلاق العينين تمامًا","النظر إلى الأرض طوال الوقت"],"answer":2,"why":"ذكر الدرس أن غض البصر يعني خفضه وكفه عن النظر المحرم وعدم التحديق فيما يثير الشهوة، وليس المقصود إغلاق العين تمامًا.","ref":"ص 10"},{"q":"لماذا قُدِّم الأمر بغض البصر على الأمر بحفظ الفرج في القرآن؟","options":["لأن غض البصر أسهل من حفظ الفرج","لأن العين هي البوابة الأولى للقلب وبريد الشهوة والزنا","لأن غض البصر واجب وحفظ الفرج مستحب","لأن العورة لا تُستر إلا بعد غض البصر"],"answer":1,"why":"ذكر الدرس أن العين بوابة القلب والنظر بريد الشهوة، ومن ضبط بصره سهل عليه ضبط فرجه، فالعلاقة بينهما تكاملية لتحقيق العفة.","ref":"ص 10"},{"q":"ما الفرق بين الزنا والبغاء بحسب الدرس؟","options":["الزنا وطء الرجل للمرأة بغير عقد شرعي أو ملك يمين، والبغاء زنا المرأة بإكراه أو برضاها لأجل الكسب المادي","الزنا للمتزوج والبغاء لغير المتزوج","الزنا بالإكراه والبغاء بالرضا","لا فرق بينهما في المعنى"],"answer":0,"why":"عرّف الدرس الزنا بأنه وطء الرجل للمرأة من غير عقد شرعي أو ملك يمين، والبغاء بأنه زنا المرأة مع الإكراه أو برضاها لأجل الكسب المادي أو مقابل أجر.","ref":"ص 11"},{"q":"ما أعظم درجات الزنا وأشدها عقوبة بحسب الدرس؟","options":["زنا العين","زنا اللسان","زنا القلب","زنا الفرج"],"answer":3,"why":"ذكر الدرس أن زنا الفرج هو الفعل الصريح الكامل وهو أعظم الدرجات، وأما زنا الجوارح فكزنا العين بالنظر والأذن بالاستماع واليد باللمس والقلب بالخواطر والشهوة.","ref":"ص 11"},{"q":"بماذا قرن القرآن الزنا في القبح والشناعة بحسب الدرس؟","options":["بالسرقة","بالربا","بالشرك","بالقتل"],"answer":2,"why":"استدل الدرس بقوله تعالى: ﴿الزاني لا ينكح إلا زانية أو مشركة والزانية لا ينكحها إلا زانٍ أو مشرك وحُرّم ذلك على المؤمنين﴾ [النور: 3].","ref":"ص 11"},{"q":"ما عقوبة الزاني غير المحصن بحسب الدرس؟","options":["الرجم حتى الموت","جلد مائة جلدة وتغريب عام","السجن عامًا","الغرامة المالية"],"answer":1,"why":"ذكر الدرس أن عقوبة غير المحصن مائة جلدة علنًا أمام طائفة من المؤمنين وتغريب عام، وعقوبة المحصن الرجم حتى الموت، مستشهدًا بحديث مسلم.","ref":"ص 12"},{"q":"ما أقرب معنى للحجاب لغةً بحسب الدرس؟","options":["المنع من الوصول","الستر بالثوب","الحياء من الناس","الإخفاء عن النظر"],"answer":0,"why":"ذكر الدرس أن الحجاب لغةً: «المنع من الوصول»، وشرعًا: حجب المرأة المسلمة من غير القواعد من النساء عن أنظار الرجال غير المحارم لها.","ref":"ص 12"},{"q":"أي آية ذكرها الدرس تربط بين ستر العورة والتقوى؟","options":["قوله تعالى: ﴿قل للمؤمنين يغضوا من أبصارهم﴾","قوله تعالى: ﴿فاسألوهن من وراء حجاب﴾","قوله تعالى: ﴿يدنين عليهن من جلابيبهن﴾","قوله تعالى: ﴿يا بني آدم قد أنزلنا عليكم لباسًا يواري سوءاتكم وريشًا ولباس التقوى ذلك خير﴾"],"answer":3,"why":"ذكر الدرس أن هذه الآية (الأعراف: 26) تربط بين ستر العورة والتقوى، مما يدل على أن الحجاب عبادة قلبية قبل أن يكون مظهرًا خارجيًّا.","ref":"ص 12"},{"q":"ما أحد شروط الحجاب الشرعي التي ذكرها الدرس؟","options":["أن يكون لباس شهرة","أن يكون معطّرًا","أن يكون سميكًا لا يشف ما تحته","أن يكون في ذاته زينة لافتة"],"answer":2,"why":"من الشروط: أن يغطي جميع بدن المرأة إلا ما استُثني، وأن يكون سميكًا لا يشف ما تحته، وفضفاضًا لا يحدد تفاصيل الجسم، وألا يشبه لباس الرجال أو الكافرات، وألا يكون معطرًا ولا لباس شهرة.","ref":"ص 13"},{"q":"ماذا كانت تفعل عائشة رضي الله عنها ونساء الصحابة إذا حاذاهن الركبان وهن محرمات؟","options":["يتوقفن عن السير حتى يمر الركبان","تسدل إحداهن جلبابها من رأسها على وجهها، فإذا جاوزوهن كشفنه","يغطين الوجه بالأيدي فقط","ينصرفن إلى خيامهن"],"answer":1,"why":"روت عائشة في سنن أبي داود: «كان الركبان يمرون بنا ونحن مع رسول الله ﷺ محرمات، فإذا حاذوا بنا سدلت إحدانا جلبابها من رأسها على وجهها، فإذا جاوزونا كشفناه».","ref":"ص 14"},{"q":"ماذا قالت حفصة بنت سيرين في تفسير قوله تعالى ﴿وأن يستعففن خير لهن﴾ بحسب الدرس؟","options":["هو إثبات الجلباب (أي لبس الجلباب خير لهن)","هو ترك الزينة تمامًا","هو الزواج","هو غض البصر فقط"],"answer":0,"why":"نقل الدرس أنها كانت تلبس الجلباب وتتنقب وقالت: «وأن يستعففن خير لهن»: هو إثبات الجلباب، وكانت قد تجاوزت الثمانين.","ref":"ص 14"}],"14":[{"q":"بعد العودة من أي غزوة وقعت حادثة الإفك؟","options":["غزوة بدر","غزوة أحد","غزوة المريسيع","غزوة الأحزاب"],"answer":2,"why":"ذكر الدرس أنه بعد العودة من غزوة المريسيع تأخرت أم المؤمنين عائشة رضي الله عنها عن الجيش لتبحث عن عقد لها سقط.","ref":"ص 3"},{"q":"لماذا لم ينتبه الصحابة الذين حملوا هودج عائشة رضي الله عنها إلى غيابها عنه؟","options":["لأنها كانت نائمة داخله","لأنها كانت خفيفة لم تحمل اللحم","لأنهم كانوا في عجلة من الظلام","لأنها أخبرتهم بأنها فيه"],"answer":1,"why":"ذكر الدرس أنها كانت حينئذ خفيفة لم تحمل اللحم، فلم ينتبه إلى غيابها عن هودجها.","ref":"ص 3"},{"q":"من الصحابي الذي كان يتخلف خلف الجيش لتفقد المتأخرين، وهو الذي وجد عائشة رضي الله عنها؟","options":["صفوان بن المعطّل رضي الله عنه","أبو أيوب الأنصاري رضي الله عنه","حسان بن ثابت رضي الله عنه","مسطح بن أثاثة رضي الله عنه"],"answer":0,"why":"ذكر الدرس أن من عادة النبي ﷺ أن يُبقي رجلًا خلف الجيش، وكان صفوان بن المعطل يقوم بهذه المهمة، فرأى سواد إنسان نائم فأتاها.","ref":"ص 3"},{"q":"ما السمة التي يستنتجها الدرس من قول عائشة رضي الله عنها: «وكان يراني قبل الحجاب»؟","options":["أن الحجاب لم يكن مشروعًا بعد","أن الرجال كانوا يدخلون بيوتهن","أن عائشة كانت تخالط الناس","التزام أمهات المؤمنين بالحجاب"],"answer":3,"why":"أشار النشاط (1) إلى استنتاج سمة من سمات حجاب أمهات المؤمنين من قولها: «وكان يراني قبل الحجاب».","ref":"ص 3"},{"q":"على رأس من استغل حادثة الإفك للطعن في عرض أم المؤمنين والنيل من النبي ﷺ ودعوته؟","options":["مسطح بن أثاثة","حمنة بنت جحش","عبد الله بن أبي ابن سلول","حسان بن ثابت"],"answer":2,"why":"ذكر الدرس أن الحادثة كانت مادة للمنافقين وعلى رأسهم عبد الله بن أبي ابن سلول.","ref":"ص 4"},{"q":"ما القسم الأول من أقسام الناس في التعامل مع حادثة الإفك؟","options":["قسم أحسن الظن ورد الخبر جملة","قسم مستغل للحدث في الكيد للإسلام","قسم تورع عن الخوض مطلقًا","قسم أنكر بقلبه لكنه خاض بلسانه"],"answer":1,"why":"ذكر الدرس أن الأقسام أربعة: مستغل للحدث في الكيد للإسلام (المنافقون)، ومن أنكر بقلبه لكنه خاض بلسانه، ومن أحسن الظن ورد الخبر جملة وتفصيلًا، ومن تورع عن الخوض مطلقًا.","ref":"ص 4"},{"q":"ماذا قال أبو زرعة رحمه الله فيمن يطعن في أحد من أصحاب رسول الله ﷺ؟","options":["«فاعلم أنه زنديق»","«فاعلم أنه جاهل»","«فاعلم أنه مبتدع فقط»","«فاعلم أنه مخطئ»"],"answer":0,"why":"نقل الدرس قوله: إنما أدّى إلينا هذا القرآن والسنن أصحاب رسول الله ﷺ، ومن طعن فيهم فإنما أراد القرآن والسنة.","ref":"ص 4"},{"q":"ممن وقع في القسم الثاني (من أنكر بقلبه لكنه خاض بلسانه) بحسب ما نقله الدرس عن ابن كثير؟","options":["أبو أيوب وأم أيوب","زينب بنت جحش وأم المؤمنين عائشة","عبد الله بن أبي وصفوان","مسطح وحسان وحمنة بنت جحش"],"answer":3,"why":"نقل الدرس قول ابن كثير: وهذا فيمن عنده إيمان رزقه الله بسببه التوبة إليه، كمسطح وحسان وحمنة بنت جحش.","ref":"ص 4"},{"q":"ماذا قال أبو أيوب الأنصاري لزوجته أم أيوب رضي الله عنهما حين سألته عما يقوله الناس في عائشة؟","options":["«سنسأل رسول الله ﷺ»","«لا بد أن نتأكد من الخبر»","«فعائشة والله خير منكِ»","«هذا كذب ولا تذكريه أبدًا»"],"answer":2,"why":"روى الطبري أنها قالت: أكنتِ فاعلة ذلك؟ قالت: لا والله ما كنت لأفعله. فقال: فعائشة والله خير منك.","ref":"ص 4–5"},{"q":"من الصحابية التي كانت تضاهي عائشة جمالًا ومكانةً عند النبي ﷺ، ولكن ورعها منعها من الخوض في الفرية؟","options":["أم سلمة رضي الله عنها","زينب بنت جحش رضي الله عنها","حفصة رضي الله عنها","جويرية رضي الله عنها"],"answer":1,"why":"ذكر الدرس أن زينب بنت جحش قالت: «أحمي سمعي وبصري، والله ما علمت عليها إلا خيرًا… فعصمها الله بالورع».","ref":"ص 5"},{"q":"ما الذي يؤخذ من القاعدة العملية التي استفادها الدرس من منهج القرآن في تناول حادثة الإفك؟","options":["النظر إلى الأحداث من جميع جوانبها قبل الحكم","الاكتفاء بنقل الخبر دون تعليق","الحكم على الناس بما ظهر منهم أولًا","اعتزال الأحداث الكبرى"],"answer":0,"why":"ذكر الدرس أن القرآن تناول الحادثة بجميع أبعادها، وهذا قاعدة عملية: إذا ألمّ بالإنسان أمر وجب أن ينظر إليه من جميع جوانبه قبل الحكم.","ref":"ص 5–6"},{"q":"بماذا وصف الله حادثة الإفك في قوله: ﴿لا تحسبوه شرًّا لكم بل هو خير لكم﴾؟","options":["بأنها فتنة لا خير فيها","بأنها عقوبة لهم","بأنها حادثة عابرة","بأنها خير لهم رغم أنها تبدو شرًّا في ظاهرها"],"answer":3,"why":"ذكر الدرس أن الخير فيها: كشف المنافقين، ورفع مكانة أهل الإيمان، وتشريع أحكام تحمي المجتمع، وتخليد براءة أم المؤمنين في قرآن يُتلى.","ref":"ص 6"},{"q":"ما مصير من تولى كِبره (أي رأس الفتنة) بحسب الآية التي ذكرها الدرس؟","options":["يُعفى عنه إن تاب","يُنفى من المدينة","له عذاب عظيم في الدنيا والآخرة","يُجلد ثمانين جلدة فقط"],"answer":2,"why":"في قوله تعالى: ﴿لكل امرئ منهم ما اكتسب من الإثم والذي تولى كبره منهم له عذاب عظيم﴾ بيّن الدرس أن كل مشارك له نصيبه بقدر مشاركته، وأن من تولى كِبره له العذاب الأعظم.","ref":"ص 7"},{"q":"ما عقوبة القذف في الدنيا بحسب الآية التي استدل بها الدرس؟","options":["جلد مائة جلدة وتغريب عام","جلد ثمانين جلدة وعدم قبول شهادتهم أبدًا","السجن عامًا","الغرامة المالية"],"answer":1,"why":"استدل الدرس بقوله تعالى: ﴿والذين يرمون المحصنات ثم لم يأتوا بأربعة شهداء فاجلدوهم ثمانين جلدة ولا تقبلوا لهم شهادة أبدًا وأولئك هم الفاسقون﴾.","ref":"ص 7"},{"q":"كيف يُعامل من خاض في حادثة الإفك بلا نية إفساد بحسب الدرس؟","options":["بالعفو والصفح","بالجلد","بالهجر","بالطرد من المجتمع"],"answer":0,"why":"ذكر الدرس قوله تعالى: ﴿وليعفوا وليصفحوا ألا تحبون أن يغفر الله لكم﴾، وأما من تعمد الطعن ونشر الفاحشة فيُعامل بالعدل وأخذ الحق.","ref":"ص 8"},{"q":"ما الذي ينبغي على المظلوم بحسب خاتمة الدرس؟","options":["أن ينتقم بنفسه","أن يترك المجتمع","أن يتجاهل الظلم تمامًا","أن يصبر ويثق أن الله لن يترك الظالم دون جزاء"],"answer":3,"why":"ذكر الدرس أنه قد يتأخر القصاص لكنه آتٍ، وأن على المظلوم أن يصبر ويثق بأن الله لن يترك الظالم دون جزاء.","ref":"ص 8"}]},"s4":{"1":[{"q":"قال رسول الله ﷺ: «من يرد الله به خيرًا يفقهه في الدين». لمن هذا الفضل بحسب الدرس؟","options":["للرجال دون النساء","لكل مسلم ومسلمة، وليس خاصًّا بالرجال دون النساء","لطلبة العلم المتخصصين فقط","للعلماء دون غيرهم"],"answer":1,"why":"ليس هذا الفضل خاصًّا بالرجال دون النساء، بل هو موجَّه إلى كل مسلم ومسلمة.","ref":"ص 3"},{"q":"لماذا كانت حاجة المرأة المسلمة إلى الفقه أعظم من حاجتها إلى الزينة واللباس؟","options":["لأنه زادها الذي تلاقي به ربها وحصنها من غوائل الجهل","لأن الزينة واللباس محرمان عليها","لأن الفقه يغنيها عن العبادات","لأن الفقه للتفاخر بين النساء"],"answer":0,"why":"إن حاجة المرأة المسلمة إلى الفقه أعظم من حاجتها إلى الزينة واللباس؛ لأنه زادها الذي تلاقي به ربها، وحصنها من غوائل الجهل.","ref":"ص 3"},{"q":"بحسب ابن القيم رحمه الله، ما العلاقة بين الفقه والفهم؟","options":["الفقه والفهم بمعنى واحد تمامًا","الفهم أخص من الفقه","الفقه مجرد حفظ للأحكام","الفقه أخص من الفهم؛ وهو فهم مراد المتكلم من كلامه"],"answer":3,"why":"قال ابن القيم: «والفقه أخص من الفهم؛ وهو فهم مراد المتكلم من كلامه، وهذا قدر زائد على مجرد فهم وَضْعِ اللفظ في اللغة».","ref":"ص 3"},{"q":"ما تعريف الفقه في الاصطلاح بحسب الدرس؟","options":["إدراك الشيء على ما هو عليه إدراكًا جازمًا","العلم بالشيء والفهم له","العلم بالأحكام الشرعية العملية المكتسَب من أدلتها التفصيلية","العلم بالتاريخ والعلوم الطبيعية وغيرها"],"answer":2,"why":"عرّف العلماء الفقه اصطلاحًا بأنه «العلم بالأحكام الشرعية العملية، المكتسَب من أدلتها التفصيلية». أما «إدراك الشيء على ما هو عليه إدراكًا جازمًا» فهو تعريف العلم.","ref":"ص 3"},{"q":"ما الفرق بين الفقه والعلم بحسب الدرس؟","options":["الفقه أعم من العلم","الفقه بالمعنى الشرعي أخص من العلم؛ فكل فقهٍ علمٌ وليس كل علمٍ فقهًا","الفقه والعلم لا فرق بينهما","العلم أخص من الفقه"],"answer":1,"why":"الفقه بالمعنى الشرعي أخص من العلم؛ لصدق العلم بالنحو وغيره، فكل فقهٍ علمٌ، وليس كل علمٍ فقهًا.","ref":"ص 3"},{"q":"أي مما يلي من ثمرات تعلّم المرأة المسلمة للفقه بحسب الدرس؟","options":["تصحيح العبادة، وتهذيب السلوك وغرس القيم، والثقة والطمأنينة","إسقاط التكاليف الشرعية عنها","الاستغناء عن سؤال أهل العلم","الاقتصار على العلم النظري دون العمل"],"answer":0,"why":"من ثمرات تعلم المرأة المسلمة للفقه: تصحيح العبادة، وتهذيب السلوك وغرس القيم، كما يمنحها الثقة والطمأنينة؛ لأنها تكون على بيّنة من أمرها.","ref":"ص 4"},{"q":"بأي آية استدل الدرس على أن التفقه في الدين فريضة وضرورة للأمة؟","options":["﴿يَرْفَعِ اللَّهُ الَّذِينَ آمَنُوا مِنكُمْ وَالَّذِينَ أُوتُوا الْعِلْمَ دَرَجَاتٍ﴾","﴿وَلَا تَقْتُلُوا أَنفُسَكُمْ إِنَّ اللَّهَ كَانَ بِكُمْ رَحِيمًا﴾","﴿وَثِيَابَكَ فَطَهِّرْ﴾","﴿فَلَوْلَا نَفَرَ مِن كُلِّ فِرْقَةٍ مِّنْهُمْ طَائِفَةٌ لِّيَتَفَقَّهُوا فِي الدِّينِ﴾"],"answer":3,"why":"من أوجه فضل تعلم الفقه: «فريضة وضرورة للأمة»؛ قال تعالى: ﴿فَلَوْلَا نَفَرَ مِن كُلِّ فِرْقَةٍ مِّنْهُمْ طَائِفَةٌ لِّيَتَفَقَّهُوا فِي الدِّينِ...﴾ [التوبة: 122]. أما آية المجادلة فللاستدلال على رفعة الدرجات.","ref":"ص 4–5"},{"q":"بحسب حديث أبي موسى الأشعري رضي الله عنه، ما حال الأرض التي «أمسكت الماء» فنفع الله بها الناس؟","options":["كالإنسان الذي يحفظ العلم فيحيا قلبه ويعمل به ويعلّمه","كالإنسان الذي لا يتعلم ولا يستفيد ولا ينفع غيره","كالإنسان الحافظ الذي يأخذ العلم ويحفظه لكن ليس من شأنه التفقه والتبصر، فيأخذ الناس منه العلم وينقلونه","كالإنسان الذي يتعلم ولا يعمل ولا ينقل"],"answer":2,"why":"في شرح الحديث: الأرض الصلبة التي تمسك الماء فيشرب منه الناس ويسقوا ويزرعوا مثل الإنسان الحافظ للعلم لكن ليس من شأنه التفقه والتبصر، فهؤلاء كانوا أوعية للعلم فأخذ الناس منهم العلم ونقلوه.","ref":"ص 6"},{"q":"في حديث أبي سعيد الخدري رضي الله عنه عن الرجلين اللذين تيمّما ثم وجدا الماء في الوقت، ماذا قال النبي ﷺ للذي لم يُعد؟","options":["«لك الأجر مرتين»","«أصبتَ السنةَ، وأجزأتك صلاتُك»","«لا صلاة لك فأعدها»","«أخطأت السنة»"],"answer":1,"why":"قال النبي ﷺ للذي لم يُعد: «أصبتَ السنة، وأجزأتك صلاتُك»، وقال للذي توضأ وأعاد: «لك الأجر مرتين» (أخرجه أبو داود).","ref":"ص 7"},{"q":"ما الذي ينبغي أن تحذره المتعلمة ذاتيًّا بحسب الدرس عند التخطيط المنهجي للتعلم؟","options":["ألا تعتمد على الكتب وحدها ولا على قصاصات وسائل التواصل مجهولة المصدر وغير الموثوقة","أن تتعلم من أحد العلماء الموثوقين","أن تعرض ما تعلمته على أحد أهل العلم","أن تلخص مسائل الكتاب كل أسبوع"],"answer":0,"why":"فلا يُعتمد على الكتب وحدها؛ لئلا تُفهم على غير وجهها، ولا يُعتمد على قصاصات وسائل التواصل مجهولة المصدر وغير الموثوقة؛ فلا نبني عليها عملًا ولا ننقل ما لا نفهمه فنقع في خطر القول على الله بغير علم.","ref":"ص 8"}],"2":[{"q":"ما تعريف الطهارة في الاصطلاح الشرعي بحسب أشهر تعريفات العلماء الواردة في الدرس؟","options":["الوضوء والغسل فقط","النظافة الحسية من الأوساخ فقط","رفع حدث أو إزالة نجس أو ما في معناهما وعلى صورتهما","إزالة النجاسة بالماء فقط"],"answer":2,"why":"عرّف العلماء الطهارة شرعًا بعدة تعريفات، من أشهرها أنها: «رفع حدث أو إزالة نجس أو ما في معناهما وعلى صورتهما» (المجموع).","ref":"ص 3"},{"q":"ما الحدث بحسب الدرس، وما نوعاه؟","options":["نجاسة عينية يقوم بها الثوب","معنى يقوم بالبدن تُمنع معه الصلاة والطواف ونحوهما، وهو أصغر كالبول والغائط والريح، وأكبر كالجنابة والحيض والنفاس","نجاسة حكمية تزول بالماء فقط","ماء نجس لا يجوز استعماله"],"answer":1,"why":"الحدث ليس نجاسة بل معنى يقوم بالبدن تمنع معه الصلاة والطواف ونحوهما، وهو نوعان: حدث أصغر كالبول والغائط والريح، وحدث أكبر كالجنابة والحيض والنفاس.","ref":"ص 4"},{"q":"ما النجاسة العينية بحسب الدرس؟","options":["التي عينها نجسة ولا يمكن تطهيرها أبدًا","التي يتيقن وجودها ولا تُحَسّ","التي تزول بإجراء الماء عليها مرة واحدة","التي يقوم أثرها بالبدن ويمنع الصلاة"],"answer":0,"why":"النجاسة العينية هي التي عينها نجسة، ولا يمكن تطهيرها أبدًا. أما النجاسة الحكمية فهي التي يتيقَّن وجودها ولا تُحَسّ كالبول إذا جفّ على المحل ولم يوجد له رائحة ولا أثر.","ref":"ص 4"},{"q":"لماذا يبدأ الفقهاء كتب الفقه بالطهارة بحسب الدرس؟","options":["لأنها أسهل أبواب الفقه","لأنها آخر ما ذُكر في حديث «بني الإسلام على خمس»","لأن المصالح الدنيوية مقدمة على الأمور الدينية","لأنها مفتاح الصلاة التي هي عماد الدين"],"answer":3,"why":"قال الدميري: بدأ الشافعي وغيره بهذا الكتاب من العبادات اهتمامًا بالأمور الدينية، وتقديمًا لها على المصالح الدنيوية، فرتبوه على الترتيب المتين، وقدموا الطهارة؛ لأنها مفتاح الصلاة التي هي عماد الدين (النجم الوهاج).","ref":"ص 4"},{"q":"ما أقسام المياه الثلاثة بحسب الفقهاء في الدرس؟","options":["الماء الطهور، والماء الجاري، والماء الراكد","الماء المطلق، والماء الطاهر، والماء المستعمل","الماء الطهور، والماء الطاهر، والماء النجس","الماء النجس، والماء المتغير، والماء المطلق"],"answer":2,"why":"قسّم الفقهاء المياه التي يُتطهر بها أو لا يُتطهر بها إلى ثلاثة أقسام: الماء الطهور، والماء الطاهر، والماء النجس.","ref":"ص 4–5"},{"q":"ما الماء الطهور؟","options":["الماء الذي تغير لونه أو طعمه أو ريحه بغير نجاسة","الطاهر في نفسه المطهِّر لغيره، وهو كل ماء نزل من السماء أو نبع من الأرض ما دام باقيًا على أصل الخِلْقة","الماء الذي وقعت فيه نجاسة وكان راكدًا","ماء النبات والماء المستعمل القليل"],"answer":1,"why":"الماء الطهور هو الطاهر في نفسه المطهِّر لغيره، وهو كل ماء نزل من السماء أو نبع من الأرض ما دام باقيًا على أصل الخِلْقة، فلم يتغير أحد أوصافه الثلاثة وهي: اللون، والطعم، والرائحة.","ref":"ص 5"},{"q":"ما حكم استعمال الماء الطاهر بحسب الدرس؟","options":["يصح استعماله في العادات من شرب وطبخ ونحو ذلك، ولا يصح في العبادات من وضوء وغسل ولا في إزالة النجس","يصح استعماله في الوضوء والغسل وإزالة النجس","لا يجوز استعماله مطلقًا","يصح استعماله في كل شيء ما عدا الشرب"],"answer":0,"why":"الماء الطاهر طاهر في نفسه غير مطهِّر لغيره، فيصحّ استعماله في العادات من شرب وطبخ ونحو ذلك، ولا يصح استعماله في العبادات من وضوء وغسل (رفع حدث) ولا إزالة نجس.","ref":"ص 5"},{"q":"ما الحكم في آنية الذهب والفضة بحسب الدرس؟","options":["يجوز استعمالها لأن الأصل في الأواني الإباحة بلا استثناء","يجوز استعمالها في الأكل دون الشرب","يجوز استعمالها للنساء فقط","يحرم استعمالها؛ لقول النبي ﷺ: «لا تشربوا في آنية الذهب والفضة ولا تأكلوا في صحافها»"],"answer":3,"why":"الأصل في الأواني الإباحة، واستُثني من ذلك آنية الذهب والفضة فحرم استعمالها؛ لقول النبي ﷺ: «لا تشربوا في آنية الذهب والفضة ولا تأكلوا في صحافها، فإنها لهم في الدنيا ولكم في الآخرة».","ref":"ص 5"},{"q":"أي جلود الميتة لا تطهر بالدباغ بحسب الدرس؟","options":["جلد الشاة","جلد الميتة كلها","جلد الكلب والخنزير","جلد الإبل"],"answer":2,"why":"يطهر جلد الميتة بالدباغ إلا جلد الكلب والخنزير لنجاسة عينه؛ لقوله ﷺ: «أيّما إهابٍ دُبغ فقد طَهُر».","ref":"ص 6"},{"q":"ما الذي يشترط للاستجمار بحسب الدرس؟","options":["مسح بأي شيء ولو بعظم أو روث","مسح بطاهر مباح مُنْقٍ كالحجر والمناديل، ولا يجزئ أقل من ثلاث مسحات","يجزئ بمسحة واحدة","يجوز بشيء محترم كطعام الآدمي"],"answer":1,"why":"الاستجمار: مسحه بطاهرٍ مباحٍ مُنْقٍ كالحجر والمناديل، ولا يجزئ في الاستجمار أقل من ثلاث مسحات؛ لحديث سلمان رضي الله عنه: «نهانا أن نستنجي بأقل من ثلاثة أحجار، وأن نستنجي برجيع أو عظم».","ref":"ص 7"}],"3":[{"q":"ما تعريف الوضوء لغةً وشرعًا بحسب الدرس؟","options":["لغةً: الطهارة، وشرعًا: عبادة تبدأ بالتسمية","لغةً: العبادة، وشرعًا: الطهارة للصلاة","لغةً: الغسل، وشرعًا: غسل جميع البدن مع النية","لغةً: من الوضاءة وهي الحُسن والنظافة، وشرعًا: غسل أعضاء مخصوصة مفتتَحة بالنية"],"answer":3,"why":"الوضوء لغة: من الوضاءة، وهي «الحُسن والنَّظافة»، وشرعًا: «غسل أعضاء مخصوصة مفتتَحة بالنية».","ref":"ص 3"},{"q":"ما الذي جاء في فضل الوضوء من حديث عثمان بن عفان رضي الله عنه؟","options":["أنه سبب لزيادة الرزق","أنه يزيد في العمر","أن الوضوء مكفِّر للذنوب: «من توضأ هكذا غُفر له ما تقدّم من ذنبه»","أنه يغني عن الصلاة"],"answer":2,"why":"من فضائل الوضوء: أنه مكفِّر للذنوب؛ فعن عثمان رضي الله عنه أنه توضأ مثل وضوء النبي ﷺ ثم قال: «من توضأ هكذا غُفر له ما تقدّم من ذنبه».","ref":"ص 3"},{"q":"ماذا قال رسول الله ﷺ عن أمته يوم القيامة في ما يتعلق بالوضوء؟","options":["«إن أمتي يُدعَون يوم القيامة بأسمائهم فقط»","«إن أمتي يُدعَون يوم القيامة غُرًّا مُحَجَّلين من آثار الوضوء»","«إن أمتي يأتون يوم القيامة بيض الوجوه من آثار الصلاة»","«إن أمتي يُحشرون يوم القيامة مع الأنبياء بسبب الوضوء»"],"answer":1,"why":"الوضوء علامة أهل الإيمان يوم القيامة؛ فعن أبي هريرة رضي الله عنه: «إن أمتي يُدعَون يوم القيامة غُرًّا مُحَجَّلين من آثار الوضوء» (متفق عليه).","ref":"ص 4"},{"q":"كم عدد فروض الوضوء بحسب الدرس، وما هي؟","options":["ستة: النية، وغسل الوجه، وغسل اليدين إلى المرفقين، ومسح الرأس، وغسل الرجلين إلى الكعبين، والترتيب","ستة: التسمية، والسواك، وغسل الكفين، والمضمضة، والاستنشاق، والموالاة","أربعة: غسل الوجه، وغسل اليدين، ومسح الرأس، وغسل الرجلين","ثلاثة: النية، والتسمية، والترتيب"],"answer":0,"why":"فروض الوضوء ستة: النية، غسل الوجه، غسل اليدين إلى المرفقين، مسح الرأس، غسل الرجلين إلى الكعبين، الترتيب.","ref":"ص 5–6"},{"q":"ما حدّ الوجه في الوضوء طولًا وعرضًا بحسب الدرس؟","options":["طولًا: من الجبهة إلى الذقن، وعرضًا: إلى الخدين","طولًا: من منابت الشعر إلى الصدر، وعرضًا: إلى الكتفين","طولًا: من الأنف إلى الذقن، وعرضًا: إلى العينين","طولًا: من منابت شعر الرأس المعتاد إلى الذقن، وعرضًا: إلى فروع الأذنين"],"answer":3,"why":"غسل الوجه: ومنه المضمضة والاستنشاق، وحدُّه طولًا: من منابتِ شعرِ الرأسِ المعتادِ إلى الذَّقن، وحدُّه عرضًا: إلى فروعِ الأُذُنَين.","ref":"ص 5"},{"q":"ماذا قال النبي ﷺ للرجل الذي توضأ وترك موضع ظفر على قدمه لم يصبه الماء؟","options":["«يجزئك وضوؤك»","«أعد الصلاة فقط»","«ارجع فأحسن وضوءك»","«امسح عليه بيدك»"],"answer":2,"why":"لو كان تحت أظافره وسخ يمنع وصول الماء أو خاتم لم يصح الوضوء؛ لحديث النبي ﷺ للرجل الذي توضأ وترك موضع ظفر على قدمه؛ فأبصره النبي ﷺ فقال: «ارجع فأحسن وضوءك» (أخرجه مسلم).","ref":"ص 5"},{"q":"ما وجه الدلالة من آية الوضوء (المائدة: 6) على وجوب الترتيب بحسب الدرس؟","options":["أن الآية بدأت بغسل الرجلين","أن الممسوح -وهو مسح الرأس- ذُكر بين مغسولَين، وهما غسل اليدين والرجلين","أن الآية ذكرت المسح ثم الغسل ثم النية","أن الآية لم تذكر الوجه"],"answer":1,"why":"وجه الدلالة: أن الممسوح -وهو مسح الرأس- ذُكر بين مغسولَين -وهما غسل اليدين والرجلين-. ومن السنة: مواظبته ﷺ على ترتيب الوضوء كما جاء في الآية، وكل من حكى وضوءه ﷺ حكاه مرتبًا.","ref":"ص 6"},{"q":"أي مما يلي من نواقض الوضوء بحسب الدرس؟","options":["كل ما خرج من السبيلين، والنوم على غير هيئة المتمكّن، وزوال العقل، ومسّ القُبل، ومسّ الرجل زوجته أو امرأة أجنبية والعكس","أكل لحم الإبل فقط وكثرة الكلام","الضحك في الصلاة وتأخير الصلاة عن وقتها","نزع الخف وحلق الشعر وتقليم الأظافر"],"answer":0,"why":"النواقض: كل ما خرج من السبيلين، النوم على غير هيئة المتمكن، زوال العقل بجنون أو إغماء أو سُكر، مسُّ القُبُل، مسُّ الرجل زوجته أو امرأة أجنبية والعكس.","ref":"ص 9"},{"q":"ما المسألة التي تخص المرأة في باب نواقض الوضوء بحسب الدرس؟","options":["يجوز لها الوضوء مع طلاء الأظافر","يكفي المسح على طلاء الأظافر","لا يجب إزالته إلا عند الغسل","إذا ادّهنت المرأة بدهان يمنع وصول الماء إلى العضو -مثل طلاء الأظافر- فلا بدّ من إزالته"],"answer":3,"why":"مسألة تخص المرأة: إذا ادّهنت بدهان يمنع وصول الماء إلى العضو -مثل طلاء الأظافر- فلا بدّ من إزالته؛ لأنه يمنع وصول الماء إلى الأظافر.","ref":"ص 9"},{"q":"ما الذي ورد عن أنس رضي الله عنه في مقدار الماء الذي كان يستعمله النبي ﷺ؟","options":["كان يتوضأ بالصاع ويغتسل بعشرة أصواع","كان يتوضأ بخمسة أمداد ويغتسل بمدّ","كان النبي ﷺ يغتسل بالصاع إلى خمسة أمداد، ويتوضأ بالمُدّ","لم يكن يحدد مقدارًا من الماء"],"answer":2,"why":"من سنن الوضوء: الاقتصاد في استعمال الماء؛ فعن أنس بن مالك: «كان النبي ﷺ يغتسل بالصاع إلى خمسة أمداد، ويتوضأ بالمُدّ» (أخرجه البخاري).","ref":"ص 7"}],"4":[{"q":"ما الغسل لغةً وشرعًا بحسب الدرس؟","options":["لغةً: تطهير الشيء وتنقيته، وشرعًا: سيلان الماء على جميع البدن مع النية","لغةً: غسل الأعضاء المخصوصة، وشرعًا: رفع الحدث الأصغر","لغةً: الاستنجاء، وشرعًا: إزالة النجاسة","لغةً: الوضوء، وشرعًا: مسح الرأس"],"answer":0,"why":"قال ابن فارس: «الغين والسين واللام أصلٌ صحيح يدلُّ على تطهيرِ الشيء وتنقيَتِه»، وشرعًا: «سيلانُ الماء على جميع البدن مع النية» (مغني المحتاج).","ref":"ص 2"},{"q":"على ماذا يدور حكم الغسل بحسب الدرس؟","options":["هو واجب دائمًا","هو مستحب دائمًا","هو مباح دائمًا","يدور بين الوجوب والاستحباب حسب الداعي إليه"],"answer":3,"why":"ويدور حكم الغسل بين الوجوب والاستحباب حسب الداعي إليه.","ref":"ص 3"},{"q":"ما حكم نزول المني بحسب الدرس عند الشافعية وعند الجمهور؟","options":["يوجب الغسل مطلقًا عند الجمهور، خلافًا للشافعية","لا يوجب الغسل عند الشافعية","يوجب الغسل مطلقًا عند الشافعية، خلافًا للجمهور الذين اشترطوا نزوله دفقًا بلذّة","يوجب الغسل عند الجمهور ولو بلا لذّة"],"answer":2,"why":"ونزول المني مطلقًا يوجب الغسل عند الشافعية، خلافًا للجمهور؛ حيث اشترطوا نزوله دفقًا بلذّة.","ref":"ص 3"},{"q":"ما الذي يحرم على الجُنُب بحسب الدرس؟","options":["الأكل والشرب فقط","ما يحرم على المحدث، وشيئان: قراءة القرآن واللبث في المسجد","الكلام والنوم","دخول البيوت ولقاء الناس"],"answer":1,"why":"قال النووي: «يحرُم على الجنب ما يحرم على المحدث، وشيئان: قراءة القرآن، واللبث في المسجد»، ولا ترتفع الجنابة إلا بالغسل.","ref":"ص 3"},{"q":"ما الذي ورد في غسل الميت من حديث ابن عباس رضي الله عنهما، وما حكم الشهيد؟","options":["«اغسلوه بماء وسدر»، وأما الشهيد فلا يُغسَّل","«اغسلوه بالماء فقط»، والشهيد يُغسَّل كغيره","«اغسلوه بماء وكافور»، والشهيد يُصلى عليه ويغسل","«لا تغسلوه»، والشهيد يُغسَّل"],"answer":0,"why":"في حديث الرجل الذي وقصته ناقته وهو محرم قال النبي ﷺ: «اغسلوه بماء وسدر»، وأما الشهيد فلا يغسل؛ ففي حديث جابر رضي الله عنه في قتلى أحد: «أنه ﷺ أمر بدفنهم بدمائهم، ولم يصلِّ عليهم، ولم يغسلهم».","ref":"ص 4"},{"q":"ماذا قال النبي ﷺ لفاطمة بنت أبي حُبيش في شأن الحيض؟","options":["«اتركي الصلاة طوال الشهر»","«لا يجب عليك الغسل بعد انقطاع الدم»","«صلّي في جميع الأحوال ولا تغتسلي»","«إنما ذلك عِرق وليس بالحيضة، فإذا أقبلت الحيضة فاتركي الصلاة، وإذا ذهب قدرها فاغسلي عنك الدم وصلّي»"],"answer":3,"why":"عن عائشة: قالت فاطمة بنت أبي حُبيش: يا رسول الله، إني لا أطهر، أفأدع الصلاة؟ فقال: «إنما ذلك عرق وليس بالحيضة، فإذا أقبلت الحيضة فاتركي الصلاة، وإذا ذهب قدرها فاغسلي عنك الدم وصلّي» (أخرجه البخاري).","ref":"ص 4"},{"q":"بماذا يُلحق النفاس في الأحكام، بحسب ما نقله الدرس عن الشوكاني؟","options":["النفاس لا يشبه الحيض في الأحكام","النفاس كالجنابة فقط","وقع الإجماع على أن النفاس كالحيض في جميع ما يحل ويحرم ويكره ويندب","النفاس لا يوجب الغسل"],"answer":2,"why":"النفاس: وهو الدم الخارج عقب الولادة، قال الشوكاني: «وقع الإجماع من العلماء أن النفاس كالحيض في جميع ما يحل ويحرم ويكره ويندب».","ref":"ص 4"},{"q":"ما الفرق بين غسل الجمعة وغسل العيدين بحسب الدرس؟","options":["غسل الجمعة سنة لكل أحد وغسل العيدين لمن حضرهما فقط","غسل العيدين سنة لكل أحد لأنه للزينة، أما غسل الجمعة فلقطع الرائحة فلا يُسَنّ إلا لحاضرها","كلاهما واجب","كلاهما للزينة"],"answer":1,"why":"غسل العيدين هو سنة لكل أحد؛ لأنه للزينة، بخلاف غسل الجمعة فإنه لقطع الرائحة فلا يُسَنُّ إلا لحاضرها.","ref":"ص 4"},{"q":"ما أركان الغسل بحسب الدرس؟","options":["ثلاثة: النية، وإزالة النجاسة إن كانت على بدنه، وإيصال الماء إلى جميع الشعر والبشرة","أربعة: النية، والتسمية، والدلك، والموالاة","ثلاثة: التسمية، والوضوء قبله، والدلك","اثنان: النية والتسمية"],"answer":0,"why":"أركان الغسل ثلاثة: النية، وإزالة النجاسة إن كانت على بدنه، وإيصال الماء إلى جميع الشعر والبشرة.","ref":"ص 7"},{"q":"أي مما يلي من سنن الغسل بحسب الدرس؟","options":["النية، وإزالة النجاسة، وإيصال الماء إلى الشعر والبشرة","نقض الشعر المضفور دائمًا","الاغتسال في كل مرة بثلاثة أصواع","التسمية، والوضوء قبله، وإمرار اليد على الجسد (الدلك)، والموالاة، وتقديم اليمنى على اليسرى"],"answer":3,"why":"سنن الغسل خمس: التسمية، والوضوء قبله، وإمرار اليد على الجسد وهو الدلك، والموالاة وهي التتابع في غسل الأعضاء، وتقديم اليمنى على اليسرى.","ref":"ص 7–8"},{"q":"ماذا أجاب النبي ﷺ أم سلمة حين سألته عن ضفر رأسها في غسل الجنابة؟","options":["«نعم، يجب نقض الضفائر دائمًا»","«يجب أن تبلّي الشعر كله بالنقض»","«لا، إنما يكفيك أن تحثي على رأسك ثلاث حثيات، ثم تفيضين عليك الماء فتطهرين»","«يكفيك أن تمسحي على الضفائر مرة واحدة»"],"answer":2,"why":"عن أم سلمة: قلت يا رسول الله إني امرأة أشد ضفر رأسي، فأنقضه لغسل الجنابة؟ قال: «لا، إنما يكفيك أن تحثي على رأسك ثلاث حثيات، ثم تفيضين عليك الماء فتطهرين» (أخرجه مسلم).","ref":"ص 7"}],"5":[{"q":"ما التيمم لغةً وشرعًا بحسب الدرس؟","options":["لغةً: الغسل، وشرعًا: إيصال الماء إلى جميع البدن","لغةً: القصد، وشرعًا: إيصال التراب إلى الوجه واليدين بشرائط مخصوصة","لغةً: المسح، وشرعًا: إمرار اليد المبتلة على الخف","لغةً: الطهارة، وشرعًا: غسل أعضاء الوضوء"],"answer":1,"why":"التيمم لغة: هو القصد، تقول: يمّمتُ فلانًا إذا قصدتَه. وشرعًا: إيصالُ الترابِ إلى الوجه واليدين بشرائطَ مخصوصةٍ.","ref":"ص 3"},{"q":"أي مما يلي من أسباب تعذّر استعمال الماء المبيحة للتيمم بحسب الدرس؟","options":["فَقْده، والتضرر باستعماله كالمريض أو الذي في بدنه جروح، وضرر رفيقه أو حرمته","وجود الماء البعيد في وقت الصلاة مع القدرة عليه","الرغبة في توفير الماء دون ضرر","الكسل عن الوضوء مع وجود الماء"],"answer":0,"why":"من شروط التيمم: تعذّر استعمال الماء لأسباب، منها: فقده (لا يجد الماء في بيته أو حوله أو قريبًا منه أو لا يقدر على ثمنه)، والتضرر باستعماله كالمريض أو الذي في بدنه جروح، وضرر رفيقه أو حرمته.","ref":"ص 3–4"},{"q":"كم ضربة في التيمم بحسب الدرس، وما هي؟","options":["ضربة واحدة للوجه واليدين معًا","ثلاث ضربات: للوجه وللكفين وللذراعين","أربع ضربات: لكل عضو ضربة","ضربتان: ضربة للوجه وضربة لليدين"],"answer":3,"why":"فروض التيمم: النقل، نية الاستباحة، ضربتان (ضربة للوجه وضربة لليدين)، مسح الوجه، مسح اليدين إلى المرفقين، الترتيب بين المسحين؛ لحديث ابن عمر: «التيمم ضربتان، ضربة للوجه، وضربة لليدين إلى المرفقين» (أخرجه الدارقطني).","ref":"ص 5"},{"q":"كم فرضًا يُصلَّى بتيمم واحد بحسب الدرس؟","options":["فرضان فأكثر ما دام لم يحدث","جميع الفرائض ما لم يجد الماء","فرض واحد فقط، مع ما شاء من السنن، وكذلك صلاة الجنازة","لا يصلى بالتيمم أي فرض"],"answer":2,"why":"ولا يصلّي بالتيمم إلا فرضًا واحدًا، ويصلي ما شاء من السنن، وكذلك صلاة الجنازة، فإذا أراد أن يصلي فرضًا آخر تيمم، وإن لم يحدث بعد تيممه.","ref":"ص 6"},{"q":"أي مما يلي من مبطلات التيمم بحسب الدرس؟","options":["وجود الماء بعد فقده، أما كل ما يبطل الوضوء فلا يبطله","كل ما يبطل الوضوء، ووجود الماء بعد فقده، وزوال العذر الذي تيمم من أجله، والردة","الشروع في الصلاة فقط","تقليم الأظافر وقص الشارب"],"answer":1,"why":"يبطل التيمم وينقضه: كل ما يبطل الوضوء، ووجود الماء بعد فقده، وزوال العذر الذي تيمم من أجله، والردة (والعياذ بالله).","ref":"ص 6"},{"q":"ما الفرق بين المسح والغسل بحسب الدرس؟","options":["الغسل بإسالة الماء على العضو وغمره به، أما المسح فإمرار اليد المبللة بالماء على العضو أو ما يقوم مقامه؛ ولذلك كان المسح رخصةً وتيسيرًا","المسح يكون بإسالة الماء على العضو، والغسل بإمرار اليد المبللة","لا فرق بينهما","المسح هو الأصل، والغسل رخصة"],"answer":0,"why":"يظهر الفرق بين المسح والغسل في أن الغسل يكون بإسالة الماء على العضو وغمره به، أما المسح فهو إمرار اليد المبللة بالماء على العضو أو ما يقوم مقامه. ومن هنا كان المسح رخصةً وتيسيرًا، بخلاف الغسل الذي هو الأصل.","ref":"ص 7"},{"q":"ما شروط المسح على الخفين بحسب الدرس؟","options":["أن يلبسهما على غير وضوء، وأن يكونا متنجسين","أن يكونا رقيقين لا يمكن المشي فيهما","ألا يلتزم بمدة محددة","أن يلبسهما على وضوء كامل، وأن يكونا طاهرين، ساترين لمحل الفرض من القدمين، قويين يمكن متابعة المشي فيهما، وأن يلتزم بالمدة المحددة"],"answer":3,"why":"شروط المسح على الخفين: أن يلبسهما على وضوء كامل (لحديث المغيرة: «دعهما فإني أدخلتهما طاهرتين»)، وأن يكونا طاهرين، وساترين لمحل الفرض من القدمين، وقويين يمكن متابعة المشي فيهما، وأن يلتزم بالمدة المحددة للمسح.","ref":"ص 8–9"},{"q":"ما مدة المسح على الخفين للمقيم وللمسافر، ومتى تبدأ؟","options":["ثلاثة أيام للمقيم ويوم وليلة للمسافر","يومان للمقيم وأسبوع للمسافر","يومًا وليلة للمقيم، وثلاثة أيام بلياليهن للمسافر، وتبدأ من أول حدث بعد لبس الخفين على طهارة لا من وقت اللبس","لا حد لها للمقيم ولا للمسافر"],"answer":2,"why":"عن علي رضي الله عنه: «جعل رسول الله ﷺ ثلاثة أيام وليالِيَهنّ للمسافر، ويومًا وليلة للمقيم»، والمدة تبدأ من أول حدث بعد لبس الخفين على طهارة، لا من وقت اللبس.","ref":"ص 9"},{"q":"أي مما يلي من مبطلات المسح على الخفين بحسب الدرس؟","options":["انتهاء وقت الصلاة","خلع الخفين أو أحدهما، وانقضاء المدة، وما يوجب الغسل","الأكل والشرب","المشي مسافة طويلة"],"answer":1,"why":"مبطلات المسح: خلع الجوربين (إذا خلع خفّيه أو أحدهما)، انقضاء المدة (إذا مضى يوم وليلة للمقيم أو ثلاثة أيام للمسافر بطل مسحه)، وما يوجب الغسل؛ لحديث صفوان بن عسّال.","ref":"ص 10"},{"q":"ما الذي يلزم من احتاج إلى وضع رباط على الجرح عند الوضوء بحسب الدرس؟","options":["غسل الجزء السليم من العضو المصاب، والمسح على الرباط كله، والتيمم بدل غسل الجزء المريض","غسل الجرح نفسه بالماء دائمًا","ترك الوضوء كليًّا","المسح على الرباط دون غسل الجزء السليم"],"answer":0,"why":"إذا احتاج إلى وضع رباط لزمه ثلاثة أمور: أن يغسل الجزء السليم من العضو المصاب، وأن يمسح على نفس الرباط (الجبيرة أو العصابة) كلها، وأن يتيمم بدل غسل الجزء المريض عند وصوله إليه بالوضوء.","ref":"ص 11"}],"6":[{"q":"ما أقل سنّ يمكن أن تحيض فيها المرأة بحسب الدرس؟","options":["سبع سنوات قمرية","ثلاث عشرة سنة قمرية","تسع سنوات قمرية","خمس عشرة سنة قمرية"],"answer":2,"why":"أقلُّ زمنٍ يمكن أن تحيض فيه المرأة: تسع سنوات قمرية، فلو رأت الدم قبل ذلك فهو دم فساد لا تترتب عليه أحكام الحيض.","ref":"ص 3"},{"q":"ما أقل الحيض وأكثره وأقل الطُّهر بين حيضتين بحسب الدرس؟","options":["أقل الحيض ثلاثة أيام وأكثره عشرة أيام","أقل الحيض يوم وليلة، وأكثره خمسة عشر يومًا، وأقل الطهر بين حيضتين خمسة عشر يومًا","أقله يومان وأكثره سبعة أيام","أقل الحيض خمسة عشر يومًا وأكثره ثلاثون يومًا"],"answer":1,"why":"قال النووي: «وأقل الحيض يوم وليلة على المذهب... وأكثره خمسة عشر يومًا، وغالبه ست أو سبع، وأقل الطهر بين حيضتين خمسة عشر يومًا، وغالبه تمام الشهر بعد الحيض».","ref":"ص 3"},{"q":"متى يُعتبر الدم الذي تراه المرأة دم استحاضة بحسب الدرس؟","options":["إذا رأته أقل من يوم وليلة، أو أكثر من خمسة عشر يومًا، أو في زمن الطهر","إذا كان أسود ثخينًا منتن الرائحة","إذا نزل في يوم وليلة فقط","إذا نزل في أول الشهر"],"answer":0,"why":"بناءً على الضوابط: فكلُّ دمٍ تراه المرأة أقل من يوم وليلة، أو أكثر من خمسة عشر يومًا، أو في زمن الطهر، فهو دم استحاضة.","ref":"ص 3"},{"q":"ما أثر الحيض على الطلاق بحسب الدرس؟","options":["الطلاق في الحيض هو الطلاق السني","لا أثر للحيض على الطلاق","الطلاق في الحيض واجب","يمنع الطلاق حال وقوعه، والطلاق في زمن الحيض مخالف للشرع؛ لأنه يضر بالمرأة في حساب عدتها"],"answer":3,"why":"قال النووي: ومن أحكام الحيض: أنه يوجب البلوغ، وتتعلق به العدة والاستبراء، ويكون الطلاق فيه بدعيًّا. والطلاق في زمن الحيض مخالف للشرع؛ لأنه يضر بالمرأة في حساب عدتها، قال تعالى: ﴿فَطَلِّقُوهُنَّ لِعِدَّتِهِنَّ﴾.","ref":"ص 4"},{"q":"ما النفاس شرعًا بحسب الدرس؟","options":["الدم الخارج قبل الولادة بأيام","دم العلة الذي يخرج من عرق في أدنى الرحم","الدم الخارج عقب الولادة، وقبل مضي خمسة عشر يومًا","الدم الذي يكون في أيام الطهر"],"answer":2,"why":"النفاس لغة: ولادة المرأة إذا وضعت، وشرعًا: هو الدم الخارج عقب الولادة، وقبل مضي خمسة عشر يومًا، فإن لم يبدأ نزول الدم إلا بعد مضي خمسة عشر يومًا من الولادة فهو حيضٌ لا نفاس.","ref":"ص 4"},{"q":"ما أكثر مدة النفاس وغالبها وأقلها بحسب الدرس؟","options":["أكثره عشرون يومًا وغالبه عشرة وأقله يوم","أكثره ستون يومًا على المشهور، وغالبه أربعون، ولا حدّ لأقله","أكثره أربعون يومًا ولا غالب له","أكثره خمسة عشر يومًا وأقله يوم"],"answer":1,"why":"مدة النفاس: «أكثره ستون يومًا على المشهور، وغالبه: أربعون، ولا حدّ لأقلّه» (روضة الطالبين).","ref":"ص 5"},{"q":"بماذا تُعرف المرأة طهرَها من الحيض أو النفاس بحسب الدرس؟","options":["بأحد أمرين: القصة البيضاء، أو الجفاف التام","بانقطاع الألم فقط","بمرور سبعة أيام بالضبط","باختلاف رائحة الدم فقط"],"answer":0,"why":"تَعرف المرأة طهرها من الحيض أو النفاس بأحد أمرين: القَصَّة البيضاء (ماء أبيض يخرج بعد انقطاع الدم)، والجفاف التام (أن تحتشي بقطنة فتخرج نقية لا أثر فيها للدم).","ref":"ص 5"},{"q":"ما الاستحاضة بحسب الدرس، وما حكم صلاة المستحاضة وصومها؟","options":["دم طبيعي يمنع الصلاة والصوم","دم يوجب الغسل وترك الصلاة","دم النفاس بعد الأربعين","دم علة ومرض يخرج من عرق من أدنى الرحم، ولا يوجب ترك الصلاة ولا الصوم؛ فتغسل الدم وتربط على موضعه وتتوضأ لكل فرض وتصلي"],"answer":3,"why":"الاستحاضة: دم علة ومرض يخرج من عرق من أدنى الرحم يقال له العاذل، وهذا الدم ينقض الوضوء، ولا يوجب الغسل، ولا يوجب ترك الصلاة ولا الصوم؛ فالمستحاضة تغسل الدم، وتربط على موضعه، وتتوضأ لكل فرض، وتصلي.","ref":"ص 6"},{"q":"ما الفرق بين دم الحيض ودم الاستحاضة بحسب الدرس؟","options":["دم الحيض أحمر رقيق، ودم الاستحاضة أسود ثخين","لا فرق بينهما في اللون والرائحة","دم الحيض أسود ثخين منتن الرائحة، ودم الاستحاضة أحمر رقيق لا رائحة له","دم الحيض لا رائحة له، ودم الاستحاضة منتن"],"answer":2,"why":"الفرق بين دم الحيض وهو أسود ثخين منتن الرائحة، ودم الاستحاضة: أحمر رقيق لا رائحة له؛ وقال ﷺ لفاطمة بنت أبي حبيش: «إذا كان دم الحيض فإنه دم أسود يُعرف، فأمسكي عن الصلاة، وإذا كان الآخر فتوضئي فإنما هو عِرق».","ref":"ص 6–7"},{"q":"ما حكم استعمال المرأة أدوية لمنع الحيض في الحج لإتمام النسك بحسب الدرس؟","options":["لا يجوز بحال","يجوز إذا قرّر أهل الخبرة الأمناء أنه لا يضرها ولا يؤثر في جهاز حملها","يجوز ولو كان فيه ضرر عليها","يجوز لها الطواف بعد نزول الدم مباشرة"],"answer":1,"why":"من المسائل المعاصرة: فيجوز أن تستعمل أدوية لمنع الدورة قبل نزولها لإتمام النسك إذا قرّر الأطباء الأمناء أن ذلك لا يضرها، ولا يؤثر في جهاز حملها.","ref":"ص 7"}],"7":[{"q":"ما الصلاة لغةً وشرعًا بحسب الدرس؟","options":["لغةً: الركوع والسجود، وشرعًا: أفعال تبدأ بالتسمية","لغةً: التسبيح والتحميد، وشرعًا: الذكر بعد الفرائض","لغةً: القيام، وشرعًا: الوقوف بين يدي الله فقط","لغةً: الدعاء، وشرعًا: أفعال وأقوال مفتتحة بالتكبير مختتمة بالتسليم بشرائط مخصوصة"],"answer":3,"why":"الصلاة في اللغة: الدعاء، قال تعالى: ﴿وَصَلِّ عَلَيْهِمْ إِنَّ صَلَاتَكَ سَكَنٌ لَّهُمْ﴾. وفي الشرع: أفعالٌ وأقوالٌ مُفتَتَحة بالتكبير مُختتمة بالتسليم بشرائط مخصوصة، سُمّيت بذلك؛ لاشتمالها على الدعاء.","ref":"ص 2"},{"q":"ما أول ما يُسأل عنه العبد يوم القيامة بحسب حديث أنس رضي الله عنه الوارد في الدرس؟","options":["الزكاة","الصيام","الصلاة؛ فإن صلحت صلح سائر عمله، وإن فسدت فسد سائر عمله","الحج"],"answer":2,"why":"عن أنس رضي الله عنه أن النبي ﷺ قال: «أوّل ما يُحاسَب به العبد يوم القيامة الصلاة؛ فإن صلحت صلح له سائر عمله، وإن فسدت فسد سائر عمله» (أخرجه الطبراني في الأوسط).","ref":"ص 3"},{"q":"ماذا شبّه النبي ﷺ الصلوات الخمس في حديث أبي هريرة رضي الله عنه الوارد في الدرس؟","options":["بسراج يضيء للمصلي في قبره","بنهر على باب أحدكم يغتسل منه كل يوم خمس مرات فلا يبقى من درنه شيء، يمحو الله بهن الخطايا","بجبل يحمي صاحبه من الفتن","بسفينة تنجّي أهلها"],"answer":1,"why":"قال النبي ﷺ: «أرأيتم لو أن نهرًا بباب أحدكم يغتسل منه كل يوم خمس مرات، هل يبقى من درنه شيء؟» قالوا: لا يبقى من درنه شيء، قال: «فذلك مثل الصلوات الخمس، يمحو الله بهن الخطايا» (متفق عليه).","ref":"ص 3"},{"q":"متى فُرضت الصلوات الخمس المكتوبة بحسب الدرس؟","options":["ليلة الإسراء والمعراج","في السنة الأولى للبعثة","في السنة الأولى للهجرة","يوم فتح مكة"],"answer":0,"why":"الصلوات المفروضة خمس: الصبح والظهر والعصر والمغرب والعشاء، شُرعت ليلة الإسراء والمعراج، وفي حديثها الطويل: «فراجعتُه فقال: هي خمس، وهي خمسون، لا يُبدَّل القول لديَّ».","ref":"ص 4"},{"q":"أي مما يلي من شروط وجوب الصلاة بحسب الدرس؟","options":["الطهارة، ومعرفة الوقت، وستر العورة، واستقبال القبلة","النية والتكبير والتسليم","القيام والركوع والسجود","الإسلام، والبلوغ، والعقل، وبلوغ الدعوة، والنقاء من الحيض والنفاس"],"answer":3,"why":"شروط الوجوب: الإسلام، البلوغ، العقل، بلوغ الدعوة، النقاء من الحيض والنفاس. أما الطهارة ومعرفة الوقت وستر العورة واستقبال القبلة فهي شروط صحة.","ref":"ص 5"},{"q":"ما شروط صحة الصلاة بحسب الدرس؟","options":["الإسلام والبلوغ والعقل وبلوغ الدعوة","النية والقيام والتكبير والفاتحة","الطهارة، ومعرفة الوقت، وستر العورة، واستقبال القبلة","التسمية والسواك والدلك والموالاة"],"answer":2,"why":"شروط الصحة: الطهارة (من النجاسات في البدن والثياب والمكان، ومن الحدث الأصغر بالوضوء ومن الأكبر بالغسل أو التيمم)، ومعرفة الوقت، وستر العورة، واستقبال القبلة.","ref":"ص 5–7"},{"q":"ما الذي يُسَنّ للمرأة أن تصلي فيه بحسب الدرس؟","options":["في ثوب واحد يستر العورة فقط","في ثلاثة أثواب: خمار تغطي به الرأس والعنق، ودرع يغطي البدن والرجلين، وملحفة صفيقة تستر الثياب","في ثوبين شفافين",
