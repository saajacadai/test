ي تتحدث عن امرأة.","ref":"ص 2"},{"q":"كم يُمثّل فقه الأحوال الشخصية (الأحكام الأسرية) من الفقه الإسلامي بحسب الدرس؟","options":["خُمس الفقه الإسلامي، إضافة إلى فقه العبادات والمعاملات والقضاء والسياسية الشرعية","نصفه","ثلثه","ربعه"],"answer":0,"why":"يُشكِّل فقهُ الأحوال الشخصية خُمسَ الفقه الإسلامي إضافة إلى فقه العبادات، والمعاملات، والقضاء، والسياسية الشرعية، مما يدلُّ على عناية الإسلام البالغة بالأسرة.","ref":"ص 3"},{"q":"كيف وصف الدرس ارتفاع نسب الطلاق والعنوسة وتشرد الأطفال في بلاد المسلمين؟","options":["أنه محض صدفة لا علاقة لها بالمخططات","أنه نتيجة طبيعية للتدين","أنه ظاهرة محدودة لا تستحق الاهتمام","ليس محض صدفة بل هو نذير خطر؛ فأكثره نتيجة لمخططات عالمية لهدم الأسرة"],"answer":3,"why":"فما يحدُث في بلاد المسلمين من ارتفاع نِسَب الطلاق والعُنوسة وتشرُّد الأطفال ليس محضَ صُدفةٍ بل هو نذير خطَر؛ فأكثره نتيجةٌ لمخطَّطاتٍ عالميةٍ لهدم الأُسرة.","ref":"ص 3"},{"q":"ماذا يدل كثرة إنجاب الأولاد وتقليل الإنجاب بحسب فائدة الدرس؟","options":["كثرة الإنجاب دليل على الجهل","تقليل الإنجاب دليل على الوعي","كثرة الإنجاب دليل على تطبيق المنهج الرباني، وتقليله يدل على أن المرأة ضحية لمنهج متبعي الشيطان","لا علاقة بين الإنجاب والمنهج الرباني"],"answer":2,"why":"كثرةُ إنجابِك للأولاد دليلٌ على تطبيقِك للمنهج الرّباني الذي ارتضاه لك رسول الله ﷺ، أمّا تقليلُك للإنجاب فيدلُّ على أنّك ضحيةٌ لمنهجِ متّبِعي الشيطان الذي قال: ﴿لَأَحْتَنِكَنَّ ذُرِّيَّتَهُ إِلَّا قَلِيلًا﴾.","ref":"ص 4"},{"q":"ماذا وصف الله تعالى به الزوجين في قوله: ﴿هُنَّ لِبَاسٌ لَّكُمْ وَأَنتُمْ لِبَاسٌ لَّهُنَّ﴾ بحسب استشهاد الدرس؟","options":["أن الزوج أفضل من الزوجة في كل شيء","أن العلاقة بين الزوجين تكاملية؛ فالرجل لا يستطيع أن يسكن بلا امرأة، والمرأة بلا رجل لا تشعر بالتكامل","أن الزوجين لا حاجة لأحدهما بالآخر","أن العلاقة بين الزوجين علاقة منافسة"],"answer":1,"why":"قال تعالى: ﴿هُنَّ لِبَاسٌ لَّكُمْ وَأَنتُمْ لِبَاسٌ لَّهُنَّ﴾، وقال: ﴿وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا﴾؛ فالرجل لا يستطيع أن يسكن بلا امرأة، والمرأة بلا رجل لا تشعر بالتكامل، فالعلاقة بينهما تكاملية.","ref":"ص 4"},{"q":"ما صفات «خير النساء» في الحديث الذي رواه البيهقي والوارد في الدرس؟","options":["«خير نسائكم الودود الولود المواتية المواسية»","«خير نسائكم الغنية الجميلة النسيبة»","«خير نسائكم المتعلمة العالمة»","«خير نسائكم القوية الشجاعة»"],"answer":0,"why":"قال رسول الله ﷺ: «خير نسائكم الودود الولود المواتية المواسية» (أخرجه البيهقي)؛ وقبل أن تُقبل المرأة على الزواج لا بد أن تتعلم كيف تكتسب قلب الزوج، وكيف تكون زوجة ودودًا ولودًا مواتية.","ref":"ص 5"},{"q":"لماذا تُعدّ الثقافة الأسرية حماية للبيوت من التفلت والتشتت بحسب الدرس؟","options":["لأنها تمنع الزواج","لأنها تشجع على ترك البيت عند الخلاف","لأنها تُعلّم الطلاق فقط","لأنها تكسب المرأة وعيًا في التعامل مع المشكلات، فلا تخرج من بيتها عند الخلاف"],"answer":3,"why":"الثقافة الأسرية تكسب المرأة وعيًا في التعامل مع المشكلات فلا تخرج من بيتها عند الخلاف؛ يقول تعالى: ﴿لَا تُخْرِجُوهُنَّ مِن بُيُوتِهِنَّ وَلَا يَخْرُجْنَ إِلَّا أَن يَأْتِينَ بِفَاحِشَةٍ مُّبَيِّنَةٍ﴾.","ref":"ص 5"},{"q":"ما كتاب «محو الأمية التربوية» بحسب الدرس، وما الفكرة التي يقوم عليها؟","options":["كتاب لتعليم القراءة والكتابة","كتاب في أحكام العبادات","كتاب للدكتور محمد إسماعيل مقدم، يقول فيه إن الأمية منتشرة في أبواب كثيرة لكن أكثرها انتشارًا هي الأمية التربوية","كتاب في تفسير القرآن"],"answer":2,"why":"«محو الأمية التربوية» هو عنوان كتاب للدكتور محمد إسماعيل مقدّم، يقول فيه إن الأمية منتشرة في أبواب كثيرة، لكن أكثرها انتشارًا هي الأمية التربوية، فقد يكون الوالدان متثقفَين في جوانب كثيرة لكنهما يجهلان كيفية تربية أولادهما والتعامل معهما.","ref":"ص 6"},{"q":"ما وسائل اكتساب علم الأسرة بحسب الدرس؟","options":["السفر والترحال","القراءة ومجالس العلم، والمذاكرة النافعة، والصحبة الصالحة","الإكثار من وسائل الترفيه","الاعتماد على التجارب الفاشلة"],"answer":1,"why":"وسائل اكتساب علم الأسرة: ١. القراءة ومجالس العلم، ٢. المذاكرة النافعة (من خلال المدارسة مع القريبات ممن يمتلكن ثقافة أسرية)، ٣. الصحبة الصالحة.","ref":"ص 7"},{"q":"ماذا تقول العبارة الواردة في الدرس عن أثر الصحبة؟","options":["الصاحب ساحب، وعدوى الروح إلى الروح أسرع من عدوى البدن إلى البدن","الصاحب لا أثر له","عدوى البدن أسرع من عدوى الروح","الصحبة لا تؤثر في الأفكار"],"answer":0,"why":"الصحبة تجعل الشخص يأخذ عن صاحبه أفكاره ويكتسب من شخصيته، لذلك تُنصح المرأة الصالحة بمجالسة من تحمل أفكارها الصحيحة؛ «فالصاحب ساحب، وعدوى الرُّوح إلى الرُّوح أسرع من عدوى البدن إلى البدن».","ref":"ص 7"}],"6":[{"q":"ما المقصود بروح الرسالية بحسب الدرس؟","options":["أن تهتم المرأة بإشباع الشهوات من طعام وشراب","أن تبتعد المرأة عن المجتمع","أن تكون المرأة صاحبة رسالة، وأن يكون لها دور مهم في المجتمع","أن تقتصر على شؤون بيتها فقط دون أثر"],"answer":2,"why":"من الثوابت المهمة للمرأة المسلمة «روح الرسالية»؛ وهو أن تكون صاحبة رسالة، وأن يكون لها دور مهم في المجتمع، فالمرأة هي نصف المجتمع، وهي التي تلد النصف الآخر من الرجال الأبطال وتربيهم، لذا يقال: «الرجل هو الذي صنع الحضارة، والمرأة هي التي صنعت الإنسان».","ref":"ص 2"},{"q":"ماذا قال النبي ﷺ للنساء في الحديث الوارد في الدرس عن أكثر أهل النار؟","options":["«يا معشر النساء، أنتن أكثر أهل الجنة»","«يا معشر النساء، تصدّقن وأكثرن الاستغفار؛ فإني رأيتكن أكثر أهل النار»","«يا معشر النساء، لا تتصدقن»","«يا معشر النساء، أنتن أقل الناس ذنوبًا»"],"answer":1,"why":"النساء هنّ أكثر أهل النار، كما أخبر رسول الله ﷺ بقوله: «يا معشر النساء، تصدّقن وأكثرن الاستغفار؛ فإنّي رأيتكنّ أكثر أهل النار» (رواه مسلم)؛ وهذا يدعو إلى أن تكون المرأة المسلمة صاحبة الوعي والعلم داعيةً لهنّ لتبيّن لهنّ طرق الضلال وأسباب الوقاية من النار.","ref":"ص 3"},{"q":"ما الذي يجب على المرأة قبل أن تُطالَب بأن تكون صاحبة رسالة بحسب الدرس؟","options":["أن تكون صاحبة شخصية متمسّكة بدينها، تحمل الهمّ الرسالي من خلال بعث روح الرسالة في نفسها","أن تكون ذات مال وجاه","أن تترك بيتها وتتفرغ للدعوة","أن تنتظر توجيهات الرجال فقط"],"answer":0,"why":"قبل أن تطالَب المرأةُ بأن تكون صاحبةَ رسالةٍ، لا بدَّ أن تكون صاحبةَ شخصيةٍ متمسّكةٍ بدينها، تحمل الهمَّ الرسالي من خلال بعثِ روحِ الرسالة في نفسها، فالنساءُ شقائقُ الرجال، ودورُ المرأة في الدعوة لا يقلُّ أهمية عن دور الرجل.","ref":"ص 3"},{"q":"ماذا قالت أم سُليم رضي الله عنها لأبي طلحة حين تقدّم إليها؟","options":["«أطلب منك مالًا كثيرًا»","«لا أريد الزواج أبدًا»","«أريد أن أنتقل إلى بلد آخر»","«فإن تُسلِم فذاك مهري، وما أسألك غيره»"],"answer":3,"why":"قالت أم سُليم لأبي طلحة: «والله ما مثلك يا أبا طلحة يُرَدُّ، ولكنك رجل كافر، وأنا امرأة مسلمة، ولا يحل لي أن أتزوجك؛ فإن تُسلِم فذاك مهري، وما أسألك غيره» فأسلم فكان ذلك مهرها.","ref":"ص 3"},{"q":"ماذا قال أنس بن مالك رضي الله عنه عن مهر أم سُليم؟","options":["«كان مهرها مالًا كثيرًا»","«كان مهرها بيتًا»","«ما سمعت بامرأة قط كانت أكرم مهرًا من أم سُليم؛ الإسلام»","«كان مهرها ذهبًا»"],"answer":2,"why":"يقول أنس بن مالك رضي الله عنه: «فما سمعتُ بامرأةٍ قطُّ كانت أكرمَ مهرًا من أمّ سُليم؛ الإسلامَ»، فالمرأة الرسالية تختار الرجل صاحب الدين وإن كان قليل اليد.","ref":"ص 3"},{"q":"بماذا أخبر النبي ﷺ أم حرام بنت مِلحان رضي الله عنها حين استيقظ وهو يضحك؟","options":["أنها ستسافر إلى الحج","«ناسٌ من أمتي عُرضوا عليّ غزاةً في سبيل الله، يركبون ثبَج هذا البحر، مُلوكًا على الأسِرّة»","أنها ستلد ولدًا صالحًا","أنها ستنال مالًا كثيرًا"],"answer":1,"why":"عن أنس: كان رسول الله ﷺ يدخل على أم حرام بنت مِلحان... فنام ثم استيقظ وهو يضحك، فقالت: ما يُضحكك يا رسول الله؟ قال: «ناسٌ من أمتي عُرضوا عليّ غزاةً في سبيل الله، يركبون ثبَجَ هذا البحر، مُلوكًا على الأسِرّة» (رواه البخاري).","ref":"ص 3"},{"q":"ما شعار المرأة صاحبة الرسالة وهمّها بحسب الدرس؟","options":["أنها تحمل همّ الدين والأمة؛ فشعارها: ﴿كُنتُمْ خَيْرَ أُمَّةٍ أُخْرِجَتْ لِلنَّاسِ تَأْمُرُونَ بِالْمَعْرُوفِ وَتَنْهَوْنَ عَنِ الْمُنكَرِ﴾","أنها تعيش من أجل نفسها فقط","أنها تهتم بطعامها وشرابها وزينتها","أنها تنعزل عن الناس"],"answer":0,"why":"المرأة صاحبة الرسالة لا تعيش فقط من أجل نفسها، فتهتمّ بطعامها وشرابها وزينتها، وإنما تحمل همّ الدين والأمّة، وشعارها: ﴿كُنتُمْ خَيْرَ أُمَّةٍ أُخْرِجَتْ لِلنَّاسِ تَأْمُرُونَ بِالْمَعْرُوفِ وَتَنْهَوْنَ عَنِ الْمُنكَرِ﴾.","ref":"ص 4"},{"q":"لماذا تُعدّ المرأة صاحبة الرسالة «قدوة حسنة في المجتمع» بحسب الدرس؟","options":["لأنها تتصدر المجالس العامة","لأنها تخالط الرجال دون حرج","لأنها تقلّد الغرب فيما يقدّمون","لأنها قدوة لغيرها من المسلمات وداعية للحجاب الشرعي بلباسها ومشيتها وغضّ بصرها ونجاحها في أسرتها وضبط لسانها وطيب كلامها"],"answer":3,"why":"صاحبةُ الرسالة قدوةٌ لغيرها من المسلمات وداعيةٌ للحجاب الشرعي بلباسِها، وهي قدوةٌ لهنَّ بحيائها ومشيتها في الطريق تمشي غاضَّةً بصرَها، وقدوةٌ لهنَّ بنجاحها في أُسرتها وطاعتها لزوجها وتربيتها لأولادها، وبضبط لسانها وطيب كلامها.","ref":"ص 4"},{"q":"كيف تتميّز صاحبة الرسالة في الصبر والثبات بحسب الدرس؟","options":["تترك رسالتها عند أول عقبة","تقول: فعلت ولم ينفع، ثم تتوقف","تصبر على ما ابتُليت به في سبيل الالتزام برسالتها، ولا تقول: «فعلتُ وفعلتُ ولم ينفع!»","تتجنب كل من يخالفها"],"answer":2,"why":"تتميّز صاحبة الرسالة بالصبر والثبات، فهي تواجه سُخرية من حولها من المجتمع بسبب طاعتها لزوجها وقيامها على شؤون بيتها، وتصبر على ما ابتُليت به في سبيل الالتزام برسالتها، ولا تقول: «فعلتُ وفعلتُ ولم ينفعْ!».","ref":"ص 4"},{"q":"ما الذي سيُنجبه بيتٌ تُربّى فيه الأولاد على الصلاح بحسب مشروع «تربية أولاد صالحين»؟","options":["لا يُنجب إلا مثل الذين لا أثر لهم","رجالًا مثل أحمد بن حنبل، والإمام البخاري، وصلاح الدين الأيوبي، ويوسف بن تاشفين وغيرهم من العظماء والقادة","لا يُنجب إلا الأثرياء","لا يُنجب إلا أصحاب المناصب"],"answer":1,"why":"تربية أولاد صالحين: فتنجبُ رجالًا مثل أحمد بن حنبل، والإمام البخاري، وصلاح الدين الأيوبي، ويوسف بن تاشفين، وغيرهم من العُظماء والقادة الذين تحتاجُ الأمّة لأمثالِهم.","ref":"ص 6"}],"7":[{"q":"ما سبب قلة ترتيب الأولويات عند كثير من النساء بحسب مقدمة الدرس؟","options":["كثرة تمسكهن بالثوابت","كثرة طلبهن للعلم الشرعي","شدة التزامهن بأدوارهن","تأثّرهن بالحملات الغربية، فأصبحت لديهن أولويات بعيدة عمّا يحبه الله ورسوله ﷺ؛ فأصبحت المرأة تقوم بدور الرجل والرجل بدور المرأة"],"answer":3,"why":"ترتيب الأولويات من أهم ما ينبغي أن يكون من سمات شخصية المرأة المسلمة؛ لأن كثيرًا من النساء تأثّرن بالحملات الغربية، وأصبحت لديهن أولويات بعيدة عمّا يحبّه الله تعالى ورسولُه ﷺ، فأصبحت المرأة تقوم بدور الرجل، والرجل يقوم بدور المرأة، وهذا لقلّة ترتيب الأولويات في الحياة.","ref":"ص 2"},{"q":"ما السؤال الذي ينبغي أن تطرحه مهندسة الأجيال في نفسها بحسب مقدمة الدرس؟","options":["«هل أنا غنية أم فقيرة؟»","«هل أنا مشهورة أم مجهولة؟»","«هل أنا شخصية منظَّمة أم فوضوية؟»","«هل أنا قوية أم ضعيفة؟»"],"answer":2,"why":"يعيش غالب الناس ترتيبًا في الجانب الدنيوي لحياتهم، يقابله فوضوية كبيرة فيما يتعلق بالأمور الدينية؛ فالتساؤل الذي ينبغي أن تطرحه مهندسة الأجيال في نفسها هو: «هل أنا شخصية منظَّمة أم فوضوية؟».","ref":"ص 2"},{"q":"أي مما يلي من سمات الشخصية المنظَّمة بحسب الدرس؟","options":["تؤجل أعمالها إلى آخر لحظة","تخصّص جزءًا يوميًّا من وقتها للتفكير في وظيفتها والتخطيط لها، وتضع أهدافًا مكتوبة ومحددة","توافق على طلبات الآخرين التي تعيقها عن أولوياتها","ليس لها وقت محدد لأي شيء"],"answer":1,"why":"من سمات الشخصية المنظَّمة: تخصّص جزءًا يوميًّا من وقتها للتفكير في وظيفتها والتخطيط لها، وتضع أهدافًا مكتوبة ومحددة، وتعدّ قائمة عمل يومية، وتبذل مجهودًا خاصًّا لعدم تضييع الوقت، ولا تتردد في رفض طلبات الآخرين التي تعيقها عن أولوياتها.","ref":"ص 3"},{"q":"ما أثر التزام كل النساء بأدوارهنّ في التربية على المجتمع بحسب الدرس؟","options":["سيكون هناك تغيّر نوعي في المجتمع؛ فما تعيشه المجتمعات من انحرافات ليس إلا نتيجة غياب النظام وغياب الأمهات الواعيات برسالتهن","لن يتغير شيء في المجتمع","ستكثر المشاحنات والتفاهات","سيقل عدد الأفراد القادرين على النجاح"],"answer":0,"why":"فمثلًا لو أنّ كلّ النساء الْتَزَمْنَ بدورهنّ في التربية، وجَعَلْنَ الأولويةَ الكبرى لتربية أولادهنّ، فسيكون هناك تغيُّرٌ نوعيٌّ في المجتمع، وما تعيشه المجتمعات اليوم من الانحرافات ليس إلا نتيجة غياب النظام، وغياب الأمهات الواعيات برسالتهنّ الحقيقية في الحياة.","ref":"ص 5"},{"q":"ماذا قال النبي ﷺ في تعليم أمته النظام في الطعام بحسب الدرس؟","options":["«كلوا ما شئتم من الطعام»","«كلوا حتى الشبع التام»","«لا تأكلوا إلا مرة واحدة في اليوم»","«حَسْب ابن آدم أُكُلات يُقِمن صُلْبه، فإن كان لا محالة فثلثٌ لطعامه، وثلثٌ لشرابه، وثلثٌ لنفَسِه»"],"answer":3,"why":"قال ﷺ معلّمًا أمّته النظام في الطعام: «حَسْبُ ابن آدمَ أُكُلاتٌ يُقِمن صُلبه، فإن كان لا محالةَ فثلثٌ لطعامه وثلثٌ لشرابه وثلثٌ لنفَسِه» (أخرجه الترمذي).","ref":"ص 6"},{"q":"من الشخصيات الناجحة في التنظيم والترتيب التي ذكرها الدرس، ومم اشتُهر كل منهم؟","options":["يوسف عليه السلام في إدارة المعارك، وعمر في ترتيب الموارد","خالد بن الوليد في إدارة الدولة، وعمر في تخطيط المعارك","يوسف عليه السلام في ترتيب الموارد والاحتياجات، وعمر بن الخطاب في إدارة الدولة وتنظيمها، وخالد بن الوليد في إدارته وتخطيطه للمعارك","لم يذكر الدرس شخصيات ناجحة"],"answer":2,"why":"من الشخصيات الناجحة في التنظيم والترتيب: يوسف عليه السلام (ترتيب الموارد والاحتياجات)، وعمر بن الخطاب رضي الله عنه (إدارة الدولة وتنظيمها)، وخالد بن الوليد رضي الله عنه (إدارته وتخطيطه للمعارك).","ref":"ص 7"},{"q":"ما معنى ترتيب الأولويات بحسب الدرس؟","options":["تأجيل جميع الأعمال","وضع كل شيء في مكانه؛ فلا يُقدَّم ما حقُّه التأخير، ولا يُؤخَّر ما حقُّه التقديم","تقديم المهم على الأهم دائمًا","التخلي عن الأعمال الصعبة"],"answer":1,"why":"ترتيب الأولويات هو وضع كلّ شيء في مكانه؛ فلا يُقدَّم ما حقُّه التأخير، ولا يُؤخَّر ما حقُّه التقديم، فقد تنحصر قدرات الإنسان أمام عدّة خيارات أحيانًا، ولا بدّ أن يُحسِن ترتيب الأولويات فيبدأ بالأهمّ ثم المهم.","ref":"ص 7"},{"q":"ما الضروريات بحسب الدرس، وما أمثلتها؟","options":["ما لا بدّ منه لقيام مصالح الدين والدنيا، مثل الأصول الكلّية الخمسة: الدين، والمال، والعقل، والنفس، والنسل","ما يفتقر إليه الإنسان من حيث التوسعة كالبيوع والإجارة","ما يليق من محاسن العادات كتحسين الثوب والمكان","ما لا يتعلق بمصالح الدين والدنيا"],"answer":0,"why":"الضروريات: هي ما لا بدّ منه لقيام مصالح الدين والدنيا، مثل الأصول الكلّية الخمسة (الدين، المال، العقل، النفس، النسل). والحاجيات: ما يفتقر إليه الإنسان من حيث التوسعة؛ لذلك شُرعت العقود كالبيوع والإجارة. والتحسينيات: ما يليق من محاسن العادات ومكارم الأخلاق.","ref":"ص 7"},{"q":"ما المثال الذي ذكره الدرس لتقديم الفرائض على النوافل في تعارض قيام الليل مع طلب الزوج؟","options":["تقدّم المرأة قيام الليل على طلب زوجها","تتجاهل المرأة طلب زوجها","تترك المرأة الصلاة كلها","تعارض قيام الليل (نافلة) مع طلب الزوج لزوجته للفراش (فرض)، فالواجب على المرأة أن تقدّم الفرض"],"answer":3,"why":"من أمثلة تقديم الفرائض على النوافل: تعارض قيام الليل (نافلة) مع طلب الزوج لزوجته للفراش (فرض)، فالواجب على المرأة أن تقدّم الفرض.","ref":"ص 8"},{"q":"ما الذي تستفيده المسلمة من حديث معاذ بن جبل رضي الله عنه الوارد في الدرس عن ترتيب الأولويات في الدعوة؟","options":["أن تطلب من غير المسلمة أن ترتدي الحجاب أولًا","أن تبدأ بالتفاصيل الدقيقة قبل التوحيد","إذا أرادت أن تدعو غيرها فينبغي أن تُحسِن ترتيب الأولويات وتتدرج في ذلك؛ فلا تطلب من امرأة لا تصلي أن تترك النمص، ولا تطلب من امرأة غير مسلمة أن ترتدي الحجاب","ألا تدعو أحدًا"],"answer":2,"why":"ومن هذا تستفيد المسلمةُ أنها إذا أرادت أن تدعو غيرها، فينبغي أن تُحسِن ترتيب الأولويات، وأن تتدرّج في ذلك، فلا تَطلُب من امرأةٍ لا تصلّي أن تترك النَّمص مثلًا، ولا تطلب من امرأة غير مسلمة أن ترتدي الحجاب.","ref":"ص 9"},{"q":"ما الخطوات العملية في ترتيب الأولويات المذكورة في الدرس؟","options":["السهر وتأجيل الأعمال وكثرة النوم","الارتباط بالرسالة، والموازنة بين الأدوار، وتحديد الأهداف، ووضع خطة عمل يومية وأسبوعية، ومواجهة التحديات وتقويم النفس","الاعتماد على الآخرين في كل شيء","ترك الأهداف دون تدوين"],"answer":1,"why":"من الخطوات العملية في ترتيب الأولويات: الارتباط بالرسالة، والموازنة بين الأدوار، وتحديد الأهداف (ماذا أريد؟ لماذا أريد ذلك؟ وكيف أحقق ذلك؟)، ووضع خطة عمل يومية وخطة عمل أسبوعية مع الحرص على تدوينها، ومواجهة التحديات وتقويم النفس.","ref":"ص 10"}],"8":[{"q":"لماذا شُرع الحجاب بحسب الدرس؟","options":["لأن المرأة فتنة، وقد جاءت الضوابط في لباسها وعلاقاتها لسدّ ذريعة الفساد وإغلاق منافذ الافتتان بها","لأنه عادة اجتماعية قديمة فقط","لأن المرأة أقل شأنًا","لأجل الزينة"],"answer":0,"why":"لقيت المرأة المسلمة عناية فائقة من دينها بما يصون عفتها ويجعلها عزيزة الجانب سامية المكان، فالضوابط التي فرضها الإسلام في ملبسها وعلاقاتها ما كانت إلا لسدّ ذريعة الفساد وإغلاق منافذ الافتتان بها.","ref":"ص 2"},{"q":"ما الحديث الذي حذّر فيه النبي ﷺ من فتنة النساء؟","options":["«ما تركت بعدي فتنة أضر على الرجال من المال»","«ما تركت بعدي فتنة أضر على الرجال من الولد»","«ما تركت بعدي فتنة أضر على الرجال من الدنيا»","«ما تركت بعدي فتنةً أضرّ على الرجال من النساء»"],"answer":3,"why":"حذّر رسول الله ﷺ من هذه الفتنة بقوله: «ما تركتُ بعدي فتنةً أضرّ على الرجال من النساء» (أخرجه البخاري ومسلم)، ففتنة الرجل بالمرأة حقيقة لا ينبغي للمسلم أن يطمسها.","ref":"ص 3"},{"q":"ماذا قال النبي ﷺ عن المرأة إذا خرجت من بيتها؟","options":["«المرأة نصف المجتمع فلا تقيّدوها»","«إذا خرجت فهي أقرب إلى ربها»","«المرأة عورة، فإذا خرجت استشرفها الشيطان، وأقرب ما تكون من وجه ربها وهي في قعر بيتها»","«لا حرج في كشف ما تشاء»"],"answer":2,"why":"قال ﷺ: «إن المرأة عورة، فإذا خرجت استشرفها الشيطان، وأقرب ما تكون من وجه ربها وهي في قعر بيتها» (رواه الترمذي).","ref":"ص 3"},{"q":"ما أول فتنة بني إسرائيل بحسب الحديث الوارد في الدرس؟","options":["كانت في المال","كانت في النساء","كانت في الملك","كانت في العلم"],"answer":1,"why":"قال رسول الله ﷺ: «إن الدنيا حلوة خضرة، وإن الله مستخلفكم فيها فينظر كيف تعملون، فاتقوا الدنيا واتقوا النساء؛ فإن أول فتنة بني إسرائيل كانت في النساء» (رواه مسلم).","ref":"ص 3"},{"q":"ما الصنف من النساء الذي توعّده النبي ﷺ بأسوأ مصير بحسب الدرس؟","options":["نساء كاسيات عاريات مائلات مميلات، رؤوسهن كأسنمة البخت المائلة، لا يدخلن الجنة ولا يجدن ريحها","النساء المتصدقات","النساء الصائمات","النساء الحافظات للقرآن"],"answer":0,"why":"أخبر رسول الله ﷺ عن وقوع صنف من النساء من أمته في كبيرة من الكبائر وتوعدهنّ بأسوأ مصير، فقال: «...ونساء كاسيات عاريات مائلات مميلات، رؤوسهن كأسنمة البخت المائلة، لا يدخلن الجنة ولا يجدن ريحها، وإن ريحها ليوجد من مسيرة كذا وكذا» (رواه مسلم).","ref":"ص 3"},{"q":"بماذا يتعلق التحذير في قوله تعالى: ﴿ولا تقربوا الزنى﴾ بحسب الدرس؟","options":["النهي عن الزنا فقط دون مقدماته","إباحة مقدماته","الحث على الزواج فقط","التحذير من الاقتراب من الزنا أبلغ من التحذير من ارتكابه، فمجرد الاقتراب محرّم"],"answer":3,"why":"والتحذير من الاقتراب من الزنا أبلغ من التحذير من ارتكابه، فمجرد الاقتراب محرّم؛ وقد سدّ الشرع منافذ الشيطان، ومن ذلك قول الله تعالى: ﴿ولا تقربوا الزنى﴾ [الإسراء: 32].","ref":"ص 4"},{"q":"ما الاتجاهان اللذان اتخذتهما الشريعة في حماية العرض بحسب الدرس؟","options":["اتجاه ديني، واتجاه دنيوي","اتجاه فردي، واتجاه جماعي","اتجاه وقائي، واتجاه علاجي","اتجاه نظري، واتجاه عملي"],"answer":2,"why":"اتخذت الشريعة في ذلك اتجاهين: أ) اتجاه وقائي: يمنع من الوقوع في الفاحشة بسدّ المنافذ الموصلة إليها سدًّا محكمًا، ب) اتجاه علاجي: عن طريق فتح أبواب التعفف والتحصين، وشق الطرق المعبّدة الموصلة إلى ما أحلّه الله، بتيسير النكاح والقضاء على معرقلاته والترغيب فيه.","ref":"ص 4-6"},{"q":"ماذا قالت عائشة رضي الله عنها عن مصافحة النبي ﷺ للنساء؟","options":["«كان يصافحهن عند الحاجة دائمًا»","«لا والله ما مسّت يد رسول الله ﷺ يد امرأة قط»","«كان يصافحهن في الأعياد»","«لم أسمع في ذلك شيئًا»"],"answer":1,"why":"تقول عائشة رضي الله عنها: «لا والله ما مسّت يد رسول الله ﷺ يد امرأة قط» (رواه مسلم).","ref":"ص 6"},{"q":"ما الدرجات الثلاث للحجاب الشرعي بحسب الدرس؟","options":["حجاب البيوت والجدر والخدر، وخروج النساء من البيوت مستورات، والتستر المخصوص (من الرأس إلى القدم)","حجاب الرأس فقط، وحجاب اليدين فقط، وحجاب القدمين فقط","حجاب الزينة، وحجاب العمل، وحجاب السفر","لا درجات له"],"answer":0,"why":"للحجاب ثلاث درجات: ١) حجاب بالبيوت والجدر والخدر وأمثالها، فلا يرى الرجال أي شيء منهن، ٢) خروج النساء من البيوت مستورات، ٣) التستر المخصوص: أي أن يخرجن متسترات من الرأس إلى القدم مع كشف الوجه واليدين عند أمن الفتنة عند بعض الأئمة، وقد اتفق جمهور علماء المذاهب في هذا الزمان على وجوب تغطية المرأة لوجهها وكفيها سدًّا لذرائع الفساد.","ref":"ص 7"},{"q":"ما الذي قالته عائشة رضي الله عنها لنساء بني تميم اللاتي دخلن عليها بثياب رقاق؟","options":["«ما أجمل ثيابكن»","«هذا لباس المؤمنات»","«لا بأس به في البيوت فقط»","«إن كنّ مؤمنات فليس هذا بلباس المؤمنات، وإن كنّ غير مؤمنات فتمتّعن به»"],"answer":3,"why":"يُروى أن نسوة من بني تميم دخلن على عائشة رضي الله عنها عليهن ثياب رقاق، فقالت عائشة: «إن كنّ مؤمنات فليس هذا بلباس المؤمنات، وإن كنّ غير مؤمنات فتمتّعن به».","ref":"ص 10"}],"9":[{"q":"ما العلاقة بين الحياء والإيمان بحسب الدرس؟","options":["لا علاقة بينهما","الحياء والإيمان قُرنا جميعًا، فإذا رُفع أحدهما رُفع الآخر","الحياء ينافي الإيمان","الإيمان يغني عن الحياء"],"answer":1,"why":"الإسلام دين الحياء، والحياء والإيمان قُرنا جميعًا؛ فإذا رُفع أحدهما رُفع الآخر، فالمرأة لا تخرج متبرجة إلا لقلة حيائها.","ref":"ص 2"},{"q":"كيف عرّف النحاس الغيرة بحسب الدرس؟","options":["أن يحمي الرجل زوجته وغيرها من النساء من قرابته ويمنع أن يدخل عليهن أو يراهن غير محرم","أن يمنع الرجل زوجته من كل خروج","أن يشكّ في أهله دائمًا","أن يتركهن دون رعاية"],"answer":0,"why":"قال النحاس: «الغيرة هي أن يحمي الرجل زوجته وغيرها من النساء من قرابته ويمنع أن يدخل عليهن أو يراهن غير محرم». وقال ﷺ: «ومن قُتل دون أهله فهو شهيد» (رواه الترمذي).","ref":"ص 2"},{"q":"كيف عرّف الشيخ المودودي التبرج في كتابه (الحجاب) بحسب الدرس؟","options":["ارتداء الحجاب الواسع","التزين لزوجها في بيتها","لبس الأسود فقط","كل زينة أو تجمّل تقصد المرأة بإظهاره أن تحلو في أعين الأجانب"],"answer":3,"why":"عرّفه الشيخ المودودي في كتابه (الحجاب) بأنه كل زينة أو تجمّل تقصد المرأة بإظهاره أن تحلو في أعين الأجانب، حتى القناع الذي تستر به المرأة إن انتُخب من الألوان البارقة والشكل الجذاب لكي تلذّ به أعين الناظرين فهو من مظاهر التبرج.","ref":"ص 3"},{"q":"بماذا قرن النبي ﷺ التبرج في بيعة أميمة بنت رقيقة؟","options":["بالصلاة والصيام","بالزكاة والحج","بالشرك والسرقة والزنا وقتل الولد والبهتان والنياحة، فقال: «ولا تبرجي تبرج الجاهلية الأولى»","بالعلم والعمل"],"answer":2,"why":"جاءت أميمة بنت رقيقة إلى رسول الله ﷺ تبايعه على الإسلام، فقال: «أبايعك على ألا تشركي بالله شيئًا، ولا تسرقي، ولا تزني، ولا تقتلي ولدك، ولا تأتي ببهتان تفترينه بين يديك ورجليك، ولا تنوحي، ولا تبرجي تبرج الجاهلية الأولى» (رواه أحمد)، وهنا قرن التبرج مع كل هذه الكبائر.","ref":"ص 3"},{"q":"ماذا قال النبي ﷺ عن المرأة التي استعطرت فمرّت بقوم ليجدوا ريحها؟","options":["«فلا حرج عليها»","«فهي زانية»","«فهي مأجورة»","«فهي صائمة»"],"answer":1,"why":"قال رسول الله ﷺ: «أيما امرأة استعطرت فمرّت بقوم ليجدوا ريحها فهي زانية» (رواه أبو داود).","ref":"ص 4"},{"q":"كم شرطًا للحجاب الشرعي ذكر الدرس، وما أول شرط؟","options":["ثمانية شروط، أولها: استيعاب جميع البدن","ثلاثة شروط، أولها: السواد","خمسة شروط، أولها: الطول","عشرة شروط، أولها: الخمار فقط"],"answer":0,"why":"للحجاب شروط ثمانية ينبغي للمسلمة أن تحققها كاملة، أولها: استيعاب جميع البدن (وهذا الشرط مسألة فقهية طويلة يأتي شرحها في الدرس القادم).","ref":"ص 5"},{"q":"ما معنى شرط «ألا يكون زينة في نفسه»؟","options":["ألا يكون واسعًا","ألا يكون من القطن","ألا يكون طويلًا","ألا يكون ذا لون لافت للأنظار أو يحمل زينة من تطريز ونقوش مما لا يجوز"],"answer":3,"why":"إذا كان التبرج هو إبداء المرأة من زينتها ومحاسنها فلا شك أن الحجاب ينبغي أن يكون بعيدًا عن الزينة؛ فقد تلبس المرأة حجابًا ساترًا لكنه ذو لون لافت للأنظار، أو حجابًا فضفاضًا يحمل بعض الزينة من تطريز ونقوش مما لا يجوز.","ref":"ص 5"},{"q":"ما الحكمة من شرط أن يكون الحجاب فضفاضًا لا يصف؟","options":["لأنه أجمل في المظهر","لأنه أرخص","لأن الغرض من الحجاب رفع الفتنة، والضيق يصف حجم الأعضاء","لأنه أخف وزنًا"],"answer":2,"why":"الغرض من الحجاب هو رفع الفتنة، وإن كان ضيقًا فسيصف حجم الأعضاء. وفي فاطمة رضي الله عنها قدوة لكل مؤمنة، فهي لم ترضَ أن يوصف جسدها حتى وهي ميتة.","ref":"ص 5-6"},{"q":"ماذا قال النبي ﷺ لمن تشبّه بقوم؟","options":["«من تشبه بقوم فلا بأس عليه»","«من تشبّه بقوم فهو منهم»","«من تشبه بقوم فله أجر»","«من تشبه بقوم فليستغفر ويتم»"],"answer":1,"why":"التشبه بالكفار منهي عنه شرعًا، فقد قال رسول الله ﷺ: «من تشبّه بقوم فهو منهم» (رواه أبو داود)، ولا ينبغي للمرأة أن تلبس ما هو خاص بنساء الكفار وإن تحققت فيه شروط الحجاب.","ref":"ص 6"},{"q":"ما المقصود بلباس الشهرة، وما وعيد من لبسه؟","options":["لباس يقصد به الافتخار بين الناس تفاخرًا بالدنيا وزينتها أو إظهارًا للزهد ورياءً، ووعيده: «ألبسه الله ثوب مذلة يوم القيامة ثم تُلهب فيه نارًا»","لباس العيد، ووعيده الأجر","كل لباس جديد، ووعيده لا شيء","لباس العمل، ووعيده الإثم الخفيف"],"answer":0,"why":"لباس الشهرة: أي لا يقصد به الافتخار بين الناس، سواء كان الثوب نفيسًا يلبسه تفاخرًا بالدنيا وزينتها أو خسيسًا يلبسه إظهارًا للزهد ورياءً. قال ﷺ: «من لبس ثوب شهرة في الدنيا ألبسه الله ثوب مذلة يوم القيامة ثم تُلهب فيه نارًا» (أخرجه أبو داود).","ref":"ص 6"}],"10":[{"q":"ما موضع الخلاف بين الفقهاء في الحجاب بحسب الدرس، وما الذي هو ثابت؟","options":["كل شروط الحجاب محل خلاف","الخلاف في ستر الرأس فقط","ستر الوجه والكفين محل خلاف، أما الشروط السابقة فكلها ثابتة","لا خلاف في شيء"],"answer":2,"why":"كل الشروط السابق ذكرها في الحجاب هي شروط ثابتة، إلا أن ستر الوجه والكفين محل خلاف بين الفقهاء؛ حيث يرى قسم منهم أنه فرض على كل مسلمة، بينما يرى القسم الآخر أنه فضيلة ولا إثم على من لم تلتزم به.","ref":"ص 2"},{"q":"ما الآية الأولى التي استدل بها القائلون بالوجوب؟","options":["﴿وأقيموا الصلاة وآتوا الزكاة﴾","﴿يا أيها النبي قل لأزواجك وبناتك ونساء المؤمنين يدنين عليهن من جلابيبهن﴾","﴿قل هو الله أحد﴾","﴿إنما المؤمنون إخوة﴾"],"answer":1,"why":"من القرآن الكريم: قول الله سبحانه وتعالى: ﴿يا أيها النبي قل لأزواجك وبناتك ونساء المؤمنين يدنين عليهن من جلابيبهن ذلك أدنى أن يعرفن فلا يؤذين وكان الله غفورًا رحيمًا﴾ [الأحزاب: 59].","ref":"ص 2"},{"q":"ماذا قال ابن عباس رضي الله عنهما في تفسير الإدناء بحسب الدرس؟","options":["أمر الله نساء المؤمنين إذا خرجن من بيوتهن في حاجة أن يغطين وجوههن من فوق رؤوسهن بالجلابيب ويبدين عينًا واحدة","أمرهن بكشف الوجه","أمرهن بالجلوس في المسجد","أمرهن بلبس الأبيض فقط"],"answer":0,"why":"قال عبد الله بن عباس رضي الله عنهما: «أمر الله نساء المؤمنين إذا خرجن من بيوتهن في حاجة أن يغطين وجوههن من فوق رؤوسهن بالجلابيب ويبدين عينًا واحدة»، وابن عباس هو ترجمان القرآن وحبر الأمة.","ref":"ص 2"},{"q":"ما الجلباب بحسب ما نقله الدرس عن البغوي وابن كثير؟","options":["البغوي: الحذاء، وابن كثير: القفاز","كلاهما: القلنسوة","كلاهما: الحزام","البغوي: الملاءة التي تشتمل بها المرأة فوق الدرع والخمار، وابن كثير: الرداء فوق الخمار"],"answer":3,"why":"ما هو الجلباب؟ يقول البغوي رحمه الله: «الجلباب هو الملاءة التي تشتمل بها المرأة فوق الدرع والخمار»، ويقول ابن كثير رحمه الله: «هو الرداء فوق الخمار».","ref":"ص 4"},{"q":"ماذا أُمرت النساء في حديث أم عطية رضي الله عنها يوم العيد؟","options":["أُمرن بالبقاء في البيوت","أُمرن بالصيام","أُمرن بإخراج العواتق والحيّض وذوات الخدور، فقالت إحداهن: لا يكون لها جلباب، فقال ﷺ: «لتلبسها أختها من جلبابها»","أُمرن بالسفر"],"answer":2,"why":"حديث أم عطية رضي الله عنها: «أمرنا رسول الله ﷺ أن نخرجهن في الفطر والأضحى: العواتق والحيّض وذوات الخدور، فأما الحيّض فيعتزلن الصلاة ويشهدن الخير ودعوة المسلمين، قلت: يا رسول الله إحدانا لا يكون لها جلباب؟ قال: «لتلبسها أختها من جلبابها»» (رواه مسلم). قال ابن حجر: وفيه امتناع خروج المرأة دون جلباب.","ref":"ص 4"},{"q":"ما الآية الثانية التي يستدل بها بعض العلماء على وجوب الحجاب العام (حجاب الجدر)؟","options":["﴿فاستبقوا الخيرات﴾","﴿وإذا سألتموهن متاعًا فاسألوهن من وراء حجاب ذلكم أطهر لقلوبكم وقلوبهن﴾","﴿وأقم الصلاة لذكري﴾","﴿قد أفلح المؤمنون﴾"],"answer":1,"why":"قول الله تعالى: ﴿وإذا سألتموهن متاعًا فاسألوهن من وراء حجاب ذلكم أطهر لقلوبكم وقلوبهن﴾ [الأحزاب: 53]. يستدل بعض العلماء أن حجاب الجدر (الحجاب العام) يستلزم احتجاب المرأة عن الرجل بجسدها كاملًا.","ref":"ص 5"},{"q":"ما معنى «ولا تبرجن تبرج الجاهلية الأولى» عند أبي نجيح ومن نُقل عنهم في الدرس؟","options":["أبو نجيح: التبختر، وقيل: إظهار الزينة وإبراز المرأة محاسنها للرجال","الجلوس في البيت","كثرة العبادة","لبس الأسود"],"answer":0,"why":"معنى ﴿ولا تبرجن تبرج الجاهلية الأولى﴾: يقول ابن أبي نجيح: «هو التبختر»، وقيل: «التبرج هو إظهار الزينة وإبراز المرأة محاسنها للرجال».","ref":"ص 5"},{"q":"ماذا ثبت عن ابن مسعود رضي الله عنه في تفسير ﴿إلا ما ظهر منها﴾؟","options":["الوجه والكفان","الشعر","القدمان","«أي الثياب الظاهرة من المرأة»"],"answer":3,"why":"صح عن عبد الله بن مسعود رضي الله عنه في تفسيرها قوله: «أي الثياب الظاهرة من المرأة»، وقال بعض العلماء: الكحل والخاتم نقلًا عن ابن عباس، لكنه ضعيف لا يصح. وذكر ابن الجوزي سبعة أقوال، ثم قال: «والقول الأول أشبه»، وقد نص عليه أحمد فقال: «الزينة الظاهرة: الثياب».","ref":"ص 6"},{"q":"ما الذي ذكره الدرس عن «القواعد من النساء» في قوله تعالى: ﴿والقواعد من النساء اللاتي لا يرجون نكاحًا﴾؟","options":["الكبيرة تتبرج كما تشاء","الكبيرة تترك الصلاة","المرأة الكبيرة التي قعدت عن الحيض والولد لا جناح عليها أن تضع جلبابها فوق الخمار إن لم تتبرج، والاستعفاف أفضل","الكبيرة لا تخرج أبدًا"],"answer":2,"why":"يقول الطبري عن ابن عباس: ﴿والقواعد من النساء اللاتي لا يرجون نكاحًا﴾ هي المرأة التي قعدت عن الولد، فلا جناح عليها أن تجلس في بيتها بدرع وخمار وتضع عنها الجلباب ما لم تتبرج. فيجوز للمرأة الكبيرة ألا تغطي وجهها لكن دون إظهار زينة، والعفة أفضل وأكمل ﴿وأن يستعففن خير لهن﴾.","ref":"ص 6"},{"q":"ما الذي يفهمه الدرس من قول النبي ﷺ: «ولا تنتقب المرأة المحرمة»؟","options":["أنها تكشف وجهها للرجال في الحج","أنها لا تلبس النقاب الذي يلتصق بالوجه في الحج، لكنها ترخي شيئًا من حجابها على وجهها، وأن النقاب كان قد صار من ألبسة النساء","أنها لا تغطي شيئًا","أنها لا تخرج"],"answer":1,"why":"قول رسول الله ﷺ: «ولا تنتقب المحرمة ولا تلبس القفازين» (رواه البخاري). يقول الشيخ أبو هشام الأنصاري: هذا الحديث أحسن دليل على ما وقع من التغير في ألبسة النساء، وليس معنى «ولا تنتقب المحرمة» أنها لا تستر وجهها، إنما المراد ألا تتخذ النقاب لباسًا يلتصق بالوجه، لكنها ترخي شيئًا من حجابها على وجهها وتعرض عن الرجال.","ref":"ص 7"}],"11":[{"q":"ما الثابت الشرعي الذي تناوله هذا الدرس من الثوابت الأساسية للمرأة المسلمة؟","options":["العمل خارج المنزل","السفر للدراسة","المشاركة في المسابقات","القرار في البيت"],"answer":3,"why":"ومن بين هذه الثوابت الشرعية الأساسية للمرأة المسلمة: «القرار في البيت». والمرأة عماد المجتمع وأساس بناء الأسرة والمعلمة الأولى للأجيال، فإن هي صلحت صلحت الأجيال.","ref":"ص 2"},{"q":"ما الآية التي استدل بها الدرس أولًا على أن قرار المرأة في بيتها هو الأصل؟","options":["﴿وأن ليس للإنسان إلا ما سعى﴾","﴿قل أعوذ برب الناس﴾","﴿وقرن في بيوتكن ولا تبرجن تبرج الجاهلية الأولى﴾","﴿وجعلنا من الماء كل شيء حي﴾"],"answer":2,"why":"من القرآن الكريم: قول الله جل جلاله: ﴿وقرن في بيوتكن ولا تبرجن تبرج الجاهلية الأولى وأقمن الصلاة وآتين الزكاة وأطعن الله ورسوله إنما يريد الله ليذهب عنكم الرجس أهل البيت ويطهركم تطهيرًا﴾ [الأحزاب: 33].","ref":"ص 3"},{"q":"على أي وجهين تُحمل كلمة ﴿وقرن﴾ بحسب الدرس؟","options":["من الحرب ومن السلم","من القرار: أي لزوم البيوت، ومن الوقار: وهو السكينة","من القراءة ومن الكتابة","من القوة ومن الضعف"],"answer":1,"why":"لفظ ﴿وقرن﴾ يحتمل وجهين: من القرار أي لزوم البيوت، ومن الوقار وهو السكينة أي عشن في بيوتكن في سكينة وحلم ورزانة، والآية على كلا الوجهين تعني أن البيت هو الدائرة الأصلية التي تمارس فيها المرأة أشرف الوظائف، وظيفة حضانة الأجيال.","ref":"ص 3"},{"q":"لماذا أضاف الله جل جلاله البيوت إلى النساء في ثلاث آيات بحسب الدرس؟","options":["إضافة إسكان ولزوم للمسكن والتصاق به، لا إضافة تمليك","إضافة تمليك لهن فقط","إضافة للزينة","إضافة للمدح فقط"],"answer":0,"why":"أضاف الله جل جلاله البيوت إلى النساء في ثلاث آيات من كتابه: ﴿وقرن في بيوتكن﴾، ﴿واذكرن ما يتلى في بيوتكن﴾، ﴿لا تخرجوهن من بيوتهن﴾، مع أن البيوت لأزواجهن أو لأوليائهن؛ قال العلماء: مراعاة لاستمرار لزوم النساء للبيوت، فهي إضافة إسكان ولزوم للمسكن والتصاق به لا إضافة تمليك.","ref":"ص 4"},{"q":"ما الذي يستدل به الدرس من قصة موسى عليه السلام مع المرأتين عند ماء مدين؟","options":["أن المرأة تخرج دائمًا بلا حاجة","أن الرعي مهنة النساء فقط","أن الاختلاط مستحب","أن خروج المرأة من بيتها خطب كبير، وأنهما لم تخرجا إلا لحاجة ولزمتا الخلق والأدب ولم تختلطا بالرجال"],"answer":3,"why":"﴿ما خطبكما﴾: أي ما الذي أخرجكما؟ دليل على أن خروج المرأة من بيتها خطب كبير خاصة في هذا المكان الذي فيه رجال، فبيّنتا سبب الخروج وهو الحاجة: ﴿وأبونا شيخ كبير﴾، فلم تخرج المرأتان من بيتهما إلا لحاجة، ولما خرجتا لزمتا الخلق والأدب ولم تختلطا بالرجال.","ref":"ص 5"},{"q":"ما المراد بالقوامة في قوله تعالى: ﴿الرجال قوامون على النساء﴾ بحسب الدرس؟","options":["تسلط الرجل بلا حدود","المساواة التامة في كل شيء","الرياسة التي يتصرف فيها المرؤوس بإرادة الرئيس واختياره، فالرجل هو القائد في البيت","أن تقود المرأة الأسرة"],"answer":2,"why":"قال العلماء: «والمراد بالقوامة: الرياسة التي يتصرف فيها المرؤوس بإرادة الرئيس واختياره»، فالرجل هو القائد في البيت والمرأة لا تفارقه إلا بإذنه. ويقول الألوسي: واستدل بالآية على أن للزوج تأديب زوجته ومنعها من الخروج، وأن عليها طاعته إلا في معصية الله تعالى.","ref":"ص 5"},{"q":"ما سبب نزول قوله تعالى: ﴿ولا تتمنوا ما فضل الله به بعضكم على بعض﴾ بحسب الحديث الذي ذكره الدرس؟","options":["نزلت في غزوة بدر","قالت أم سلمة رضي الله عنها: يغزو الرجال ولا تغزو النساء وإنما لنا نصف الميراث","نزلت في الصلاة","نزلت في الصيام"],"answer":1,"why":"جاء في سبب نزول هذه الآية أنها كانت في أم سلمة رضي الله عنها، قالت: «يغزو الرجال ولا تغزو النساء وإنما لنا نصف الميراث» فأنزل الله تبارك وتعالى ﴿ولا تتمنوا ما فضل الله به بعضكم على بعض﴾ (رواه الترمذي).","ref":"ص 6"},{"q":"ماذا قال النبي ﷺ لأم حميد رضي الله عنها حين أخبرته بحبها الصلاة معه؟","options":["«قد علمت أنك تحبين الصلاة معي، وصلاتك في بيتك خير من صلاتك في حجرتك...» وهكذا حتى قال: «وصلاتك في دارك خير من صلاتك في مسجدي»","«صلّي معي دائمًا في المسجد»","«لا صلاة لك في البيت»","«صلاتك في المسجد أفضل»"],"answer":0,"why":"عن أم حميد امرأة أبي حميد الساعدي أنها جاءت النبي ﷺ فقالت: يا رسول الله إني أحب الصلاة معك، قال: «قد علمت أنك تحبين الصلاة معي، وصلاتك في بيتك خير من صلاتك في حجرتك، وصلاتك في حجرتك خير من صلاتك في دارك، وصلاتك في دارك خير من صلاتك في مسجد قومك، وصلاتك في مسجد قومك خير من صلاتك في مسجدي» (رواه ابن حبان).","ref":"ص 7"},{"q":"ما الذي يدل عليه حديث خروج سودة بنت زمعة رضي الله عنها ليلًا؟","options":["أن الأصل خروجها دائمًا","أن الخروج محرم تحريمًا مطلقًا حتى للحاجة","أن الحديث لا دلالة فيه","أنه سُمح لها بالخروج لحاجتها، فدل ذلك على أن الأصل بقاؤها في بيتها"],"answer":3,"why":"عن عائشة رضي الله عنها قالت: خرجت سودة بنت زمعة ليلًا فرآها عمر فعرفها... فأنزل الله عليه، فرفع عنه وهو يقول: «قد أذن الله لكن أن تخرجن لحوائجكن» (رواه البخاري)، فبما أنه سمح لها بالخروج للحاجة، فهذا يعني أن الأصل بقاؤها في بيتها.","ref":"ص 8"},{"q":"ما قول النبي ﷺ في عائشة رضي الله عنها حين سألته عن الجهاد؟","options":["«الجهاد فرض عليكن»","«لا جهاد ولا حج»","«لكن أحسن الجهاد وأجمله الحج»","«أفضل الجهاد الغزو»"],"answer":2,"why":"سقط فرضية الجهاد عن النساء ليبقين في بيوتهن؛ عن عائشة رضي الله عنها قالت: «قلت يا رسول الله، ألا نغزو ونجاهد معكم؟ فقال: «لكن أحسن الجهاد وأجمله الحج»» (رواه البخاري).","ref":"ص 8"}],"12":[{"q":"ما تعريف الاختلاط بحسب الدرس؟","options":["اجتماع النساء والرجال من غير المحارم في مكان واحد بلا حائل من غير موجب","اجتماع النساء مع بعضهن","اجتماع الرجال مع محارمهم","كل لقاء يجمع الأسرة"],"answer":0,"why":"تعريف الاختلاط: هو اجتماع النساء والرجال من غير المحارم في مكان واحد بلا حائل من غير موجب.","ref":"ص 2"},{"q":"ما الضروريات الخمس التي جاءت الشريعة ومقاصدها لحفظها بحسب الدرس؟","options":["الدين، والعلم، والعمل، والمال، والصحة","النسب، والجاه، والمال، والعقل، والبدن","الصلاة، والزكاة، والصيام، والحج، والشهادة","الدين، والعرض، والنفس، والمال، والعقل"],"answer":3,"why":"جاءت الشريعة ومقاصدها لحفظ الضروريات الخمس (الدين، العرض، النفس، المال، العقل)، ومن مقاصد الشريعة العامة المتعلقة بالاختلاط لحفظ العرض: النهي عن الفواحش وما يؤدي إليها.","ref":"ص 3"},{"q":"ماذا قال النبي ﷺ عن الحمو (أقارب الزوج غير آبائه وأبنائه) في الحديث الذي ذكره الدرس؟","options":["«الحمو أخٌ للمرأة»","«الحمو مأمون دائمًا»","«الحمو الموت»","«الحمو لا بأس به»"],"answer":2,"why":"قال ﷺ: «إياكم والدخول على النساء»، فقال رجل من الأنصار: يا رسول الله، أفرأيت الحمو؟ قال: «الحمو الموت» (رواه البخاري). ويقول النووي: فمعناه أن الخوف منه أكثر من غيره، والشر يتوقع منه والفتنة أكثر؛ لتمكنه من الوصول إلى المرأة والخلوة من غير أن يُنكر عليه، بخلاف الأجنبي.","ref":"ص 3"},{"q":"ما حكم الخلوة بالمرأة الأجنبية بحسب الدرس، وما الدليل؟","options":["جائزة دائمًا","محرمة، وقد نُقل الإجماع على ذلك؛ وقال ﷺ: «لا يخلونّ رجل بامرأة إلا مع ذي محرم»","مكروهة فقط","مباحة بإذن الأهل"],"answer":1,"why":"قال ﷺ: «لا يخلونّ رجل بامرأة إلا مع ذي محرم» (رواه البخاري)، وقد نُقل الإجماع على تحريم الخلوة بالمرأة الأجنبية جماعة من أهل العلم كالإمام النووي وابن حجر والشوكاني.","ref":"ص 3"},{"q":"ما الحكمة من الأمر بالتفريق بين الأولاد في المضاجع بحسب الدرس؟","options":["تربيتهم على العفة وهم صغار وإخوة، فكيف بمن هم أكبر منهم وبغير الأقارب؟","توفير المساحة فقط","تعليمهم النظام","لا حكمة معلومة"],"answer":0,"why":"قال رسول الله ﷺ: «مروا أولادكم بالصلاة وهم أبناء سبع سنين، واضربوهم عليها وهم أبناء عشر، وفرقوا بينهم في المضاجع» (رواه أبو داود)، والهدف من التفريق في المضاجع واضح وهو تربيتهم على العفة، هذا وهم صغار وإخوة فكيف بمن هم أكبر منهم وبغير الأقارب؟","ref":"ص 4"},{"q":"ماذا قال النبي ﷺ للنساء حين رآهن يختلطن بالرجال في الطريق؟","options":["«سرن في وسط الطريق»","«أسرعن في المشي»","«لا بأس بأي موضع»","«استأخرن؛ فإنه ليس لكنّ أن تحقُقن الطريق، عليكنّ بحافات الطريق»"],"answer":3,"why":"نهي المرأة عن المشي وسط الطريق في حضرة الرجال، قال رسول الله ﷺ: «استأخرن؛ فإنه ليس لكن أن تحقُقن الطريق، عليكن بحافات الطريق» (رواه أبو داود).","ref":"ص 4"},{"q":"ما خير صفوف النساء وشرها في الصلاة مع الرجال بحسب الحديث الذي ذكره الدرس؟","options":["«خير صفوف النساء أولها»","«الصفوف كلها سواء»","«خير صفوف الرجال أولها وشرها آخرها، وخير صفوف النساء آخرها وشرها أولها»","«خير الصفوف ما كان وسطًا»"],"answer":2,"why":"قال رسول الله ﷺ: «خير صفوف الرجال أولها وشرها آخرها، وخير صفوف النساء آخرها وشرها أولها» (رواه مسلم). يقول النووي: وإنما فُضّل آخر صفوف النساء الحاضرة مع الرجال لبعدهن من مخالطة الرجال والتعلق بهم عند رؤية حركاتهم وسماع كلامهم.","ref":"ص 5"},{"q":"ماذا قالت أم سلمة رضي الله عنها عن انصراف النساء بعد التسليم من الصلاة؟","options":["كان الرجال والنساء يخرجون معًا","كان رسول الله ﷺ إذا سلّم قام النساء حين يقضي تسليمه، ومكث يسيرًا قبل أن يقوم","كان النساء يمكثن بعد الرجال طويلًا","لم يكن ﷺ يمكث بعد التسليم"],"answer":1,"why":"تقول أم سلمة رضي الله عنها: «كان رسول الله ﷺ إذا سلّم قام النساء حين يقضي تسليمه، ومكث يسيرًا قبل أن يقوم» (رواه البخاري)؛ فبعد الصلاة يتأخر الرجال وتخرج النساء قبلهم.","ref":"ص 5"},{"q":"ما القاعدتان الفقهيتان المذكورتان في أحكام المقاصد عند الحديث عن الاختلاط؟","options":["سدّ الذرائع وإغلاق الأبواب المنفذة إلى الشر، ودرء المفاسد مقدّم على جلب المصالح، وقاعدة الضرر يُزال","الأصل في الأشياء الإباحة فقط","العادة محكّمة فقط","الضرورات تبيح كل المحظورات دائمًا"],"answer":0,"why":"أحكام المقاصد: الوسائل لها أحكام المقاصد، وإغلاق الأبواب المنفذة إلى الشر، والاختلاط يفتح الباب لشرور كبيرة. درء المفاسد مقدم على جلب المصالح، ولا شك أن الاختلاط فيه مفاسد عظيمة. قاعدة الضرر يُزال، ولا شك أن الضرر في الاختلاط كبير.","ref":"ص 6"},{"q":"كيف بدأ انتشار الاختلاط في مجتمعات المسلمين بحسب ما نقله الدرس عن الطنطاوي؟","options":["بدأ من الأسواق فقط","بدأ من المساجد","بدأ من البيوت","بدأ من رياض الأطفال، ثم برامج الأطفال في الإذاعة، ثم تسليم التعليم لمعلمات، ثم انتشر في كل مكان"],"answer":3,"why":"يقول الطنطاوي رحمه الله: «بدأ الاختلاط من رياض الأطفال، ولما جاءت الإذاعة انتقل منها إلى برامج الأطفال... ثم سلّموا التعليم لمعلمات بدل معلمين، ثم بعد ذلك انتشر الاختلاط في كل مكان»، فهكذا ظهر الاختلاط وهكذا انتشر تدريجيًّا في بلاد المسلمين.","ref":"ص 8"}],"13":[{"q":"ما الذي وجب على المرأة المسلمة في ظل الهجمة على دينها ومبادئها بحسب الدرس؟","options":["ترك الثوابت مجاراةً للواقع","تفقّد التزامها بثوابتها","الانعزال عن الناس","إهمال التفكير"],"answer":1,"why":"تواجه المرأة المسلمة اليوم هجمة شرسة على دينها ومبادئها وثوابتها التي تعتبر بمثابة تثبيت لها حتى تستقيم؛ لذا وجب على المرأة المسلمة تفقّد التزامها بثوابتها.","ref":"ص 2"},{"q":"بماذا ربط الدرس الهموم عند المرأة المسلمة؟","options":["الهموم على قدر الهمم؛ فكلما علت همة المرأة كبر همها","الهموم على قدر المال","الهموم على قدر العمر","الهموم على قدر الأصدقاء"],"answer":0,"why":"ما هي الهموم التي تحملها المرأة المسلمة؟ الهموم على قدر الهمم؛ فكلما علت همة المرأة المسلمة كبر همها، والمسلمة لا ينبغي لها أن تخبو همتها أو تفتر.","ref":"ص 2"},{"q":"ماذا قال النبي ﷺ في الحديث الذي ذكره الدرس عن معالي الأمور وسفسافها؟","options":["«إن الله يحب الدنيا وزينتها»","«إن الله يحب كثرة الكلام»","«إن الله يكره العمل مطلقًا»","«إن الله تعالى يحب معالي الأمور وأشرافها، ويكره سفسافها»"],"answer":3,"why":"قال ﷺ: «إن الله تعالى يحب معالي الأمور وأشرافها، ويكره سفسافها» (أخرجه الطبراني)؛ والشيء السفساف بمعنى المتدني الذي ليس فيه همة.","ref":"ص 2"},{"q":"ما واقع بعض فتيات المسلمين اليوم الذي ذكره الدرس عن تدني الهمم؟","options":["هممهن عالية في الدار الآخرة كلهن","كلهن مشغولات بحفظ القرآن","همّ بعضهن في علاقة غير شرعية أو في تتبّع الهاتف، وهمّ أخرى في زينتها ومظهرها، وأخرى في شهادة أكاديمية دون التفكير في الزواج والإنجاب وتربية الأجيال","لا يشغلهن شيء"],"answer":2,"why":"نجد الكثير من الفتيات المسلمات قد تدنت همم بعضهن؛ فتجد الواحدة قد فارق النوم أجفانها وأقلق التفكير... وتجد الأخرى كل همها في زينتها وكيف تعتني بجسمها... وتجد أخرى تتمحور حياتها حول شهادة أكاديمية تعلّق عليها آمالها... فلا تفكر في الزواج ولا في الإنجاب ولا في تربية الأجيال الصالحة.","ref":"ص 3"},{"q":"ما أول هموم الفتاة العزباء بحسب الدرس؟","options":["أن تنشغل بالدراسة فقط","أن تكون مطيعة لربها فلا تبتغي إلا وجهه في كل حركاتها وسكناتها","أن تتفرغ للسفر","أن تتجمل للناس"],"answer":1,"why":"هموم الفتاة العزباء: ١) أن تكون مطيعة لربها: فلا تبتغي إلا وجهه في كل حركاتها وسكناتها، ويجب أن يكون للفتاة التي لم تتزوج تصور صحيح عن الحياة الدنيا وفق المنهج القويم دون انحراف. ٢) أن تكون متمسكة بدينها. ٣) أن تكون متطلعة للدار الآخرة. ٤) الدعاء بالزوج الصالح.","ref":"ص 3-4"},{"q":"ماذا ينبغي للفتاة العزباء أن تسأل ربها في الدعاء بحسب الدرس؟","options":["أن يرزقها زوجًا صالحًا يعينها على أمر دينها ودنياها، وتُلحّ عليه في الدعاء","أن يرزقها المال فقط","أن يبعدها عن الزواج","ألا تدعو إطلاقًا"],"answer":0,"why":"الدعاء بالزوج الصالح: ينبغي أن تسأل الفتاة العزباء ربها وتُلحّ عليه في الدعاء أن يرزقها زوجًا صالحًا يعينها على أمر دينها ودنياها، فدورة الحياة الطبيعية أن تتزوج المرأة فلا تنشغل عنه بدراسة أو عمل، بل تسعى جاهدة للزواج من الرجل الصالح وتقدّم تنازلات دنيوية لتيسير ذلك.","ref":"ص 4"},{"q":"ما أول هموم المرأة المتزوجة وما خير النساء في الحديث الذي ذكره الدرس؟","options":["الاهتمام بالزينة؛ وخير النساء من تكثر الخروج","الاهتمام بالمال؛ وخير النساء الغنية","السفر؛ وخير النساء من تسافر","طاعة الله والتزامها بشرعه؛ وخير النساء: الودود الولود المواتية المواسية إذا اتقى الله"],"answer":3,"why":"هموم المرأة المتزوجة: ١) طاعة الله والتزامها بشرعه، ٢) الحرص على أن تكون زوجة صالحة؛ قال رسول الله ﷺ: «خير نسائكم الودود الولود المواتية المواسية إذا اتقى الله» (أخرجه البيهقي)، ٣) الحرص على تحقيق معنى السكن للزوج، ٤) إعانة الزوج على طاعة الله.","ref":"ص 4"},{"q":"ماذا قال النبي ﷺ عن المرأة التي ماتت وزوجها عنها راضٍ؟","options":["«فهي في النار»","«لا يضرها شيء»","«أيما امرأة ماتت وزوجها عنها راضٍ دخلت الجنة»","«فلا أجر لها»"],"answer":2,"why":"قال رسول الله ﷺ: «أيما امرأة ماتت وزوجها عنها راضٍ دخلت الجنة» (أخرجه الترمذي)؛ فالزوجة المؤمنة تحرص على رضا زوجها بموقف أو بكلمة أو بطاعة.","ref":"ص 4"},{"q":"ما أول ما تعلّمه الأم أولادها بحسب الدرس، وما الحديث الذي ذُكر؟","options":["الدراسة، وحديث: «اطلبوا العلم»","الإيمان، وحديث ابن عباس: «احفظ الله يحفظك، احفظ الله تجده تجاهك»","الصناعة، وحديث: «كل ميسر لما خُلق له»","الرياضة، وحديث: «المؤمن القوي»"],"answer":1,"why":"هم الأم المربية الأكبر بعد طاعة الله ورضاه: أن تربي أبناءها تربية صحيحة شاملة كاملة وفق ما يحبه الله ويرضاه، فتربيهم على: ١) الإيمان: فهو أول ما تعلمه الأم لأولادها، قال رسول الله ﷺ لابن عباس رضي الله عنهما: «احفظ الله يحفظك، احفظ الله تجده تجاهك، إذا سألت فاسأل الله، وإذا استعنت فاستعن بالله» (أخرجه الترمذي).","ref":"ص 5"},{"q":"ما التربية التي تحرص عليها المرأة المربية في الدعوة إلى الله بحسب الدرس؟","options":["تربية ولدها صالحًا مصلحًا يدعو إلى الله بحاله قبل مقاله، ولا يبخل على غيره بالنصح والوعظ، ويخدم دينه بكل ما أوتي من قوة ووسيلة","تربيته للدنيا فقط","تربيته على الانعزال","تربيته على ترك الدعوة"],"answer":0,"why":"من خلال تعليمهم قصص الأنبياء المذكورة في القرآن، والمرأة المربية تحرص على تربية ولدها بارًّا بوالديه، لينًا مع إخوته، صالحًا: فيكون مؤمنًا محافظًا على صلاته وأذكاره معتصمًا بقرآنه محتشمًا، ومصلحًا: يدعو إلى الله بحاله قبل مقاله، ولا يبخل على غيره بالنصح والوعظ، يخدم دينه بكل ما أوتي من قوة ووسيلة.","ref":"ص 5"}],"14":[{"q":"بمَ شبّه الدرس وجود الإنسان في هذه الحياة؟","options":["بوجود المالك في بيته","بوجود المسافر الدائم","بوجود الضيف في البيت، فلا بد أن يرحل يومًا إلى مقره وآخرته","بوجود الغريب الذي لا يرحل"],"answer":2,"why":"وجود الإنسان في هذه الحياة هو بمثابة وجود الضيف في البيت، فلا بد في يوم من الأيام أن يرحل إلى مقره وآخرته وهو المنتهى الأعظم حيث الجزاء والحساب.","ref":"ص 2"},{"q":"ماذا قال أحد الصالحين عن الدنيا والآخرة بحسب الدرس؟","options":["«الدنيا مقبلة والآخرة مدبرة»","«ارتحلت الدنيا مدبرة، وارتحلت الآخرة مقبلة، ولكل واحدة منهما بنون، فكونوا من أبناء الآخرة، ولا تكونوا من أبناء الدنيا»","«كونوا من أبناء الدنيا»","«لا فرق بين الدنيا والآخرة»"],"answer":1,"why":"قال أحد الصالحين: «ارتحلت الدنيا مدبرة، وارتحلت الآخرة مقبلة، ولكل واحدة منهما بنون، فكونوا من أبناء الآخرة، ولا تكونوا من أبناء الدنيا، فإن اليوم عمل ولا حساب وغدًا حساب ولا عمل».","ref":"ص 2"},{"q":"ما أول منازل الآخرة بحسب الحديث الوارد في الدرس؟","options":["القبر","الصراط","الحشر","الميزان"],"answer":0,"why":"قال ﷺ: «إن القبر أول منازل الآخرة، فإن نجا منه فما بعده أيسر منه، وإن لم ينج منه فما بعده أشد منه» (رواه ابن ماجه).","ref":"ص 3"},{"q":"ماذا قال سفيان الثوري رحمه الله عن ذكر القبر؟","options":["«ذكر القبر يورث الحزن فقط»","«لا فائدة من ذكر القبر»","«ذكر القبر للمرضى فقط»","«من أكثر ذكر القبر وجده روضة من رياض الجنة، ومن غفل عنه وجده حفرة من حفر النار»"],"answer":3,"why":"يقول سفيان الثوري رحمه الله: «من أكثر ذكر القبر وجده روضة من رياض الجنة، ومن غفل عنه وجده حفرة من حفر النار».","ref":"ص 3"},{"q":"ماذا قال عمر بن عبد العزيز رحمه الله حين سُئل عن بدء إنابته إلى الله؟","options":["قال: قرأت كتابًا في الطب","قال: سافرت إلى بلد بعيد","قال: أردت ضرب غلام لي فقال: يا عمر! اذكر ليلة صبيحتها يوم القيامة","قال: رأيت منامًا"],"answer":2,"why":"قيل لعمر بن عبد العزيز رحمه الله: ما كان بدء إنابتك إلى الله؟ قال: «أردت ضرب غلام لي فقال: يا عمر! اذكر ليلة صبيحتها يوم القيامة» (يعني القبر)؛ فذكر القبر والدار الآخرة رادع عن الظلم.","ref":"ص 3"},{"q":"ماذا ينتظر الميت في قبره بحسب حديث «إن الميت يسمع خفق نعالهم...»؟","options":["لا شيء يأتيه","تأتي الأعمال الصالحة تدفع عنه العذاب: الصلاة عند رأسه، والصيام عن يمينه، والزكاة عن شماله، وفعل الخيرات عند رجليه","يأتيه المال الذي جمعه","يأتيه الأصدقاء"],"answer":1,"why":"قال ﷺ: «إن الميت يسمع خفق نعالهم حين يولون عنه... فإن كان مؤمنًا كانت الصلاة عند رأسه، وكان الصيام عن يمينه، وكانت الزكاة عن شماله، وكان فعل الخيرات من الصدقة والصلة والمعروف والإحسان إلى الناس عند رجليه...» (رواه ابن حبان)، فالأعمال الصالحة تمنع عن المسلم العذاب.","ref":"ص 5"},{"q":"ما الخمس التي هي أثقل شيء في الميزان بحسب الحديث الذي ذكره الدرس؟","options":["سبحان الله، والحمد لله، ولا إله إلا الله، والله أكبر، والولد الصالح يتوفى للمسلم فيحتسبه","الصلاة والصيام والزكاة والحج والجهاد","المال والجاه والعلم والنسب والملك","الشهادة والصدقة والعتق والصلة والبر"],"answer":0,"why":"قال رسول الله ﷺ: «بخٍ بخٍ لخمس ما أثقلهن في الميزان: سبحان الله، والحمد لله، ولا إله إلا الله، والله أكبر، والولد الصالح يُتوفى للمسلم فيحتسبه» (رواه الحاكم)، وقال ﷺ: «أثقل شيء في الميزان الخلق الحسن» (رواه ابن حبان).","ref":"ص 5"},{"q":"ما الذي يقوم على جنبتي الصراط بحسب الحديث الذي ذكره الدرس؟","options":["الصدقة والزكاة","الصلاة والصيام","العلم والعمل","الأمانة والرحم"],"answer":3,"why":"قال ﷺ: «وتُرسَل الأمانة والرحم، فتقومان جنبتي الصراط يمينًا وشمالًا» (رواه مسلم)، وتذكّر هذا المشهد يعينه على الالتزام بالأمانة وصلة الرحم والقيام بالأعمال الصالحة والاستمرار عليها.","ref":"ص 6"},{"q":"ما الثلاثة الذين هم أول من تُسعَّر بهم النار يوم القيامة بحسب الحديث الذي ذكره الدرس؟","options":["الصائم والحاج والمجاهد","العالم والتاجر والكاتب","قارئ القرآن، والمتصدق كثير المال، والمقاتل في سبيل الله، لأنهم لم يخلصوا أعمالهم لله وأرادوا أن يقال: قارئ وجواد وجريء","الإمام والخطيب والمؤذن"],"answer":2,"why":"عن أبي هريرة رضي الله عنه: قال رسول الله ﷺ: «...أولئك الثلاثة أول خلق الله تُسعَّر بهم النار يوم القيامة» (رواه الترمذي)؛ وهم: رجل جمع القرآن، ورجل كثير المال، ورجل قُتل في سبيل الله، لم يخلصوا هذه الأعمال العظيمة لله عز وجل.","ref":"ص 7"}],"15":[{"q":"كيف عرّف عمر بن الخطاب رضي الله عنه الاستقامة؟","options":["«هي أن تكثر من الكلام»","«هي أن تتجنب الناس»","«هي أن تتبع الهوى»","«هي أن تعمل بأمر الله ولا تروغ روغان الثعالب»"],"answer":3,"why":"الاستقامة كما عرّفها عمر بن الخطاب رضي الله عنه: «هي أن تعمل بأمر الله ولا تروغ روغان الثعالب»، وعرّفها العلماء بأنها فعل الأمر واجتناب النهي والوقوف عند الحد والثبات على ذلك.","ref":"ص 2"},{"q":"ما الآية التي أمر الله فيها نبيه ﷺ بالاستقامة بحسب الدرس؟","options":["﴿إنا أعطيناك الكوثر﴾","﴿قل هو الله أحد﴾","﴿فاستقم كما أمرت ومن تاب معك ولا تطغوا إنه بما تعملون بصير﴾","﴿وما أرسلناك إلا رحمة للعالمين﴾"],"answer":2,"why":"قال الله تعالى: ﴿فاستقم كما أمرت ومن تاب معك ولا تطغوا إنه بما تعملون بصير﴾ [هود: 112]، أمر الله نبيه ﷺ أن يستقيم وأن يسير على النهج الصحيح، وأن يثبت على ذلك.","ref":"ص 2"},{"q":"ماذا وعد الله المستقيمين في قوله: ﴿إن الذين قالوا ربنا الله ثم استقاموا تتنزل عليهم الملائكة﴾؟","options":["أن يعطيهم المال الوفير","أن الملائكة تتنزل عليهم: ألا تخافوا ولا تحزنوا وأبشروا بالجنة","أن يرفع عنهم الفرائض","أن يعيشوا بلا ابتلاء"],"answer":1,"why":"قال تعالى: ﴿إن الذين قالوا ربنا الله ثم استقاموا تتنزل عليهم الملائكة ألا تخافوا ولا تحزنوا وأبشروا بالجنة التي كنتم توعدون﴾ [فصلت: 30]؛ فالله تعالى وعدهم بجنات النعيم وأن الملائكة تتنزل عليهم، ففي دنياهم مطمئنون آمنون وفي آخرتهم سالمون.","ref":"ص 2"},{"q":"ماذا قال سفيان بن عبد الله الثقفي للنبي ﷺ، وبماذا أجابه؟","options":["قال: قل لي في الإسلام قولًا لا أسأل عنه أحدًا غيرك، فقال ﷺ: «قل آمنت بالله ثم استقم»","قال: ما أفضل المال؟ فأجابه: التجارة","قال: ما أفضل الأيام؟ فأجابه: الجمعة","قال: كم عدد الصلوات؟ فأجابه: خمس"],"answer":0,"why":"قال الصحابي سفيان بن عبد الله الثقفي رضي الله عنه: قلت: يا رسول الله، قل لي في الإسلام قولًا لا أسأل عنه أحدًا بعدك — وفي حديث أبي أسامة غيرك — قال: «قل: آمنت بالله، ثم استقم» (أخرجه أحمد).","ref":"ص 2"},{"q":"ماذا قال النبي ﷺ عن الإيمان في القلب؟","options":["«الإيمان لا يتغير أبدًا»","«الإيمان يزداد دون عمل»","«الإيمان يكفي مرة واحدة»","«إن الإيمان ليخلَق في جوف أحدكم كما يخلَق الثوب، فاسألوا الله أن يجدد الإيمان في قلوبكم»"],"answer":3,"why":"قال ﷺ: «إن الإيمان ليخلَق في جوف أحدكم كما يخلَق الثوب، فاسألوا الله أن يجدد الإيمان في قلوبكم» (أخرجه الطبراني)، وهذا الحديث أمر صريح بتجديد الإيمان؛ فكما يحافظ الإنسان على ثيابه غسلًا وإصلاحًا، فإن تجديد الإيمان أولى.","ref":"ص 2"},{"q":"ما أولى الوسائل المعينة على الاستقامة التي ذكرها الدرس؟","options":["كثرة السفر","جمع المال","تدبر القرآن العظيم","قلة الكلام"],"answer":2,"why":"وسائل تعين على الاستقامة: ١) تدبر القرآن العظيم، فهو من أهم أسباب زيادة الإيمان؛ قال تعالى: ﴿وإذا ما أنزلت سورة فمنهم من يقول أيكم زادته هذه إيمانًا فأما الذين آمنوا فزادتهم إيمانًا وهم يستبشرون﴾ [التوبة: 124].","ref":"ص 3"},{"q":"ما الآية التي قال ابن عباس رضي الله عنهما إنها أشد وأشق آية على رسول الله ﷺ في القرآن؟","options":["﴿قل هو الله أحد﴾","﴿فاستقم كما أمرت﴾","﴿إنا فتحنا لك فتحًا مبينًا﴾","﴿ألم نشرح لك صدرك﴾"],"answer":1,"why":"وقال ابن عباس رضي الله عنهما: «ما نزلت على رسول الله ﷺ في جميع القرآن آية كانت أشد ولا أشق عليه من هذه الآية ﴿فاستقم كما أمرت﴾»، وقال ﷺ: «شيّبتني هود، والواقعة، والمرسلات، وعمّ يتساءلون، وإذا الشمس كورت» (رواه الترمذي).","ref":"ص 3"},{"q":"ما المراحل الأربع لمحاسبة النفس لتحقيق الاستقامة بحسب الدرس؟","options":["المشارطة، والمراقبة، والمحاسبة على النتائج، والمعاقبة والمكافأة","القراءة والكتابة والحفظ والمراجعة","السفر والنزهة والراحة والنوم","التخطيط والتنفيذ والنشر والبيع"],"answer":0,"why":"محاسبة النفس لتحقيق الاستقامة: أ) المشارطة: أن يشارط المسلم نفسه إذا أصبح أن يحفظ جوارحه، ب) المراقبة: أي متابعة النفس فيما اشترط عليها، ج) المحاسبة على النتائج وموعدها في نهاية اليوم، د) المعاقبة إن خالفت والمكافأة إن أحسنت.","ref":"ص 5"},{"q":"ماذا قال النبي ﷺ عمّن يصاحب في الحديث الذي ذكره الدرس؟","options":["«صاحب كل من تلقى»","«لا يضر الصاحب شيئًا»","«صاحب أهل المال فقط»","«لا تصاحب إلا مؤمنًا، ولا يأكل طعامك إلا تقي»"],"answer":3,"why":"جاء النهي النبوي صريحًا واضحًا في هذا الجانب، قال ﷺ: «لا تصاحب إلا مؤمنًا، ولا يأكل طعامك إلا تقي» (رواه أبو داود)، لأن آثار الصحبة واضحة سلبًا أو إيجابًا.","ref":"ص 7"},{"q":"ما طرق التعامل مع الفتور بحسب الدرس، وما الحديث الذي ذُكر؟","options":["الاستسلام للفتور، وحديث: «لا فتور»","ترك العمل نهائيًّا","المسارعة للإفاقة، وإدراك المواطن التي تسبب الفتور وتجنبها، ودراسة نقاط الضعف والقوة؛ وحديث: «لكل عمل شِرّة، ولكل شِرّة فترة»","انتظار الفتور حتى يزول"],"answer":2,"why":"معرفة طرق التعامل مع الفتور: قال ﷺ: «لكل عمل شِرّة، ولكل شِرّة فترة» (أخرجه أحمد)؛ ولا بد من حسن التعامل معه حتى لا يوقع في المعاصي، وذلك من خلال: المسارعة للإفاقة وكلما سارع المؤمن كان أفضل له، وإدراك المواطن التي تسبب الفتور وتجنبها، ودراسة نقاط الضعف والقوة حتى لا يعود الفتور مرة أخرى.","ref":"ص 7-8"}]}};
  Object.keys(QBANK).forEach(function (sid) {

  /* نموذج تجريبي لآلية الاختبار فقط، وليس من مواد الأكاديمية */
  var DEMO = {
    title: 'نموذج تجريبي لآلية الاختبار',
    questions: [
      { q: 'أي الطرق أنفع لتثبيت المعلومة بعد قراءة الملخص؟', options: ['إعادة قراءته مرارًا بالسرعة نفسها', 'محاولة استرجاعها من الذاكرة ثم مقارنتها بالملخص', 'تظليل الصفحة كاملة بلون واحد', 'تأجيل المراجعة إلى ليلة الاختبار'], answer: 1, why: 'الاسترجاع الذاتي يكشف مواضع الضعف ويقوّي التثبيت أكثر من إعادة القراءة السلبية.', ref: '' },
      { q: 'ما الأنسب لمراجعة مادة من خمس عشرة محاضرة؟', options: ['حشدها كلها في ليلة واحدة', 'مراجعة محاضرة أو محاضرتين كل يوم', 'الاكتفاء بالمحاضرات الأولى', 'تجاهل الأسئلة والاكتفاء بالملخصات'], answer: 1, why: 'التوزيع على أيام متعددة يمنح الذاكرة فرصة للتثبيت ويخفف الضغط.', ref: '' },

  };

  var STORE_KEY = 'aj-review-portal-v1';
  var store = {};
  try { store = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { store = {}; }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {} }
  function getL(sid, n) { return (store[sid] && store[sid][n]) || {}; }
  function setL(sid, n, patch) {
    store[sid] = store[sid] || {};
    var cur = store[sid][n] || {};
    for (var k in patch) cur[k] = patch[k];
    store[sid][n] = cur;
    save();
  }

  var $root = document.getElementById('root');
  var ARABIC_DIGITS = '٠١٢٣٤٥٦٧٨٩';
  var LETTERS = ['أ', 'ب', 'ج', 'د'];

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function norm(s) {
    return String(s).toLowerCase()
      .replace(/[ً-ٰٟـ]/g, '')
      .replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
      .replace(/[٠-٩]/g, function (d) { return ARABIC_DIGITS.indexOf(d); })
      .replace(/\s+/g, ' ').trim();
  }
  function lecMatch(l, n, nq) {
    if (!nq) return true;
    if (/^\d+$/.test(nq)) return parseInt(nq, 10) === n;
    return norm(l.title + ' محاضره ' + n + ' ' + pad2(n)).indexOf(nq) !== -1;
  }
  function subj(id) { for (var i = 0; i < SUBJECTS.length; i++) if (SUBJECTS[i].id === id) return SUBJECTS[i]; return null; }

  function status(sid, n) {
    var s = getL(sid, n);
    var sum = !!s.summary, quiz = (s.attempts || 0) > 0;
    if (sum && quiz) return { cls: 's3', text: 'اكتملت المراجعة' };
    if (quiz) return { cls: 's2', text: 'تم أداء الاختبار' };
    if (sum) return { cls: 's1', text: 'تمت مراجعة الملخص' };
    return { cls: '', text: 'لم تبدأ المراجعة' };
  }
  function completedCount(sid) {
    var c = 0;
    for (var n = 1; n <= 15; n++) { var s = getL(sid, n); var L = subj(sid).lectures[n - 1]; var hasQ = L.questions && L.questions.length > 0; if (s.summary && (!hasQ || (s.attempts || 0) > 0)) c++; }
    return c;
  }

  function icon(name) {
    var p = {
      mind: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
      star: '<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/>',
      book: '<path d="M3 5.5C5.5 4.5 9 4.5 12 6.5c3-2 6.5-2 9-1V19c-2.5-1-6-1-9 1-3-2-6.5-2-9-1z"/><path d="M12 6.5V20"/>',
      dome: '<path d="M4 20h16M6 20v-5a6 6 0 0 1 12 0v5M12 9V3"/>',
      grid: '<rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.5"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="1.5"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.5"/><rect x="13" y="13" width="7.5" height="7.5" rx="1.5"/>'
    }[name];
    return '<span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24">' + p + '</svg></span>';
  }

  /* ---------- الحالة والتنقل ---------- */
  var view = { name: 'home' };
  var Q = null;
  var subjQuery = '';

  function go(v, opts) {
    view = v;
    render();
    if (!opts || !opts.keepScroll) window.scrollTo(0, 0);
    var h = v.name === 'subject' ? '#subject-' + v.sid : (v.name === 'home' ? '' : null);
    if (h !== null) {
      try {
        if (h === '') { if (location.hash) history.pushState(null, '', location.pathname + location.search); }
        else if (location.hash !== h) location.hash = h;
      } catch (e) {}
    }
  }
  window.addEventListener('hashchange', function () {
    var m = /^#subject-(s[1-5])$/.exec(location.hash);
    if (m) { if (!(view.name === 'subject' && view.sid === m[1])) { view = { name: 'subject', sid: m[1] }; render(); window.scrollTo(0, 0); } }
    else if (view.name !== 'quiz' && view.name !== 'result' && view.name !== 'review' && view.name !== 'read') { view = { name: 'home' }; render(); }
  });

  /* ---------- الأجزاء المشتركة ---------- */
  function topbar() {
    var logo = LOGO_SRC ? '<img src="' + LOGO_SRC + '" alt="شعار أكاديمية هندسة الأجيال">' : '';
    return '<header class="topbar"><div class="brand">' + logo + '<span>أكاديمية هندسة الأجيال</span></div>' +

  function renderHome() {

        '<div><div class="bar-row"><span>تقدم المراجعة</span><span>' + done + ' من 15</span></div>' + bar(pct) + '</div>' +

  function renderHomeResults(q) {
    var box = document.getElementById('home-results');
    if (!box) return;
    var nq = norm(q);
    if (!nq) { box.innerHTML = ''; return; }
    var out = [];
    SUBJECTS.forEach(function (s) {
      s.lectures.forEach(function (l, i) {
        var n = i + 1;
        if (lecMatch(l, n, nq)) out.push({ s: s, n: n, l: l });
      });
    });
    if (!out.length) { box.innerHTML = '<p class="empty-note">لا توجد محاضرة بهذا الاسم. جرّبي رقم المحاضرة أو كلمة من عنوانها.</p>'; return; }
    box.innerHTML = out.slice(0, 20).map(function (r) {
      var t = r.l.title ? esc(r.l.title) : 'عنوان المحاضرة لم يُضف بعد';
      return '<button class="result" data-action="open-lecture" data-sid="' + r.s.id + '" data-n="' + r.n + '"><span><b>المحاضرة (' + pad2(r.n) + ')</b> · ' + t + '</span><span class="where">' + esc(r.s.name) + '</span></button>';
    }).join('');
  }

  /* ---------- صفحة المادة ---------- */
  function lectureCard(s, i) {
    var n = i + 1, l = s.lectures[i], st = status(s.id, n), rec = getL(s.id, n);
    var hasQ = l.questions && l.questions.length > 0;
    var title = l.title ? '<h3>' + esc(l.title) + '</h3>' : '<h3 class="todo">عنوان المحاضرة لم يُضف بعد</h3>';
    var sum = l.summary
      ? '<button class="btn btn-soft btn-wide" data-action="read" data-sid="' + s.id + '" data-n="' + n + '">الملخص المعتمد</button>'
      : '<span class="btn btn-soft btn-wide" aria-disabled="true">الملخص المعتمد</span><span class="note">رابط الملخص لم يُضف بعد</span>';
    var quiz = hasQ
      ? '<button class="btn btn-primary btn-wide" data-action="quiz" data-sid="' + s.id + '" data-n="' + n + '">اختبري استيعابكِ</button>'

        '<span class="desk">استخدمي زري «التالي» و«السابق» أو سهمي لوحة المفاتيح ← → للتنقل بين الصفحات.</span></p>' +

  function startReader() {

  function curCanvas() { var sh = $id('rd-sheet'); return sh ? sh.querySelector(':scope > canvas') : null; }
  function setSheet(c) {
    var sh = $id('rd-sheet'); if (!sh) return;

    c.style.transform = ''; c.style.transformOrigin = '';

  }
  function updateBar() {

  }
  var badgeT = null;
  function badge() {

  function savePos() { if (R.sid) setL(R.sid, R.n, { page: R.page }); }

  /* ----- التقليب ----- */
  var A = null;
  function endAnim() {
    if (!A) return;
    var a = A; A = null;
    a.anims.forEach(function (x) { try { x.cancel(); } catch (e) {} });

  }
  var REDUCE = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function flip(c, dir, fromT) {
    var sh = $id('rd-sheet'); if (!sh) return;
    endAnim();
    var cur = curCanvas();
    Array.prototype.slice.call(sh.querySelectorAll('.leaf')).forEach(function (x) { x.remove(); });

    var leaf = document.createElement('div'); leaf.className = 'leaf';
    var shade = document.createElement('i'); shade.className = 'leaf-shade';
    var opt = { duration: 430, easing: 'cubic-bezier(.33,.7,.3,1)', fill: 'forwards' };

      mine = { anims: [
        leaf.animate([{ transform: fromT || 'rotateY(0deg)' }, { transform: 'rotateY(-100deg)' }], opt),
        shade.animate([{ opacity: 0.08 }, { opacity: 0.6 }], opt)
      ], done: function () { leaf.remove(); } };
    } else {
      /* الصفحة السابقة تعود فتستقر فوق الحالية */
      leaf.appendChild(c); leaf.appendChild(shade); sh.appendChild(leaf);
      mine = { anims: [
        leaf.animate([{ transform: fromT || 'rotateY(-100deg)' }, { transform: 'rotateY(0deg)' }], opt),
        shade.animate([{ opacity: 0.6 }, { opacity: 0 }], opt)
      ], done: function () { setSheet(c); } };

    mine.anims[0].onfinish = function () { if (A === mine) endAnim(); };

  function gotoPage(p, fromT) {

    var dir = p > R.page ? 1 : -1, my = R.sess, tok = ++R.tok;
    R.page = p;
    savePos(); updateBar(); badge(); showResume();
    var wrap = $id('rd-wrap'), ready = doneCanvas(p);

    }, function () { if (wrap) wrap.classList.remove('busy'); if (my === R.sess) setMsg('err'); });
    keepTopVisible();
    return true;
  }

  /* ----- التكبير ----- */
  function updateZoomUi() {
    var v = $id('zoom-val'), zi = $id('zoom-in'), zo = $id('zoom-out'), note = $id('zoom-note'), st = $id('rd-stage');
    if (v) v.textContent = Math.round(R.zoom * 100) + '٪';
    if (zi) zi.disabled = R.zoom >= ZMAX;
    if (zo) zo.disabled = R.zoom <= ZMIN;
    if (st) st.classList.toggle('zoomed', R.zoom > 1);
    if (note) note.textContent = R.zoom > 1 ? 'حرّكي الصفحة المكبّرة بإصبعكِ، واستخدمي الأزرار للتقليب.' : 'قرّبي إصبعين أو باعديهما على الصفحة للتكبير والتصغير.';
  }
  function setZoom(z, keepCenter) {

    var st = $id('rd-stage');
    var fx = 0.5, fy = 0;
    if (st && R.zoom > 1 && keepCenter !== false) {

      fy = st.scrollTop / Math.max(1, st.scrollHeight);
    }
    if (z === R.zoom) { var c0 = curCanvas(); if (c0) { c0.style.transform = ''; c0.style.transformOrigin = ''; } return; }
    R.zoom = z; updateZoomUi();
    if (!R.src) return;
    var my = R.sess, tok = ++R.tok;
    getCanvas(R.page).then(function (c) {
      if (my !== R.sess || tok !== R.tok) return;
      endAnim(); setSheet(c); preload();
      if (st) { st.scrollLeft = Math.max(0, fx * st.scrollWidth - st.clientWidth / 2); st.scrollTop = fy * st.scrollHeight; }
    });
  }

  /* ----- اللمس: سحب أفقي للتقليب، وإصبعان للتكبير، والتمرير العمودي لا يقلب الصفحة ----- */
  var D = null, P = null, lastTouch = 0;
  function setT(el, t) { if (el) el.style.transform = t; }
  function dragTo(d, dx) {
    var w = layoutW(), cur = curCanvas();
    if (!cur) return;
    if (dx < 0) {
      if (d.leaf) { d.leaf.remove(); d.leaf = null; }
      if (R.page < R.pages) setT(cur, 'rotateY(' + clamp(dx / w * 115, -95, 0).toFixed(2) + 'deg)');
      else setT(cur, 'translateX(' + (dx * 0.12).toFixed(1) + 'px)');
    } else {
      var pc = R.page > 1 ? doneCanvas(R.page - 1) : null;
      if (pc && pc !== cur) {
        setT(cur, '');
        if (!d.leaf) {
          d.leaf = document.createElement('div'); d.leaf.className = 'leaf';
          d.leaf.appendChild(pc); pc.style.transform = '';
          $id('rd-sheet').appendChild(d.leaf);
        }
        setT(d.leaf, 'rotateY(' + clamp(-100 + dx / w * 115, -100, 0).toFixed(2) + 'deg)');
      } else setT(cur, 'translateX(' + (dx * (R.page > 1 ? 0.3 : 0.12)).toFixed(1) + 'px)');
    }
  }
  function cancelDrag(d) {
    var cur = curCanvas();
    if (cur && cur.style.transform) {
      var t = cur.style.transform, to = t.indexOf('rotateY') > -1 ? 'rotateY(0deg)' : 'translateX(0px)';
      cur.style.transform = '';
      if (cur.animate && !REDUCE) cur.animate([{ transform: t }, { transform: to }], { duration: 220, easing: 'ease-out' });
    }
    if (d.leaf) {
      var lf = d.leaf, lt = lf.style.transform; d.leaf = null;
      if (lf.animate && !REDUCE) { var a = lf.animate([{ transform: lt }, { transform: 'rotateY(-100deg)' }], { duration: 220, easing: 'ease-in', fill: 'forwards' }); a.onfinish = function () { lf.remove(); }; }
      else lf.remove();
    }
  }
  function onTouchStart(e) {
    lastTouch = Date.now();
    if (!R.src) return;
    if (e.touches.length === 2) {
      if (D && D.axis === 'x') cancelDrag(D);
      D = null;
      var a = e.touches[0], b = e.touches[1];
      P = { d0: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) || 1, z: R.zoom };
      return;
    }
    if (e.touches.length !== 1 || P) return;
    if (A) endAnim();
    var t = e.touches[0];
    D = { x: t.clientX, y: t.clientY, t: Date.now(), axis: null, dx: 0, leaf: null };
  }
  function onTouchMove(e) {
    if (P) {
      if (e.touches.length < 2) return;

      P.z = clamp(R.zoom * Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) / P.d0, ZMIN, ZMAX);
      var cur = curCanvas();
      if (cur) { cur.style.transformOrigin = 'center top'; cur.style.transform = 'scale(' + (P.z / R.zoom).toFixed(3) + ')'; }
      return;
    }
    if (!D || e.touches.length !== 1) return;
    var t = e.touches[0], dx = t.clientX - D.x, dy = t.clientY - D.y;
    if (!D.axis) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      /* عند التكبير يُترك السحب لتحريك الصفحة، ويُقرَّر الاتجاه مرة واحدة لكل لمسة */
      D.axis = (R.zoom === 1 && Math.abs(dx) > Math.abs(dy) * 1.3) ? 'x' : 'y';

  function onTouchEnd(e) {

    if (d.axis !== 'x') return;

    var go = Math.abs(dx) > Math.min(80, layoutW() * 0.2) || (Math.abs(dx) > 28 && v > 0.45);

    if (!go || target < 1 || target > R.pages) { cancelDrag(d); return; }
    var cur = curCanvas(), fromT = null;
    if (dir > 0) { fromT = cur ? cur.style.transform : null; if (fromT && fromT.indexOf('rotateY') < 0) fromT = null; }
    else if (d.leaf) { fromT = d.leaf.style.transform; }
    if (cur) cur.style.transform = '';
    gotoPage(target, fromT);
  }
  function bindStage() {
    var st = $id('rd-stage'); if (!st) return;
    st.addEventListener('touchstart', onTouchStart, { passive: true });
    st.addEventListener('touchmove', onTouchMove, { passive: false });
    st.addEventListener('touchend', onTouchEnd, { passive: true });

  }
  /* نقرة الفأرة على الحاسوب: يسار الصفحة للتالية، ويمينها للسابقة (اللمس يعتمد السحب) */
  function tapPage(e, el) {
    if (Date.now() - lastTouch < 800 || R.zoom > 1 || !R.src) return;

  }
  document.addEventListener('keydown', function (e) {
    if (view.name !== 'read' || !R.src || e.altKey || e.ctrlKey || e.metaKey) return;
    var tg = e.target, tn = tg && tg.tagName;
    if (tn === 'INPUT' || tn === 'TEXTAREA' || tn === 'SELECT' || (tg && tg.isContentEditable)) return;

  });

  window.addEventListener('resize', function () {
    clearTimeout(resizeT);
    resizeT = setTimeout(function () {
      if (view.name !== 'read' || !R.src) return;
      var w = layoutW(); if (w === lastW) return; lastW = w;
      var my = R.sess, tok = ++R.tok;
      getCanvas(R.page).then(function (c) { if (my === R.sess && tok === R.tok) { endAnim(); setSheet(c); preload(); } });
    }, 220);
  });

  var DL = null;
  function initDownload() {
    if (!(window.claude && window.claude.use)) return;
    window.claude.use('downloads').then(function (d) {
      DL = d; var b = document.getElementById('dl-btn'); if (b && d) b.hidden = false;
    }, function () {});
  }
  var SNAMES = { nafs: 'هندسة النفس', sahabiyat: 'سير الصحابيات', quran: 'التربية القرآنية', fiqh: 'فقه العبادات للمرأة المسلمة', markaziyat: 'مركزيات المرأة المسلمة' };
  function downloadSummary() {
    var msg = document.getElementById('dl-msg'); if (!DL) return;
    if (msg) msg.textContent = 'جارٍ التجهيز…';
    var src = summaryPdf(R.file, R.n);
    var ttl = (subj(R.sid).lectures[R.n - 1].title || '').replace(/[\\/:*?"<>|]/g, ' ');
    fetch(src).then(function (r) { if (!r.ok) throw new Error('x'); return r.blob(); })
      .then(function (b) { return DL.save({ filename: 'ملخص ' + SNAMES[R.file.split('_')[0]] + ' - المحاضرة ' + pad2(R.n) + ' - ' + ttl + '.pdf', data: b }); })

      .catch(function (e) { if (msg) msg.textContent = (e && e.code === 'declined') ? '' : 'تعذّر التنزيل الآن.'; });

  /* ---------- الأحداث ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action]');
    if (!t || t.type === 'checkbox') return;
    var a = t.getAttribute('data-action'), sid = t.getAttribute('data-sid'), n = parseInt(t.getAttribute('data-n'), 10);
    if (a === 'open-subject') { subjQuery = ''; go({ name: 'subject', sid: sid }); }
    else if (a === 'open-lecture') {
      subjQuery = ''; go({ name: 'subject', sid: sid });
      setTimeout(function () { var el = document.getElementById('lec-' + n); if (el) el.scrollIntoView({ block: 'center' }); }, 30);
    }

    else if (a === 'download-summary') { downloadSummary(); }

    else if (a === 'pg-prev') { gotoPage(R.page - 1); }
    else if (a === 'pg-next') { gotoPage(R.page + 1); }
    else if (a === 'pg-first') { gotoPage(1); }
    else if (a === 'zoom-in') { setZoom(R.zoom + 0.25); }
    else if (a === 'zoom-out') { setZoom(R.zoom - 0.25); }
    else if (a === 'reader-retry') { R.src = null; startReader(); }
    else if (a === 'done-read') { setL(R.sid, R.n, { summary: true }); go({ name: 'subject', sid: R.sid }); setTimeout(function () { var el = document.getElementById('lec-' + R.n); if (el) el.scrollIntoView({ block: 'center' }); }, 30); }
    else if (a === 'quiz-from-read') { startQuiz(R.sid, R.n); }
    else if (a === 'back-subject') { go({ name: 'subject', sid: R.sid }); }
    else if (a === 'quiz') { startQuiz(sid, n); }
    else if (a === 'demo') { startDemo(); }
    else if (a === 'check') { if (Q.picked[Q.i] != null) { Q.checked = true; render(); } }
    else if (a === 'next-q') {
      if (Q.i < Q.qs.length - 1) { Q.i++; Q.checked = false; render(); window.scrollTo(0, 0); } else finishQuiz();
    }
    else if (a === 'quit-quiz') { if (Q.demo) go({ name: 'home' }); else { go({ name: 'subject', sid: Q.sid }); } }
    else if (a === 'retry') { Q.i = 0; Q.picked = []; Q.checked = false; go({ name: 'quiz' }); }
    else if (a === 'review') { go({ name: 'review' }); }
    else if (a === 'to-result') { go({ name: 'result' }); }
    else if (a === 'next-lecture') { if (nextWithQuestions()) startQuiz(Q.sid, Q.n + 1); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.name === 'opt' && Q && !Q.checked) {
      Q.picked[Q.i] = parseInt(t.value, 10);

    } else if (t.getAttribute && t.getAttribute('data-action') === 'toggle-summary') {

    }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'home-search') renderHomeResults(e.target.value);
    else if (e.target.id === 'subj-search') {
      subjQuery = e.target.value;
      var s = subj(view.sid), el = document.getElementById('lecture-list');
      if (s && el) el.innerHTML = lectureList(s);
    }
  });

  var m0 = /^#subject-(s[1-5])$/.exec(location.hash);
  view = m0 ? { name: 'subject', sid: m0[1] } : { name: 'home' };
  render();
})();
</script>
