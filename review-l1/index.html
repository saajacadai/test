وحيدة التي هاجرت مع النبي ﷺ","أنها أول من آمن من النساء","أنها الوحيدة التي نزل الوحي على النبي ﷺ وهو في لحافها","أنها الوحيدة التي أنجبت له ولدًا"],"answer":2,"why":"هي الوحيدة التي نزل الوحي على النبي ﷺ وهو في لحافها، وكانت أحب نساء رسول الله ﷺ إليه.","ref":"ص 3"},{"q":"كيف برّأ الله تعالى عائشة رضي الله عنها مما رماها به أهل الإفك؟","options":["بشهادة أبيها وحده","أنزل آيات في سورة النور تبرئها من فوق سبع سماوات","بتصريح من النبي ﷺ أمام الناس فقط","ببيان من الصحابة بعد التحقيق"],"answer":1,"why":"شرّفها الله تعالى من فوق سبع سماوات بإنزال آيات فيها تبرئها مما رماها به أهل الإفك، وذلك في سورة النور.","ref":"ص 4"},{"q":"من القائل: «لو جُمع علم الناس كلهم، ثم علم أزواج النبي ﷺ، لكانت عائشة أوسعهم علمًا»؟","options":["الزهري رحمه الله","عطاء بن أبي رباح رحمه الله","أبو موسى الأشعري رضي الله عنه","الذهبي رحمه الله"],"answer":0,"why":"قال الزهري رحمه الله: «لو جُمع علم الناس كلهم، ثم علم أزواج النبي ﷺ، لكانت عائشة أوسعهم علمًا» (أخرجه الحاكم).","ref":"ص 4"},{"q":"ما العلم الذي تعجّب عروة بن الزبير من معرفة خالته عائشة رضي الله عنها به وسألها عن كيفية تعلمها إياه؟","options":["علم الفرائض","علم الأنساب","علم الفلك","علم الطب"],"answer":3,"why":"قال عروة: «ولكن أعجب من علمك بالطب كيف هو؟ ومن أين هو؟» فأجابت بأن النبي ﷺ كان يسقم في آخر عمره فكانت تقدم عليه وفود العرب فتنعت له الأنعات وكانت تعالجه.","ref":"ص 5"},{"q":"كم يبلغ عدد الأحاديث في مسند عائشة رضي الله عنها كما ذكر الإمام الذهبي رحمه الله؟","options":["ألفًا وخمسمئة وأربعين حديثًا","ثلاثة آلاف وخمسمئة حديث","ألفين ومئتين وعشرة أحاديث","ثلاثمئة وثمانية وسبعين حديثًا"],"answer":2,"why":"قال الذهبي رحمه الله: «مسند عائشة يبلغ ألفين ومئتين وعشرة أحاديث».","ref":"ص 5"},{"q":"ما الموقف الذي يُظهر ورع عائشة رضي الله عنها عند سؤالها عن المسح على الخفين؟","options":["أفتته مباشرة دون تردد","أحالت السائل إلى علي رضي الله عنه لأنه أعلم بذلك منها","امتنعت عن الجواب مطلقًا","قالت له: اسأل أي أحد من الناس"],"answer":1,"why":"قالت: «ائتِ عليًّا فإنه أعلم بذلك مني»، فالتزمت التوقف فيما لا تعلمه، وكانت ورِعة تقية في كل الأمور.","ref":"ص 5"},{"q":"بماذا ردّت عائشة رضي الله عنها حين سمعت من النبي ﷺ أن «أحسن الجهاد وأجمله: الحج، حج مبرور»؟","options":["قالت: «فلا أدع الحج بعد إذ سمعت هذا من رسول الله ﷺ»","قالت: «سأخرج للجهاد مع الرجال»","قالت: «الحج واجب على الرجال فقط»","قالت: «أكتفي بالنوافل في بيتي»"],"answer":0,"why":"حجّت واعتمرت مرات كثيرة وكانت تداوم عليهما، وقالت: «فلا أدع الحج بعد إذ سمعت هذا من رسول الله ﷺ» (أخرجه البخاري).","ref":"ص 6"},{"q":"كيف ظهر حياء عائشة رضي الله عنها بعد دفن عمر رضي الله عنه في بيتها؟","options":["تركت البيت وسكنت في بيت آخر","كانت تدخله بلا حجاب لأنه دُفن في بيتها","منعت الناس من الدخول عليه","لم تدخل البيت الذي دُفن فيه إلا وهي مشدّدة عليها ثيابها حياءً من عمر"],"answer":3,"why":"قالت: «والله ما دخلته إلا مشدّدةً عليّ ثيابي حياءً من عمر رضي الله عنه» (أخرجه أحمد)، بعد أن كانت تضع ثوبها لأنه زوجها وأبوها.","ref":"ص 6"},{"q":"ماذا فعلت عائشة رضي الله عنها حين سألها مسكين وهي صائمة وليس في بيتها إلا رغيف؟","options":["أنها اعتذرت لها لأنها لم تجد ما تعطيها","أنها طلبت منها العودة في اليوم التالي","أنها أمرت مولاتها بإعطاء المسكينة الرغيف الوحيد الذي في البيت وهي صائمة","أنها أعطتها مالًا كثيرًا من الدراهم"],"answer":2,"why":"سألها مسكين وهي صائمة وليس في بيتها إلا رغيف، فأمرت مولاة لها بإعطائه إياه، وفي المساء أُهدي لهم شاة وكفنها فقالت: «كُلي من هذا خير من قرصك»، وكانت تقسم سبعين ألفًا وهي ترقّع درعها.","ref":"ص 7"}],"4":[{"q":"ماذا قال النبي ﷺ عن فاطمة رضي الله عنها في الحديث الذي رواه المسور بن مخرمة؟","options":["«فاطمة بضعة مني، فمن أغضبها أغضبني»","«فاطمة أول من يدخل الجنة من النساء»","«فاطمة أحب الناس إليّ من الرجال والنساء»","«فاطمة أفقه نساء الأمة»"],"answer":0,"why":"عن المسور بن مخرمة أن النبي ﷺ قال: «فاطمة بضعة مني، فمن أغضبها أغضبني» (أخرجه البخاري)، وهذا يدل على عظيم منزلتها.","ref":"ص 3"},{"q":"من هنّ «خير نساء العالمين أربع» بحسب الحديث الذي أورده الدرس؟","options":["عائشة، وحفصة، وأم سلمة، وزينب","مريم، وسارة، وهاجر، وفاطمة","خديجة، وعائشة، وسودة، وفاطمة","مريم بنت عمران، وآسية بنت مزاحم، وخديجة بنت خويلد، وفاطمة بنت محمد"],"answer":3,"why":"قال النبي ﷺ: «خير نساء العالمين أربع: مريم بنت عمران، وآسية بنت مزاحم امرأة فرعون، وخديجة بنت خويلد، وفاطمة بنت محمد» (أخرجه ابن حبان).","ref":"ص 3"},{"q":"لماذا بكت فاطمة رضي الله عنها ثم ضحكت حين ناجاها النبي ﷺ في مرض موته؟","options":["بكت لأنه سيرحل عنها، وضحكت لأنه وعدها بالمال","بكت من المرض، وضحكت من مزاحه ﷺ","بكت حين أخبرها بقرب وفاته، وضحكت حين أخبرها أنها أول أهله لحوقًا به وأنها سيدة نساء أهل الجنة","بكت لفراق خديجة، وضحكت لزواجها من علي"],"answer":2,"why":"أخبرها جبريل أنه حضر أجل النبي ﷺ وأنها أول أهله لحوقًا به، فبكت لذلك، ثم قال لها: «أما ترضين أن تكوني سيدة نساء أهل الجنة أو نساء المؤمنين؟» فضحكت (أخرجه مسلم).","ref":"ص 4"},{"q":"بحسب الدرس، من الذين دعاهم النبي ﷺ لمباهلة وفد نصارى نجران؟","options":["أمهات المؤمنين رضي الله عنهن","عليًّا وفاطمة والحسن والحسين رضي الله عنهم","بنو هاشم وبنو المطلب","أبا بكر وعمر وعثمان وعليًّا"],"answer":1,"why":"في حادثة المباهلة: ﴿أَبْنَاءَنَا﴾ الحسن والحسين، ﴿وَنِسَاءَنَا﴾ فاطمة، ﴿وَأَنْفُسَنَا﴾ النبي ﷺ وعلي رضي الله عنه.","ref":"ص 5"},{"q":"ما اللقب الذي لُقّبت به فاطمة رضي الله عنها لما أظهرته من الرعاية والسند لأبيها ﷺ؟","options":["«أم أبيها»","«أم المؤمنين»","«ذات النطاقين»","«أم الشهداء»"],"answer":0,"why":"شهدت أذى قريش للنبي ﷺ وكانت تميط الأذى عنه وتبكي، وبعد وفاة أمها خديجة ازدادت مسؤولياتها فكانت سندًا له، حتى لُقّبت بـ«أم أبيها».","ref":"ص 5"},{"q":"ماذا فعلت فاطمة رضي الله عنها حين رأت أن الدم لا يزيد إلا كثرة في جرح النبي ﷺ يوم أُحد؟","options":["ضمّدته بقطعة من ثوبها فقط","غسلته بماء زمزم","استدعت طبيبًا من المدينة","أحرقت حصيرًا حتى صار رمادًا ثم ألصقته بالجرح فاستمسك الدم"],"answer":3,"why":"كانت فاطمة تغسل الدم وعلي يمسك، فلما رأت أن الدم لا يزيد إلا كثرة أخذت حصيرًا فأحرقته حتى صار رمادًا ثم ألصقته فاستمسك الدم (متفق عليه).","ref":"ص 6"},{"q":"مما كان جهاز فاطمة رضي الله عنها حين تزوجها علي رضي الله عنه، وما مهرها؟","options":["أثاث فاخر وذهب، وكان مهرها مالًا كثيرًا","ثياب حرير وخدم، وكان مهرها بيتًا","خميل وقربة ووسادة من أدم حشوها ليف الإذخر، وكان مهرها درعًا","سرير من ذهب وفرش من حرير"],"answer":2,"why":"قال علي: «جهّز رسول الله ﷺ فاطمة في خميل وقربة ووسادة أدم حشوها ليف الإذخر»، وكان مهرها درعًا؛ وفي هذا درس أن قيمة الزواج لا تُقاس بالمظاهر والمهر المرتفع.","ref":"ص 6–7"},{"q":"بماذا دلّ النبي ﷺ فاطمة وعليًّا حين اشتكت من مشقة الطحن والخدمة وطلبت خادمًا؟","options":["على الصيام والصدقة بنية التيسير","على التسبيح ثلاثًا وثلاثين والتحميد ثلاثًا وثلاثين والتكبير أربعًا وثلاثين عند النوم، وقال: «فهو خير لكما من خادم»","على الصبر والاحتساب فقط","على الاستعانة بالجيران في الأعمال"],"answer":1,"why":"قال لهما: «ألا أدلكما على خير مما سألتماني؟ إذا أخذتما مضاجعكما فسبّحا ثلاثًا وثلاثين، واحمدا ثلاثًا وثلاثين، وكبّرا أربعًا وثلاثين، فهو خير لكما من خادم» (أخرجه البخاري).","ref":"ص 7"},{"q":"ما الذي استقبحته فاطمة رضي الله عنها في جنائز النساء، وماذا أوصت به؟","options":["أن يُطرح على المرأة الثوب فيصف حجم جسدها، وأوصت أن يغسلها علي وأسماء ولا يُدخلا عليها أحدًا","أن تخرج النساء في اتباع الجنازة، وأوصت بالصلاة عليها ليلًا","أن تُدفن المرأة نهارًا، وأوصت بتأخير دفنها","أن يُصلّى عليها عدد قليل، وأوصت بالبكاء عليها"],"answer":0,"why":"قالت لأسماء بنت عميس: «إني قد استقبحت ما يُصنع بالنساء، إنه يُطرح على المرأة الثوب فيصفها»، فصنعت لها أسماء نعشًا بجريد رطبة وثوبًا، وأوصت أن تغسلها هي وعلي.","ref":"ص 9"},{"q":"كم كانت المدة بين وفاة النبي ﷺ ووفاة ابنته فاطمة رضي الله عنها، وكم كان عمرها؟","options":["ثلاثة أشهر، وكان عمرها ثماني عشرة سنة","سنة كاملة، وكان عمرها ثلاثين سنة","شهرين، وكان عمرها خمسًا وعشرين سنة","ستة أشهر، وكان عمرها تسعًا وعشرين سنة"],"answer":3,"why":"توفيت وهي بنت تسع وعشرين سنة، ليلة الثلاثاء لثلاث خلون من رمضان سنة إحدى عشرة للهجرة، بعد أبيها ﷺ بستة أشهر فقط، فكانت أول أهل بيت النبي ﷺ لحوقًا به.","ref":"ص 9"}],"5":[{"q":"لماذا كان والد أم سلمة رضي الله عنها يُلقَّب بـ«زاد الراكب»؟","options":["لأنه كان يمتلك خيولًا سريعة تسبق الركبان","لأنه كان إذا سافر كفى من معه مؤونة الزاد","لأنه كان يسير أمام القوافل ليدلهم على الطريق","لأنه كان يبيع الطعام للمسافرين"],"answer":1,"why":"كان أبوها يُلقب بـ«زاد الراكب» لأنه كان إذا سافر كفى من معه مؤونة الزاد، وكان بيتها عريقًا في الشرف والكرم.","ref":"ص 2"},{"q":"ما المنقبة التي تميزت بها أم سلمة رضي الله عنها عند وصولها المدينة؟","options":["أنها كانت أول ظعينة مهاجرة تدخلها","أنها أول من بنى بيتًا بجوار المسجد","أنها أول من بايع النبي ﷺ من النساء","أنها أول امرأة صلت إلى القبلة"],"answer":0,"why":"هاجرت مع زوجها أبي سلمة إلى الحبشة ثم إلى المدينة، «فكانت أول ظعينة مهاجرة تدخلها».","ref":"ص 3"},{"q":"ما الدعاء الذي رواه أبو سلمة عن النبي ﷺ لمن أصابته مصيبة بعد الاسترجاع؟","options":["«اللهم اجعلها كفارة لذنوبي وبلاءً يرفع درجتي»","«اللهم أبدلني خيرًا من فقدي وارزقني الصبر»","«اللهم لا تجعل مصيبتي في ديني»","«اللهم عندك أحتسب مصيبتي هذه، اللهم أخلفني منها بخير منها»"],"answer":3,"why":"روت أم سلمة أن النبي ﷺ قال: «إنه لا تصيب أحدًا مصيبة فيسترجع عند ذلك ثم يقول: اللهم عندك أحتسب مصيبتي هذه، اللهم أخلفني منها بخير منها، إلا أعطاه الله عز وجل»","ref":"ص 3"},{"q":"ما الأمور الثلاثة التي ذكرتها أم سلمة رضي الله عنها حين خطبها النبي ﷺ؟","options":["أنها كبيرة السن، وفقيرة، وغريبة","أنها كثيرة المرض، وأرملة، وضعيفة","أنها امرأة شديدة الغيرة، ومصبية، وليس لها وليّ شاهد","أنها لا تحسن الطبخ، وبعيدة، وحديثة عهد بإسلام"],"answer":2,"why":"قالت: «أنا امرأة مصبية، وأنا امرأة شديدة الغيرة، وأنا امرأة ليس ها هنا من أوليائي أحد شاهدًا فيزوّجني»، فأجابها النبي ﷺ على كل واحدة منها.","ref":"ص 3"},{"q":"ما السبب المباشر لنزول قوله تعالى: ﴿إِنَّ الْمُسْلِمِينَ وَالْمُسْلِمَاتِ وَالْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ...﴾ [الأحزاب: 35] بحسب الدرس؟","options":["سؤالها: هل للنساء جهاد كما للرجال؟","سؤال أم سلمة للنبي ﷺ: «ما لنا لا نُذكر في القرآن كما يُذكر الرجال؟»","سؤالها: هل للنساء نصيب في الميراث؟","سؤالها: هل يجوز للنساء حضور الجماعة؟"],"answer":1,"why":"قالت: «يا رسول الله ما لنا لا نُذكر في القرآن كما يُذكر الرجال؟» فسمعته يقرأ على المنبر: ﴿إِنَّ الْمُسْلِمِينَ وَالْمُسْلِمَاتِ...﴾ (أخرجه أحمد).","ref":"ص 4"},{"q":"بماذا ردّت أم سلمة رضي الله عنها حين سمعت حديث «من جرّ ثوبه خيلاء لم ينظر الله إليه»، وماذا يدل عليه ذلك؟","options":["سألت: كيف تصنع النساء بذيولهن؟ وهو يدل على شدة غيرتها على ستر المسلمات وحرصها على موافقة لباسهن للشرع","سألت عن حكم الذهب للنساء، وهو يدل على اهتمامها بالزينة","سألت عن قصر الثياب، وهو يدل على تساهلها","سكتت ولم تسأل، وهو يدل على التسليم المطلق"],"answer":0,"why":"قال النبي ﷺ: «يُرخين شبرًا»، قالت: «إذن تنكشف أقدامهن»، قال: «فيُرخينه ذراعًا لا يزدن» (أخرجه الترمذي)، وهذا يدل على شدة غيرتها وحرصها على أن يكون لباس المسلمات موافقًا للشرع.","ref":"ص 4"},{"q":"في أي درجة صنّف ابن حزم أم سلمة رضي الله عنها من حيث الفتيا؟","options":["الدرجة الأولى التي تشمل المكثرين من الفتوى","الدرجة الثالثة التي تشمل المقلّين من الفتوى","لم يُصنّفها ضمن أحد","الدرجة الثانية التي تشمل متوسطي الفتوى"],"answer":3,"why":"عدّها ابن حزم ضمن الدرجة الثانية التي تشمل متوسطي الفتوى بين الصحابة، مع أنس بن مالك وأبي سعيد الخدري وأبي هريرة وغيرهم.","ref":"ص 5"},{"q":"ما الموقف الذي ظهرت فيه رجاحة عقل أم سلمة رضي الله عنها وحكمتها يوم الحديبية؟","options":["حين أشارت عليه أن يرجع إلى المدينة فورًا","حين أشارت عليه أن يرفض شروط الصلح","حين أشارت على النبي ﷺ أن يخرج فلا يكلّم أحدًا حتى ينحر بدنه ويدعو حالقه فيحلق","حين أشارت عليه أن يرسل وفدًا إلى قريش"],"answer":2,"why":"لما قال النبي ﷺ: «انحروا واحلقوا» فلم يقم أحد، دخل على أم سلمة فأشارت بأن يخرج فلا يكلم أحدًا حتى ينحر بدنه ويدعو حالقه فيحلق، فلما رأوا ذلك قاموا ونحروا، وقال ابن حجر: «إشارتها تدلّ على وفور عقلها وصواب رأيها».","ref":"ص 6"},{"q":"بحسب الدرس، ما الذي قدّمته أم سلمة رضي الله عنها عند الصبر على فراق زوجها وولدها في الهجرة؟","options":["اعترضت على قضاء الله ثم تابت","لم يدفعها الفراق والابتلاء إلى الاعتراض على قضاء الله، بل ظلّ قلبها معلقًا بالله تعالى تبثّ إليه شكواها","تخلّت عن دينها مؤقتًا","عادت إلى قومها وتركت الهجرة"],"answer":1,"why":"كانت مثالًا رائعًا في الصبر على الفراق والابتلاء، فلم يدفعها فراق زوجها وولدها إلى التخلي عن دينها ورغبتها في الهجرة، ولم يدفعها حزنها وبكاؤها إلى الاعتراض على قضاء الله.","ref":"ص 7"},{"q":"ماذا قال النبي ﷺ لأم سلمة رضي الله عنها حين سألته هل لها أجر في الإنفاق على بني أبي سلمة؟","options":["«لك أجر ما أنفقتِ عليهم»","«لا أجر لك لأنهم أولادك»","«لك نصف الأجر»","«الأجر لوالدهم وحده»"],"answer":0,"why":"قالت: «يا رسول الله هل لي أجر في بني أبي سلمة أنفق عليهم ولستُ بتاركتهم هكذا وهكذا إنما هم بَنيّ؟» فقال: «لك أجر ما أنفقتِ عليهم» (متفق عليه).","ref":"ص 8"}],"6":[{"q":"متى وُلدت حفصة رضي الله عنها بحسب الدرس؟","options":["بعد البعثة بخمس سنوات","قبل الهجرة بخمس سنوات","قبل البعثة بخمس سنوات","في السنة الثالثة من الهجرة"],"answer":2,"why":"وُلدت قبل البعثة بخمس سنوات، ونشأت في بيت كريم عزيز، وهي ابنة أمير المؤمنين عمر بن الخطاب رضي الله عنه.","ref":"ص 2"},{"q":"من كان زوج حفصة رضي الله عنها الأول قبل زواجها بالنبي ﷺ؟","options":["عثمان بن مظعون رضي الله عنه","خنيس بن حذافة السهمي رضي الله عنه","المسور بن مخرمة رضي الله عنه","أبو سلمة رضي الله عنه"],"answer":1,"why":"تزوجها النبي ﷺ بعد انقضاء عدتها من زوجها الأول خنيس بن حذافة السهمي أحد المهاجرين، في السنة الثالثة من الهجرة.","ref":"ص 2"},{"q":"ما السبب الذي منع أبا بكر رضي الله عنه من الرد على عمر حين عرض عليه الزواج من حفصة؟","options":["أنه كان يعلم أن رسول الله ﷺ ذكرها، ولم يكن ليفشي سره","أنه لم يكن يريد الزواج في ذلك الوقت","أنه كان ينتظر مشورة أصحابه","أنه كان مشغولًا بالتجارة"],"answer":0,"why":"قال أبو بكر: «لم يمنعني أن أرجع إليك إلا أني كنت علمت أن رسول الله ﷺ ذكرها، فلم أكن لأفشي سر رسول الله ﷺ، ولو تركها قبلتها».","ref":"ص 3"},{"q":"ماذا قال النبي ﷺ حين شكا إليه عمر رضي الله عنه من إعراض عثمان رضي الله عنه؟","options":["«اصبر يا عمر فالأمر بيد الله»","«زوّجها لمن تشاء من الصحابة»","«سأتزوج أنا حفصة بعد عدتها»","«تزوّج حفصةَ خيرٌ من عثمان، وتزوّج عثمانُ خيرًا من حفصة»"],"answer":3,"why":"قال النبي ﷺ: «تزوّج حفصة خيرٌ من عثمان، وتزوّج عثمانُ خيرًا من حفصة»، فزوّجه النبي ﷺ ابنته (أخرجه البخاري)، وزوّج رسول الله ﷺ عثمانَ بابنته رقية.","ref":"ص 3"},{"q":"بماذا وصف جبريل عليه السلام حفصة رضي الله عنها حين طلّقها النبي ﷺ؟","options":["«كثيرة العلم والرواية»","«صابرة محتسبة فقط»","«صوّامة قوّامة، وإنها زوجتك في الجنة»","«حافظة لكتاب الله»"],"answer":2,"why":"قال النبي ﷺ: «قال لي جبريل عليه السلام: راجع حفصة، فإنها صوّامة قوّامة، وإنها زوجتك في الجنة» (أخرجه الحاكم).","ref":"ص 3"},{"q":"ما أعظم أدوار حفصة رضي الله عنها في تاريخ الإسلام؟","options":["أنها شاركت في نسخ المصاحف بنفسها","أنها أُودعت عندها الصحف التي جُمع فيها القرآن الكريم بوصية عمر","أنها كانت تقرئ النساء القرآن","أنها كانت تكتب الوحي للنبي ﷺ"],"answer":1,"why":"أُودعت عندها الصحف التي جُمع فيها القرآن بوصية عمر، وبقيت عندها حتى عهد عثمان رضي الله عنه حين أرسل إليها يطلبها ليستنسخ منها المصاحف ثم أعادها إليها.","ref":"ص 4"},{"q":"ما الذي يدلّ عليه إيداع الصحف عند حفصة رضي الله عنها بحسب ابن حجر؟","options":["أنها أهل لذلك، وهو يدل على ثقة الصحابة بها وبأمانتها","أنها كانت أكبر نساء الصحابة سنًّا","أنها الوحيدة التي حفظت القرآن كاملًا","أنها أقرب نساء النبي ﷺ إليه"],"answer":0,"why":"قال ابن حجر: «وإنما كان ذلك عند حفصة لأنها كانت وصيّة عمر»، وهي أهل لذلك، وهو يدل أيضًا على ثقة الصحابة بها وبأمانتها.","ref":"ص 4"},{"q":"بحسب الدرس، كم حديثًا روت حفصة رضي الله عنها عن النبي ﷺ؟","options":["أربعين حديثًا","خمسين حديثًا","ثلاثمئة حديث","ستين حديثًا"],"answer":3,"why":"وروت عن النبي ﷺ ستين حديثًا، وكانت تنقل ما تعلمته إلى الناس، فانتفعت بها الأمة من بعدها.","ref":"ص 5"},{"q":"كم من الوقت يحتمل أن تصبر المرأة عن زوجها بحسب ما نقله الدرس عن حفصة وأبيها عمر رضي الله عنهما؟","options":["شهرين","سنة كاملة","أربعة أشهر أو خمسة أو ستة","ثلاثة أيام"],"answer":2,"why":"سألها عمر: «كم تصبر المرأة عن زوجها؟» فقالت: «أربعة أشهر، أو خمسة أشهر، أو ستة أشهر» (أخرجه سعيد بن منصور).","ref":"ص 5"},{"q":"بحسب الدرس، كيف تقتدي المسلمة بحفصة رضي الله عنها في الثبات والاجتهاد في العبادة؟","options":["بأن تكتفي بالفرائض في المواسم فقط","بأن تدوم صلتها بالله في السراء والضراء طوال حياتها لا في المواسم فقط، حتى تكون بحق صوّامة قوّامة","بأن تتفرغ للعبادة وتترك أدوارها","بأن تقلل العبادة عند الابتلاء"],"answer":1,"why":"ذلك في السراء والضراء ليدوم صلتها بالله عز وجل طوال حياتها لا في المواسم فقط، حتى تكون بحق صوّامة قوّامة، وتعلم أن تلك العبادة هي زادها للآخرة وزادها في دنياها.","ref":"ص 6"}],"7":[{"q":"متى تزوج النبي ﷺ جويرية بنت الحارث رضي الله عنها؟","options":["في السنة الرابعة من الهجرة","في السنة الخامسة من الهجرة","قبل الهجرة بسنة","في السنة السادسة من الهجرة"],"answer":3,"why":"تزوجها النبي ﷺ سنة ست من الهجرة وهي ابنة عشرين سنة، وكان زواجها بركة عظيمة على قومها.","ref":"ص 2"},{"q":"من هي جويرية بنت الحارث رضي الله عنها بحسب الدرس؟","options":["ابنة أحد التجار في مكة","إحدى المهاجرات الأوائل إلى الحبشة","سيدة بني المصطلق، ابنة سيد قومها، ومن أكرم نساء العرب نسبًا","ابنة سيد الأنصار في المدينة"],"answer":2,"why":"هي أم المؤمنين جويرية بنت الحارث بن أبي ضرار، سيدة بني المصطلق، من أكرم نساء العرب نسبًا، كانت ابنة سيد قومها.","ref":"ص 2"},{"q":"ما السلوك الذي اتخذته جويرية رضي الله عنها لتنال حريتها بعد وقوعها في السبي؟","options":["انتظرت الفداء بشفاعة أبيها","كاتبت على نفسها","حاولت الهرب من المدينة للحاق بأهلها","طلبت العتق من النبي ﷺ مجانًا"],"answer":1,"why":"وقعت في السهم لثابت بن قيس بن الشماس، فكاتبته على نفسها، ثم جاءت النبي ﷺ تستعينه على كتابتها.","ref":"ص 3"},{"q":"ماذا اقترح النبي ﷺ على جويرية حين جاءته تستعينه على مكاتبتها؟","options":["«أقضي كتابتك وأتزوجك»","«أن يدفع قومها فداءها»","«أن ترجع إلى أهلها»","«أن تعمل في بيته حتى تؤدي كتابتها»"],"answer":0,"why":"قال لها ﷺ: «فهل لك في خير من ذلك؟» قالت: ما هو؟ قال: «أقضي كتابتك وأتزوجك»، قالت: نعم يا رسول الله، قال: «قد فعلتُ».","ref":"ص 3"},{"q":"ماذا فعل الصحابة حين علموا بزواج النبي ﷺ من جويرية رضي الله عنها؟","options":["احتفلوا بالزواج دون أي أثر على السبي","طلبوا فداءً من قومها","أبقوا السبي عندهم","أرسلوا ما في أيديهم من سبي بني المصطلق، فأُعتق بزواجه إياها مئة أهل بيت"],"answer":3,"why":"قال الناس: أصهار رسول الله ﷺ، فأرسلوا ما في أيديهم، قالت عائشة: «فلقد أُعتق بتزويجه إياها مائة أهل بيت من بني المصطلق، فما أعلم امرأة كانت أعظم بركة على قومها منها».","ref":"ص 3"},{"q":"ما الدرس المستفاد من مبادرة جويرية رضي الله عنها إلى المكاتبة وطلب المعونة المشروعة؟","options":["الاعتماد على شفاعة النسب وحدها","الصبر على البلاء دون فعل","الأخذ بالأسباب المباحة وعدم الاستسلام للعجز، مع التوكل على الله","انتظار الفرج دون سعي"],"answer":2,"why":"في مبادرتها مثال على الأخذ بالأسباب المباحة وعدم الاستسلام للعجز، مع التوكل على الله؛ والمؤمن لا يرضى أن يكون أسيرًا لعجزه أو واقعه، بل يسعى ويتوكل على ربه ويبذل ما في وسعه.","ref":"ص 3"},{"q":"ماذا قال والد جويرية للنبي ﷺ حين جاء يفتديها؟","options":["قبل زواجها فورًا دون سؤالها","قال: إن ابنتي لا يُسبى مثلها، فأنا أكرم من ذلك، ثم خيّرها النبي ﷺ فاختارت رسول الله ﷺ","رفض الفداء وغادر المدينة","طلب من النبي ﷺ تأجيل الزواج"],"answer":1,"why":"قال النبي ﷺ: «أرأيت إن خيّرناها؟» فقالت: «فإني قد اخترته»، فقال أبوها: «قد والله فضحتنا».","ref":"ص 4"},{"q":"ما الذي يظهره موقف جويرية رضي الله عنها في اختيارها رسول الله ﷺ على جاه قومها؟","options":["أن الكرامة والرفعة الحقيقية ليست في النسب ولا المال، وإنما في القرب من رسول الله ﷺ والإيمان به","أن النسب الشريف هو الأساس","أن المال يرفع صاحبه","أن الجاه أولى بالتقديم"],"answer":0,"why":"في هذا الموقف تظهر قوة إيمانها في اختيارها للإيمان والانتماء إلى بيت النبوة على جاه قومها، لتعلن أن الكرامة والرفعة الحقيقية ليست في النسب ولا المال.","ref":"ص 4"},{"q":"ما الذي قاله النبي ﷺ لجويرية حين وجدها تذكر الله في مسجدها بعد صلاة الصبح إلى الضحى؟","options":["«زيدي في الأذكار»","«صلي النافلة بعد الذكر»","«لا تُكثري من الذكر حتى لا تتعبي»","«لقد قلت بعدك أربع كلمات ثلاث مرات، لو وزنت بما قلت منذ اليوم لوزنتهن: سبحان الله وبحمده، عدد خلقه ورضا نفسه وزنة عرشه ومداد كلماته»"],"answer":3,"why":"خرج النبي ﷺ من عندها بكرة حين صلى الصبح وهي في مسجدها، ثم رجع بعد أن أضحى وهي جالسة، فقال لها ما قال (أخرجه مسلم).","ref":"ص 5"},{"q":"لماذا غيّر النبي ﷺ اسم «برّة» إلى «جويرية»؟","options":["لأن الاسم غير عربي","لأن الاسم صعب النطق","لأنه كره أن يُقال: «خرج من عند برّة»، وفيه تعليم للأمة ألا تزكي أنفسها","لأن الاسم يشبه اسم قبيلة معادية"],"answer":2,"why":"قال ابن عباس: «كانت جويرية اسمها برّة، فحوّل رسول الله ﷺ اسمها جويرية، وكان يكره أن يُقال: خرج من عند برّة» (أخرجه مسلم)، وفي هذا التغيير تعلم الأمة ألا تُزكّي أنفسها.","ref":"ص 6"}],"8":[{"q":"إلى أي نبيٍّ ينتهي نسب قوم أم المؤمنين صفية رضي الله عنها بحسب الدرس؟","options":["نبي الله هارون عليه السلام","نبي الله يوسف عليه السلام","نبي الله موسى عليه السلام","نبي الله عيسى عليه السلام"],"answer":0,"why":"كانت صفية قبل إسلامها من أسرة يهودية شريفة النسب، ينتهي نسب قومها إلى نبي الله هارون عليه السلام، ثم إلى نبي الله الكريم يعقوب عليه السلام.","ref":"ص 3"},{"q":"متى تزوج النبي ﷺ صفية رضي الله عنها؟","options":["في السنة الأولى من الهجرة بعد غزوة بدر","عقب غزوة الخندق مباشرة","بعد فتح مكة","في السنة السابعة من الهجرة عقب غزوة خيبر"],"answer":3,"why":"تزوجها النبي ﷺ في السنة السابعة من الهجرة عقب غزوة خيبر، بعد أن قُتل عنها زوجها كنانة بن أبي الحقيق يوم خيبر.","ref":"ص 3"},{"q":"ما الرؤيا التي رأتها صفية رضي الله عنها وهي في قومها؟","options":["رأت كأن نجمًا سقط في بيتها","رأت كأن شمسًا طلعت من المغرب","رأت كأن قمرًا أقبل من يثرب حتى وقع في حجرها","رأت كأن جبلًا وقع عليها"],"answer":2,"why":"بينما كانت في قومها رأت رؤيا عجبت منها، قالت: رأيت كأن قمرًا أقبل من يثرب حتى وقع في حجري، فقصّتها على زوجها كنانة فأوّلها غاضبًا: «تحبين أن تكوني تحت هذا الملك الذي يأتي من المدينة؟» وضرب وجهها.","ref":"ص 3"},{"q":"ماذا فعل النبي ﷺ بصفية رضي الله عنها حين اصطفاها من سبي خيبر؟","options":["ردّها إلى قومها دون زواج","أعتقها وتزوجها","أعطاها لدحية الكلبي رضي الله عنه","جعلها خادمة في بيته"],"answer":1,"why":"جاء رجل إلى النبي ﷺ وقال إن صفية بنت حيي سيدة قريظة والنضير لا تصلح إلا له، فدعاها النبي ﷺ فأعتقها وتزوجها.","ref":"ص 4"},{"q":"كيف ظهر توقير صفية رضي الله عنها للنبي ﷺ حين أراد أن يركبها البعير؟","options":["أبت أن تضع قدمها على فخذه الشريف، ووضعت ركبتها على فخذه وصعدت","رفضت الركوب وسارت على قدميها","طلبت من غيره أن يُركبها","وضعت قدمها على فخذه دون تردد"],"answer":0,"why":"قرّب النبي ﷺ البعير ووضع رجله الشريفة لتضع صفية قدمها على فخذه لتركب، فأجلّت مقام النبي ﷺ وأبت، ووضعت ركبتها على فخذه وصعدت.","ref":"ص 5-6"},{"q":"ماذا فعلت صفية رضي الله عنها لنصرة عثمان رضي الله عنه زمن الحصار؟","options":["شاركت في حصاره","اعتزلت الفتنة تمامًا","شقّت عصا الطاعة وخرجت على الأمير","وقفت إلى صفّه وكانت تنقل إليه الطعام والماء"],"answer":3,"why":"وقفت صفية إلى صف عثمان وتعاطفت معه، وكانت تنقل إليه الطعام والماء، ولم تشق عصا الطاعة والجماعة ولم تتخلّ عن الأمير المتّبع الذي حوصر ظلمًا، بل نصرته بما استطاعت.","ref":"ص 6-7"},{"q":"ماذا فعلت صفية رضي الله عنها حين قدمت على نساء النبي ﷺ لتكسب ودّهن؟","options":["امتنعت عن مخالطتهن","انحازت إلى فئة منهن دون أخرى","وهبت لفاطمة رضي الله عنها ولنساء معها من قطعة ذهب كانت في أذنيها","ردّت إساءتهن بالإساءة"],"answer":2,"why":"لمّا قدمت عليهن كان في أذنيها قطعة من ذهب، فوهبت لفاطمة رضي الله عنها منها ولنساء معها، ونستفيد أن الهدية تؤلف القلوب، فاحرصي على مهاداة غيرك تطييبًا للخاطر.","ref":"ص 7"},{"q":"بماذا علّمها النبي ﷺ أن تردّ حين بلغها أن عائشة وحفصة تقولان إنهما خير منها؟","options":["أن تردّ عليهما بمثل قولهما","أن تقول: «وكيف تكونان خيرًا مني وزوجي محمد، وأبي هارون، وعمي موسى»","أن تعتزل النبي ﷺ","أن تسكت وتبكي دون أن تشتكي"],"answer":1,"why":"دخل النبي ﷺ وهي تبكي، فقال: «ما يبكيك؟» فذكرت قولهما، فقال: «ألا قلتِ: كيف تكونان خيرًا مني وزوجي محمد وأبي هارون وعمي موسى؟» وفيه رجوعها إليه في كل أمر يعرض لها وعدم انتقامها لنفسها.","ref":"ص 8"},{"q":"ماذا قالت صفية رضي الله عنها لعمر رضي الله عنه حين بلغه أنها تحب السبت وتصل اليهود؟","options":["إنها لم تحب السبت منذ أبدلها الله به يوم الجمعة، وأنها تصل اليهود لأن لها فيهم رحمًا","إنها ما زالت تحب السبت وتعظمه","إنها لا تعرف أحدًا من اليهود","اعترفت بما نُسب إليها"],"answer":0,"why":"سألها عمر فقالت: أما السبت فإني لم أحبه منذ أبدلني الله به يوم الجمعة، وأما اليهود فإن لي فيهم رحمًا فأنا أصلها. ثم عفت عن الجارية وأعتقتها حرة.","ref":"ص 9"},{"q":"ماذا قالت صفية رضي الله عنها للنبي ﷺ في مرضه الذي توفي فيه؟","options":["«اصبر يا رسول الله فالأمر يسير»","«أنا أحق بالمرض منك»","«ما أعظم الأجر الذي ينتظرك»","«لوددت أن الذي بك بي»"],"answer":3,"why":"قالت صفية بنت حيي: «أما والله يا نبي الله لوددت أن الذي بك بي»، فتغامز أزواج النبي ﷺ، فقال: «مضمضن»، قلن: من أي شيء؟ قال: «من تغامزكن بصاحبتكن، والله إنها لصادقة!».","ref":"ص 9"}],"9":[{"q":"متى أسلمت أسماء بنت عميس رضي الله عنها وزوجها جعفر؟","options":["بعد عام الحزن","أسلما مبكرًا، قبل دخول رسول الله ﷺ دار الأرقم","بعد فتح مكة","في المدينة بعد الهجرة"],"answer":1,"why":"أسلمت أسماء بنت عميس وزوجها جعفر بن أبي طالب مبكرًا، قبل دخول رسول الله ﷺ دار الأرقم، ففازت بنعمة السبق إلى الإسلام.","ref":"ص 3"},{"q":"ما صلة القرابة التي تجمع أسماء بنت عميس بأم المؤمنين ميمونة بنت الحارث رضي الله عنهما؟","options":["أختها لأمها","أختها من الرضاعة","ابنة خالتها","ابنة عمتها"],"answer":0,"why":"أم عبد الله أسماء بنت عميس الخثعمية من المهاجرات الأوائل، وهي أخت ميمونة بنت الحارث زوج النبي ﷺ لأمها.","ref":"ص 2"},{"q":"ماذا تلا جعفر رضي الله عنه على النجاشي حين سأله: «هل معك مما أنزل على رسولكم شيء؟»","options":["آيات من سورة البقرة","آيات من سورة يوسف","آيات من سورة الكهف","آيات من سورة مريم"],"answer":3,"why":"سأل النجاشي جعفرًا: هل معك مما أنزل على رسولكم شيء؟ قال: نعم، فاقرأه، فمضى جعفر يتلو آيات من سورة مريم، فبكى النجاشي وبكى معه أساقفته.","ref":"ص 5"},{"q":"ماذا قال النبي ﷺ حين قدم جعفر رضي الله عنه من الحبشة بعد فتح خيبر؟","options":["«لقد تأخرتم كثيرًا في العودة»","«الحمد لله الذي أعادكم سالمين دون أن أفرح»","«ما أدري بأيهما أنا أفرح، بفتح خيبر أم بقدوم جعفر»","«لا أفرح بقدومكم قبل أن تكملوا هجرتكم»"],"answer":2,"why":"عادوا من هجرتهم المباركة في السنة السابعة من الهجرة بعد فتح خيبر، وتلقّى رسول الله ﷺ جعفرًا واعتنقه وقبّل بين عينيه، وقال: «ما أدري بأيهما أنا أفرح، بفتح خيبر أم بقدوم جعفر».","ref":"ص 6"},{"q":"بماذا ردّ النبي ﷺ على أسماء حين نقلت إليه قول عمر لها: «سبقناكم بالهجرة فنحن أحق برسول الله منكم»؟","options":["«الفضل لمن سبق إلى المدينة»","«ليس بأحق بي منكم، وله ولأصحابه هجرة واحدة، ولكم أنتم أهل السفينة هجرتان»","«لا فضل لأحد على أحد في الهجرة»","«سبقكم عمر في الهجرة فهو أحق»"],"answer":1,"why":"غضبت أسماء وقالت: كلا والله! كنتم مع رسول الله ﷺ يطعم جائعكم ويعظ جاهلكم، وكنا في دار البعداء والبغضاء بالحبشة. فذكرت ذلك للنبي ﷺ فقال: «ليس بأحق بي منكم، وله ولأصحابه هجرة واحدة، ولكم أنتم أهل السفينة هجرتان».","ref":"ص 6-7"},{"q":"ماذا قال النبي ﷺ لأهله بعد أن بلغه استشهاد جعفر رضي الله عنه؟","options":["«اصنعوا لآل جعفر طعامًا فقد شغلوا عن أنفسهم اليوم»","«اتركوا آل جعفر وحدهم»","«أقيموا لجعفر مأتمًا»","«لا تخبروا أحدًا بما جرى»"],"answer":0,"why":"قال رسول الله ﷺ: «اصنعوا لآل جعفر طعامًا فقد شغلوا عن أنفسهم اليوم». ثم أتاه جبريل عليه السلام فأخبره أن الله جعل لجعفر جناحين مضرّجين بالدم يطير بهما مع الملائكة.","ref":"ص 7"},{"q":"من تزوجت أسماء رضي الله عنها بعد انقضاء عدتها من جعفر رضي الله عنه؟","options":["علي بن أبي طالب رضي الله عنه مباشرة","عمر بن الخطاب رضي الله عنه","عثمان بن عفان رضي الله عنه","أبا بكر الصديق رضي الله عنه"],"answer":3,"why":"لما انقضت عدتها من جعفر رضي الله عنه تزوجها أبو بكر رضي الله عنه، ثم تزوجها علي بن أبي طالب رضي الله عنه بعد وفاة أبي بكر.","ref":"ص 8"},{"q":"ماذا قالت أسماء رضي الله عنها حين تفاخر ابناها محمد بن جعفر ومحمد بن أبي بكر عند علي رضي الله عنه؟","options":["أن محمد بن جعفر أفضل من أخيه","أن أبا بكر أفضل من جعفر في كل شيء","ما رأيت شابًّا من العرب خيرًا من جعفر، ولا رأيت كهلًا خيرًا من أبي بكر","أن لا فضل لأحد منهما"],"answer":2,"why":"قالت لعلي رضي الله عنه: ما رأيت شابًّا من العرب خيرًا من جعفر، ولا رأيت كهلًا خيرًا من أبي بكر، فقال علي: «ما تركتِ لنا شيئًا، ولو قلتِ غير الذي قلتِ لمقتّك».","ref":"ص 8-9"},{"q":"ما الذي صنعته أسماء رضي الله عنها لفاطمة رضي الله عنها حين ذكرت استحياءها من خلل النعش؟","options":["صنعت لها سريرًا خشبيًّا","صنعت لها النعش الذي كانت قد رأت مثله في الحبشة","رفضت أن تصنع لها شيئًا","أمرت غيرها بصنعه"],"answer":1,"why":"قالت فاطمة: إني لأستحيي من خلل هذا النعش، فقالت أسماء: إن شئتِ عملتُ لك شيئًا رأيته يُصنع بالحبشة، فصنعت النعش، فلما رأته قالت: «سترك الله»، فما زالت النعوش تصنع بعدها.","ref":"ص 10"},{"q":"كم حديثًا روت أسماء رضي الله عنها عن النبي ﷺ بحسب الدرس؟","options":["حوالي ستين حديثًا","حوالي عشرة أحاديث","حوالي مائة وسبعين حديثًا","حوالي ثلاثمائة وخمسين حديثًا"],"answer":0,"why":"روت أسماء رضي الله عنها عن النبي ﷺ حوالي ستين حديثًا، وتعلّم على يديها الكثير من أبناء الصحابة والتابعين.","ref":"ص 10"}],"10":[{"q":"ما سبب تلقيب أسماء بنت أبي بكر رضي الله عنهما بـ«ذات النطاقين»؟","options":["أهداها النبي ﷺ نطاقين مكافأة لها","استخدمت نطاقها لشد وسطها في المعركة","شقّت نطاقها نصفين، فربطت بأحدهما سفرة النبي ﷺ وبالآخر سقاءه","لبست نطاقين فوق ثيابها أثناء الهجرة"],"answer":2,"why":"لما أراد النبي ﷺ الهجرة صنعت أسماء سفرة النبي ﷺ في بيت أبي بكر، فلم تجد ما تربط به السفرة والسقاء إلا نطاقها، فشقّته اثنين فربطت بواحد السفرة وبالآخر السقاء، فسُمّيت ذات النطاقين.","ref":"ص 3"},{"q":"بعد كم إنسانًا أسلمت أسماء رضي الله عنها بحسب ما ذكر أبو نعيم؟","options":["بعد عشرة أشخاص","بعد سبعة عشر إنسانًا","بعد ثلاثين شخصًا","بعد سبعة أشخاص"],"answer":1,"why":"كانت أسماء من السابقين إلى الإسلام، فقد ذكر أبو نعيم أنها أسلمت بعد سبعة عشر إنسانًا.","ref":"ص 2"},{"q":"بماذا وُصفت أسماء بنت أبي بكر رضي الله عنهما بين المهاجرات من جهة الوفاة؟","options":["آخر المهاجرات وفاةً","أول المهاجرات وفاةً","أول من توفيت بعد الهجرة","أول من توفيت من بنات أبي بكر"],"answer":0,"why":"أم عبد الله أسماء بنت أبي بكر الصديق وأخت أم المؤمنين عائشة، وآخر المهاجرات وفاةً، وكانت أكبر من أختها عائشة ببضع عشرة سنة.","ref":"ص 2"},{"q":"ماذا صنعت أسماء رضي الله عنها حين دخل عليها جدها أبو قحافة وقد ذهب بصره وظنّ أن أبا بكر ترك أهله بلا مال؟","options":["أخبرته أن أباها أخذ المال كله وسافر به","أعطته مالها الخاص ليطمئن عليهم","أنكرت أن يكون أبو بكر قد ترك شيئًا","وضعت أحجارًا في كوّة البيت وغطّتها بثوب، ووضعت يده عليها ليطمئن أن أباها ترك لهم مالًا"],"answer":3,"why":"أخذت أحجارًا فوضعتها في كوّة البيت، وغطّتها بثوب، ثم أخذت بيد جدها فوضعتها على المال، وقالت: «هذا ما ترك لنا». وقد حفظت بذلك سرّ رسول الله ﷺ وأرضت جدها عن أبيها.","ref":"ص 2-3"},{"q":"ماذا فعل أبو جهل حين لم تخبره أسماء رضي الله عنها بمكان أبيها؟","options":["حبسها في بيتها","أخذ مال أبيها كله","لطمها لطمةً طرح منها قرطها","هدّدها بقتل أختها عائشة"],"answer":2,"why":"قالت أسماء: لا أدري والله أين أبي، فرفع أبو جهل يده، وكان فاحشًا خبيثًا، فلطم خدّها لطمةً طرح منها قرطها.","ref":"ص 3"},{"q":"كيف وصف عبد الله بن الزبير رضي الله عنهما الفرق بين جود خالته عائشة وجود أمه أسماء؟","options":["كانت أسماء تجمع الشيء إلى الشيء حتى إذا اجتمع وضعته مواضعه","كانت أسماء لا تدّخر شيئًا لغد","كانت أسماء تنتظر الفضل ثم تتصدق به","كانت أسماء تتصدق بالفائض فقط"],"answer":1,"why":"قال ابن الزبير: ما رأيت امرأتين أجود من عائشة وأسماء، وجودهما مختلف: أما عائشة فكانت تجمع الشيء إلى الشيء حتى إذا اجتمع عندها وضعته مواضعه، وأما أسماء فكانت لا تدّخر شيئًا لغد.","ref":"ص 4"},{"q":"ماذا أجابها النبي ﷺ حين سألته: «قدمت عليّ أمي وهي راغبة، أفأصل أمي؟»","options":["«نعم، صِلي أمّكِ»","«لا، فهي على غير دينك»","«صِليها بعد أن تسلم»","«استأذني زوجك أولًا»"],"answer":0,"why":"قدمت أم أسماء عليها وهي مشركة في عهد رسول الله ﷺ، فاستفتت النبي ﷺ فقال: «نعم، صلي أمك».","ref":"ص 4"},{"q":"ماذا كانت أسماء رضي الله عنها تنقله على رأسها من أرض الزبير التي أقطعه إياها رسول الله ﷺ؟","options":["الماء","الحطب","الشعير","النوى"],"answer":3,"why":"كانت تنقل النوى على رأسها من أرض الزبير، وهي على ثلثي فرسخ، وتعلف فرسه وتخدمه، وكانت تعجن ولا تحسن الخبز فكان يخبز لها جارات من الأنصار.","ref":"ص 6-7"},{"q":"ما الكلمات التي قالتها أسماء لابنها عبد الله بن الزبير رضي الله عنهما حين حاصره الحجاج وانفضّ القوم عنه؟","options":["«اقبل الأمان لتحقن دمك»","«اعتزل القتال والزم بيتك»","«يا بنيّ، عِش كريمًا ومُت كريمًا، لا يأخذك القوم أسيرًا»","«سلّم نفسك للحجاج ليرحمك»"],"answer":2,"why":"قالت لابنها حين حاصره الحجاج وانفضّ القوم عنه: «يا بنيّ، عش كريمًا ومت كريمًا، لا يأخذك القوم أسيرًا»، ووقفت معه مواقف الأبطال تقوّي عضده وتشدّ عزيمته.","ref":"ص 8"},{"q":"ماذا أعدّت أسماء رضي الله عنها بين يديها يوم قُتل ابنها عبد الله بن الزبير؟","options":["قبرًا حفرته بيدها","كفنًا أعدّته ونشرته وأجمرته","وصيّةً كتبتها لأولادها","ثوب عزاء جديدًا"],"answer":1,"why":"دخل عليها أبو سلمة الحضرمي يوم الثلاثاء وبين يديها كفن قد أعدّته ونشرته وأجمرته، وأمرت جوارٍ لها يقمن على أبواب المسجد.","ref":"ص 10"},{"q":"متى ماتت أسماء رضي الله عنها وكم بلغ عمرها؟","options":["ماتت بعد ابنها بليالٍ، وقد بلغت مائة سنة","ماتت قبل ابنها بعام، وقد بلغت ستين سنة","ماتت بعد ابنها بعامين، وقد بلغت ثمانين سنة","ماتت في اليوم نفسه، وقد بلغت سبعين سنة"],"answer":0,"why":"ماتت بعد ابنها بليالٍ، وكان قتله يوم الثلاثاء لسبع عشرة ليلة خلت من جمادى الأولى سنة ثلاث وسبعين، وماتت وقد بلغت مائة سنة.","ref":"ص 11"}],"11":[{"q":"بماذا كانت تُكنّى أم المؤمنين زينب بنت جحش رضي الله عنها؟","options":["أم سلمة","أم حبيبة","أم عبد الله","أم الحكم"],"answer":3,"why":"زينب بنت جحش بن رياب بن أسد بن خزيمة، وهي ابنة عمة النبي ﷺ، وكانت تُكنّى أم الحكم، وأمها أميمة بنت عبد المطلب.","ref":"ص 2"},{"q":"بأي شيء كانت زينب رضي الله عنها تفخر على أزواج النبي ﷺ؟","options":["بأنها ابنة عمة النبي ﷺ فقط","بأنها كانت من أوائل المهاجرات","بأن الله زوّجها من فوق سبع سماوات","بأنها أكثرهن مالًا"],"answer":2,"why":"عن أنس رضي الله عنه: كانت زينب تفخر على أزواج النبي ﷺ وتقول: زوّجكنّ أهاليكنّ، وزوّجني الله من فوق سبع سماوات.","ref":"ص 3"},{"q":"لماذا غيّر النبي ﷺ اسم «برّة» إلى «زينب»؟","options":["لأن الاسم لا يليق بالنساء","لأن في الاسم تزكية للنفس","لأن الاسم كان لأحد المشركين","لأن معناه مذموم"],"answer":1,"why":"كان اسمها برّة فقيل: تزكّي نفسها، فسمّاها رسول الله ﷺ زينب. ليس في اسم برّة قُبح، وإنما غُيّر لمعنى آخر هو كراهة تزكية النفس.","ref":"ص 3"},{"q":"من هو زيد بن حارثة رضي الله عنه الذي زوّجه النبي ﷺ بنت عمته زينب؟","options":["مولى لخديجة وهبته لرسول الله ﷺ قبل البعثة فأعتقه وتبنّاه","ابن عم النبي ﷺ من بني هاشم","ابن عمة زينب بنت جحش","صحابي من الأنصار هاجر مع النبي ﷺ"],"answer":0,"why":"كان زيد مولى لخديجة رضي الله عنها وهبته لرسول الله ﷺ قبل البعثة وهو ابن ثماني سنوات فأعتقه وتبنّاه، فكانوا يدعونه زيد بن محمد.","ref":"ص 3"},{"q":"ما الآية التي نزلت حين خطب النبي ﷺ زينب لزيد فقالت: «لستُ بناكحته»؟","options":["﴿يا أيها الذين آمنوا لا تدخلوا بيوت النبي﴾","﴿ادعوهم لآبائهم هو أقسط عند الله﴾","﴿ما كان محمد أبا أحد من رجالكم﴾","﴿وما كان لمؤمن ولا مؤمنة إذا قضى الله ورسوله أمرًا أن يكون لهم الخيرة من أمرهم﴾"],"answer":3,"why":"لما نزلت الآية قالت زينب: يا رسول الله، أتُؤامر في نفسي؟ أرضيتَه لي؟ قال: «نعم»، قالت: إذًا لا أعصي رسول الله ﷺ، قد أنكحته نفسي.","ref":"ص 3"},{"q":"ما السمة التي تظهر في أصحاب النبي ﷺ من هذه القصة؟","options":["أنهم كانوا يرفضون ما يخالف أهواءهم","أنهم كانوا يؤخرون الاستجابة حتى يستشيروا أهلهم","أنهم كانوا مذعنين مسلّمين لقضاء الله تعالى وقضاء رسوله ﷺ","أنهم كانوا يفرقون بين الأمور الدينية والدنيوية"],"answer":2,"why":"هذه سمة لا تتخلف في كل أصحاب النبي ﷺ رجالًا ونساءً، فما كانوا في كل شؤونهم إلا مذعنين مسلّمين لقضاء الله تعالى وقضاء رسوله ﷺ.","ref":"ص 4"},{"q":"ما الحكمة التشريعية من زواج النبي ﷺ بزينب بعد طلاقها من زيد؟","options":["تكريمها لسبقها في الإسلام","القضاء على عادة التبنّي التي كانت منتشرة في الجاهلية","تأليف قلوب بني أسد","إكرام زيد بن حارثة"],"answer":1,"why":"تزوج النبي ﷺ زينب للقضاء على عادة التبنّي المنتشرة بين العرب في الجاهلية، ليُبطل الله بدعة التبنّي ويقيم أسس الإسلام.","ref":"ص 5-6"},{"q":"ممّا كان النبي ﷺ يخشى حين أمره الله أن يتزوج زينب؟","options":["من ألسنة المنافقين والفجار أن يقولوا: تزوج محمد امرأة ابنه","من غضب أزواجه","من مخالفة قريش له","من رفض زينب"],"answer":0,"why":"كان ﷺ يخشى من ألسنة المنافقين والفجار أن يقولوا: تزوج محمد ﷺ امرأة ابنه، حتى أنزل الله: ﴿وتخشى الناس والله أحق أن تخشاه﴾.","ref":"ص 6"},{"q":"كيف يدل زواج النبي ﷺ من زينب على نبوته بحسب الدرس؟","options":["أنه كتم ما أُنزل عليه من أجل سمعته","أنه تزوجها دون أن ينزل فيه وحي","أنه أخفى العتاب حفظًا لهيبته","أن الله عاتبه فيه فبلّغ الآية ولم يكتمها"],"answer":3,"why":"قالت عائشة رضي الله عنها: لو كان محمد ﷺ كاتمًا شيئًا مما أنزل عليه لكتم هذه الآية. فتبليغه لها دليل صريح على أنه رسول الله حقًّا.","ref":"ص 6"},{"q":"ماذا قالت عائشة رضي الله عنها في وصف زينب رضي الله عنها: «ولم أر امرأة قط خيرًا في الدين من زينب…»؟","options":["أشد غيرة وأكثر مالًا","أجمل نساء النبي ﷺ وأكثرهن علمًا","أتقى لله، وأصدق حديثًا، وأوصل للرحم، وأعظم صدقة","أطولهن قامة وأكثرهن صومًا"],"answer":2,"why":"قالت عائشة: ولم أر امرأة قط خيرًا في الدين من زينب، وأتقى لله، وأصدق حديثًا، وأوصل للرحم، وأعظم صدقة، وأشد ابتذالًا لنفسها في العمل الذي تصدّق به وتقرّب به إلى الله.","ref":"ص 7-8"},{"q":"ماذا فسّرت عائشة رضي الله عنها قول النبي ﷺ: «أسرعكنّ لحوقًا بي أطولكنّ يدًا»؟","options":["أن المقصود طول القامة","أن طول اليد هو كثرة الصدقة","أن المقصود أسبقهن هجرة","أن المقصود أكثرهن علمًا"],"answer":1,"why":"كنّ يمددن أيديهن في الجدار يتطاولن، حتى توفيت زينب وكانت امرأة قصيرة، فعرفن أن النبي ﷺ إنما أراد بطول اليد الصدقة. وكانت صنّاعة اليد تدبغ وتخرز وتتصدق.","ref":"ص 10-11"},{"q":"ما قالته زينب رضي الله عنها حين جاءها عطاؤها اثنا عشر ألف درهم؟","options":["«اللهم لا يدركني قابل هذا المال فإنه فتنة»، ثم قسمته على أهل رحمها وأيتامها وأهل الحاجة","احتفظت به لتجهّز كفنها","ادّخرته لأيام الشدة","ردّته إلى عمر رضي الله عنه"],"answer":0,"why":"كان عطاؤها اثني عشر ألف درهم، فجعلت تقول: «اللهم لا يدركني قابل هذا المال فإنه فتنة»، ثم قسمته في أهل رحمها وأيتامها وأهل الحاجة حتى أتت عليه.","ref":"ص 11"}],"12":[{"q":"ما اسم زوج أم سليم رضي الله عنها الأول، والد أنس بن مالك؟","options":["مالك بن النضر","أبو طلحة الأنصاري","زيد بن حارثة","سعد بن معاذ"],"answer":0,"why":"تزوجها مالك بن النضر النجاري الخزرجي، فولدت له أنس بن مالك رضي الله عنه، ثم خلف عليها أبو طلحة زيد بن سهل الأنصاري.","ref":"ص 2"},{"q":"بماذا واجهت أم سليم رضي الله عنها زوجها مالكًا حين عرضت عليه الإسلام فغضب وأبى؟","options":["أسلم بعد حين","طلّقها وأخذ ابنها","بقي معها على الشرك","خرج إلى الشام وهلك هناك"],"answer":3,"why":"أسلمت أم سليم في بدايات الدعوة بالمدينة، فعرضت على زوجها الإسلام فغضب وأبى وخرج إلى الشام ثم هلك هناك.","ref":"ص 3"},{"q":"ماذا كانت تفعل أم سليم رضي الله عنها بابنها أنس وهو صغير بعد إسلامها؟","options":["تمنعه من الخروج من البيت","تتركه مع أبيه ليختار دينه","تلقّنه: قل لا إله إلا الله، قل أشهد أن محمدًا رسول الله","تبعثه إلى مكة ليتعلم"],"answer":2,"why":"كانت تلقّن أنسًا وتشير إليه: «قل: لا إله إلا الله، قل: أشهد أن محمدًا رسول الله»، ففعل. فكانت سبّاقة إلى الإسلام ثم أصلحت ولدها ولقّنته الإسلام صغيرًا.","ref":"ص 3-4"},{"q":"بماذا ردّت أم سليم رضي الله عنها أبا طلحة حين خطبها وهو مشرك؟","options":["قبلت الزواج بشرط أن يمهرها مالًا كثيرًا","«إني فيك لراغبة، ولكنك رجل كافر، وأنا امرأة مسلمة، فإن تُسلم فذاك مهري»","رفضت لأنها لا تريد الزواج بعد زوجها","طلبت منه أن يعبد الله سرًّا ثم تتزوجه"],"answer":1,"why":"قالت: ما مثلك يا أبا طلحة يُرد، ولكنك رجل كافر وأنا امرأة مسلمة ولا يحل لي أن أتزوجك، فإن تُسلم فذاك مهري وما أسألك غيره.","ref":"ص 3"},{"q":"ماذا قال أنس رضي الله عنه عن مهر أم سليم؟","options":["ما بلغنا أن مهرًا كان أعظم منه؛ أنها رضيت الإسلام مهرًا","كان مهرها أكثر الأمهار مالًا","كان مهرها بستانًا من النخل","لم يكن لها مهر"],"answer":0,"why":"قال أنس رضي الله عنه: «فما بلغنا أن مهرًا كان أعظم منه أنها رضيت الإسلام مهرًا».","ref":"ص 3"},{"q":"ماذا حملت أم سليم رضي الله عنها في غزوة حنين وهي حامل بعبد الله بن أبي طلحة؟","options":["سيفًا","رمحًا","قوسًا","خنجرًا"],"answer":3,"why":"اتخذت يوم حنين خنجرًا، فقال أبو طلحة: يا رسول الله هذه أم سليم معها خنجر! فقالت: أتخذه إن دنا مني أحد من المشركين بقرتُ به بطنه. فتبسم رسول الله ﷺ وقال: «يا أم سليم إن الله قد كفى وأحسن».","ref":"ص 3"},{"q":"ماذا كانت تفعل أم سليم رضي الله عنها بعرق النبي ﷺ حين ينام عندها؟","options":["تغسله وتتخلص منه","تدفنه في بيتها","تجمعه وتجعله في طيبها وقواريرها","تقسّمه على نساء الأنصار"],"answer":2,"why":"كانت تحب النبي ﷺ حبًّا شديدًا وتتبرك بآثاره، فكانت تجمع عرقه فتجعله في الطيب والقوارير، فقال لها: «يا أم سليم ما هذا؟» قالت: عرقك أدوف به طيبي. وفي رواية: نرجو بركته لصبياننا، قال: «أصبتِ».","ref":"ص 4"},{"q":"ماذا فعلت أم سليم رضي الله عنها حين شرب النبي ﷺ من قربة معلّقة في بيتها وهو قائم؟","options":["أهدتها لأحد الصحابة","قطعت فمها وأمسكته عندها","غسلتها ثم أعادتها","دفنتها في بيتها"],"answer":1,"why":"دخل النبي ﷺ بيتها وفيه قربة معلّقة فيها ماء فشرب من فيها وهو قائم، فأخذتها أم سليم فقطعت فمها فأمسكته عندها.","ref":"ص 5"},{"q":"بماذا بشّر النبي ﷺ أم سليم وقد سمع خشفة في الجنة؟","options":["قال: «فإذا الغميصاء بنت ملحان أم أنس بن مالك»","قال: «فإذا فاطمة بنت محمد»","قال: «فإذا خديجة بنت خويلد»","قال: «فإذا أسماء بنت أبي بكر»"],"answer":0,"why":"قال النبي ﷺ: «دخلتُ الجنة فسمعت خشفة، فقلت: من هذا؟ قالوا: هذه الغميصاء بنت ملحان أم أنس بن مالك».","ref":"ص 6"},{"q":"كيف حرصت أم سليم رضي الله عنها على أن ينال ابنها أنس بركة قربه من النبي ﷺ؟","options":["أرسلته ليتعلم التجارة عند أبي طلحة","تركته يختار صحبة النبي ﷺ بنفسه","أرسلته إلى أهله في الشام","أخذت بيده وقدّمته ليخدم النبي ﷺ حين قدم المدينة"],"answer":3,"why":"قدم رسول الله ﷺ المدينة وأنس ابن ثماني سنين، فأخذت أمه بيده وانطلقت به إليه، فقالت: يا رسول الله، لا يبقى رجل ولا امرأة من الأنصار إلا أتحفك بتحفة، وإني لا أقدر على ما أتحفك به إلا ابني هذا فخذه فليخدمك ما بدا لك. وخدم النبي ﷺ عشر سنين.","ref":"ص 6"},{"q":"بماذا دعا النبي ﷺ لأنس رضي الله عنه حين طلبت أم سليم الدعاء له؟","options":["«اللهم اجعله من أعلم الناس»","«اللهم ارزقه الشهادة»","«اللهم ارزقه مالًا وولدًا، وبارك له فيهم»","«اللهم اجعله من أهل الجنة»"],"answer":2,"why":"بعد صلاة النبي ﷺ في بيتها قالت أم سليم: يا رسول الله إن لي خويصة، قالت: أنس. فدعا له بخير الدنيا والآخرة وقال: «اللهم ارزقه مالًا وولدًا، وبارك له فيهم».","ref":"ص 7"},{"q":"ماذا قالت أم سليم رضي الله عنها لزوجها أبي طلحة حين سألها عن ابنهما المريض الذي مات وهو غائب؟","options":["«قد مات الغلام فاصبر واحتسب»","«قد هدأت نفسه، وأرجو أن يكون قد استراح»","«اذهب إلى النبي ﷺ فأخبره أولًا»","«لا تسأل فهو بخير»"],"answer":1,"why":"مات ابن لأبي طلحة وهو خارج، فهيّأت أم سليم شيئًا وسجّته في جانب البيت، فقالت: قد هدأت نفسه وأرجو أن يكون قد استراح، وظن أبو طلحة أنها صادقة. فلما أصبح أخبرت النبي ﷺ فقال: «لعل الله أن يبارك لكما في ليلتكما».","ref":"ص 9"}],"13":[{"q":"من هو ابن كبشة بنت رافع رضي الله عنها الذي اهتز لموته عرش الرحمن؟","options":["أسيد بن حضير رضي الله عنه","سعد بن معاذ رضي الله عنه","مصعب بن عمير رضي الله عنه","عمرو بن الجموح رضي الله عنه"],"answer":1,"why":"كبشة بنت رافع أم سعد الأنصارية هي والدة سعد بن معاذ سيد الأنصار ورافع لوائهم، الذي اهتز لموته عرش الرحمن.","ref":"ص 3"},{"q":"من أول من بايع النبي ﷺ من النساء بحسب ما ذكر الواقدي؟","options":["أم سعد بن معاذ (كبشة بنت رافع)","خديجة بنت خويلد","أسماء بنت أبي بكر","سمية بنت خياط"],"answer":0,"why":"ذكر الواقدي أن أول من بايع النبي ﷺ أم سعد بن معاذ، وهي كبشة بنت رافع، وليلى بنت الخطيم، وليلى ومريم وسهيمة بنات أبي سفيان الليثي.","ref":"ص 3"},{"q":"على ماذا كانت بيعة النساء للنبي ﷺ المذكورة في الآية من سورة الممتحنة؟","options":["على الهجرة والجهاد فقط","على بذل المال للمسلمين","على طلب العلم دون غيره","على التوحيد ثم على مكارم الأخلاق"],"answer":3,"why":"الآية ﴿يا أيها النبي إذا جاءك المؤمنات يبايعنك على أن لا يشركن بالله شيئًا…﴾ هي بيعة على التوحيد ثم على مكارم الأخلاق والحفاظ على العقيدة والإيمان وعلى البيت.","ref":"ص 3"},{"q":"ماذا قال النبي ﷺ حين بايعته النساء وقلن: «هلمّ نبايعك يا رسول الله»؟","options":["«بايعن بالأيدي كما يبايع الرجال»","«لا بيعة للنساء»","«إني لا أصافح النساء، إنما قولي لمائة امرأة كقولي لامرأة واحدة»","«أجّلن البيعة إلى الغد»"],"answer":2,"why":"رواه النسائي عن أميمة بنت رقيقة، وفيه: «فيما استطعتِ وأطقتِ»، قلن: الله ورسوله أرحم بنا.","ref":"ص 3"},{"q":"من الصحابي الذي أرسله النبي ﷺ إلى المدينة ليعلّم أهلها القرآن والسنة ويدعوهم إلى الإسلام بعد بيعة العقبة؟","options":["أبو بكر الصديق رضي الله عنه","مصعب بن عمير رضي الله عنه","عمر بن الخطاب رضي الله عنه","علي بن أبي طالب رضي الله عنه"],"answer":1,"why":"لما بايع أهل العقبة وعادوا إلى قومهم أرسل النبي ﷺ مصعب بن عمير رضي الله عنه يعلّم الناس القرآن والسنة ويدعو أهل يثرب إلى الإسلام.","ref":"ص 4"},{"q":"ما أول دار أسلمت من دور الأنصار بحسب ما ذكره ابن الجوزي؟","options":["دار بني عبد الأشهل","دار بني النجار","دار بني الخزرج","دار بني سلمة"],"answer":0,"why":"لما أسلم سعد بن معاذ قال لقومه: «كلام رجالكم ونسائكم عليّ حرام حتى تؤمنوا بالله ورسوله»، فما أمسى في دار بني عبد الأشهل رجل ولا امرأة إلا مسلمًا ومسلمة، وهي أول دار أسلمت من دور الأنصار.","ref":"ص 4"},{"q":"ماذا قالت أم سعد للنبي ﷺ حين رأته سالمًا يوم أحد وقد شاع أنه قُتل؟","options":["«لقد خسرنا كل شيء»","«لن أرجع إلى بيتي حتى أُقتل»","«الحمد لله أنني لم أفقد ولدي»","«أما إذ رأيتك سالمًا فقد أشوت (هانت) المصيبة»"],"answer":3,"why":"جاءت أم سعد تعدو نحو رسول الله ﷺ، وقالت: أما إذ رأيتك سالمًا فقد أشوت المصيبة، فعزّاها النبي ﷺ بابنها عمرو بن معاذ الذي استشهد في أحد.","ref":"ص 4"},{"q":"ماذا قال النبي ﷺ لأم سعد حين عزّاها في ابنها عمرو بن معاذ؟","options":["«اصبري فسيعوّضك الله بمال كثير»","«لا تحزني، فقد نصرنا الله في أحد»","«أبشري وبشّري أهليهم أن قتلاهم ترافقوا في الجنة جميعًا وقد شُفّعوا في أهليهم»","«ادفنيه في أرضه ولا تبكي عليه»"],"answer":2,"why":"قال لها: «يا أم سعد أبشري وبشّري أهليهم أن قتلاهم ترافقوا في الجنة جميعًا وقد شُفّعوا في أهليهم»، قالت: رضينا برسول الله، ومن يبكي عليهم بعد هذا؟ ثم طلبت له الدعاء لمن خلّفوا.","ref":"ص 5"},{"q":"ماذا قال النبي ﷺ حين جعلت أم سعد تبكي عند جنازة سعد بن معاذ وقال لها عمر ما قال؟","options":["«دعها فبكاؤها حرام»","«كل بكّاءة تكذب إلا أم سعد»","«اصبرن فإن الصبر خير»","«لا يجوز البكاء على الميت»"],"answer":1,"why":"قال النبي ﷺ: «دعها يا عمر، كل بكّاءة تكذب إلا أم سعد»، وفي رواية أخرى: «كل بكية تكذب إلا أم سعد».","ref":"ص 6"},{"q":"أمامة بنت أبي العاص رضي الله عنها هي بنت أي بنات النبي ﷺ؟","options":["زينب رضي الله عنها","رقية رضي الله عنها","أم كلثوم رضي الله عنها","فاطمة رضي الله عنها"],"answer":0,"why":"أمها زينب بنت رسول الله ﷺ، أكبر بناته، وقد توفيت في السنة الثامنة للهجرة تاركة ابنتها أمامة صغيرة، وأبوها أبو العاص بن الربيع.","ref":"ص 9"},{"q":"ما صلة القرابة بين أبي العاص بن الربيع وأم المؤمنين خديجة رضي الله عنها؟","options":["ابن أخيها","ابن عمها","ابن خالها","ابن أختها"],"answer":3,"why":"أبو العاص بن الربيع هو ابن أخت أم المؤمنين خديجة رضي الله عنها، وكان من أكارم قريش، وأثنى عليه النبي ﷺ في مصاهرته خيرًا.","ref":"ص 9"},{"q":"ماذا فعل النبي ﷺ بأمامة في الصلاة، بحسب حديث أبي قتادة؟","options":["أبعدها إلى جانب المسجد قبل التكبير","تركها في بيته حتى لا تشغله","حملها على عاتقه، فإذا ركع وضعها وإذا قام أخذها","أمر بإخراجها عندما بدأ الصلاة"],"answer":2,"why":"خرج النبي ﷺ وأمامة على عاتقه فصلى بالناس، فإذا ركع وضعها، وإذا فرغ من سجوده وقام أخذها وردّها في مكانها، ولم يزل يفعل ذلك في كل ركعة حتى فرغ من صلاته.","ref":"ص 9-10"},{"q":"ماذا أهدي للنبي ﷺ من الحبشة ثم قال فيها: «لأدفعنّها إلى أحب أهلي إليّ»؟","options":["خاتم من ذهب","قلادة من جزع (خرز يماني)","ثوب من حرير","كساء من صوف"],"answer":1,"why":"أهديت للنبي ﷺ يومًا هدية من الحبشة من عند النجاشي فيها قلادة من جزع، فقال: «لأدفعنها إلى أحب أهلي إليّ»، فدعا أمامة بنت زينب فعلّقها في عنقها وعقدها بيده.","ref":"ص 10"},{"q":"من الذي أوصى به أبو العاص بن الربيع ليكون وليًّا على ابنته أمامة قبل وفاته؟","options":["الزبير بن العوام رضي الله عنه","سعد بن أبي وقاص رضي الله عنه","حكيم بن حزام رضي الله عنه","علي بن أبي طالب رضي الله عنه"],"answer":0,"why":"أوصى أبو العاص بن الربيع الزبير بن العوام ابن خاله ليكون وليًّا لها، فعاشت في كنفه وكنف زوجته أسماء رضي الله عنهما.","ref":"ص 12"}],"14":[{"q":"ما اللقب الذي اشتهرت به أم ورقة بنت نوفل الأنصارية رضي الله عنها؟","options":["القارئة","الصدّيقة","الشهيدة","الأنصارية الكبرى"],"answer":2,"why":"ذكر الدرس أنها كانت تُسمّى «الشهيدة»، وكان النبي ﷺ يقول: «انطلقوا بنا نزور الشهيدة».","ref":"ص 3"},{"q":"ماذا استأذنت أم ورقة رضي الله عنها النبي ﷺ أن تتخذه في دارها؟","options":["معلّمة للنساء","مؤذنًا","مصلّى خاصًّا","حارسًا للدار"],"answer":1,"why":"جاء في سنن أبي داود أنها استأذنت النبي ﷺ أن تتخذ في دارها مؤذنًا فأذن لها.","ref":"ص 3"},{"q":"بماذا أمر النبي ﷺ أم ورقة رضي الله عنها في دارها؟","options":["أن تؤمّ أهل دارها","أن تخرج للجهاد","أن تُفتي النساء","أن تعلّم الصبيان الكتابة"],"answer":0,"why":"ورد عند أحمد وأبي داود أن النبي ﷺ أمرها أن تؤم أهل دارها، وكان لها مؤذن.","ref":"ص 3–4"},{"q":"ما الذي تدل عليه إمامة أم ورقة لأهل دارها بحسب الفائدة المذكورة في الدرس؟","options":["أن المرأة تؤم الرجال في الفرائض","أن الأذان واجب على النساء","أن صلاة الجماعة تسقط عن النساء","أن إمامة المرأة للنساء صحيحة"],"answer":3,"why":"ذكر الدرس أن المراد أنها كانت تؤم أهل دارها من النساء والإماء، ودلّ الحديث على أن إمامة النساء صحيحة.","ref":"ص 4"},{"q":"ماذا قال عمر رضي الله عنه حين لم يسمع قراءتها ذات ليلة؟","options":["«والله ما رأيت خالتي أم ورقة البارحة»","«ما أحسن قراءة خالتي أم ورقة»","«والله ما سمعت قراءة خالتي أم ورقة البارحة»","«افتقدنا أذان أم ورقة البارحة»"],"answer":2,"why":"ذكر الدرس أن عمر كان يسمع دوي تلاوتها كل ليلة، فلما افتقدها أصبح يتساءل عنها، وهذا يدل على مواظبتها على قيام الليل.","ref":"ص 4–5"},{"q":"ماذا قال النبي ﷺ لأم ورقة حين استأذنته في الغزو يوم بدر؟","options":["«اخرجي مع الجيش لتداوي الجرحى»","«قرّي في بيتك فإن الله تعالى يرزقك الشهادة»","«اصبري حتى يُفتح لكِ باب الجهاد»","«ابقَي في المدينة وعلّمي النساء»"],"answer":1,"why":"جاء في الحديث أنها قالت: ائذن لي في الغزو معك أمرّض مرضاكم، فقال لها: «قرّي في بيتك فإن الله تعالى يرزقك الشهادة».","ref":"ص 5"},{"q":"ما الذي حدث للغلام والجارية اللذين قتلا أم ورقة رضي الله عنها؟","options":["أمر عمر بهما فصُلبا، فكانا أول مصلوب بالمدينة","نُفيا من المدينة","أُخذت منهما الدية","عفا عنهما عمر رضي الله عنه"],"answer":0,"why":"ذكر الحديث أنهما تعجّلا موتها لينالا العتق، فقتلاها، فأمر عمر بهما فصُلبا، وكانا أول مصلوب بالمدينة.","ref":"ص 5–6"},{"q":"ما أبرز فائدة تربوية تدل عليها قصة أم ورقة بخصوص النية والشهادة؟","options":["الشهادة لا تُنال إلا في ساحة المعركة","علو الهمة لا يكون إلا في ميدان واحد","القرآن لا يرفع شأن صاحبه في الدنيا","النية الصادقة تبلغ بصاحبها أعلى المقامات"],"answer":3,"why":"من الفوائد المذكورة أن من سأل الله الشهادة بصدق بلّغه الله منازل الشهداء ولو مات على فراشه (رواه مسلم).","ref":"ص 6–7"},{"q":"ما اسم أم الفضل رضي الله عنها؟","options":["لبابة الصغرى العصماء","ميمونة بنت الحارث","لبابة الكبرى بنت الحارث الهلالية","عزة بنت الحارث"],"answer":2,"why":"ذكر الدرس أنها لبابة الكبرى بنت الحارث بن حزن الهلالية، وتُكنى أم الفضل.","ref":"ص 9"},{"q":"من هي أخت أم الفضل لأبيها وأمها من أمهات المؤمنين؟","options":["حفصة رضي الله عنها","ميمونة رضي الله عنها","زينب بنت جحش رضي الله عنها","جويرية رضي الله عنها"],"answer":1,"why":"ذكر الدرس أنها أخت أم المؤمنين ميمونة لأبيها وأمها.","ref":"ص 9"},{"q":"كم رجلًا ولدت أم الفضل رضي الله عنها للعباس رضي الله عنه بحسب الدرس؟","options":["ستة رجال","أربعة رجال","ثمانية رجال","عشرة رجال"],"answer":0,"why":"ذكر الدرس أنها ولدت للعباس ستة رجال لم تلد امرأة مثلهم، وهم الفضل وعبد الله ومعبد وعبيد الله وقثم وعبد الرحمن.","ref":"ص 9"},{"q":"ماذا قال النبي ﷺ عن العباس رضي الله عنه؟","options":["«العباس أمين هذه الأمة»","«العباس سيد قريش»","«العباس أحب أعمامي إليّ»","«فإن العباس مني وأنا منه»"],"answer":3,"why":"ورد في رواية النسائي أن النبي ﷺ قال: «فإن العباس مني وأنا منه».","ref":"ص 10"},{"q":"بمن قيل إن أم الفضل أول امرأة أسلمت بعدها؟","options":["سمية بنت خياط رضي الله عنها","فاطمة بنت الخطاب رضي الله عنها","خديجة رضي الله عنها","أم سلمة رضي الله عنها"],"answer":2,"why":"ذكر الدرس أنها من السابقين الأولين، ويقال إنها أول امرأة أسلمت بعد خديجة رضي الله عنها.","ref":"ص 10"},{"q":"لماذا تأخرت هجرة أم الفضل رضي الله عنها؟","options":["لأنها كانت مريضة","لأنها لم تستطع أن تترك زوجها العباس ولم يكن قد أسلم بعد","لأن النبي ﷺ أمرها بالبقاء في مكة","لأنها لم تكن قد أسلمت"],"answer":1,"why":"ذكر الدرس أنها لم تستطع أن تهاجر وتترك زوجها، فهاجرت بعد إسلام العباس رضي الله عنه.","ref":"ص 10–11"},{"q":"ماذا فعلت أم الفضل بأبي لهب حين أساء إلى أبي رافع رضي الله عنه؟","options":["ضربته بعمود من عمد الحجرة فشجّت رأسه","طردته من الحجرة بصوتها","شكته إلى العباس رضي الله عنه","أخبرت النبي ﷺ فعاقبه"],"answer":0,"why":"جاء في الحديث أنها أخذت عمودًا من عمد الحجرة فضربته به فشجّت رأسه، ثم ما عاش إلا سبع ليال.","ref":"ص 12"},{"q":"ماذا كان تفسير النبي ﷺ لرؤيا أم الفضل حين رأت أن في بيتها عضوًا من أعضائه؟","options":["ستلد أم الفضل غلامًا يشبه النبي ﷺ","ستنتقل أم الفضل إلى بيت النبي ﷺ","سيسلم زوجها العباس قريبًا","تلد فاطمة غلامًا فتكفله أم الفضل بلبن ابنها قثم"],"answer":3,"why":"ذكر الحديث أن النبي ﷺ فسّرها بأن فاطمة تلد غلامًا فتكفله بلبن قثم، فولدت الحسن فأرضعته.","ref":"ص 12"},{"q":"بماذا أرسلت أم الفضل إلى النبي ﷺ يوم عرفة حين اختلف الناس في صيامه؟","options":["بتمر","بماء زمزم","بقدح من لبن","بخبز وسمن"],"answer":2,"why":"أرسلت إليه بقدح من لبن وهو واقف على بعيره بعرفة فشربه (رواه البخاري ومسلم)، وهذا يدل على حكمتها وفطنتها.","ref":"ص 13"}],"15":[{"q":"ما وصف سفيان بن عيينة لرسول الله ﷺ بحسب الدرس؟","options":["القاضي الأعدل بين الناس","المعلّم الأول للأمة","الشاهد على الأعمال","الميزان الأكبر الذي تُعرض عليه الأشياء"],"answer":3,"why":"نقل الدرس قول سفيان: «إن رسول الله ﷺ هو الميزان الأكبر، فعليه تُعرض الأشياء على خلقه وسيرته وهديه، فما وافقها فهو الحق وما خالفها فهو الباطل».","ref":"ص 2"},{"q":"ماذا قالت عائشة رضي الله عنها حين سُئلت عن خُلق النبي ﷺ؟","options":["«كان أحسن الناس صوتًا»","«كان يعفو عمن ظلمه»","«كان خلقه القرآن»","«كان لا يغضب أبدًا»"],"answer":2,"why":"رواه أحمد، وقال النووي: معناه العمل به والوقوف عند حدوده والتأدب بآدابه والاعتبار بأمثاله وقصصه وتدبره وحسن تلاوته.","ref":"ص 3"},{"q":"ما الآية التي ذُكرت في الدرس شهادةً من الله عز وجل لخلق نبيه ﷺ؟","options":["﴿لقد كان لكم في رسول الله أسوة حسنة﴾","﴿وإنك لعلى خلق عظيم﴾","﴿وما أرسلناك إلا رحمة للعالمين﴾","﴿فبما رحمة من الله لنت لهم﴾"],"answer":1,"why":"ذكر الدرس أنه يكفيه شهادة ربه عز وجل له بقوله: ﴿وإنك لعلى خلق عظيم﴾ [القلم: 4].","ref":"ص 3"},{"q":"ما الحديث الذي جعل فيه النبي ﷺ معيار الخيرية في حسن معاملة الأهل؟","options":["«خيركم خيركم لأهله وأنا خيركم لأهلي»","«إنما بُعثت لأتمم مكارم الأخلاق»","«أكمل المؤمنين إيمانًا أحسنهم خلقًا»","«الدين المعاملة»"],"answer":0,"why":"رواه الترمذي عن عائشة رضي الله عنها.","ref":"ص 3"},{"q":"ما الذي يدل عليه قول النبي ﷺ: «لا يَفرَك مؤمن مؤمنة، إن كره منها خلقًا رضي منها آخر»؟","options":["أن المؤمن لا يُبدي كراهيته أبدًا","أن عيوب الزوجة لا تُذكر","أن الزوج لا يعاتب زوجته","النظر إلى الجوانب الحسنة والتغاضي عن العيوب"],"answer":3,"why":"ذكر الدرس أن من هديه ﷺ في حسن معاملة أهله النظر إلى الجوانب الحسنة والتغاضي عن العيوب (رواه مسلم)، وكذلك تفعل الزوجة المؤمنة مع زوجها.","ref":"ص 4"},{"q":"إلى أين خرج النبي ﷺ في الليلة التي كانت عنده فيها عائشة رضي الله عنها في الحديث المذكور؟","options":["إلى المسجد","إلى بيت إحدى نسائه","إلى البقيع","إلى أُحد"],"answer":2,"why":"جاء في الحديث أنه انطلق فأخذ رداءه رويدًا وانتعل رويدًا وفتح الباب رويدًا، ثم خرج إلى البقيع فوقف وأطال القيام ورفع يديه.","ref":"ص 4"},{"q":"لماذا خرجت عائشة رضي الله عنها تتبع النبي ﷺ في تلك الليلة؟","options":["لتوقظه لصلاة الفجر","غَيرةً، خشية أن يكون ذهب إلى بعض نسائه","لتسأله عن حاجة","لأنها سمعته يناديها"],"answer":1,"why":"ذكر الدرس أن غيرتها حمَتها فخرجت تتبعه خشية أن يكون ذهب إلى إحدى نسائه.","ref":"ص 5"},{"q":"لماذا لم يوقظ النبي ﷺ عائشة رضي الله عنها حين خرج؟","options":["خشية أن تستوحش وكره أن يوقظها","لأنه كان يريد أن يختبرها","لأنه نسي إخبارها","لأنها كانت مريضة"],"answer":0,"why":"في الحديث: «وظننتُ أن قد رقدتِ، فكرهتُ أن أوقظكِ، وخشيتُ أن تستوحشي»، وفيه نبل الإحساس ومراعاة شعور الزوج.","ref":"ص 5"},{"q":"ماذا فعل النبي ﷺ حين رأى سواد عائشة أمامه وعلم أنها تبعته؟","options":["أمرها بالعودة غاضبًا","تجاهلها حتى رجع إلى البيت","أمر بإغلاق الباب في وجهها","لَهَدها في صدرها ضربةً أوجعتها"],"answer":3,"why":"جاء في الحديث أنه «لهدني في صدري لهدة أوجعتني»، وفي الدرس أنه لا مانع من تأديب الزوج زوجته باليد إذا كان التأديب في إطاره المقبول الذي لا يكسر ولا يجرح ولا يؤذي.","ref":"ص 5"},{"q":"ما الذي علّمه النبي ﷺ عائشة أن تقوله إذا زارت أهل البقيع؟","options":["«اللهم لا تحرمنا أجرهم ولا تفتنا بعدهم»","«رب اغفر وارحم وأنت خير الراحمين»","«السلام على أهل الديار من المؤمنين والمسلمين...»","«سبحان الله وبحمده»"],"answer":2,"why":"جاء في الحديث: «قولي: السلام على أهل الديار من المؤمنين والمسلمين، ويرحم الله المستقدمين منا والمستأخرين، وإنا إن شاء الله بكم لاحقون» (رواه مسلم).","ref":"ص 5"},{"q":"ما اللطيفة في معاملة النبي ﷺ لعائشة رضي الله عنها التي أُوردت في القيم المستفادة من المواقف النبوية؟","options":["كان يخدمها بنفسه كل يوم","كان يشرب من الموضع الذي شربت منه وهي حائض","كان يترك لها اختيار الطعام دائمًا","كان يسافر بها في كل غزوة"],"answer":1,"why":"رواه مسلم عن عائشة: كانت تشرب وهي حائض ثم تناوله النبي ﷺ فيضع فاه على موضع فيها، وهو من تلطفه بأهله ومؤانسته لها.","ref":"ص 6"},{"q":"ما عدد مراحل استخلاص القيم التربوية من المواقف النبوية التي ذكرها الدرس؟","options":["خمس مراحل","ثلاث مراحل","سبع مراحل","عشر مراحل"],"answer":0,"why":"المراحل: الفهم والتحليل النصي، الكشف عن القيم التربوية، التحليل التربوي، التوظيف العملي، التقويم والربط المنهجي (وفيها عشر خطوات).","ref":"ص 8–12"},{"q":"ما المرحلة الأولى من مراحل استخلاص القيم التربوية؟","options":["مرحلة التوظيف العملي","مرحلة التقويم والربط المنهجي","مرحلة التحليل التربوي","مرحلة الفهم والتحليل النصي"],"answer":3,"why":"ذكر الدرس أن أولى المراحل هي الفهم والتحليل النصي، وفيها: تحديد الموقف النبوي بدقة، وقراءته قراءة شمولية، والتحليل اللغوي والمعنوي.","ref":"ص 8"},{"q":"أي القيم التالية ضمن «القيم الأخلاقية» بحسب تصنيف الدرس؟","options":["الإخلاص والتوكل والخشوع","التعاون والعدل واحترام الكبير","الصدق والأمانة والرحمة","التفكر والسؤال والتعلم"],"answer":2,"why":"صنّف الدرس القيم الأخلاقية بأنها: الصدق، الأمانة، الرحمة.","ref":"ص 10"},{"q":"ما القاعدة التربوية التي مثّل بها الدرس للمبادئ العامة المستنتجة من المواقف؟","options":["«العقوبة أنفع من الثواب»","«التربية بالقدوة أبلغ من التربية بالقول»","«التكرار أساس التعلم»","«الشدة أنجح من اللين»"],"answer":1,"why":"من أمثلة المبادئ التربوية العامة: «التربية بالقدوة أبلغ من التربية بالقول»، و«المربي الناجح يوازن بين الحزم والرحمة»، و«تصحيح الخطأ في وقته يرسّخ القيم».","ref":"ص 10–11"},{"q":"لماذا وجد بعض الأنصار في أنفسهم في الموقف المذكور في حديث أبي سعيد الخدري رضي الله عنه؟","options":["لأن النبي ﷺ أعطى العطايا في قريش وقبائل العرب ولم يكن في الأنصار منها شيء","لأنه لم يشركهم في الغزوة","لأنه أمّر عليهم رجلًا من المهاجرين","لأنه حبس عنهم نفقاتهم"],"answer":0,"why":"جاء في الحديث أنه لما أعطى النبي ﷺ ما أعطى من تلك العطايا في قريش وقبائل العرب ولم يكن في الأنصار منها شيء وجد هذا الحي من الأنصار في أنفسهم.","ref":"ص 12"},{"q":"من الذي أخبر النبي ﷺ بما وجده الأنصار في أنفسهم؟","options":["أُبي بن كعب رضي الله عنه","أنس بن مالك رضي الله عنه","عمر بن الخطاب رضي الله عنه","سعد بن عبادة رضي الله عنه"],"answer":3,"why":"في الحديث: فدخل عليه سعد بن عبادة فقال: يا رسول الله إن هذا الحي من الأنصار قد وجدوا عليك في أنفسهم.","ref":"ص 12"},{"q":"بماذا ختم الأنصار الموقف بعد كلام النبي ﷺ إليهم؟","options":["طلبوا نصيبًا من الغنائم","طلبوا أن يُعطوا مثل قريش","قالوا: «رضينا برسول الله قسمًا وحظًّا»","اعتذروا عن الغزو"],"answer":2,"why":"جاء في الحديث: فبكى القوم حتى أخضلوا لحاهم وقالوا: رضينا برسول الله ﷺ قسمًا وحظًّا، ثم تفرقوا (رواه أحمد).","ref":"ص 13"}]},"s3":{"1":[{"q":"ما تعريف القرآن الكريم بحسب الدرس؟","options":["كلام النبي ﷺ المنقول إلينا بالآحاد","كلام الله المنزل على محمد ﷺ المتعبد بتلاوته المعجز بأقصر سورة منه، المبدوء بسورة الفاتحة والمختوم بسورة الناس، المنقول إلينا بالتواتر","كلام الله المنزل على موسى عليه السلام","كل ما رُوي عن النبي ﷺ من الأحاديث"],"answer":1,"why":"القرآن الكريم هو كلام الله، المنزل على محمد ﷺ، المتعبد بتلاوته، المعجز بأقصر سورة منه، المبدوء بسورة الفاتحة، المختوم بسورة الناس، المكتوب في المصاحف، المنقول إلينا بالتواتر.","ref":"ص 3"},{"q":"ماذا قال ابن عباس رضي الله عنهما عمّن قرأ القرآن واتبع ما فيه؟","options":["ضمن الله لمن قرأ القرآن ألا يضل في الدنيا ولا يشقى في الآخرة","ضمن الله له الغنى في الدنيا","ضمن الله له أن يُغفر له كل ذنب","ضمن الله له ألا يمرض أبدًا"],"answer":0,"why":"قال ابن عباس: «ضمن الله لمن قرأ القرآن ألا يضل في الدنيا ولا يشقى في الآخرة، ثم تلا: ﴿فَمَنِ اتَّبَعَ هُدَايَ فَلَا يَضِلُّ وَلَا يَشْقَى﴾ [طه: 123]».","ref":"ص 3"},{"q":"ما معنى «الفرقان» كاسمٍ من أسماء القرآن بحسب الدرس؟","options":["أنه كتاب مفرّق على أجزاء","أنه خاص بالفروق بين الأمم","أنه كلام بليغ لا يُتعبَّد بتلاوته","أنه يفرّق بين الحق والباطل، والحلال والحرام، والخير والشر، والهدى والضلال"],"answer":3,"why":"قال تعالى: ﴿تَبَارَكَ الَّذِي نَزَّلَ الْفُرْقَانَ عَلَى عَبْدِهِ﴾؛ فهو يفرّق بين الحق والباطل، ويبيّن لنا الحلال من الحرام، والخير من الشر، والهدى من الضلال.","ref":"ص 4"},{"q":"ماذا قال قتادة في معنى قوله تعالى: ﴿لِمَا يُحْيِيكُمْ﴾؟","options":["هو الجهاد في سبيل الله","هو الهجرة إلى المدينة","هو هذا القرآن، فيه الحياة والثقة والنجاة والعصمة في الدنيا والآخرة","هو الإنفاق في سبيل الله"],"answer":2,"why":"قال قتادة: «لما يحييكم: هو هذا القرآن، فيه الحياة، والثقة، والنجاة، والعصمة، في الدنيا والآخرة».","ref":"ص 4"},{"q":"لماذا سُمّي القرآن «روحًا» بحسب الدرس؟","options":["لأنه ينزل بالليل فقط","لأنه حياة لمن آمن به، ومن لم يؤمن به فهو ميت","لأنه يُتلى بالروح دون اللسان","لأنه من أسماء جبريل عليه السلام"],"answer":1,"why":"قال تعالى: ﴿وَكَذَٰلِكَ أَوْحَيْنَا إِلَيْكَ رُوحًا مِنْ أَمْرِنَا﴾؛ فهو حياة لمن آمن به، ومن لم يؤمن به فهو ميت.","ref":"ص 5"},{"q":"ما الحديث الذي رواه البخاري عن عثمان رضي الله عنه في فضل أهل القرآن (الخيرية على جميع الناس)؟","options":["«خيركم من تعلّم القرآن وعلّمه»","«أفضلكم من حفظ القرآن كله»","«أحبكم إلى الله أكثركم تلاوة»","«أكرمكم عند الله أطولكم قيامًا»"],"answer":0,"why":"روى البخاري عن عثمان رضي الله عنه عن النبي ﷺ قال: «خيركم من تعلّم القرآن وعلّمه».","ref":"ص 7"},{"q":"بماذا شبّه النبي ﷺ الذي يقرأ القرآن وهو حافظ له؟","options":["مع الشهداء والصديقين في الجنة","كمثل الغيث الذي يصيب الأرض","كمثل النور في ظلمات الليل","«مع السفرة الكرام البررة»، والذي يقرؤه ويتعاهده وهو عليه شديد فله أجران"],"answer":3,"why":"قال ﷺ: «مثل الذي يقرأ القرآن وهو حافظ له مع السفرة الكرام البررة، ومثل الذي يقرأ وهو يتعاهده وهو عليه شديد فله أجران» (أخرجه البخاري).","ref":"ص 8"},{"q":"ماذا يُقال لصاحب القرآن يوم القيامة بحسب الحديث الذي أورده الدرس؟","options":["«ادخل الجنة بسلام آمنًا»","«اجلس حتى يُحاسَب الناس»","«اقرأ وارتق ورتّل كما كنت ترتّل في الدنيا، فإن منزلتك عند آخر آية تقرؤها»","«ارجع إلى الدنيا فاقرأ أكثر»"],"answer":2,"why":"عن عبد الله بن عمرو رضي الله عنهما أن النبي ﷺ قال: «يقال لصاحب القرآن: اقرأ وارتق ورتّل كما كنت ترتّل في الدنيا، فإن منزلتك عند آخر آية تقرؤها» (متفق عليه).","ref":"ص 8"},{"q":"لماذا خاف ثابت بن قيس رضي الله عنه حين نزل قوله تعالى: ﴿لَا تَرْفَعُوا أَصْوَاتَكُمْ فَوْقَ صَوْتِ النَّبِيِّ﴾، وماذا قال له النبي ﷺ؟","options":["لأنه كان ضعيف الصوت فأمره النبي ﷺ بالسكوت","لأنه كان جهوريّ الصوت فظن أنه من أهل النار، فقال له النبي ﷺ: «بل هو من أهل الجنة»","لأنه سمع الآية مرة واحدة فلم يفهمها","لأنه أنكر على النبي ﷺ بصوته"],"answer":1,"why":"خاف ثابت بن قيس فجلس في بيته حزينًا وقال: «أنا من أهل النار»، فأخبر سعد بن معاذ النبي ﷺ بذلك، فقال له: «بل هو من أهل الجنة»، وكان هذا من شدة تعظيمه لأمر الله وخوفه من مخالفة القرآن.","ref":"ص 10"},{"q":"ما الذي قاله الرجل الذي وجّهه عمر رضي الله عنه إلى تعلّم كتاب الله بعد تعلّمه؟","options":["«وجدت في كتاب الله ما أغناني عن باب عمر»","«وجدت في كتاب الله سبيل الجهاد»","«وجدت في كتاب الله علم الحساب»","«وجدت في كتاب الله ما يرفع عني الفقر في الحال»"],"answer":0,"why":"وجّه عمر أحد الناس إلى هذا الغنى حين أكثر التردد عليه، فقال: «اذهب فتعلّم كتاب الله»، فلما تعلمه قال له: «وجدت في كتاب الله ما أغناني عن باب عمر!».","ref":"ص 14"}],"2":[{"q":"ما المقصود بالإعجاز اصطلاحًا بحسب الدرس؟","options":["قوة بيان القرآن فقط","كثرة أحكام القرآن","عجز المخاطبين بالقرآن وقت نزوله ومن بعدهم إلى يوم القيامة عن الإتيان بمثله، مع تمكنهم من البيان والبلاغة وتوفر الدواعي واستمرار البواعث","حسن تلاوة القرآن"],"answer":2,"why":"الإعجاز اصطلاحًا: عجز المخاطبين بالقرآن وقت نزوله ومن بعدهم إلى يوم القيامة عن الإتيان بمثل هذا القرآن، مع تمكنهم من البيان والبلاغة وتوفر الدواعي واستمرار البواعث.","ref":"ص 2"},{"q":"ما المعجزة بحسب التعريف الذي أورده الدرس؟","options":["أمر عادي يحدث لأي إنسان","أمر خارق للعادة، مقرون بالتحدي، سالم من المعارضة، يُجريه الله على يد نبيه شاهدًا على صدقه","علم يتعلمه النبي من قومه","حكمة يتوارثها الأنبياء"],"answer":1,"why":"المعجزة: «أمر خارق للعادة، مقرون بالتحدي، سالم من المعارضة، يُجريه الله تعالى على يد نبيه، شاهدًا على صدقه»، كتحويل عصا موسى إلى حية تسعى.","ref":"ص 3"},{"q":"لماذا جاءت معجزة موسى عليه السلام من جنس السحر، ومعجزة عيسى عليه السلام من جنس الطب؟","options":["لأن سنّة الله أن تكون معجزة كل نبي من جنس ما برع فيه قومه الذين أُرسل إليهم","لأن الأنبياء لا يختارون ما يناسبهم","لأن المعجزات كانت تتغير حسب الزمان فقط","لأن القرآن لم يكن قد نزل"],"answer":0,"why":"جرت سنة الله أن تكون معجزة كل نبي من جنس ما برع فيه قومه؛ فمعجزة موسى من جنس السحر الذي غلب على أهل زمانه، ومعجزة عيسى من جنس الطب الذي ذاع في عصره.","ref":"ص 3"},{"q":"ما القيدان اللذان قُيّدت بهما معجزات الأنبياء السابقين بحسب الدرس؟","options":["أنها عقلية وعالمية","أنها علمية وتشريعية","أنها مكتوبة ومحفوظة","أنها حسّية تخاطب العيان وتستهدف الحس المباشر، وأنها محدودة الزمان والمكان"],"answer":3,"why":"كانت معجزاتهم مقيّدة بقيدين: الأول أنها حسّية تخاطب العيان، والثاني أنها محدودة الزمان والمكان لأن الأنبياء كانوا يُرسلون إلى أقوامهم خاصة.","ref":"ص 3"},{"q":"ما معجزة النبي ﷺ العظمى الخالدة بحسب الدرس؟","options":["انشقاق القمر","نبع الماء من بين أصابعه","القرآن الكريم","الإسراء والمعراج"],"answer":2,"why":"معجزة القرآن العظمى تجاوزت في طابعها الحسيّ المادي إلى الإعجاز البياني والتشريعي الخالد، وبقيت معجزة قائمة متجددة عبر الزمان والمكان إلى قيام الساعة.","ref":"ص 4"},{"q":"ما أشهر وجوه الإعجاز القرآني وأشملها بحسب الدرس؟","options":["الإعجاز العلمي","الإعجاز البياني","الإعجاز التشريعي","الإعجاز العددي"],"answer":1,"why":"إعجاز القرآن البياني هو أشهر وجوه الإعجاز مطلقًا لأنه قول الغالبية العظمى من المحققين، ولأنه ينتظم آيات القرآن كلها، في حين أن وجوه الإعجاز الأخرى لا تنتظم إلا عددًا من الآيات.","ref":"ص 5"},{"q":"بماذا يتمثل التحدي القرآني في الآيات: ﴿فَلْيَأْتُوا بِحَدِيثٍ مِثْلِهِ﴾، ﴿فَأْتُوا بِعَشْرِ سُوَرٍ مِثْلِهِ﴾، ﴿فَأْتُوا بِسُورَةٍ مِثْلِهِ﴾؟","options":["تحدّاهم أن يأتوا بمثل القرآن من غير تعيين قدر معين، ثم بعشر سور مثله، ثم بسورة واحدة مثله","تحدّاهم أن يحفظوه في ليلة واحدة","تحدّاهم أن يترجموه إلى لغات أخرى","تحدّاهم أن يجمعوه في مصحف واحد"],"answer":0,"why":"تعددت آيات التحدي: تحدّاهم أن يأتوا بمثل القرآن من غير تعيين قدر معين، ثم بعشر سور مثله، ثم بسورة واحدة مثله، وقد بلغ التحدي غايته بوصفهم بالعجز التام.","ref":"ص 4"},{"q":"إلامَ تشير الحروف المقطعة في أوائل السور بحسب جمع من العلماء؟","options":["إلى أسماء الملائكة","إلى أزمنة معينة","إلى أسماء الأنبياء","إلى إعجاز القرآن وإثبات أنه كلام الله، لأنه مكوَّن من الحروف التي يتكلمون بها فعجزوا عن معارضته"],"answer":3,"why":"ذكر جمع من العلماء أن المراد بهذه الأحرف الإشارة إلى حروف الهجاء للوصول إلى إعجاز القرآن وإثبات أنه كلام الله، لأنه مكوَّن من الأحرف التي يتكلمون بها، فإذا عجزوا عن معارضته ثبت أنه كلام الله.","ref":"ص 6"},{"q":"كم سورة افتُتحت بالحروف المقطعة، وكم منها ذُكر فيه الانتصار للقرآن بحسب الدرس؟","options":["عشرون سورة، ذُكر الانتصار في عشر منها","ثلاثون سورة، ذُكر الانتصار في عشرين منها","تسع وعشرون سورة، ذُكر الانتصار للقرآن في خمس وعشرين منها","تسع سور، ذُكر الانتصار في ثلاث منها"],"answer":2,"why":"السور التي افتتحت بتلك الحروف المقطعة تسع وعشرون سورة، ذُكر الانتصار للقرآن في خمس وعشرين منها.","ref":"ص 6"},{"q":"ما فائدة تكرار الباء في قوله تعالى: ﴿وَمِنَ النَّاسِ مَنْ يَقُولُ آمَنَّا بِاللَّهِ وَبِالْيَوْمِ الْآخِرِ وَمَا هُمْ بِمُؤْمِنِينَ﴾ بحسب الدرس؟","options":["التقديم والاختصاص","التأكيد؛ لأنهم أكّدوا كلامهم نفيًا للريبة وإبعادًا للتهمة، فنفى الله الإيمان عنهم بأوكد الألفاظ","تخفيف الثقل النفسي","التمييز بين موضوعين"],"answer":1,"why":"أعاد الله (الباء) مع حرف العطف في ﴿وَبِالْيَوْمِ الْآخِرِ﴾، وفائدة التكرار التأكيد؛ لأنهم أكّدوا كلامهم لريبة وإبعادًا للتهمة، فنفى عنهم الإيمان بأوكد الألفاظ.","ref":"ص 8"},{"q":"ما الحقيقة العلمية التي ذكرها الدرس في تسمية الجبال بالأوتاد في قوله تعالى: ﴿وَالْجِبَالَ أَوْتَادًا﴾؟","options":["أن الجبال لها امتدادات عميقة تحت الأرض تعمل على تثبيت القشرة الأرضية، وتُسمّى بجذور الجبال","أن الجبال مصدر المياه فقط","أن الجبال تمنع الزلازل نهائيًّا","أن الجبال ترتفع كل عام"],"answer":0,"why":"الحقيقة العلمية أن للجبال امتدادات عميقة تحت الأرض تعمل على تثبيت القشرة الأرضية، وتُسمّى بجذور الجبال؛ فالوتد هو الشيء الذي يثبّت غيره.","ref":"ص 11"}],"3":[{"q":"كم عدد حقوق القرآن التسعة التي تناولها الدرس، وما أولها؟","options":["سبعة حقوق، أولها حق التلاوة","تسعة حقوق، أولها حق الحفظ","عشرة حقوق، أولها حق التدبر","تسعة حقوق، أولها حق الإيمان والتصديق"],"answer":3,"why":"تناول الدرس حقوق القرآن: الإيمان والتصديق، التلاوة، الحفظ، التدبر، العمل، التحاكم إليه، التعظيم والإجلال، التبليغ، الاستشفاء به.","ref":"ص 2"},{"q":"كيف تُرسّخ الأسرة المسلمة الإيمان بالقرآن وجدانيًّا بحسب الدرس؟","options":["بتحديد جلسة أسبوعية لتفسير آية واحدة فقط","بتدريب الأبناء على التخلق بآية كل أسبوع","بتكريم من يحفظ أو يقرأ القرآن في البيت بجائزة رمزية أو دعاء، وسرد قصص الصحابة والتابعين الذين آمنوا بسبب آياته وربط المشاعر بالقرآن","بفرض عقوبات على من يقصر في الحفظ"],"answer":2,"why":"وجدانيًّا: بتكريم من يحفظ أو يقرأ القرآن بجائزة رمزية أو دعاء، وكذا سرد قصص الصحابة والتابعين الذين آمنوا بسبب آيات القرآن، ربط المشاعر بالقرآن إذا عند الخوف والفرح والنعمة.","ref":"ص 3"},{"q":"بماذا مدح الله تعالى الذين يتلون القرآن حق تلاوته؟","options":["بأنهم يحفظونه كاملًا","﴿أُولَٰئِكَ يُؤْمِنُونَ بِهِ﴾، فالتلاوة قراءة يتبعها الاتباع وتحليل الحلال وتحريم الحرام","بأنهم يرتلونه بأصوات حسنة فقط","بأنهم يقرؤونه في المواسم"],"answer":1,"why":"قال تعالى: ﴿الَّذِينَ آتَيْنَاهُمُ الْكِتَابَ يَتْلُونَهُ حَقَّ تِلَاوَتِهِ أُولَٰئِكَ يُؤْمِنُونَ بِهِ﴾، فلا يقتصر الأمر على القراءة فقط، بل التلاوة قراءة يتبعها الاتباع وتحليل الحلال وتحريم الحرام.","ref":"ص 5"},{"q":"أيّ الآيات وجّه النبي ﷺ إلى حفظها ليُعصم المسلم من فتنة الدجال؟","options":["عشر آيات من أول سورة الكهف","خواتيم سورة البقرة","أول خمس آيات من سورة العلق","آية الكرسي"],"answer":0,"why":"قال ﷺ: «من حفظ عشر آيات من أول سورة الكهف عُصم من الدجال» (أخرجه مسلم)، وقد وجّه النبي ﷺ إلى حفظ آيات معيّنة.","ref":"ص 5"},{"q":"بماذا شبّه النبي ﷺ صاحب القرآن الذي يتعاهده بالمراجعة، ومن يتركه حتى ينساه؟","options":["كصاحب التجارة التي إن تابعها ربح وإن أهملها خسر","كصاحب السراج الذي إن أمدّه بالزيت أضاء","كصاحب البستان الذي إن سقاه أثمر","كمثل صاحب الإبل المعقّلة؛ إن عاهد عليها أمسكها، وإن أطلقها ذهبت"],"answer":3,"why":"قال النبي ﷺ: «إنما مثل صاحب القرآن كمثل صاحب الإبل المعقّلة، إن عاهد عليها أمسكها، وإن أطلقها ذهبت» (متفق عليه).","ref":"ص 5"},{"q":"ماذا قال الحسن البصري عن تعامل السلف مع القرآن بحسب الدرس؟","options":["«كانوا يحفظونه ولا يتدبرونه»","«كانوا يضعونه في بيوتهم للتبرك»","«إن من كان قبلكم رأوا القرآن رسائل من ربهم، فكانوا يتدبرونها بالليل، ويتفقدونها بالنهار»","«كانوا يقرؤونه في المواسم فقط»"],"answer":2,"why":"قال الحسن البصري: «الزموا كتاب الله، وتتبعوا ما فيه من الأمثال، وكونوا فيه من أهل البصر»، وقال: «إن من كان قبلكم رأوا القرآن رسائل من ربهم، فكانوا يتدبرونها بالليل، ويتفقدونها بالنهار».","ref":"ص 7"},{"q":"ماذا قال ابن مسعود رضي الله عنه حين تسمع الله يقول: ﴿يَا أَيُّهَا الَّذِينَ آمَنُوا﴾؟","options":["«فاحفظها ولا تنسها»","«فأصغِ لها سمعك، فإنه خير تُؤمر به أو شر تُصرف عنه»","«فسجّل ما فيها من الأحكام»","«فاسأل عنها العلماء»"],"answer":1,"why":"قال ابن مسعود: «إذا سمعتَ الله عز وجل يقول في كتابه: ﴿يَا أَيُّهَا الَّذِينَ آمَنُوا﴾، فأصغِ لها سمعك، فإنه خير تُؤمر به أو شر تُصرف عنه».","ref":"ص 7"},{"q":"ما الذي كان يقوله الحسن البصري في الحكمة من إنزال القرآن؟","options":["«أنزل القرآن ليُعمل به فاتخذ الناس تلاوته عملًا»","«أنزل القرآن ليُتبرك به»","«أنزل القرآن ليُحفظ فقط»","«أنزل القرآن لأهل العلم خاصة»"],"answer":0,"why":"قال الحسن البصري: «أنزل القرآن ليُعمل به فاتخذ الناس تلاوته عملًا»، وقال ابن الجوزي: «يعني أنهم اقتصروا على التلاوة وتركوا العمل به».","ref":"ص 7"},{"q":"ما صور تعظيم القرآن التي ذكرها الدرس؟","options":["القيام عند تلاوته فقط","تلاوته بصوت مرتفع في المجالس","كتابته بخط مزخرف","الإنصات عند تلاوته، والتطهر قبل مسّه، وعدم تعريضه للامتهان"],"answer":3,"why":"من صور تعظيم القرآن: الإنصات عند تلاوته، والتطهر قبل مسّه («لا يمس القرآن إلا طاهر»)، وعدم تعريضه للامتهان، ومنه نهي النبي ﷺ أن يُسافر بالقرآن إلى أرض العدو.","ref":"ص 8"},{"q":"ما نصيحة الدرس لكل أم وزوجة بخصوص المعوّذتين؟","options":["أن تقرأهما عند المرض فقط","أن تقرأهما في المواسم والأعياد","أن تجعل المعوّذتين وردًا يوميًّا لا يُترك صباحًا ومساءً وقبل النوم، وتقرأهما بيقين أنهما شفاء ورحمة، وتربي أولادها على ذلك","أن تكتفي بتعليمهما للأولاد دون أن تقرأهما"],"answer":2,"why":"قال ابن القيم: «والمقصود الكلام على هاتين السورتين، وبيان عظيم منفعتهما، وشدة الحاجة بل الضرورة إليهما»؛ ولهذا نوصي كل أم وزوجة أن تجعل المعوذتين وردًا يوميًّا لا يُترك صباحًا ومساءً وقبل النوم.","ref":"ص 9"}],"4":[{"q":"ما معنى تدبّر القرآن بحسب ما نقله الدرس عن الخازن؟","options":["تأمل معانيه والتفكر في حِكَمه وتبصّر ما فيه من الآيات","البحث في أسباب النزول والناسخ والمنسوخ","التفسير التحليلي للأحكام الفقهية","حفظ الآيات وترديدها دون فهم"],"answer":0,"why":"قال الخازن: «أصل التدبر النظر في عواقب الأمور والتفكر في أدبارها... ومعنى تدبّر القرآن: تأمّل معانيه وتفكّر في حكمه وتبصّر ما فيه من الآيات».","ref":"ص 3"},{"q":"ما المعنى اللغوي للتدبّر بحسب ابن منظور؟","options":["الاستماع إلى كلام الغير بإصغاء","حفظ الشيء وتكراره","شرح الغامض وتوضيحه","النظر في عاقبة الأمر، فدبّر الأمر وتدبّره أي نظر في عاقبته"],"answer":3,"why":"قال ابن منظور: «دبّر الأمر وتدبّره أي: نظر في عاقبته، واستدبره: رأى في عاقبته ما لم ير في صدره».","ref":"ص 3"},{"q":"ما الفرق بين التدبر والتفسير من حيث المخاطَب؟","options":["التدبر مقصور على العلماء، والتفسير على عامة الناس","التدبر واجب على العلماء فقط","التدبر مأمور به عامة الناس للانتفاع بالقرآن والاهتداء به، وهو واجب على المؤمنين كل بحسب قدراته، ولا يُعذر أحد بعدم التدبر","لا فرق بينهما"],"answer":2,"why":"التدبر مأمور به عامة الناس؛ فخوطب به الكفار والمنافقون، وأما عموم المؤمنين فتدبر القرآن في حقهم واجب وهم مأمورون به، وكل واحد بحسب قدراته وطاقاته، فلا يُعذر أحد بعدم التدبر.","ref":"ص 4"},{"q":"ما أوجه التفسير الأربعة التي نقلها الدرس عن ابن عباس؟","options":["تفسير بالمأثور، وبالرأي، وباللغة، وبالإشارة","تفسير تعرفه العرب من كلامها، وتفسير لا يُعذر أحد بجهالته، وتفسير تعرفه العلماء، وتفسير لا يعلمه إلا الله","تفسير ظاهر، وباطن، وعام، وخاص","تفسير مكي، ومدني، وناسخ، ومنسوخ"],"answer":1,"why":"قال ابن عباس: «التفسير على أربعة أوجه: وجه تعرفه العرب من كلامها، وتفسير لا يُعذر أحد بجهالته، وتفسير تعرفه العلماء، وتفسير لا يعلمه إلا الله».","ref":"ص 4"},{"q":"ماذا كان يفعل عبد الله بن عمر رضي الله عنهما إذا قرأ قوله تعالى: ﴿أَلَمْ يَأْنِ لِلَّذِينَ آمَنُوا أَنْ تَخْشَعَ قُلُوبُهُمْ لِذِكْرِ اللَّهِ﴾؟","options":["كان يبكي حتى يغلبه البكاء","كان يكررها ثلاثًا ثم يسكت","كان يقوم الليل بها","كان يتصدق بعدها"],"answer":0,"why":"وكان عبد الله بن عمر إذا قرأ هذه الآية: ﴿أَلَمْ يَأْنِ لِلَّذِينَ آمَنُوا أَنْ تَخْشَعَ قُلُوبُهُمْ لِذِكْرِ اللَّهِ﴾ بكى حتى يغلبه البكاء (أخرجه ابن أبي شيبة).","ref":"ص 5"},{"q":"ماذا قال السعدي في فوائد التدبر بشأن أن القرآن كلام الله؟","options":["أن القرآن يحتاج إلى غيره ليتم معناه","أن القرآن يتناقض في بعض المواضع","أن القرآن لا يفهمه إلا العلماء","وصول المتدبر لدرجة اليقين، لأن القرآن يصدّق بعضه بعضًا ويوافق بعضه بعضًا، لا ينقض بعضه بعضًا"],"answer":3,"why":"قال السعدي: «ومن فوائد التدبر لكتاب الله: وصول المتدبر إلى درجة اليقين، والعلم بأن القرآن كلام الله؛ لأنه يراه يصدق بعضه بعضًا، ويوافق بعضه بعضًا»، فلذلك قال تعالى: ﴿وَلَوْ كَانَ مِنْ عِنْدِ غَيْرِ اللَّهِ لَوَجَدُوا فِيهِ اخْتِلَافًا كَثِيرًا﴾.","ref":"ص 6"},{"q":"ما الآية التي كانت سببًا في توبة الفضيل بن عياض رحمه الله بحسب القصة التي ذكرها الدرس؟","options":["﴿قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَى أَنْفُسِهِمْ﴾","﴿إِنَّ اللَّهَ يُحِبُّ التَّوَّابِينَ﴾","﴿أَلَمْ يَأْنِ لِلَّذِينَ آمَنُوا أَنْ تَخْشَعَ قُلُوبُهُمْ لِذِكْرِ اللَّهِ﴾","﴿وَلَنَبْلُوَنَّكُمْ حَتَّى نَعْلَمَ الْمُجَاهِدِينَ﴾"],"answer":2,"why":"كان الفضيل يقطع الطريق، فسمع قارئًا يقرأ: ﴿أَلَمْ يَأْنِ لِلَّذِينَ آمَنُوا أَنْ تَخْشَعَ قُلُوبُهُمْ لِذِكْرِ اللَّهِ﴾، فقال: «بلى والله قد آن»، فكان هذا مبتدأ توبته.","ref":"ص 7"},{"q":"كيف وصف ابن القيم أثر تدبر القرآن في نفع العبد؟","options":["بأنه يكفي لحفظ القرآن كاملًا","«فليس شيء أنفع للعبد في معاشه ومعاده وأقرب إلى نجاته من تدبّر القرآن وإطالة التأمل له وجمع الفكر على معاني آياته»","بأنه يزيل الأمراض الجسدية","بأنه يغني عن السعي في الرزق"],"answer":1,"why":"قال ابن القيم: «فليس شيء أنفع للعبد في معاشه ومعاده، وأقرب إلى نجاته من: تدبّر القرآن، وإطالة التأمل له، وجمع الفكر على معاني آياته».","ref":"ص 7"},{"q":"كيف توظف المرأة المسلمة تدبر القرآن في إدارة الخلافات الزوجية؟","options":["باستحضار قوله تعالى: ﴿وَقُلْ لِعِبَادِي يَقُولُوا الَّتِي هِيَ أَحْسَنُ﴾ والبادرة بالإحسان لإطفاء نار الخصومة","بتذكير الزوج بأخطائه السابقة وتعدادها","بالسكوت التام وعدم المناقشة نهائيًّا","بنقل الخلاف إلى الأهل والأقارب"],"answer":0,"why":"إذا واجهت تحديًا أو خلافًا مع زوجها ألانت الكلام وذكرت قوله تعالى: ﴿وَقُلْ لِعِبَادِي يَقُولُوا الَّتِي هِيَ أَحْسَنُ﴾ وقوله: ﴿ادْفَعْ بِالَّتِي هِيَ أَحْسَنُ﴾؛ فتبادر بالإحسان وتطفئ نار الخصومة.","ref":"ص 8"},{"q":"ما الطريقة التي وردت عن أسماء بنت أبي بكر رضي الله عنها في تدبرها للقرآن؟","options":["كانت تقرأ السورة الطويلة كاملة في ركعة واحدة","كانت تحرص على سماع القرآن من غيرها","كانت تحفظ القرآن كل أسبوع","كانت تكرر الآية الواحدة وتقف عندها طويلًا تستعيذ وتدعو"],"answer":3,"why":"روى عروة بن عباد أنها كانت تقرأ: ﴿فَمَنَّ اللَّهُ عَلَيْنَا وَوَقَانَا عَذَابَ السَّمُومِ﴾ فوقفت عليها فجعلت تستعيذ وتدعو، ثم ذهب إلى السوق فقضى حاجته ورجع وهي فيها بعد تستعيذ وتدعو.","ref":"ص 10"}],"5":[{"q":"ما أساس التدبر الحقيقي بحسب الوسيلة الأولى (فهم المعنى من خلال التفسير)؟","options":["التأمل العاطفي المجرد","فهم معنى الآية؛ فالتدبر ليس تأملًا عاطفيًّا مجردًا بل نظر عميق في مراد الله تعالى","حفظ الألفاظ وترديدها","سماع القرآن بصوت جميل"],"answer":1,"why":"إن فهم معنى الآية هو الأساس الذي يُبنى عليه التدبر الحقيقي؛ فالتدبر ليس تأملًا عاطفيًّا مجردًا، بل هو نظر عميق في مراد الله تعالى.","ref":"ص 3"},{"q":"ما المراد بـ«الجيوب» في قوله تعالى: ﴿وَلْيَضْرِبْنَ بِخُمُرِهِنَّ عَلَى جُيُوبِهِنَّ﴾ كما ورد في الدرس؟","options":["جيوب الملابس المعروفة لا فتحات الصدور","فتحات الصدور من الملابس","الأكمام الطويلة","حواشي الخمار"],"answer":1,"why":"المراد بالجيوب فتحات الصدور من الملابس، لا جيوب الملابس المعروفة؛ فإذا فهمت المسلمة معنى (الجيوب) على أنها جيوب الملابس المعروفة فسيقودها ذلك للامتثال اللاواعي والخاطئ.","ref":"ص 3"},{"q":"بحسب الدرس، من المقصودون بـ«الذين هادوا» في قوله تعالى: ﴿إِنَّ الَّذِينَ آمَنُوا وَالَّذِينَ هَادُوا...﴾ [البقرة: 62] وفق التفسير الصحيح؟","options":["كل من ينتمي لليهودية في كل زمان ومكان","الذين اتبعوا موسى عليه السلام بعد بعثة النبي محمد ﷺ","كل من ينتمي لأهل الكتاب بعد النسخ","الذين اتبعوا موسى عليه السلام وكانوا على شريعته قبل النسخ والتبديل"],"answer":3,"why":"المراد بالذين هادوا: الذين اتبعوا موسى عليه السلام قبل النسخ والتبديل، والنصارى: الذين اتبعوا المسيح عليه السلام وكانوا على شريعته قبل النسخ والتبديل؛ فلا تدعو الآية إلى وحدة الأديان.","ref":"ص 4"},{"q":"ماذا قال محمد بن كعب القرظي عمّن بلغه القرآن؟","options":["«من حفظ القرآن فقد نجا»","«من بلغه القرآن فقد وجب عليه حفظه»","«من بلغه القرآن، فكأنما كلّمه الله»","«من بلغه القرآن فعليه تفسيره»"],"answer":2,"why":"قال محمد بن كعب القرظي: «من بلغه القرآن، فكأنما كلّمه الله»، وعقّب عليه الغزالي بقوله: «يقرؤه كما يقرأ العبد كتاب مولاه الذي كتبه إليه؛ ليتأمله ويعمل بمقتضاه».","ref":"ص 4"},{"q":"ما الوسيلة الثانية لتدبر القرآن بحسب الدرس، وكيف وصفها ابن القيم؟","options":["حفظ الآيات وترديدها","استشعار القارئ أنه المخاطَب بالقرآن، فليقدّر نفسه كأنما يسمعه من الله يخاطبه به","مطالعة أسباب النزول فقط","الإكثار من التلاوة السريعة"],"answer":1,"why":"قال ابن القيم: «وبالجملة فمن قُرئ عليه القرآن، فليقدّر نفسه كأنما يسمعه من الله يخاطبه به، فإذا حصل له مع ذلك السماع به وله وفيه ازدحمت معاني المسموع ولطائفه وعجائبه على قلبه».","ref":"ص 4–5"},{"q":"ما الذي قاله أبو بكر الصديق رضي الله عنه بعد نزول قوله تعالى: ﴿وَلَا يَأْتَلِ أُولُو الْفَضْلِ مِنْكُمْ وَالسَّعَةِ﴾؟","options":["«بلى والله إني أحب أن يغفر الله لي»، فرجع إلى مسطح النفقة التي كان ينفق عليه","قال: «لا أرجع النفقة لمسطح أبدًا»","سكت ولم يردّ","قال: «أُشاور الصحابة في الأمر»"],"answer":0,"why":"قال أبو بكر: «بلى والله إني أحب أن يغفر الله لي»، فرجع إلى مسطح النفقة التي كان ينفق عليه، وقال: «والله لا أنزعها عنه أبدًا» (متفق عليه).","ref":"ص 5"},{"q":"ماذا قال ابن عباس رضي الله عنهما في تفسير: ﴿يَتْلُونَهُ حَقَّ تِلَاوَتِهِ﴾؟","options":["يقرؤونه بصوت حسن","يحفظونه كاملًا","يقرؤونه بالتجويد","«يتبعونه حق اتباعه»، «يُحلّون حلاله ويحرّمون حرامه ولا يحرّفونه»"],"answer":3,"why":"قال ابن عباس: «يتبعونه حق اتباعه»، وقال أيضًا: «يُحلّون حلاله ويحرّمون حرامه، ولا يحرّفونه».","ref":"ص 6"},{"q":"كيف وصف ابن عطية قوله تعالى: ﴿إِنَّا سَنُلْقِي عَلَيْكَ قَوْلًا ثَقِيلًا﴾؟","options":["أنه خاص بالنبي ﷺ دون أمته","أنه الميسر الذي أقبل عليه عامة الناس","علم معانيه والقيام بحقوقه ثقيل، فمال الناس إلى الميسر وتركوا الثقيل وهو المطلوب منهم","أنه حفظ الحروف فقط"],"answer":2,"why":"قال ابن عطية: «أي: علم معانيه والقيام بحقوقه، ثقيل، فمال الناس إلى الميسر، وتركوا الثقيل، وهو المطلوب منهم».","ref":"ص 7"},{"q":"ماذا حدث حين تلا الحُرّ بن قيس قوله تعالى: ﴿خُذِ الْعَفْوَ وَأْمُرْ بِالْعُرْفِ وَأَعْرِضْ عَنِ الْجَاهِلِينَ﴾ على عمر رضي الله عنه بعد غضبه على عيينة بن حصن؟","options":["غضب عمر أكثر وعاقب عيينة","ما جاوزها عمر حين تلاها عليه، وكان وقّافًا عند كتاب الله","سكت عمر ثم غادر المجلس","طلب عمر من الحر أن يفسرها"],"answer":1,"why":"قال ابن عباس: «فوالله ما جاوزها عمر حين تلاها عليه، وكان وقّافًا عند كتاب الله» (رواه البخاري)؛ وهي من مواقف الصحابة في الاستجابة والامتثال للقرآن.","ref":"ص 7"}],"6":[{"q":"ما الوسائل التي تتناولها «وسائل تدبر القرآن (٢)» بحسب مقدمة الدرس؟","options":["القصص القرآني فقط","حفظ الآيات وتسميعها وتكرارها فقط","القصص القرآني، والحِكَم التشريعية، والقراءة بتأنٍّ وهدوء، وعرض النفس على القرآن","الاستماع للتلاوات المختلفة ومقارنتها"],"answer":2,"why":"ذكرت مقدمة الدرس: القصص القرآني، والحِكَم التشريعية، والقراءة بتأنٍّ وهدوء، وعرض النفس على القرآن بأن تكون الآيات مرآة للمتدبر.","ref":"ص 2"},{"q":"لماذا
