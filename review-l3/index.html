دية بصورة مفرطة؟","options":["المكافآت محرمة","لا خطأ فيها","هي الأصل","يجعل الجائزة هي الدافع بدل استشعار قيمة العبادة ويرسخ انتظار الجزاء العاجل"],"answer":3,"why":"ولا يعني ذلك منع المكافآت لكن الأصل بناء الدافع الداخلي.","ref":"ص 4"},{"q":"لماذا قد يكون سبب بعض السلوكيات السلبية في المراهقة ضعف القدرة على مقاومة ضغط الأقران؟","options":["لأن الشخصية الضعيفة المترددة لا تقوى على قول «لا» أمام المؤثرات السلبية","لأن الرغبة داخلية","لأنها وراثية","لأنها بسبب الدين"],"answer":0,"why":"فبناء الثقة والقوة النفسية يساعد الطفل على الثبات.","ref":"ص 5"}],"14":[{"q":"ما المقصود بـ«الخرافات التربوية»؟","options":["معلومات علمية","قوانين شرعية","نظريات حديثة","مجموعة قناعات خاطئة تتشكل بتأثير العادات والموروثات والمعلومات غير الدقيقة وتتحول إلى مسلّمات يصعب تغييرها"],"answer":3,"why":"فتصبح عائقًا أمام نمو العملية التربوية وتطورها.","ref":"ص 2"},{"q":"أي مما يلي من مصادر انتشار الخرافات التربوية؟","options":["العادات والموروثات الأسرية وثقافة المجتمع والقراءات غير الدقيقة ووسائل التواصل الاجتماعي","الكتب العلمية فقط","القرآن","المدارس فقط"],"answer":0,"why":"وتزداد خطورة وسائل التواصل بسبب التسليم الكبير بما تعرضه ودور الخوارزميات.","ref":"ص 2"},{"q":"ما أثر الخوارزميات في وسائل التواصل في ترسيخ الأفكار الخاطئة؟","options":["تمنع الأفكار الخاطئة","لا أثر لها","تعرض محتوى متنوعًا","ترصد اهتمامات المستخدم وتغرقه بمحتوى مشابه فتحوّل الفكرة إلى قناعة يصعب مراجعتها"],"answer":3,"why":"لكن الوسائل ليست شرًّا محضًا والعبرة بطريقة التعامل معها ودرجة الوعي.","ref":"ص 3"},{"q":"ما «الهدر التربوي»؟","options":["نجاح التربية","تبدد الجهود وضياع الطاقات لأنها مبنية على تصورات خاطئة فلا تثمر","كثرة المال","قلة الأولاد"],"answer":1,"why":"إذ قد يبذل المربي وقتًا كبيرًا لكن وفق مسارات غير صحيحة.","ref":"ص 3"},{"q":"ما «الشلل التربوي»؟","options":["حالة عجز أو استسلام تنتج عن قناعات خاطئة تُشعر الوالدين بالعجز التربوي","شلل جسدي","نوم الولد","كثرة النشاط"],"answer":0,"why":"ومن آثار الخرافات التربوية أيضًا القعود عن التطوير والندوب التربوية.","ref":"ص 3"},{"q":"لماذا يُعد التمسك بقواعد جامدة موروثة دون مراجعة قعودًا عن التطوير التربوي؟","options":["لأن القواعد الموروثة خاطئة دائمًا","لأن التربية مجال متجدد يتأثر بتغير الظروف ولكل جيل قضاياه الخاصة","لأن الآباء لا يعرفون","لأن الكتب غير مفيدة"],"answer":1,"why":"فيحتاج المربي إلى التعلم المستمر ومراجعة أساليبه.","ref":"ص 3"},{"q":"ما «الندوب التربوية»؟","options":["أمراض الجلد","كثرة الجروح","أثر سلبي يبقى في جانب من الشخصية بسبب قناعات تربوية خاطئة كاعتقاد أن الشدة المفرطة هي الأمثل","عدم الإنجاب"],"answer":2,"why":"فتظهر شخصية ناجحة في جوانب لكنها تحمل أثرًا سلبيًّا في جانب معين.","ref":"ص 4"},{"q":"بماذا استشهد الدرس على خطورة اتباع الموروث لمجرد كونه موروثًا؟","options":["بحديث نبوي","بقوله تعالى: ﴿إنا وجدنا آباءنا على أمة وإنا على آثارهم مهتدون﴾","بقصة نوح","بآية الصيام"],"answer":1,"why":"فهي حجة كفار قريش، وهي الإشكالية ذاتها حين تتحول القناعات التربوية إلى قوالب جامدة.","ref":"ص 4"},{"q":"ما الذي ينبغي على المربي الواعي فعله تجاه ما ورثه من أفكار وعادات؟","options":["أن يتبعها كلها","أن يتركها كلها","أن يراجعها فيختار ما يوافق الحق وينبذ ما يخالفه","أن يعمل بها دون تمحيص"],"answer":2,"why":"فيتحرر من أسر البيئة مع وعيه بجوانبها الإيجابية والسلبية.","ref":"ص 4"},{"q":"بماذا ردّ الدرس على خرافة «التربية عملية سهلة وغير معقدة»؟","options":["قلة التعليم لا تعني غياب الحكمة التربوية، فالتربية ممارسة تتشكل من التجربة والبيئة والقدوة ولظروف الحياة قديمًا أثر تربوي","التربية سهلة","الكتب لا قيمة لها","الدورات ضرورية في كل حال"],"answer":0,"why":"فكان للبساطة وقلة الترف وتحمل المشاق أثر تربوي كبير.","ref":"ص 5"}],"15":[{"q":"ما الذي يكشفه الحضور الكثيف للثناء على الصحابة في كتب المناقب؟","options":["كثرة الأخطاء","التفضيل بين الصحابة","منهج نبوي أصيل في التربية قائم على اكتشاف المزايا وتنميتها وإبرازها","التساهل"],"answer":2,"why":"فكان ﷺ كريمًا في الثناء حريصًا على إبراز مواطن الخير.","ref":"ص 2"},{"q":"ما الحديث الذي ذكره الدرس في الاعتراف بالفضل ومكافأة أهل الإحسان؟","options":["«من صنع إليكم معروفًا فكافئوه، فإن لم تجدوا ما تكافئونه فادعوا له»","«إنما الأعمال بالنيات»","«الدين النصيحة»","«ليس منا من لم يرحم صغيرنا»"],"answer":0,"why":"فالحاجة إلى التقدير فطرية أصيلة.","ref":"ص 2"},{"q":"لماذا لا تكفي المعرفة وحدها في التشجيع والتحفيز؟","options":["لأن السلوك الإيجابي يحتاج إلى تدريب ومجاهدة واعتياد لا قناعة فحسب","لأن المعرفة خاطئة","لأن التشجيع ضار","لأن الناس لا يحبونه"],"answer":0,"why":"فبين المعرفة والتطبيق مسافة لا تُسدّ إلا بالتدريب والممارسة.","ref":"ص 2"},{"q":"كيف وفّق الدرس بين التشجيع والنهي عن المدح («احثوا في وجوه المداحين التراب»)؟","options":["النهي عام","المذموم هو الإطراء المبالغ فيه أو الثناء بالباطل، أما الثناء الصادق المشجع فله قيمة تربوية عظيمة","التشجيع محرم","لا تعارض بين الأمرين لأنه حديث ضعيف"],"answer":1,"why":"والعبرة بحسن التوظيف ومراعاة حال الشخص.","ref":"ص 3"},{"q":"لمن يكون التشجيع أحوج بحسب الدرس؟","options":["من يميل إلى العجب","الأغنياء","من يعاني ضعف الثقة بالنفس أو هضم الذات","الكبار فقط"],"answer":2,"why":"أما من يميل إلى العجب فلا يُغذّى بما يزيده غرورًا.","ref":"ص 3"},{"q":"ما معنى «مبدأ التعجيل في التعزيز»؟","options":["أن يتأخر التعزيز","أن يكون التعزيز تاليًا للعمل الإيجابي مباشرة دون إبطاء","أن لا تكون مكافأة","أن يكون دائمًا"],"answer":1,"why":"وفي الحديث: «أعطوا الأجير أجره قبل أن يجف عرقه».","ref":"ص 3"},{"q":"ما أثر الفجوة الزمنية بين الفعل والتعزيز؟","options":["تقويها","لا أثر لها","تزيد المحبة","تُضعف أثر المكافأة وتجعلها باهتة وربما غير مستحقة في نظر صاحبها"],"answer":3,"why":"فالسرعة في الإنجاز تضفي أثرًا بالغًا وعميقًا على التعزيز.","ref":"ص 4"},{"q":"ما المقصود بـ«وضوح مبرر التعزيز»؟","options":["أن يكون التشجيع عامًّا","أن يكون المبرر سريًّا","أن يكون المبرر مبالغًا فيه","أن يتبين للمتلقي بدقة مكمن الإعجاب مثل: «لأنك فعلت كذا»"],"answer":3,"why":"فالتشجيع العام يجعل السلوك المستهدف غير محدد.","ref":"ص 4"},{"q":"لماذا يُوجَّه التعزيز نحو الجهد لا النتائج فحسب؟","options":["لأن النتائج مهمة","لأن الإنسان مأمور ببذل الوسع لا بتحصيل النتائج التي تخرج غالبًا عن قدرته","لأن الجهد لا قيمة له","لأن النتائج دائمًا إيجابية"],"answer":1,"why":"فمن الخطأ حصر الثناء في تحقيق النتيجة.","ref":"ص 4"},{"q":"بماذا قال النبي ﷺ لمن سأله أن يكون من السبعين ألفًا الذين يدخلون الجنة بلا حساب؟","options":["«سبقك بها عكاشة»","«أنت منهم»","«اسأل الله»","«لا تسأل»"],"answer":0,"why":"وفي الحديث فكرة السبق والمسارعة المحمودة في الشريعة.","ref":"ص 3"}]},"s3":{"1":[{"q":"ما الغاية الكبرى التي ينبغي أن تدفع المسلمة في كل حركات حياتها بحسب الدرس؟","options":["نيل الشهادات والمناصب","أن يرضى الله تعالى عنها","كسب مكانة اجتماعية","الاستعداد لسوق العمل"],"answer":1,"why":"الغاية العظمى رضا الله تعالى، ويشمل ذلك الزواج وتربية الأولاد والتعامل مع الأهل.","ref":"ص 2"},{"q":"أي مما يلي ليس من النيات التي ينبغي استحضارها قبل دراسة المادة؟","options":["نية تعلم علم نافع","نية التطبيق والعمل","نية التنافس على المناصب الدنيوية","نية تعليم هذا العلم للناس"],"answer":2,"why":"الأكاديمية لا تهدف إلى إعداد المتنافسات على المناصب الدنيوية بل إلى إصلاح المرأة المسلمة.","ref":"ص 2-3"},{"q":"ما الحديث الذي استشهد به الدرس على أن طلب العلم النافع طريق إلى الجنة؟","options":["«من سلك طريقاً يلتمس فيه علماً سهّل الله له به طريقاً إلى الجنة»","«إنما الأعمال بالنيات»","«الدين النصيحة»","«خيركم من تعلم القرآن وعلّمه»"],"answer":0,"why":"أورده الدرس تحت نية تعلم علم نافع، والتاريخ الإسلامي من العلم النافع.","ref":"ص 2"},{"q":"ما أول نصيحة لتعلم هذه المادة؟","options":["الاكتفاء بسماع المحاضرة مرة واحدة","حفظ المحاضرة دون تدوين","تكرار سماع المحاضرة وتدوين الفوائد في دفتر خاص","تأجيل المراجعة لنهاية المادة"],"answer":2,"why":"يُنصح بتكرار المحاضرة عدة مرات وتدوين الفوائد بخط اليد ومدارستها حتى ترسخ.","ref":"ص 3"},{"q":"كيف يفسّر الدرس ما تعيشه الأمة من تبعية للغرب؟","options":["بافتقارها إلى تاريخ مجيد","بثمرة الابتعاد عن قراءة التاريخ والاغترار بالحضارة المعاصرة","بعجزها الذاتي","بقلة مواردها"],"answer":1,"why":"التبعية ليست لافتقار الأمة إلى تاريخ مجيد، بل لابتعادها عن قراءة تاريخها.","ref":"ص 4"},{"q":"ما أثر التاريخ في حماية الهوية الثقافية؟","options":["يحميها من الذوبان في الأمم المخالفة ويزيد الاعتزاز بها","يعزلها عن الأمم الأخرى","يلغي الفروق بين الثقافات","لا أثر له"],"answer":0,"why":"من تأمل أمجاد أمته أدرك عظمتها فلا يذوب في غيره ولا يعيش تبعية.","ref":"ص 4"},{"q":"قال تعالى: ﴿لقد كان في قصصهم عبرة لأولي الألباب﴾؛ فما المقصود بالسرد التاريخي في المنظور الإسلامي؟","options":["التسلية بالأحداث","مجرد سرد الأحداث","الاقتصار على حياة الملوك","استنباط العبر واستخلاص السنن"],"answer":3,"why":"السرد التاريخي يقصد به استنباط العبر واستخلاص السنن، والعبرة تورث البصيرة.","ref":"ص 5"},{"q":"من ثمرات دراسة التاريخ معرفة السنن الإلهية، وهي بحسب الآيات:","options":["متغيرة بتغير الزمن","ثابتة لا تتغير","خاصة بأمة دون أخرى","لا يمكن إدراكها"],"answer":1,"why":"﴿فلن تجد لسنة الله تبديلاً﴾؛ فسنن الله ثابتة، وإدراكها دافع لتجاوز أخطاء السابقين.","ref":"ص 5"},{"q":"ما فائدة تتبع تطور أدوار المرأة عبر العصور؟","options":["إثبات أن حالها لم يتغير","تقليد غيرها من الأمم","فهم التحولات الاجتماعية الكبرى","لا فائدة منه"],"answer":2,"why":"من ثمرات التاريخ فهم التحولات الاجتماعية الكبرى، وحال المرأة اليوم ليس كحالها سابقاً.","ref":"ص 6"},{"q":"ما النشاط المقترح في «من دروس الغزوات»؟","options":["حفظ أسماء الغزوات فقط","كتابة بحث عن الأندلس","مشاهدة فيلم تاريخي","اختيار غزوة وقراءتها مع الأولاد ثم مناقشة دروسها الإيمانية"],"answer":3,"why":"كغزوة بدر أو أحد، لتعليم الأولاد اللجوء إلى الله وأن المعصية قد تكون سبباً للهزيمة.","ref":"ص 6"}],"2":[{"q":"ما الهدف العظيم للأمة الذي نتعلمه من التاريخ؟","options":["عمارة الأرض بمنهج الله وتحقيق العبودية","جمع الثروات","التوسع العسكري","بناء الحضارة المادية فقط"],"answer":0,"why":"من الفوائد التربوية للتاريخ أن للأمة هدفاً عظيماً هو عمارة الأرض بمنهج الله وتحقيق العبودية.","ref":"ص 2"},{"q":"أي مما يلي من سنن الله الجارية التي ذكرها الدرس؟","options":["تبدل السنن بتبدل الأزمان","انتفاء الصراع بين الحق والباطل","زوال الابتلاء","نصر الله لأوليائه وإهلاك الظالمين"],"answer":3,"why":"من السنن الجارية تنفيذ وعد الله لأوليائه بالنصر وإهلاك الظالمين.","ref":"ص 2"},{"q":"ما السببان اللذان ذكرهما الدرس لهلاك الأمم في الآيات المستشهد بها؟","options":["الفقر والجهل","الحروب والأوبئة","الترف والفساد","الكسل والفتنة"],"answer":2,"why":"استشهد بقوله تعالى ﴿حتى إذا أخذنا مترفيهم بالعذاب﴾ وقوله ﴿أمرنا مترفيها ففسقوا فيها﴾.","ref":"ص 2"},{"q":"بأي قصة مثّل الدرس لصبر المؤمنين على الابتلاء عبر التاريخ؟","options":["قصة أصحاب الأخدود","قصة أصحاب الكهف","قصة يوسف","قصة قوم عاد"],"answer":0,"why":"الابتلاء أمر لا بد منه، وقد صبر المؤمنون على أشد الابتلاءات كما في قصة أصحاب الأخدود.","ref":"ص 2"},{"q":"ما حكم الصراع بين الحق والباطل بحسب الدرس؟","options":["ينتهي في عصور معينة","سنة ماضية قائمة إلى قيام الساعة","خاص بزمن الأنبياء","يزول بتقدم الحضارة"],"answer":1,"why":"الصراع بين الحق والباطل سنة ماضية منذ خلق الله البشر وسيظل قائماً إلى قيام الساعة.","ref":"ص 3"},{"q":"لماذا كان من أهم ما يؤدَّب به أولاد الخلفاء أن يتعلموا سير الماضين؟","options":["للتسلي بالقصص","ليتعلموا أصول الحكم وكيف يسوسون الرعية","لحفظ الأنساب","للتفاخر بالآباء"],"answer":1,"why":"فالتاريخ يعلّم أصول الحكم وسياسة الرعية، ويجنّب العاقل كثيراً من أخطاء السابقين.","ref":"ص 3"},{"q":"ما الفرقة التي وصفها الدرس بأنها من ألدّ أعداء الإسلام وتدّعي الانتماء إليه؟","options":["المعتزلة","الأشاعرة","الخوارج فقط","الباطنية"],"answer":3,"why":"الباطنية تنقسم إلى عدة فرق ولها امتدادات قائمة إلى اليوم، وتتظاهر بالإسلام وتحمل حقداً كبيراً عليه.","ref":"ص 3"},{"q":"ماذا فعل القرامطة بمكة بحسب الدرس؟","options":["حرسوا الحجاج وأمّنوهم","بنوا فيها المدارس","فتحوها صلحاً دون قتال","دخلوها يوم التروية وقتلوا الحجاج ونهبوهم وألقوا جثثهم في زمزم"],"answer":3,"why":"استباحوا دماء المسلمين في المسجد الحرام وألقوا كثيراً من الجثث في بئر زمزم واقتلعوا الحجر الأسود.","ref":"ص 3-4"},{"q":"كم مكث الحجر الأسود عند القرامطة؟","options":["10 سنوات","40 سنة","22 سنة","5 سنوات"],"answer":2,"why":"ذكر الدرس أن الحجر الأسود مكث عندهم اثنتين وعشرين سنة.","ref":"ص 4"},{"q":"ماذا يعلّمنا التاريخ عن مصدر مصائبنا؟","options":["أنها بسبب أفعال الأمة وذنوبها فنصححها","أنها بلا سبب","أنها بسبب الأعداء فقط","أنها قدر لا علاقة له بالذنوب"],"answer":0,"why":"ما يحدث للأمة إنما هو بسبب أفعالها وذنوبها، وفي غلاء مصر نحو سنة 464هـ تابوا فرفع الله عنهم البلاء.","ref":"ص 4"}],"3":[{"q":"ما معنى «المقت» في حديث عياض بن حمار: «إن الله نظر إلى أهل الأرض فمقتهم»؟","options":["الرحمة","الإمهال","شدة الكراهية","الإعراض فقط"],"answer":2,"why":"المقت شدة الكراهية، ونتأمل حال الناس في تلك الفترة لنعتبر منها.","ref":"ص 2"},{"q":"بحسب الدرس، الجاهلية ليست فترة زمنية محددة وإنما:","options":["عصر انتهى بالإسلام فلا يعود","اسم لأرض الجزيرة","سلوكيات جاهلية ينبغي أن نجتنبها","خاصة بالعرب دون غيرهم"],"answer":2,"why":"قال ﷺ لأبي ذر: «إنك امرؤ فيك جاهلية»، فهي سلوكيات يجب اجتنابها.","ref":"ص 2"},{"q":"أي سورة سُمّيت باسم دولة من الدول القديمة وفق الدرس؟","options":["سورة سبأ","سورة الروم","سورة قريش","سورة الفيل"],"answer":1,"why":"سُمّيت سورة الروم لضخامة الدولة الرومانية ولذكر غلبتهم.","ref":"ص 3"},{"q":"أي مظهر من مظاهر الفساد المالي تميّزت به الدولة الرومانية؟","options":["الرشوة، وضرائب الفقراء أعلى من الأغنياء","إلغاء الضرائب","المساواة في الحقوق","منع الربا"],"answer":0,"why":"تميزت المعاملات المالية بالرشوة وكانت الضرائب على الفقراء أعلى منها على الأغنياء.","ref":"ص 3"},{"q":"ماذا كان من وسائل الترفيه عند الرومان؟","options":["الشعر والخطابة","السباحة","الرحلات","مصارعة العبيد والحيوانات المفترسة في أقفاص مغلقة"],"answer":3,"why":"وذلك دليل على قسوتهم ووحشيتهم في الطباع.","ref":"ص 3"},{"q":"بِمَ اعتقد الفرس في كسرى؟","options":["أنه بشر عادي","أن دمه دم الإله وأنه فوق البشر والقانون","أنه خاضع للقانون","أنه رجل دين فقط"],"answer":1,"why":"وكان الداخل عليه يرتمي ساجداً ولا يقوم حتى يؤذن له.","ref":"ص 3"},{"q":"إلى كم طبقة قسّم الفرس مجتمعهم؟","options":["7 طبقات","3 طبقات","5 طبقات","10 طبقات"],"answer":0,"why":"قسموه سبع طبقات أولها الأكاسرة وآخرها الشعب وهم أكثر من 90% بلا حقوق تذكر.","ref":"ص 4"},{"q":"ما الذي فعله الفرس بجنودهم في أول موقعة لفتح بلاد فارس بقيادة خالد بن الوليد؟","options":["أطلقوهم أحراراً","وزعوهم على الحصون","حرّروهم من الخدمة","ربطوا ستين ألفاً بالسلاسل كل عشرة في سلسلة لئلا يفروا"],"answer":3,"why":"ربطوا ستين ألف جندي، كل عشرة في سلسلة واحدة.","ref":"ص 4"},{"q":"كيف وصف المؤرخ الفرنسي «رينو» أوروبا الشمالية في ذلك الزمن؟","options":["بلاد العلم والنظافة","بلاد استقرار وأمن","بلاد امتلأت بالجهل والفوضى والظلم، وفخر أمرائها بعدم القراءة","مركز حضارة عالمي"],"answer":2,"why":"وصفها بأنها مسرح للحروب والأعمال الوحشية وتفشي الأمية.","ref":"ص 4"},{"q":"ما أكبر أوثان العرب المذكورة في الدرس؟","options":["ود وسواع ويغوث","هبل وإساف ونائلة فقط","نسر ويعوق","مناة واللات والعزى"],"answer":3,"why":"ذكر الدرس مناة واللات والعزى، وأنها أكبر أوثان العرب ثم كثر الشرك.","ref":"ص 5"}],"4":[{"q":"أين نزل الوحي أول مرة على النبي ﷺ؟","options":["في المسجد الحرام","في دار الأرقم","في غار حراء","في المدينة"],"answer":2,"why":"كانت لحظة نزول الوحي في غار حراء من أعظم اللحظات التي عرفتها البشرية.","ref":"ص 2"},{"q":"كيف وصف الدرس الوحي؟","options":["مجرد تكاليف","هداية ونور ونعمة ورحمة من الله","خاص بالأنبياء فقط","قصة تاريخية لا أثر لها"],"answer":1,"why":"الوحي هداية ونور وليس مجرد تكاليف، قال تعالى ﴿فمن اتبع هداي فلا يضل ولا يشقى﴾.","ref":"ص 2"},{"q":"ما أول مقدمات الوحي؟","options":["الرؤيا الصالحة مثل فلق الصبح","سماع صوت الملائكة","نزول جبريل بالقرآن","الكتابة"],"answer":0,"why":"كان ﷺ لا يرى رؤيا إلا جاءت مثل فلق الصبح.","ref":"ص 2"},{"q":"أي حادثة ذُكرت من الأحداث التي هيأت النبي ﷺ لحمل الرسالة؟","options":["غزوة بدر","شق الصدر","فتح مكة","الهجرة"],"answer":1,"why":"أخرج جبريل عليه السلام علقة من قلبه ﷺ وقال: هذا حظ الشيطان منك ثم غسله بماء زمزم.","ref":"ص 2-3"},{"q":"ماذا كان النبي ﷺ يفعل في غار حراء قبل الوحي؟","options":["يتاجر","يعلّم الناس","يكتب","يختلي بنفسه ويتفكر في الكون ويتعبد الله"],"answer":3,"why":"حُبّبت إليه الخلوة، فكان يتعبد بعبادة الفكر.","ref":"ص 3"},{"q":"كم مرة ضمّ جبريل النبي ﷺ قبل أن يقول له ﴿اقرأ باسم ربك الذي خلق﴾؟","options":["مرة","ثلاث مرات","مرتين","أربع مرات"],"answer":1,"why":"غطّه ثلاث مرات حتى بلغ منه الجهد، وفي كل مرة يقول: «ما أنا بقارئ».","ref":"ص 3"},{"q":"ما الجملة التي قالتها خديجة لتطمئنه ﷺ؟","options":["«كلا والله لا يخزيك الله أبداً»","«لقد أخطأت الطريق»","«اذهب عني»","«لا تذكر هذا لأحد»"],"answer":0,"why":"ثم عدّدت صفاته: تصل الرحم وتصدق الحديث وتحمل الكل وتقري الضيف وتعين على نوائب الحق.","ref":"ص 3"},{"q":"إلى من ذهبت خديجة بالنبي ﷺ ليخبره بما سيحدث له؟","options":["إلى أبي بكر","إلى أبي طالب","إلى ورقة بن نوفل","إلى زيد"],"answer":2,"why":"كان ورقة ابن عم خديجة وقد تنصّر وكتب الإنجيل، وقال: هذا الناموس الذي أنزل على موسى.","ref":"ص 3-4"},{"q":"ماذا نتعلم من ردة فعل خديجة رضي الله عنها؟","options":["تهوين الأمر وإنكاره","ترك الزوج وحده","الخوف من الموقف","الزوجة الصالحة تذكّر محاسن زوجها وتبث فيه التفاؤل"],"answer":3,"why":"كانت نعم السكن له، وتأملت الموقف بعقل وحكمة ويقين.","ref":"ص 4"},{"q":"من أول من أسلم من الرجال ومن الصبيان ومن النساء ومن الموالي على الترتيب؟","options":["أبو بكر، علي، خديجة، زيد بن حارثة","علي، أبو بكر، خديجة، زيد","زيد، علي، أبو بكر، خديجة","خديجة، علي، أبو بكر، زيد"],"answer":0,"why":"وكانت الدعوة سرية في أول الأمر بين المقربين.","ref":"ص 5"}],"5":[{"q":"كم بلغ عدد وفد يثرب في بيعة العقبة الثانية؟","options":["اثنا عشر رجلاً","مئة رجل","ثلاثة وسبعون رجلاً وامرأتان (75)","ثلاثة رجال"],"answer":2,"why":"جاء في وفد حجاج يثرب 73 رجلاً وامرأتان من المسلمين في موسم حج العام الثالث عشر من البعثة.","ref":"ص 2"},{"q":"من حضر مفاوضات بيعة العقبة الثانية من أعمام النبي ﷺ وكان مشركاً حينها؟","options":["أبو لهب","أبو طالب","العباس بن عبد المطلب","حمزة"],"answer":2,"why":"حضوره كان من منطلق سياسي لا دعوي، إذ كان الممثل غير الرسمي لبني هاشم.","ref":"ص 2"},{"q":"ما الذي ظهر في بيعة العقبة الثانية وميّزها عن الأولى؟","options":["الصلاة فقط","التجارة","جهاد النفس والمال","الصيام"],"answer":2,"why":"ظهر فيها الجهاد بالنفس والمال، وتعهدوا بمنعه مما يمنعون منه أنفسهم وأهليهم.","ref":"ص 2"},{"q":"ما اسم الذين آمنوا من الأوس والخزرج ونصروا النبي ﷺ؟","options":["الأنصار","المهاجرون","الطلقاء","المؤلفة قلوبهم"],"answer":0,"why":"ومن لحظة البيعة عُرف المسلمون من الأوس والخزرج بالأنصار.","ref":"ص 2"},{"q":"من الذي تُرك في فراش النبي ﷺ ليلة الهجرة للتمويه ولأداء الأمانات؟","options":["أبو بكر","علي بن أبي طالب","الزبير","عمر"],"answer":1,"why":"ترك ابن عمه علياً رضي الله عنه في فراشه، وأكمل مع الصديق الرحلة.","ref":"ص 3"},{"q":"كم مكث النبي ﷺ وأبو بكر في غار ثور؟","options":["يوم واحد","ثلاثة أيام","سبعة أيام","شهر"],"answer":1,"why":"مكثا ثلاثة أيام ثم أكملا الرحلة إلى المدينة.","ref":"ص 3"},{"q":"متى وصل النبي ﷺ إلى المدينة بحسب الدرس؟","options":["1 رمضان","12 من ربيع الأول","10 محرم","27 رجب"],"answer":1,"why":"وصل آمناً في 12 ربيع الأول من العام الرابع عشر من البعثة، وهو العام الأول للهجرة.","ref":"ص 3"},{"q":"ما الدعائم الثلاث التي قامت عليها دولة الإسلام الأولى؟","options":["المال والسلاح والتجارة","النسب والقوة والثروة","الأرض والجيش والسياسة","العقيدة والأخلاق الحميدة والأخوة في الله"],"answer":3,"why":"وكان المسجد أهم مؤسسة تحافظ على هذه الدعائم.","ref":"ص 4-5"},{"q":"بم تميز المهاجرون والأنصار على الترتيب؟","options":["المهاجرون: السبق والصبر، والأنصار: الإيثار والقوة العسكرية","المهاجرون: الثراء، والأنصار: التجارة","كلاهما في القيادة فقط","لا فرق بينهما"],"answer":0,"why":"وبذلك أخذ المهاجرون معظم مراكز القيادة، وكان منهم أغلب العلماء.","ref":"ص 5"},{"q":"أين بات النبي ﷺ ليلته الأولى في وسط المدينة وأين مكث سبعة أشهر؟","options":["في قباء ثم في المسجد","في بيت عمر ثم أبي بكر","في خيمة خارج المدينة","عند بني النجار، ثم في بيت أبي أيوب الأنصاري"],"answer":3,"why":"بات عند أخوال جده عبد المطلب بني النجار، ثم مكث في بيت أبي أيوب الأنصاري سبعة أشهر.","ref":"ص 5"}],"6":[{"q":"ما الدليل الذي ذكره الدرس على أن فترة الخلفاء الراشدين على منهج النبوة؟","options":["قول بعض المؤرخين","اجتهاد الصحابة","حديث: «ثم تكون خلافة على منهاج نبوة»","عدد الفتوحات"],"answer":2,"why":"أخبر النبي ﷺ أن بعد النبوة خلافة على منهاج النبوة، وفي هذا ردٌّ على كل تشكيك فيهم.","ref":"ص 2"},{"q":"بماذا وصف النبي ﷺ الخلفاء في الحديث الذي أمر فيه بالتمسك بسنتهم؟","options":["المهديين الراشدين","الملوك العاضّين","الأمراء الجبريين","القادة المحاربين"],"answer":0,"why":"«فعليكم بسنتي وسنة الخلفاء المهديين الراشدين، عضوا عليها بالنواجذ».","ref":"ص 2"},{"q":"ما دلالة حديث جابر «نيط أبو بكر برسول الله ونيط عمر بأبي بكر ونيط عثمان بعمر»؟","options":["أن الخلافة بالوراثة","إشارة إلى توليهم الأمر بهذا الترتيب","ذم للخلفاء","لا دلالة له"],"answer":1,"why":"أي أنهم ولاة هذا الأمر الذي بعث الله به نبيه ﷺ بالترتيب نفسه.","ref":"ص 3"},{"q":"ما أول أسباب صعوبة خلافة أبي بكر رضي الله عنه؟","options":["قلة الأنصار","أنه يخلف رسول الله ﷺ وأي مقارنة معه لن تكون عادلة","كثرة الأموال","اتساع الفتوح"],"answer":1,"why":"ومن أسبابها كذلك انقطاع الوحي والأحداث الجسام بعد وفاته ﷺ.","ref":"ص 3"},{"q":"متى تم اختيار الخليفة بعد وفاة النبي ﷺ؟","options":["بعد شهر","بعد سنة","بعد حرب أهلية","في اليوم الأول قبل أن يُدفن ﷺ"],"answer":3,"why":"وذلك من توفيق الله لهذه الأمة إذ قمع كثيراً من المشكلات.","ref":"ص 3"},{"q":"أي مما يلي من الإشارات النبوية إلى خلافة أبي بكر؟","options":["«لو كنت متخذاً خليلاً من أمتي لاتخذت أبا بكر»","«لا خلافة بعدي»","«ابحثوا عن غيره»","«الأمر شورى لا يُحدّد»"],"answer":0,"why":"وقوله للمرأة: «إن لم تجديني فأتي أبا بكر»، وقوله في مرضه: «ويأبى الله والمؤمنون إلا أبا بكر».","ref":"ص 4"},{"q":"كم مدينة ثبتت على الإسلام يوم الردة (إضافة إلى قرية جواثى)؟","options":["ثلاث: المدينة ومكة والطائف","مدينتان","خمس مدن","كل المدن"],"answer":0,"why":"ارتد معظم العرب، ولم يثبت إلا المدينة ومكة والطائف وقرية جواثى شرق الجزيرة.","ref":"ص 4"},{"q":"من أدعياء النبوة الأربعة الذين ذكرهم الدرس؟","options":["مسيلمة وأبو لهب وأمية وعتبة","الأسود وخالد وسعد وبلال","مسيلمة فقط","الأسود العنسي ومسيلمة وطليحة وسجاح"],"answer":3,"why":"وردتهم باتباع مدّعي النبوة نوع من أنواع الردة.","ref":"ص 4"},{"q":"لماذا اعتبر أبو بكر منع الزكاة هدماً للدين والدولة؟","options":["لأنها قليلة المقدار","لأن الزكاة خاصة بالنبي ﷺ","لأنها ركن من أركان الإسلام وارتباط القبائل بالدولة مالي","لأن الدولة غنية"],"answer":2,"why":"فالزكاة ركن من أركان الإسلام، والرابط المالي من أقوى الروابط.","ref":"ص 4"},{"q":"بم ردّ أبو بكر على اعتراض عمر رضي الله عنهما في قتال مانعي الزكاة؟","options":["«سنؤخر قتالهم»","«والله لأقاتلن من فرق بين الصلاة والزكاة فإن الزكاة حق المال»","«أترك لكم القرار»","«لا قتال في ذلك»"],"answer":1,"why":"فقال عمر: فعرفت أنه الحق بعد أن شرح الله صدر أبي بكر.","ref":"ص 5"}],"7":[{"q":"لماذا لُقّب عثمان رضي الله عنه بذي النورين؟","options":["لنوره في الوجه","لكثرة صلاته بالليل","لأنه أنار المدينة","لأنه تزوج بنتي النبي ﷺ رقية وأم كلثوم"],"answer":3,"why":"وكنيته أبو عبد الله، وأسلم مع الأوائل على يد أبي بكر.","ref":"ص 2"},{"q":"أي حديث يدل على حياء عثمان رضي الله عنه؟","options":["«ألا أستحيي من رجل تستحيي منه الملائكة؟»","«أعلمكم بالحلال والحرام»","«أمين هذه الأمة»","«سيف الله المسلول»"],"answer":0,"why":"رواه مسلم في فضائله.","ref":"ص 2"},{"q":"ماذا فعل عثمان في جيش العسرة؟","options":["قاده بنفسه","رفض الخروج","تخلف عنه","جهّزه بألف دينار نثرها في حجر النبي ﷺ"],"answer":3,"why":"فقال ﷺ: «ما ضر عثمان ما عمل بعد اليوم».","ref":"ص 2"},{"q":"كم مدة خلافة عثمان رضي الله عنه؟","options":["سنتان","اثنتا عشرة سنة","أربعون سنة","ست سنوات"],"answer":1,"why":"حكم بعد عمر اثنتي عشرة سنة، وكانت الفتنة في آخر خلافته.","ref":"ص 3"},{"q":"كيف تولى عثمان الخلافة؟","options":["بالشورى بين الستة الذين رشحهم عمر","بالوراثة","بالقوة","بالقرعة"],"answer":0,"why":"جعل عمر الأمر في ستة منهم علي وعثمان والزبير وطلحة وسعد وعبد الرحمن، ثم بايع الناس عثمان.","ref":"ص 3-4"},{"q":"أي من الفتوحات التالية كانت في خلافة عثمان؟","options":["فتح مكة","فتح شمال إفريقيا وأرمينيا وأذربيجان وإنشاء أول أسطول بحري","فتح الأندلس","فتح القدس"],"answer":1,"why":"واكتمل فتح بلاد فارس وزاد الرخاء والأعطيات.","ref":"ص 4"},{"q":"بقيادة من كان غزو إفريقيا سنة 27هـ؟","options":["خالد بن الوليد","عمرو بن العاص","عبد الله بن سعد بن أبي السرح","سعد بن أبي وقاص"],"answer":2,"why":"سار في عشرة آلاف فافتتح سهلها وجبلها ودخل أهلها في الإسلام.","ref":"ص 4"},{"q":"كم أصاب الفارس من الغنيمة في غزو إفريقيا؟","options":["ألف دينار","مئة دينار","ثلاثة آلاف دينار (ألف له وألفان لفرسه)","لا شيء"],"answer":2,"why":"وأصاب الراجل ألف دينار.","ref":"ص 4"},{"q":"في أي سنة وقعت معركة ذات الصواري ومع من؟","options":["سنة 10هـ مع الفرس","سنة 31هـ مع الروم والبربر بقيادة قسطنطين بن هرقل","سنة 5هـ مع قريش","سنة 40هـ مع الخوارج"],"answer":1,"why":"جمع الروم خمسمائة مركب وكانت من أوائل المعارك البحرية في الإسلام فنصر الله المسلمين.","ref":"ص 4"},{"q":"ما موقف المسلمين والروم عند التقاء الجمعين في ذات الصواري؟","options":["الروم يرفعون الصليب والمسلمون يصلون ويقرؤون القرآن","الجميع يصلي","المسلمون هربوا","الروم استسلموا قبل القتال"],"answer":0,"why":"فصف ابن أبي السرح أصحابه وأمرهم بذكر الله وتلاوة القرآن.","ref":"ص 4"}],"8":[{"q":"متى نشأت الدولة الأموية وانتهت (هجرياً)؟","options":["11هـ - 100هـ","60هـ - 200هـ","41هـ - 132هـ","132هـ - 656هـ"],"answer":2,"why":"نشأت عام 41هـ (عام الجماعة) وانتهت سنة 132هـ.","ref":"ص 2"},{"q":"لماذا سُمّي عام 41هـ بعام الجماعة؟","options":["لتنازل الحسن بن علي لمعاوية رضي الله عنهم","لانتهاء الفتوح","لقيام الدولة العباسية","لوفاة معاوية"],"answer":0,"why":"تنازل الحسن عن الخلافة لمعاوية فاجتمعت كلمة المسلمين.","ref":"ص 2"},{"q":"كم عدد مراحل نشأة الدولة الأموية التي ذكرها الدرس؟","options":["مرحلتان","ثلاث","أربع","خمس"],"answer":2,"why":"التأسيس والقوة، ثم الفتنة، ثم القوة والإنجازات، ثم الضعف والانحلال.","ref":"ص 2"},{"q":"من الخليفتان في عصر الفتنة (64-73هـ)؟","options":["معاوية ويزيد","عبد الله بن الزبير وعبد الملك بن مروان","الوليد وسليمان","هشام ومروان"],"answer":1,"why":"شهد العصر صراعاً بين خليفتين لكن الدولة بقيت ثابتة ولم تفقد شيئاً من أراضيها.","ref":"ص 2"},{"q":"من الخليفة العظيم الذي حكم بين يزيد وهشام؟","options":["الوليد بن يزيد","إبراهيم","مروان بن محمد","عمر بن عبد العزيز"],"answer":3,"why":"وكان في عصر القوة والإنجازات (73-125هـ).","ref":"ص 2-3"},{"q":"من آخر خلفاء الدولة الأموية؟","options":["هشام بن عبد الملك","مروان بن محمد بن مروان","الوليد بن يزيد","إبراهيم بن الوليد"],"answer":1,"why":"وبقتله انتهى حكم الأمويين كخلفاء لكامل الدولة.","ref":"ص 3"},{"q":"ما «الملك العاض» في الحديث؟","options":["حكم الشورى","حكم القضاة","الملك العادل فقط","الملك الوراثي الذي يولي فيه الملك ابنه"],"answer":3,"why":"وقد بدأ منذ بداية الخلافة الأموية في عهد معاوية رضي الله عنه.","ref":"ص 3"},{"q":"بأي دعاء دعا النبي ﷺ لمعاوية؟","options":["«اللهم اجعله هادياً مهدياً واهد به»","«اللهم أكثر ماله»","«اللهم لا تهده»","«اللهم اجعله ملكاً»"],"answer":0,"why":"أخرجه الترمذي، كما كان من كتّاب الوحي.","ref":"ص 3"},{"q":"ماذا قال عمر بن الخطاب إذا نظر إلى معاوية؟","options":["هذا قاضي العرب","هذا فارس الإسلام","هذا كسرى العرب","هذا خالد الثاني"],"answer":2,"why":"وكان عمر قد ولاه الشام كلها وأقره عليها، كما أقره عثمان.","ref":"ص 4"},{"q":"من دهاة العرب الأربعة بحسب الشعبي؟","options":["أبو بكر وعمر وعثمان وعلي","خالد وسعد وأبو عبيدة وعمرو","معاوية وعلي والحسن والحسين","معاوية وعمرو بن العاص والمغيرة بن شعبة وزياد بن أبي سفيان"],"answer":3,"why":"وكان معاوية داهية شديد الذكاء معروفاً بحلمه.","ref":"ص 4"}],"9":[{"q":"كم بلغ عمر الدولة العباسية بالسنوات الهجرية؟","options":["124 سنة","300 سنة","800 سنة","524 سنة"],"answer":3,"why":"هي ثاني دولة إسلامية من حيث طول العمر بعد الدولة العثمانية، حتى سقوط بغداد على يد التتار.","ref":"ص 2"},{"q":"ما الفارق المهم بين العباسيين والعهود السابقة (النبوي والراشدي والأموي)؟","options":["حكموا كل المسلمين تحت راية واحدة","لم يكن لهم خلفاء","لم يحكموا العراق","لم يتمكن العباسيون من حكم جميع المسلمين في أي فترة"],"answer":3,"why":"بدأت الانشقاقات عنها منذ اليوم الأول بخلاف العهود السابقة التي جمعت المسلمين في دولة واحدة.","ref":"ص 2"},{"q":"على أي فكرة قامت الدعوة العباسية؟","options":["أحقية القبائل اليمنية","أحقية الفرس","أحقية آل البيت النبوي بحكم الأمة","أحقية الخوارج"],"answer":2,"why":"وهي فكرة لا تستند إلى سند صحيح من السنة، وقد أشار النبي ﷺ إلى خلافة أبي بكر.","ref":"ص 2"},{"q":"بماذا ردّ الدرس على دعوى الشيعة بأن النبي ﷺ أوصى لعلي بالخلافة؟","options":["بأنها وصية صحيحة","بأن الأمر مسكوت عنه","بأن عليّاً لو كان قد أوصي له لما سكت لأنه كتمان لبند من بنود الشريعة","بأن عمر هو الموصى له"],"answer":2,"why":"فسكوت علي رضي الله عنه دليل على عدم وجود الوصية.","ref":"ص 2"},{"q":"من أين جاء جميع خلفاء الدولة العباسية من فروع آل العباس؟","options":["من نسل جعفر","من نسل علي","من نسل عبد الله بن عباس رضي الله عنهما","من نسل حمزة"],"answer":2,"why":"مع أن العباس كان له عشرة أبناء ذكور.","ref":"ص 3"},{"q":"كم بلغ عدد خلفاء الدولة العباسية؟","options":["12 خليفة","37 خليفة","100 خليفة","57 خليفة"],"answer":1,"why":"كلهم عدا الأول أبي العباس السفاح من نسل الخليفة الثاني أبي جعفر المنصور.","ref":"ص 3"},{"q":"من أين بدأت الفكرة العباسية؟","options":["من قرية الحميمة بالبلقاء في الأردن","من الكوفة","من مكة","من خراسان فقط"],"answer":0,"why":"كان يعيش بها علي بن عبد الله بن عباس (السجاد) وكان صالحاً متفرغاً للعبادة بعيداً عن الانقلابات.","ref":"ص 3"},{"q":"ما الشعار الذي اعتمده محمد بن علي في دعوته؟","options":["«الخلافة للعباس»","«الحكم لله»","«الملك للعرب»","«الرضا من آل محمد ﷺ»"],"answer":3,"why":"ولم يحدد شخصاً معيناً ليستفيد من دعم بقية عائلات البيت النبوي.","ref":"ص 4"},{"q":"لماذا اختار محمد بن علي الكوفة وخراسان مجالاً لعمله؟","options":["الكوفة معقل الثورات والفتن، وخراسان بعيدة عن دمشق وفيها حقد على الأمويين","لأنهما أغنى المدن","لقربهما من دمشق","لأن العباس سكنهما"],"answer":0,"why":"وكان غالب سكان خراسان من الأتراك ثم الفرس.","ref":"ص 4"},{"q":"من الذي لُقّب لاحقاً بالسفاح ومن المنصور؟","options":["إبراهيم السفاح والمنصور أخوه","عبد الله الأصغر السفاح وعبد الله الأكبر المنصور","داود السفاح وصالح المنصور","الأمين السفاح والمأمون المنصور"],"answer":1,"why":"وأعطى محمد بن علي الإمامة قبل موته لابنه إبراهيم فلُقّب بإبراهيم الإمام.","ref":"ص 4"}],"10":[{"q":"في أي عام تأسست الدولة الزنكية؟","options":["132هـ","656هـ","521هـ","41هـ"],"answer":2,"why":"استمرت نحو قرن من الزمن، وكان وجودها المؤثر الحقيقي نحو 58 عاماً في عهد زنكي وابنه نور الدين.","ref":"ص 2"},{"q":"إلى أي أصل تنتمي أسرة زنكي؟","options":["أصول تركية من قبائل «ثابيو»","أصول فارسية","أصول عربية قرشية","أصول كردية"],"answer":0,"why":"وعملت في خدمة دولة السلاجقة، وأول رموزها آق سنقر الحاجب.","ref":"ص 2"},{"q":"ما أبرز إنجاز عسكري لعماد الدين زنكي؟","options":["فتح القسطنطينية","فتح الرها (إمارة صليبية حصينة)","فتح مصر","فتح القدس"],"answer":1,"why":"خدع الصليبيين بتغيير مساره وفاجأها بجيشين، ثم دخلها المسلمون بعد انهيار جزء من السور سنة 539هـ.","ref":"ص 3"},{"q":"ماذا فعل عماد الدين بعد النصر في الرها مع النصارى الشرقيين؟","options":["قتلهم","طردهم","صادر أموالهم","أمر بوقف القتال والعفو عنهم وإعادة ما أخذ منهم"],"answer":3,"why":"ومنحهم مظلة الدولة الإسلامية وشكلاً من الحكم الذاتي.","ref":"ص 3"},{"q":"كيف انتهت حياة عماد الدين زنكي؟","options":["مات في معركة","قُتل عام 541هـ على يد بعض الخدم العملاء","مات مريضاً","نُفي"],"answer":1,"why":"حكم نحو 20 سنة وترك أربعة أبناء منهم نور الدين محمود.","ref":"ص 3"},{"q":"من تولى الحكم بعد عماد الدين وكان أنجب أبنائه؟","options":["غازي","نور الدين محمود","قطب الدين","صلاح الدين"],"answer":1,"why":"وكان متميزاً في القيادة وقوة العقيدة وحسن الأخلاق.","ref":"ص 3"},{"q":"ما الذي أسسه نور الدين لإقامة العدل؟","options":["دار الندوة","بيت الحكمة","ديوان الجند","دار العدل"],"answer":3,"why":"كما ألغى المكوس وهي الضرائب الظالمة.","ref":"ص 4"},{"q":"ما سبب لعب نور الدين بالكرة بحسب رسالته؟","options":["اللهو","المنافسة","تدريب الخيل على الكر والفر في الثغر","الرياضة العامة"],"answer":2,"why":"كتب: «والله ما أقصد اللعب، وإنما نحن في ثغر».","ref":"ص 4"},{"q":"ما ردّ نور الدين على من أشار عليه بعدم المخاطرة بنفسه في القتال؟","options":["«ومن محمود حتى يقال هذا؟ حفظ الله البلاد قبلي»","«أخاف الموت»","«سأتراجع»","«القتال لغيري»"],"answer":0,"why":"فكان يقاتل في سبيل الله ويتقدم الناس.","ref":"ص 4"},{"q":"ما موقف نور الدين لما شكت إليه زوجته ضيق النفقة؟","options":["قال: «من أين أعطيها؟ والله لا أخوض نار جهنم في هواها»","أعطاها من بيت المال","غضب عليها وطلقها","أهمل شكواها"],"answer":0,"why":"كان لا يأكل ولا يلبس إلا من ملك اشتراه من سهمه من الغنيمة.","ref":"ص 5"}],"11":[{"q":"متى ظهرت دولة التتار، وبقيادة من؟","options":["سنة 603هـ في منغوليا بقيادة جنكيز خان","سنة 656هـ في بغداد بقيادة هولاكو","سنة 628هـ في خوارزم بقيادة إيكتاي","سنة 658هـ في الشام بقيادة كتبغا"],"answer":0,"why":"ظهرت في منغوليا شمال الصين، وتوسع جنكيز خان تدريجيًّا حتى بلغ ملكه حدود الدولة الخوارزمية.","ref":"ص 3"},{"q":"ما اسم الكتاب التشريعي الذي جمع فيه جنكيز خان خليطًا من الشرائع ليكون دستورًا للتتار؟","options":["الأحكام السلطانية","السياسة الشرعية","الياسق","الخراج"],"answer":2,"why":"لم تكن لهم ديانة سماوية، فجمع جنكيز خان شرائع من الإسلام والنصرانية والبوذية في كتاب «الياسق».","ref":"ص 3"},{"q":"ما الخدعة التي استعملها التتار مع المجاهدين الذين خرجوا للدفاع عن سمرقند؟","options":["إرسال رسل الصلح ثم الغدر بهم","الانسحاب المتدرج من حول الأسوار ثم نصب الكمائن خلفهم","حفر الأنفاق تحت أسوار المدينة","قطع الماء عن المدينة حتى استسلمت"],"answer":1,"why":"أبعدوا المجاهدين عن الأسوار بانسحاب متدرج ثم أحاطوا بهم، فاستشهد سبعون ألفًا من رجال المدينة دفعة واحدة.","ref":"ص 4"},{"q":"من الوزير المقرّب من الخليفة المستعصم بالله الذي خان المسلمين وتعاون مع التتار؟","options":["فخر الدين يوسف","فارس الدين أقطاي","ركن الدين بيبرس","مؤيد الدين العلقمي"],"answer":3,"why":"استفاد هولاكو من الخلافات داخل الدولة العباسية ومن علاقته بالعلقمي القريب من الخليفة.","ref":"ص 5"},{"q":"في أي سنة سقطت بغداد عاصمة الخلافة العباسية في أيدي التتار؟","options":["656هـ","603هـ","616هـ","658هـ"],"answer":0,"why":"حاصرها التتار ثم دخلوها، واستباحوها نحو أربعين يومًا، وأُلقيت كتب مكتبتها في نهر دجلة.","ref":"ص 6"},{"q":"لماذا عُرف المماليك الصالحية باسم «المماليك البحرية»؟","options":["لأنهم جُلبوا من بلاد ما وراء البحر","لأنهم بنوا قلعتهم بجوار قصر الملك الصالح على النيل، وكان النيل يُعرف بالبحر","لأنهم كانوا قادة الأسطول البحري","لأنهم سكنوا سواحل البحر المتوسط"],"answer":1,"why":"كانت قلعتهم في منطقة الروضة بالقاهرة إلى جوار قصر الملك الصالح نجم الدين أيوب.","ref":"ص 7"},{"q":"لماذا اختارت شجرة الدر عز الدين أيبك ليتولى الحكم؟","options":["لأنه كان أقوى قادة المماليك البحرية","لأنه من أحفاد صلاح الدين الأيوبي","لهدوئه وابتعاده عن الصراعات وكونه أقل قوة من زعماء المماليك البارزين","لأن الخليفة العباسي أوصى به"],"answer":2,"why":"أرادت أن تحكم من خلاله، لكنه لم يكن ضعيفًا بالقدر الذي توقعته، فكوّن المماليك المعزية وعزز سلطته تدريجيًّا.","ref":"ص 8"},{"q":"كيف واجه قطز رسالة التهديد التي حملها رسل هولاكو؟","options":["طلب مهلة للتفاوض مع التتار","أرسل هدايا ليتقي شرهم","ردّهم بكتاب يطلب فيه الصلح","أمر بقتل الرسل الأربعة وعلّق رؤوسهم أمام الناس"],"answer":3,"why":"كان لهذا الموقف الحازم أثر كبير في رفع معنويات المسلمين وإظهار العزم على المواجهة.","ref":"ص 10"},{"q":"ما المبدأ الذي قرره العز بن عبد السلام في تمويل الجهاد؟","options":["لا تُفرض الضرائب على الناس إلا بعد أن يبذل الأمراء والوزراء أموالهم","تتحمل العامة جميع النفقات","يُعتمد على أموال التجار وحدهم","يُلغى الإنفاق العسكري حتى تتحسن الأحوال"],"answer":0,"why":"بذل الأمراء أموالهم بالفعل، وارتفعت الروح الإيمانية والمعنويات استعدادًا للقتال.","ref":"ص 11"},{"q":"متى وقعت معركة عين جالوت؟","options":["يوم الأحد الثامن والعشرين من رمضان سنة 656هـ","يوم الجمعة الخامس والعشرين من رمضان سنة 658هـ","في أوائل شعبان سنة 657هـ","في ربيع الأول سنة 655هـ"],"answer":1,"why":"انتهت بانتصار المسلمين بقيادة قطز، ومقتل كتبغا قائد التتار، وأوقفت زحفهم في تلك المرحلة.","ref":"ص 12-13"}],"12":[{"q":"ما السياسة التي اتبعها موسى بن نصير لتثبيت الفتح في الشمال الإفريقي؟","options":["عدم متابعة الفتح في منطقة جديدة حتى تستقر النفوس، مع نشر الإسلام وتأليف القلوب","التوسع السريع دون توقف","الاعتماد على القوة العسكرية وحدها","ترك تعليم السكان والاكتفاء بالجباية"],"answer":0,"why":"أرسل العلماء والدعاة لتعليم الناس، فخضع الشمال الإفريقي وقبائل البربر حكمًا ودعوة.","ref":"ص 5"},{"q":"من قائد السرية الاستطلاعية الأولى، وأول مسلم تطأ قدمه أرض الأندلس؟","options":["طارق بن زياد","موسى بن نصير","طريف بن مالك","عبد الرحمن الغافقي"],"answer":2,"why":"عبرت السرية في رمضان سنة 91هـ ونزلت في جزيرة قرب الجزيرة الخضراء.","ref":"ص 6"},{"q":"ما الدور الذي أداه «يوليان» حاكم سبتة في فتح الأندلس؟","options":["قاد جيش القوط ضد طارق بن زياد","عرض تسليم سبتة للمسلمين وتسهيل عبورهم إلى الأندلس","تولى حكم القيروان بعد موسى بن نصير","أرسل المدد إلى لذريق"],"answer":1,"why":"كان أبناء غيطشة يريدون استعادة مزارع أبيهم، فرأى موسى في العرض فرصة سانحة لفتح الأندلس.","ref":"ص 6"},{"q":"كم بلغ عدد جيش المسلمين في معركة وادي برباط بعد وصول المدد، مقابل جيش لذريق؟","options":["خمسة آلاف مقاتل مقابل خمسين ألفًا","خمسون ألف مقاتل مقابل أربعمائة ألف","تسعة آلاف مقاتل مقابل ثلاثين ألفًا","اثنا عشر ألف مقاتل مقابل مائة ألف"],"answer":3,"why":"أمدّ موسى طارقًا بخمسة آلاف مجاهد، وكان أكثرهم من المشاة، وقضت المعركة على معظم القوى العسكرية للقوط.","ref":"ص 7"},{"q":"بماذا ذكّر عبد الرحمن الغافقي جنده حين مالت نفوس بعضهم إلى الغنائم في بلاط الشهداء؟","options":["أن مهمة المسلمين إخراج الناس من عبودية البشر إلى عبودية رب العالمين، لا جمع الغنائم","أن الانسحاب أفضل للحفاظ على الغنائم","أن المدد سيصلهم من قرطبة قريبًا","أن شارل مارتل طلب الصلح"],"answer":0,"why":"استقرت نفوسهم لهذا المعنى، لكن الانشغال بالغنائم أدى لاحقًا إلى تحول دفة المعركة بعد استشهاده.","ref":"ص 8-9"},{"q":"لماذا لُقّب عبد الرحمن بن معاوية بـ«الداخل»؟","options":["لأنه أول من دخل فرنسا من المسلمين","لأنه دخل القسطنطينية فاتحًا","لأنه دخل الأندلس منفردًا بعد أن كان مطاردًا من العباسيين","لأنه تولى شؤون الداخل في الدولة الأموية"],"answer":2,"why":"ولُقّب كذلك بـ«صقر قريش»، وأسس دولة أموية في الأندلس بعد سقوطها في المشرق، وبنى جامع قرطبة.","ref":"ص 10-11"},{"q":"كم بلغ عدد الدويلات في عهد ملوك الطوائف؟","options":["12 دويلة","22 دويلة","36 دويلة","5 دويلات"],"answer":1,"why":"بدأ هذا العهد في حدود سنة 420هـ، وتنازع ملوكه فيما بينهم فاستغل الأعداء تمزقهم.","ref":"ص 12"},{"q":"لماذا سُمّيت معركة الزلاقة بهذا الاسم؟","options":["لأنها وقعت قرب نهر يُسمّى الزلاقة","لانزلاق جيش النصارى من الجبال","لأنها وقعت في فصل الأمطار","لكثرة انزلاق الخيل فيها بسبب كثافة الدماء"],"answer":3,"why":"خاضها يوسف بن تاشفين سنة 479هـ، وأخّرت سقوط الأندلس مدة طويلة.","ref":"ص 12"},{"q":"من المرأة التي خاطبت ابنها حين بكى ملكه الضائع: «ابكِ مثل النساء ملكًا مضاعًا لم تحافظ عليه مثل الرجال»؟","options":["عائشة الحرة أم عبد الله الصغير","صبح البشكنسية","شجرة الدر","أسماء بنت أبي بكر"],"answer":0,"why":"كانت من أعظم النماذج النسائية في أحداث سقوط غرناطة، وبذلت محاولات جبارة للحفاظ على الأندلس.","ref":"ص 15"},{"q":"أي مما يلي من أسباب سقوط الأندلس التي ذكرها الدرس؟","options":["كثرة الجهاد في سبيل الله","إسناد الأمر إلى غير أهله، والإعراض عن نصائح العلماء","قلة عدد المدن في الأندلس","اتحاد ملوك الطوائف تحت راية واحدة"],"answer":1,"why":"استُشهد بحديث «إذا أُسند الأمر إلى غير أهله فانتظر الساعة»، إلى جانب ضعف العقيدة والانغماس في الشهوات.","ref":"ص 13-14"}],"13":[{"q":"إلى أي قبائل يرجع أصل العثمانيين؟","options":["القبائل العربية","القبائل الفارسية","قبائل المغول","قبائل الغُز التركية"],"answer":3,"why":"نزحت جماعات منهم من بلاد التركستان أمام التوسع المغولي، وعبرت قبيلة منهم بقيادة سليمان شاه نهر الفرات.","ref":"ص 4"},{"q":"من الزعيم التركي الذي كان إسلامه نقطة التحول في اهتداء الأتراك إلى الإسلام؟","options":["قراخان","طاوس","أرطغرل","سليمان شاه"],"answer":0,"why":"أسلم في خلافة المطيع لله العباسي، وكان إسلامه سببًا في إسلام جماعات من قومه.","ref":"ص 4"},{"q":"من يُعد المؤسس الأول للدولة العثمانية؟","options":["أورخان غازي","مراد الأول","عثمان بن أرطغرل","محمد الفاتح"],"answer":2,"why":"انتقلت إليه الزعامة بعد وفاة أبيه، ووضع الحجر الأساس للدولة، ولُقّب بـ«الغازي عثمان».","ref":"ص 5"},{"q":"ما التنبيه الذي ذكره الدرس حول مسلسلي «أرطغرل» و«عثمان»؟","options":["هما المصدر الأوثق لتاريخ الدولة العثمانية","تضمّنا إضافات وتصورات درامية لا يصح التعامل معها على أنها وقائع تاريخية ثابتة","لا يختلفان عن الروايات التاريخية في شيء","يغنيان عن قراءة كتب التاريخ"],"answer":1,"why":"ينبغي أن يُدرس التاريخ من خلال الروايات والمصادر، مع التمييز بين الوقائع الثابتة والمعالجة الدرامية.","ref":"ص 4-5"},{"q":"على يد من فُتحت القسطنطينية، ومتى؟","options":["السلطان سليمان القانوني سنة 926هـ","السلطان مراد الثاني سنة 824هـ","السلطان بايزيد الأول سنة 791هـ","السلطان محمد الفاتح سنة 857هـ"],"answer":3,"why":"جُعلت عاصمة للدولة باسم إسطنبول، وكان عهد الفاتح نقطة تحول في تاريخ الدولة العثمانية.","ref":"ص 5، ص 7"},{"q":"أي سلاطين الدولة العثمانية لُقّب بـ«الصاعقة»؟","options":["بايزيد الأول","سليم الأول","مراد الأول","محمد الأول"],"answer":0,"why":"وحّد أجزاء واسعة من الأناضول، وانتصر على الأوروبيين في نيكوبوليس، وفرض حصارًا على القسطنطينية.","ref":"ص 7"},{"q":"لماذا لُقّب السلطان سليمان بـ«القانوني»؟","options":["لأنه كان قاضيًا قبل توليه الحكم","لأنه ألغى القوانين الشرعية","لأنه عمل على تقنين القوانين العثمانية بما يتناسب مع الشريعة الإسلامية","لأنه درس القانون في أوروبا"],"answer":2,"why":"بلغ التوسع العثماني في عهده ذروته، واشتهر فيه شيخ الإسلام أبو السعود أفندي.","ref":"ص 8"},{"q":"ما الصحيح عن عناية سليمان القانوني بالقدس؟","options":["هو الذي فتح القدس وأخرج منها الصليبيين","لم يفتحها؛ فقد دخلت في عهد أبيه سليم الأول، وإنما رمّم قبة الصخرة وأعاد بناء سور المدينة","أهمل القدس وانشغل بأوروبا","نقل عاصمة الدولة إلى القدس"],"answer":1,"why":"استمرت أعمال بناء السور نحو أربع سنوات، وطوّر مصادر المياه والأسبلة وأنشأ الأوقاف.","ref":"ص 8-9"},{"q":"لماذا تقدّم السلطان بايزيد الثاني لإمامة الناس عند افتتاح جامعه؟","options":["لأنه السلطان ولا يتقدم عليه أحد","لأن شيخ الإسلام غاب عن الافتتاح","لأنه كان أحفظ الحاضرين للقرآن","لأنه كان الوحيد بين الحاضرين الذي لم تفته صلاة فرض طوال حياته"],"answer":3,"why":"طلب إمام الجامع أن يتقدم من لم يضطر طوال حياته إلى قضاء صلاة فرض، فتقدم السلطان.","ref":"ص 11"},{"q":"متى أُلغيت الخلافة العثمانية، وعلى يد من؟","options":["سنة 1923م على يد مصطفى كمال أتاتورك","سنة 1908م على يد السلطان عبد الحميد","سنة 1917م على يد الإنجليز","سنة 1924م على يد جمعية تركيا الفتاة"],"answer":0,"why":"أعلن الجمهورية التركية، وألغى الأذان بالعربية، ومنع الحجاب، وكتب التركية بالحروف اللاتينية.","ref":"ص 15-16"}],"14":[{"q":"بحسب حديث أبي ذر رضي الله عنه، كم كان بين بناء المسجد الحرام والمسجد الأقصى؟","options":["سبعون عامًا","مائة عام","أربعون عامًا","ألف عام"],"answer":2,"why":"قال ﷺ: «المسجد الحرام» ثم «المسجد الأقصى»، وبينهما «أربعون». (رواه البخاري)","ref":"ص 3"},{"q":"لماذا سُمّي المسجد الأقصى بهذا الاسم؟","options":["لبُعد المسافة بينه وبين المسجد الحرام، فالأقصى بمعنى الأبعد","لأنه أقصى مساجد الشام شمالًا","لأنه آخر المساجد بناءً","لأنه أكبر المساجد مساحة"],"answer":0,"why":"فهو أبعد مسجد عن أهل مكة، وهو أولى القبلتين وثالث المساجد التي تُشد إليها الرحال.","ref":"ص 3"},{"q":"من الذي أمر ببناء المصلى الرئيسي في المسجد الأقصى (موقع الجامع القبلي اليوم)؟","options":["عبد الملك بن مروان","عمر بن الخطاب رضي الله عنه","صلاح الدين الأيوبي","سليمان القانوني"],"answer":1,"why":"كان بناءً خشبيًّا يتسع لنحو ألف شخص، ثم أكمل عبد الملك بن مروان بناء المسجد وأتمّه ابنه الوليد.","ref":"ص 3-4"},{"q":"أي المدن تُعد أقدم مدينة في العالم بحسب بعض المؤرخين وخبراء الآثار؟","options":["القدس","يافا","غزة","أريحا"],"answer":3,"why":"مدينة كنعانية في فلسطين يرجع تاريخها إلى نحو 8000 قبل الميلاد.","ref":"ص 5"},{"q":"بماذا خالف البروتستانت الكاثوليك في نظرتهم إلى اليهود المعاصرين؟","options":["عدّوهم قومًا محرفين لا صلة لهم بالتوراة","رفضوا أي وعد لهم بالعودة","عدّوهم امتدادًا لليهود المؤمنين الموعودين بالعودة إلى الأرض المقدسة","رأوا أن الكنيسة هي الوارث الوحيد للوعد"],"answer":2,"why":"ومن هنا نشأ ما يُسمّى بالصليبية الصهيونية، أي اتحاد الصهيونية اليهودية وغير اليهودية على إعادة اليهود إلى فلسطين.","ref":"ص 8"},{"q":"ما أول قنصلية أجنبية أُنشئت في بيت المقدس؟","options":["القنصلية الإنجليزية سنة 1839م","القنصلية الفرنسية سنة 1799م","القنصلية الأمريكية سنة 1917م","القنصلية الروسية سنة 1881م"],"answer":0,"why":"أُنشئت في عهد سيطرة محمد علي على الشام، وكان لها دور خطير في رعاية اليهود والبروتستانت.","ref":"ص 10"},{"q":"بماذا ردّ السلطان عبد الحميد الثاني على عرض هرتزل؟","options":["قبله مقابل عشرين مليون ليرة ذهبية","طلب مهلة لاستشارة الدول الأوروبية","وافق على هجرة محدودة دون دولة","رفضه وقال: لا أقدر أن أبيع ولو قدمًا واحدًا من البلاد لأنها ليست لي بل لشعبي"],"answer":3,"why":"عرض هرتزل دعمًا ماليًّا كبيرًا وتحسين صورة السلطان في الصحف الغربية، فرفض السلطان التفريط في الأرض.","ref":"ص 12"},{"q":"ما اسم الاتفاقية التي قسّمت بها بريطانيا وفرنسا مناطق الشام والعراق؟","options":["وعد بلفور","سايكس بيكو","الكتاب الأبيض","اتفاقية لندن"],"answer":1,"why":"نسبة إلى مارك سايكس البريطاني وفرانسوا جورج بيكو الفرنسي، ورُسمت بها الحدود التي نعرفها اليوم.","ref":"ص 13-14"},{"q":"من الوزير الصهيوني الذي عيّنته بريطانيا حاكمًا على فلسطين سنة 1920م وعُدّ من المؤسسين الفعليين لدولة إسرائيل؟","options":["هربرت صموئيل","حاييم وايزمان","آرثر بلفور","بن غوريون"],"answer":0,"why":"كتب تقريرًا سنة 1915م يرى فيه ضرورة مرور البلاد بمرحلة احتلال بريطاني لتمهيد إقامة الدولة اليهودية.","ref":"ص 14"},{"q":"ما «اللاءات الثلاث» التي أقرّها مؤتمر القمة العربية في الخرطوم بعد نكسة 1967م؟","options":["لا للحرب، ولا للهجرة، ولا للتقسيم","لا للانتداب، ولا للاستيطان، ولا للتطبيع","لا للصلح، ولا للتفاوض، ولا للاستسلام","لا للسلاح، ولا للفدائيين، ولا للمقاومة"],"answer":2,"why":"كانت هذه هي القرارات العربية في ذلك الوقت، قبل أن تظهر لاحقًا مشاريع السلام.","ref":"ص 22"}],"15":[{"q":"ما الدلالة التربوية لقول هاجر عليها السلام لإبراهيم عليه السلام: «إذن لا يضيعنا»؟","options":["ثقتها بوعد الله جعلتها تطمئن مع شدة الظروف","أنها كانت تعلم مسبقًا مكان ماء زمزم","أنها كانت تنتظر عودة إبراهيم قريبًا","أنها اعتمدت على قبيلة جرهم"],"answer":0,"why":"قامت بوظيفتها زوجة صالحة وأمًّا فاضلة، فنشأ إسماعيل نبيًّا صادق الوعد.","ref":"ص 3-4"},{"q":"ماذا نذرت امرأة عمران لله تعالى؟","options":["شاة تذبحها عند الولادة","ما في بطنها محرَّرًا خالصًا لخدمة بيت المقدس","مالها كله للفقراء","صيام سنة كاملة"],"answer":1,"why":"معنى «محررًا»: خالصًا لطاعة الله ولخدمة بيته، وتقبّل الله مريم بقبول حسن.","ref":"ص 4"},{"q":"كيف قدّمت أم سليم رضي الله عنها لولدها وللأمة خير هدية؟","options":["أرسلته إلى الشام لطلب العلم","زوّجته مبكرًا ليتفرغ للجهاد","علّمته الرماية والفروسية","جعلت ابنها أنسًا في خدمة رسول الله ﷺ، فكان ذلك سببًا في حفظ السنة"],"answer":3,"why":"خدم أنس النبي ﷺ عشر سنين، وروى عنه 2286 حديثًا، وكانت أمه تربيه على حفظ سر رسول الله ﷺ.","ref":"ص 5-6"},{"q":"كيف ربّت صفية بنت عبد المطلب رضي الله عنها ابنها الزبير بن العوام؟","options":["أبعدته عن ساحات القتال خوفًا عليه","وجّهته إلى التجارة","عوّدته الشجاعة والإقدام، ورأت أن الشدة في تربيته تعينه على مواجهة الصعاب","تركته لأعمامه يتولون تربيته"],"answer":2,"why":"علّمته استخدام السهام والقوس، فصار حواري رسول الله ﷺ وعدّه عمر بألف رجل.","ref":"ص 7"},{"q":"بماذا ردّت أسماء بنت أبي بكر رضي الله عنهما على ابن عمر حين وصّاها بالصبر بعد مقتل ابنها عبد الله؟","options":["«وما يمنعني من الصبر وقد أُهدي رأس يحيى بن زكريا إلى بغيّ من بغايا بني إسرائيل»","«الحمد لله الذي شرّفني بقتله»","«لقد أحسن الله إليه بالشهادة فلا أحزن»","«إنا لله وإنا إليه راجعون، وحسبي الله»"],"answer":0,"why":"ماتت رضي الله عنها صابرة محتسبة بعد مقتل ابنها بليالٍ.","ref":"ص 8"},{"q":"ماذا قالت الخنساء رضي الله عنها حين بلغها استشهاد أبنائها الأربعة؟","options":["رثتهم رثاءً طويلًا كما رثت أخاها صخرًا","«الحمد لله الذي شرّفني بقتلهم، وأرجو من ربي أن يجمعني بهم في مستقر رحمته»","«ليتني متّ قبل هذا»","اعتزلت الناس حزنًا عليهم"],"answer":1,"why":"لم تجزع رضي الله عنها، وقد أجمع أهل الشعر على أنه لم تكن امرأة قط أشعر منها.","ref":"ص 9"},{"q":"إلى من وجّهت أم الإمام مالك ابنها قائلة: «فتعلّم من أدبه قبل علمه»؟","options":["ابن شهاب الزهري","ابن هرمز","نافع مولى ابن عمر","ربيعة، مفتي المدينة"],"answer":3,"why":"كانت تعمّمه وترسله إليه، واختارت له الفقه، وصرفته بعبارة لبقة عن رغبته في الغناء.","ref":"ص 9-10"},{"q":"لماذا ارتحلت أم الشافعي بابنها من عسقلان إلى مكة؟","options":["هربًا من الفقر والجوع","لأن أهلها كانوا في مكة","حتى يُحفظ لسانه ويثبت نسبه","ليتعلم التجارة في الحرم"],"answer":2,"why":"أخرجته إلى قبيلة هذيل ليتعلم العربية الصحيحة، فأتم حفظ القرآن ابن سبع سنين، والموطأ ابن عشر.","ref":"ص 11"},{"q":"ماذا كانت أم سفيان الثوري تقول له لتعينه على التفرغ لطلب العلم؟","options":["«يا بني، اطلب العلم وأنا أكفيك بمغزلي»","«يا بني، ارتحل إلى الزهري ولو بعت الدار»","«يا بني، اعمل نهارًا واطلب العلم ليلًا»","«يا بني، اكتفِ بما تعلّمته من أبيك»"],"answer":0,"why":"وكانت تقول: إذا كتبت عشرة أحرف فانظر هل ترى في نفسك زيادة في خشيتك وحلمك ووقارك.","ref":"ص 14-15"},{"q":"ماذا كتبت أم شيخ الإسلام ابن تيمية إليه حين اعتذر عن طول غيابه في مصر؟","options":["«عُد إليّ فقربك مني أحب إليّ من كل شيء»","«والله لمثل هذا ربيتك، ولخدمة الإسلام والمسلمين نذرتك»","«ارجع إلى دمشق فقد طال انتظاري»","«لا ترحل عن بلدك بعد اليوم»"],"answer":1,"why":"وقالت: إن غاية رضائي عليك لا يكون إلا بقدر ما تقدمه لدينك وللمسلمين.","ref":"ص 17"}]},"s4":{"1":[{"q":"ما الوحدة البنائية الأولى في المجتمع المسلم بحسب الدرس؟","options":["المدرسة","المسجد","الحي","الأسرة"],"answer":3,"why":"يقوم استقرارها على كفاءة إدارتها، والإدارة المنزلية مسؤولية وأمانة.","ref":"ص 2"},{"q":"ما الحديث الذي استُشهد به على مسؤولية المرأة في بيتها؟","options":["«والمرأة راعية على بيت زوجها وولده»","«الدين النصيحة»","«إنما الأعمال بالنيات»","«خيركم خيركم لأهله»"],"answer":0,"why":"أخرجه البخاري، وهو أساس اعتبار الإدارة المنزلية أمانة.","ref":"ص 2"},{"q":"ما تعريف التهيئة الذاتية لربة الأسرة؟","options":["جمع المال فقط","امتلاك استعدادات نفسية ومعارف ومهارات تمكنها من إدارة موارد الأسرة بكفاءة","الاعتماد على الخادمة","ترك المنزل"],"answer":1,"why":"وتشمل التعامل الواعي مع متطلبات الحياة واتخاذ القرارات المناسبة لتحقيق الاستقرار الأسري.","ref":"ص 2"},{"q":"ما العلاقة بين التهيئة الذاتية ونجاح الإدارة؟","options":["التهيئة نتيجة للإدارة","لا علاقة بينهما","التهيئة شرط سابق لنجاح الإدارة لا نتيجة لها","الإدارة تغني عن التهيئة"],"answer":2,"why":"فضعف التهيئة الذاتية مدخل رئيس لاختلال النظام الأسري مهما توافرت الموارد.","ref":"ص 3"},{"q":"ماذا يحدث حين تتوافر المعرفة دون إرادة؟ وحين تتوافر الإرادة دون علم؟","options":["ينجح كل شيء","يتعثر التطبيق / تقع الأخطاء وتتكرر الأزمات","لا يتغير شيء","يزيد الدخل"],"answer":1,"why":"فنجاح الإدارة مرهون بتكامل ثنائية الإرادة والعلم.","ref":"ص 3"},{"q":"أي مما يلي من أبعاد التهيئة الذاتية للمرأة المسلمة؟","options":["المالية والعقارية","الإعلامية والفنية","الرياضية فقط","النفسية والمعرفية والروحية"],"answer":3,"why":"ذكر الدرس ثلاثة أبعاد: التهيئة النفسية والمعرفية والروحية.","ref":"ص 4"},{"q":"ماذا قالت عائشة رضي الله عنها عن حال آل محمد ﷺ في المعيشة؟","options":["كانوا في رخاء دائم","كانوا يبذخون","ما شبع آل محمد من خبز مأدوم ثلاثة أيام حتى لحق بالله","كانوا يدّخرون الكثير"],"answer":2,"why":"وهو استلهام من صبر أمهات المؤمنين في إدارة شؤون البيت رغم تقللهم من الدنيا.","ref":"ص 4"},{"q":"بماذا شبّه النبي ﷺ البيت الذي يُذكر الله فيه والذي لا يُذكر؟","options":["مثل الحي والميت","مثل النور والظلام","مثل الغني والفقير","مثل القوي والضعيف"],"answer":0,"why":"رواه مسلم، وفيه أن عمارة البيت بالإيمان والعمل الصالح لا بمجرد وفرة الإمكانات.","ref":"ص 4"},{"q":"ما التسويف؟","options":["تأجيل القيام بالعمل مع معرفة أهميته وآثار تأخيره","نسيان العمل","إنجاز العمل مبكراً","ترك العمل نهائياً"],"answer":0,"why":"وقد يتحول عند بعضهم إلى عادة تؤثر في دراستهم وأعمالهم وحياتهم الأسرية.","ref":"ص 5"},{"q":"من أسباب التسويف المذكورة:","options":["كثرة الوقت","حب النتائج السريعة والهروب من المشقة","قوة الإرادة","وضوح الأهداف"],"answer":1,"why":"فالنفس تميل لما يعطيها متعة مباشرة وتؤجل ما يحتاج وقتاً حتى تظهر ثمراته.","ref":"ص 5-6"}],"2":[{"q":"ما أثر التنظيم الداخلي للمنزل بحسب الدرس؟","options":["الراحة النفسية والاستقرار الأسري وكفاءة الحركة وحسن استغلال المساحات","تقليل عدد الغرف","زيادة الأثاث","لا أثر له"],"answer":0,"why":"فالمسكن المنظم يعين الأسرة على أداء شؤونها بسلاسة ويخلق بيئة هادئة.","ref":"ص 2"},{"q":"على أي أساس تُبنى قرارات اختيار الأثاث وتوزيعه؟","options":["الموضة فقط","أرخص سعر","إدراك أبعاد الغرفة وشكلها ومسارات الحركة الطبيعية","رغبة الضيوف"],"answer":2,"why":"فالتنظيم يقوم على تخطيط واعٍ للمساحة.","ref":"ص 2"},{"q":"ما القاعدة في استغلال المساحات والممرات؟","options":["ملء الممرات بالأثاث","وضع أكبر أثاث ممكن","التمييز بين الاحتياجات الفعلية والرغبات الشكلية وترك الممرات خالية","تجاهل الممرات"],"answer":2,"why":"مما يمنع ازدحام المساحات بعناصر غير وظيفية.","ref":"ص 2-3"},{"q":"ما معنى «التناسب والمقياس» في الدرس؟","options":["شراء أكبر قطعة","عدم قياس الغرفة","اعتماد لون واحد","أن تتلاءم أبعاد الأثاث مع مساحة المكان وتجنب المبالغة في الأحجام"],"answer":3,"why":"فالمبالغة تولّد ضيقاً بصرياً وتعيق الاستخدام الوظيفي.","ref":"ص 3"},{"q":"بماذا يُنصح في التخطيط المبدئي للغرف؟","options":["شراء الأثاث أولاً","الرسم باليد بعد رفع القياسات","ترك التخطيط للعشوائية","التقليد دون قياس"],"answer":1,"why":"مع رؤية واضحة للأبواب واتجاه فتحها والمنافذ.","ref":"ص 3"},{"q":"بِمَ يُقاس نجاح توزيع الأثاث؟","options":["بعدد القطع","بمدى تحقيقه للانسيابية الحركية داخل الغرفة","بسعر الأثاث","بحجم الغرفة فقط"],"answer":1,"why":"أي سهولة الانتقال دون عوائق وترك مسافات كافية وفتح الأدراج دون تصادم.","ref":"ص 3"},{"q":"كيف تُصنَّف الأدوات حسب الاستخدام؟","options":["الكل في مكان واحد","النادرة في الأمام","حسب اللون","كثيرة الاستخدام في النطاق القريب، نادرة الاستخدام في الأماكن الخلفية أو العلوية"],"answer":3,"why":"مثل أواني الطهي اليومية مقابل الأدوات الموسمية.","ref":"ص 4"},{"q":"ما فائدة التنظيم الرأسي للأدراج؟","options":["ترتيب القطع متجاورة بدل تكديسها فيسهل السحب دون بعثرة","تكديس القطع فوق بعضها","إخفاء المحتويات","زيادة الامتلاء"],"answer":0,"why":"ويسهل إعادة كل غرض إلى مكانه.","ref":"ص 4-5"},{"q":"ما فائدة الملصقات التعريفية والمنظمات الداخلية للأبناء؟","options":["زينة فقط","تمكّنهم من إعادة الأغراض لمكانها وتنمّي مهارات المسؤولية والنظام","منع الأبناء من الاستخدام","لا فائدة لها"],"answer":1,"why":"وتساعد على تقسيم المساحات الكبيرة.","ref":"ص 5"},{"q":"ما خطوات مراجعة الخزائن المقترحة؟","options":["شراء المزيد","تركها كما هي","جرد المحتويات وفرزها إلى مستخدم وتالف وغير مستخدم ثم التخلص من التالف","إغلاقها"],"answer":2,"why":"مع إعادة توزيع الرفوف أو إضافة وحدات تخزين ذكية.","ref":"ص 5"}],"3":[{"q":"ما الآية التي استُشهد بها على أن البيت موضع السكن والطمأنينة؟","options":["﴿وقرن في بيوتكن﴾","﴿فلا تدخلوا بيوتاً﴾","﴿وليطوفوا بالبيت﴾","﴿والله جعل لكم من بيوتكم سكناً﴾"],"answer":3,"why":"سورة النحل: 80.","ref":"ص 2"},{"q":"أي مما يلي من أبعاد الراحة المنزلية؟","options":["المالية فقط","البصرية والسمعية والشمية والحسية والنفسية","العقارية","السياسية"],"answer":1,"why":"والراحة النفسية هي المحصلة النهائية لتكامل هذه العناصر.","ref":"ص 3"},{"q":"بمَ تتحقق الراحة السمعية؟","options":["بتقليل الضوضاء","بزيادة الأجهزة","برفع الصوت","بالإضاءة"],"answer":0,"why":"فارتفاع الضوضاء الناتجة عن الأجهزة الإلكترونية يؤدي إلى توتر المزاج وضعف التركيز.","ref":"ص 3"},{"q":"ما الدليل الذي ذكره الدرس على أن ضيق المساحة لا يعني عدم الراحة؟","options":["اتساع بيوت الأغنياء","كثرة الأثاث","حجرات النبي ﷺ كانت ضيقة لكنها أعظم البيوت سكينة وبساطة","قلة الغرف"],"answer":2,"why":"فعدم الارتياح لا يرتبط بضيق المساحة، والبيت الفسيح بلا نظام وهدوء يصبح طارداً.","ref":"ص 3"},{"q":"ما الذي تفيده العناية بالمدخل؟","options":["ضبط الفوضى الحسية وتؤثر في نفسية الزوج والأولاد فور دخولهم","إخفاء الغرف","تقليل الإضاءة","لا شيء"],"answer":0,"why":"فهو المنظر الأول الذي تقع عليه العين.","ref":"ص 3"},{"q":"أي الألوان يُنصح بها في تأثيث المسكن؟","options":["الأحمر لجدران الغرفة كاملة","الفاتحة والمحايدة والباردة لأثرها في تهدئة البال","الألوان الداكنة جداً","الألوان الصارخة"],"answer":1,"why":"أما الألوان الدافئة (الأحمر والبرتقالي والأصفر) فتناسب القطع الصغيرة لا اللون الرئيس.","ref":"ص 4"},{"q":"ما درجة حرارة اللون المناسبة لإضاءة الاسترخاء؟","options":["4000 كلفن فأكثر","6500 كلفن","2700–3000 كلفن","10000 كلفن"],"answer":2,"why":"إضاءة دافئة تحفّز الميلاتونين وتناسب غرف النوم ومجالس العائلة.","ref":"ص 4"},{"q":"لأي الأماكن تُخصَّص الإضاءة الباردة البيضاء (فوق 4000 كلفن)؟","options":["غرف النوم","المجالس","الممرات فقط","المطابخ ومكاتب المذاكرة وأماكن العمل"],"answer":3,"why":"لأنها تحفز الكورتيزول الذي يرفع التركيز واليقظة.","ref":"ص 5"},{"q":"ما فائدة أنظمة التحكم (Dimmers)؟","options":["زيادة الكهرباء","إطفاء كامل","تغيير اللون فقط","ضبط السطوع حسب الحاجة وتقليل التحفيز البصري وقت الراحة"],"answer":3,"why":"ومن الإجراءات الأخرى الإضاءة المخفية وإضافة النباتات الخضراء.","ref":"ص 5"},{"q":"لماذا ترتبط الروائح بالذكريات؟","options":["لقوة الذاكرة الشمية وارتباطها بالمشاعر","لأنها غير مهمة","لقلة تأثيرها","لأنها مؤقتة"],"answer":0,"why":"ولذلك تحرص المرأة المسلمة على الروائح الطيبة وتجنب روائح القمامة والرطوبة.","ref":"ص 5-6"}],"4":[{"q":"بماذا وصف الدرس الأناقة في حياة المرأة المسلمة؟","options":["أمر مذموم","ترف لا حاجة إليه","خاصة بالأغنياء","فطرة أودعها الخالق ومطلب شرعي"],"answer":3,"why":"﴿أومن ينشأ في الحلية﴾ و«إن الله جميل يحب الجمال».","ref":"ص 2"},{"q":"على أي مبدأ تقوم الأناقة الواعية؟","options":["التكلف والمبالغة","التقليد","القصد والاعتدال","الإهمال التام"],"answer":2,"why":"فلا تهمل المرأة مظهرها فتنفّر، ولا تنشغل به على حساب واجباتها الكبرى.","ref":"ص 2-3"},{"q":"ما الحديث الذي يدل على حب الله أن يرى أثر نعمته على عبده؟","options":["«إن الله يحب أن يرى أثر نعمته على عبده»","«إنما الأعمال بالنيات»","«البذاذة من الإيمان»","«الطهور شطر الإيمان»"],"answer":0,"why":"أخرجه الترمذي، وفيه حث على النظافة وتحسين الهيئة.","ref":"ص 3"},{"q":"ما «التكلف المذموم» في اللباس؟","options":["اللباس النظيف","اللباس الساتر","لباس الاعتدال","اللباس الذي يُقصد به لفت الأنظار والتفاخر أو إظهار الزهد المصطنع"],"answer":3,"why":"لقوله ﷺ: «من لبس ثوب شهرة في الدنيا ألبسه الله ثوب مذلة».","ref":"ص 3"},{"q":"متى يُعدّ الهوس بالتجمل إسرافاً قد يصل إلى التحريم؟","options":["إذا كان قليلاً","إذا لبست الجديد","لا يكون إسرافاً أبداً","إذا ترتب عليه تضييع الحقوق المالية أو الإخلال بالواجبات"],"answer":3,"why":"فالأناقة ليست بكثرة الملابس بل بحسن الانتقاء والاعتدال.","ref":"ص 3"},{"q":"أي مما يلي من ضوابط لباس الخروج؟","options":["أن يكون ضيقاً","استيعاب جميع البدن، وألا يكون زينة في نفسه","أن يكون شفافاً","أن يكون مزخرفاً"],"answer":1,"why":"ومنها أن يكون صفيقاً ثخيناً لا يشف، فضفاضاً واسعاً.","ref":"ص 4"},{"q":"لماذا قال عمر: «إن لم يكن يشف فإنه يصف»؟","options":["لأن القماش الرقيق يصف حجم الجسم وإن لم يشف","لأنه يحب القماش","لتحريم القباطي","لا علاقة له بالحكم"],"answer":0,"why":"وفي حديث أسامة: «مرها فلتجعل تحتها غلالة فإني أخاف أن تصف حجم عظامها».","ref":"ص 4"},{"q":"ماذا قال النبي ﷺ عن المرأة التي تستعطر فتمر على قوم ليجدوا ريحها؟","options":["«فهي زانية»","«فهي مأجورة»","«فهي معذورة»","«فهي متبرجة فقط»"],"answer":0,"why":"أخرجه النسائي، ولذلك اشترط ألا يكون اللباس مطيباً مبخراً يجذب الانتباه.","ref":"ص 4"},{"q":"أي الضوابط التالية يحرم على المرأة مطلقاً داخل البيت وخارجه؟","options":["لون اللباس","نوع القماش","ألا يشبه لباس الرجال أو الكافرات، وألا يكون لباس شهرة","طول الثوب"],"answer":2,"why":"قال الدرس: الشروط الثلاثة الأخيرة تحرم على المرأة مطلقاً سواء داخل البيت أو خارجه.","ref":"ص 5"},{"q":"ما دليل النهي عن التشبه بالرجال؟","options":["﴿إنما المؤمنون إخوة﴾","«لعن رسول الله ﷺ الرجل يلبس لبسة المرأة والمرأة تلبس لبسة الرجل»","«الدين النصيحة»","«لا ضرر ولا ضرار»"],"answer":1,"why":"رواه أحمد من حديث أبي هريرة، وفيه الدليل على الشرط السابع.","ref":"ص 5"}],"5":[{"q":"ما أقسام أعمال النظافة من حيث التكرار والجهد؟","options":["نظافة يومية فقط","نظافة سطحية ونظافة عميقة","نظافة خارجية وداخلية","نظافة المطبخ فقط"],"answer":1,"why":"السطحية يومية بسيطة، والعميقة دورية تتطلب وقتاً وجهداً أكبر.","ref":"ص 2-3"},{"q":"أي مما يلي من أعمال النظافة العميقة؟","options":["كنس الأرضيات","إزالة الغبار السطحي","غسل السجاد وتنظيف الستائر والجدران والأسقف","ترتيب الأغراض"],"answer":2,"why":"وتُخطط أسبوعياً أو موسمياً وفق الحاجة لمنع الإرهاق.","ref":"ص 3"},{"q":"أي مكان في البيت هو الأكثر حاجة إلى تنظيف يومي ومستمر؟","options":["غرفة الضيوف","السطح","المخزن","المطبخ"],"answer":3,"why":"لا سيما أسطح العمل والأحواض، لتراكم الدهون ونمو البكتيريا المرتبطة بإعداد الطعام.","ref":"ص 3"},{"q":"ما أول الأولويات في ترتيب النظافة بحسب معايير الوقاية؟","options":["مكافحة الغبار","غسل الستائر","تلميع الأثاث","ترتيب الخزائن"],"answer":0,"why":"لاحتوائه على جراثيم وملوثات دقيقة تؤثر في الجهاز التنفسي والعينين خاصة الأطفال وكبار السن.","ref":"ص 3"},{"q":"لماذا تُعدّ التهوية المنتظمة أولوية؟","options":["لتبريد البيت فقط","لتقليل الأصوات","لتجديد الهواء والتخلص من الرطوبة التي تشجع نمو البكتيريا","لتوفير الكهرباء"],"answer":2,"why":"خصوصاً في المطبخ والحمام.","ref":"ص 3"},{"q":"ما نقاط التلامس المتكرر التي ينبغي تطهيرها؟","options":["السقف","مقابض الأبواب ومفاتيح الإضاءة وأجهزة التحكم عن بعد وألعاب الأطفال","الجدران الخارجية","الأرضيات فقط"],"answer":1,"why":"لأنها مسار سريع لانتقال العدوى الفيروسية.","ref":"ص 3-4"},{"q":"ما الفرق بين التنظيف والتعقيم والتطهير؟","options":["كلها بمعنى واحد","التنظيف إزالة الأوساخ، والتعقيم تقليل الكائنات الدقيقة، والتطهير القضاء على البكتيريا المسببة للأمراض","التنظيف أعمق من التطهير","التطهير للأرضيات فقط"],"answer":1,"why":"والتنظيف شرط سابق لا غنى عنه للتعقيم والتطهير.","ref":"ص 4"},{"q":"متى يُلجأ إلى التطهير؟","options":["في كل مكان يومياً","لا يُلجأ إليه أبداً","في الأماكن عالية الخطورة كأسطح إعداد الطعام والأدوات الصحية","في غرف النوم فقط"],"answer":2,"why":"ولا يُنتظر الموعد المعتاد إن مرض الطفل بل تُنظَّف ألعابه فوراً.","ref":"ص 4"},{"q":"ما خطر الإفراط في استخدام المنظفات الكيميائية والمعطرات الصناعية؟","options":["تهيج الجهاز التنفسي وأعراض حساسية وزيادة العبء الكيميائي في هواء البيت","لا خطر فيها","تحسين الصحة","توفير المال"],"answer":0,"why":"ويحذّر الدرس من خلط المواد الكيميائية كالمبيضات مع الأحماض لإنتاج أبخرة سامة.","ref":"ص 5"},{"q":"أي مما يلي من البدائل الطبيعية المذكورة للتنظيف؟","options":["البنزين","الكلور المركز","المبيضات والأحماض معاً","محلول الخل والماء، وصودا الخبز، والليمون والملح"],"answer":3,"why":"فالخل والماء معقم طبيعي، والصودا لإزالة الروائح، والليمون والملح لإزالة البقع.","ref":"ص 5"}],"6":[{"q":"ما الحديث الذي يربط قيمة العمل بنية صاحبه؟","options":["«الدين النصيحة»","«لا ضرر ولا ضرار»","«من حسن إسلام المرء»","«إنما الأعمال بالنيات وإنما لكل امرئ ما نوى»"],"answer":3,"why":"رواه البخاري، وبه يكتسب قيام المرأة بمسؤولياتها في بيتها قيمة خاصة.","ref":"ص 2"},{"q":"كيف يتحول العمل المنزلي المعتاد إلى عبادة؟","options":["بتكراره","بكثرته","بإتقانه فقط","بالنية الصالحة والاحتساب للأجر"],"answer":3,"why":"كما في قول معاذ رضي الله عنه: «فأحتسب نومتي كما أحتسب قومتي».","ref":"ص 3"},{"q":"أي مما يلي من النيات التي تستحضرها المرأة في المطبخ؟","options":["التفاخر بالموائد","التنافس مع الجارات","القيام بمسؤولية الأسرة وإعانتهم على الطاعة وإطعام الطعام وإدخال السرور وحفظ المال","تقليد الآخرين"],"answer":2,"why":"فيتحول العمل اليومي إلى باب من أبواب الاحتساب.","ref":"ص 3"},{"q":"ما عناصر البناء والطاقة في الغذاء؟","options":["الفيتامينات والمعادن","الماء فقط","البروتينات والكربوهيدرات والدهون","الألياف فقط"],"answer":2,"why":"البروتين لنمو الأنسجة، والكربوهيدرات والدهون وقود الطاقة.","ref":"ص 3"},{"q":"ما عناصر الوقاية وتنظيم وظائف الجسم؟","options":["الدهون المشبعة","الفيتامينات والمعادن والماء","السكر المضاف","الملح"],"answer":1,"why":"وتدعم صحة الجسم وتقيه من الأمراض.","ref":"ص 3"},{"q":"ما نموذج الطبق الصحي كما ذكره الدرس؟","options":["الخضروات والفواكه نصف الطبق، والنصف الآخر حبوب كاملة وبروتينات","اللحوم نصف الطبق","الحلويات ثلث الطبق","النشويات كامل الطبق"],"answer":0,"why":"مع مراعاة حصة الألبان لضمان شمولية العناصر.","ref":"ص 4"},{"q":"ما المكونات الضارة التي تكثر في الوجبات غير الصحية؟","options":["الخضروات","السكر المضاف والملح الزائد والدهون المشبعة والمتحولة والأطعمة فائقة المعالجة","الألياف","الماء"],"answer":1,"why":"ويؤدي الإكثار منها إلى السمنة واضطرابات التمثيل الغذائي وأمراض القلب.","ref":"ص 4"},{"q":"ما بدائل القلي والتحمير الصحية؟","options":["السلق أو الشوي أو الطهي بالبخار أو في الفرن","القلي العميق","استخدام مزيد من الزيت","الشواء المحروق"],"answer":0,"why":"لتقليل الدهون الضارة وتحسين الهضم.","ref":"ص 4"},{"q":"بماذا يُنصح لتقليل الملح والسكر في الوصفات؟","options":["الأعشاب كالكمون والثوم والليمون، والتمر أو الموز المهروس بدل السكر","زيادة الملح","زيادة السكر","إضافة المنكهات الصناعية"],"answer":0,"why":"مع استبدال الدقيق الأبيض بالدقيق الكامل لزيادة الألياف.","ref":"ص 4"},{"q":"ما فائدة تخطيط قائمة الطعام الأسبوعية؟","options":["زيادة التكاليف","تكرار الأصناف","تعقيد العمل","التوازن الغذائي والانضباط المالي وتخفيف العبء الذهني عن ربة المنزل"],"answer":3,"why":"مع التنويع بين المصادر الحيوانية والنباتية وعدم تكرار الصنف أياماً متتالية.","ref":"ص 5"}],"7":[{"q":"كيف عرّف الدرس الضيافة في المنظور الإسلامي؟","options":["حق الضيف وإكرامه، وقد قرنها الشرع بالإيمان","ترف اجتماعي","مباهاة بالمظاهر","عادة اختيارية بلا أجر"],"answer":0,"why":"فهي قيمة أخلاقية وشعيرة تعبدية يتقرب بها المسلم إلى ربه.","ref":"ص 2-3"},{"q":"ما الحديث الذي ربط إكرام الضيف بالإيمان؟","options":["«إنما الأعمال بالنيات»","«الدين المعاملة»","«المسلم من سلم المسلمون»","«من كان يؤمن بالله واليوم الآخر فليكرم ضيفه»"],"answer":3,"why":"أخرجه البخاري، وهو يرفع منزلة الضيافة لتصبح تكليفاً شرعياً يُثاب عليه.","ref":"ص 3"},{"q":"ما أول آداب الضيافة التي ذكرها الدرس؟","options":["الصمت","تأخير الاستقبال","تجاهل الضيف","حفاوة الاستقبال بابتسامة وترحاب وطلاقة وجه ولين قول"],"answer":3,"why":"مع العناية بجميل الثياب لأثره في تأليف القلوب.","ref":"ص 3"},{"q":"ما حكم التكلف في الضيافة؟","options":["محمود","واجب","مذموم؛ ينبغي تقديم المتاح دون مشقة أو مبالغة","لا حرج في المبالغة"],"answer":2,"why":"لأن التكلف يمنع دوام الضيافة ويثقل كاهل المضيف.","ref":"ص 3"},{"q":"أي مما يلي من آثار الضيافة؟","options":["الفرقة","تقوية المودة وإحياء صلة الرحم وعمارة البيوت بالخير","قطع الأرحام","الإسراف"],"answer":1,"why":"فالبيت الذي تقصده الضيوف بيت مبارك معمور بالبذل والإيثار.","ref":"ص 4"},{"q":"على ماذا يُبنى تنسيق المكان والمائدة عند التخطيط للزيارة؟","options":["رغبة المضيفة فقط","نوع الزيارة (عائلية أو رسمية أو مناسبة) ومدة المكث ووجود الأطفال","أغلى الأصناف","عدد الأواني"],"answer":1,"why":"مع إعداد قائمة بالمدعوين حسب الفئة العمرية لتقدير الكميات بدقة.","ref":"ص 4"},{"q":"ما «استراتيجية التصور المسبق»؟","options":["إجراء سيناريو ذهني لمسار الزيارة (أماكن الجلوس وتسلسل التقديم)","ارتجال الضيافة","الاعتذار عن الزيارة","شراء كل شيء"],"answer":0,"why":"لضمان توفير سبل الراحة وتفادي المفاجآت.","ref":"ص 4"},{"q":"ما فائدة التحضير المسبق كنقع الدجاج وإعداد الصلصات قبل الوليمة بيوم؟","options":["زيادة التعب","تخفيف العبء يوم الزيارة والتفرغ للمؤانسة","فساد الطعام","لا فائدة"],"answer":1,"why":"مع قوائم مهام منظمة للأصناف والمشتريات والأواني.","ref":"ص 5"},{"q":"لماذا لا تُجرَّب وصفات جديدة يوم الوليمة؟","options":["تفادياً للمفاجآت غير المحمودة التي قد تُربك المضيفة","لتوفير المال","لأن الضيوف يرفضونها","لضيق الوقت فقط"],"answer":0,"why":"بل تعتمد على الأصناف التي تتقنها وتضمن جودتها.","ref":"ص 6"},{"q":"بأي آية استُشهد على النهي عن الإسراف في الضيافة؟","options":["﴿إنما المؤمنون إخوة﴾","﴿وأقيموا الصلاة﴾","﴿وكلوا واشربوا ولا تسرفوا إنه لا يحب المسرفين﴾","﴿ولا تقربوا الزنا﴾"],"answer":2,"why":"سورة الأعراف: 31. وفي الحديث: «شر الطعام طعام الوليمة يُدعى لها الأغنياء ويُترك الفقراء».","ref":"ص 6"}],"8":[{"q":"على من تبقى مسؤولية النفقة والقيام المالي بحسب الدرس؟","options":["على المرأة وحدها","على الزوج، وتتكامل معه المرأة بحسن التدبير","على الأبناء","لا على أحد"],"answer":1,"why":"فتتكامل قوامته وحسن تدبيرها في تحقيق الاستقرار المالي للأسرة.","ref":"ص 2"},{"q":"ما الآية الواردة في مقدمة الدرس في الاقتصاد والاعتدال؟","options":["﴿وأقيموا الصلاة﴾","﴿ولا تجعل يدك مغلولة إلى عنقك ولا تبسطها كل البسط﴾","﴿ولا تقتلوا أنفسكم﴾","﴿إنما المؤمنون إخوة﴾"],"answer":1,"why":"سورة الإسراء: 29، أمر بالقصد والاعتدال ونهي عن التبذير والإسراف.","ref":"ص 2"},{"q":"على أي أساس تُبنى الميزانية المنزلية؟","options":["على الإيرادات المتوقعة لا العكس","على المصروفات المرغوبة","على الديون","على آراء الجيران"],"answer":0,"why":"اتقاءً لآفات العشوائية وضياع الحقوق.","ref":"ص 3"},{"q":"ما مراتب الأولويات الثلاث؟","options":["الضروريات ثم الحاجيات ثم الكماليات","الكماليات ثم الحاجيات ثم الضروريات","الحاجيات ثم الكماليات","لا ترتيب بينها"],"answer":0,"why":"الضروريات كالسكن والمأكل واللباس الأساسي والرعاية الصحية والفواتير الخدمية.","ref":"ص 3"},{"q":"أي مما يلي من «الحاجيات»؟","options":["الأثاث المنزلي الجيد والوسائل المعينة على تسيير شؤون البيت","الطعام الأساسي","الدواء","الماء والكهرباء"],"answer":0,"why":"وهي ما يرفع المشقة ويمكن الاستغناء عنه مع عناء يسير.","ref":"ص 3"},{"q":"ما أمثلة «الكماليات»؟","options":["السكن الملائم","الأدوية","الطعام","إقامة الولائم للأهل واقتناء الأجهزة التكميلية ونفقات تجميل المسكن"],"answer":3,"why":"وهي ما يقصد به الترويح والتوسعة.","ref":"ص 3"},{"q":"ما تبعات إهمال تقسيم الأولويات؟","options":["الاستقرار","السكينة","زيادة الدخل","النزاعات بين الزوجين والوقوع في الديون"],"answer":3,"why":"وقد تؤول الديون إلى المساءلة القانونية أو ضيق الحال.","ref":"ص 3"},{"q":"ماذا يُفعل عند تجاوز المصروفات للدخل؟","options":["الاستدانة","إهمال الضروريات","التقشف الفوري في بنود التحسينات وتقسيم الإيراد إلى حصص وظيفية","زيادة الكماليات"],"answer":2,"why":"كحصة للمعيشة وأخرى للمصروفات الشخصية وأخرى للادخار مع الالتزام بحدود كل نفقة.","ref":"ص 4"},{"q":"ما الحديث الذي استُشهد به على الادخار وتأمين مستقبل الذرية؟","options":["«ابن آدم ما ملأ وعاء شراً من بطنه»","«الدين النصيحة»","«إنك أن تذر ورثتك أغنياء خير من أن تذرهم عالة يتكففون الناس»","«المسلم أخو المسلم»"],"answer":2,"why":"أخرجه البخاري، وبه يكون الادخار وسيلة مشروعة لمواجهة الأزمات.","ref":"ص 5"},{"q":"كيف تُوزَّع الدخل وفق قاعدة 70-20-10 المقترحة في الدرس؟","options":["50% ادخار و50% معيشة","10% صدقة، 10% طوارئ، 10% أهداف بعيدة، 70% للمعيشة","90% كماليات","كل الدخل للاستهلاك"],"answer":1,"why":"وعند وجود فائض يُوجَّه للاستثمار في القنوات المشروعة كالمضاربة والمشاركة.","ref":"ص 6"}],"9":[{"q":"هل ترتبط الحاجة إلى الميزانية دائماً بقلة الدخل؟","options":["نعم دائماً","لا، فقد يكون الدخل جيداً ومع ذلك تعاني الأسرة ضيقاً لعدم معرفة أين يذهب المال","فقط عند الفقر","فقط عند الديون"],"answer":1,"why":"المشكلة غالباً في عدم معرفة أين يذهب المال وكيف يوجَّه، والميزانية ليست حرماناً بل وسيلة لحسن إدارته.","ref":"ص 2"},{"q":"على من تقع مسؤولية إدارة المال في الأسرة؟","options":["على الزوجة وحدها","على الأولاد وحدهم","مسؤولية مشتركة، والنفقة على الزوج أصالة وللزوجة دور في التدبير وللأولاد المحافظة على النعمة","لا أحد"],"answer":2,"why":"كلٌّ بحسب موقعه.","ref":"ص 2"},{"q":"ما الفرق بين الدخل الثابت والمتغير؟","options":["الثابت يتكرر بانتظام كالراتب، والمتغير كالمكافأة والعمل الإضافي","لا فرق","الثابت غير منتظم","المتغير هو الراتب"],"answer":0,"why":"ولذلك لا تبني الأسرة التزامات ثابتة على دخل غير مضمون.","ref":"ص 3"},{"q":"أي مما يلي من الموارد غير المالية للأسرة؟","options":["الراتب","الوقت والجهد والمهارات والعلاقات والمعرفة","الإيجارات","العوائد الاستثمارية"],"answer":1,"why":"وهي تساعد الأسرة على تقليل نفقاتها، كأم تجيد الطبخ فتعد الطعام في البيت بدل شرائه.","ref":"ص 3"},{"q":"ما الموازنة؟","options":["تسجيل المصروفات بعد انتهائها فقط","الاستدانة","خطة مسبقة لتوزيع الدخل على النفقات خلال فترة محددة","الادخار فقط"],"answer":2,"why":"فتبدأ الأسرة الشهر وهي تعرف كيف توجّه الراتب بدل أن تتساءل في آخره أين ذهب.","ref":"ص 4"},{"q":"أي مما يلي من النفقات الأساسية؟","options":["المطاعم","الترفيه","التسوق غير الضروري","السكن والطعام والكهرباء والماء والمواصلات والتعليم والعلاج"],"answer":3,"why":"أما الثانوية فيمكن تقليلها عند الحاجة كالمطاعم والترفيه والكماليات.","ref":"ص 4"},{"q":"متى يُخطَّط للادخار بحسب الدرس؟","options":["من بداية الشهر بتخصيص مبلغ محدد","من آخر الشهر إن تبقى شيء","لا يُخطَّط له","في العام القادم"],"answer":0,"why":"لأنه قد لا يتبقى شيء إذا استُهلك الدخل كله.","ref":"ص 5"},{"q":"لماذا نخصص مبلغاً للطوارئ؟","options":["للتسوق","للهدايا","لمواجهة الظروف المفاجئة دون اللجوء إلى الديون عند كل طارئ","للترفيه"],"answer":2,"why":"كتعطل السيارة أو إصلاح جهاز أو ظرف صحي.","ref":"ص 5"},{"q":"ما الفرق بين الميزانية والموازنة؟","options":["هما شيء واحد","الميزانية للخطة والموازنة للواقع","لا علاقة بينهما","الميزانية الصورة المالية الفعلية، والموازنة الخطة المستقبلية"],"answer":3,"why":"الموازنة تحدد ما سنفعله بأموالنا، والميزانية توضح ما فعلناه بها.","ref":"ص 5"},{"q":"ما معنى «الواقعية» كسمة للميزانية الناجحة؟","options":["أن تكون أرقامها جميلة","أن تعكس واقع الأسرة الفعلي لا خطة مثالية بعيدة عن نمط حياتها","أن تقلل كل النفقات للنصف","أن تتجاهل الواقع"],"answer":1,"why":"فلا معنى لتضع 50 ديناراً للطعام وهي تنفق عادة 150.","ref":"ص 5"}],"10":[{"q":"ما أعظم الآفات الاقتصادية التي تمحق بركة الرزق بحسب الدرس؟","options":["الإسراف والتبذير","الادخار","التخطيط","القناعة"],"answer":0,"why":"فهما تجاوز لحد الاعتدال الذي أمر به الشارع.","ref":"ص 2"},{"q":"أي مما يلي من مظاهر الإسراف في المطاعم والولائم؟","options":["تقدير الكميات بدقة","توزيع الفائض على المحتاجين","طهي الكمية اللازمة","إعداد كميات تفوق الحاجة ورمي الفائض"],"answer":3,"why":"ويحصل ذلك في المناسبات التي يُهدر فيها الكثير مما يمكن حفظه أو إيصاله إلى المحتاجين.","ref":"ص 3"},{"q":"ما مظهر الإسراف في الملبس والزينة؟","options":["شراء الضروري","التنافس على المقتنيات الباهظة بدافع التفاخر وتكديس الملابس دون حاجة","ارتداء الملابس عدة مرات","الاعتدال في الشراء"],"answer":1,"why":"وقد يُدفع في لباس واحد ما يعادل دخل أسرة لشهر كامل.","ref":"ص 3"},{"q":"ما حكم المبذرين في الآية المذكورة؟","options":["﴿إن المبذرين كانوا إخوان الشياطين﴾","﴿فأولئك هم المفلحون﴾","﴿هم المؤمنون حقاً﴾","﴿لهم الجنة﴾"],"answer":0,"why":"سورة الإسراء: 27، لما فيه من كفران للنعمة.","ref":"ص 3"},{"q":"ما هدي النبي ﷺ لحفظ النعمة حتى في أدق صورها؟","options":["«اتركوا ما سقط»","«فإذا سقطت من أحدكم اللقمة فليمط ما كان بها من أذى ثم ليأكلها»","«ارموا اللقمة»","«لا بأس بتركها»"],"answer":1,"why":"رواه مسلم، وهو يفيد أن الإسراف ينافي شكر النعمة.","ref":"ص 3"},{"q":"ما علاج الإسراف المقترح؟","options":["شراء المزيد","الاستدانة","عقلية التوفير وإعادة تدوير الفوائض النظيفة والتسوق بقائمة مشتريات محددة","إهمال الميزانية"],"answer":2,"why":"وذلك صيانةً للنعمة من الزوال.","ref":"ص 3"},{"q":"بماذا كان النبي ﷺ يستعيذ في شأن الدين؟","options":["«الفقر فقط»","«المرض فقط»","«الجوع»","«وضلع الدين وغلبة الرجال»"],"answer":3,"why":"رواه البخاري، والدين يضغط على صاحبه سلوكياً فقد يدفعه للكذب وإخلاف الوعد.","ref":"ص 4"},{"q":"ما الشراء العاطفي أو الاندفاعي؟","options":["شراء تحركه مشاعر عابرة أو مؤثرات تسويقية أكثر من الحاجة الفعلية","شراء الضروريات","الشراء بعد التخطيط","الشراء بالجملة"],"answer":0,"why":"وجوهره شراء ما نريده ولا نحتاجه، وقد يتحول عند بعضهم إلى سلوك قهري.","ref":"ص 4"},{"q":"ماذا قال عمر لجابر رضي الله عنهما حين اشتهى لحماً فاشتراه؟","options":["«بارك الله لك»","«أوَكلما اشتهيتَ شيئاً اشتريتَه؟»","«اشتر المزيد»","«هذا حقك»"],"answer":1,"why":"تأكيداً على ضرورة زمّ الرغبات الانفعالية.","ref":"ص 4"},{"q":"أي مما يلي من قواعد التسوق الذكي؟","options":["التسوق للتسلية","شراء ما يعلن عنه المشاهير","ألا ترتاد الأسواق إلا بقائمة حاجات معدة سلفاً وتسأل: هل سأستفيد منه؟ وأين سأضعه؟","الشراء دون سؤال"],"answer":2,"why":"وتجنب اتخاذ التسوق وسيلة للتسلية أو المحاكاة.","ref":"ص 5"}],"11":[{"q":"ما الغاية التي تريدها المادة من المذاكرة والتحصيل الدراسي؟","options":["نشر الأسماء في سجل الفائزين","جمع الشهادات فحسب","التنافس على الدرجات","أن تكون وسيلة إلى مرضاة الله وإصلاح الفرد والمجتمع ومضماراً للغنائم الدينية لا الدنيوية فقط"],"answer":3,"why":"وأن تكون أحد أسباب التمكين للإسلام وللأسر المسلمة.","ref":"ص 3"},{"q":"ما الذي نزل أولاً من الوحي بحسب الدرس مما يدل على مكانة العلم؟","options":["سورة الفاتحة","آية الكرسي","خمس آيات من سورة العلق: ﴿اقرأ باسم ربك الذي خلق﴾","سورة البقرة"],"answer":2,"why":"فالعلم والتعلم أصل من أصول الدين.","ref":"ص 3"},{"q":"على ماذا وقع الخلاف بين المسلمين في العلم والتعلم؟","options":["على أصل وجوب العلم","على حرمة العلم","على إلغاء العلم","على أسلوب تطبيق الأمر الرباني بين التهويل والتهوين"],"answer":3,"why":"فريق يهوّل من المنظومة التعليمية وفريق يهوّن من قدر التعليم المنهجي بدعوى أن السلف لم تكن لديهم هيئات دراسية.","ref":"ص 3"},{"q":"كيف يُنظر إلى التعليم في المنظور الإسلامي؟","options":["وسيلة نميّز ما يصلح منها للمسلم وما لا يتوافق مع مقاصده بعيداً عن التغريب","غاية في ذاتها","شرٌّ مطلق","أمر لا علاقة له بالدين"],"answer":0,"why":"فأصل فكرة التعليم غير الأطر الغربية المحيطة بالمنظومة المعاصرة.","ref":"ص 3-4"},{"q":"ما دليل أن التعليم المنظم ليس غريباً عن التاريخ الإسلامي؟","options":["غيابه تماماً","وجود الكتاتيب وحلقات العلم والإجازات العلمية وجوائز المتفوقين منذ الخلافة الراشدة","اقتصاره على أوروبا","ظهوره حديثاً فقط"],"answer":1,"why":"وكانت الإجازات العلمية تشبه الشهادات في زماننا.","ref":"ص 4"},{"q":"ماذا كان ابن عباس رضي الله عنهما يفعل لتعليم صغار التابعين؟","options":["كان يمنعهم","كان يغلق المسجد","كان يجمعهم وفتيانهم لتعليمهم إلى جانب حلقات المساجد","لم يعلّم أحداً"],"answer":2,"why":"فاجتماع الطلاب للتنافس في طلب العلم له أصل في التاريخ الإسلامي.","ref":"ص 4"},{"q":"لماذا انحطت قيمة التعليم النظامي في العصر الحديث بحسب الدرس؟","options":["لكثرة العلماء","لغربة الدين عن جوانب الحياة وتغير التعامل مع الشهادات حتى تُمنح لمن يغش أو يرشو","لقلة المدارس","لتطور المناهج"],"answer":1,"why":"ولو وُجد في ظل خلافة راشدة ونظم إدارية إسلامية حازمة لخرّج المخرجات المطلوبة.","ref":"ص 4"},{"q":"كيف كانت المراحل التعليمية في الأندلس؟","options":["مرحلة الصبا ثم ما بعدها مع بدء تعليم الحساب والعربية والقرآن ثم التخصص","بلا مراحل","التخصص منذ الولادة","تعليم القرآن فقط"],"answer":0,"why":"وقد أسهم هذا التخصص في ظهور علماء مسلمين في الرياضيات والكيمياء وغيرها.","ref":"ص 4"},{"q":"كم محاضرة ستتناول الأسئلة التعليمية بالتفصيل وفق المقدمة؟","options":["محاضرتان","خمس محاضرات","عشر محاضرات","واحدة"],"answer":1,"why":"تبدأ بتعاريف عامة وأنواع التعليم (النظامي والمنزلي والموازي) ثم موضوعات التعليم المنزلي وصعوبات التعلم وتنظيم العملية التعليمية وإدارة التعلم من منظور شرعي وفحص البيئات التعليمية.","ref":"ص 3"},{"q":"ما أبرز الأسئلة التي تجيب عنها المادة؟","options":["كيف نبني القصور؟","كيف نوفر المال؟","هل التعليم في الصغر من توجيهات الشريعة؟ وهل التعليم النظامي من أركان الحضارة الإسلامية؟ وكيف نتعامل مع صعوبات التعلم؟","كيف نتجنب المدرسة؟"],"answer":2,"why":"وتسعى إلى خطة وأدوات تعليمية للأولاد منذ الأشهر الأولى من أعمارهم.","ref":"ص 2"}],"12":[{"q":"ما من مظاهر الضرر الناتج عن تحول المذاكرة إلى معركة محمومة في البيوت؟","options":["زيادة المودة","قطيعة الأرحام والشقاق بين الأزواج وإهمال الصلاة وحفظ القرآن وإفساد العلاقة بين الآباء والأبناء","تحسن الصحة","استقرار البيوت"],"answer":1,"why":"وكل ذلك بذريعة الخوف على الأولاد والحرص على مستقبلهم.","ref":"ص 2"},{"q":"ما المستقبل الحقيقي للأولاد بحسب الدرس؟","options":["الآخرة، والجنة هي الغاية الكبرى","الوظيفة المرموقة","الثراء","الشهرة"],"answer":0,"why":"ومن يتبع السبل المتفرقة يبتعد عن سبيل الله، وهذا هدف عدونا الأول إبليس.","ref":"ص 2"},{"q":"إلى أي أمرين يُرد قلق أولياء الأمور على مستقبل أولادهم؟","options":["السفر والسكن","المال (مصدر الدخل) والزواج","الصحة والعلاقات","السلطة والشهرة"],"answer":1,"why":"فيربط الأب الدخل بالمهنة والمهنة بالشهادات ولا سيما الثانوية العامة.","ref":"ص 3"},{"q":"ما الذي يُنتقد في التعامل مع الشهادات التعليمية؟","options":["تقديسها والمبالغة في تحصيلها حتى يستهلك الأهل أنفسهم وأولادهم ويهدروا النعم","وجودها أصلاً","الاعتراف بأهميتها","استخدامها في التوظيف"],"answer":0,"why":"والدرس لا يقلل من أهمية الشهادات.","ref":"ص 3"},{"q":"بأي آية استُشهد على أن الرزق مضمون من الله فلا قلق عليه؟","options":["﴿وما خلقت الجن والإنس إلا ليعبدون﴾","﴿وأمر أهلك بالصلاة واصطبر عليها لا نسألك رزقاً نحن نرزقك والعاقبة للتقوى﴾","﴿قل هو الله أحد﴾","﴿الحمد لله رب العالمين﴾"],"answer":1,"why":"سورة طه: 132، وهي من أبواب الرزق.","ref":"ص 4"},{"q":"هل يدعو الدرس إلى ترك السعي في طلب الرزق؟","options":["لا، بل يدعو أن يكون السعي بالطريقة التي ترضي الله مع الثقة بأن الرزق مقدّر","نعم يدعو لتركه","يدعو إلى الكسل","يدعو إلى السفر"],"answer":0,"why":"وألا نهدر الأرزاق الطيبة التي بين أيدينا في سبيل رزق متوقع.","ref":"ص 4"},{"q":"ما صور سباق أنماط التعليم المعاصرة؟","options":["التعليم المنزلي فقط","الاكتفاء بالتعليم الأهلي","ترك التعليم","التنافس على المدارس الأجنبية والدولية ومدارس اللغات والمدارس الخاصة"],"answer":3,"why":"وقد يكون السباق مصطنعاً ومبالغاً فيه خصوصاً حين يصاحبه ضغط على الأولاد.","ref":"ص 4"},{"q":"ما الذي ينبغي أن تستعد له الأسرة عند اختيار نمط تعليمي؟","options":["اتهام الولد بالتقصير","الاستمرار دون مراجعة","تقبل النتائج المترتبة على اختيارها وعدم تحميل الولد ما لا يطيق","الضغط عليه"],"answer":2,"why":"فهو ليس مذنباً إذا لم يحقق النتائج التي توقعها أهله.","ref":"ص 4"},{"q":"ما المنظومة التعليمية المنشودة؟","options":["جعل الجميع نسخة واحدة","ترك التعليم","اكتشاف النوابغ وتنميتهم مع ضمان الحد الأدنى من العلم النافع لسائر الأولاد","التركيز على الدرجات"],"answer":2,"why":"ويستحق المجتهد جهداً أكبر، ولا يصح إجبار المتعثر ليصبح نسخة من أخيه المتفوق.","ref":"ص 4-5"},{"q":"ما الخطر من البيئة المدرسية الدولية بحسب الدرس؟","options":["تقوية الدين","زيادة العلم الشرعي","تحسين الأخلاق","إضعاف التزام الولد بدينه وزيادة تعلقه بالحضارة الغربية وتشربه ثقافات غير المسلمين"],"answer":3,"why":"وقد يحدث ذلك رغم جهد الأهل في التربية الدينية بالبيت لانفصاله عن الواقع الذي يعيشه الولد أكثر من ثماني ساعات يومياً.","ref":"ص 5"}],"13":[{"q":"ما السؤال الأكثر تكراراً من الأمهات الذي تجيب عنه المحاضرة؟","options":["ابني يتعبني في المذاكرة وعلاقتنا متوترة ولا يذاكر إلا بالعصبية أو العقاب فما العمل؟","كيف أطبخ؟","كيف أدخر؟","كيف أسافر؟"],"answer":0,"why":"وتجيب عنه المحاضرة بالخماسي الأساسي للأولويات التربوية.","ref":"ص 2"},{"q":"ما الأهداف الأسرية التي ذكرتها المحاضرة لتخريج الأولاد؟","options":["طبيب أو مهندس فقط","رجل أعمال فقط","إنسان سوي نفسياً ودينياً وفكرياً يتحمل المسؤولية ويعتمد على ذاته لينفع أمته","موظف حكومي"],"answer":2,"why":"مع الثبات على هذا المبدأ وإزالة العراقيل التي تحول دونه.","ref":"ص 2"},{"q":"كم أولوية في «الخماسي الأساسي»؟","options":["ثلاث أولويات","خمس أولويات","سبع أولويات","عشر أولويات"],"answer":1,"why":"الدين، العلاقة بالأولاد، الراحة والصحة النفسية، القوة الشخصية وتحمل المسؤولية، حفظ القرآن.","ref":"ص 3-5"},{"q":"ما معنى «الدين كمرجع»؟","options":["أن نتبع العرف","أن نقلد الغرب","أن نترك الدين للمدرسة","أن يكون الشرع لا العرف ولا المجتمع ولا المنظومة العا
