:root {
  --bg: #023373;
  --on-dark: #FFFFFF;
  --on-dark-soft: #CFE0F5;
  --on-dark-pink: #FBC4D8;
  --surface: #FDEFF4;
  --surface-2: #FFF8FB;
  --ink: #023373;
  --ink-soft: #4A5F86;
  --line: #F2C2D5;
  --navy-tint: #DCE3F0;
  --pink: #F280AA;
  --pink-ink: #B03A67;
  --pink-tint: #F9C9DB;
  --cyan: #38B5DA;
  --cyan-ink: #0B6F93;
  --cyan-tint: #D8EFF8;
  --btn-pink: #F9C9DB;
  --btn-pink-hover: #F5B5CC;
  --btn-cyan: #BDE5F3;
  --btn-cyan-hover: #A6DBEE;
  --ok: #1E7A55;
  --ok-tint: #E4F5EC;
  --bad: #A33A3A;
  --bad-tint: #FBE6E6;
  --f-head: 'Alexandria', 'Tajawal', system-ui, sans-serif;
  --f-body: 'Tajawal', 'Alexandria', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.8;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

#root { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding-block: 20px 40px; }
h1, h2, h3 { font-family: var(--f-head); margin: 0; text-wrap: balance; line-height: 1.5; }
p { margin: 0; }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--btn-cyan); outline-offset: 2px; border-radius: 6px; }

/* شريط علوي */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 6px 18px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-head); font-weight: 700; font-size: 17px; color: var(--on-dark); }
.brand img { height: 44px; width: auto; }
.topbar .slogan { color: var(--on-dark-pink); font-family: var(--f-head); font-weight: 500; font-size: 14px; }

/* هيرو على الخلفية الزرقاء مباشرة */
.hero { position: relative; padding: 28px 4px 10px; }
.hero::before {
  content: ""; position: absolute; inset-block-start: 4px; inset-inline-start: 0;
  width: 150px; height: 96px;
  background-image: radial-gradient(var(--cyan) 1.6px, transparent 1.7px);
  background-size: 16px 16px; opacity: .6; pointer-events: none;
}
.hero h1 { position: relative; color: var(--on-dark); font-weight: 700; font-size: clamp(30px, 6vw, 50px); }
.hero .lead { position: relative; margin-top: 10px; max-width: 46ch; color: var(--on-dark-soft); font-size: 18px; }
.hero .motto { position: relative; margin-top: 14px; font-family: var(--f-head); font-weight: 500; color: var(--on-dark-pink); font-size: 17px; }
.hero .rule { position: relative; width: 72px; height: 5px; background: var(--pink); border-radius: 3px; margin-top: 18px; }

/* بحث */
.search { position: relative; margin-top: 22px; max-width: 560px; }
.search label { display: block; font-family: var(--f-head); font-weight: 500; font-size: 15px; margin-bottom: 6px; }
.hero .search label { color: var(--on-dark); }
.search input {
  width: 100%; padding: 12px 16px; border-radius: 12px;
  border: 1.5px solid #E4DFC8; color: var(--ink); min-height: 48px;
  background-color: #F2EFE2;

  var QBANK = {"s1":{"1":[{"q":"ما الذي ينبغي أن يكون مقصد دراسة الأحاديث النبوية التربوية في المادة؟","options":["حفظ المعلومات للنجاح في الاختبارات فقط","جمع أكبر قدر من المعارف النظرية","الاكتفاء بتصحيح النية في أول المادة فقط","زيادة الإيمان بالله وتعظيم السنة والاهتداء بهدي النبي ﷺ في شؤون الحياة"],"answer":3,"why":"المقصد الأعظم أن تتحول المعلومات إلى واقع عملي، مع تجديد النية مع كل محاضرة.","ref":"ص 2"},{"q":"من القائل: «ما عالجت شيئًا أشد عليّ من نيتي لأنها تتقلب عليّ»؟","options":["الحسن البصري","الإمام مالك","سفيان الثوري","ابن المبارك"],"answer":2,"why":"قول سفيان الثوري رحمه الله في مجاهدة النية.","ref":"ص 2"},{"q":"ما نسب النبي ﷺ من جهة أبيه؟","options":["محمد بن عبد المطلب بن عبد الله بن هاشم","محمد بن هاشم بن عبد المطلب","محمد بن عبد الله بن عبد المطلب بن هاشم","محمد بن عبد الله بن هاشم بن عبد المطلب"],"answer":2,"why":"هو محمد بن عبد الله بن عبد المطلب بن هاشم، من ولد إسماعيل بن إبراهيم عليهما السلام.","ref":"ص 3"},{"q":"ما الاسم الذي ورد في الحديث تفسيرًا لقوله: «أنا العاقب»؟","options":["الذي يمحو الله به الكفر","الذي ليس بعده نبي","الذي يُحشر الناس على قدمه","نبي التوبة"],"answer":1,"why":"العاقب هو الذي ليس بعده نبي، والمقفّي بمعنى الذي يأتي على أثر الأنبياء أي في آخرهم.","ref":"ص 3"},{"q":"في أي عام وُلد النبي ﷺ؟","options":["عام الحزن","عام الفتح","عام الهجرة","عام الفيل بعد أن أهلك الله جيش أبرهة"],"answer":3,"why":"وُلد ﷺ عام الفيل بعد أن أهلك الله جيش أبرهة الذي أراد هدم الكعبة.","ref":"ص 3"},{"q":"أي زوجات النبي ﷺ لم يتزوج عليها في حياتها، وكل أولاده منها إلا إبراهيم؟","options":["خديجة بنت خويلد رضي الله عنها","عائشة رضي الله عنها","سودة بنت زمعة رضي الله عنها","حفصة رضي الله عنها"],"answer":0,"why":"خديجة أولى زوجاته وأول من آمن به، وجميع أولاده منها إلا إبراهيم فهو من مارية.","ref":"ص 5"},{"q":"أي زوجات النبي ﷺ كانت أسرع لحوقًا به بعد وفاته، وكانت أطولهن يدًا بمعنى الصدقة؟","options":["سودة بنت زمعة","زينب بنت جحش","أم سلمة","صفية بنت حيي"],"answer":1,"why":"زينب بنت جحش رضي الله عنها، توفيت سنة 20 للهجرة، وكانت تعمل بيدها وتتصدق.","ref":"ص 6"},{"q":"من هي زوجة النبي ﷺ التي سُميت في الجاهلية «أم المساكين» لكثرة إطعامها المساكين؟","options":["زينب بنت خزيمة","جويرية بنت الحارث","ميمونة بنت الحارث","أم حبيبة"],"answer":0,"why":"زينب بنت خزيمة، ولم تمكث عنده إلا نحو ثمانية أشهر.","ref":"ص 6"},{"q":"أي الأبناء التاليين هو ابن النبي ﷺ من مارية القبطية؟","options":["القاسم","عبد الله","الطاهر","إبراهيم"],"answer":3,"why":"إبراهيم وُلد سنة 8 هـ وتوفي صغيرًا وهو ابن سنة ونصف.","ref":"ص 7"},{"q":"كيف وصفت عائشة رضي الله عنها خُلق النبي ﷺ؟","options":["كان خلقه الكرم فقط","كان خلقه الشجاعة","كان خلقه القرآن","كان خلقه الحلم دون غيره"],"answer":2,"why":"قالت: «كان خلق نبي الله ﷺ القرآن» رواه مسلم.","ref":"ص 9"}],"2":[{"q":"ما المقصود بالسنة في اللغة؟","options":["الحديث الصحيح فقط","كل ما فعله النبي ﷺ بعد البعثة","الطريقة سواء كانت حسنة أو قبيحة","الفرض الواجب"],"answer":2,"why":"السنة لغةً الطريقة حسنة كانت أو سيئة، كما في حديث «من سنّ في الإسلام سنة حسنة…».","ref":"ص 2"},{"q":"ما المقصود بالسنة في الاصطلاح الشرعي؟","options":["ما ثبت عن النبي ﷺ من قول فقط","ما أُثر عن النبي ﷺ من قول أو فعل أو تقرير أو صفة خَلقية أو خُلقية سواء قبل البعثة أو بعدها","ما فعله النبي ﷺ بعد البعثة فقط","ما ورد في القرآن من أوامر"],"answer":1,"why":"تشمل السنة القول والفعل والتقرير والصفة الخَلقية والخُلقية قبل البعثة وبعدها.","ref":"ص 2"},{"q":"ما حكم من يقول: «أكتفي بأخذ أحكام ديني من القرآن وحده»؟","options":["جائز لأن القرآن كافٍ","لا يجوز لأن السنة حجة على جميع المسلمين وقد أمر القرآن بطاعة الرسول ﷺ مرارًا","جائز لمن لم يتعلم السنة","مكروه فقط"],"answer":1,"why":"العلماء مجمعون على وجوب الأخذ بالسنة، ومنكرها منكر لآيات القرآن التي تأمر بطاعة النبي ﷺ.","ref":"ص 2"},{"q":"لماذا لا يستطيع منكر السنة أن يتعبد لله بأركان الإسلام الأساسية؟","options":["لأن القرآن لم يذكر الصلاة","لأن السنة نسخت القرآن","لأن العبادات للعلماء فقط","لأن العبادات وردت في القرآن مجملة وجاءت السنة بتفصيل كيفيتها"],"answer":3,"why":"الشريعة أمرت بالصلاة وغيرها إجمالًا في القرآن، وبيّنت السنة الكيفية التفصيلية، كما في قصة عمران بن حصين.","ref":"ص 3"},{"q":"ما الذي دلّت عليه قصة عمران بن حصين رضي الله عنه مع الرجل الذي قال: لا تحدثونا إلا بما في القرآن؟","options":["أن القرآن يكفي في كل شيء","أن الصحابة كانوا يتركون السنة","أن عدد ركعات الصلاة وكيفية القراءة فيها لا تُعرف من القرآن وحده بل من السنة","أن السنة خاصة بالنوافل"],"answer":2,"why":"سأله: هل تجد في القرآن أن الظهر أربع لا يُجهر فيها بالقراءة؟ فبيّن أن تفاصيل العبادات من السنة.","ref":"ص 3"},{"q":"ما معنى قوله تعالى: «ثم لا يجدوا في أنفسهم حرجًا مما قضيت»؟","options":["أن يسلّم ظاهرًا وباطنًا لحكم النبي ﷺ دون ضيق في القلب","ألا يتردد المرء في الصلاة","أن يكتفي بالتسليم بلسانه","أن يحكم بما يراه مناسبًا"],"answer":0,"why":"الإيمان لا يتحقق حتى يُحكَّم الرسول ﷺ ويُسلَّم لحكمه ظاهرًا وباطنًا.","ref":"ص 4"},{"q":"ماذا أراد ابن مسعود رضي الله عنه حين لعن «الواشمات والمتنمصات والمتفلجات للحسن المغيرات خلق الله»، وبماذا استدل على المرأة التي اعترضت عليه؟","options":["بقوله تعالى: «فاسألوا أهل الذكر»","بحديث متواتر فقط","برأيه الشخصي","بقوله تعالى: «وما آتاكم الرسول فخذوه وما نهاكم عنه فانتهوا»"],"answer":3,"why":"لعنه ثابت عن النبي ﷺ، وهو داخل في آية «وما آتاكم الرسول فخذوه…».","ref":"ص 5"},{"q":"ما المراد بـ«الحكمة» في قوله تعالى: «ويعلمهم الكتاب والحكمة» عند أهل العلم؟","options":["الحكم والأمثال","سنة رسول الله ﷺ","التفسير","الفقه فقط"],"answer":1,"why":"ذهب أهل العلم إلى أن الحكمة هي السنة، وقال ﷺ: «ألا إني أوتيت القرآن ومثله معه».","ref":"ص 6"},{"q":"أي مما يلي ليس من حقوق السنة النبوية على المسلم بحسب شهادة أن محمدًا رسول الله؟","options":["ابتكار عبادات جديدة حسنة","طاعته فيما أمر","تصديقه فيما أخبر","اجتناب ما نهى عنه وزجر"],"answer":0,"why":"ألا يُعبد الله إلا بما شرع؛ فالعبادات توقيفية ولا يوجد في الدين بدعة حسنة.","ref":"ص 7"},{"q":"ما معنى أن العبادات «توقيفية»؟","options":["لا تجوز إلا في أوقات محددة","تتوقف عند العجز","لا يجوز الإتيان بعبادة لم يشرعها الله ورسوله ﷺ","تؤدى جماعة فقط"],"answer":2,"why":"قال ﷺ: «من عمل عملًا ليس عليه أمرنا فهو رد»، وقال: «وإياكم ومحدثات الأمور».","ref":"ص 8"}],"3":[{"q":"ما الحديث القدسي؟","options":["ما رواه الصحابي عن النبي ﷺ","ما يرويه النبي ﷺ عن ربه جل وعلا","ما أُضيف إلى التابعي","آيات القرآن التي نزلت بالمعنى"],"answer":1,"why":"الحديث القدسي ما يرويه النبي ﷺ عن ربه عز وجل.","ref":"ص 2"},{"q":"ما الفرق بين الحديث والأثر؟","options":["لا فرق بينهما إطلاقًا","الأثر ما أُضيف إلى النبي ﷺ فقط","الحديث ما أُضيف إلى النبي ﷺ، والأثر إذا أُطلق ما ورد عن الصحابة والتابعين","الحديث ما رواه التابعي"],"answer":2,"why":"الأثر إذا أُطلق يراد به ما ورد عن الصحابة والتابعين.","ref":"ص 2"},{"q":"أي مما يلي مثال على الحديث المرفوع حكمًا؟","options":["قول الصحابي: «أُمرنا بكذا» أو «نُهينا عن كذا»","قول النبي ﷺ: «إنما الأعمال بالنيات»","قول الحسن البصري في مسألة","قول التابعي: «السنة كذا»"],"answer":0,"why":"قول الصحابي «أُمرنا» أو «نُهينا» ينسب الأمر والنهي للنبي ﷺ فيأخذ حكم الرفع.","ref":"ص 3"},{"q":"ما الحديث المقطوع؟","options":["ما أُضيف إلى النبي ﷺ","ما أُضيف إلى الصحابي","ما انقطع سنده","ما أُضيف إلى التابعي من قول أو فعل"],"answer":3,"why":"المقطوع في الاصطلاح هو ما أُضيف إلى التابعي، وليس هو المنقطع.","ref":"ص 3"},{"q":"ما الحديث المتواتر؟","options":["ما رواه راوٍ واحد فقط","ما رواه اثنان","ما رواه ثلاثة فأكثر ولم يبلغ حد التواتر","ما رواه جماعة يستحيل عادةً أن يتواطؤوا على الكذب وأسندوه إلى شيء محسوس"],"answer":3,"why":"المتواتر يفيد القطع بصحته عن النبي ﷺ ويوجب العمل بما دل عليه.","ref":"ص 3"},{"q":"أي الأحاديث التالية مثال للمتواتر لفظًا ومعنى؟","options":["«من كذب عليّ متعمدًا فليتبوأ مقعده من النار»","«إنما الأعمال بالنيات»","حديث جبريل المشهور","«الدين النصيحة»"],"answer":0,"why":"رواه أكثر من ستين صحابيًا منهم العشرة المبشرون بالجنة، وهو من أشهر المتواتر.","ref":"ص 4"},{"q":"ما الحديث العزيز؟","options":["ما رواه ثلاثة فأكثر","ما رواه اثنان في كل طبقة من طبقات السند","ما رواه راوٍ واحد","ما رواه الصحابة جميعًا"],"answer":1,"why":"العزيز ما رواه اثنان، والمشهور ما رواه ثلاثة فأكثر ولم يبلغ التواتر، والغريب ما رواه واحد.","ref":"ص 4"},{"q":"لماذا يُعد حديث «إنما الأعمال بالنيات» غريبًا مع انتشاره بعد ذلك؟","options":["لأنه ضعيف","لأنه لم يرد في الصحيحين","لأنه رواه من الصحابة عمر بن الخطاب فقط، ولا يخرجه انتشاره عن وصف الغريب","لأنه موضوع"],"answer":2,"why":"إذا انفرد راوٍ واحد في طبقة من طبقات السند فهو غريب ولو كثر الرواة بعدها.","ref":"ص 4"},{"q":"ما الحديث الصحيح لذاته؟","options":["ما رواه عدل خفيف الضبط بسند متصل","ما كثرت طرقه من الضعيف","ما رواه الكذابون","ما رواه عدل تام الضبط بسند متصل وسلم من الشذوذ والعلة القادحة"],"answer":3,"why":"الحسن لذاته يختلف عن الصحيح في أن راويه خفيف الضبط.","ref":"ص 5"},{"q":"ما الشرط الذي اشترطه البخاري لصحة الحديث ولم يشترطه مسلم وغيره؟","options":["ثبوت لقاء الراوي لمن روى عنه","معاصرة الراوي لمن روى عنه فقط","الصدق","كثرة الرواة"],"answer":0,"why":"شرط البخاري ثبوت اللقيا، أما غيره فيكتفي بالمعاصرة.","ref":"ص 8"}],"4":[{"q":"ما أول ما ينبغي أن تغرسه المرأة المسلمة في نفسها بحسب الدرس؟","options":["الإكثار من النوافل","حفظ المتون","تعلم الفقه التفصيلي","التسليم لله تعالى ولرسوله ﷺ"],"answer":3,"why":"التسليم لحكم الله ورسوله ﷺ قبل أخذ الأحكام التفصيلية، وإلا كان نقصًا كبيرًا في الإيمان.","ref":"ص 2"},{"q":"ما الذي فضّل به أبو بكر رضي الله عنه الصحابة بحسب قول الحسن البصري؟","options":["كثرة صيامه وصلاته","كثرة غزواته","شيء وقر في صدره","كثرة ماله"],"answer":2,"why":"قال الحسن البصري: «ما فضلكم أبو بكر بكثرة صيام ولا صلاة ولكن بشيء وقر في قلبه».","ref":"ص 2"},{"q":"بأي موقف لُقّب أبو بكر رضي الله عنه بـ«الصدّيق» كما ورد في الدرس؟","options":["حادثة الإفك","تصديقه للنبي ﷺ ليلة الإسراء والمعراج","الهجرة","غزوة بدر"],"answer":1,"why":"صدّق النبي ﷺ في خبر الإسراء وقال: «إن كان قال ذلك لقد صدق».","ref":"ص 3"},{"q":"كيف تتعامل المسلمة مع ما يُشكل عليها من أحكام الشرع؟","options":["تعترض عليه حتى يتضح لها","تتركه ولا تعمل به","تسأل عنه من باب رفع الإشكال لا من باب الاعتراض","تعمل بما يوافق هواها"],"answer":2,"why":"تربي نفسها على التسليم ثم تسأل لرفع الإشكال لا للاعتراض.","ref":"ص 3"},{"q":"ما معنى «مستنطقات» في حديث يسيرة رضي الله عنها: «واعقدن بالأنامل فإنهن مسؤولات مستنطقات»؟","options":["يُقال لهن اعقدن التسبيح فقط","تنطق عند الذكر","يُعاقبن على التقصير","يُسألن يوم القيامة وينطقن بما عملن"],"answer":3,"why":"الأنامل تُسأل يوم القيامة وتنطق بما عملت في الدنيا.","ref":"ص 4"},{"q":"ما الأفضل والأكمل في عدّ التسبيح؟","options":["عقد التسبيح بالأنامل","التسبيح بالسبحة الإلكترونية","العدّ بالحصى فقط","عدم العدّ أصلًا"],"answer":0,"why":"الوارد في السنة هو العقد بالأنامل، ويجوز العدّ بالنوى أو الحصى أو السبحة لأن النبي ﷺ لم ينكر على المرأة التسبيح بالنوى.","ref":"ص 4"},{"q":"ماذا قال النبي ﷺ حين استيقظ فزعًا عند أم سلمة رضي الله عنها؟","options":["الحمد لله الذي أحيانا","اللهم أعنا على ذكرك","إنا لله وإنا إليه راجعون","سبحان الله ماذا أنزل من الفتن؟ وماذا فُتح من الخزائن؟"],"answer":3,"why":"أُعلم ﷺ بالوحي أن الفتن مقرونة بفتح الخزائن، وقال: «رُبّ كاسية في الدنيا عارية يوم القيامة».","ref":"ص 5"},{"q":"ما المقصود بـ«كاسيات عاريات مائلات مميلات»؟","options":["من تلبس الحجاب كاملًا","من تلبس لباسًا يصف الجسد أو لا يستر ويتبرجن، وهو وعيد شديد في حقهن","من تتزين لزوجها","من تلبس الألوان الزاهية"],"answer":1,"why":"قال ﷺ: «لا يدخلن الجنة ولا يجدن ريحها»، والحجاب لا يختص بغطاء الرأس فقط.","ref":"ص 6"},{"q":"ما وصية النبي ﷺ لعائشة رضي الله عنها في حديث «عليك بتقوى الله والرفق»؟","options":["الرفق ما كان في شيء إلا زانه ولا نُزع من شيء إلا شانه","الشدة أولى في التربية","اللين ضعف","الرفق خاص بالضيوف"],"answer":0,"why":"الرفق يزيّن الأمور، وهو من أعظم الأخلاق النبوية كما في قصة الأعرابي الذي بال في المسجد.","ref":"ص 7"},{"q":"ما الشروط الأربعة في حديث «إذا صلت المرأة خمسها…» لتدخل الجنة من أي أبواب شاءت؟","options":["الصلاة وصيام الشهر وحفظ الفرج وطاعة الزوج","الصلاة والصيام والحج والزكاة","الصدقة والذكر والتلاوة والقيام","الصلاة والصيام والذكر والصبر"],"answer":0,"why":"صلّت خمسها وصامت شهرها وحفظت فرجها وأطاعت زوجها.","ref":"ص 8"}],"5":[{"q":"بحسب حديث أبي هريرة رضي الله عنه، أي النساء خير؟","options":["التي تكثر من النوافل فقط","التي تعمل خارج البيت","التي تسره إذا نظر وتطيعه إذا أمر ولا تخالفه في نفسها وماله بما يكره","التي لا تطلب شيئًا"],"answer":2,"why":"وصف النبي ﷺ خير النساء بثلاث صفات: السرور بالنظر والطاعة وحفظ الغيب.","ref":"ص 2"},{"q":"ما معنى «تسره إذا نظر»؟","options":["أن تنظر إليه كثيرًا","أن تظهر زينتها أمام الجميع","أن تلبس الغالي من الثياب","تعجبه بحسن مظهرها وعنايتها بنظافتها وطيب رائحتها وتجملها بما يوافق ذوقه المباح"],"answer":3,"why":"يدخل فيه حسن أخلاقها وخدمتها لزوجها لا مجرد الجمال.","ref":"ص 2"},{"q":"بماذا قيّد العلماء طاعة الزوجة لزوجها؟","options":["في الأمور المالية فقط","ما لم تكن متعبة","ما لم يكن في إثم","بما يوافق رأيها"],"answer":2,"why":"الطاعة في المعروف ما لم يكن الأمر معصية، وأعظمها إجابته إذا دعاها إلى الفراش.","ref":"ص 3"},{"q":"بمَ يُرجع في تحديد خدمة الزوجة لزوجها في البيت؟","options":["إلى رأي الزوج وحده","إلى رأي الزوجة وحدها","لا خدمة واجبة إطلاقًا","إلى العرف"],"answer":3,"why":"ما جرى به العرف أن تخدم فيه الزوجة زوجها وجب عليها، وما لم يجرِ به العرف فليس واجبًا.","ref":"ص 3"},{"q":"ما الذي قاله النبي ﷺ لقيس بن سعد حين رآه يريد السجود له؟","options":["أجاز السجود له","لو كنت آمرًا أحدًا أن يسجد لأحد لأمرت النساء أن يسجدن لأزواجهن لما جعل الله لهم عليهن من الحق","أمره بالسجود لله مرتين","سكت ولم يجب"],"answer":1,"why":"السجود لغير الله محرم، وفي الحديث بيان عِظم حق الزوج.","ref":"ص 4"},{"q":"ما الذي يدل عليه رفض النبي ﷺ سجود الناس له كما ورد في الدرس؟","options":["أنه رسول مبلّغ عن ربه ولم يكن يريد الدنيا","أنه لا يحب أمته","أنه لا حق للزوج","أنه لا يجوز تعظيم أحد"],"answer":0,"why":"من دلائل نبوته أنه لم يرضَ بسجود الناس له.","ref":"ص 4"},{"q":"ماذا قال النبي ﷺ في الزوجين المتعاونين على قيام الليل؟","options":["لا يجوز إيقاظ الزوجة","القيام خاص بالرجال","رحم الله رجلًا قام من الليل فصلى وأيقظ امرأته فإن أبت نضح في وجهها الماء","أيقظها بالصوت العالي"],"answer":2,"why":"الرش هو نضح قليل من الماء لا صبّه صبًّا، وهو دليل على التعاون على الطاعة.","ref":"ص 5"},{"q":"ما حكم صيام المرأة التطوع وزوجها حاضر؟","options":["يجوز بدون إذنه","لا يجوز إلا بإذنه","واجب عليها","يجوز في رمضان فقط"],"answer":1,"why":"قال ﷺ: «لا يحل للمرأة أن تصوم وزوجها شاهد إلا بإذنه»؛ لأن استمتاعه بها من أعظم حقوقه.","ref":"ص 6"},{"q":"ماذا يترتب على امتناع الزوجة عن فراش زوجها وهو غاضب عليها دون عذر؟","options":["لعنتها الملائكة حتى تصبح","لا شيء","تقضي ما فاتها","يجب عليها صيام"],"answer":0,"why":"قال ﷺ: «فأبت فبات غضبان عليها لعنتها الملائكة حتى تصبح»، فإن كان لها عذر فقبله فلا حرج.","ref":"ص 8"},{"q":"كيف وصف الحديث موقف إبليس من الشيطان الذي فرّق بين الرجل وامرأته؟","options":["غضب عليه","لا يهتم به","يعاقبه","يدنيه منه ويقول: نِعم أنت"],"answer":3,"why":"أقرب الشياطين إلى إبليس أعظمهم فتنة، وهو من فرّق بين الرجل وامرأته.","ref":"ص 9"}],"6":[{"q":"ماذا فعلت عائشة رضي الله عنها حين جاءتها امرأة تسأل ومعها ابنتان وليس عندها إلا تمرة واحدة؟","options":["أعطتها التمرة فقسمتها بين ابنتيها","ردّتها لأنها لا تملك غيرها","طلبت منها الانتظار","أعطتها مالًا"],"answer":0,"why":"في ذلك درجة عالية من الإيثار، وقال ﷺ: «من يلي من هذه البنات شيئًا فأحسن إليهن كنّ له سترًا من النار».","ref":"ص 2"},{"q":"ما الجزاء المذكور لمن أحسن إلى البنات في الحديث؟","options":["الغنى في الدنيا","طول العمر","كنّ له سترًا من النار","مضاعفة الرزق"],"answer":2,"why":"من أحسن إليهن كنّ له سترًا من النار، وقد أوجب الله لتلك المرأة الجنة بسبب رحمتها بابنتيها.","ref":"ص 2"},{"q":"ما أعلى درجات الإيثار كما ورد في الدرس؟","options":["إيثار الناس بما لا تحتاجه","إيثارهم بما تحتاجه حاجة ماسّة","الصدقة بالقليل","الصدقة سرًا"],"answer":1,"why":"أعلى درجات الإيثار أن يؤثر المرء بما هو محتاج إليه حاجة ماسة.","ref":"ص 3"},{"q":"لماذا كان أجر تربية البنات عظيمًا بحسب الدرس؟","options":["لأن البنات أكثر عددًا","لأن الأولاد لا يحتاجون إلى تربية","لأن البنت لا تعمل في الأصل فتحتاج رعاية وليّها، والغالب أن الإحسان إليها خالص لله لا طمعًا في دنيا","لأن البنات أقل كلفة"],"answer":2,"why":"لا يتعلق الآباء بالبنات من جهة الكسب أو القوة أو استمرار النسب غالبًا، فيكون الإحسان أخلص.","ref":"ص 3"},{"q":"ما معنى «أحناه على ولد» في حديث «خير نساء ركبن الإبل صالح نساء قريش»؟","options":["أكثرهن مالًا","أجملهن","أكثرهن عبادة","المرأة الحانية على أولادها"],"answer":3,"why":"أحناه على ولد: الحانية على أولادها وأرعاه على زوج في ذات يده: أكثر النساء رعاية لمال الزوج.","ref":"ص 4"},{"q":"بماذا مدح عمر رضي الله عنه المرأة التي تعين زوجها؟","options":["تنفق أكثر مما عندها","تعمل خارج البيت","تسأل عن راتبه","تعين زوجها على الدهر ولا تعين الدهر عليه"],"answer":3,"why":"المرأة القنوعة التي لا تطالب بالكماليات ولا تُحرج زوجها بالمقارنات.","ref":"ص 5"},{"q":"ما حكم نفقة المرأة ذات المال على زوجها الفقير وأبنائها؟","options":["محرمة","لا تجب عليها واجبًا لكنها صدقة وصلة ولها أجران","واجبة وجوبًا مطلقًا","مكروهة"],"answer":1,"why":"قال ﷺ لزينب امرأة ابن مسعود: «زوجك وولدك أحق من تصدقت به عليهم»، ولها أجر الصدقة وأجر القرابة.","ref":"ص 5"},{"q":"ماذا قال النبي ﷺ لمن وعدت طفلها بشيء وهي لا تنوي أن تعطيه؟","options":["كُتبت عليها كذبة","لا شيء عليها","مباح للتربية","هو من المزاح"],"answer":0,"why":"«أما إنك لو لم تعطه شيئًا كُتبت عليك كذبة»، فلا يجوز الكذب على الأطفال.","ref":"ص 6"},{"q":"ما أثر كذب الأبوين على الطفل بحسب الدرس؟","options":["يعلّمه الحيلة","لا أثر له","يجعله أذكى","إذا كذب أبواه عليه فلا غرابة أن يكون كذّابًا عند الكبر"],"answer":3,"why":"ما نغرسه في الصغر نجني آثاره في الكبر، فينبغي أن تكون المرأة قدوة صالحة.","ref":"ص 6"},{"q":"ماذا يفعل الأب أو الأم إذا أصرّ الطفل على أمر لا يمكن تلبيته؟","options":["يعتذر ويصرف انتباهه بما هو مناسب دون كذب","يكذب عليه ليسكت","يعده بما لا ينوي تحقيقه","يترك الطفل يبكي"],"answer":0,"why":"لا يجوز الكذب على الأطفال، ويمكن الاعتذار أو صرف الانتباه بطريقة مناسبة.","ref":"ص 7"}],"7":[{"q":"بحسب حديث ابن مسعود رضي الله عنه، أيّ صلاة المرأة أفضل؟","options":["في المسجد الحرام","في صحن البيت","في المسجد","في مخدعها (الغرفة الداخلية الخاصة)"],"answer":3,"why":"صلاتها في بيتها أفضل من صلاتها في حجرتها، وصلاتها في مخدعها أفضل من صلاتها في بيتها... بحسب الرواية: كلما كانت أستر عن أعين الرجال كان أفضل.","ref":"ص 2"},{"q":"ما المقصود بـ«مخدع المرأة»؟","options":["ساحة البيت","غرفة الضيوف","المكان الخاص بالمرأة أو الغرفة الداخلية التي تُتخذ لحفظ الأشياء","سطح البيت"],"answer":2,"why":"المخدع: الغرفة الداخلية الخاصة، والحجرة: المكان المحاط حول البيت كالصحن.","ref":"ص 2"},{"q":"أي مما يلي ليس من شروط خروج المرأة لطلب العلم الشرعي؟","options":["أن تخرج بلا إذن الزوج","الالتزام بالحجاب الشرعي الكامل","ألا يكون في الخروج مزاحمة أو اختلاط بالرجال","ألا يمنعها زوجها"],"answer":0,"why":"من الشروط ألا يكون زوجها أو من له سلطة عليها قد منعها من الخروج.","ref":"ص 3"},{"q":"ما المراد بقوله ﷺ: «إذا أنفقت المرأة من طعام بيتها غير مفسدة»؟","options":["الإنفاق الكثير","الإنفاق اليسير الذي لا يضر بميزانية البيت ويجري به العرف","الإنفاق بلا علم الزوج","التبذير"],"answer":1,"why":"وللمرأة أجر إنفاقها، ولزوجها أجر ما كسب، وللخازن مثل ذلك.","ref":"ص 3"},{"q":"متى لا يجوز للمرأة أن تنفق من مال زوجها؟","options":["إذا أذن لها","إذا علمت أنه لا يأذن قطعًا","إذا كان المال كثيرًا","إذا كان في الطعام"],"answer":1,"why":"فإن علمت منه أنه لا يأذن قطعًا فلا يجوز لها الإنفاق من ماله.","ref":"ص 4"},{"q":"ماذا قال النبي ﷺ عن الصدقة ولو بالقليل؟","options":["الصدقة لا تقبل إلا إذا كثرت","القليل لا يُذكر","«استتروا من النار ولو بشق تمرة»","الصدقة للأغنياء"],"answer":2,"why":"فلا ينبغي للمرأة أن تمنعها القلة من الإنفاق، ولا تحتقر من المعروف شيئًا.","ref":"ص 4"},{"q":"ما أفضل ما يُحسَن به إلى الناس بحسب الدرس؟","options":["بذل المال فقط","إطعامهم الطعام والحث على ذلك","النصح فقط","الخدمة"],"answer":1,"why":"أفضل ما يُحسَن به إلى الناس إطعامهم الطعام وحضّهم عليه.","ref":"ص 5"},{"q":"ما معنى «الراعي» في حديث «كلكم راع وكلكم مسؤول عن رعيته»؟","options":["الذي يحفظ الشيء ويؤتمن عليه ويقوم بما فيه صلاحه","الحاكم فقط","الأب فقط","من يملك الغنم"],"answer":0,"why":"المرأة راعية في بيت زوجها ومسؤولة عن رعيتها: حسن تدبير المال وتربية الأولاد.","ref":"ص 5"},{"q":"ماذا علّم النبي ﷺ فاطمة رضي الله عنها حين شكت إليه مشقة الرحى وطلبت خادمًا؟","options":["أعطاها خادمًا","أمر عليًّا بتوظيف خادم","طلب منها الصبر فقط","علمها التسبيح والتحميد والتكبير ثلاثًا وثلاثين عند النوم"],"answer":3,"why":"قال: «ألا أدلكما على خير مما سألتماه»: تسبحان وتحمدان وتكبّران عند النوم.","ref":"ص 6"},{"q":"ما الذي يُستفاد من امتناع النبي ﷺ عن إعطاء ابنته فاطمة خادمًا؟","options":["أنه عمل في الغنائم بأمر الله لا لخدمة مصالح أهله","أنه لا يحب ابنته","أن الخدم لا يجوز استخدامهم","أنه لا يقدر على ذلك"],"answer":0,"why":"ذكر الدرس أنه ﷺ لم يستخدم الغنائم لمصالح أهله، وعلّمها الذكر.","ref":"ص 7"}],"8":[{"q":"ماذا قال النبي ﷺ للنساء في شأن الجارة والهدية؟","options":["أكثرن من الهدايا الغالية","لا تهادين إلا الأغنياء","الهدية للأقارب فقط","لا تحقرن جارة لجارتها ولو فرسن شاة"],"answer":3,"why":"النهي عن احتقار القليل من العطاء؛ فالتهادي يجلب المودة ويذهب الضغائن.","ref":"ص 2"},{"q":"ما المقصود بـ«فرسن شاة»؟","options":["رأس الشاة","ظلف الشاة أو عظم قليل اللحم في أطرافها","لبن الشاة","قطيع الغنم"],"answer":1,"why":"فرسن الشاة: ظِلفها، وهو شيء حقير يُضرب به المثل في القلة.","ref":"ص 2"},{"q":"بماذا أوصى النبي ﷺ أبا ذر رضي الله عنه إذا طبخ مرقة؟","options":["أن يقلل منها","أن يأكلها وحده","أن يكثر ماءها ويتعاهد جيرانه","أن يهدي منها للغني فقط"],"answer":2,"why":"زيادة يسيرة في الماء تكون سببًا في البركة وإكرام الجيران.","ref":"ص 3"},{"q":"ما أعظم فتنة تركها النبي ﷺ على الرجال؟","options":["فتنة المال","فتنة الجاه","فتنة النساء","فتنة الأولاد"],"answer":2,"why":"«ما تركت بعدي فتنة أضرّ على الرجال من النساء».","ref":"ص 3"},{"q":"لماذا كانت المرأة الصالحة من أعظم أسباب صلاح المجتمع؟","options":["لأن تأثيرها على الرجل والمجتمع عظيم، تُصلح بيتها وزوجها","لأنها تعمل خارج البيت","لأنها تتكلم كثيرًا","لأنها لا تتأثر بالفتن"],"answer":0,"why":"وإذا فسدت أفسدت بيتها وزوجها، وتأثيرها يشبه تأثير السحر.","ref":"ص 4"},{"q":"ما المقصود بقوله ﷺ: «المرأة عورة فإذا خرجت استشرفها الشيطان»؟","options":["أن المرأة لا تخرج أبدًا","أن الشيطان يحميها","أن المرأة نجسة","أن الشيطان يزيّنها في أعين الرجال"],"answer":3,"why":"استشرفها: زيّنها في نظر الرجال؛ والأصل في المرأة أن تكون قارّة في البيت.","ref":"ص 5"},{"q":"لماذا مدح الله تعالى الحور العين بأنهن «مقصورات في الخيام»؟","options":["لأنهن لا يعرفن الخروج","لأن لزوم البيوت يُمدح به النساء، لا كثرة الخروج","لأنهن ضعيفات","لأنهن صغيرات"],"answer":1,"why":"المرأة تُمدح بكثرة لزومها لبيتها لا بكثرة خروجها منه.","ref":"ص 5"},{"q":"ماذا قصد النبي ﷺ بقوله عن «الحمو»: «الحمو الموت»؟","options":["أخو الزوج وقريبه، وخطره أشد لأن الناس يتساهلون في دخوله على زوجة أخيه","أخو الزوجة","الحماة","الأب"],"answer":0,"why":"الحمو: أخو الزوج وقريبه، ودخوله أخطر لأنه لا يُستنكر.","ref":"ص 6"},{"q":"ماذا طلب النبي ﷺ من النساء حين اختلط الرجال بالنساء في الطريق؟","options":["استأخرن فإنه ليس لكن أن تحققن الطريق، عليكن بحافات الطريق","أسرعن في المشي","قفن حتى يمر الرجال","ارجعن إلى المسجد"],"answer":0,"why":"فكانت المرأة تلتصق بالجدار حتى يلتصق ثوبها به؛ والاختلاط في الطرقات من الاختلاط المنهي عنه.","ref":"ص 7"},{"q":"ما أخطر نتائج تمكين النساء من الاختلاط بالرجال بحسب ابن القيم؟","options":["ضعف الاقتصاد","قلة الإنجاب","كثرة الخلافات فقط","كثرة الفواحش والزنا وهو من أسباب الموت العام"],"answer":3,"why":"ذكر قصة البغايا في عسكر موسى والطاعون الذي أصابهم.","ref":"ص 7"}],"9":[{"q":"ماذا فعل النبي ﷺ حين طلبت النساء منه يومًا يعظهن فيه؟","options":["جعل لهن يومًا فجاءهن ووعظهن وعلّمهن","رفض ذلك","أرسل أحد الصحابة","طلب منهن الحضور مع الرجال"],"answer":0,"why":"فيه حرص النساء على تعلم الدين وسؤالهن عنه.","ref":"ص 2"},{"q":"ماذا قال النبي ﷺ لمن مات لها ثلاثة من الولد؟","options":["لا شيء عليها","كان عليها أن تصبر فقط","كانوا لها حجابًا من النار","تحتاج كفارة"],"answer":2,"why":"ومن صبرت واحتسبت نالت أجرًا عظيمًا، وأولاد المسلمين في الجنة بإجماع العلماء.","ref":"ص 2"},{"q":"ما الذي ينبغي على من فقدت أولادها بحسب الدرس؟","options":["الجزع والسخط","الصبر والاحتساب","الانقطاع عن الناس","الاعتراض على القدر"],"answer":1,"why":"من جزعت وتسخطت وقعت في معصية، وقد تفوتها الأجور.","ref":"ص 3"},{"q":"ماذا أمر النبي ﷺ النساء يوم العيد؟","options":["بالصيام","بالصدقة","بالحج","بالقيام"],"answer":1,"why":"قال: «تصدّقن فإني رأيتكن أكثر أهل النار».","ref":"ص 3"},{"q":"لماذا كانت النساء أكثر أهل النار بحسب الحديث؟","options":["لأنهن يكثرن اللعن ويكفرن العشير","لأنهن لا يصلين","لأنهن لا يتعلمن","لأنهن ضعيفات الإيمان"],"answer":0,"why":"يكثرن اللعن ويكفرن العشير، أي يجحدن فضل الزوج.","ref":"ص 3"},{"q":"ما معنى «كفر العشير»؟","options":["عدم الصلاة","جحود المرأة فضل زوجها وإحسانه","ترك الصيام","كثرة الخروج"],"answer":1,"why":"فسّره النبي ﷺ: «لو أحسنت إلى إحداهن الدهر ثم رأت منك شيئًا قالت: ما رأيت منك خيرًا قط».","ref":"ص 4"},{"q":"ما الدليل على نقصان عقل المرأة في الحديث؟","options":["قلة الكلام","كثرة النسيان","شهادة المرأتين تعدل شهادة رجل","ضعف الحفظ"],"answer":2,"why":"ذكر الله ذلك في آية الدَّين، والحكمة أن تذكّر إحداهما الأخرى.","ref":"ص 4"},{"q":"ما الدليل على نقصان دين المرأة في الحديث؟","options":["كثرة النوم","قلة الصدقة","لا تصلي ولا تصوم في أيام الحيض","كثرة الكلام"],"answer":2,"why":"قال ﷺ: «أليس إذا حاضت لم تصلِّ ولم تصم؟ فذلك من نقصان دينها».","ref":"ص 4"},{"q":"ما حكم سفر المرأة بلا محرم؟","options":["جائز في كل حال","جائز لمسافة قصيرة فقط","جائز في الحج فقط","لا يجوز إلا مع زوج أو ذي محرم"],"answer":3,"why":"قال ﷺ: «لا تسافر المرأة إلا مع ذي محرم» حفظًا لها ودرءًا للمفاسد.","ref":"ص 4"},{"q":"ماذا فعل النبي ﷺ حين قال له رجل: «إني أريد أن أخرج في جيش كذا وامرأتي تريد الحج»؟","options":["أمره بالغزو وترك زوجته","أمره بإرسالها وحدها","أمره بتأجيل الحج","أمره بمرافقة زوجته في الحج"],"answer":3,"why":"درء المفاسد مقدم على جلب المصالح، فأمره ﷺ أن يخرج مع زوجته.","ref":"ص 5"}],"10":[{"q":"ما معنى قوله ﷺ: «ليس منا من لم يرحم صغيرنا ويوقر كبيرنا»؟","options":["أن فاعل ذلك يخرج من الإسلام","أنه لا يُقبل منه عمل","أنه يُعاقب بالحبس","ليس على هدينا وسنتنا وطريقتنا، وليس معناه الخروج من الإسلام"],"answer":3,"why":"«ليس منا»: ليس على هدينا، وليس المقصود الخروج من الإسلام.","ref":"ص 2"},{"q":"ما الذي يدخل في «الكبير» الذي يجب توقيره بحسب الدرس؟","options":["كبير السن فقط","الغني فقط","كبير السن وحامل القرآن وذو العلم والسلطان المقسط","القريب فقط"],"answer":2,"why":"من إجلال الله إكرام ذي الشيبة المسلم وحامل القرآن غير الغالي فيه والجافي عنه وذي السلطان المقسط.","ref":"ص 3"},{"q":"أي مما يلي من تمام الرحمة بالطفل؟","options":["تدليله وإعطاؤه كل ما يريد","تركه يفعل ما يشاء","تعليمه الصلاة وأمره بها لسبع وضربه عليها لعشر مع اللطف","ترك الأجهزة الذكية بيده طويلًا"],"answer":2,"why":"الرحمة ليست التدليل فقط، بل تعويده الالتزام بالأحكام الشرعية.","ref":"ص 3"},{"q":"ماذا قال النبي ﷺ للأقرع بن حابس حين استنكر تقبيله الحسن؟","options":["من لا يَرحم لا يُرحم","عليك بالشدة","القبلة للنساء فقط","هذا خاص بالصغار"],"answer":0,"why":"قال الأقرع إن له عشرة من الولد ما قبّل منهم أحدًا.","ref":"ص 4"},{"q":"بماذا قيّد الدرس جواز تقبيل الأطفال؟","options":["ألا يكون أمام الناس","أن يكون للرحمة لا للشهوة","أن يكون في البيت فقط","أن يكون بين الإخوة فقط"],"answer":1,"why":"التقبيل للشهوة محرم، وللرحمة مشروع، ولا حرج بين الأقارب المعروفين بالورع.","ref":"ص 5"},{"q":"ماذا فعل النبي ﷺ حين ارتحله الحسن أو الحسين وهو ساجد؟","options":["رفعه فورًا","أنهى الصلاة","أطال السجدة حتى يقضي حاجته","نهره"],"answer":2,"why":"قال: «كرهت أن أعجله حتى يقضي حاجته»، وفيه ملاطفة الأطفال.","ref":"ص 6"},{"q":"ماذا كان النبي ﷺ يفعل بأمامة بنت زينب وهو يصلي؟","options":["كان يحملها: إذا سجد وضعها وإذا قام حملها","كان يمنعها من الدخول","كان يؤخر الصلاة","كان يخرجها من المسجد"],"answer":0,"why":"فيه جواز العمل القليل في الصلاة، وفيه رعاية النبي ﷺ لأطفاله.","ref":"ص 7"},{"q":"إذا كان الطفل كثير الحركة ويشوش على المصلين، فما الأولى في إدخاله المسجد؟","options":["إدخاله دائمًا","أن لا يُؤخذ للمسجد إن كان يشوش على المصلين","منع الأطفال من المساجد نهائيًا","إجباره على الصمت"],"answer":1,"why":"إدخال الأطفال المسجد جائز، لكن تراعى بعض الأمور كمن يشوش على المصلين.","ref":"ص 7"},{"q":"ما كنية «أبو عمير» التي كان النبي ﷺ يخاطب بها أخا أنس؟","options":["كنية لرجل كبير","اسم الولد","لقب","كنية للطفل الصغير تشجيعًا وإكرامًا"],"answer":3,"why":"كان يقول: «يا أبا عمير ما فعل النغير؟»، وفي الحديث مشروعية تكنية الطفل.","ref":"ص 8"},{"q":"ما فوائد تكنية الطفل الصغير؟","options":["فقط التفاؤل","إكرامه والتفاؤل له والتعجيل بكنية حسنة قبل أن يُطلق عليه الناس كنية سوء","الشهرة","ليس له فائدة"],"answer":1,"why":"ذكر الدرس ثلاث فوائد: إكرامه، والتفاؤل له، والتعجيل بالكنية الحسنة.","ref":"ص 9"}],"11":[{"q":"بحسب حديث أنس رضي الله عنه، متى يتحقق كمال الإيمان في محبة النبي ﷺ؟","options":["أن يكون أحب إلى المرء من ولده ووالده والناس أجمعين","أن يحبه مثل ولده","أن يحبه بقلبه فقط","أن يحبه في وقت دون آخر"],"answer":0,"why":"قال ﷺ: «لا يؤمن أحدكم حتى أكون أحب إليه من ولده ووالده والناس أجمعين».","ref":"ص 2"},{"q":"ماذا قال النبي ﷺ لعمر حين قال: «أنت أحب إليّ من كل شيء إلا من نفسي»؟","options":["حسنٌ","الآن يا عمر","لا والذي نفسي بيده حتى أكون أحب إليك من نفسك","أنت صادق"],"answer":2,"why":"فقال عمر: «فإنه الآن والله لأنت أحب إليّ من نفسي»، فقال ﷺ: «الآن يا عمر».","ref":"ص 2"},{"q":"ما الذي يظهر صدق المحبة بحسب الدرس؟","options":["ادعاء المحبة باللسان","تقديم ما يحبه النبي ﷺ حين تهوى النفس خلافه","كثرة الكلام","الحزن عند الذكر"],"answer":1,"why":"أعظم مواطن الاختبار أن يقبل على الإنسان ما يحبه وتهواه نفسه ثم يعلم أن النبي ﷺ نهى عنه.","ref":"ص 3"},{"q":"ما أقسام المحبة الثلاثة المذكورة في شرح الحديث؟","options":["محبة الله ومحبة الرسول ومحبة الناس","محبة الأهل والمال والعمل","محبة الوالدين والأولاد والأصدقاء","محبة إجلال وتعظيم، ومحبة شفقة ورحمة، ومحبة استحسان وتوافق"],"answer":3,"why":"كمحبة الوالد، ومحبة الولد، ومحبة الأصحاب والإخوان.","ref":"ص 3"},{"q":"ما القاعدة في محبة الله ومحبة النبي ﷺ بحسب الدرس؟","options":["هي لمصلحة الإنسان","هي تابعة للعادة","هي محبة الجماعة","هي محبة لذاتها ودينية محضة لا لمصلحة دنيوية"],"answer":3,"why":"محبة الله لذاته سبحانه، ومحبة النبي ﷺ لأنه رسول الله، فهي دينية محضة.","ref":"ص 4"},{"q":"بماذا عبّر الصحابة عن محبتهم للنبي ﷺ؟","options":["حكّموه في أنفسهم وأموالهم وقالوا: لو استعرضت بنا البحر لخضناه معك","طلبوا منه المال","ابتعدوا عنه","تركوا القتال"],"answer":0,"why":"ظهرت المحبة لارتباطها بمحبة الله ولأن الغرض منها ديني محض.","ref":"ص 4"},{"q":"أي مما يلي من تمام محبة النبي ﷺ؟","options":["ترك السنن","نصر سنته ونشرها والدفاع عنه وموالاة أصحابه ومعاداة أعدائه","الاكتفاء بالحب القلبي","محبة الدنيا"],"answer":1,"why":"ومن ذلك تمني رؤيته ولو فقد الإنسان أهله وماله.","ref":"ص 5"},{"q":"ماذا قال النبي ﷺ لعلي وفاطمة حين وجدهما نائمين ليلًا؟","options":["لا تقوموا","استمرا في النوم","ألا تصليان؟","اذهبا إلى المسجد"],"answer":2,"why":"كان ﷺ حريصًا على قيام الليل ويتفقد أهل بيته، وقال: «أيقظوا صواحب الحجر».","ref":"ص 6"},{"q":"بماذا ردّ علي رضي الله عنه على قول النبي ﷺ: ألا تصليان؟","options":["قام فورًا","قال: يا رسول الله إنما أنفسنا بيد الله فإذا شاء أن يبعثنا بعثنا","سكت","اعتذر عن التقصير"],"answer":1,"why":"فانصرف النبي ﷺ وهو يضرب فخذه ويقول: «وكان الإنسان أكثر شيء جدلًا».","ref":"ص 6"},{"q":"من هن «صواحب الحجر» في قوله ﷺ: «أيقظوا صواحب الحجر»؟","options":["زوجاته ﷺ","بناته ﷺ","جاراته","نساء الصحابة"],"answer":0,"why":"الحجر: غرف زوجاته ﷺ، وفي الحديث حرصه على إيقاظ أهله لقيام الليل.","ref":"ص 6"}],"12":[{"q":"ما الذي أمر به النبي ﷺ الأولاد في سن السابعة؟","options":["الصيام","الصلاة","الحج","القيام"],"answer":1,"why":"«مروا أولادكم بالصلاة وهم أبناء سبع سنين واضربوهم عليها وهم أبناء عشر وفرّقوا بينهم في المضاجع».","ref":"ص 2"},{"q":"من المخاطَب بالأمر في «مروا أولادكم بالصلاة»؟","options":["الأب فقط","الأم فقط","المعلمون فقط","الأب والأم وكل من هو مسؤول عن التربية"],"answer":3,"why":"الأمر موجه للأب والأم، وكل من تولى أمر الأطفال.","ref":"ص 3"},{"q":"ما الأكمل في تعليم الأطفال الصلاة؟","options":["التعليم النظري فقط","الأمر بها دون متابعة","الجمع بين القدوة والتعليم التطبيقي ومراقبة الطفل وتصحيح صلاته","تأجيلها إلى البلوغ"],"answer":2,"why":"الأصل أن تُتلقى الصلاة تطبيقيًّا كما فعل النبي ﷺ على المنبر وكان الصحابة يراقبونه.","ref":"ص 2"},{"q":"ما معنى «واضربوهم عليها وهم أبناء عشر»؟","options":["ضرب تأديب لا ضرب تشفٍّ ولا إضرار، بعد التربية والتنبيه والتحذير","ضرب مبرح","الضرب قبل التعليم","الضرب بلا سبب"],"answer":0,"why":"المبالغة في الضرب أو الضرب بدون سبب ظاهر من الظلم الذي يُحاسَب عليه.","ref":"ص 3"},{"q":"لماذا يُضرب الطفل على الصلاة قبل البلوغ مع أنها ليست واجبة عليه؟","options":["لتعويده عليها وتأديبه لخطورة تركها","لأنها واجبة عليه","لتخويفه","لإظهار القوة"],"answer":0,"why":"ذكر الدرس أن تركها بعد البلوغ قد يؤدي إلى الخروج من الدين، فيُدرَّب مبكرًا.","ref":"ص 3"},{"q":"ما حكم أطفال المسلمين الذين يموتون في طفولتهم؟","options":["يُسألون","في الجنة بإجماع العلماء","يُعذَّبون","لا يُعلم"],"answer":1,"why":"وحسناتهم مكتوبة لهم وسيئاتهم لا تُكتب إلا بعد البلوغ، ويرتفع الولد بالحسنات إلى درجة والديه.","ref":"ص 4"},{"q":"ما المقصود بالتفريق بين الأولاد في المضاجع؟","options":["توزيعهم في غرف متباعدة جدًّا","عدم النوم في غرفة واحدة نهائيًّا","عدم نومهم متلاصقين خاصة بين الذكور والإناث عند العاشرة سدًّا لذرائع الفتنة","عقوبة"],"answer":2,"why":"وقت النوم مظنة التماس وحركة الشهوة، فيبدأ التفريق عند العاشرة.","ref":"ص 5"},{"q":"لماذا يبدأ التفريق في المضاجع عند سن العاشرة؟","options":["لأن الأطفال يخافون","لأن الصلاة تجب","لأنه بداية الدخول في مرحلة البلوغ ومعرفة مواطن الجمال","لضيق البيت"],"answer":2,"why":"وإذا ظهرت علامات مبكرة وجب التفريق قبل العاشرة خاصة في زماننا.","ref":"ص 5"},{"q":"ماذا قال النبي ﷺ عن الصدق في حديث ابن مسعود؟","options":["الصدق ضعف","الصدق يهدي إلى المال","الصدق صفة الأنبياء فقط","الصدق يهدي إلى البر والبر يهدي إلى الجنة"],"answer":3,"why":"وما يزال الرجل يصدق ويتحرى الصدق حتى يُكتب عند الله صديقًا.","ref":"ص 6"},{"q":"ما أنواع الصدق المذكورة في الدرس؟","options":["صدق اللسان فقط","صدق القول وصدق النية وصدق العمل","الصدق مع الناس فقط","صدق الظاهر"],"answer":1,"why":"صدق القول ضد الكذب، وصدق النية الإخلاص لله، وصدق العمل أن يوافق قوله عمله.","ref":"ص 7"}],"13":[{"q":"ماذا قال النبي ﷺ لبشير بن سعد حين أعطى ابنه النعمان عطية دون بقية أولاده؟","options":["أقرّه على ذلك","«اتقوا الله واعدلوا بين أولادكم» فرجع في عطيته","أمره بزيادتها","سكت"],"answer":1,"why":"الحديث نص واضح في تحريم التفضيل بين الأولاد في الهدايا والهبات.","ref":"ص 2"},{"q":"لماذا طلبت أم النعمان من زوجها أن يشهد رسول الله ﷺ على العطية؟","options":["لإنكارها","لتعلم الحكم","لتثبيت العطية لولدها","لمعرفة سعرها"],"answer":2,"why":"وهذا الفعل كثيرًا ما يحصل من الأمهات إذا كان للزوج أولاد من غيرها فيقعون في الظلم.","ref":"ص 2"},{"q":"ما الحكمة من العدل بين الأولاد بحسب الدرس؟","options":["لإرضاء الأم","لتحقيق المساواة المالية فقط","حتى يكون بينهم ألفة ولا شحناء وبغضاء ويسهل عليهم بر والديهم","لأن الفقر يتطلب ذلك"],"answer":2,"why":"وجاء عن النخعي أن السلف كانوا يستحبون العدل حتى في القُبَل.","ref":"ص 3"},{"q":"هل يجوز للأب أن يعطي بعض أولاده لحاجتهم كالعلاج أو الدراسة دون الآخرين؟","options":["نعم لأنه من باب النفقة وليس الهدية","لا يجوز","نعم لكنه محرم","يجوز بشرط موافقة الإخوة"],"answer":0,"why":"في النفقة يُعطى كل واحد ما يحتاجه بحسب قدرة الأب.","ref":"ص 3"},{"q":"لماذا لا يجوز تخصيص الابن البار بهدية لكونه يخدم والديه؟","options":["لأنه لا يستحق","لأنه قد يمرض","لأن الأم تمنع","لأن البار يريد الأجر من الله لا المال، وقد يعجب بنفسه وينفِّر إخوته وقد تتقلب القلوب"],"answer":3,"why":"ذكر الدرس ثلاثة أسباب: إخلاص البار، وإعجابه بنفسه ونفور إخوته، وتقلب القلوب.","ref":"ص 3"},{"q":"هل يجوز إعطاء الابن الذي يعمل مع والده في التجارة أجرًا دون بقية إخوته؟","options":["نعم لأنه مقابل عمله وهو كالأجير","لا يجوز","يجوز بشرط موافقة إخوته","هو من الهدية"],"answer":0,"why":"الأجرة مقابل العمل وليست هبة.","ref":"ص 4"},{"q":"ما رأي جمهور العلماء في التسوية بين الذكر والأنثى في العطايا؟","options":["للذكر مثل حظ الأنثيين","الذكر والأنثى سواء","الأنثى أكثر","الذكر فقط"],"answer":1,"why":"استدلوا بظاهر الحديث «فاتقوا الله واعدلوا بين أولادكم»، وذهب بعضهم إلى القسمة كالإرث.","ref":"ص 4"},{"q":"ما الذي قاله النبي ﷺ حين رأى الحسن رضي الله عنه وقد جاء يسعى؟","options":["طلب منه الجلوس","نهره","أمره بالمذاكرة","عانقه وقبله وقال: «اللهم أحبه وأحبَّ من يحبه»"],"answer":3,"why":"وفيه جواز لباس الصبيان القلادة دون تشبه بالنساء، وتنظيف الأطفال والتلطف بهم.","ref":"ص 5"},{"q":"ما رأي الدرس فيمن يقول إن الدلال والحنان للبنات فقط دون الذكور؟","options":["صحيح","يجوز في سن معين","خطأ، فقد كان النبي ﷺ يفعل ذلك مع الحسن والحسين وهما ذكران","هو من الضعف"],"answer":2,"why":"لم يكن الحسن والحسين إلا من أقوى الناس مع شدة حب النبي ﷺ لهما.","ref":"ص 6"},{"q":"ماذا قال النبي ﷺ لعائشة رضي الله عنها حين ردّت على اليهود الذين قالوا: السام عليكم؟","options":["اللعنة عليهم","اتركيهم","اغضبي","مهلًا يا عائشة فإن الله يحب الرفق في الأمر كله"],"answer":3,"why":"وقال: «إن الله رفيق يحب الرفق ويعطي على الرفق ما لا يعطي على العنف».","ref":"ص 6"}],"14":[{"q":"ما أول ما يجب على المربية قبل غرس القيم والأخلاق في الأولاد؟","options":["أن تعاقب الأولاد","أن تحفظ الأحاديث","أن تترك الأمر للمدرسة","أن تتحلى هي بها وتصحح أخلاقها وقيمها"],"answer":3,"why":"فلا يغرس القيمة من يفقدها، ولا يغرس الأخلاق الحسنة من يتعامل بالخلق السيئ.","ref":"ص 2"},{"q":"ما علامات المنافق الثلاث في الحديث؟","options":["إذا حدّث كذب وإذا وعد أخلف وإذا اؤتمن خان","الكسل والبخل والغضب","الكذب والغش والسرقة","النميمة والغيبة والحسد"],"answer":0,"why":"«آية المنافق ثلاث: إذا حدّث كذب، وإذا وعد أخلف، وإذا اؤتمن خان».","ref":"ص 2"},{"q":"ما المقصود بالنفاق في هذه الأحاديث (خصال المنافق)؟","options":["النفاق الاعتقادي المخرج من الملة","النفاق العملي الذي لا يخرج من الإسلام لكنه من كبائر الذنوب ويُخشى على صاحبه","الكفر الصريح","الشرك الأكبر"],"answer":1,"why":"النفاق العملي من أكبر الكبائر ويُخشى أن ينتقل صاحبه إلى النفاق الاعتقادي.","ref":"ص 2"},{"q":"ما الفائدة من ذكر العدد (ثلاث، أربع) قبل التفصيل في الحديث؟","options":["إخفاء المعنى","شد الذهن وتشويق السامع للتفصيل","الاختصار فقط","إرباك الحافظ"],"answer":1,"why":"هي طريقة تعليمية: ذكر العدد قبل التفصيل إبهام فيه شدّ للذهن.","ref":"ص 3"},{"q":"ما حكم من وعد ونوى الوفاء ثم منعه عذر قاهر من الوفاء؟","options":["منافق","مُذنب","عليه كفارة","غير ملوم ولا يكون منافقًا وينبغي أن يبدي عذره"],"answer":3,"why":"أما من وعد وهو ينوي الإخلاف فهو من أسوأ صور إخلاف الوعد.","ref":"ص 4"},{"q":"بماذا أجاب الإمام أحمد حين سُئل: بمَ تعرف الكذابين؟","options":["بالتناقض","بقلة الكلام","بخُلف المواعيد","بكثرة الحلف"],"answer":2,"why":"فإن الكذاب يُعرف بإخلاف المواعيد.","ref":"ص 4"},{"q":"أي مما يلي يدخل في خيانة الأمانة؟","options":["إفشاء الأسرار والتفريط في تربية الأولاد أو أداء الوظيفة","الصلاة في وقتها","كثرة الصدقة","طاعة الوالدين"],"answer":0,"why":"الأم في بيتها مؤتمنة على تربية أولادها، وكذلك المعلم والموظف.","ref":"ص 4"},{"q":"ما المراد بـ«وإذا خاصم فجر»؟","options":["أن يرفع صوته فقط","أن يترك الخصومة","أن يدّعي ما ليس له أو يزيد على حقه أو يشهد زورًا أو يحلف كاذبًا في الخصومة","أن يعتذر"],"answer":2,"why":"ومثل ذلك ما يحصل في خصومات الزوجين عند الطلاق.","ref":"ص 5"},{"q":"ما حكم أن يقوم المسلم إلى الصلاة كسلان ويسرع فيها ويَنقُرها؟","options":["من السنة","مباح","من صفات المنافقين، كما في قوله تعالى: «وإذا قاموا إلى الصلاة قاموا كسالى»","لا شيء فيه"],"answer":2,"why":"ووصف ﷺ صلاة المنافق: «ينقرها أربعًا لا يذكر الله فيها إلا قليلًا».","ref":"ص 5"},{"q":"ماذا قال النبي ﷺ عن شعب الإيمان في الحديث الذي ذكر الحياء؟","options":["أفضلها الصلاة وأدناها الحياء","أفضلها قول لا إله إلا الله وأدناها إماطة الأذى عن الطريق والحياء شعبة من الإيمان","كلها متساوية","الحياء ليس منها"],"answer":1,"why":"الإيمان بضع وسبعون شعبة، وقال: «الحياء من الإيمان»، و«الحياء لا يأتي إلا بخير».","ref":"ص 6"}],"15":[{"q":"ماذا طلبت أم سليم رضي الله عنها من النبي ﷺ لابنها أنس؟","options":["أن يعطيه مالًا","أن يدعو له","أن يعلمه","أن يزوجه"],"answer":1,"why":"قالت: «يا رسول الله خادمك أنس ادع الله له»، فدعا ﷺ له بكثرة المال والولد والبركة فيما أعطاه.","ref":"ص 2"},{"q":"ما الأساس في الدعاء في كل أمر دنيوي بحسب الدرس؟","options":["الدعاء بالبركة","كثرة الدعاء بالمال","الدعاء بالولد فقط","عدم الدعاء بالدنيا"],"answer":0,"why":"كثرة المال قد تكون وبالًا على صاحبه إن لم يباركه الله.","ref":"ص 2"},{"q":"ما الدليل على أن هذا الحديث من دلائل نبوته ﷺ؟","options":["استجاب الله دعاءه لأنس فكثر ماله وولده وكان بستانه يثمر مرتين","رؤياه لأنس","قوة بدنه","علمه بالغيب فقط"],"answer":0,"why":"قال أنس: «ولقد دفنت من صلبي سوى ولد ولدي مائة وخمسًا وعشرين».","ref":"ص 3"},{"q":"ماذا قال النبي ﷺ عن الدعاء على الأولاد؟","options":["يجوز الدعاء عليهم عند الغضب","الدعاء على الأولاد واجب","لا أثر له","«لا تدعوا على أنفسكم ولا على أولادكم... لا توافقوا من الله ساعة يُسأل فيها عطاء فيستجيب لكم»"],"answer":3,"why":"فدعوة الوالدين مستجابة، فيجب تجنب الدعاء على الأولاد.","ref":"ص 3"},{"q":"بماذا دعا إبراهيم عليه السلام لذريته في آية «واجنبني وبنيَّ أن نعبد الأصنام»؟","options":["أن يرزقهم المال","أن يعطيهم الملك","أن يجنبهم الشرك والكفر والإلحاد","أن يعطيهم الجاه"],"answer":2,"why":"وفي دعوة أخرى: «ليقيموا الصلاة فاجعل أفئدة من الناس تهوي إليهم وارزقهم من الثمرات».","ref":"ص 3"},{"q":"ما الدعاء القرآني الذي يجمع صلاح الزوجة والذرية؟","options":["ربنا هب لنا من أزواجنا وذرياتنا قرة أعين واجعلنا للمتقين إمامًا","ربنا آتنا في الدنيا حسنة","ربنا تقبل منا","رب اشرح لي صدري"],"answer":0,"why":"من دعاء عباد الرحمن في سورة الفرقان.","ref":"ص 4"},{"q":"كيف يجمع الدرس بين آية «إنما أموالكم وأولادكم فتنة» ودعاء النبي ﷺ لأنس بكثرة المال والولد؟","options":["لا تعارض بين الأمرين","المال والولد ابتلاء من الله، وقد يكونان خيرًا وبركة وقد يكونان وبالًا حسب القيام بحقهما","الآية منسوخة","الحديث ضعيف"],"answer":1,"why":"ليس المقصود أن المال والأولاد شر، فالولد الصالح يدعو لوالديه.","ref":"ص 5"},{"q":"بماذا كان النبي ﷺ يعوّذ الحسن والحسين؟","options":["بالمعوذتين فقط","بآية الكرسي فقط","«أعيذكما بكلمات الله التامة من كل شيطان وهامة ومن كل عين لامّة»","بالفاتحة"],"answer":2,"why":"وكان يقول إن أباكما إبراهيم كان يعوّذ بها إسماعيل وإسحاق.","ref":"ص 5"},{"q":"ما المقصود بـ«هامة» في الحديث؟","options":["الجن فقط","الريح","الطير","كل ما يسمّ ويقتل كالحيات والعقارب أو ما يؤذي الإنسان من حيوانات وحشرات"],"answer":3,"why":"و«لامّة»: كل عين سوء تصيب بالضرر.","ref":"ص 6"},{"q":"بماذا دعا النبي ﷺ لابن عباس رضي الله عنهما حين وضع له وضوءه؟","options":["«اللهم زده مالًا»","«اللهم بارك له في ولده»","«اللهم اجعله حافظًا»","«اللهم فقهه في الدين»"],"answer":3,"why":"فصار أكثر الصحابة فتوى وتفسيرًا، وقال ﷺ: «من يرد الله به خيرًا يفقهه في الدين».","ref":"ص 6"}]},"s2":{"1":[{"q":"ما القاعدة التي ذكرها الدرس عن أداء حق الله عز وجل؟","options":["أن يكتفي المسلم بتدينه الذاتي الشخصي","لا أستطيع أداء حق الله بمجرد اعتنائي بتديني الذاتي فقط","العبادة الفردية تكفي","الدعوة تكفي عن العبادة"],"answer":1,"why":"من العبادات المتعدية: تربية الأولاد والدعوة إلى الله والأمر بالمعروف والنهي عن المنكر.","ref":"ص 2"},{"q":"ماذا قال النبي ﷺ في حال من يضيّع من يقوت؟","options":["لا شيء عليه","كفى بالمرء إثمًا أن يضيّع من يقوت","عليه كفارة","أمره إلى الله فقط"],"answer":1,"why":"الحديث يصف حجم الإثم الذي يقع على من ضيّع رعيته من أبناء وبنات وزوجة.","ref":"ص 2"},{"q":"ما الآية التي تأمر بوقاية الأهل من النار؟","options":["﴿يا أيها الذين آمنوا قوا أنفسكم وأهليكم نارًا﴾","﴿وأقم الصلاة﴾","﴿ربنا آتنا في الدنيا حسنة﴾","﴿يا أيها الناس اتقوا ربكم﴾"],"answer":0,"why":"فالنجاة لا تقتصر على النفس بل تشمل من هم تحت رعايتنا.","ref":"ص 3"},{"q":"ما معنى «التربية استثمار مستقبلي» على المستوى الفردي؟","options":["الربح المادي فقط","استمرار العمل الصالح بعد الموت كولد صالح يدعو له","كسب الشهرة","تحقيق الرغبات الشخصية"],"answer":1,"why":"كما في حديث «إذا مات الإنسان انقطع عمله إلا من ثلاث: صدقة جارية أو علم ينتفع به أو ولد صالح يدعو له».","ref":"ص 4"},{"q":"ما معنى الاستثمار على المستوى الجماعي؟","options":["قوة الدول تتعلق بقوة أفرادها وبناء جيل واعٍ ينعكس إيجابًا على الأمة","زيادة المال","السيطرة العسكرية","توسع المدن"],"answer":0,"why":"فبناء جيل مثقف قائم على ما يريده الله ينعكس على الأمة كلها.","ref":"ص 4"},{"q":"ما الذي يضمنه حسن تربية الأولاد غير الأجر المستقبلي؟","options":["لا شيء","الغنى","عدم الخسارة وكسب الآثام مثل أن يسب الولد أبا غيره فيسب أباه","طول العمر"],"answer":2,"why":"قال ﷺ: «من الكبائر شتم الرجل والديه»، قالوا: وهل يشتم؟ قال: «نعم يسب أبا الرجل فيسب أباه».","ref":"ص 4"},{"q":"ما الذي يصنع التفاوت بين الآباء في الاستثمار في أولادهم؟","options":["مستوى الدخل","عدد الأولاد","مستوى التعليم فقط","المفهوم المستقر في أذهانهم عن دورهم في الحياة"],"answer":3,"why":"كلما اتسع المفهوم وارتقى زاد الاجتهاد في التربية.","ref":"ص 4"},{"q":"أي مما يلي من معاني التربية التي تعزز الوعي بالمسؤولية؟","options":["جمع المال","كسب الوجاهة","القيام بأمر الله في الأرض وتحقيق العبودية لله والسمو الأخلاقي","تحقيق الرغبات"],"answer":2,"why":"والأخلاق في النصوص معيار للتفاضل كحديث «خيركم خيركم لأهله».","ref":"ص 5"},{"q":"ما التربية المقصودة؟","options":["التربية العشوائية وفق الظروف","التربية بالعقاب فقط","التربية بالمدرسة فقط","التربية القائمة على رؤية وتحليل وخطة"],"answer":3,"why":"وهي عكس التربية التلقائية التي تخضع لمزاج المربي بلا تخطيط.","ref":"ص 5"},{"q":"هل التربية التلقائية خاطئة كلها بحسب الدرس؟","options":["نعم","نعم لأنها غير منظمة","لا، فهناك مواقف عارضة تفرض نفسها وتهيئ جوًّا للتربية كقصة المرأة من السبي مع ولدها","لا توجد تربية تلقائية"],"answer":2,"why":"وظّف النبي ﷺ مشهد المرأة التي أرضعت صبيًّا من السبي ليبيّن سعة رحمة الله.","ref":"ص 6"}],"2":[{"q":"ما القاعدة الشرعية التي يستند إليها استحقاق الوالدين للبر بحسب الدرس؟","options":["الغرم بالغنم","الأمر بالمعروف","اليسر لا العسر","الأعمال بالنيات"],"answer":0,"why":"بقدر ما يقدمه الوالدان من القيام بالاحتياجات وحسن الرعاية والتعاهد والتربية يكون لهما من الاستحقاقات.","ref":"ص 2"},{"q":"ما أول وظيفة تربوية للأم بحسب الدرس؟","options":["الاحتواء","العقاب","التعليم المدرسي","الإنفاق"],"answer":0,"why":"الاحتواء أشبه بالكف أو الحضن الذي يأوي إليه الطفل في طفولته المبكرة.","ref":"ص 2"},{"q":"ما الذي يندرج تحت الرعاية الصحية في الاحتواء؟","options":["الاهتمام بالتعليم","الإرضاع والاهتمام بصحة الطفل العامة","الاهتمام بالمال","تنظيم الوقت"],"answer":1,"why":"فالصحة أساس مهم، وكان العرب يرون أن رضاعة الطفل من البادية خير من الحضر.","ref":"ص 2"},{"q":"أي مما يلي من صور الرعاية النفسية للطفل؟","options":["عدم تعريضه للانفعالات الحادة وعدم إهمال بكائه ومشاعره","تجاهل بكائه","تأجيل احتياجاته","توبيخه"],"answer":0,"why":"والنفس وعاء للروح، فاهتمام الأم بالجانب النفسي بالغ الأهمية.","ref":"ص 3"},{"q":"لماذا يُنمّي الكلام عن المشاعر لدى الطفل الجانب العقلي والمعرفي؟","options":["لأنه يسليه","لأنه يشغله","لا علاقة لذلك بالعقل","لأن التعبير العميق عن المشاعر ينمي الجوانب العقلية والنفسية"],"answer":3,"why":"وهي مهارة لا بد للأم أن تتعلمها.","ref":"ص 4"},{"q":"ما المقصود بوظيفة «الفهم والتفهم» للأم؟","options":["أن تفرض رأيها","أن تفهم شخصيات أولادها وسلوكهم وطباعهم فهمًا عميقًا وتتقبلهم","أن تقارن بينهم","أن تتجاهل خصوصياتهم"],"answer":1,"why":"وتقبّل الوالدين لأولادهم أمر مفروض وليس قضية اختيارية.","ref":"ص 5"},{"q":"ما حكم أن يتقبل الأب ولدًا ولا يتقبل آخر؟","options":["جائز لأنه حر في ذلك","ظلم للأولاد وإن كان له تفسير، والخطأ يبقى خطأً","حسن إن كان لسبب","واجب إن كان أحدهما أذكى"],"answer":1,"why":"فتفسير الانحياز لا يعني أن الانحياز مبرر.","ref":"ص 5"},{"q":"ماذا يعني «الأمان من المزاجية» في العلاقة الآمنة؟","options":["أن لا يغضب الوالدان أبدًا","أن يوافقا على كل ما يطلب الأولاد","أن تكون ردود فعل الوالدين منضبطة ومفهومة وليست خاضعة لتقلب المزاج","أن يتجنبا الأولاد"],"answer":2,"why":"فالطفل لا يستطيع أن يتوقع سلوك أبويه إن كان متقلبًا فتتزعزع العلاقة.","ref":"ص 6"},{"q":"ما الأثر السلبي لعدم فهم الابن لخلفيات تقلب سلوك والديه؟","options":["زيادة الثقة","النضج المبكر","الشعور بأن الأمر مجرد مزاج مما يؤدي إلى أثر سلبي وعدم تحقق الأمان","الطاعة العمياء"],"answer":2,"why":"لا بد من التزام واستقرار عند الوالدين لتتحقق العلاقة الآمنة.","ref":"ص 6"},{"q":"أي مما يلي من مفاهيم العلاقة الآمنة؟","options":["أن تكشف أسرار الأولاد للأقارب","أن تكون شرطية بدل أن تكون أمًّا","أن تعاقب على كل خطأ","أن تكون الأم مكانًا آمنًا للأسرار"],"answer":3,"why":"فإذا لم تُصَن الأسرار في الأسرة فلن تكون العلاقة آمنة.","ref":"ص 6"}],"3":[{"q":"ما المحور الأول لمفهوم التربية في الإسلام؟","options":["المصدر: الخبرة الشخصية","المصدر: ربّاني، فالتربية رسالة ربانية وليست مزاجًا شخصيًّا","المصدر: المدرسة","المصدر: العُرف"],"answer":1,"why":"فلا يتدخل المربي في ماهية التربية، وإنما في آليتها وأدواتها ووسائلها.","ref":"ص 2"},{"q":"ما الصفة الأكثر أهمية في بناء شخصية المربّي بحسب الدرس؟","options":["القوة","الصرامة","الذكاء","التوازن"],"answer":3,"why":"فالشمولية والتوازن من صلب المفهوم الإسلامي للتربية.","ref":"ص 2"},{"q":"ما الذي قاله النبي ﷺ للثلاثة الذين تقالّوا عبادته؟","options":["أحسنتم","«لكني أصوم وأفطر وأصلي وأرقد وأتزوج النساء فمن رغب عن سنتي فليس مني»","زيدوا في العبادة","اتركوا الدنيا"],"answer":1,"why":"والحديث يدل على التربية النبوية على التوازن.","ref":"ص 2"},{"q":"ماذا قال سلمان الفارسي لأبي الدرداء رضي الله عنهما؟","options":["قم الآن للصلاة","صم أكثر","«إن لربك عليك حقًّا ولنفسك عليك حقًّا ولأهلك عليك حقًّا فأعطِ كل ذي حق حقه»","اترك الأهل"],"answer":2,"why":"فقال النبي ﷺ: «صدق سلمان».","ref":"ص 3"},{"q":"ما الخطأ الذي يقع فيه كثير من المربين بحسب الدرس؟","options":["الميل إلى ما يحبونه أو يتميزون فيه عند تربية أولادهم","إهمال المال","الإفراط في العقاب","عدم تنظيم الوقت"],"answer":0,"why":"فمن يحب الأدب يوجّه أبناءه نحوه، وهذا خلل يؤدي إلى عدم التوازن.","ref":"ص 3"},{"q":"ما المقصود بالمربي الاستراتيجي؟","options":["الذي يرى الصورة كاملة من الأعلى ويدرك احتياجات أولاده والهدف البعيد","الذي ينشغل بالتفاصيل اليومية","الذي يعتمد على المعلمين","الذي يعتمد العقاب"],"answer":0,"why":"بخلاف المربي التكتيكي الذي تحجبه التفاصيل الصغيرة عن رؤية المشهد.","ref":"ص 3"},{"q":"ما الفرق بين التربية الأفقية والتربية العمودية؟","options":["الأفقية في المنزل والعمودية في المدرسة","الأفقية للكبار والعمودية للصغار","لا فرق","الأفقية: قاعدة عريضة في جوانب كثيرة، والعمودية: نقطة قوة وارتكاز يتميز بها المتربي"],"answer":3,"why":"والتوازن بينهما مطلوب.","ref":"ص 4"},{"q":"ما الخطأ في الاكتفاء بنقاط التميز التي يلاحظها المربي في أولاده؟","options":["لا خطأ فيه","يظلم المتربي لأنه يُغفل جوانب أخرى مهمة كان ينبغي بناؤها","يضعف الجانب المتميز","يُثقل الولد"],"answer":1,"why":"مثل فقيه لا يحسن تلاوة القرآن بسبب ضعف التوازن.","ref":"ص 4"},{"q":"ما حكم التربية النظرية دون عملية أو العكس؟","options":["النظرية كافية","العملية كافية","كلاهما خطأ، فالإنسان يحتاج إلى قاعدة نظرية تؤسس فهمه وإلى خوض عملي يصقل ما تعلمه","لا بأس بأحدهما"],"answer":2,"why":"فقد يشحن المربي المتربي بكم معرفي على حساب العملي أو يرى النظري بلا قيمة.","ref":"ص 4"},{"q":"لماذا قال النبي ﷺ لأبي ذر: «لا تولّينّ على اثنين ولا تَلِيَنَّ مال يتيم»؟","options":["لأنه ظلمه","لأنه عاقبه","لأنه رآه ضعيفًا لا يناسبه ذلك، حرصًا عليه مع احترام قدراته","لأنه لا يعرف الحساب"],"answer":2,"why":"فكان يرشد كل واحد إلى ما يناسب حاله، وهذا من التوازن بين القدرات والطموحات.","ref":"ص 5"}],"4":[{"q":"ما الصفة الحاكمة التي تتحكم في كل صفات الأم الناجحة؟","options":["الحزم","الصبر","الحنان","التوازن"],"answer":3,"why":"فمن خلاله تقدم القدر اللازم من الرحمة والشدة والعقوبة والاحتواء، ويعبر عنه بالحكمة.","ref":"ص 2"},{"q":"ما صورة غياب التوازن في التعامل مع الأولاد؟","options":["الاهتمام بالجميع بالتساوي","التفضيل أو الاهتمام المبالغ فيه بأحدهم لميزة أو لحاجة فيشعر الآخرون بالإهمال","تفقد احتياجات المريض","اللين مع الجميع"],"answer":1,"why":"ولا يعني ذلك ألا يراعي الوالدان حاجة بعض الأولاد في حالات معينة.","ref":"ص 2"},{"q":"ما «النجاح المزيف» الذي ذكره الدرس؟","options":["نجاح لا يعلنه صاحبه","نجاح في جانب على حساب إهمال بقية الجوانب والأدوار","نجاح بلا تعب","نجاح الأم في تربية الأولاد"],"answer":1,"why":"فالنجاح الحقيقي لا يُبنى على فشل.","ref":"ص 3"},{"q":"ماذا كانت وصية النبي ﷺ للرجل الذي قال له: أوصني؟","options":["اتق الله","صل الرحم","لا تغضب (كررها مرارًا)","اصبر"],"answer":2,"why":"فاختار من بين الأخلاق وصية جامعة وهي ترك الغضب.","ref":"ص 3"},{"q":"كيف وصف ابن القيم الغضب؟","options":["أحد الأصول الثلاثة للأخلاق السيئة مع الكبر والشهوة","أضعف الانفعالات","مفتاح الخير","شعور بشري عادي لا ضرر منه"],"answer":0,"why":"الغضب ينشأ عنه البطش والظلم والضرب والكلام البذيء والقتل.","ref":"ص 3"},{"q":"ماذا كان يفعل النبي ﷺ إذا غضب؟","options":["يرفع صوته","يسكت","يترك المجلس","يضرب"],"answer":1,"why":"وكان يوصي أصحابه بذلك، وضبط الانفعال يشمل ضبط الفرح أيضًا.","ref":"ص 4"},{"q":"ما موقف النبي ﷺ من الأعرابي الذي قال: «تقبّلون الصبيان؟ فما نقبلهم»؟","options":["أقرّه","أمره بالتقبيل","سكت","قال: «أوَ أملك لك أن نزع الله من قلبك الرحمة؟»"],"answer":3,"why":"وفيه ضرورة إظهار الحنان للأولاد.","ref":"ص 4"},{"q":"بمَ يكون إظهار الحنان والاحتواء الحقيقي؟","options":["بالكلمات والأحضان مع الأفعال، كتفريغ الوقت وتقبل الأخطاء","بالكلمات فقط","بالهدايا فقط","بالمال"],"answer":0,"why":"فالحب الحقيقي يعني الاهتمام بمشكلاتهم ومساعدتهم على حلها.","ref":"ص 4"},{"q":"ما مهارة «الجذب» لدى الأم المربية؟","options":["أن تجعل من نفسها قدوة جاذبة يقلدها أولادها تلقائيًّا","أن تجذب الأولاد بالمال","أن تفرض عليهم رأيها","أن تقارن بينهم"],"answer":0,"why":"وهي عكس النفرة؛ فالأم القدوة مدرسة يومية.","ref":"ص 5"},{"q":"أي مما يلي من صفات الأم الجاذبة؟","options":["أن تكون متعلمة صاحبة شهادة","أن تكون مصدرًا للأوامر فقط","أن تكون متوازنة ضابطة لانفعالاتها على قدر من الوعي والثقافة","أن تكون حازمة دائمًا"],"answer":2,"why":"وليس بالضرورة أن تكون صاحبة شهادة بل بالاطلاع والقراءة والتأمل.","ref":"ص 5"}],"5":[{"q":"ما المقصود بـ«وزن السلوك الإيجابي» عند الأم الحكيمة؟","options":["اختيار السلوك الأسهل","اختيار السلوك الأكثر شدة","اختيار السلوك الصائب مع ضبط المقدار الذي يحتاجه ليكون صحيحًا بلا إفراط ولا تفريط","اتباع السلوك الأكثر شيوعًا"],"answer":2,"why":"فالشجاعة إن بالغت صارت تهورًا وإن ضعفت صارت جبنًا.","ref":"ص 2"},{"q":"ماذا تعني «القدرة على استشراف المستقبل» للمربية؟","options":["أن تعرف الغيب","أن تتنبأ بسلوك الأولاد","أن تتجنب التفكير","ألا تستغرق في لحظتها الحالية بل تستشرف احتياجات المستقبل"],"answer":3,"why":"وكلما كانت أكثر حكمة كانت استشرافاتها أدق.","ref":"ص 2"},{"q":"ما الذي ورد في الحديث عن «السمت الحسن والتؤدة والاقتصاد»؟","options":["أنها من أركان الإيمان","أنها جزء من أربعة وعشرين جزءًا من النبوة","أنها من الفرائض","أنها من خصال المنافقين"],"answer":1,"why":"والتؤدة هي صفة الهدوء، والعجلة ترتبط بقلة الحكمة.","ref":"ص 2"},{"q":"ما المقصود بـ«القدرة على التوظيف»؟","options":["توظيف الأولاد في العمل","توجيه قدرات المتربين وتوظيفها توجيهًا إيجابيًّا بعد قراءة شخصياتهم","استخدام الأولاد في الخدمة","اختيار الخادمات"],"answer":1,"why":"ومن حكمة النبي ﷺ أنه كان يراعي أحوال السائلين فيجيب كلًّا بما يناسبه.","ref":"ص 3"},{"q":"ما أهمية «اللغة العلمية» للمربية؟","options":["أنها تبهر الناس","أنها تلزم بالفصحى","أنها أداة التوجيه العليا وكل كلمة تندرج تحت المسؤولية الشرعية والتربوية","أنها للتسلية"],"answer":2,"why":"ونهى النبي ﷺ عن الدعاء على الولد وإن لم تقصده الأم لأنه قد يوافق ساعة إجابة.","ref":"ص 3"},{"q":"ما معنى «عدم الاستغراق في اللحظة الحاضرة»؟","options":["أن تتحرر المربية من الانغماس في الضغط اليومي وتفكر بشكل أعمق وأكثر مسؤولية","ألا تهتم باللحظة","ألا تتذكر الماضي","ألا تخطط"],"answer":0,"why":"فالاحتكاكات اليومية والمشاكل المتكررة تجعل تجاوز اللحظة صعبًا.","ref":"ص 4"},{"q":"ما أول أساليب تنمية الحكمة (ب) بحسب الدرس؟","options":["تقييم الماضي","تأجيل الرغبات","مراعاة الفروق الفردية","مصلحة الأولاد وعدم الانشغال بنظرة الناس وسمعتها"],"answer":3,"why":"كمن يضرب ابنها ليُرضي الآخرين لا لمصلحة الطفل.","ref":"ص 4"},{"q":"ما المقصود بـ«تأجيل الرغبات»؟","options":["تأجيل رغبات المربي والمتربي معًا لأن الرغبات مقرونة بالمشاعر وكلما غلبت المشاعر ضعفت الحكمة","منع الأولاد من رغباتهم","تحقيق الرغبات فورًا","إهمال الرغبات"],"answer":0,"why":"وهي من أساليب تنمية الحكمة.","ref":"ص 5"},{"q":"ما المقصود بـ«مراعاة الفروق الفردية» في التربية؟","options":["أن تفرق بين الذكر والأنثى","أن تفضل أحدهم","ألا تعتمد نظامًا واحدًا بل تنظر إلى كل طفل واحتياجاته كمشروع مستقل","أن تهمل الأصغر"],"answer":2,"why":"وتُسمى التربية الفردية.","ref":"ص 5"},{"q":"ما العبرة من قصة عمر بن الخطاب رضي الله عنه مع الرجل الذي شكا عقوق ابنه؟","options":["أن الابن مخطئ","أن الأب قد عقّ ابنه قبل أن يعقه إذ لم يختر أمه ولم يحسّن اسمه ولم يعلمه الكتاب","أن الأم ليست مؤثرة","أن العقوق لا يعالج"],"answer":1,"why":"قال عمر: «جئت تشكو عقوق ابنك وقد عققته قبل أن يعقك».","ref":"ص 6"}],"6":[{"q":"لماذا اختار الدرس السلف نماذج للاقتداء؟","options":["لأنهم الأغنى","لأنهم الأكثر فهمًا لروح الإسلام والأقرب لنبيه ﷺ ولهم شهادة تزكية من النبي ﷺ","لأنهم الأكثر علمًا بالدنيا","لأنهم الأقدم"],"answer":1,"why":"قال ﷺ: «خير القرون قرني ثم الذين يلونهم ثم الذين يلونهم».","ref":"ص 2"},{"q":"ما أقوى الوسائل التربوية وأنجحها بحسب الدرس؟","options":["الوعظ","العقاب","الثواب","القدوة"],"answer":3,"why":"مهما تعددت الوسائل يبقى تأثير القدوة أعمق في نفس المتربي.","ref":"ص 2"},{"q":"لماذا اختار الله القدوة وسيلة لرسله عليهم السلام؟","options":["لأن الدين لا ينتقل كاملًا بمجرد سماع المعلومة بل بتجسده في سلوك عملي يحتذى","لأن الأنبياء لا يتكلمون","لأن الكتب لا تكفي","لأن الناس لا يقرؤون"],"answer":0,"why":"فلم يكن الأنبياء مجرد مبلغين بل أصدق الناس تمثلًا لما أُمروا به.","ref":"ص 3"},{"q":"ما معنى قول الدرس: «القدوة وسيلة تؤثر في جميع الشرائح»؟","options":["تؤثر في الأغنياء فقط","تؤثر في الغني والفقير والعالم والجاهل وحتى الكافر","تؤثر في المتعلمين","تؤثر في المسلمين فقط"],"answer":1,"why":"فليست مختصة بفئة نخبوية، وقد يعجب غير المسلمين بقيم كالشجاعة والثبات.","ref":"ص 3"},{"q":"أي من جانبي القدوة في سيرة فاطمة رضي الله عنها ذكره الدرس؟","options":["كثرة مالها","كثرة علمها","كثرة أسفارها","زهدها وتواضعها، وتربيتها لأبنائها الحسن والحسين"],"answer":3,"why":"وهما سيدا شباب أهل الجنة.","ref":"ص 4"},{"q":"بماذا أرشدها النبي ﷺ حين طلبت خادمًا؟","options":["أن تسبح وتحمد وتكبر ثلاثًا وثلاثين عند النوم","أن تعمل أكثر","أن تستعين بالجيران","أن تصبر فقط"],"answer":0,"why":"فهو خير لها مما سألت، وبقيت على ذلك رغم الحاجة.","ref":"ص 4"},{"q":"ما الذي قاله النبي ﷺ عن الحسن رضي الله عنه؟","options":["إنه سيكون خليفة","إنه سيهاجر","إن ابني هذا سيد ولعل الله أن يصلح به بين فئتين عظيمتين من المسلمين","إنه عالم"],"answer":2,"why":"وكان ذلك حين تنازل عن الخلافة لمعاوية حقنًا لدماء المسلمين.","ref":"ص 5"},{"q":"بماذا اشترطت أم سليم على أبي طلحة مهرًا؟","options":["إسلامه","مالًا كثيرًا","هجرته","بيتًا"],"answer":0,"why":"فأسلم وتزوجها، وفي ذلك تقديم الإسلام على الزوج.","ref":"ص 5"},{"q":"ما الذي فعلته أم سليم حين مات أحد أبنائها وجاء زوجها من السفر؟","options":["أخبرته فورًا","أخفت الخبر وهيأت له الطعام والراحة ثم أخبرته صباحًا","طلبت منه الرحيل","بكت أمامه"],"answer":1,"why":"وهذا من الصبر والحكمة، فعوضها الله ببركة دعاء النبي ﷺ.","ref":"ص 5"},{"q":"ما الذي فعلته أم سليم لتأهيل ابنها أنس رضي الله عنه؟","options":["أرسلته للتجارة","علمته الفروسية فقط","علمته القراءة والكتابة مبكرًا وقدمته خادمًا للنبي ﷺ وهو ابن ثماني سنوات","أرسلته للبادية"],"answer":2,"why":"فصار حافظًا للوحي وكاتبًا له ومن علماء الصحابة.","ref":"ص 5"}],"7":[{"q":"ماذا يعني إعطاء التربية «أولوية عليا» ضمن المهام الحياتية؟","options":["أن تُهمل الدراسة","أن تُقدَّم على كثير من الانشغالات الحياتية الأخرى لأنها من أعظم المسؤوليات وأجل الأمانات","أن تكون هي المهمة الوحيدة","أن يُترك الأمر للمدرسة"],"answer":1,"why":"وقد تضحي الأسرة ببعض الانشغالات من أجل التربية.","ref":"ص 2"},{"q":"ما دلالة استنفار الأسرة للتحصيل الدراسي مع قلة الاستنفار للثغرات التربوية؟","options":["أن الدراسة أهم","أن التربية سهلة","أن الأبناء ملتزمون","أن الأولوية في أذهانهم للتحصيل لا للتربية"],"answer":3,"why":"فالمقارنة بين الأمرين توضح ما يستحوذ على الاهتمام الأكبر.","ref":"ص 2"},{"q":"ما دلالة أن تكون الصبغة العامة في البيت «التلبية» لكل ما يريده الابن؟","options":["أن التربية قوية","أن الأولاد سعداء","أن الأسرة ناجحة","أن التربية غائبة بسبب الدلال أو السعي إلى راحة البال"],"answer":3,"why":"فالاستجابة تُقدَّم على التوجيه والتربية.","ref":"ص 2"},{"q":"ما الذي يجب أن يتحرر منه المربي ليكون ناجحًا؟","options":["المال","الوقت","الأنانية","الدراسة"],"answer":2,"why":"وأن يجعل لأولاده مكانة عالية في مشروع حياته.","ref":"ص 3"},{"q":"أي مما يلي من «ضرائب» التربية الناجحة التي ذكرها الدرس؟","options":["القراءة وحضور الدورات وطلب الاستشارة ومراجعة النفس وتطوير المهارات","تقليل الكلام","الانعزال","السفر"],"answer":0,"why":"فإن لم تكن مستعدة لتحمل التكاليف فرغبتها أقرب إلى الدعوى منها إلى العزم.","ref":"ص 3"},{"q":"ما الفرق بين الحلم والهدف بحسب الدرس؟","options":["لا فرق","الحلم أكثر واقعية","الهدف له خطة ومراحل وخطوات عملية، أما الحلم فمجرد أمنيات","الهدف بلا عمل"],"answer":2,"why":"فقد تتبدد الأحلام عند مواجهة الواقع إذا لم يصاحبها عمل وبذل.","ref":"ص 3"},{"q":"ما أبرز صفة تجعل الأب والأم مؤثرين حقًّا؟","options":["أنهما قيميان (لديهما قيم وتأهيل ديني)","مهاراتهما المعرفية فقط","مهاراتهما السلوكية فقط","مستواهما الاجتماعي"],"answer":0,"why":"فضعف القيم والروح والأخلاق يجعل المهارات خاوية.","ref":"ص 4"},{"q":"ما المقصود بـ«الوعي بالذات» لدى المربي؟","options":["معرفة نقاط قوته وضعفه وأولوياته وما يؤثر في تعامله مع الأولاد","معرفة ذكائه","معرفة مظهره","معرفة ماله"],"answer":0,"why":"فالوعي بنقاط الضعف يجعله أكثر إنصافًا واتزانًا.","ref":"ص 4"},{"q":"ما المقصود بـ«الهشاشة النفسية» لدى بعض الناس؟","options":["قوة التحمل","الهدوء","العناد","التأثر بالأحداث بصورة مبالغ فيها: قلق وخوف سريع وظنون تعوقه عن دوره التربوي"],"answer":3,"why":"ومن هنا أهمية بناء الصلابة النفسية.","ref":"ص 5"},{"q":"ما الخطأ في أن تعتمد الأم في التربية على مقاطع التواصل الاجتماعي مجهولة المصدر؟","options":["لا خطأ فيه","تتشكل العقلية التربوية من خليط معارف عابرة وتجارب فتقع الطامة الكبرى","هو كافٍ","هو أسرع طريقة"],"answer":1,"why":"فالتربية مسؤولية عظيمة وحساسة، والواجب الاستعداد المعرفي.","ref":"ص 5"}],"8":[{"q":"ما المرجعية التي يجب أن تقوم عليها العملية التربوية للأم المربية؟","options":["العادات والتقاليد","التجارب الشخصية","آراء الناس","المرجعية الشرعية فهي مصدر علوي نهائي في التوجيه"],"answer":3,"why":"فالخلفية الشرعية منبعها رباني فلا يشوبها الخطأ بحول الله.","ref":"ص 2"},{"q":"ما المقصود بـ«الخلفية المحفزة»؟","options":["أن تتعلم الفقه","أن تحفظ القرآن","أن تتعلم المرأة ما يستحضر الدافع والحافز لأداء العملية التربوية","أن تتقن مهارات التربية"],"answer":2,"why":"وتناسب من لديهم ترخٍّ أو قصور في الشعور بالمسؤولية.","ref":"ص 2"},{"q":"أي النصوص يندرج تحت الخلفية المحفزة؟","options":["﴿إنك لا تهدي من أحببت﴾","قصة نوح مع ابنه","أحاديث الذكر","﴿قوا أنفسكم وأهليكم نارًا﴾ و«كلكم راع» و«كفى بالمرء إثمًا أن يضيع من يعول»"],"answer":3,"why":"فهي تعظم شأن التربية وتوقظ الدافع إليها.","ref":"ص 3"},{"q":"ما المقصود بـ«الخلفية المثبتة»؟","options":["نصوص الأحكام","نصوص الفضائل","نصوص تثبت المربية على الاستمرار وعدم الإحباط إن لم ترَ النتائج","نصوص الغيبيات"],"answer":2,"why":"كقصص الأنبياء مع أبنائهم وآية ﴿إنك لا تهدي من أحببت﴾.","ref":"ص 3"},{"q":"ما الذي يطلب من المربية بحسب الخلفية المثبتة؟","options":["تحقيق النتائج بنفسها","ترك التربية إن لم تظهر نتائج","بذل السبب والعمل والاجتهاد، أما النتائج فبيد الله","الانتظار"],"answer":2,"why":"فاستحضار ذلك يحميها من الانهيار النفسي أو التوقف عن التربية.","ref":"ص 3"},{"q":"ما المقصود بـ«الخلفية المبصرة»؟","options":["الحفظ","العلم الشرعي الذي يبصّر الأم بالحلال والحرام والأحكام المتعلقة بالطفل والأسرة","الفراسة","علم النفس"],"answer":1,"why":"فلا تستطيع أن تربي أولادها وهي لا تعرف أحكام الطهارة والصلاة.","ref":"ص 4"},{"q":"أي مما يلي ليس من محتوى الخلفية المبصرة؟","options":["إتقان الرسم","معرفة الحلال والحرام في السلوكيات اليومية","فقه العبادات الأساسية للأولاد","الرد على الشبهات والتساؤلات من منظور شرعي"],"answer":0,"why":"فالخلفية المبصرة تشمل الحلال والحرام وفقه العبادات والقيم والرد على الشبهات.","ref":"ص 4"},{"q":"ما الغاية من تعلم العلم الشرعي بحسب الدرس؟","options":["الحصول على المكانة","المناظرة","مجرد الثقافة","العمل به وترجمته إلى واقع، لا الاستكثار أو الاستعلاء"],"answer":3,"why":"وجاء في ذلك قوله تعالى: ﴿كبر مقتًا عند الله أن تقولوا ما لا تفعلون﴾، وقيل: «يهتف العلم بالعمل فإن أجابه وإلا ارتحل».","ref":"ص 5"},{"q":"ما معنى «جعل الشريعة حاكمة على العادات والميول»؟","options":["أن تتبع العادات","أن يكون ما تفرضه الشريعة هو المطبَّق في الواقع على العادات والميول الشخصية","أن تترك الميول","أن تحكم بالتقاليد"],"answer":1,"why":"فالتوظيف الصحيح أن تحكم الشريعة على نمط التعامل مع الآخرين.","ref":"ص 5"},{"q":"ماذا قال النبي ﷺ عن فضل العالم على العابد؟","options":["فضل العالم على العابد كفضل القمر ليلة البدر على سائر الكواكب","العابد أفضل","هما سواء","لا فرق"],"answer":0,"why":"وأن العلماء ورثة الأنبياء، وأن الأنبياء لم يورّثوا ديناراً ولا درهماً.","ref":"ص 5"}],"9":[{"q":"بحسب الدرس، على أي أساس يُتعامل مع الطفولة؟","options":["أنها مرحلة التكليف","أنها مرحلة الإهمال","أنها مرحلة الفطرة النقية والصبغة الإيمانية العامة التي تشمل كل وليد","أنها مرحلة التسلية"],"answer":2,"why":"فكل مولود يولد على الفطرة السوية، والتكليف الشرعي مرتبط بالبلوغ.","ref":"ص 2"},{"q":"ما الذي ألزم به الإسلام الوالدين من الجانب الصحي والجسماني؟","options":["الإنفاق فقط","الرضاعة الطبيعية والرعاية الجسدية التامة وهو التزام لا يسقط حتى في حالات الفراق","تعليمه فقط","اللعب معه"],"answer":1,"why":"فيُحاط بالرعاية ولا يُحرم من احتياجاته البدنية والصحية.","ref":"ص 2"},{"q":"لماذا يُسمّى هذا الطور «المرحلة التمهيدية للتكليف»؟","options":["لأنها مرحلة العقاب","لأنها مرحلة الإلزام","لأنها بلا أهمية","لأنها تمهد للطفل مسار نشأته وتعده لتحمل المسؤولية عند البلوغ"],"answer":3,"why":"فالطفل مشروع مكلَّف في المستقبل.","ref":"ص 2"},{"q":"ما أثر عدم قيام الوالدين بدورهما في صياغة السوية النفسية للطفل؟","options":["لا أثر","يصبح مستقلًّا","غالبًا سيقع اضطراب نفسي يمتد أثره بعد البلوغ فيضعف قدرته على التعامل مع التكاليف","يقوى"],"answer":2,"why":"فالدين يقوم على الابتلاء والتكليف واجتياز الابتلاء يقتضي سوية نفسية راسخة.","ref":"ص 3"},{"q":"لماذا يُؤمر الصغير بالصلاة لسبع سنين وإن لم تكن واجبة عليه؟","options":["ترويضًا له وإعدادًا ليكون جديرًا بحمل الأمانة عند البلوغ","لأنها واجبة عليه","لإظهار القوة","للتفاخر"],"answer":0,"why":"وكذلك يُرغَّب في الجمعة والجماعات والحج والعمرة وحفظ القرآن.","ref":"ص 3"},{"q":"ما الحكمة من الحث على الزواج من غير الأقارب بحسب الدرس؟","options":["أن القرابة الشديدة قد تؤدي إلى أمراض وراثية فينشأ الطفل أكثر نجابة وأبعد عن الأمراض","لتقليل المهر","لتكوين علاقات اجتماعية فقط","لأنه واجب"],"answer":0,"why":"ومن التشريعات تحريم الإجهاض وحق الجنين والحث على الرضاعة الطبيعية.","ref":"ص 3"},{"q":"ما الحاجة التي وُصفت بأنها «حاجبة عما سواها» للطفل؟","options":["الحاجة إلى تحقيق الذات","الحاجة إلى اللعب","الحاجة إلى التعليم","الحاجة إلى الأمان"],"answer":3,"why":"فبدونه لا يستطيع الطفل الاستفادة من أي جانب آخر من جوانب الحياة.","ref":"ص 4"},{"q":"كيف تتحقق البيئة الآمنة للطفل بحسب الدرس؟","options":["بالمال","بالقوانين الصارمة","بالتفاهم بين الوالدين وحرية التعبير عن انفعالاته ومجتمع حاضن وحامٍ","بالمدارس"],"answer":2,"why":"فالأمان شرط لتلبية الحاجات الأخرى حتى الأكل والشرب.","ref":"ص 4"},{"q":"بماذا مثّل الدرس لحاجة «تحقيق الذات» في المنهج النبوي؟","options":["كان يوبخهم","كان يتجاهلهم","كان يأمرهم فقط","كان ﷺ يسلّم على الصبيان ويستأذنهم ويكنّي الطفل ويحترم عالمه كقصة أبي عمير والنغير"],"answer":3,"why":"فالإسلام يرفض تهميش الطفل أو الاستخفاف بمشاعره واهتماماته.","ref":"ص 5"},{"q":"ما الحاجة إلى «التوجيه» بحسب الدرس؟","options":["فرض الأوامر","توجيه الطفل سلوكيًّا وقيميًّا ودينيًّا وإجابة تساؤلاته الوجودية والدينية بصدق وإقناع","منع الأسئلة","العقاب"],"answer":1,"why":"فيمنحه ذلك استقرارًا شخصيًّا ويحفظ له الفطرة السوية.","ref":"ص 5"}],"10":[{"q":"ما سبب أغلب الفروق التربوية بين الأولاد بحسب الدرس؟","options":["الفروق الفردية بين الشخصيات أكثر من جنس الطفل","اختلاف المدرسة","اختلاف الدخل","اختلاف الجنس فقط"],"answer":0,"why":"فقد نجد طفلين من جنس واحد يختلفان اختلافًا كبيرًا.","ref":"ص 2"},{"q":"ما الخطأ في وضع جميع الأولاد في قالب واحد أو الاكتفاء بتصنيفات عامة مبنية على الجنس؟","options":["التوفير في الوقت","إغفال الفروق الفردية المؤثرة في العملية التربوية","تحقيق العدل","لا خطأ فيه"],"answer":1,"why":"فمعرفة المربي بخصائص كل طفل الفردية هامة لنجاح العملية التربوية.","ref":"ص 2"},{"q":"على أي أساس يُبنى التفريق بين الذكور والإناث الوارد في الدرس؟","options":["على الغالب لا على الإطلاق وقد ترد عليه استثناءات","على الإطلاق","على العادات","على الدين فقط"],"answer":0,"why":"وغرضه الاسترشاد والاستئناس لا التعميم.","ref":"ص 2"},{"q":"ما الفرق في النمو العقلي بحسب الدرس؟","options":["الإناث أبطأ دائمًا","لا فرق","الذكور أسرع دائمًا","الذكور غالبًا أبطأ في المراحل المبكرة، والإناث أسرع ثم يتباطأ التسارع عند أواخر المراهقة"],"answer":3,"why":"وهذا النمو يستمر عند الذكور بصورة متدرجة إلى ما بعد العشرينات.","ref":"ص 3"},{"q":"ما الملاحظة بشأن النمو العاطفي عند الذكور وتأثير المجتمع؟","options":["الذكور بلا مشاعر","البكاء ضعف","العاطفة غالبًا مكتومة عند الذكور وقد يعززها قول «أنت رجل عيب أن تبكي» والتربية الصحيحة لا تلغي المشاعر بل تعلّم ضبطها","الإناث لا يضبطن عواطفهن"],"answer":2,"why":"ظهور الانفعال عند الأنثى أوضح غالبًا، وهذا لا يعني ضعفًا مطلقًا.","ref":"ص 3"},{"q":"ما القاعدة التي تنطبق على النمو اللغوي بحسب الدرس؟","options":["الذكور سريع والإناث بطيء","الإناث «سريع وشبه متوقف» والذكور «بطيء ومستمر»","الجميع بطيء","لا قاعدة"],"answer":1,"why":"الذكور غالبًا بطيء ومستمر والإناث غالبًا سريع ثم يتوقف أو يكاد.","ref":"ص 4"},{"q":"بحسب الدرس، ما الفرق بين الذكور والإناث في المهارات الدقيقة؟","options":["الذكر أقدر دائمًا","لا فرق","الأنثى أضعف دائمًا","الأنثى أقدر غالبًا على ملاحظة التفاصيل والربط بين جوانب متعددة، والذكر قد يتميز بتركيز عميق في مجال محدد"],"answer":3,"why":"فإذا تخصص الذكر في مجال قد تكون لديه قدرة أعلى على الإنتاج فيه.","ref":"ص 4"},{"q":"أين تظهر الفوارق في النمو الجسدي والحركي؟","options":["من الولادة","عند البلوغ فقط","لا فوارق أبدًا","تقريبًا لا فوارق في الطفولة الأولى وتبدأ بالظهور لصالح الذكر في بدايات الطفولة المتأخرة"],"answer":3,"why":"وقد ذكر الدرس أن هذا مما لا يخفى على أحد.","ref":"ص 4"},{"q":"بماذا يتميز الذكور والإناث في المهارات الاجتماعية بحسب الدرس؟","options":["الذكور في الدوائر الكبرى خارج الأسرة، والإناث في الدوائر الصغرى داخل الأسرة","الإناث في كل الدوائر","الذكور في الأسرة فقط","لا فرق"],"answer":0,"why":"وهذا بحسب الغالب.","ref":"ص 4"},{"q":"ما المطلوب في تحقيق الذات عند الأنثى بحسب الدرس؟","options":["الإقدام والمخاطرة","الاندفاع","أن تُربّى على الاعتزاز بالذات والثقة بالنفس مع استبدال الإقدام بالحذر والوعي بالمسؤولية","التهور"],"answer":2,"why":"فالثقة ليست مبرّرًا لاقتحام المخاطر، بل ينبغي أن تكون مقرونة بالحذر.","ref":"ص 5"}],"11":[{"q":"ما طبيعة النمو الذي يمر به الطفل بحسب الدرس؟","options":["نمو جسدي فقط","نمو متعدد الأبعاد وليس مجرد تغيرات جسمانية","نمو عقلي فقط","نمو لغوي فقط"],"answer":1,"why":"فيحتاج الوالدان إلى فهم هذا التعدد لتوجيه المسار التربوي بحكمة.","ref":"ص 2"},{"q":"أي من المؤشرات التالية يدخل في النمو العقلي (المعرفي)؟","options":["الطول","الوزن","الانتباه والتركيز ودقة الملاحظة وكفاءة الذاكرة ومستوى الاستيعاب والقدرة على التمييز","عدد الأصدقاء"],"answer":2,"why":"وكذلك القدرة على المحاكمة العقلية وحل المشكلات البسيطة.","ref":"ص 2"},{"q":"ما الخطأ الشائع في فهم النمو العقلي؟","options":["الاهتمام بالذاكرة","الاهتمام بالانتباه","الاهتمام بالبيئة","اختزاله في الذكاء فقط وتصنيف الطفل ذكيًّا أو ضعيف الذكاء"],"answer":3,"why":"فالذكاء جانب واحد من منظومة النمو العقلي، ولا يلزم أن يكون كل ذكي صاحب نمو عقلي متكامل.","ref":"ص 3"},{"q":"لماذا تهم العناية بالنمو الجسمي للطفل؟","options":["لأنه أساس يؤثر في بقية جوانب بناء الشخصية النفسية والاجتماعية والعقلية","لأنه الأهم دائمًا","لأنه يظهر على الجميع","لأنه يحدد الذكاء"],"answer":0,"why":"فسلامة البدن تمنح الطفل القدرة على ممارسة الحياة الطبيعية.","ref":"ص 3"},{"q":"لماذا لا يُحكم على السلوك بمعزل عن سياقه؟","options":["لأن السلوك لا يتغير","لأن العمر لا يؤثر","لأن بعض السلوكيات تكون طبيعية أو إيجابية في مرحلة عمرية وغير مناسبة في أخرى","لأن الحكم مرفوض"],"answer":2,"why":"فيُفهم السلوك في ضوء عمر الطفل وخصائص مرحلته النمائية.","ref":"ص 3"},{"q":"ما حال الطفل الصغير مع قيمة الكرم؟","options":["هو كريم بطبعه","يمسك بالأشياء بحكم الغريزة وهي خصلة فطرية لا تُذم في مرحلته، فلا يُطلب منه الكرم مبكرًا","لا يميز المال","يفهم التضحية"],"answer":1,"why":"فهو يتعارض عنده الكرم مع حق الملكية ولا يستوعب القيم المجردة.","ref":"ص 3"},{"q":"كيف ينبغي التعامل مع إقدام الطفل الصغير على سلوك خطر كوضع يده في الكهرباء؟","options":["هو بدافع الفضول، وينبغي تهيئة المنزل وحماية مصادر الخطر بدل الإكثار من اللوم","بالعقاب الشديد","بتجاهله","بتحذيره كثيرًا فقط"],"answer":0,"why":"فالفضول في أصله خصيصة إيجابية والمشكلة ليست في وجود الدافع بل في توجيهه وتأمين البيئة.","ref":"ص 4"},{"q":"كيف يتدرج النمو الاجتماعي للطفل؟","options":["من المجتمع إلى الأسرة","من الأم في العام الأول ثم الإخوة والعائلة ثم الأقارب ثم المجتمع الأوسع","من الأصدقاء إلى الأم","لا تدرج"],"answer":1,"why":"فالطفل نقطة مركزية تتسع حولها دائرة العلاقات.","ref":"ص 4"},{"q":"ما أثر منع بعض الأمهات أطفالهن من الانتقال إلى دوائر اجتماعية أوسع خوفًا مفرطًا؟","options":["حماية كاملة","نمو إيجابي","عزل تربوي قد يؤثر سلبًا في نموهم الاجتماعي وتكوين شخصيتهم","لا أثر"],"answer":2,"why":"وتظهر المشكلة حين يعجز الوالدان عن مواكبة التوسع الطبيعي.","ref":"ص 4"},{"q":"لماذا يُعد الاستدلال بأن الشافعي والبخاري لم يلعبا في الصغر كقاعدة عامة استدلالًا منقوصًا؟","options":["لأنهما ضعيفان","لأن لا مصدر","لأنهما معروفان","لأنهما شخصيتان استثنائيتان هيأهما الله ولا يُعمم حالهما على كل طفل"],"answer":3,"why":"فيجب احترام سنن الله في النمو ومراحله.","ref":"ص 5"}],"12":[{"q":"ما مرحلتا التأسيس بحسب الدرس؟","options":["الأولى حتى الخامسة والثانية حتى العاشرة","الأولى من المهد إلى الثالثة، والثانية من الرابعة إلى السابعة أو الثامنة","الأولى حتى السنة والثانية حتى الثالثة","لا مراحل"],"answer":1,"why":"ويمكن اعتبار سنوات التأسيس بشكل متوسط من الولادة حتى سن السابعة.","ref":"ص 2"},{"q":"ما نسبة حجم الدماغ عند سن الخامسة قياسًا إلى حجمه النهائي بحسب الدرس؟","options":["نحو 90%","نحو 50%","نحو 25%","نحو 100%"],"answer":0,"why":"ويبدأ الطفل بدماغ يقارب ربع حجمه عند البالغ.","ref":"ص 2"},{"q":"ما المقصود بـ«التحفيز الآمن» في مرحلة التأسيس؟","options":["ترك الطفل بلا توجيه","التعليم المبكر القاسي","شعور الطفل بأن احتياجاته الفطرية كاللعب والفضول مفهومة ومرغوب فيها من الوالدين","الحماية الزائدة"],"answer":2,"why":"فاللعب حاجة أساسية ومنبع للتعلم وتحقيق الذات.","ref":"ص 3"},{"q":"بماذا يدل حديث «أنا وكافل اليتيم كهاتين» على الأمان العاطفي؟","options":["أن كفالة اليتيم تمتد إلى الكفالة النفسية والتربوية والتعويض العاطفي لا المادية فقط","أنها مادية فقط","أنها للأغنياء","أنها خاصة بالأقارب"],"answer":0,"why":"وهو ما يفسر الأجر العظيم بمرافقة النبي ﷺ في الجنة.","ref":"ص 3"},{"q":"ما «الرعاية المستجيبة»؟","options":["إعطاء الطفل كل ما يطلب","فهم إشارات الطفل والانتباه لانفعالاته والاستجابة لها بطريقة مناسبة","تجاهل بكائه","فرض جدول صارم"],"answer":1,"why":"ومن الأخطاء تجاهل بكاء الطفل بحجة تقوية شخصيته.","ref":"ص 4"},{"q":"ما أول الأخطاء التربوية الكبرى في مرحلة التأسيس؟","options":["كثرة الهدايا","الإهمال العاطفي","كثرة اللعب","كثرة الأسئلة"],"answer":1,"why":"فالتقبيل والحضن حاجة فطرية، وقد استشهد النبي ﷺ بقوله «من لا يرحم لا يُرحم».","ref":"ص 4"},{"q":"ما أثر العنف الجسدي والتنمر اللفظي على الطفل؟","options":["يقوي الشخصية","لا أثر له","يدمر تقدير الذات ويزرع الخوف الاجتماعي أو الانطواء وقد يؤدي إلى استنساخ العنف","يجعله أكثر طاعة"],"answer":2,"why":"فقد يتحول الطفل إلى شخص عنيف مع أقرانه لإثبات ذاته.","ref":"ص 4"},{"q":"ماذا تعني «المزاجية في التربية»؟","options":["الحزم الدائم","اللين الدائم","الاعتدال","التعامل مع الطفل بحسب مزاج الوالدين دون وضوح القواعد فيضطرب مفهوم القيم"],"answer":3,"why":"فالطفل لا يميز الصواب من الخطأ لأن القواعد تتغير يوميًّا.","ref":"ص 5"},{"q":"ما نتيجة الإفراط في الحماية (الدلال الزائد)؟","options":["طفل اتكالي بمهارات حياتية واجتماعية منخفضة لا يقوى على مواجهة تحديات الحياة","طفل قوي","طفل مبدع","طفل مستقل"],"answer":0,"why":"ويكثر عند الأمهات وفي حالات كالابن الوحيد وآخر العنقود.","ref":"ص 5"},{"q":"ما الحل الأفضل بحسب الدرس لمواجهة الأخطاء التربوية الشائعة؟","options":["الاستسلام لأنها شائعة","العقاب","التجاهل","إخضاع التعامل مع الأولاد لقوانين ثابتة بدل المزاجية"],"answer":3,"why":"فالشيوع لا يعني التطبيع، مع ضرورة تجنب تحويل البيت إلى ثكنة عسكرية.","ref":"ص 6"}],"13":[{"q":"كيف يتعامل الإسلام مع القوة والرحمة؟","options":["القوة على حساب الرحمة","في إطار من التكامل والتوازن بين القوة والرحمة","الرحمة على حساب القوة","لا يهتم بهما"],"answer":1,"why":"فالتشريعات جاءت لترسيخ معاني القوة بمختلف صورها لا على حساب الرحمة.","ref":"ص 2"},{"q":"أي مما يلي من تجليات القوة في الشريعة؟","options":["سطوة الشريعة وهيمنتها وعزة العبودية والتوحيد","كثرة الأموال","الغنى","كثرة الجيوش"],"answer":0,"why":"فارتباط المسلم بربه مباشرة دون وسيط يمنح شخصيته قوة وثباتًا.","ref":"ص 2"},{"q":"ما المقصود بالمجال المعنوي في تعزيز القوة؟","options":["التحصيل الدراسي","الانعتاق من أغلال العبودية لغير الله بكافة صورها والتحرر من أسر الهواجس والأحزان","التعلم","اللعب"],"answer":1,"why":"ومنه قوله ﷺ: «تعس عبد الدينار والدرهم».","ref":"ص 2"},{"q":"ما الآفات الثماني التي استعاذ منها النبي ﷺ والتي تقوّض كيان الإنسان؟","options":["السرقة والكذب","الغضب والكبر","الهم والحزن والعجز والكسل والبخل والجبن وغلبة الدين وقهر الرجال","الجهل والفقر"],"answer":2,"why":"ولما فيها من تقويض لكيان الإنسان.","ref":"ص 3"},{"q":"ما معنى قوله ﷺ: «ألا إن القوة الرمي»؟","options":["أن الرمي لعبة","أن القوة للشباب","أن القوة البدنية والإعداد للقتال من القوة المأمور بها","أن القوة سلاح فقط"],"answer":2,"why":"فالمجال المادي والمجتمعي يشمل الجهاد والأمر بالمعروف والإعداد البدني.","ref":"ص 3"},{"q":"ما موقف الإسلام من العفو الناتج عن العجز؟","options":["ليس من المعاني التي يربي عليها الإسلام؛ فالعفو المحمود عند المقدرة","هو الأفضل","واجب","مباح فقط"],"answer":0,"why":"فالإسلام يجعل العفو والتسامح قائمين على القوة والقدرة.","ref":"ص 3"},{"q":"كيف حارب الإسلام الضعف بحسب الدرس؟","options":["بالمنع من العمل","بالزهد في الدنيا","بالتسليم للقدر","حارب الفقر ودعا إلى العمل وتغطية حاجات الفقراء بالزكاة والصدقات وصلة الرحم"],"answer":3,"why":"فالإسلام لا يريد في مجتمعه أشخاصًا ضعفاء بل أعزاء أقوياء.","ref":"ص 3"},{"q":"ما المقصود بـ«تعزيز المرجعية الداخلية على حساب الخارجية» في بناء الأولاد؟","options":["أن يخاف من الناس","أن يطيع الجميع","أن يربط سلوكه بالعيب الاجتماعي","أن تنبع منطلقات الطفل من قناعة داخلية بالصواب والخطأ لا من نظرة الناس"],"answer":3,"why":"فالإفراط في ربط السلوك بنظرة الآخرين يضعف استقلالية الشخصية.","ref":"ص 4"},{"q":"ما الخطأ في ربط العبادات بالمكافآت الما
