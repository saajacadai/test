      var done = completedCount(s.id), pct = Math.round(done / s.lectures.length * 100);
      var stats = head.querySelector('.stats'), b = head.querySelector('.bar');
      if (stats) stats.innerHTML = '<span>عدد المحاضرات: <b>' + s.lectures.length + '</b></span><span>المحاضرات التي تمت مراجعتها: <b>' + done + '</b></span><span>نسبة التقدم: <b>' + pct + '%</b></span>';
      if (b) b.outerHTML = bar(pct);
    }
  }


  /* ---------- قارئ الملخصات: صفحات الملف المعتمد كما هي، بتقليب باللمس ---------- */
  var R = { sid: null, n: 0, key: '', page: 1, pages: 0, z: 1 };
  var PCACHE = {};
  var ZSTEPS = [1, 1.25, 1.5, 2, 2.5, 3];
  function el(id) { return document.getElementById(id); }
  function openReader(sid, n) {
    var l = subj(sid).lectures[n - 1], rec = getL(sid, n);
    var p = parseInt(rec.page, 10) || 1;
    R = { sid: sid, n: n, key: l.key, page: Math.min(Math.max(p, 1), l.pages), pages: l.pages, z: 1 };
    setL(sid, n, { summary: true });
    go({ name: 'read' });
  }
  function renderReader() {
    var s = subj(R.sid), l = s.lectures[R.n - 1];
    var hasQ = l.questions && l.questions.length > 0;
    $root.innerHTML = topbar() + '<div class="reader">' +
      '<div class="back"><button class="btn btn-ghost" data-action="back-subject">→ العودة إلى ' + esc(s.name) + '</button></div>' +
      '<section class="reader-head"><span class="crumb">' + esc(s.name) + ' · المحاضرة (' + pad2(R.n) + ')</span><h1>' + esc(l.title) + '</h1></section>' +
      '<div class="stage" id="stage"><div class="zoomer" id="zoomer"><img id="pdf-img" alt="صفحة من الملخص المعتمد" draggable="false" hidden></div>' +
      '<p class="loading" id="pdf-msg">جارٍ تحميل صفحات الملخص…</p></div>' +
      '<div class="reader-bar" role="toolbar" aria-label="التنقل بين صفحات الملخص">' +
      '<button class="btn btn-soft" id="pg-prev" data-action="pg-prev">→ السابق</button>' +
      '<span class="pg" id="pg-label" aria-live="polite"></span>' +
      '<button class="btn btn-primary" id="pg-next" data-action="pg-next">التالي ←</button></div>' +
      '<div class="zoom-row"><button class="btn btn-ghost" id="zoom-out" data-action="zoom-out" aria-label="تصغير الصفحة">− تصغير</button>' +
      '<span class="zl" id="zoom-label">100%</span>' +
      '<button class="btn btn-ghost" id="zoom-in" data-action="zoom-in" aria-label="تكبير الصفحة">+ تكبير</button>' +
      '<button class="btn btn-ghost" data-action="pg-first">الصفحة الأولى</button></div>' +
      '<p class="hint">اسحبي الصفحة نحو اليسار للانتقال إلى التالية ونحو اليمين للرجوع، أو استخدمي أسهم لوحة المفاتيح.</p>' +
      '<div class="reader-actions"><button class="btn btn-primary" data-action="done-read">تمت مراجعة الملخص ✓</button>' +
      (hasQ ? '<button class="btn btn-pink" data-action="quiz-from-read">اختبري استيعابكِ</button>' : '') +
      '<button class="btn btn-ghost" id="dl-btn" data-action="download-summary" hidden>تنزيل الملخص</button><span class="note" id="dl-msg" role="status"></span></div></div>' + footer();
    paintReader(0);
    applyZoom();
    initDownload();
  }
  function paintReader(dir) {
    var msg = el('pdf-msg'), im = el('pdf-img');
    if (!msg || !im) return;
    var lab = el('pg-label'); if (lab) lab.textContent = 'الصفحة ' + R.page + ' من ' + R.pages;
    var pv = el('pg-prev'), nx = el('pg-next');
    if (pv) pv.disabled = R.page <= 1;
    if (nx) nx.disabled = R.page >= R.pages;
    setL(R.sid, R.n, { page: R.page });
    var key = R.key, want = R.page;
    function show() {
      if (key !== R.key || want !== R.page) return;
      im.onload = function () {
        if (want !== R.page) return;
        im.hidden = false; msg.hidden = true;
        if (dir) { im.classList.remove('in-next', 'in-prev'); void im.offsetWidth; im.classList.add(dir > 0 ? 'in-next' : 'in-prev'); }
      };
      im.onerror = function () { msg.hidden = false; msg.textContent = 'تعذّر عرض الصفحة هنا، حاولي مرة أخرى بعد قليل.'; };
      im.src = PCACHE[key][want - 1];
      if (PCACHE[key][want]) { var pre = new Image(); pre.src = PCACHE[key][want]; }
    }
    if (PCACHE[key]) { show(); return; }
    im.hidden = true; msg.hidden = false; msg.textContent = 'جارٍ تحميل صفحات الملخص…';
    fetch(subj(R.sid).lectures[R.n - 1].summary)
      .then(function (r) { if (!r.ok) throw new Error('x'); return r.json(); })
      .then(function (arr) { PCACHE[key] = arr; show(); })
      .catch(function () { msg.textContent = 'تعذّر تحميل الملخص الآن، حاولي مرة أخرى بعد قليل.'; });
  }
  function applyZoom() {
    var zm = el('zoomer'), st = el('stage'); if (!zm || !st) return;
    zm.style.width = (R.z * 100) + '%';
    st.classList.toggle('zoomed', R.z > 1);
    var lb = el('zoom-label'); if (lb) lb.textContent = Math.round(R.z * 100) + '%';
    var zi = el('zoom-in'), zo = el('zoom-out');
    if (zi) zi.disabled = R.z >= ZSTEPS[ZSTEPS.length - 1];
    if (zo) zo.disabled = R.z <= 1;
    if (R.z === 1) st.scrollLeft = 0;
  }
  function stepZoom(d) {
    var i = ZSTEPS.indexOf(R.z); if (i < 0) i = 0;
    i = Math.min(Math.max(i + d, 0), ZSTEPS.length - 1);
    R.z = ZSTEPS[i]; applyZoom();
  }
  var DL = null;
  var DLFB = { save: function (o) { var u = URL.createObjectURL(o.data); var a = document.createElement('a'); a.href = u; a.download = o.filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 10000); return Promise.resolve(); } };
  function initDownload() {     if (!(window.claude && window.claude.use)) { DL = DLFB; var fb = el('dl-btn'); if (fb) fb.hidden = false; return; }
    window.claude.use('downloads').then(function (d) {
      DL = d; var b = el('dl-btn'); if (b && d) b.hidden = false;
    }, function () {});
  }
  function downloadSummary() {
    var msg = el('dl-msg'); if (!DL) return;
    if (msg) msg.textContent = 'جارٍ التجهيز…';
    var s = subj(R.sid), l = s.lectures[R.n - 1];
    var src = 'summaries/dl/' + l.key + '.pdf';
    var ttl = (l.title || '').replace(/[\\/:*?"<>|]/g, ' ');
    fetch(src).then(function (r) { if (!r.ok) throw new Error('x'); return r.blob(); })
      .then(function (b) { return DL.save({ filename: 'ملخص ' + s.name + ' - المحاضرة ' + pad2(R.n) + ' - ' + ttl + '.pdf', data: b }); })
      .then(function () { if (msg) msg.textContent = 'تم حفظ الملخص.'; })
      .catch(function (e) { if (msg) msg.textContent = (e && e.code === 'declined') ? '' : 'تعذّر التنزيل الآن.'; });
  }
  function downloadFull() {
    var msg = el('full-dl-msg'), s = subj(view.sid); if (!DL || !s || !s.full) return;
    if (msg) msg.textContent = 'جارٍ التجهيز…';
    fetch(s.full).then(function (r) { if (!r.ok) throw new Error('x'); return r.blob(); })
      .then(function (b) { return DL.save({ filename: 'الملخص الكامل - ' + s.name + '.pdf', data: b }); })
      .then(function () { if (msg) msg.textContent = 'تم حفظ الملخص الكامل.'; })
      .catch(function (e) { if (msg) msg.textContent = (e && e.code === 'declined') ? '' : 'تعذّر التنزيل الآن.'; });
  }
  function gotoPage(p, dir) {
    if (p < 1 || p > R.pages || p === R.page) return;
    R.page = p; paintReader(dir || 0);
    var st = el('stage');
    if (st) { var top = st.getBoundingClientRect().top; if (top < 0 || top > 120) window.scrollTo(0, Math.max(0, top + window.scrollY - 70)); if (st.scrollTop) st.scrollTop = 0; }
  }
  function nativeZoomed() { return !!(window.visualViewport && window.visualViewport.scale > 1.05); }

  /* السحب باللمس: أفقي واضح فقط، لا يتداخل مع التمرير العمودي ولا مع التكبير */
  var SW = null, PTR = 0;
  document.addEventListener('pointerdown', function (e) {
    if (view.name !== 'read') return;
    var st = el('stage'); if (!st || !st.contains(e.target)) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    PTR++;
    if (!SW) SW = { id: e.pointerId, x: e.clientX, y: e.clientY, t: Date.now(), multi: false };
    else SW.multi = true;
    if (PTR > 1) SW.multi = true;
  });
  document.addEventListener('pointerup', function (e) {
    if (!SW) return;
    PTR = Math.max(0, PTR - 1);
    if (e.pointerId === SW.id) {
      var dx = e.clientX - SW.x, dy = e.clientY - SW.y, dt = Date.now() - SW.t, ok = !SW.multi;
      if (ok && view.name === 'read' && R.z === 1 && !nativeZoomed() && dt < 1000 && Math.abs(dx) >= 60 && Math.abs(dx) > 1.8 * Math.abs(dy)) {
        if (dx < 0) gotoPage(R.page + 1, 1); else gotoPage(R.page - 1, -1);
      }
      SW = null;
    }
    if (PTR === 0) SW = null;
  });
  document.addEventListener('pointercancel', function () { PTR = 0; SW = null; });
  document.addEventListener('keydown', function (e) {
    if (view.name !== 'read' || e.altKey || e.ctrlKey || e.metaKey) return;
    var tg = e.target && e.target.tagName; if (tg === 'INPUT' || tg === 'TEXTAREA') return;
    if (R.z > 1) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); gotoPage(R.page + 1, 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); gotoPage(R.page - 1, -1); }
  });

  /* ---------- الأحداث ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action]');
    if (!t || t.type === 'checkbox') return;
    var a = t.getAttribute('data-action'), sid = t.getAttribute('data-sid'), n = parseInt(t.getAttribute('data-n'), 10);
    if (a === 'open-subject') { subjQuery = ''; go({ name: 'subject', sid: sid }); }
    else if (a === 'open-lecture') {
      subjQuery = ''; go({ name: 'subject', sid: sid });
      setTimeout(function () { var el = document.getElementById('lec-' + n); if (el) el.scrollIntoView({ block: 'center' }); }, 30);
    }
    else if (a === 'home') { go({ name: 'home' }); }
    else if (a === 'read') { openReader(sid, n); }
    else if (a === 'download-summary') { downloadSummary(); }
    else if (a === 'download-full') { downloadFull(); }
    else if (a === 'zoom-in') { stepZoom(1); }
    else if (a === 'zoom-out') { stepZoom(-1); }
    else if (a === 'pg-first') { gotoPage(1, -1); }
    else if (a === 'pg-prev') { gotoPage(R.page - 1, -1); }
    else if (a === 'pg-next') { gotoPage(R.page + 1, 1); }
    else if (a === 'done-read') { setL(R.sid, R.n, { summary: true }); go({ name: 'subject', sid: R.sid }); setTimeout(function () { var el = document.getElementById('lec-' + R.n); if (el) el.scrollIntoView({ block: 'center' }); }, 30); }
    else if (a === 'quiz-from-read') { startQuiz(R.sid, R.n); }
    else if (a === 'back-subject') { go({ name: 'subject', sid: R.sid }); }
    else if (a === 'quiz') { startQuiz(sid, n); }
    else if (a === 'demo') { startDemo(); }
    else if (a === 'check') { if (Q.picked[Q.i] != null) { Q.checked = true; render(); } }
    else if (a === 'next-q') {
      if (Q.i < Q.qs.length - 1) { Q.i++; Q.checked = false; render(); window.scrollTo(0, 0); } else finishQuiz();
    }
    else if (a === 'quit-quiz') { if (Q.demo) go({ name: 'home' }); else { go({ name: 'subject', sid: Q.sid }); } }
    else if (a === 'retry') { Q.i = 0; Q.picked = []; Q.checked = false; go({ name: 'quiz' }); }
    else if (a === 'review') { go({ name: 'review' }); }
    else if (a === 'to-result') { go({ name: 'result' }); }
    else if (a === 'next-lecture') { if (nextWithQuestions()) startQuiz(Q.sid, Q.n + 1); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.name === 'opt' && Q && !Q.checked) {
      Q.picked[Q.i] = parseInt(t.value, 10);
      var btn = document.getElementById('check-btn'); if (btn) btn.disabled = false;
    } else if (t.getAttribute && t.getAttribute('data-action') === 'toggle-summary') {
      setL(t.getAttribute('data-sid'), parseInt(t.getAttribute('data-n'), 10), { summary: t.checked });
      refreshList();
    }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'home-search') renderHomeResults(e.target.value);
    else if (e.target.id === 'subj-search') {
      subjQuery = e.target.value;
      var s = subj(view.sid), el = document.getElementById('lecture-list');
      if (s && el) el.innerHTML = lectureList(s);
    }
  });

  var m0 = /^#subject-(s[1-5])$/.exec(location.hash);
  view = m0 ? { name: 'subject', sid: m0[1] } : { name: 'home' };
  render();
})();
</script>
