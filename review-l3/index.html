لمية بوصلة ترتيب أولوياتنا"],"answer":3,"why":"لنؤدي مهمتنا في تعبيد قلوبنا والأرض لله وتعميرها.","ref":"ص 3"},{"q":"ما معنى «الدين كغاية»؟","options":["أن ننجح في المدرسة فقط","أن يكون قياس نجاح الأولاد بمدى اهتمامهم بما لا يسع المسلم جهله وغرس النيات الأخروية","أن نحقق الثروة","أن نبعدهم عن الدين"],"answer":1,"why":"فتكون درجات القرآن والدين واللغة العربية هي الأولوية الحقيقية في التنافس.","ref":"ص 3"},{"q":"ما الآية التي استُشهد بها على التنافس في أمر الآخرة؟","options":["﴿وما خلقت الجن والإنس﴾","﴿قل هو الله أحد﴾","﴿وفي ذلك فليتنافس المتنافسون﴾","﴿إنا أنزلناه﴾"],"answer":2,"why":"سورة المطففين: 26، وكذلك ﴿سابقوا إلى مغفرة من ربكم وجنة عرضها كعرض السماء والأرض﴾.","ref":"ص 3"},{"q":"ماذا ينبغي ألا تفعله ضغوط التحصيل الدراسي بالأسرة؟","options":["أن نضحي بعلاقتنا بأولادنا أو نتعامل معهم بأوامر عسكرية وتهديدات مستمرة","أن نحاورهم","أن نشجعهم","أن نصاحبهم"],"answer":0,"why":"فالعلاقة القوية هي الوسيلة الأساسية لتسهيل التربية والتعليم.","ref":"ص 3-4"},{"q":"أي الخيارين أصح بحسب الدرس: ابن متفوق دراسياً اتكالي أم متعثر قليلاً يتقدم في تحمل المسؤولية؟","options":["الثاني، المتعثر الذي يتقدم نحو الاعتماد على الذات وتحمل المسؤولية","الأول","كلاهما سواء","لا شيء مما سبق"],"answer":0,"why":"لأن الأولوية لصناعة الرجال والنساء وبناء القوة الشخصية.","ref":"ص 4"},{"q":"ما فوائد حفظ القرآن للطفل بحسب المحاضرة؟","options":["لا فائدة له دراسياً","تقوية الذاكرة والتركيز والصبر وتقسيم المطلوب إلى أجزاء والربط والمقارنة والتفكير المنطقي","يشتت الذهن","يضعف التحصيل"],"answer":1,"why":"وقد قيل: «علّم ابنك القرآن والقرآن يعلّمه كل شيء».","ref":"ص 4-5"},{"q":"ما الدليل التاريخي الذي ذكرته المحاضرة على أثر حفظ القرآن في العلم؟","options":["أن العلماء لم يحفظوه","أنهم تركوه","أنهم حفظوه كباراً فقط","أن كبار علماء السلف كمالك والبخاري والشافعي وسفيان الثوري وعلماء الأندلس حفظوه في صغرهم"],"answer":3,"why":"وقد استشهد بقوله تعالى ﴿بل هو آيات بينات في صدور الذين أوتوا العلم﴾.","ref":"ص 5"}],"14":[{"q":"ما الفرق الجوهري بين «صعوبات التعلم» و«عقبات التعلم»؟","options":["الصعوبات تزول بتغيير الظروف، والعقبات اضطرابات ثابتة","الصعوبات مصطلح علمي طبي، أما العقبات فمعوقات حياتية عارضة غير متصلة بالجانب الطبي أو العقلي","الصعوبات تخص الحساب، والعقبات تخص القراءة","لا فرق بينهما، فهما اسمان لشيء واحد"],"answer":1,"why":"العقبات قد تعرض لأي إنسان حتى العباقرة ومحبي المذاكرة، مثل صعوبة المناهج أو الملل.","ref":"ص 3"},{"q":"عبارات مثل: «أنا جائع، أنا عطشان، أنا متعب، أشعر بالملل» عند المذاكرة تُصنّف ضمن:","options":["عقبات التعلم","صعوبات التعلم الطبية","اضطراب فرط الحركة","ضعف مستوى الذكاء"],"answer":0,"why":"قد تكون مراوغة أحيانًا، وقد تكون أعراضًا حقيقية لاحتياجات واقعية تزول العقبة بمراعاتها.","ref":"ص 3-4"},{"q":"متى تبدأ مرحلة الطلاقة والفهم المتقدم (القراءة من أجل التعلم)؟","options":["من عمر أربع سنوات","من عمر ست سنوات","من عمر اثنتي عشرة سنة","من عمر تسع سنوات فما فوق"],"answer":3,"why":"إذا بلغ الطفل عشر سنوات ولم يتمكن من هذه المهارات، فذلك يدل على مشكلة تحتاج إلى الانتباه.","ref":"ص 4-5"},{"q":"بكم مرحلة يمر تطور الكتابة عند الطفل؟","options":["أربع مراحل","ثلاث مراحل","ست مراحل","ثماني مراحل"],"answer":2,"why":"تبدأ بمرحلة ما قبل الكتابة من عمر سنة، وتنتهي بالطلاقة الكتابية من عمر ثماني سنوات.","ref":"ص 5"},{"q":"ما الأمران المهمان اللذان ينبغي مراعاتهما عند التقييم المبدئي لصعوبات التعلم؟","options":["عدد ساعات النوم، ونوع الطعام","البطء في الحركة عمومًا، ومستويات الذكاء","ترتيب الطفل بين إخوته، وعمر والديه","نوع المدرسة، وعدد المعلمين"],"answer":1,"why":"البطء ليس مذمومًا دائمًا وقد يكون تؤدة وأناة، وضعف اللغات الأجنبية ليس مقياسًا للذكاء.","ref":"ص 7-9"},{"q":"ما المعدل الطبيعي لمستوى الذكاء الذي ذكره الدرس؟","options":["بين 90 و110","بين 50 و70","بين 120 و140","أكثر من 150"],"answer":0,"why":"إذا كان المستوى أقل من ذلك، فإن المراكز المتخصصة تقدم جلسات لتنمية الذكاء والمهارات الذهنية.","ref":"ص 9"},{"q":"ما العلاقة الصحيحة بين الانتباه والتركيز؟","options":["كل انتباه تركيز، وليس كل تركيز انتباهًا","لا علاقة بينهما","الانتباه أعمق وأكثر استمرارًا من التركيز","كل تركيز هو نوع من الانتباه، وليس كل انتباه تركيزًا"],"answer":3,"why":"التركيز توجيه الانتباه بشكل متواصل على نشاط معين لمدة محددة، فهو أكثر استمرارية وعمقًا.","ref":"ص 13"},{"q":"طفل يركّز على شيء معين ويتجاهل المشتتات المحيطة به، فهو يستخدم:","options":["التركيز الانتقائي","التركيز المقسّم","التركيز المتحوّل","الانتباه اللاإرادي"],"answer":0,"why":"أنواع التركيز: المستمر، والانتقائي، والمقسّم (مهام متعددة)، والمتحوّل (التبديل بمرونة).","ref":"ص 14"},{"q":"كم تحتاج الحزمة المعلوماتية الواحدة تقريبًا، وما مقدار الاستراحة المقترحة بين حزمة وأخرى؟","options":["نحو ساعتين، مع استراحة دقيقتين","نحو 10 دقائق، مع استراحة ساعة","نحو 30 إلى 40 دقيقة، مع استراحة نحو ربع ساعة","ساعة كاملة دون استراحة"],"answer":2,"why":"غياب الفواصل الزمنية بين حزم المعلومات من أسباب ضعف الانتباه، فيبدو الطفل كأن أحدًا أطفأ النور في ذهنه.","ref":"ص 21-22"},{"q":"أي أنواع التفكير يوصي الدرس بجعله محورًا للتدريبات المنزلية مع الأولاد؟","options":["التفكير التقليدي","التفكير الإبداعي","التفكير الناقد وحده","التفكير العاطفي"],"answer":1,"why":"لأنه من أعلى أنواع التفكير، وتنميته تسهم في تنمية الأنواع الأخرى.","ref":"ص 29"}],"15":[{"q":"ما الدليل من قصة آدم عليه السلام على أهمية الحفظ؟","options":["أن الله علّمه الأسماء كلها فحفظها ثم استرجعها حين أُمر، فشرّفه بذلك على الملائكة","أنه نسي العهد فلم يكن للحفظ أثر","أنه تعلّم الكتابة قبل غيره","أنه علّم الملائكة القراءة"],"answer":0,"why":"الحفظ من أولى بوابات العلم والمعرفة للبشرية، كما يتضح من قوله تعالى: ﴿وعلّم آدم الأسماء كلها﴾.","ref":"ص 2"},{"q":"ما الذي تبيّنه قصة خزيمة الأنصاري في جمع القرآن؟","options":["أن الصحابة اكتفوا بالكتابة دون الحفظ","أن جمع القرآن لم يشترط الشهود","أن الآية وُجدت عند جميع الصحابة","أن معلومة واحدة محفوظة قد يكون لها أثر عظيم في نقل العلم وحفظ الدين"],"answer":3,"why":"قُبلت شهادته وحده لأن الصحابة حفظوا أن النبي ﷺ جعل شهادته بشهادة رجلين.","ref":"ص 2-3"},{"q":"ما الفرق بين الحفظ والذاكرة؟","options":["الحفظ هو المخزن، والذاكرة هي القدرة على التخزين","الحفظ هو القدرة على تخزين المعلومات، والذاكرة هي المخزن الذي توجد فيه","الحفظ للنصوص، والذاكرة للأحداث","لا فرق بينهما"],"answer":1,"why":"والمعلومات المحفوظة متنوعة: رائحة أو صوت أو لون أو شعور أو أي مدخلات حسية وإدراكية.","ref":"ص 3"},{"q":"كم تبلغ تقريبًا مدة الاحتفاظ بالمعلومة في ذاكرة المدى القصير ما لم تُكرَّر أو تُربط؟","options":["من 24 إلى 48 ساعة","أسبوع كامل","من 15 إلى 30 ثانية","عدة أشهر"],"answer":2,"why":"ذاكرة المدى القصير بوابة الانتقال إلى الطويلة، وتعتمد قوتها على الانتباه والتركيز عند الاستقبال.","ref":"ص 4"},{"q":"ما العمليات الثلاث التي يتحقق بها حفظ المعلومة بكفاءة؟","options":["التركيز والذكاء، والتركيز والشعور القوي، والتكرار الحسي","القراءة، والكتابة، والحساب","النوم، والطعام، والرياضة","الحفظ، والنسيان، والاسترجاع"],"answer":0,"why":"لذلك فإن ربط الحفظ بقلة الذكاء تصور خاطئ ومحبط.","ref":"ص 6"},{"q":"ما الدوبامين، وما علاقته بالتعلم؟","options":["هرمون يسبب النسيان","فيتامين يُؤخذ لتقوية الذاكرة","مادة تُفرز عند الملل فتقلل التركيز","ناقل عصبي في الدماغ يرتبط بالمكافأة والحماس، ويساعد على تثبيت المعلومات ومواصلة التعلم بشغف"],"answer":3,"why":"ويُنبَّه إلى ألّا يُفرط في ربط التعلم بالمكافآت والأجواء المحببة حتى لا يصبح شرطًا للإقبال على العلم.","ref":"ص 7-9"},{"q":"ما المقصود بـ«التداخل بين المعلومات» في باب النسيان؟","options":["خلط الطفل بين الحروف المتشابهة","تراكم معلومات جديدة كثيرة ومتتابعة فوق السابقة فيصعب استرجاعها","نسيان المعلومة بسبب المرض","حفظ المعلومة دون فهمها"],"answer":1,"why":"ولذلك ينبغي توزيع المعلومات على فترات، وعدم حشوها في وقت واحد.","ref":"ص 9-10"},{"q":"كم يحتاج الدماغ في الظروف المعتادة لمعالجة المعلومات وتثبيتها في الذاكرة طويلة المدى؟","options":["نحو 15 إلى 30 ثانية","نحو ساعة واحدة","نحو 24 إلى 48 ساعة","نحو شهر"],"answer":2,"why":"يعمل الدماغ أثناء النوم على تنظيم المعلومات وربطها وتثبيتها، فالمذاكرة الموزعة مع النوم الجيد أفضل.","ref":"ص 10"},{"q":"ما «المداخل الأربعة» لحفظ المعلومات؟","options":["الفهم، والارتباط النفسي والعقلي، والممارسة العملية، والتكرار","السمع، والبصر، والشم، واللمس","القراءة، والكتابة، والتلخيص، والاختبار","الدعاء، والصدقة، والصيام، والذكر"],"answer":0,"why":"يكون تثبيت المعلومات أقوى عند اجتماع هذه المداخل.","ref":"ص 11-12"},{"q":"كم يُستحسن أن يكون عدد العناصر المراد حفظها في المرة الواحدة؟","options":["عنصران فقط","عشرون عنصرًا","لا حد لعددها","ستة أو سبعة عناصر"],"answer":3,"why":"ثم تُضاف مجموعات جديدة بعد فواصل زمنية مناسبة.","ref":"ص 17"}]},"s5":{"1":[{"q":"هل تدل الخلافات الزوجية على فشل العلاقة؟","options":["نعم دائماً","نعم إذا تكررت","لا، بل هي نتيجة طبيعية لالتقاء شخصيتين مختلفتين","نعم بعد السنة الأولى"],"answer":2,"why":"المشكلة ليست في وجود الخلاف بل في طريقة التعامل معه.","ref":"ص 2"},{"q":"بأي آية استُشهد على أن مشاعر الكره قد يكون فيها خير؟","options":["﴿فإن كرهتموهن فعسى أن تكرهوا شيئاً ويجعل الله فيه خيراً كثيراً﴾","﴿ومن آياته أن خلق لكم من أنفسكم أزواجاً﴾","﴿وقولوا للناس حسناً﴾","﴿إنما يوفى الصابرون أجرهم﴾"],"answer":0,"why":"سورة النساء: 19، فلحظات الكراهية لا ينبغي أن تكون سبباً لهدم الأسرة.","ref":"ص 2"},{"q":"لماذا نبحث في المشكلات الزوجية؟","options":["لأن السعادة الزوجية لا تتحقق إلا إذا تعلم الزوجان كيف يتعاملان مع المشكلات","لأن المشكلات مستحيلة الحل","لأنها نادرة","لأن الزواج فاشل"],"answer":0,"why":"ومنها أن الوقاية خير من العلاج وأن الأولاد يدفعون ثمن الخلافات.","ref":"ص 2-3"},{"q":"من الذي يدفع ثمن الخلافات الزوجية بحسب الدرس؟","options":["الجيران","الأولاد؛ فينشؤون أكثر عرضة للقلق والتوتر وضعف الشخصية","الأقارب","لا أحد"],"answer":1,"why":"ولذلك فإن حسن إدارة الخلافات من أولى صور رعاية الأولاد: «كلكم راعٍ ومسؤول عن رعيته».","ref":"ص 3"},{"q":"كيف يتحول الخلاف إلى عبادة ونعمة؟","options":["بإهماله","بالصبر والاحتساب فتصير المشكلة ميداناً للصبر والإحسان","بتجاهله","بالتصعيد"],"answer":1,"why":"«ما يصيب المسلم من نصب ولا وصب... إلا كفّر الله بها من خطاياه».","ref":"ص 3"},{"q":"أي مما يلي من أسباب الخلافات الزوجية؟","options":["كثرة الحوار الطيب","الاحترام المتبادل","سوء التوقعات وضعف التواصل وتراكم المشاعر السلبية وتدخل الأطراف الخارجية","تلبية الحاجات"],"answer":2,"why":"ومثال سوء التوقعات أن تظن الزوجة أن زوجها سيغمرها كل يوم بالكلام الجميل.","ref":"ص 3-4"},{"q":"متى يصح تدخل الأطراف الخارجية بحسب الآية ﴿وإن خفتم شقاق بينهما فابعثوا حكماً من أهله وحكماً من أهلها﴾؟","options":["في كل خلاف","أبداً لا يجوز","فقط بعد الطلاق","عند الحاجة، فلا يصح تدخل الأهل والأصدقاء في كل خلاف"],"answer":3,"why":"وهذا يدل على أن تدخل الآخرين يكون عند الحاجة.","ref":"ص 4"},{"q":"متى ينتهي الخلاف حقاً؟","options":["بانتصار أحدهما","بتحديد المخطئ","بالصمت","حين يسود الاحترام ويفهم كل طرف مشاعر الآخر ويعفو عنه ويتفقان على حل يمنع التكرار"],"answer":3,"why":"فالغرض ليس تحديد المخطئ وإعطاء الحق.","ref":"ص 4"},{"q":"أي مما يلي من فوائد الخلافات إذا أُديرت بحكمة؟","options":["التعرف بعمق على شخصية الآخر وتنمية الحوار والإنصات وتعزيز الصبر والحلم","القطيعة","زيادة العداوة","ضعف الشخصية"],"answer":0,"why":"ومنها تعميق المودة والرحمة وإعادة ترتيب الأولويات وتصحيح الأخطاء.","ref":"ص 4-5"},{"q":"بماذا وُصف حفل الزفاف والعقد الشرعي بحسب الدرس؟","options":["محطة وصول","نقطة انطلاق لا محطة وصول، ولا يصنعان أسرة ناجحة وحدهما","نهاية المسؤوليات","بداية السعادة الدائمة"],"answer":1,"why":"وأول سنة زواج أهم مرحلة، يصفها المختصون بـ«مرحلة تشكيل الشخصية الزوجية».","ref":"ص 5"}],"2":[{"q":"كيف يمكن تحويل الأزمات الزوجية من محن إلى منح؟","options":["بالانفصال","بإنكار المشكلة","بتحميل الطرف الآخر","بمحاسبة النفس وترتيب الأولويات وزيادة التقارب وتنمية الصبر وتقوية الإيمان"],"answer":3,"why":"فربّ ضارةٍ نافعة؛ كما في قوله تعالى ﴿فعسى أن تكرهوا شيئاً ويجعل الله فيه خيراً كثيراً﴾.","ref":"ص 2"},{"q":"ماذا ينبغي أن تفعل الزوجة الصالحة إذا فقد زوجها عمله؟","options":["تساند زوجها بالكلمة الطيبة والدعاء ولا تتهمه بالفشل","تلومه","تتركه","تطالبه بالمزيد"],"answer":0,"why":"فيكون موقفها سبباً لتجديد عزيمته وانطلاقة لنجاحات قادمة.","ref":"ص 2"},{"q":"ما أول سبيل لتحصيل السعادة في العلاقة الزوجية؟","options":["كثرة المال","بناء علاقة قوية مع الله عز وجل","كثرة الهدايا","كثرة الزيارات"],"answer":1,"why":"﴿ومن يتق الله يجعل له من أمره يسراً﴾.","ref":"ص 3"},{"q":"ما الحد الأدنى المقترح للحوار اليومي بين الزوجين؟","options":["عشر دقائق يومياً للحديث عن المشاعر والأحوال والاحتياجات","ساعة كاملة","دقيقتان","لا حاجة له"],"answer":0,"why":"بعيداً عن أجواء الشكوى والخلاف، فهذا يعزز الألفة ويمنع تراكم المشكلات.","ref":"ص 3"},{"q":"ماذا تعني «ثقافة الاعتذار» في الدرس؟","options":["اشتراط الاعتذار بالكلمات","قبول طريقة الاعتذار التي تناسب الزوج كهدية أو دعوة عشاء وليس بالكلمات فقط","عدم قبول الاعتذار","تجاهل الخطأ"],"answer":1,"why":"فقد يعبّر الزوج بطريقته الخاصة، ومن حسن العشرة قبولها.","ref":"ص 3"},{"q":"ما «القانون الأسري»؟","options":["قانون الدولة","عقوبات على الزوج","قواعد واضحة متفق عليها كالميزانية وتربية الأولاد وزيارة الأهل واستخدام الهاتف وطرق حل الخلافات","تعليمات من الأهل"],"answer":2,"why":"لتفادي وقوع الأزمات بشكل متكرر.","ref":"ص 3"},{"q":"أي من صفات خير النساء ذكرها الحديث؟","options":["التي تهجر زوجها","التي تعاند","التي تخاصم","الودود الولود التي إذا غضب زوجها جاءت حتى تضع يدها في يده وتقول: لا أذوق غمضاً حتى ترضى"],"answer":3,"why":"رواه النسائي، وإن لم يحل المشكلة فإنه يخفف حدتها ويزيد المودة.","ref":"ص 3"},{"q":"أي مما يلي من قواعد إدارة الأزمات الزوجية؟","options":["البحث عن المذنب أولاً","الاستمرار في الغضب","إيقاف الانفعال قبل التفكير في العلاج والبحث عن جذور المشكلة قبل البحث عن المذنب","تجاهل المشكلة"],"answer":2,"why":"مع توقع المشكلة وتحويل الأزمة إلى فرصة للتعلم والتقارب واتخاذ الوقاية أسلوب حياة.","ref":"ص 4"},{"q":"ما الحكمة من اختلاف الرجل والمرأة في الطباع؟","options":["سبب للعداء","دليل نقص","لا حكمة فيه","الاختلاف وسيلة للتكامل لا مسوّغ للصراع"],"answer":3,"why":"فالرجل بخشونته يسكن إلى رقة المرأة، وهي تطمئن في كنف رجل يتحلى بصفات الذكورة.","ref":"ص 4"},{"q":"بماذا فسّر الدرس حديث «الناس معادن»؟","options":["اختلاف الطباع يعني اختلاف أساليب التفكير والتصرف ولا يعني وجود خطأ عند أحد الطرفين بالضرورة","كلهم متشابهون","بعضهم معيب","الطباع لا تتغير ولا تُفهم"],"answer":0,"why":"ومثاله زوج حريص على النظام وزوجة تميل للمرونة، فاختلاف يحتاج تفهماً لا اتهاماً بالتقصير.","ref":"ص 5"}],"3":[{"q":"ما الندية في الحياة الزوجية؟","options":["التعاون والتكامل","الاحترام المتبادل","تقاسم المسؤوليات","أن يشعر أحد الزوجين أنه لا ينبغي أن يتنازل أو يستجيب أو يعترف بخطئه لأن التنازل هزيمة"],"answer":3,"why":"ومن مظاهرها العناد ورفض التنازل وحب الانتصار وتحويل كل نقاش إلى شجار.","ref":"ص 2"},{"q":"هل الندية تعني قوة الشخصية؟","options":["نعم دائماً","نعم عند الرجال","لا، فقد تكون المرأة قوية الشخصية وترفض مصارعة الرجل في قراراته","نعم عند النساء فقط"],"answer":2,"why":"ففي الحديث: «ليس الشديد بالصرعة إنما الشديد الذي يملك نفسه عند الغضب».","ref":"ص 2"},{"q":"كيف تتصرف الزوجة الحكيمة إذا أخبرها زوجها بالذهاب لبيت أمه؟","options":["ترفض فوراً","توافق وتقترح تأجيل الزيارة لبعد المغرب لتنظيم أمور البيت دون صراع","تغضب","تتجاهل"],"answer":1,"why":"فهي تبدي رأيها وتحافظ على المودة واحترام قرار الزوج.","ref":"ص 2"},{"q":"على ماذا يتحول النقاش عند الزوجة التي تتعامل بروح الندية؟","options":["إلى صراع حول من يملك القرار","إلى حوار هادئ","إلى اتفاق","إلى اعتذار"],"answer":0,"why":"فيتحول الأمر من نقاش حول التوقيت إلى صراع حول من يملك القرار.","ref":"ص 3"},{"q":"أي مما يلي من أسباب نشأة الندية؟","options":["الاحترام","حسن الخلق","التربية الخاطئة والتجارب السابقة وتأثير الإعلام وتدخل الأهل وحب السيطرة","الإيمان"],"answer":2,"why":"مثل عبارات: «لا تسمحي للرجل أن يتحكم فيك».","ref":"ص 3"},{"q":"كيف يصوّر الإعلام المرأة الناجحة بحسب الدرس؟","options":["التي تحترم زوجها","التي تطيع","التي تصبر","التي تتحدى زوجها وتتجاوز قراراته، بينما الرجل المتفهم يُصوَّر ضعيفاً"],"answer":3,"why":"فيرسّخ مفاهيم خاطئة عن العلاقة الزوجية.","ref":"ص 3"},{"q":"أي مما يلي من صور الندية داخل البيت؟","options":["التشاور","التعاون","الاحترام","العناد المستمر والإصرار على الكلمة الأخيرة وتحدي الزوج أمام الآخرين وتحويل الأولاد إلى طرف في الصراع"],"answer":3,"why":"مثل قول الزوجة لأولادها: «أبوكم لا يفهم هذا الأمر جيداً».","ref":"ص 3-4"},{"q":"أي مما يلي من دوافع الندية؟","options":["الحب والمودة","احتياجات نفسية غير مشبعة أو ظلم وخيانة متكررة أو ضعف الحوار والتواصل","الرضا","الشكر"],"answer":1,"why":"ليس بالضرورة أن تنتج عن الكبر والتعالي.","ref":"ص 4"},{"q":"ما أبرز آثار الندية على الحياة الزوجية؟","options":["زيادة التفاهم","استقرار الأسرة","إضعاف السكن والمودة وسقوط الاحترام واضطراب القيادة الأسرية وتشرب الأولاد للصراع والبرود العاطفي وقد يصل إلى الطلاق","تقوية العلاقة"],"answer":2,"why":"وقد يحدث الطلاق العاطفي قبل الطلاق الفعلي.","ref":"ص 4-5"},{"q":"ما معنى القوامة كما وضحها الدرس؟","options":["قيادة متضمنة للمسؤولية والرعاية وليست استبداداً ولا تسلطاً","استبداد الزوج","سلطة بلا مسؤولية","منافسة بين الزوجين"],"answer":0,"why":"﴿الرجال قوامون على النساء﴾؛ فإذا تحولت العلاقة إلى منافسة على القيادة فقدت الأسرة استقرارها.","ref":"ص 5"}],"4":[{"q":"كيف تدخل «فيروسات الحياة الزوجية» إلى البيوت؟","options":["تدريجياً من ممارسات صغيرة قد لا ينتبه لها الزوجان","دفعة واحدة","فجأة بلا مقدمات","من الخارج فقط"],"answer":0,"why":"ثم تتفاقم حتى تترك أثراً عميقاً، فلا بد من معالجتها في مراحلها الأولى.","ref":"ص 2"},{"q":"ما الخيانة بحسب الدرس؟","options":["مجرد خلاف","سوء تفاهم","إخلال بالأمانة وإفساد للثقة التي تقوم عليها العلاقة بين الزوجين","مزحة"],"answer":2,"why":"فالزوجان مؤتمنان على الأعراض والمشاعر والأسرار والخصوصيات.","ref":"ص 2"},{"q":"هل تقتصر الخيانة على الزنا؟","options":["نعم فقط الزنا","لا، فمن صورها المراسلات العاطفية السرية والتعلق العاطفي بآخر وكشف أسرار الزوج","نعم فقط الهجر","لا توجد صور أخرى"],"answer":1,"why":"وإن كان الزنا من أشنع صورها، وتبدأ حين يتهاون الإنسان في حد من الحدود.","ref":"ص 3"},{"q":"أي مما يلي من أسباب الخيانة؟","options":["كثرة الحوار","الفراغ العاطفي وضعف الوازع الديني والبحث عن الإعجاب والهروب من مشكلات الزواج","القرب من الله","الرضا"],"answer":1,"why":"وهذه الأسباب ليست مبررات؛ فلا يعالج المرء مشكلاته بالحرام.","ref":"ص 3"},{"q":"بأي آية استُشهد على النهي عن الاقتراب من الزنا؟","options":["﴿وأقيموا الصلاة﴾","﴿ولا تقتلوا النفس﴾","﴿ولا تقربوا الزنى إنه كان فاحشة وساء سبيلاً﴾","﴿يا أيها الذين آمنوا اتقوا الله﴾"],"answer":2,"why":"سورة الإسراء: 32، فللزنا مقدمات وطرق تؤدي إليه نهانا الله عن الاقتراب منها.","ref":"ص 3"},{"q":"كيف تبدأ الخيانة الإلكترونية؟","options":["بخطوة صغيرة كإعجاب متكرر ثم تعليق ثم رسائل خاصة ثم خصوصية وسرية وتعلق","بإخلاص مباشر","بالصدق","بالتزام الحدود"],"answer":0,"why":"ولذلك ينبغي للزوجين المحافظة على حدود واضحة في التعامل مع الجنس الآخر.","ref":"ص 4"},{"q":"هل علامات الخيانة المذكورة (كحماية الهاتف وحذف الرسائل) أدلة قطعية؟","options":["نعم قطعية","نعم دائماً","تدل على الخيانة تماماً","لا، فقد يكون لكل منها أسباب أخرى فلا يصح بناء الاتهام عليها بمجرد ظهورها"],"answer":3,"why":"ومن العلامات المبالغة في حماية الهاتف والفتور المفاجئ وتغير الاهتمام بالمظهر.","ref":"ص 4"},{"q":"ما خطوات علاج فيروس الخيانة؟","options":["الاستمرار مع الكتمان","التوقف فوراً والتوبة إلى الله وتحمل المسؤولية دون تبرير وقطع أسباب العودة وإعادة بناء الثقة","لوم الآخر","تجاهل الأمر"],"answer":1,"why":"﴿إلا من تاب وآمن وعمل عملاً صالحاً فأولئك يبدل الله سيئاتهم حسنات﴾، والثقة تحتاج وقتاً وصدقاً.","ref":"ص 4-5"},{"q":"ما حد الغيرة المحمودة وما المذموم منها؟","options":["كل غيرة مذمومة","كل غيرة محمودة","لا غيرة في الإسلام","الطبيعية محمودة، وما تجاوز الاعتدال وصار غيرة مرضية بالتتبع دون دليل مذموم"],"answer":3,"why":"وفيه مخالفة لقوله تعالى ﴿اجتنبوا كثيراً من الظن﴾.","ref":"ص 5"},{"q":"ما الحديث الذي استُشهد به في النهي عن الظن والتجسس؟","options":["«الدين النصيحة»","«إنما الأعمال بالنيات»","«إياكم والظن فإن الظن أكذب الحديث ولا تجسسوا ولا تحسسوا»","«خيركم خيركم لأهله»"],"answer":2,"why":"رواه البخاري، وقد جمعت الآية بين النهي عن الظن السيئ والتجسس.","ref":"ص 5"}],"5":[{"q":"كيف تتدهور العلاقة الزوجية غالباً؟","options":["تنهار فجأة","تتآكل بصمت بتراكم مواقف صغيرة دون علاج","بسبب الغرباء فقط","بسبب المال فقط"],"answer":1,"why":"كلمة جارحة لم يُعتذر عنها أو مقارنة أو إهمال، ثم تتسع المسافة مع الوقت.","ref":"ص 2"},{"q":"هل كل بيت هادئ بيت سعيد؟","options":["نعم دائماً","نعم عند الأزواج الكبار","لا، فقد يخفي الهدوء علاقة فقدت حيويتها وانسحاباً عاطفياً","نعم إن لم يكن فيه أولاد"],"answer":2,"why":"فينبغي التفريق بين هدوء العلاقة وحيويتها.","ref":"ص 2"},{"q":"ما معنى تدهور العلاقة الزوجية؟","options":["تحول المودة إلى برود والحوار إلى صمت والاهتمام إلى إهمال والشعور بـ«نحن» إلى «أنا وأنت»","زيادة الحب","تقوية الحوار","كثرة الهدايا"],"answer":0,"why":"وهو لا يحدث فجأة بل على مدار سنوات بسبب مئات المواقف.","ref":"ص 2"},{"q":"ما المقصود بـ«اختفاء الحوار الحقيقي»؟","options":["عدم الكلام نهائياً","كثرة الصراخ","غياب حديث كل طرف عن نفسه ومشاعره للآخر رغم كثرة الكلام","كثرة المزاح"],"answer":2,"why":"فقد يتحدث الزوجان طوال الوقت ويغيب الحوار الحقيقي.","ref":"ص 3"},{"q":"ما مظهر «غياب الاهتمام بالتفاصيل»؟","options":["أن يجلس أحدهما منهاراً أو منهكاً دون أن يسأله الآخر عن حاله","كثرة السؤال","التفقد","الاعتذار"],"answer":0,"why":"بينما في بداية الزواج يكون كل منهما شديد الانتباه للآخر.","ref":"ص 3"},{"q":"ماذا يعني أن يتحول أحد الزوجين إلى «مصدر ضغط» للآخر؟","options":["أن يزداد القرب","أن يزداد الحب","أن يتحسن الحوار","أن يصبح البيت مكاناً يُهرب منه بدل أن يكون ملجأً"],"answer":3,"why":"فيهرب الزوج ويقضي أطول وقت خارج البيت ولا يعود إلا للنوم.","ref":"ص 3"},{"q":"ما الجفاف العاطفي؟","options":["غياب الاستمتاع بالعلاقة بسبب غياب الكلمة الطيبة والاعتذار والشوق والتقدير والاحترام","غياب المال","غياب المسؤولية","غياب الأولاد"],"answer":0,"why":"ولا يعني بالضرورة غياب الحب، ويشبه الأرض التي لم تُسقَ منذ وقت طويل.","ref":"ص 3-4"},{"q":"ما الحديث الذي ذُكر في المشاعر والتعامل مع الأهل؟","options":["«الدين النصيحة»","«خيركم خيركم لأهله وأنا خيركم لأهلي»","«إنما الأعمال بالنيات»","«المسلم من سلم المسلمون»"],"answer":1,"why":"رواه الترمذي، وينبغي أن نراقب أنفسنا في تعاملنا مع أهل بيتنا.","ref":"ص 4"},{"q":"بماذا وصف الله تعالى العلاقة الزوجية في الآية؟","options":["العقد المؤقت","الاتفاق البسيط","الصفقة","الميثاق الغليظ"],"answer":3,"why":"﴿وأخذن منكم ميثاقاً غليظاً﴾، فقرار استمرارها أو هدمها لا ينبغي أن يُبنى على مزاج يوم واحد أو خطأ واحد.","ref":"ص 4"},{"q":"ما أحد جذور المشكلات الزوجية الذي ذكره الدرس؟","options":["حل مشكلة اليوم فقط","الاعتذار","النسيان","استدعاء مشكلات الماضي وفتح الملفات القديمة عند كل خلاف"],"answer":3,"why":"فمن أكبر الأخطاء جعل الخلافات الحالية سبباً لاستجلاب القديمة.","ref":"ص 5"}],"6":[{"q":"متى تكون العلاقة الزوجية ناجحة رغم الخلاف؟","options":["حين يبقى فيها الأمان والمودة قائمين حتى مع الخلاف","حين لا يوجد خلاف أبداً","حين يتفق الزوجان في كل شيء","حين يسكت أحدهما"],"answer":0,"why":"فالخلاف طبيعي ولا يدل على فشل الزواج، والخطر حين يحول الزوجان المواقف إلى اتهامات.","ref":"ص 2"},{"q":"ما القاعدة التي ذكرها الدرس عن المخالفة؟","options":["كل مخالف عدو","ليس كل من يخالفك يقصد إيذاءك","كل خلاف سوء نية","المخالف يريد الانتصار"],"answer":1,"why":"واختلاف وجهات النظر لا يعني فساد نية أي منهما.","ref":"ص 2"},{"q":"ما الفرق بين الخلاف والصراع؟","options":["في الصراع يصبح الهدف الانتصار على الآخر وإثبات خطئه","لا فرق بينهما","الخلاف أخطر","الصراع أهدأ"],"answer":0,"why":"في الخلاف نناقش التصرف، وفي الصراع نهاجم الشخص.","ref":"ص 2-4"},{"q":"أي عبارة تمثل خلافاً طبيعياً؟","options":["«أنت دائماً تفعل كذا»","«أنت لا تفهم»","«لن أتحدث معك حتى تعتذر»","«أنا غير مقتنع بهذا التصرف وأريد أن نفكر في حل»"],"answer":3,"why":"فهي تناقش التصرف دون اتهام للشخص.","ref":"ص 3"},{"q":"ما سلسلة تحول الخلاف إلى معركة كما ذكرها الدرس؟","options":["اختلاف ← انفعال ← اتهام ← دفاع ← هجوم مضاد ← استدعاء الماضي ← تهديد ← تدخل الأهل ← مشكلة كبيرة","اختلاف ← صلح","اتهام ← اعتذار","تهديد ← اتفاق"],"answer":0,"why":"فالمشكلات الكبيرة لا تحدث فجأة.","ref":"ص 4"},{"q":"أي مما يلي من مخاطر الصراع بين الزوجين؟","options":["زيادة التفاهم","تقوية العاطفة","فقدان الأمان وتراكم الاستياء وتشوه صورة كل زوج عند الآخر وتأثر الأولاد","راحة الأولاد"],"answer":2,"why":"فالأولاد بحاجة للشعور بالأمان داخل البيت ومن أهم ما يحققه لهم علاقة الوالدين.","ref":"ص 4"},{"q":"ما الآية المستشهد بها في النهي عن السخرية والتجريح؟","options":["﴿وأقيموا الصلاة﴾","﴿وما خلقت الجن والإنس﴾","﴿إنما المؤمنون إخوة﴾","﴿لا يسخر قوم من قوم عسى أن يكونوا خيراً منهم﴾"],"answer":3,"why":"سورة الحجرات: 11، وأثر الكلمة قد يبقى سنوات بعد انتهاء المشكلة.","ref":"ص 5"},{"q":"ما حكم الصراخ ورفع الصوت أثناء الخلاف؟","options":["دليل القوة","ليس دليلاً على الحق والقوة بل يتناقض مع حسن العشرة ويفاقم المشكلة","وسيلة ناجحة","مستحب"],"answer":1,"why":"وقد يصل إلى الضرب.","ref":"ص 5"},{"q":"ما الفرق بين صمت التهدئة والصمت العقابي؟","options":["لا فرق","كلاهما محمود","التهدئة تأجيل الكلام لحين الهدوء وهو محمود، والعقابي تجنب الآخر أياماً للإذلال وهو محرم","كلاهما محرم"],"answer":2,"why":"لقوله ﷺ: «ولا يحل لمسلم أن يهجر أخاه فوق ثلاث» والعلاقة الزوجية أولى بحسن الخلق.","ref":"ص 6"},{"q":"ماذا قال النبي ﷺ عن كشف الأسرار الزوجية؟","options":["لا حرج فيه","إن من أشر الناس عند الله منزلة يوم القيامة الرجل يفضي إلى امرأته وتفضي إليه ثم ينشر سرها","مستحب","مباح دائماً"],"answer":1,"why":"رواه مسلم، ويُكشف من الأسرار قدر الحاجة فقط لمن يُستأمن عند الاحتياج للإصلاح.","ref":"ص 6"}],"7":[{"q":"ما المقصود بالمرجعية الإسلامية في حل الخلافات الزوجية؟","options":["أن يستعمل أحدهما النصوص ضد الآخر","أن يحتكما للأقوى","أن يتبعا الأعراف","أن يقف الزوجان معاً أمام الكتاب والسنة ويبحثا عن الحق لا أن يرفع كل طرف النصوص في وجه الآخر"],"answer":3,"why":"وغايتهما حفظ البيت والحقوق والمودة والرحمة.","ref":"ص 2"},{"q":"بأي آية استُشهد على الاحتكام إلى الله ورسوله عند التنازع؟","options":["﴿فإن تنازعتم في شيء فردوه إلى الله والرسول إن كنتم تؤمنون بالله واليوم الآخر﴾","﴿وأقيموا الصلاة﴾","﴿وقولوا للناس حسناً﴾","﴿وعاشروهن بالمعروف﴾"],"answer":0,"why":"سورة النساء: 59، وهذه صفة المؤمن الذي لا يخاف من الاعتراف بالخطأ.","ref":"ص 2"},{"q":"إلى من لا نحتكم عند التنازع بحسب الدرس؟","options":["إلى الصوت الأعلى أو الأكثر عناداً أو الأقدر على الضغط","إلى كتاب الله","إلى سنة النبي ﷺ","إلى ما يرضي الله"],"answer":0,"why":"فقد يكون كلا الزوجين على خطأ، ولكن نحتكم إلى ما يرضي الله.","ref":"ص 2"},{"q":"ما أخطر عوائق الصلح بين الزوجين؟","options":["البحث عن الانتصار للنفس فيتحول الخلاف إلى معركة كرامة","الاعتذار","العفو","الحوار"],"answer":0,"why":"فيرفض المخطئ التنازل وإن تبين له خطؤه.","ref":"ص 3"},{"q":"ما الحديث الذي ذُكر في فضل العفو؟","options":["«إنما الأعمال بالنيات»","«وما زاد الله عبداً بعفو إلا عزاً»","«الدين النصيحة»","«خيركم خيركم لأهله»"],"answer":1,"why":"رواه مسلم، فالعفو لا ينقص من كرامة الإنسان.","ref":"ص 3"},{"q":"ما الآية الدالة على الرضا بحكم الله وعدم وجود حرج في النفس؟","options":["﴿قل هو الله أحد﴾","﴿فلا وربك لا يؤمنون حتى يحكموك فيما شجر بينهم ثم لا يجدوا في أنفسهم حرجاً مما قضيت ويسلموا تسليماً﴾","﴿وأقيموا الصلاة﴾","﴿إنا أنزلناه﴾"],"answer":1,"why":"سورة النساء: 65، مع استحضار أن الزواج ميثاق غليظ.","ref":"ص 3"},{"q":"ما معنى العدل بين الزوجين عند الغضب؟","options":["أن يظلم أحدهما","أن يعتمد على العيوب","أن يُنصف كل منهما الآخر حتى مع مشاعر الكره ولا ينسى إحسان سنوات طويلة","أن ينسى الإحسان"],"answer":2,"why":"﴿ولا يجرمنكم شنآن قوم على ألا تعدلوا اعدلوا هو أقرب للتقوى﴾.","ref":"ص 4"},{"q":"ما الحديث الذي يعلّمنا ألا نحكم على الشخص بموقف واحد؟","options":["«إنما الأعمال بالنيات»","«الدين النصيحة»","«لا يفرك مؤمن مؤمنة إن كره منها خلقاً رضي منها آخر»","«المسلم أخو المسلم»"],"answer":2,"why":"رواه مسلم، وهي قاعدة عظيمة في حل الخلاف.","ref":"ص 4"},{"q":"متى تظهر حقيقة الأخلاق والإحسان؟","options":["عند الرخاء فقط","عند الاختلاف وليس عند استقرار الحياة بلا خلاف","عند السفر","عند الضيافة"],"answer":1,"why":"﴿وعاشروهن بالمعروف﴾، وتظهر المعاشرة بالمعروف بشكل أقوى عند الخلاف.","ref":"ص 5"},{"q":"ما حدود العفو والتسامح بحسب الدرس؟","options":["يعني السكوت عن كل شيء","يعني الانتقام","يعني إخفاء الظلم","لا يعني تجاهل المشكلة أو السكوت عن الظلم أو إهانة الكرامة، بل الفرق بين معالجة الخطأ وتخزينه للانتقام"],"answer":3,"why":"فبناء الأسرة يحتاج إلى ذاكرة واعية تتعلم من الماضي لا ذاكرة انتقامية، ولا يرفض أي منهما اعتذار الآخر.","ref":"ص 5"}],"8":[{"q":"بمَ شبّه الدرس اللحظة الأولى للخلاف؟","options":["بنهر هادئ","بجبل ثابت","بشرارة نار إن أُطفئت سريعاً لم تترك أثراً وإلا أشعلت ما حولها","بشجرة"],"answer":2,"why":"فهي لحظات ثمينة غالباً ما تحدد مصير الخلاف ومآله.","ref":"ص 2"},{"q":"ما أول ما يُنصح به في اللحظة الأولى للخلاف؟","options":["الاتهام السريع","الصراخ","التهديد","تجنب سوء الظن وتفسير الموقف تفسيراً صحيحاً"],"answer":3,"why":"﴿اجتنبوا كثيراً من الظن إن بعض الظن إثم﴾، فكثير من المشكلات تنتهي حين يكتشف أحدهما أنه أساء فهم الموقف.","ref":"ص 3"},{"q":"ما الأسئلة التي تسألها الزوجة لنفسها قبل أن تحكم على زوجها؟","options":["ماذا حدث فعلاً؟ هل ما فهمته واقعي؟ هل يمكن أن يكون هناك تفسير آخر؟","لماذا هو سيئ؟","كيف أنتقم؟","من الأقوى؟"],"answer":0,"why":"ولا تجعل موقفاً عابراً دليلاً على فساد الطرف الآخر أو فساد نيته.","ref":"ص 3"},{"q":"ما الفرق بين المشكلة والخلاف والصراع؟","options":["هي كلمات مترادفة","الخلاف أخطرها","المشكلة أمر يؤثر في الحياة الزوجية، والخلاف اختلاف في الرؤية أو الوسيلة، والصراع اتهام متبادل وسعي للانتصار","الصراع أبسطها"],"answer":2,"why":"ومثاله الاختلاف حول اختيار مدرسة الأولاد؛ طبيعي ما لم يتحول إلى اتهامات.","ref":"ص 3"},{"q":"ماذا ينبغي أن تتذكره الزوجة عند الاختلاف؟","options":["أن زوجها خصم","أن تنتصر عليه","أنهما فريق واحد لهما أهداف مشتركة، وأن المشكلة خصم مشترك لا الزوج","أن تنسحب من الحياة"],"answer":2,"why":"فلا يؤدي الاختلاف إلى مواجهات شرسة.","ref":"ص 3"},{"q":"لماذا تكون اللحظات الأولى في الخلاف حاسمة؟","options":["لأنها أطول","لأن البدء بالإهانة والاتهام يجعل الآخر يشعر بالتهديد فيدافع ثم يهاجم","لأنها بلا أثر","لأنها لا تؤثر في المصير"],"answer":1,"why":"وأول جملة تصدر منك في ردة فعلك تحدد التصعيد أو التهدئة.","ref":"ص 4"},{"q":"أي مما يلي من أخطر الأخطاء في بداية الخلاف؟","options":["الحوار الهادئ","الاعتذار","الإنصات","التعميم والإهانة الشخصية والتهديد وفتح الملفات القديمة والضرب أو التخويف"],"answer":3,"why":"فالغضب ليس مسوّغاً لإهانة الآخر أو الاعتداء عليه.","ref":"ص 4"},{"q":"ما الفرق بين الانسحاب للهدوء والهجر العقابي؟","options":["الانسحاب علامة حكمة يوضح فيه المرء أنه يحتاج إلى وقت ليهدأ، أما الهجر فصمت للعقاب","هما واحد","كلاهما محمود","كلاهما محرم"],"answer":0,"why":"«خذ استراحة من الخلاف وليس من الحياة الزوجية».","ref":"ص 5"},{"q":"ما القاعدة النبوية لعلاج الغضب المذكورة في الدرس؟","options":["«اغضب ولا تتوقف»","«إذا غضب أحدكم وهو قائم فليجلس، فإن ذهب عنه الغضب وإلا فليضطجع»","«اصرخ حتى ترتاح»","«اهجر من أغضبك»"],"answer":1,"why":"رواه أبو داود، مع الاستعاذة بالله، فالغضب ليس عذراً للإذلال والإهانة.","ref":"ص 5"},{"q":"أي مما يلي كلمات تطفئ الخلاف؟","options":["«أنت دائماً لا تحترمني»","«هل يمكن أن أفهم ما الذي حصل؟ أحتاج وقتاً حتى أهدأ ثم نتحدث»","«أنا نادمة أني تزوجتك»","«أنت لا تهتم بي»"],"answer":1,"why":"أما الكلمات المشعلة فمنها: «أنت دائماً لا تحترمني»، وأخطرها: «أنا نادمة أني تزوجتك».","ref":"ص 5-6"}],"9":[{"q":"بمَ يتعلق اختلاف تعامل الزوجات مع الخلافات؟","options":["بمدى حبها لزوجها فقط","بعمر زوجها","بمستوى دخله","بطبيعتها وتكوينها ودينها وما تعتقده أنسب لحل الخلاف لا بمدى حبها لزوجها"],"answer":3,"why":"حتى وإن كان ما تعتقده خاطئاً.","ref":"ص 2"},{"q":"ما الزوجة الصامتة؟","options":["التي تتحدث كثيراً","التي تصرخ","التي تختار الصمت وإن شعرت بالغضب والألم لخوفها أن يكبر الخلاف أو لاعتقادها أن الكلام لا ينفع","التي تعتذر"],"answer":2,"why":"وقد تصمت لتنتظر أن يفهم زوجها مشاعرها من تلقاء نفسه.","ref":"ص 2"},{"q":"ما القاعدة في المشاعر التي لا نعبّر عنها بطريقة صحيحة؟","options":["تختفي","لا تختفي ولكنها تتراكم","تزول مع الوقت","تتحول إلى حب"],"answer":1,"why":"فتؤدي إلى انفجار مفاجئ أو نفور من الزوج.","ref":"ص 3"},{"q":"متى يكون الانسحاب صحياً عند الزوجة المنسحبة؟","options":["إذا كان مؤقتاً بهدف تهدئة النقاش مع تبيين ذلك للزوج وتأجيله لأوقات الهدوء","إذا كان دائماً","إذا استمر دون اتفاق","إذا قطعت الحوار"],"answer":0,"why":"قاعدة: يجوز أن نؤجل الحوار لنهدأ، لكن لا يجوز أن نهرب من المشكلة.","ref":"ص 3"},{"q":"ما خطر الزوجة المؤجلة؟","options":["حل المشكلات مبكراً","تراكم المشكلات حتى تنفجر أزمة وتدخل معها التفسيرات والظنون","الهدوء","الراحة"],"answer":1,"why":"﴿فاتقوا الله وأصلحوا ذات بينكم﴾؛ فالإصلاح يحتاج مبادرة، وكلما حُلّ الخلاف في بدايته كان أرجى لإعادة المودة.","ref":"ص 3"},{"q":"متى يكون تأجيل الحوار حكمة لا هروباً؟","options":["إذا ألغيت المشكلة","إذا كان المقصود اختيار ظرف أنسب كأن يكون الأولاد نائمين","إذا أُهملت سنة","إذا تُجوهلت"],"answer":1,"why":"قاعدة: أجّلي الحوار إلى الوقت المناسب، لكن لا تؤجلي المشكلة حتى تصبح أزمة.","ref":"ص 4"},{"q":"ما الخطأ الذي تقع فيه الزوجة المتحملة؟","options":["أن تتكلم بأدب","أن تطلب حقها","أن تظن أن الزوجة الصالحة هي التي تتحمل كل شيء ولا تتحدث عن المشكلات","أن تستعين بأهل الحكمة"],"answer":2,"why":"والصبر لا يعني ترك المشكلات دون علاج.","ref":"ص 4"},{"q":"ما قاعدة الصبر كما ذكرها الدرس؟","options":["الصبر لا يعني إلغاء الحقوق وإنما طلبها بحكمة دون ظلم أو عدوان","الصبر يعني الصمت دائماً","الصبر يعني التنازل عن كل شيء","الصبر يعني الهروب"],"answer":0,"why":"﴿إن الله مع الصابرين﴾، فقد يكون من الصبر أن تطالب بحقها بأدب وتستعين بأهل الحكمة.","ref":"ص 4-5"},{"q":"بأي آية استُشهد على الإصلاح بتدخل الحكمين عند اشتداد الخلاف؟","options":["﴿وأقيموا الصلاة﴾","﴿وقولوا للناس حسناً﴾","﴿وإن خفتم شقاق بينهما فابعثوا حكماً من أهله وحكماً من أهلها إن يريدا إصلاحاً يوفق الله بينهما﴾","﴿إنما المؤمنون إخوة﴾"],"answer":2,"why":"سورة النساء: 35، فبعض المشكلات تحتاج إلى تدخل إصلاحي لا إلى الصمت وحده.","ref":"ص 4"},{"q":"ما الزوجة الانفعالية؟","options":["الهادئة","الصامتة","المنسحبة","التي إذا غضبت تحدثت قبل أن تفكر فترتفع نبرتها وتستخدم عبارات جارحة"],"answer":3,"why":"ويبيّن الحديث: «ليس الشديد بالصرعة إنما الشديد الذي يملك نفسه عند الغضب».","ref":"ص 5"}],"10":[{"q":"ما أحد أسباب الخلافات المرتبطة بالتواصل؟","options":["كثرة الحوار الهادئ","حسن الظن","سوء الفهم وسوء تفسير الكلام","اختيار التوقيت المناسب"],"answer":2,"why":"وكثير منها يمكن تجنبه بحسن الظن ونبرة الصوت المناسبة واختيار التوقيت وتجنب مواطن الحساسية.","ref":"ص 2"},{"q":"ماذا قال الزوج في مثال الغداء وكيف تُحمل عبارته على أحسن المحامل؟","options":["«حضري أي شيء تريدينه» وتُفهم أنه يثق باختيارها","يُفهم أنه لا يهتم دائماً","يُفهم أنه غاضب","يُفهم أنه يرفض"],"answer":0,"why":"فالحل إيقاف التفسيرات السيئة وحمل كلام الزوج على أحسن المحامل والتماس العذر له.","ref":"ص 2"},{"q":"ما الفرق بين النية والكلام؟","options":["النية تكفي دائماً","الكلام لا أثر له","لا يكفي أن تكون النية حسنة، فقد يتأذى الزوج من كلمة ألقيت بلا بال","لا فرق بينهما"],"answer":2,"why":"فاختاري الكلمات الحسنة والأسلوب الطيب لإيصال مشاعرك واحتياجاتك.","ref":"ص 2"},{"q":"ما الذي يُنصح به عند الشعور بالغضب وصعوبة ضبط الانفعال؟","options":["تغيير الحالة فوراً بالانتقال لشيء آخر كالوضوء وركعتين","الصراخ","إغلاق الباب بقوة","الاتهام"],"answer":0,"why":"وأفضل ذلك كله صلاة ركعتين.","ref":"ص 3"},{"q":"ما الخطر في أن ينسحب أحد الطرفين من الحوار دون اتفاق؟","options":["لا خطر فيه","قد يشعر الطرف الآخر بعدم الاحترام","يؤدي إلى الصلح السريع","يزيد المودة"],"answer":1,"why":"والأحسن تأجيل الحوار بالاستئذان وبيان سبب التأجيل وتحديد موعد للعودة إليه.","ref":"ص 3"},{"q":"ماذا يحدث عادة عند ارتفاع صوت أحد الزوجين أو اتهامه؟","options":["يرد الآخر بنفس الطريقة","يهدأ الآخر","يعتذر","يصمت دائماً"],"answer":0,"why":"لذلك يُنصح بمناقشة السلوك دون اتهام الشخص ومهاجمته.","ref":"ص 4"},{"q":"ما سبب بعض الخلافات التي تظهر على شكل عتاب أو غضب أو اتهامات؟","options":["كثرة التعبير","وضوح الطلب","الاعتذار","ضعف التعبير عن المشاعر والاحتياجات"],"answer":3,"why":"كزوجة تحتاج مساعدة لكنها لا تطلبها وتنتظر أن يلاحظ، ثم تتهمه بالإهمال.","ref":"ص 4"},{"q":"ما القاعدة إذا احتجتِ إلى شيء من زوجك؟","options":["انتظري حتى يخمّن","اصمتي","اتهميه بالتقصير","اطلبيه منه بوضوح وبطريقة مهذبة ولا تترددي في التعبير عن مشاعرك واحتياجاتك"],"answer":3,"why":"فهذا أدعى لحفظ الود وحماية العلاقة من سوء الفهم والخلافات.","ref":"ص 4"},{"q":"أي مما يلي من قواعد التواصل التي ذكرها الدرس؟","options":["فسّري سريعاً","اهجري زوجك","اجعلي هدفك الانتصار","لا تفسري قبل أن تتبيني، ولا تستخدمي الصمت العقابي، ولا تجعلي هدف النقاش انتصارك"],"answer":3,"why":"واجعلي هدفك حلاً يضمن بقاء الود.","ref":"ص 4"},{"q":"ما التوجيه عند الخلاف حول تقسيم الأدوار والمسؤوليات المنزلية؟","options":["محاسبة متكررة","مراعاة ظروف كل طرف وعدم اتهامه بالتقصير عند الظرف الاستثنائي، وأن تكون المسؤوليات واضحة","تكليفه بما لا يطيق","تجاهل الأدوار"],"answer":1,"why":"فقد تشعر الزوجة أن ما تقوم به داخل البيت غير مقدَّر، وقد يشعر الزوج أن ما يبذله خارجه كذلك.","ref":"ص 5"}],"11":[{"q":"ما المقصود بـ«التواصل العاطفي مع الآخرين» من صور العلاقات المحرمة؟","options":["أن يكثر أحد الزوجين من الحديث مع زوجه","أن ينقل أحد الزوجين احتياجاته العاطفية لشخص آخر خارج العلاقة الشرعية","أن يستشير أحد الزوجين مرشدًا أسريًا مختصًا","أن يتحدث أحد الزوجين مع أهله عن مشكلاته"],"answer":1,"why":"ومن أشكاله: الفضفضة، والبحث عن الاحتواء، ومشاركة التفاصيل الخاصة، والشعور بالسعادة عند التواصل مع الجنس الآخر، ثم يتطور الأمر إلى ما هو أسوأ.","ref":"ص 2"},{"q":"ما الذي تدل عليه آية ﴿ولا تقربوا الزنى إنه كان فاحشة وساء سبيلًا﴾ بحسب الدرس؟","options":["أن الشريعة لم تمنع الفاحشة فقط، بل منعت كل الطرق المؤدية إليها ومنها العلاقات العاطفية المحرمة","أن العلاقات العاطفية جائزة ما لم تصل إلى الفاحشة","أن المنع خاص بالفاحشة نفسها دون مقدماتها","أن الآية خاصة بغير المتزوجين"],"answer":0,"why":"بيّن الله قواعد ثابتة حتى لا يقع الإنسان في الزنى، فمنع كل الطرق المؤدية إليه.","ref":"ص 2"},{"q":"في مثال الزوجة التي تقول: «زوجي يهملني لكن زميلي في العمل يهتم لأمري»، أين تكمن المشكلة الحقيقية؟","options":["في عدم مصارحة الزوج بالأمر","في قبول الإشباع العاطفي من علاقة محرمة خارج إطار الزواج","في عمل المرأة وحده","في وجود شخص يهتم بها ويستمع إليها"],"answer":1,"why":"تقصير أحد الزوجين -إن وُجد- ليس مبررًا للخيانة والعلاقة المحرمة؛ فالتقصير لا بد أن يعالَج، والحرام لا بد أن يتوقف.","ref":"ص 2"},{"q":"ما موقف الدرس من خصوصية الهاتف بين الزوجين؟","options":["كل خصوصية خيانة يجب كشفها","التفتيش حق مشروع لكل طرف في كل وقت","الشك وحده يبرر التجسس","ليست كل خصوصية خيانة، ولا يصح معالجة خطأ بخطأ آخر، فلا بد من قدر من التوازن"],"answer":3,"why":"كم من مشكلات زوجية حصلت بسبب تجسس أحد الزوجين على هاتف الآخر، لذلك لا بد من التوازن.","ref":"ص 3"},{"q":"كيف تُستعاد الثقة بين الزوجين بعد الخيانة؟","options":["بسلوك متكرر مع الزمن: قطع العلاقة المحرمة، والاعتراف دون تبرير، والشفافية، ومعالجة الأسباب، والصبر على مرحلة الشك","بالاعتذار مرة واحدة ثم نسيان الأمر","بكثرة الوعود دون تغيير","بتجنب الحديث عن المشكلة تمامًا"],"answer":0,"why":"لا يكفي الاعتذار، فالثقة تنتج عن سلوك متكرر مع الزمن، وكلما زادت السرية بعد الخيانة زاد الشك.","ref":"ص 3"},{"q":"ماذا قال النبي ﷺ في الحديث الذي استدل به الدرس على أن الإهانة والسخرية ليست وسائل للإصلاح؟","options":["«خيركم خيركم لأهله»","«الكلمة الطيبة صدقة»","«لا تغضب»","«ليس المؤمن بالطعان ولا اللعان ولا الفاحش ولا البذيء»"],"answer":3,"why":"الإهانة والسخرية ورفع الصوت أساليب هدامة للعلاقة، والكلام الطيب من أهم ما يبذر الود في العلاقة الزوجية.","ref":"ص 4"},{"q":"أي مما يلي ليس من وسائل استعادة الاحترام والاهتمام في العلاقة الزوجية؟","options":["البدء بالإشارات الصغيرة على مدار اليوم","إيقاف السلوك المؤذي","جعل الاهتمام ردة فعل عند وقوع الخلاف فقط","تقدير كل زوج للآخر أمام الأولاد"],"answer":2,"why":"من الوسائل أيضًا: التعبير عن الاحتياجات دون اتهام، وجعل الاهتمام عادة لا ردة فعل.","ref":"ص 4"},{"q":"إذا تعارضت القرارات التربوية بين الوالدين، فما التوجيه الذي ذكره الدرس؟","options":["يناقش الوالدان الخلاف أمام الطفل ليتعلم الحوار","يقدَّم رأي الأم دائمًا لأنها الأقرب إلى الطفل","يُترك الطفل يختار الرأي الذي يناسبه","يقدَّم رأي الأب لكونه صاحب القوامة شرعًا، ويناقش الوالدان الخلاف بعيدًا عن الطفل ثم يخرجان بقرار مشترك"],"answer":3,"why":"لا تجعلوا أولادكم يحضرون مجلس الإدارة إذا كان فيه اختلاف؛ فالقرار المشترك يعزز ثقة الأولاد في الآباء.","ref":"ص 5"},{"q":"كيف يتعايش الزوجان مع اختلاف الطباع والشخصيات؟","options":["بتجنب الحديث في أي أمر مختلف فيه","بأن يتنازل طرف واحد دائمًا","بالفصل بين الاختلاف والعيوب الشخصية، والبحث عن مساحات الاتفاق، والتنازل المتبادل","بأن يحاول كل طرف إعادة تشكيل الطرف الآخر"],"answer":2,"why":"الاختلاف أمر طبيعي لا بد منه، والحياة الزوجية ليس فيها طرف منتصر وآخر خاسر.","ref":"ص 6"},{"q":"ما الاعتذار الحقيقي بحسب القواعد المهمة في الدرس؟","options":["أن يكون بتغيير السلوك لا بمجرد قول «آسف»","أن نطلب من الطرف الآخر الاعتذار أولًا","أن نشرح أسباب الخطأ ونبرره","أن نقول «آسف» بصوت مسموع"],"answer":0,"why":"ومن القواعد كذلك: الثقة لا تعود بالكلام، ولكن بالسلوك المتكرر مع الزمن حتى يشعر الطرف الآخر بالأمان.","ref":"ص 7"}],"12":[{"q":"بمَ تقاس جودة الحياة الزوجية بحسب مقدمة الدرس؟","options":["بغياب الخلافات تمامًا","بقلة الخلافات وقدرة الزوجين على حسن إدارتها","بتطابق شخصيتي الزوجين","بكثرة تنازل أحد الطرفين"],"answer":1,"why":"تصور الحياة الزوجية دون خلافات تصور غير واقعي؛ لأن الزوجين شخصان مختلفان في كثير من الجوانب.","ref":"ص 2"},{"q":"ما المقصود باستراتيجية «احتواء الخلاف وخفض التصعيد»؟","options":["فرض الرأي لإنهاء النقاش سريعًا","تجاهل مشاعر الطرف الآخر","تأجيل حل المشكلة إلى الأبد","منع المشكلة من التوسع قبل البحث عن حل"],"answer":3,"why":"ليست كل لحظة مناسبة لمناقشة المشكلة، فأسلوب الطرح وتوقيته قد يؤديان إلى التصعيد.","ref":"ص 2"},{"q":"كيف كان النبي ﷺ يعرف رضا عائشة رضي الله عنها من غضبها؟","options":["كانت إذا رضيت قالت: «لا ورب محمد»، وإذا غضبت قالت: «لا ورب إبراهيم»","من سكوتها عن الكلام","من خروجها إلى بيت أبيها","من تركها الطعام"],"answer":0,"why":"قالت: «أجل، والله يا رسول الله ما أهجر إلا اسمك»، وفيه إدراك مشاعر الطرف الآخر وأن المعايشة الحقيقية تصنع فهمًا عميقًا بين الزوجين.","ref":"ص 2"},{"q":"ماذا نتعلم من موقف عائشة رضي الله عنها في هجر الاسم دون المحبة؟","options":["أن الغضب دليل على انتهاء المحبة","أن الغضب لا يكون إلا من الزوج","أن وجود الغضب لا يعني تغير المشاعر، فلا ينبغي تفسير كل انفعال على أنه إهمال أو كره","أن على الزوج تجاهل غضب زوجته"],"answer":2,"why":"ومن القواعد: افهم مشاعر الطرف الآخر قبل أن تحاول إقناعه بوجهة نظرك.","ref":"ص 3"},{"q":"ماذا فعل النبي ﷺ حين كسرت إحدى أمهات المؤمنين الصحفة في بيتها؟","options":["جمع الطعام وقال: «غارت أمكم»، ثم دفع الصحفة الصحيحة إلى التي كُسرت صحفتها وأمسك المكسورة","ترك البيت غاضبًا","عاتبها أمام الخادم","أمر بإبعاد الصحفة دون تعليق"],"answer":0,"why":"تفهّم ﷺ مشاعرها وتصرف برفق بالغ، وبيّن أن إتلاف الممتلكات غير مقبول، وحفظ لها مكانتها بقوله «أمكم».","ref":"ص 3"},{"q":"في مثال الزوجة التي أتلفت هاتف زوجها بدافع الغيرة، ما القاعدة الصحيحة في التعامل مع الموقف؟","options":["اعتبار ردة فعلها إهانة تستوجب الخصومة","تجاهل نتيجة الانفعال تمامًا","فهم الانفعال دون تبرير الأذى، مع معالجة الضرر برفق","تذكيرها بالخطأ في كل مناسبة"],"answer":2,"why":"فهم الأسباب لا يبيح إتلاف الممتلكات، ولا بد من تهدئة الانفعال وتوضيح الدوافع ووضع حدود واضحة واختيار التوقيت المناسب للحوار.","ref":"ص 3"},{"q":"ما الذي يُنصح به عند فقدان القدرة على الحوار من خطوات خفض التصعيد؟","options":["استحضار أخطاء الماضي لإثبات الحق","أخذ استراحة قصيرة (نصف ساعة أو ساعة أو التأجيل للغد) ثم استئناف الحديث لاحقًا","إدخال الأولاد في الخلاف","مواصلة النقاش مهما اشتد"],"answer":1,"why":"ومن الخطوات أيضًا: خفض نبرة الصوت، وتجنب استحضار أخطاء الماضي، وإبعاد الأولاد، واختيار لغة الكلام الأفضل.","ref":"ص 4"},{"q":"لماذا يُعد الحوار الذي ينتهي بعبارة «سنحاول أن نكون أفضل» حوارًا غير ناجح؟","options":["لأنه طويل","لأنه جرى دون حضور الأهل","لأنه لم يُدِن الطرف المخطئ","لأنه لم يحدد اتفاقًا واضحًا: ما الذي سيتغير، ومن المسؤول، ومتى يُنفذ ويُراجع"],"answer":3,"why":"قاعدة: كلما كان الاتفاق واضحًا وقابلًا للقياس، قلّت مساحة سوء الفهم بين الطرفين.","ref":"ص 5"},{"q":"ما المقصود بتجنب «المسامحة الإجبارية»؟","options":["أن تكون المسامحة أمام الأهل فقط","ألا يُستخدم شعار المسامحة لإجبار الشخص على قبول الأذى المستمر أو التنازل عن حقوقه","أن يسامح الطرف الأضعف دائمًا","رفض التسامح في كل الأحوال"],"answer":1,"why":"التسامح مطلوب، لكنه لا يعني التنازل عن الحقوق.","ref":"ص 7"},{"q":"ما الفرق بين الوسيط العائلي (الحكمين) والمرشد الأسري المتخصص؟","options":["المرشد من أهل الزوج، والوسيط من خارج العائلة","الوسيط يحكم بالطلاق، والمرشد يمنعه","الوسيط يقرّب وجهات النظر ويهدئ الأجواء ويسعى إلى صلح، والمرشد يدخل إلى جذور المشكلة ويدرب الزوجين على مهارات الحوار والتفاوض","لا فرق بينهما"],"answer":2,"why":"الوسيط بمثابة إطفاء الحريق وإدارة الخلاف الحالي، والمرشد يتعمق في الأنماط السلوكية والتواصلية ويقدم تدخلات تخصصية أعمق.","ref":"ص 8"}],"13":[{"q":"ما تعريف الطلاق في الاصطلاح الفقهي بحسب الدرس؟","options":["إنهاء الخلافات الزوجية بالتراضي","انتقال مسؤولية الأسرة إلى الزوجة","تعليق الحياة الزوجية حتى زوال الخلاف","حل رابطة الزواج بلفظ الطلاق الصريح أو بما يقوم مقامه وفق الضوابط الشرعية"],"answer":3,"why":"الطلاق ليس مجرد كلمة تقال في لحظة غضب؛ إذ تترتب عليه آثار شرعية وأسرية واجتماعية كثيرة.","ref":"ص 3"},{"q":"ما الذي يبينه حديث «إن إبليس يضع عرشه على الماء ثم يبعث سراياه...»؟","options":["أن الشيطان لا يقرّب إلا من يأمر بالفواحش","أن الخلافات الزوجية لا علاقة لها بالشيطان","أن الطلاق أفضل حل للخلافات","خطورة التفريق بين الزوجين، والدعوة إلى بذل الجهد في الإصلاح قبل الوصول إلى الطلاق"],"answer":3,"why":"يدنو إبليس ممن فرّق بين الرجل وامرأته ويقول: «نعم أنت»، فينبغي الحذر من السير في طريق يحقق مراد الشيطان.","ref":"ص 4"},{"q":"إذا قال الزوج في لحظة غضب عبارة يُشتبه في كونها طلاقًا، فما الواجب؟","options":["الحكم بوقوع الطلاق فورًا","الاكتفاء برواية أحد الطرفين","الحكم بعدم وقوعه لأنه كان غاضبًا","التثبت من اللفظ والظروف والملابسات والرجوع إلى أهل العلم المؤهلين"],"answer":3,"why":"عبارات مثل «لن أستمر معك» أو «سأطلقك» تختلف عن التلفظ بالطلاق الصريح، ولا يصح إصدار حكم نهائي من رواية مختصرة أو انطباع شخصي.","ref":"ص 4"},{"q":"ما المبدأ الذي تقرره آية ﴿الطلاق مرتان فإمساك بمعروف أو تسريح بإحسان﴾؟","options":["أن التسريح يكون دون أي حقوق","أن العلاقة الزوجية لا تتحول إلى إيذاء وانتقام: إن استمرت فبالمعروف، وإن انتهت فبإحسان","أن الإمساك واجب في كل الأحوال","أن الطلاق لا يقع إلا مرتين"],"answer":1,"why":"لو جعل الزوجان هذه الآية نصب أعينهما عند الخلاف لأمكن تجاوز كثير من النزاعات.","ref":"ص 5"},{"q":"ما حكم الطلاق بحسب الدرس؟","options":["مباح في جميع الحالات","يختلف باختلاف الحالة: فقد يكون مباحًا، وقد يصل إلى الوجوب أو الندب أو الكراهة أو التحريم","محرم كلما وقع خلاف بين الزوجين","يتحدد برغبة الزوج وحدها"],"answer":1,"why":"وذلك بحسب ما يقرره أهل العلم في كل حالة، وقد يكون محرمًا إذا وقع على وجه محرم كالطلاق البدعي.","ref":"ص 5"},{"q":"أي مما يلي ليس من الحكمة من مشروعية الطلاق؟","options":["أن يكون وسيلة للضغط على الطرف الآخر وإخضاعه","رفع الضرر عند تعذر الإصلاح","إتاحة بداية جديدة لكل من الزوجين","حفظ كرامة الزوجين ومنع استمرار الظلم"],"answer":0,"why":"قاعدة: الطلاق حكم شرعي تترتب عليه حقوق وآثار، وليس أداة للتهديد أو وسيلة لإخضاع الطرف الآخر.","ref":"ص 6"},{"q":"إذا كان الزوج يمارس العنف الجسدي ويعتدي على زوجته اعتداءً خطرًا، فما الذي يقدَّم؟","options":["السلامة الجسدية وإيقاف العنف، وقد يكون الانفصال هو المخرج إذا تعذر الإصلاح","محاولات الصلح مهما كانت النتائج","الاكتفاء بنصح الزوج","صبر الزوجة حفاظًا على الأسرة"],"answer":0,"why":"من المهم تقديم السلامة الجسدية على محاولات الصلح، تطبيقًا لقوله تعالى: ﴿فإمساك بمعروف أو تسريح بإحسان﴾.","ref":"ص 7"},{"q":"بمَ تقاس خطورة الخلاف الزوجي بحسب القاعدة التي ذكرها الدرس؟","options":["بعدد سنوات الزواج","بارتفاع الصوت وحده","بأثر الخلاف على الأمان والاحترام، وتكراره دون معالجة، ورفض أحد الطرفين محاولات الإصلاح","بتدخل الأهل فيه"],"answer":2,"why":"قد يرتفع صوت الزوجين أثناء النقاش مع بقاء الاحترام والأمان بينهما.","ref":"ص 9"},{"q":"ما المرحلة التي يفقد فيها كل طرف شعوره بالقرب من الآخر رغم استمرار شؤون الحياة اليومية بينهما؟","options":["مرحلة التصعيد والتهديد بالطلاق","مرحلة الخلافات المتكررة وتراكم المشاعر السلبية","مرحلة اتساع الفجوة العاطفية وضعف التواصل","مرحلة اليأس من الإصلاح"],"answer":2,"why":"وعلاجها ألا يفترض أحد الزوجين أن الآخر لا يحبه، بل يعبّر عن احتياجه بوضوح ويطلب الحوار والاستماع.","ref":"ص 10"},{"q":"ما المقصود بـ«قراءة النيات» من صور التواصل الهدام؟","options":["أن يعيد أحدهما صياغة كلام الآخر للتأكد من فهمه","أن يسأل الطرف الآخر عن مشاعره","أن ينسب أحد الزوجين إلى الآخر نية لم يصرّح بها، بدل الاستفسار عن مقصوده","أن يحسن أحد الزوجين الظن بالآخر"],"answer":2,"why":"لا يصح الجزم بنيات الآخرين دون علم، بل ينبغي الاستفسار حتى يتضح المعنى وتُزال أسباب سوء الفهم.","ref":"ص 14"}],"14":[{"q":"ما الفكرة المحورية التي يقوم عليها درس «أخلاق الطلاق»؟","options":["أن استمرار الزواج خير في جميع الأحوال","أن الطلاق شر في جميع الأحوال","أن الطلاق شأن قانوني لا علاقة له بالأخلاق","أن العلاقة الزوجية قد تنتهي، لكن لا ينبغي أن تنتهي معها الأخلاق"],"answer":3,"why":"فلا يتحول الطلاق أو الفراق إلى نوع من الانتقام أو الظلم أو الحرب بين أسرتين.","ref":"ص 2"},{"q":"ما أول أخلاق ما قبل قرار الطلاق؟","options":["التأكد من استنفاد فرص الإصلاح","تحمّل مسؤولية القرار","إبلاغ الأقارب بتفاصيل المشكلة","حصر الحقوق المالية"],"answer":0,"why":"فيسأل كل طرف نفسه: هل انتهينا بالفعل من جميع فرص الإصلاح؟ وهل استنفدنا الوسائل الممكنة؟","ref":"ص 3"},{"q":"مثال الزوج الذي عاد من العمل فلم يجد الطعام جاهزًا فنطق بكلمة الطلاق، ماذا يمثل؟","options":["خلافًا متكررًا يستحيل علاجه","تسرعًا في اتخاذ قرار مصيري لم يخضع للمراجعة","قرارًا مدروسًا بعد استنفاد الإصلاح","حقًا مطلقًا للزوج لا يُسأل عنه"],"answer":1,"why":"ينبغي التمييز بين الخلاف العابر والخلاف المتكرر القابل للعلاج.","ref":"ص 3"},{"q":"متى يكون الصلح خيرًا بحسب فهم الدرس لقوله تعالى ﴿والصلح خير﴾؟","options":["حين يتنازل أحد الطرفين عن جميع حقوقه","حين يكون ممكنًا وعادلًا ولا يؤدي إلى استمرار الإيذاء أو إهدار الحقوق","في جميع الحالات ولو استمر الإيذاء","حين يوافق عليه الأقارب فقط"],"answer":1,"why":"لا يصح اعتبار إجبار أحد الزوجين على البقاء في علاقة مؤذية وسيلة للإصلاح.","ref":"ص 4"},{"q":"ما المقصود بتحرير النية من الانتقام؟","options":["ألا يقدم الزوج على التطليق ولا تطلب الزوجة الطلاق بقصد الانتقام، بل يأتي القرار بعد استنفاد وسائل الإصلاح","تفويض الأقارب في اتخاذ القرار","ترك المطالبة بالحقوق المالية","التنازل عن جميع الحقوق"],"answer":0,"why":"قال تعالى: ﴿ولا تمسكوهن ضرارًا لتعتدوا﴾، فالعلاقة الزوجية ليست وسيلة للإضرار بالطرف الآخر.","ref":"ص 6"},{"q":"ما دلالة قوله تعالى ﴿ولا يجرمنكم شنآن قوم على ألا تعدلوا﴾ في سياق الطلاق؟","options":["أن كراهية الطرف الآخر لا تبيح الظلم، بل يجب العدل حتى مع وجود الكراهية","أن الكراهية تبيح أخذ الحقوق بالقوة","أن العدل واجب مع الأصدقاء فقط","أن الآية لا علاقة لها بالعلاقات الأسرية"],"answer":0,"why":"وهي من القواعد التي ينبغي أن نعيش بها في مسألة عدم الانتقام عند تعذر الإصلاح.","ref":"ص 6"},{"q":"أي مما يلي من مظاهر الانتقام بين الزوجين عند الطلاق؟","options":["توثيق الاتفاقات المالية","تحديد قناة مناسبة للتواصل","تأخير إجراءات الانفصال عمدًا بقصد الإضرار","تشجيع الأولاد على بر الطرف الآخر"],"answer":2,"why":"ومن مظاهر الانتقام أيضًا: التهديد المستمر بالطلاق، واستخدام المال أو الأولاد للضغط، ونشر الأسرار، وتحريض الأقارب.","ref":"ص 6"},{"q":"ما القاعدة التي ذكرها الدرس في أداء الحقوق عند سوء العشرة؟","options":["من أساء العشرة سقطت حقوقه","تؤدى الحقوق بعد انتهاء الخصومة فقط","يجوز تأخير الحقوق للضغط على الطرف الآخر","الحقوق لا تُمنح مكافأة على حسن العلاقة، ولا تُسلب عقوبة على سوء العشرة"],"answer":3,"why":"قال تعالى: ﴿ولا تأكلوا أموالكم بينكم بالباطل﴾، فمن له حق وجب إعطاؤه له.","ref":"ص 10"},{"q":"كيف يحمي الأبوان أولادهما من صراعهما أثناء الطلاق؟","options":["بأن يخبرا الأولاد بكل تفاصيل النزاع","بأن يطلبا منهم اختيار أحد الوالدين","بألا يتحول الطفل إلى رسول بينهما أو مستمع دائم للاتهامات أو أداة لجمع المعلومات","بأن يمنعا الطفل من التواصل مع أحدهما"],"answer":2,"why":"تحويل الأولاد إلى وسيلة لنقل الرسائل أو جمع المعلومات يسبب لهم آثارًا نفسية سلبية كبيرة.","ref":"ص 11"},{"q":"لماذا ينبغي توثيق الاتفاقات وتحديد المسؤوليات بعد الطلاق؟","options":["لإثبات خطأ الطرف الآخر","لأن التوثيق يغني عن أداء الحقوق","لنشرها بين الأقارب","لأن كل اتفاق واضح يقلل مساحة النزاع، وكل غموض قد يصبح بداية لخصومة جديدة"],"answer":3,"why":"فيُكتب المبلغ المتفق عليه وموعد أدائه وسائر التفاصيل؛ فالكتابة قيد للاتفاقات وحافظة للحقوق.","ref":"ص 13"}],"15":[{"q":"ما الذي يحتاجه الطفل إلى جانب الطعام والشراب بحسب مقدمة الدرس؟","options":["الألعاب والهدايا","الأمان والسكينة والشعور بالانتماء إلى بيته","معرفة تفاصيل مشكلات والديه","العزلة عن الخلافات بالخروج من البيت"],"answer":1,"why":"وهنا تتجلى عظمة المسؤولية في قوله ﷺ: «كلكم راع ومسؤول عن رعيته».","ref":"ص 2"},{"q":"ما الآثار المحتملة لتكرار مشاهد الصراع والشجار أمام الطفل؟","options":["تحسين قدرته على حل المشكلات","تقوية استقلاله العاطفي","الشعور بالفزع والخوف، واضطرابات النوم، والعزلة، وقد يصل إلى السلوك العدواني","زيادة قدرته على الحوار"],"answer":2,"why":"الطفل يدرك نبرة التوتر وتغير ملامح الوجه والخوف المصاحب للصراخ، وإن ظن الأبوان أنه غير منتبه.","ref":"ص 3"},{"q":"ماذا يتعلم الطفل حين يرى والديه يختلفان مع احتفاظهما بالاحترام ثم يعتذر أحدهما للآخر عند الخطأ؟","options":["أن الاختلاف لا يعني زوال المحبة والاحترام","أن الاعتذار ضعف","أن الخلاف يعني انتهاء الأسرة","أن عليه أن ينحاز لأحدهما"],"answer":0,"why":"أما الخلاف المؤذي الذي يتخلله السب والإهانة والتهديد فيترك في نفس الطفل صورة مخيفة عن العلاقة بين والديه.","ref":"ص 3"},{"q":"إذا شاهد الطفل الخلاف بالفعل، فما التصرف المناسب؟","options":["أن يشرحا له تفاصيل المشكلة ليحكم بينهما","أن يُطلب منه ألا يسأل عن شيء","أن يجلس معه الأبوان ويطمئناه، ويوضحا أن ما وقع مشكلة بينهما وأن المحبة والاهتمام به باقيان","تجاهل ما حدث كأنه لم يكن"],"answer":2,"why":"قاعدة: لا تجعلوا طفلكم شاهدًا على المعركة؛ فهو ليس طرفًا فيه ولا يملك القدرة على حل المشكلة.","ref":"ص 4"},{"q":"أي مما يلي من صور استخدام الأولاد أدوات للضغط والانتقام؟","options":["تطمين الطفل بعد الخلاف","توحيد الخطاب التربوي أمامهم","تخصيص وقت للاستماع إليهم","حرمان الطرف الآخر من رؤية الأولاد أو استمالة قلوبهم بالهدايا لشراء ولائهم"],"answer":3,"why":"ومنها أيضًا أن يُشعَر الطفل بالذنب لمحبته الطرف الآخر، فالأولاد ليسوا أوراق ضغط وإنما هم أمانة.","ref":"ص 4"},{"q":"ما المقصود بـ«الأمان السلوكي» من جوانب الأمان الأسري؟","options":["أن تتوفر للأولاد احتياجاتهم الضرورية","أن تكون في المنزل قواعد واضحة تضبط التعامل بين أفراده ويلتزم بها الجميع","أن يجد الطفل مساحة للتعبير عن مشاعره","أن يشعر الأولاد بالمحبة"],"answer":1,"why":"وجوانب الأمان الأسري: العاطفي والنفسي والسلوكي والمعيشي؛ واستقرار الطفل يقاس بمقدار الأمان الذي يعيشه داخل البيت.","ref":"ص 5"},{"q":"ما المقصود بـ«توحيد الخطاب أمام الأولاد»؟","options":["أن يكرر الوالدان الكلام نفسه بصوت مرتفع","أن يتحدث أحد الوالدين فقط مع الأولاد","أن يُخفى عن الأولاد كل ما يخصهم","أن يتفق الأبوان مسبقًا على سياسة تربوية موحدة، فلا يقول أحدهما شيئًا ثم يعارضه الآخر أمامهم"],"answer":3,"why":"تعارض الخطاب يجعل الطفل حائرًا لا يعرف أيهما يصدق ولا أي الرأيين يتبع.","ref":"ص 6"},{"q":"بأي آية استدل الدرس على أن الطفل لا يتحمل تبعات خصومات والديه؟","options":["﴿ولا تزر وازرة وزر أخرى﴾","﴿وقولوا للناس حسنًا﴾","﴿ولا تنسوا الفضل بينكم﴾","﴿لا يكلف الله نفسًا إلا وسعها﴾"],"answer":0,"why":"الطفل بريء من تبعات الخصومات، فلا يُطالب بالاختيار بين والديه ولا يُستجوب عن مشاعره.","ref":"ص 7"},{"q":"أي مما يلي ليس من الآثار النفسية والتربوية للخلافات على الأولاد كما ذكرها الدرس؟","options":["التراجع الدراسي","الشكاوى الجسدية كالصداع وآلام الجسم","زيادة التركيز والتحصيل الدراسي","التعلق المفرط"],"answer":2,"why":"من الآثار أيضًا: العزلة والانطواء، والواجب على الوالدين قراءة هذه التغيرات قراءة واعية.","ref":"ص 9"},{"q":"ما التوجيه الصحيح عند زواج الأم بعد الطلاق ووجود زوج جديد في البيت؟","options":["اتهام الطفل بالعقوق إذا رفض","إجبار الأولاد على مناداته «أبي» فورًا","منع الأولاد من رؤية والدهم","ألا يُجبر الأولاد على مناداته «أبي»، وأن تتدرج الأم في بناء الألفة دون إكراه مع تخصيص وقت كافٍ لهم مع والدهم"],"answer":3,"why":"الإكراه في مثل هذه المسائل قد يؤدي إلى نفور الطفل من البيت.","ref":"ص 12"}]}};

    if (sum && quiz) return { cls: 's3', text: 'اكتملت المراجعة' };
    if (quiz) return { cls: 's2', text: 'تم أداء الاختبار' };
    if (sum) return { cls: 's1', text: 'تمت مراجعة الملخص' };
    return { cls: '', text: 'لم تبدأ المراجعة' };
  }
  function completedCount(sid) {
    var c = 0;
    for (var n = 1; n <= subj(sid).lectures.length; n++) { var s = getL(sid, n); var L = subj(sid).lectures[n - 1]; var hasQ = L.questions && L.questions.length > 0; if (s.summary && (!hasQ || (s.attempts || 0) > 0)) c++; }
    return c;
  }

      dome: '<path d="M4 20h16M6 20v-5a6 6 0 0 1 12 0v5M12 9V3"/>',
      home: '<path d="M3.5 11.2 12 4l8.5 7.2"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-5.5h4V20"/>',
      heart: '<path d="M12 20.2s-7.5-4.6-7.5-10.4A4.2 4.2 0 0 1 12 7.4a4.2 4.2 0 0 1 7.5 2.4c0 5.8-7.5 10.4-7.5 10.4z"/>',
      grid: '<rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.5"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="1.5"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.5"/><rect x="13" y="13" width="7.5" height="7.5" rx="1.5"/>'
    }[name];
    return '<span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24">' + p + '</svg></span>';
  }

  /* ---------- الحالة والتنقل ---------- */
  var view = { name: 'home' };
  var Q = null;
  var subjQuery = '';

  function go(v, opts) {
    view = v;
    render();
    if (!opts || !opts.keepScroll) window.scrollTo(0, 0);
    var h = v.name === 'subject' ? '#subject-' + v.sid : (v.name === 'home' ? '' : null);
    if (h !== null) {
      try {
        if (h === '') { if (location.hash) history.pushState(null, '', location.pathname + location.search); }
        else if (location.hash !== h) location.hash = h;
      } catch (e) {}
    }
  }
  window.addEventListener('hashchange', function () {
    var m = /^#subject-(s[1-5])$/.exec(location.hash);
    if (m) { if (!(view.name === 'subject' && view.sid === m[1])) { view = { name: 'subject', sid: m[1] }; render(); window.scrollTo(0, 0); } }
    else if (view.name !== 'quiz' && view.name !== 'result' && view.name !== 'review' && view.name !== 'read') { view = { name: 'home' }; render(); }
  });

  /* ---------- الأجزاء المشتركة ---------- */
  function topbar() {
    var logo = LOGO_SRC ? '<img src="' + LOGO_SRC + '" alt="شعار أكاديمية هندسة الأجيال">' : '';

  function footer() {

  }
  function bar(pct) { return '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div>'; }

  /* ---------- الرئيسية ---------- */
  function renderHome() {
    var cards = SUBJECTS.map(function (s) {
      var done = completedCount(s.id), pct = Math.round(done / s.lectures.length * 100);
      return '<article class="subject tone-' + s.tone + '">' + icon(s.icon) +
        '<div><h3>' + esc(s.name) + '</h3><p class="meta">' + s.lectures.length + ' ' + (s.lectures.length >= 3 && s.lectures.length <= 10 ? 'محاضرات' : 'محاضرة') + '</p></div>' +
        '<div><div class="bar-row"><span>تقدم المراجعة</span><span>' + done + ' من ' + s.lectures.length + '</span></div>' + bar(pct) + '</div>' +

      '<p class="lead">رحلتكِ نحو إتقان العلم تبدأ بخطوة مراجعة، اختاري مادتكِ وابدئي على بركة الله</p>' +
      '<p class="motto">مراجعتكِ اليوم... ثمرة علمكِ غدًا</p><div class="rule"></div>' +
      '<div class="search"><label for="home-search">ابحثي عن محاضرتكِ</label>' +
      '<input id="home-search" type="search" autocomplete="off" placeholder="اكتبي عنوان المحاضرة أو رقمها"></div>' +
      '<div class="results" id="home-results" aria-live="polite"></div></section>' +
      '<h2 class="section-title">المواد الدراسية</h2><div class="subjects">' + cards + '</div>' +
      '<div class="demo-link"><button class="linkish" data-action="demo">جرّبي شكل الاختبار بأسئلة نموذجية</button></div>' + footer();

  function renderHomeResults(q) {
    var box = document.getElementById('home-results');
    if (!box) return;
    var nq = norm(q);
    if (!nq) { box.innerHTML = ''; return; }
    var out = [];
    SUBJECTS.forEach(function (s) {
      s.lectures.forEach(function (l, i) {
        var n = i + 1;
        if (lecMatch(l, n, nq)) out.push({ s: s, n: n, l: l });
      });
    });
    if (!out.length) { box.innerHTML = '<p class="empty-note">لا توجد محاضرة بهذا الاسم. جرّبي رقم المحاضرة أو كلمة من عنوانها.</p>'; return; }
    box.innerHTML = out.slice(0, 20).map(function (r) {
      var t = r.l.title ? esc(r.l.title) : 'عنوان المحاضرة لم يُضف بعد';
      return '<button class="result" data-action="open-lecture" data-sid="' + r.s.id + '" data-n="' + r.n + '"><span><b>المحاضرة (' + pad2(r.n) + ')</b> · ' + t + '</span><span class="where">' + esc(r.s.name) + '</span></button>';
    }).join('');
  }

  /* ---------- صفحة المادة ---------- */
  function lectureCard(s, i) {
    var n = i + 1, l = s.lectures[i], st = status(s.id, n), rec = getL(s.id, n);
    var hasQ = l.questions && l.questions.length > 0;
    var title = l.title ? '<h3>' + esc(l.title) + '</h3>' : '<h3 class="todo">عنوان المحاضرة لم يُضف بعد</h3>';
    var sum = l.summary
      ? '<button class="btn btn-soft btn-wide" data-action="read" data-sid="' + s.id + '" data-n="' + n + '">الملخص المعتمد</button>'
      : '<span class="btn btn-soft btn-wide" aria-disabled="true">الملخص المعتمد</span><span class="note">رابط الملخص لم يُضف بعد</span>';
    var quiz = hasQ
      ? '<button class="btn btn-primary btn-wide" data-action="quiz" data-sid="' + s.id + '" data-n="' + n + '">اختبري استيعابكِ</button>'
      : '<span class="btn btn-primary btn-wide" aria-disabled="true">اختبري استيعابكِ</span><span class="note">الأسئلة قيد الإعداد</span>';
    var best = rec.best != null ? '<span class="note">أفضل نتيجة: ' + rec.best + ' من ' + (rec.total || 10) + '</span>' : '';
    return '<article class="lecture" id="lec-' + n + '"><div class="row-between"><span class="no">المحاضرة (' + pad2(n) + ')</span><span class="chip ' + st.cls + '">' + st.text + '</span></div>' +
      title + '<div class="actions">' + sum + quiz + '</div>' +
      '<div class="row-between"><label class="check"><input type="checkbox" data-action="toggle-summary" data-sid="' + s.id + '" data-n="' + n + '"' + (rec.summary ? ' checked' : '') + '>تمت مراجعة الملخص</label>' + best + '</div></article>';
  }
  function lectureList(s) {
    var nq = norm(subjQuery), html = '';
    s.lectures.forEach(function (l, i) {
      var n = i + 1;
      if (!lecMatch(l, n, nq)) return;
      html += lectureCard(s, i);
    });
    return html || '<p class="empty-note">لا توجد محاضرة بهذا الاسم.</p>';
  }
  function renderSubject() {
    var s = subj(view.sid);
    if (!s) { view = { name: 'home' }; return renderHome(); }
    var done = completedCount(s.id), pct = Math.round(done / s.lectures.length * 100);
    $root.innerHTML = topbar() +
      '<div class="back"><button class="btn btn-ghost" data-action="home">→ الصفحة الرئيسية</button></div>' +
      '<section class="subject-head tone-' + s.tone + '"><div class="top">' + icon(s.icon) + '<div><h1>' + esc(s.name) + '</h1><p class="cheer">' + esc(s.cheer) + '</p></div></div>' +
      '<div class="stats"><span>عدد المحاضرات: <b>' + s.lectures.length + '</b></span><span>المحاضرات التي تمت مراجعتها: <b>' + done + '</b></span><span>نسبة التقدم: <b>' + pct + '%</b></span></div>' + bar(pct) +
      (s.full ? '<div class="full-dl"><button class="btn btn-ghost" id="full-dl-btn" data-action="download-full" hidden>تنزيل الملخص الكامل للمادة</button><span class="note" id="full-dl-msg" role="status"></span></div>' : '') +
      '<div class="search" style="margin-top:4px"><label for="subj-search">ابحثي عن اسم المحاضرة</label><input id="subj-search" type="search" autocomplete="off" value="' + esc(subjQuery) + '" placeholder="اكتبي عنوان المحاضرة أو رقمها"></div></section>' +
      '<div class="lectures" id="lecture-list">' + lectureList(s) + '</div>' + footer();
    if (s.full && window.claude && window.claude.use) window.claude.use('downloads').then(function (d) { DL = d; var b = el('full-dl-btn'); if (b && d) b.hidden = false; }, function () {}); else if (s.full) { DL = DLFB; var fb2 = el('full-dl-btn'); if (fb2) fb2.hidden = false; }
  }

  /* ---------- الاختبار ---------- */
  function startQuiz(sid, n) {
    var s = subj(sid), l = s.lectures[n - 1];
    Q = { sid: sid, n: n, name: s.name, title: l.title, qs: l.questions, i: 0, picked: [], checked: false, demo: false };
    go({ name: 'quiz' });
  }
  function startDemo() {
    Q = { sid: null, n: 0, name: 'نموذج تجريبي', title: DEMO.title, qs: DEMO.questions, i: 0, picked: [], checked: false, demo: true };
    go({ name: 'quiz' });
  }
  function renderQuiz() {
    var q = Q.qs[Q.i], total = Q.qs.length, picked = Q.picked[Q.i];
    var head = Q.demo ? 'نموذج تجريبي' : 'المحاضرة (' + pad2(Q.n) + ')' + (Q.title ? ' · ' + esc(Q.title) : '');
    var opts = q.options.map(function (o, k) {
      var cls = 'opt';
      if (Q.checked) {
        cls += ' locked';
        if (k === q.answer) cls += ' ok';
        else if (k === picked) cls += ' bad';
      }
      return '<label class="' + cls + '"><input type="radio" name="opt" value="' + k + '"' + (picked === k ? ' checked' : '') + (Q.checked ? ' disabled' : '') + '>' +
        '<span class="letter">' + LETTERS[k] + '</span><span class="txt">' + esc(o) + '</span></label>';
    }).join('');
    var fb = '';
    if (Q.checked) {
      var right = picked === q.answer;
      fb = '<div class="feedback ' + (right ? 'ok' : 'bad') + '" role="status"><span class="head">' +
        (right ? 'أحسنتِ، إجابتكِ صحيحة' : 'راجعي هذه الفكرة، فبالمراجعة يثبت العلم') + '</span>' +
        '<span>الإجابة الصحيحة: <b>' + LETTERS[q.answer] + ') ' + esc(q.options[q.answer]) + '</b></span>' +
        (q.why ? '<span>' + esc(q.why) + '</span>' : '') +
        (q.ref ? '<span class="ref">المرجع في الملخص: ' + esc(q.ref) + '</span>' : '') + '</div>';
    }
    var last = Q.i === total - 1;
    var act = Q.checked
      ? '<button class="btn btn-primary" data-action="next-q">' + (last ? 'عرض النتيجة' : 'السؤال التالي') + '</button>'
      : '<button class="btn btn-primary" data-action="check" id="check-btn"' + (picked == null ? ' disabled' : '') + '>تحققي من إجابتي</button>';
    $root.innerHTML = topbar() + '<div class="quiz-wrap">' +
      '<div class="back"><button class="btn btn-ghost" data-action="quit-quiz">→ ' + (Q.demo ? 'الصفحة الرئيسية' : 'العودة إلى المادة') + '</button></div>' +
      '<section class="quiz-head"><span class="crumb">' + esc(Q.name) + '</span><h1>' + head + '</h1>' +
      '<div class="bar-row"><span>السؤال ' + (Q.i + 1) + ' من ' + total + '</span><span>' + Math.round(Q.i / total * 100) + '%</span></div>' + bar(Math.round(Q.i / total * 100)) + '</section>' +
      '<section class="qcard"><span class="qnum">السؤال ' + (Q.i + 1) + '</span><p class="qtext">' + esc(q.q) + '</p>' +
      '<div class="opts" role="radiogroup" aria-label="الخيارات">' + opts + '</div>' + fb + '<div class="qactions">' + act + '</div></section></div>';
  }
  function score() {
    var c = 0;
    Q.qs.forEach(function (q, k) { if (Q.picked[k] === q.answer) c++; });
    return c;
  }
  function finishQuiz() {
    var c = score(), total = Q.qs.length;
    if (!Q.demo) {
      var rec = getL(Q.sid, Q.n);
      setL(Q.sid, Q.n, { attempts: (rec.attempts || 0) + 1, last: c, total: total, best: Math.max(rec.best || 0, c) });
    }
    go({ name: 'result' });
  }
  function message(pct) {
    if (pct >= 90) return 'أحسنتِ يا مهندسة الأجيال! مراجعة متقنة، نسأل الله أن يزيدكِ علمًا وفهمًا';
    if (pct >= 70) return 'مراجعة موفقة! بقيت بعض التفاصيل التي تستحق منكِ مزيدًا من التثبيت';
    if (pct >= 50) return 'خطوة طيبة، أعيدي النظر في الأفكار التي أشكلت عليكِ';
    return 'لا بأس، فالمراجعة فرصة للفهم والتثبيت. عودي إلى الملخص ثم أعيدي المحاولة';
  }
  function nextWithQuestions() {
    if (Q.demo) return false;
    var s = subj(Q.sid);
    return Q.n < s.lectures.length && s.lectures[Q.n].questions.length > 0;
  }
  function renderResult() {
    var c = score(), total = Q.qs.length, pct = Math.round(c / total * 100);
    var nextBtn = Q.demo ? '' : '<button class="btn btn-pink" data-action="next-lecture"' + (nextWithQuestions() ? '' : ' disabled') + '>الانتقال إلى المحاضرة التالية</button>';
    $root.innerHTML = topbar() + '<div class="quiz-wrap"><section class="score-card"><span class="crumb" style="color:var(--pink-ink);font-family:var(--f-head)">' +
      (Q.demo ? 'نموذج تجريبي' : esc(Q.name) + ' · المحاضرة (' + pad2(Q.n) + ')') + '</span>' +
      '<div class="score-big">' + c + ' <small>من ' + total + '</small></div><div class="meta">النسبة المئوية: ' + pct + '%</div>' + bar(pct) +
      '<p class="score-msg">' + message(pct) + '</p><div class="result-actions">' +
      '<button class="btn btn-primary" data-action="review">مراجعة الإجابات</button>' +
      '<button class="btn btn-soft" data-action="retry">إعادة الاختبار</button>' +
      '<button class="btn btn-ghost" data-action="quit-quiz">' + (Q.demo ? 'الصفحة الرئيسية' : 'العودة إلى المادة') + '</button>' + nextBtn +
      '</div></section></div>' + footer();
  }
  function renderReview() {
    var items = Q.qs.map(function (q, k) {
      var p = Q.picked[k], ok = p === q.answer;
      return '<article class="review-item"><span class="qnum">السؤال ' + (k + 1) + ' · <span class="' + (ok ? 'tag-ok' : 'tag-bad') + '">' + (ok ? 'صحيحة' : 'تحتاج مراجعة') + '</span></span>' +
        '<p class="qtext" style="font-size:18px">' + esc(q.q) + '</p>' +
        '<p class="ans">إجابتكِ: ' + (p == null ? 'لم تُجب' : LETTERS[p] + ') ' + esc(q.options[p])) + '</p>' +
        (ok ? '' : '<p class="ans">الإجابة الصحيحة: <b>' + LETTERS[q.answer] + ') ' + esc(q.options[q.answer]) + '</b></p>') +
        (q.why ? '<p class="ans">' + esc(q.why) + '</p>' : '') + (q.ref ? '<p class="note">المرجع في الملخص: ' + esc(q.ref) + '</p>' : '') + '</article>';
    }).join('');
    $root.innerHTML = topbar() + '<div class="quiz-wrap"><div class="back"><button class="btn btn-ghost" data-action="to-result">→ العودة إلى النتيجة</button></div>' +
      '<h1 style="font-size:26px">مراجعة الإجابات</h1>' + items +
      '<div class="qactions"><button class="btn btn-soft" data-action="retry">إعادة الاختبار</button></div></div>' + footer();
  }

  function render() {
    if (view.name === 'subject') renderSubject();
    else if (view.name === 'read') renderReader();
    else if (view.name === 'quiz') renderQuiz();
    else if (view.name === 'result') renderResult();

  }
  function refreshList() {
    var s = subj(view.sid), el = document.getElementById('lecture-list');

    // تحديث الإحصاءات بإعادة رسم الرأس دون لمس حقل البحث
