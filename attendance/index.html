@font-face{font-family:"Somar Local";font-weight:500;src:local("Somar Sans Medium"),local("SomarSans-Medium"),local("Somar Sans");}
:root{
  --navy:#003375; --navy-d:#011A4A; --navy-m:#023373; --navy-w:#1A5FA3; --navy-r:#062151; --blue:#034EA2;
  --pink:#F280AA; --pink-i:#FC739F; --pink-l:#FFD3E4; --pink-s:#E89AB0; --pink-t:#FDB5C8;
  --cyan:#38B5DA; --cyan-r:#2CC1D7; --cyan-l:#5BD7FB;
  --cream:#FDF2E3; --cream-w:#FFF5E8; --cream-l:#F5F0E8; --bg:#F4F4F7; --ink2:#6D6E71; --line:#B1B3B6; --line-s:#E3E4E8;
  --f-display:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-head:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"Somar Sans","Somar Local","IBM Plex Sans Arabic",system-ui,sans-serif;
  --r:18px; --r-s:12px;
  --sh:0 1px 2px rgba(6,33,81,.05),0 8px 24px -12px rgba(6,33,81,.18);
  --sh-h:0 2px 4px rgba(6,33,81,.06),0 18px 36px -14px rgba(6,33,81,.28);
  --pad:max(5vw,20px);
  --ease:cubic-bezier(.22,.8,.24,1);
}
*{box-sizing:border-box}
html{font-size:clamp(14px,.45vw + 9px,20px)}
html,body{margin:0}
body{min-height:100vh;display:flex;flex-direction:column}
body{background:var(--bg);color:var(--navy-r);font-family:var(--f-body);font-weight:500;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--blue)}
[hidden]{display:none!important}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:10px}

/* ======= خلفية زخرفية خفيفة ======= */
.decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.decor img{position:absolute;opacity:.07}
.decor .d1{width:34vmin;top:-7vmin;left:-7vmin;transform:rotate(12deg)}
.decor .d2{width:22vmin;bottom:9vmin;right:-5vmin;opacity:.06}
.decor .d3{width:12vmin;top:38vh;left:6vw;opacity:.05}

/* ======= الشاشة الافتتاحية ======= */
#intro{position:relative;z-index:1;flex:1;display:grid;grid-template-rows:auto 1fr auto;background:
  radial-gradient(1200px 600px at 85% -10%,rgba(255,211,228,.55),transparent 60%),
  radial-gradient(900px 500px at 0% 110%,rgba(56,181,218,.14),transparent 60%),
  linear-gradient(180deg,var(--cream-w),var(--bg) 70%)}
.intro-top{display:flex;align-items:center;justify-content:space-between;padding:clamp(14px,2.2vh,28px) var(--pad)}
.logo-r{height:clamp(46px,6.2vh,72px);width:auto;display:block;padding:4px}
.intro-main{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2vh var(--pad) 4vh}
.intro-logo{height:clamp(84px,15vh,168px);width:auto;padding:12px;margin-bottom:clamp(12px,3vh,34px);opacity:0;animation:fadeUp 1.1s var(--ease) .15s forwards}
.intro-title{font-family:var(--f-head);font-weight:700;font-size:clamp(2.6rem,5.6vw,5.8rem);line-height:1.25;margin:0;color:var(--navy);letter-spacing:0;opacity:0;animation:fadeUp 1s var(--ease) .55s forwards}
.intro-title b{font-weight:700;color:var(--pink)}
.intro-sub{font-family:var(--f-head);font-weight:500;font-size:clamp(1.05rem,1.7vw,1.7rem);color:var(--blue);margin:.6em 0 .2em;opacity:0;animation:fadeUp 1s var(--ease) .8s forwards}
.intro-tag{display:flex;align-items:center;gap:.8em;color:var(--ink2);font-size:clamp(.9rem,1.05vw,1.1rem);opacity:0;animation:fadeUp 1s var(--ease) 1s forwards}
.intro-tag::before,.intro-tag::after{content:"";width:2.4em;height:2px;border-radius:2px;background:var(--pink)}
.intro-btns{display:flex;gap:clamp(14px,2vw,32px);margin-top:clamp(20px,4vh,48px);flex-wrap:nowrap;justify-content:center;opacity:0;animation:fadeUp 1s var(--ease) 1.2s forwards}
.big-btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;width:clamp(170px,15vw,250px);aspect-ratio:1/1;padding:1.2rem;border-radius:26px;font-family:var(--f-head);font-weight:700;font-size:clamp(1.3rem,1.8vw,1.9rem);text-align:center;line-height:1.3;transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .25s;box-shadow:var(--sh)}
.big-btn .bi{display:grid;place-items:center;width:clamp(3.4rem,4.6vw,4.6rem);height:clamp(3.4rem,4.6vw,4.6rem);border-radius:20px;flex:none}
.big-btn .bi .ic{width:55%;height:55%}
.big-btn small{display:block;font-family:var(--f-body);font-weight:500;font-size:.48em;opacity:.85;margin-top:.35em}
.big-btn .arr{display:none}
.big-btn:hover{transform:translateY(-5px);box-shadow:var(--sh-h)}
.big-btn:active{transform:translateY(-1px) scale(.97)}
.btn-ach{background:linear-gradient(135deg,var(--pink),var(--pink-t));color:var(--navy-r)}
.btn-ach .bi{background:rgba(255,255,255,.55);color:var(--navy)}
.btn-ach:hover{box-shadow:0 18px 40px -14px rgba(242,128,170,.7)}
.btn-iss{background:#fff;color:var(--navy);outline:2px solid var(--pink-l);outline-offset:-2px}
.big-btn:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
.btn-iss .bi{background:var(--cream-w);color:var(--pink-i)}
.btn-iss:hover{outline-color:var(--pink)}
.intro-hint{margin-top:1.4rem;font-size:.85rem;color:var(--ink2);opacity:0;animation:fadeUp 1s var(--ease) 1.5s forwards}
kbd{font-family:var(--f-head);font-size:.8em;background:#fff;border:1px solid var(--line-s);border-bottom-width:2px;border-radius:6px;padding:.05em .45em;margin:0 .15em}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ======= أزرار التحكم ======= */
.ctrls{display:flex;gap:.45rem;align-items:center}
.cbtn{display:grid;place-items:center;width:2.6rem;height:2.6rem;border-radius:12px;background:#fff;color:var(--navy);box-shadow:0 0 0 1px var(--line-s);transition:background .2s,color .2s,transform .15s}
.cbtn:hover{background:var(--pink-l);color:var(--navy-r)}
.cbtn:active{transform:scale(.92)}
.cbtn.on{background:var(--navy);color:#fff;box-shadow:none}
.cbtn[aria-pressed="false"] .on-i,.cbtn[aria-pressed="true"] .off-i{display:none}

/* ======= الهيكل الداخلي ======= */
#shell{position:relative;z-index:1;flex:1;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:1.2rem;padding:.7rem var(--pad);background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-s)}
.topbar .logo-r{height:clamp(40px,5vh,56px)}
.logo-a{height:clamp(38px,4.6vh,52px);width:auto;display:block;padding:4px}
.crumbs{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;font-family:var(--f-head);font-weight:500;font-size:.92rem;color:var(--ink2);min-width:0}
.crumbs button{padding:.3rem .55rem;border-radius:8px;color:var(--ink2);transition:background .2s,color .2s}
.crumbs button:hover{background:var(--bg);color:var(--navy)}
.crumbs .cur{color:var(--navy);font-weight:700;padding:.3rem .55rem}
.crumbs .sep{opacity:.5}
.back-btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1rem .55rem .85rem;border-radius:12px;background:var(--pink);color:var(--navy-r);font-family:var(--f-head);font-weight:700;font-size:.9rem;transition:transform .15s,background .2s}
.back-btn:hover{background:var(--pink-i)}
.back-btn:active{transform:scale(.95)}
.spacer{flex:1}
#view{flex:1;padding:0 var(--pad) 3rem}
.view-in{animation:viewIn .5s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ======= لوحة العنوان ======= */
.hero{position:relative;overflow:hidden;margin:1.6rem 0 0;border-radius:26px;background:linear-gradient(135deg,var(--navy-d),var(--navy-m));color:#fff;padding:2.2rem 2.4rem 5.6rem}

.hero .eyebrow{position:relative;display:inline-flex;align-items:center;gap:.5rem;font-family:var(--f-head);font-weight:500;font-size:.88rem;color:var(--pink-t);letter-spacing:0}
.hero .eyebrow::before{content:"";width:1.8rem;height:2px;background:var(--pink);border-radius:2px}
.hero h1{position:relative;font-family:var(--f-display);font-weight:700;font-size:clamp(2rem,3.6vw,3.8rem);line-height:1.2;margin:.35rem 0 .3rem}
.hero p{position:relative;margin:0;max-width:62ch;color:rgba(255,255,255,.82);font-size:1rem}
.kpis{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin:-4rem 1.4rem 0}
.kpi{background:#fff;border-radius:var(--r);padding:1.15rem 1.2rem 1rem;box-shadow:var(--sh);display:flex;flex-direction:column;gap:.25rem;opacity:0;animation:fadeUp .7s var(--ease) forwards;min-height:9.6rem}
.kpi .kh{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.kpi .ki{display:grid;place-items:center;width:2.5rem;height:2.5rem;border-radius:12px;background:rgba(56,181,218,.12);color:var(--cyan)}
.kpi .kv{font-family:var(--f-head);font-weight:700;font-size:clamp(1.9rem,2.6vw,2.8rem);line-height:1.1;color:var(--navy);margin-top:.45rem;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.kpi .kv.dur{font-size:clamp(1.6rem,2.2vw,2.35rem)}
.kpi .kv.na{color:var(--line);font-weight:500}
.kpi .kv .u{font-size:.42em;font-weight:500;color:var(--ink2);margin-inline-start:.35em}
.kpi .kv2{display:flex;align-items:center;gap:.45rem;margin-top:.55rem;padding-top:.55rem;border-top:1px dashed var(--line-s);font-family:var(--f-head);font-weight:700;color:var(--blue);font-size:clamp(1.15rem,1.5vw,1.55rem)}
.kpi .kv2 .ic{color:var(--cyan);width:1.05em;height:1.05em}
.kpi .kv2 .n{direction:ltr;font-variant-numeric:tabular-nums}
.kpi .kv2 small{font-family:var(--f-body);font-weight:500;font-size:.58em;color:var(--ink2)}
.kpi .kl{font-family:var(--f-head);font-weight:500;font-size:.92rem;color:var(--navy-r)}
.kpi .kf{font-size:.78rem;color:var(--ink2);margin-top:auto;line-height:1.5}
.kpi.accent .ki{background:rgba(252,115,159,.12);color:var(--pink-i)}
.kpi.st-res .ki{background:rgba(44,193,215,.14);color:#0f7f90}
.kpi.st-pro .ki{background:rgba(3,78,162,.1);color:var(--blue)}
.kpi.st-fol .ki{background:rgba(252,115,159,.14);color:#c2386a}

.notes-row{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1.2rem;margin:1.1rem 1.4rem 0;font-size:.8rem;color:var(--ink2)}
.notes-row .lg{display:inline-flex;align-items:center;gap:.4rem}

/* ======= الوسوم ======= */
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.12rem .6rem;border-radius:999px;font-family:var(--f-head);font-weight:500;font-size:.72rem;line-height:1.7;white-space:nowrap}
.chip .ic{width:1em;height:1em;stroke-width:2.2}
.c-doc{background:rgba(0,51,117,.08);color:var(--navy)}
.c-inc{background:#fff;color:#b23a66;box-shadow:inset 0 0 0 1.5px var(--pink-s);}
.c-smp{background:repeating-linear-gradient(-45deg,#ececf0 0 6px,#f7f7f9 6px 12px);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line)}
.c-res{background:rgba(44,193,215,.16);color:#0c6c7a}
.c-pro{background:rgba(3,78,162,.1);color:var(--blue)}
.c-fol{background:rgba(252,115,159,.16);color:#b02a5c}
.c-rep{background:var(--cream);color:#8a5a1c}

/* ======= العناوين الداخلية ======= */
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin:2.6rem 0 1.1rem;flex-wrap:wrap}
.sec-h h2{font-family:var(--f-head);font-weight:700;font-size:clamp(1.25rem,1.6vw,1.6rem);color:var(--navy);margin:0;display:flex;align-items:center;gap:.6rem}
.sec-h h2::before{content:"";width:.5rem;height:1.4rem;border-radius:4px;background:var(--pink)}
.sec-h p{margin:.2rem 0 0;color:var(--ink2);font-size:.88rem}

/* ======= بطاقات التصنيفات ======= */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem}
.cat{position:relative;text-align:right;background:#fff;border-radius:var(--r);padding:1.3rem 1.3rem 1.1rem;box-shadow:var(--sh);display:flex;flex-direction:column;gap:.55rem;transition:transform .25s var(--ease),box-shadow .25s var(--ease);opacity:0;animation:fadeUp .6s var(--ease) forwards;overflow:hidden}
.cat::after{content:"";position:absolute;inset-inline:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--pink),var(--pink-t));transform:scaleX(0);transform-origin:right;transition:transform .35s var(--ease)}
.cat:hover{transform:translateY(-4px);box-shadow:var(--sh-h)}
.cat:hover::after{transform:scaleX(1)}
.cat:active{transform:scale(.98)}
.cat .ch{display:flex;align-items:center;justify-content:space-between}
.cat .ci{display:grid;place-items:center;width:3rem;height:3rem;border-radius:14px;background:var(--cream-w);color:var(--navy)}
.cat .ci .ic{width:1.5rem;height:1.5rem}
.cat .cn{font-family:var(--f-head);font-weight:700;color:var(--navy);font-size:1.08rem;line-height:1.4}
.cat .cnum{font-family:var(--f-head);font-weight:700;font-size:1.6rem;color:var(--blue);line-height:1}
.cat .cnum small{font-size:.5em;color:var(--ink2);font-weight:500;margin-inline-start:.25rem}
.cat ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.3rem}
.cat li{font-size:.74rem;color:var(--ink2);background:var(--bg);border-radius:6px;padding:.05rem .45rem}
.cat .cf{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:auto;padding-top:.4rem}
.mini-dist{display:flex;height:6px;border-radius:4px;overflow:hidden;gap:2px;background:var(--bg)}
.mini-dist span{display:block;height:100%}

/* ======= عرض التصنيف ======= */
.cat-head{display:flex;align-items:center;gap:1.1rem;margin:1.8rem 0 1.2rem;flex-wrap:wrap}
.cat-head .ci{display:grid;place-items:center;width:3.6rem;height:3.6rem;border-radius:18px;background:var(--navy);color:#fff}
.cat-head .ci .ic{width:1.8rem;height:1.8rem}
.cat-head h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.7rem,2.8vw,2.8rem);color:var(--navy);margin:0;line-height:1.2}
.cat-head p{margin:.1rem 0 0;color:var(--ink2);font-size:.92rem}
.toolbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:1.3rem}
.fchip{padding:.45rem .95rem;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--line-s);font-family:var(--f-head);font-weight:500;font-size:.85rem;color:var(--navy);transition:background .2s,box-shadow .2s,transform .15s}
.fchip:hover{box-shadow:inset 0 0 0 1.5px var(--pink)}
.fchip:active{transform:scale(.95)}
.fchip[aria-pressed="true"]{background:var(--pink);color:var(--navy-r);box-shadow:none}
.fchip .n{display:inline-block;min-width:1.4em;margin-inline-start:.35rem;padding:0 .3em;border-radius:6px;background:rgba(6,33,81,.08);font-size:.78em;text-align:center}
.tsep{width:1px;height:1.6rem;background:var(--line-s);margin:0 .3rem}
.add-btn{display:inline-flex;align-items:center;gap:.35rem;padding:.45rem .95rem;border-radius:12px;background:var(--navy);color:#fff;font-family:var(--f-head);font-weight:500;font-size:.85rem;margin-inline-start:auto;transition:background .2s,transform .15s}
.add-btn:hover{background:var(--blue)}
.add-btn:active{transform:scale(.95)}

.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1rem}
.item{position:relative;text-align:right;background:#fff;border-radius:var(--r);padding:1.15rem 1.25rem 1rem;box-shadow:var(--sh);display:flex;flex-direction:column;gap:.5rem;transition:transform .25s var(--ease),box-shadow .25s var(--ease);opacity:0;animation:fadeUp .55s var(--ease) forwards;overflow:hidden}
.item:hover{transform:translateY(-3px);box-shadow:var(--sh-h)}
.item:active{transform:scale(.985)}
.item.smp{background:linear-gradient(#fff,#fff) padding-box,repeating-linear-gradient(-45deg,#d9dade 0 6px,transparent 6px 12px) border-box;border:2px dashed transparent}
.item .stripe{position:absolute;inset-block:0;right:0;width:5px}
.item .it{display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-size:.75rem;color:var(--ink2)}
.item h3{font-family:var(--f-head);font-weight:700;font-size:1.02rem;color:var(--navy);margin:0;line-height:1.5}
.item .d{margin:0;font-size:.86rem;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .mt{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:auto;padding-top:.3rem}
.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .6rem;border-radius:8px;background:var(--cream-w);font-family:var(--f-head);font-weight:700;font-size:.8rem;color:var(--navy)}
.pill .ic{color:var(--cyan);width:1.05em;height:1.05em}
.pill.dur{direction:ltr;font-variant-numeric:tabular-nums}
.empty{grid-column:1/-1;text-align:center;padding:3rem 1rem;border-radius:var(--r);border:2px dashed var(--line-s);color:var(--ink2);background:rgba(255,255,255,.6)}
.empty .ic{width:2.4rem;height:2.4rem;color:var(--line);display:block;margin:0 auto .6rem}

.banner{display:flex;align-items:center;gap:.7rem;margin:1.2rem 0 0;padding:.75rem 1rem;border-radius:14px;background:repeating-linear-gradient(-45deg,#f0f0f3 0 8px,#f7f7f9 8px 16px);color:var(--ink2);font-size:.84rem;box-shadow:inset 0 0 0 1px var(--line-s)}
.banner .ic{color:var(--navy);flex:none}
.banner button{margin-inline-start:auto;font-family:var(--f-head);font-weight:500;color:var(--navy);text-decoration:underline;text-underline-offset:3px;font-size:.82rem;white-space:nowrap}

/* ======= المخططات الصغيرة ======= */
.panel{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:1.3rem 1.4rem;margin-bottom:1.3rem}
.panel h4{font-family:var(--f-head);font-weight:700;color:var(--navy);margin:0 0 .9rem;font-size:1rem;display:flex;align-items:center;gap:.5rem}
.panel h4 .ic{color:var(--cyan)}
.bars{display:grid;gap:.75rem}
.bar-row{display:grid;grid-template-columns:minmax(9rem,14rem) 1fr auto;align-items:center;gap:.9rem;font-size:.86rem}
.bar-track{height:16px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;background:var(--cyan);border-radius:6px 0 0 6px;width:0;transition:width 1.2s var(--ease)}
.bar-v{font-family:var(--f-head);font-weight:700;color:var(--navy);direction:ltr;font-variant-numeric:tabular-nums}
.dist{display:flex;height:22px;border-radius:8px;overflow:hidden;gap:2px;background:var(--bg)}
.dist span{display:block;height:100%;transition:flex-grow 1s var(--ease)}
.dist-l{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;margin-top:.8rem;font-size:.84rem}
.dist-l span{display:inline-flex;align-items:center;gap:.4rem}
.dot{width:.75rem;height:.75rem;border-radius:4px;display:inline-block}
.s-res{background:var(--cyan-r)} .s-pro{background:var(--blue)} .s-fol{background:var(--pink-i)} .s-unk{background:repeating-linear-gradient(-45deg,#B1B3B6 0 4px,#D4D5D8 4px 8px)}

/* ======= النافذة التفصيلية ======= */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(1,26,74,.55);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:3vh 3vw;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{position:relative;width:min(860px,100%);max-height:94vh;overflow:auto;background:var(--cream-w);border-radius:26px;box-shadow:0 30px 80px -20px rgba(1,26,74,.6);animation:pop .35s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
.m-head{position:sticky;top:0;z-index:2;background:linear-gradient(135deg,var(--navy-d),var(--navy-m));color:#fff;padding:1.4rem 1.6rem 1.3rem;overflow:hidden}

.m-head .mh-t{position:relative;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--pink-t);font-family:var(--f-head)}
.m-head h2{position:relative;font-family:var(--f-head);font-weight:700;font-size:clamp(1.25rem,2vw,1.7rem);margin:.35rem 0 0;line-height:1.45;padding-inline-end:2.6rem}
.m-head .chip{background:rgba(255,255,255,.95)}
.m-close{position:absolute;top:1rem;left:1rem;z-index:3;display:grid;place-items:center;width:2.5rem;height:2.5rem;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;transition:background .2s,transform .15s}
.m-close:hover{background:var(--pink);color:var(--navy-r)}
.m-close:active{transform:scale(.9)}
.m-body{padding:1.4rem 1.6rem}
.m-desc{font-size:1rem;margin:0 0 1.2rem;color:var(--navy-r)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.7rem;margin-bottom:1.2rem}
.fact{background:#fff;border-radius:var(--r-s);padding:.75rem .9rem;box-shadow:0 0 0 1px var(--line-s)}
.fact .fl{display:flex;align-items:center;gap:.4rem;font-size:.75rem;color:var(--ink2)}
.fact .fl .ic{color:var(--cyan);width:1.05em;height:1.05em}
.fact .fv{font-family:var(--f-head);font-weight:700;color:var(--navy);font-size:1rem;margin-top:.15rem}
.fact .fv.ltr{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.pending{display:inline-flex;align-items:center;gap:.3rem;font-family:var(--f-body);font-weight:500;font-size:.8rem;color:#b23a66}
.pending::before{content:"";width:.5rem;height:.5rem;border-radius:50%;border:1.5px solid var(--pink-i)}
.blk{margin-bottom:1.1rem}
.blk h5{font-family:var(--f-head);font-weight:700;font-size:.9rem;color:var(--blue);margin:0 0 .4rem;display:flex;align-items:center;gap:.45rem}
.blk h5 .ic{color:var(--pink)}
.blk ul{margin:0;padding:0 1.2rem 0 0}
.blk li{margin:.15rem 0}
.blk li::marker{color:var(--pink)}
.links a{display:inline-flex;align-items:center;gap:.35rem;margin:0 0 .4rem .6rem;padding:.3rem .7rem;border-radius:9px;background:#fff;box-shadow:0 0 0 1px var(--line-s);text-decoration:none;font-size:.86rem}
.links a:hover{box-shadow:0 0 0 1.5px var(--cyan)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem}
.stat{background:#fff;border-radius:var(--r-s);padding:.7rem .85rem;box-shadow:0 0 0 1px var(--line-s);display:flex;flex-direction:column;gap:.1rem}
.stat b{font-family:var(--f-head);font-weight:700;font-size:1.45rem;color:var(--navy);line-height:1.2}
.stat span{font-size:.8rem;color:var(--ink2);line-height:1.5}
.note{font-size:.82rem;color:var(--ink2);background:#fff;border-radius:var(--r-s);padding:.7rem .9rem;border-inline-start:3px solid var(--pink-s)}
.steps{position:relative;margin:0 0 1rem;padding:0;list-style:none}
.steps li{position:relative;padding:0 2.9rem .95rem 0}
.steps li::before{content:"";position:absolute;right:1.05rem;top:2.2rem;bottom:0;width:2px;background:var(--line-s)}
.steps li:last-child::before{display:none}
.steps .sn{position:absolute;right:0;top:0;display:grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:12px;background:#fff;color:var(--navy);box-shadow:0 0 0 1px var(--line-s)}
.steps .sn .ic{width:1.1rem;height:1.1rem}
.steps h6{font-family:var(--f-head);font-weight:700;font-size:.88rem;color:var(--blue);margin:.2rem 0 .15rem}
.steps p{margin:0;font-size:.93rem}
.m-foot{display:flex;gap:.6rem;align-items:center;padding:1rem 1.6rem 1.4rem;border-top:1px solid var(--line-s);flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.6rem 1.1rem;border-radius:12px;font-family:var(--f-head);font-weight:500;font-size:.88rem;transition:background .2s,transform .15s,box-shadow .2s}
.btn:active{transform:scale(.95)}
.btn-p{background:var(--pink);color:var(--navy-r)}
.btn-p:hover{background:var(--pink-i)}
.btn-n{background:var(--navy);color:#fff}
.btn-n:hover{background:var(--blue)}
.btn-g{background:#fff;color:var(--navy);box-shadow:0 0 0 1px var(--line-s)}
.btn-g:hover{box-shadow:0 0 0 1.5px var(--pink)}
.btn-d{color:#b02a5c;background:#fff;box-shadow:0 0 0 1px var(--pink-l)}
.btn-d.arm{background:var(--pink-i);color:#fff}

/* ======= النماذج ======= */
.form{display:grid;grid-template-columns:1fr 1fr;gap:.85rem 1rem}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:.3rem;font-family:var(--f-head);font-weight:500;font-size:.82rem;color:var(--navy)}
.form label small{font-family:var(--f-body);color:var(--ink2);font-weight:500;font-size:.74rem}
.form input,.form select,.form textarea{width:100%;padding:.6rem .75rem;border-radius:10px;border:1px solid var(--line);background:#fff;font-family:var(--f-body);font-size:.92rem;color:var(--navy-r)}
.form textarea{min-height:5.2rem;resize:vertical;line-height:1.6}
.form input:focus,.form select:focus,.form textarea:focus{outline:none}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(56,181,218,.2)}
.form .chk{flex-direction:row;align-items:center;gap:.5rem}
.form .chk input{width:1.1rem;height:1.1rem;accent-color:var(--pink-i)}
.err{grid-column:1/-1;color:#b02a5c;font-size:.85rem}

/* ======= إدارة البيانات ======= */
.dm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem}
.dm-card{background:#fff;border-radius:var(--r-s);padding:1rem;box-shadow:0 0 0 1px var(--line-s);display:flex;flex-direction:column;gap:.5rem}
.dm-card h5{margin:0;font-family:var(--f-head);font-weight:700;color:var(--navy);font-size:.95rem;display:flex;align-items:center;gap:.45rem}
.dm-card h5 .ic{color:var(--cyan)}
.dm-card p{margin:0;font-size:.82rem;color:var(--ink2)}
.dm-card .btn{align-self:flex-start;margin-top:auto}
.switch{display:flex;align-items:center;gap:.7rem;font-family:var(--f-head);font-weight:500;font-size:.88rem;color:var(--navy)}
.switch input{appearance:none;width:2.8rem;height:1.55rem;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;flex:none}
.switch input::after{content:"";position:absolute;top:3px;right:3px;width:calc(1.55rem - 6px);height:calc(1.55rem - 6px);border-radius:50%;background:#fff;transition:right .2s var(--ease)}
.switch input:checked{background:var(--pink-i)}
.switch input:checked::after{right:calc(100% - 1.55rem + 3px)}
.dm-stats{display:flex;gap:.5rem;flex-wrap:wrap;margin:0 0 1rem}

/* ======= التذييل ======= */
.foot{position:relative;z-index:2;overflow:hidden;background:var(--navy);color:rgba(255,255,255,.88);display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:.75rem var(--pad);font-size:.82rem}

.fbox:hover{transform:translateY(-4px);box-shadow:var(--sh-h)}
.fbox:active{transform:scale(.98)}
.fb-bot{background:linear-gradient(135deg,#FBE3C4,#FFF5E8);color:var(--navy)}
.fb-bot .pat{display:none}
.fb-bot .sb-i{background:rgba(255,255,255,.8);color:var(--pink-i)}
.fb-int{background:linear-gradient(135deg,var(--pink),var(--pink-t));color:var(--navy-r)}
.fb-i{grid-area:i;display:grid;place-items:center;width:3.3rem;height:3.3rem;border-radius:16px;background:rgba(255,255,255,.14)}
.fb-i .ic{width:1.6rem;height:1.6rem}
.fb-int .fb-i{background:rgba(255,255,255,.6);color:var(--navy)}
.fb-t{grid-area:t;font-family:var(--f-head);font-weight:700;font-size:1.3rem;line-height:1.4}
.fb-t small{display:block;font-family:var(--f-body);font-weight:500;font-size:.62em;opacity:.85}
.fb-n{grid-area:n;display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin-top:.4rem}
.fb-n b{font-family:var(--f-head);font-weight:700;font-size:clamp(2.6rem,3.6vw,3.8rem);line-height:1;font-variant-numeric:tabular-nums;direction:ltr}
.fb-n small{font-size:.92rem;opacity:.9}
.fb-m{grid-area:m;display:flex;flex-wrap:wrap;gap:.35rem 1rem;font-size:.88rem;opacity:.95}
.fb-m b{font-family:var(--f-head);font-weight:700;direction:ltr;display:inline-block}
.fb-go{grid-area:g;justify-self:end;display:inline-flex;align-items:center;gap:.3rem;font-family:var(--f-head);font-weight:700;font-size:.88rem;padding:.45rem .95rem;border-radius:12px;background:rgba(255,255,255,.16)}
.fb-int .fb-go{background:rgba(255,255,255,.65)}
.f-hero{display:grid;grid-template-columns:minmax(260px,1fr) 2fr;gap:1rem}
.ftiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem}
.ftile.big{background:linear-gradient(160deg,#fff 40%,var(--cream-w));box-shadow:var(--sh),inset 0 0 0 2px rgba(56,181,218,.25);justify-content:center}
.ftile.big.pink{box-shadow:var(--sh),inset 0 0 0 2px var(--pink-l)}
.ftile.big .kv{font-size:clamp(3.2rem,5vw,5rem)}
.ftile.big.pink .ki{background:rgba(242,128,170,.14);color:var(--pink-i)}
.kpi .kv.txt{font-size:clamp(1.25rem,1.7vw,1.7rem);direction:rtl}
.f-chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0 0}
.charts2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:1rem;margin-top:1.3rem}
.charts2 .panel{margin-bottom:0}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--f-head)}
.chart .bar{cursor:default}
.chart .bar:hover path{filter:brightness(1.08)}
.chart .grow{animation:grow .9s var(--ease) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.chart .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s var(--ease) .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .fadein{animation:fadeIn 1s ease .6s both}
.chart .pop{transform-box:fill-box;transform-origin:center;animation:popIn .45s var(--ease) both}
@keyframes popIn{from{transform:scale(0)}to{transform:scale(1)}}
.legend{display:flex;gap:.5rem 1.2rem;flex-wrap:wrap;font-size:.84rem;margin:-.2rem 0 .5rem;color:var(--navy-r)}
.legend i{display:inline-block;width:.8rem;height:.8rem;border-radius:3px;margin-inline-end:.4rem;vertical-align:-1px}
.tscroll{overflow-x:auto}
.dtable{width:100%;border-collapse:collapse;font-size:.9rem;min-width:420px}
.dtable th,.dtable td{padding:.6rem .8rem;border-bottom:1px solid var(--line-s);text-align:center}
.dtable thead th{font-family:var(--f-head);color:var(--blue);font-weight:700;background:var(--cream-w)}
.dtable tbody th{text-align:right;font-weight:500;color:var(--navy-r)}
.dtable td{font-family:var(--f-head);font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.tnote,.fnote{display:flex;gap:.45rem;align-items:flex-start;margin:.8rem 0 0;font-size:.8rem;color:var(--ink2)}
.tnote .ic,.fnote .ic{color:var(--cyan);margin-top:.25em;width:1.05em;height:1.05em}
.dom-card{display:flex;gap:1rem;align-items:flex-start;background:#fff;border-radius:var(--r);padding:1.2rem 1.3rem;box-shadow:var(--sh);animation:fadeUp .4s var(--ease)}
.dom-card .ci,.ttype .ci{display:grid;place-items:center;width:2.8rem;height:2.8rem;border-radius:14px;background:var(--cream-w);color:var(--navy);flex:none}
.dom-card h5,.ttype h5{font-family:var(--f-head);font-weight:700;color:var(--navy);margin:0 0 .2rem;font-size:1.02rem}
.dom-card p,.ttype p{margin:0;color:var(--ink2);font-size:.86rem}
.ttypes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem;margin-bottom:1.3rem}
.ttype{display:flex;gap:.9rem;align-items:flex-start;background:#fff;border-radius:var(--r);padding:1.1rem 1.2rem;box-shadow:var(--sh);opacity:0;animation:fadeUp .5s var(--ease) forwards;border-top:3px solid var(--pink)}
.ttype .ci{color:var(--pink-i)}
.rules{margin:0;padding:0 1.2rem 0 0;font-size:.9rem}
.rules li{margin:.25rem 0}
.rules li::marker{color:var(--pink)}

/* ======= الأقسام التفاعلية المدمجة ======= */
.kpis-ach{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
@media (min-width:1100px){.kpis-ach{grid-template-columns:repeat(4,1fr)}}
.kpis-ach .sbox{min-height:100%}
.fb-posts{background:linear-gradient(135deg,var(--cyan),#8FDDF0);color:var(--navy-r)}
.fb-posts .sb-i{background:rgba(255,255,255,.6);color:var(--navy)}
.fb-posts .sb-arr{background:rgba(255,255,255,.55)}
.kpis-one{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.f-hero.solo{grid-template-columns:minmax(260px,420px)}
.gbtns{margin-top:1.3rem}
.grid-hint{display:flex;align-items:center;gap:.4rem;margin:1rem 1.4rem 0;font-size:.82rem;color:var(--ink2)}
.grid-hint .ic{color:var(--cyan)}
.sboxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
.sboxes.one{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}

.sbox:not(.static):hover{transform:translateY(-3px);box-shadow:var(--sh-h)}
.sbox.static{cursor:default}
.sbox:not(.static):active{transform:scale(.97)}
.sb-h{display:flex;align-items:center;justify-content:space-between}
.sb-i{display:grid;place-items:center;width:2.5rem;height:2.5rem;border-radius:12px;background:rgba(255,255,255,.16)}
.fb-ini .sb-i{background:var(--cream-w);color:var(--pink-i)}
.fb-int .sb-i{background:rgba(255,255,255,.6);color:var(--navy)}
.sb-arr{display:grid;place-items:center;width:2rem;height:2rem;border-radius:10px;background:rgba(255,255,255,.18);transition:transform .3s var(--ease)}
.fb-ini .sb-arr{background:var(--bg);color:var(--navy)}
.fb-int .sb-arr{background:rgba(255,255,255,.55)}
.sbox[aria-expanded="true"] .sb-arr{transform:rotate(180deg)}
.sbox[aria-expanded="true"]{box-shadow:0 0 0 3px var(--cyan),var(--sh-h)}
.sbox[aria-expanded="true"]::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:0;border:9px solid transparent;border-bottom-color:var(--bg)}
.sb-t{font-family:var(--f-head);font-weight:700;font-size:1rem;margin-top:.45rem}
.sb-n{display:flex;align-items:baseline;gap:.4rem;flex-wrap:wrap;margin-top:.2rem}
.sb-n b{font-family:var(--f-head);font-weight:700;font-size:clamp(1.9rem,2.6vw,2.8rem);line-height:1.1;font-variant-numeric:tabular-nums;direction:ltr}
.sb-n small{font-size:.8rem;opacity:.85}
.sb-f{margin-top:auto;font-size:.78rem;opacity:.85;line-height:1.5}
.fb-ini .sb-f,.fb-ini small{color:var(--ink2);opacity:1}
.sec-slot:empty{display:none}
.sec-panel{scroll-margin-top:90px;margin-top:1.4rem;padding:1.2rem 1.4rem 1.4rem;border-radius:26px;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 2px var(--line-s);animation:fadeUp .45s var(--ease)}
.sp-bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding-bottom:.9rem;border-bottom:1px dashed var(--line-s)}
.sp-bar>span{display:flex;align-items:center;gap:.5rem;font-family:var(--f-head);font-weight:700;color:var(--navy);font-size:1rem}
.sp-bar>span .ic{color:var(--pink-i)}
.sec-panel .cat-head{margin-top:1rem}
.sp-end{display:flex;justify-content:center;margin-top:1.6rem}
/* ======= ألوان مربعات الحصاد ======= */
@media (min-width:1100px){.kpis-ach{grid-template-columns:repeat(3,1fr)!important}}
.kpi.kc{position:relative;overflow:hidden}
.kc-blue{background:linear-gradient(135deg,#BCD9F6,#E6F1FC);color:var(--navy)}
.kc-blue .ki{background:rgba(255,255,255,.75)!important;color:var(--blue)!important}
.kc-navy{background:linear-gradient(135deg,#8FE3FC,#D3F4FE);color:var(--navy)}
.kc-navy .ki{background:rgba(255,255,255,.7)!important;color:var(--blue)!important}
.kc-navy .kv2{border-top-color:rgba(0,51,117,.2)!important}
.kc-navy .kv2 .ic{color:var(--blue)!important}
.kc-pinkc{background:linear-gradient(135deg,#E89AB0,#F7CFDB);color:var(--navy-r)}
.kpi.kc .kl,.kpi.kc .kv,.kpi.kc .kv .u,.kpi.kc .kf,.kpi.kc .kv2,.kpi.kc .kv2 small{color:inherit}
.kpi.kc .kf,.kpi.kc .kv .u,.kpi.kc .kv2 small{opacity:.85}
.kpi.kc .ki{background:rgba(255,255,255,.16);color:inherit}
.kc-pinkc .ki{background:rgba(255,255,255,.6);color:var(--navy)}
.kpi.kc .kv2{border-top-color:rgba(255,255,255,.35)}
.kpi.kc .kv2 .ic{color:inherit}
.kpi.kc .chip{background:rgba(255,255,255,.92);color:var(--navy)}
.hero.nok{padding-bottom:2.4rem}
.gact{background:rgba(0,51,117,.05);border-inline-start:4px solid var(--navy);border-radius:var(--r-s);padding:.9rem 1.1rem;margin-bottom:1rem}
.gact h5{display:flex;align-items:center;gap:.45rem;margin:0 0 .3rem;font-family:var(--f-head);font-weight:700;color:var(--navy);font-size:.92rem}
.gact p{margin:0;font-size:.95rem}
/* ======= الإشكالات العامة ======= */
.fb-gen{background:linear-gradient(135deg,#BCD9F6,#E6F1FC);color:var(--navy)}
.fb-gen .pat{display:none}
.fb-gen .sb-i{background:rgba(255,255,255,.8);color:var(--pink-i)}
.fb-gen .sb-arr{background:rgba(255,255,255,.7)}
.kdot{display:inline-block;width:.7rem;height:.7rem;border-radius:3px;margin-inline-end:.35rem;vertical-align:-1px}
.gbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.8rem;margin-bottom:1.2rem}
.gbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:.4rem;text-align:center;padding:1.1rem .8rem 1rem;border-radius:20px;background:#fff;box-shadow:var(--sh);border-top:5px solid var(--gc);transition:transform .2s var(--ease),box-shadow .2s,background .2s}
.gbtn:hover{transform:translateY(-3px);box-shadow:var(--sh-h)}
.gbtn:active{transform:scale(.96)}
.gbtn b{font-family:var(--f-head);font-weight:700;color:var(--navy);font-size:1rem;line-height:1.4}
.gbtn small{font-size:.75rem;color:var(--ink2)}
.gb-n{position:absolute;top:.55rem;right:.7rem;font-family:var(--f-head);font-weight:700;font-size:.8rem;color:var(--line)}
.gb-i{display:grid;place-items:center;width:3rem;height:3rem;border-radius:15px;background:var(--cream-w);color:var(--gc)}
.gb-i .ic{width:1.5rem;height:1.5rem}
.gbtn[aria-pressed="true"]{background:var(--navy);box-shadow:var(--sh-h)}
.gbtn[aria-pressed="true"] b{color:#fff}
.gbtn[aria-pressed="true"] small,.gbtn[aria-pressed="true"] .gb-n{color:rgba(255,255,255,.75)}
.gbtn[aria-pressed="true"] .gb-i{background:rgba(255,255,255,.14)}
.gbtn[aria-pressed="true"]::after{content:"";position:absolute;bottom:-.55rem;left:50%;transform:translateX(-50%) rotate(45deg);width:.9rem;height:.9rem;background:var(--navy)}
.gcard{background:#fff;border-radius:24px;box-shadow:var(--sh);padding:1.5rem 1.6rem;border-inline-start:6px solid var(--gc);animation:fadeUp .45s var(--ease)}
.gc-h{display:flex;gap:1rem;align-items:flex-start;margin-bottom:1.1rem}
.gc-i{display:grid;place-items:center;width:3.6rem;height:3.6rem;border-radius:18px;background:var(--cream-w);color:var(--gc);flex:none}
.gc-i .ic{width:1.8rem;height:1.8rem}
.gc-tags{display:flex;gap:.4rem;flex-wrap:wrap}
.gcard h3{margin:.45rem 0 .1rem;font-family:var(--f-head);font-weight:700;color:var(--navy);font-size:clamp(1.3rem,1.9vw,1.75rem);line-height:1.4}
.gc-d{display:flex;align-items:center;gap:.35rem;margin:0;font-size:.85rem;color:var(--ink2)}
.gc-d .ic{color:var(--cyan);width:1.05em;height:1.05em}
.gc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem;margin-bottom:1rem}
.gblk{background:var(--bg);border-radius:var(--r-s);padding:.9rem 1.1rem}
.gblk h5,.gsub,.gsugg h5{display:flex;align-items:center;gap:.45rem;margin:0 0 .35rem;font-family:var(--f-head);font-weight:700;color:var(--blue);font-size:.92rem}
.gblk h5 .ic,.gsub .ic{color:var(--cyan)}
.gblk p{margin:0;font-size:.95rem}
.gsub{margin:.2rem 0 .6rem}
.gevents{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.8rem;margin-bottom:1rem}
.gev{background:#fff;border-radius:var(--r-s);padding:.9rem 1.1rem;box-shadow:0 0 0 1.5px var(--pink-l)}
.gev-h{display:flex;align-items:center;justify-content:space-between;gap:.5rem;font-family:var(--f-head);color:var(--navy)}
.gev-n{display:flex;align-items:baseline;gap:.4rem;margin:.4rem 0 .5rem}
.gev-n b{font-family:var(--f-head);font-weight:700;font-size:2.2rem;line-height:1;color:var(--pink-i)}
.gev-n span{font-size:.85rem;color:var(--navy-r)}
.gev-bar{height:10px;border-radius:5px;background:var(--bg);overflow:hidden}
.gev-bar i{display:block;height:100%;background:var(--pink-i);border-radius:5px 0 0 5px;margin-inline-start:0}
.gev small{display:block;margin-top:.3rem;font-size:.72rem;color:var(--ink2)}
.gsugg{border:2px dashed var(--pink-s);background:#FFF8FB;border-radius:var(--r-s);padding:1rem 1.2rem;margin-bottom:1rem}
.gsugg h5{color:var(--navy);flex-wrap:wrap}
.gsugg h5 .ic{color:var(--pink-i)}
.gsugg .tag{margin-inline-start:auto;font-family:var(--f-head);font-weight:500;font-size:.7rem;padding:.1rem .55rem;border-radius:999px;background:#fff;color:#b23a66;box-shadow:inset 0 0 0 1px var(--pink-s)}
.gsugg ul{margin:0;padding:0 1.2rem 0 0;font-size:.93rem}
.gsugg li{margin:.25rem 0}
.gsugg li::marker{color:var(--pink)}
.gc-foot{display:flex;align-items:center;gap:.6rem 1rem;flex-wrap:wrap;padding-top:.9rem;border-top:1px solid var(--line-s)}
.gind{display:flex;align-items:flex-start;gap:.4rem;font-size:.86rem;color:var(--navy-r)}
.gind .ic{color:var(--cyan);margin-top:.2em;width:1.05em;height:1.05em}
.gind b{font-family:var(--f-head);font-weight:700}
.gind.pend2 .ic{color:var(--pink-i)}
/* ======= المبادرات ======= */
.btn-ini{background:linear-gradient(135deg,#8FE3FC,#D3F4FE);color:var(--navy)}
.btn-ini .bi{background:rgba(255,255,255,.7);color:var(--blue)}
.btn-ini:hover{box-shadow:0 18px 40px -14px rgba(56,181,218,.7)}
.fb-ini{background:#fff;color:var(--navy);box-shadow:var(--sh),inset 0 0 0 2px var(--pink-l)}
.fb-ini .fb-i{background:var(--cream-w);color:var(--pink-i)}
.fb-ini .fb-go{background:var(--navy);color:#fff}
.fb-ini .fb-n b{color:var(--navy)}
.tlegend{display:flex;flex-wrap:wrap;gap:.6rem;margin:1.2rem 0 0}
.tl{display:inline-flex;align-items:center;gap:.45rem;padding:.45rem .85rem;border-radius:12px;font-size:.82rem;color:var(--ink2);background:#fff}
.tl b{font-family:var(--f-head);color:var(--navy-r);font-weight:700}
.tl .ic{width:1.1em;height:1.1em}
.tl-ach{box-shadow:inset -4px 0 0 var(--navy),0 0 0 1px var(--line-s)} .tl-ach .ic{color:var(--navy)}
.tl-tgt{box-shadow:none;border:1.5px dashed var(--pink);background:#FFF8FB} .tl-tgt .ic{color:var(--pink-i)}
.tl-doc{box-shadow:inset -4px 0 0 var(--cyan),0 0 0 1px var(--line-s);background:rgba(56,181,218,.06)} .tl-doc .ic{color:var(--cyan)}
.icats{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.icat .ci{color:var(--ic)!important}
.icat .cd{margin:0;font-size:.8rem;color:var(--ink2)}
.icat[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--ic),var(--sh-h)}
.icat[aria-pressed="true"]::after{transform:scaleX(1);background:var(--ic)}
.iboxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem}
.ibox{position:relative;overflow:hidden;text-align:right;background:#fff;border-radius:22px;padding:1.3rem 1.35rem 1.1rem;box-shadow:var(--sh);display:flex;flex-direction:column;gap:.55rem;border-top:5px solid var(--ic);transition:transform .25s var(--ease),box-shadow .25s var(--ease);opacity:0;animation:fadeUp .55s var(--ease) forwards}
.ibox:hover{transform:translateY(-4px);box-shadow:var(--sh-h)}
.ibox:active{transform:scale(.985)}
.ibox.inext{background:repeating-linear-gradient(-45deg,#fff 0 12px,var(--cream-w) 12px 24px);border:2px dashed var(--line);border-top:5px solid var(--ic)}
.ribbon{position:absolute;top:.9rem;left:-2.6rem;transform:rotate(-45deg);background:var(--navy);color:#fff;font-family:var(--f-head);font-weight:700;font-size:.66rem;padding:.22rem 2.8rem;display:flex;gap:.3rem;align-items:center}
.ribbon .ic{width:1em;height:1em}
.ib-h{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.ib-i{display:grid;place-items:center;width:2.6rem;height:2.6rem;border-radius:13px;background:var(--cream-w);color:var(--ic)}
.ib-c{font-family:var(--f-head);font-weight:500;font-size:.78rem;color:var(--ink2);margin-inline-end:auto}
.ibox h3{margin:.15rem 0 0;font-family:var(--f-head);font-weight:700;font-size:1.25rem;color:var(--navy);line-height:1.4}
.ib-o{font-size:.8rem;color:var(--ink2);margin-top:-.3rem}
.ib-ach{display:flex;gap:.45rem;align-items:flex-start;background:rgba(0,51,117,.05);border-inline-start:4px solid var(--navy);border-radius:10px;padding:.5rem .7rem;font-size:.86rem;color:var(--navy);font-family:var(--f-head);font-weight:500}
.ib-ach .ic{color:var(--navy);margin-top:.2em}
.ib-imp{border:1.5px dashed var(--pink-s);background:#FFF8FB;border-radius:12px;padding:.6rem .75rem}
.ib-l{display:flex;align-items:center;gap:.35rem;font-family:var(--f-head);font-weight:700;font-size:.76rem;color:#b23a66;margin-bottom:.15rem}
.ib-l .ic{width:1em;height:1em}
.ib-imp p{margin:0;font-size:.86rem;color:var(--navy-r);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ib-f{display:flex;align-items:center;gap:.5rem;margin-top:auto;padding-top:.35rem}
.ib-go{margin-inline-start:auto;display:inline-flex;align-items:center;gap:.25rem;font-family:var(--f-head);font-weight:700;font-size:.85rem;color:var(--blue)}
.idet-top{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:1.4rem 0 1rem}
.idet-top .idx{font-family:var(--f-head);font-weight:700;color:var(--ink2);font-size:.9rem;direction:ltr}
.big-back{display:inline-flex;align-items:center;gap:.5rem;padding:.8rem 1.5rem .8rem 1.2rem;border-radius:14px;background:var(--pink);color:var(--navy-r);font-family:var(--f-head);font-weight:700;font-size:1.05rem;box-shadow:0 10px 24px -12px rgba(242,128,170,.9);transition:transform .15s,background .2s}
.big-back:hover{background:var(--pink-i)}
.big-back:active{transform:scale(.95)}
.big-back .ic{width:1.3em;height:1.3em}
.idet-hero{margin-top:0;padding-bottom:2.2rem;border-top:6px solid var(--ic)}
.idet-hero.inext{background:linear-gradient(135deg,#2E3F54,var(--navy-m))}
.idet-chips{position:relative;display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.9rem}
.idet-chips .chip{background:rgba(255,255,255,.95)}
.idet-facts{margin:1.2rem 0}
.idet-facts .fv{font-family:var(--f-body);font-weight:500;font-size:.92rem;line-height:1.7}
.isteps{list-style:none;margin:0;padding:0;display:grid;gap:.6rem}
.isteps li{display:flex;gap:.8rem;align-items:flex-start}
.isteps li span{flex:none;display:grid;place-items:center;width:2rem;height:2rem;border-radius:10px;background:var(--navy);color:#fff;font-family:var(--f-head);font-weight:700;font-size:.9rem}
.isteps li p{margin:.2rem 0 0}
.itypes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem;margin-bottom:1.3rem}
.isec{border-radius:var(--r);padding:1.2rem 1.3rem;opacity:0;animation:fadeUp .5s var(--ease) forwards}
.isec h4{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:0 0 .8rem;font-family:var(--f-head);font-weight:700;font-size:1rem;color:var(--navy)}
.isec .tag{margin-inline-start:auto;font-family:var(--f-head);font-weight:500;font-size:.7rem;padding:.1rem .55rem;border-radius:999px}
.isec ul{margin:0;padding:0 1.2rem 0 0}
.isec li{margin:.25rem 0}
.isec .muted{margin:0;color:var(--ink2);font-size:.88rem}
.it-ach{background:#fff;box-shadow:var(--sh),inset -5px 0 0 var(--navy)}
.it-ach h4 .ic{color:var(--navy)} .it-ach .tag{background:rgba(0,51,117,.08);color:var(--navy)} .it-ach li::marker{color:var(--navy)}
.it-tgt{background:#FFF8FB;border:2px dashed var(--pink)}
.it-tgt h4 .ic{color:var(--pink-i)} .it-tgt .tag{background:#fff;color:#b23a66;box-shadow:inset 0 0 0 1px var(--pink-s)}
.imp+.imp{margin-top:.8rem}
.imp span{font-family:var(--f-head);font-weight:700;font-size:.8rem;color:#b23a66}
.imp p{margin:.15rem 0 0;font-size:.93rem;color:var(--navy-r)}
.it-doc{background:linear-gradient(180deg,rgba(56,181,218,.07),#fff);box-shadow:var(--sh),inset -5px 0 0 var(--cyan)}
.it-doc h4 .ic{color:var(--cyan)} .it-doc .tag{background:rgba(44,193,215,.16);color:#0c6c7a}
.evs{list-style:none!important;padding:0!important;display:grid;gap:.5rem;margin-bottom:.8rem!important}
.evs li{position:relative;background:#fff;border-radius:10px;padding:.6rem .8rem 2.0rem .8rem;box-shadow:0 0 0 1px var(--line-s)}
.evs p{margin:.3rem 0 0;font-size:.9rem}
.evs small{color:var(--ink2);font-size:.75rem}
.ev-del{position:absolute;left:.4rem;bottom:.35rem;color:#b02a5c;padding:.2rem .4rem;border-radius:8px;font-size:.75rem;display:inline-flex;align-items:center;gap:.25rem}
.ev-del.arm{background:var(--pink-i);color:#fff}
.ev-form{display:grid;gap:.5rem;margin-top:.8rem;padding-top:.8rem;border-top:1px dashed var(--line-s)}
.ev-form select,.ev-form textarea,.ev-form input{width:100%;padding:.5rem .7rem;border-radius:10px;border:1px solid var(--line);background:#fff;font-family:var(--f-body);font-size:.88rem}
.ev-form textarea{min-height:4.2rem;resize:vertical}
.ev-form .btn{justify-self:start}
.pend{margin-top:.9rem;background:#fff;border-radius:10px;padding:.7rem .9rem;box-shadow:0 0 0 1px var(--line-s)}
.pend h6{margin:0 0 .3rem;font-family:var(--f-head);font-weight:700;font-size:.8rem;color:#b23a66}
.pend ul{font-size:.84rem;color:var(--ink2)}
.cta{display:inline-flex;align-items:center;gap:.45rem;margin-top:1rem;padding:.75rem 1.3rem;border-radius:14px;background:var(--navy);color:#fff;text-decoration:none;font-family:var(--f-head);font-weight:700;transition:background .2s,transform .15s}
.cta:hover{background:var(--blue)} .cta:active{transform:scale(.96)}
.sp-clock,.sp-timer,.sp-next,.sp-samples{display:flex;gap:1.2rem;align-items:center;border-radius:var(--r);padding:1.3rem 1.5rem;margin-bottom:1.3rem;box-shadow:var(--sh)}
.sp-clock{background:linear-gradient(135deg,var(--cyan),#7FD3EA);color:var(--navy-r)}
.sp-face{display:grid;place-items:center;width:5.5rem;height:5.5rem;border-radius:50%;background:#fff;color:var(--navy);flex:none}
.sp-face .ic{width:3rem;height:3rem;stroke-width:1.5}
.sp-time{font-family:var(--f-head);font-size:1.2rem;font-weight:700}
.sp-time b{font-size:2.6rem;direction:ltr;display:inline-block;line-height:1}
.sp-txt{font-family:var(--f-head);font-weight:500;margin:.2rem 0 .5rem}
.sp-compare{display:grid;grid-template-columns:1fr auto 1.3fr;gap:1rem;align-items:stretch;margin-bottom:1.3rem}
.cmp{border-radius:var(--r);padding:1.1rem 1.3rem}
.cmp h5{display:flex;align-items:center;gap:.4rem;margin:0 0 .5rem;font-family:var(--f-head);font-weight:700;font-size:1rem}
.cmp ul{margin:0;padding:0 1.2rem 0 0;font-size:.9rem}
.cmp-a{background:#EEEFF2;color:var(--ink2)}
.cmp-b{background:#fff;box-shadow:var(--sh),inset 0 0 0 2px var(--pink);color:var(--navy-r)}
.cmp-b h5{color:var(--navy)} .cmp-b h5 .ic{color:var(--pink-i)} .cmp-b li::marker{color:var(--pink)}
.cmp-arr{display:grid;place-items:center;color:var(--pink-i)}
.cmp-arr .ic{width:2rem;height:2rem}
.sp-timer{background:#fff;box-shadow:var(--sh),inset 0 0 0 2px var(--pink-l)}
.sp-ten{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;width:6rem;height:6rem;border-radius:50%;background:conic-gradient(var(--pink) 0 60deg,var(--pink-l) 60deg);flex:none;position:relative}
.sp-ten::before{content:"";position:absolute;inset:8px;border-radius:50%;background:#fff}
.sp-ten b,.sp-ten span{position:relative;font-family:var(--f-head);color:var(--navy);line-height:1}
.sp-ten b{font-size:2rem;font-weight:700}
.sp-ten span{font-size:.75rem}
.sp-timer h5,.sp-next h5,.sp-samples h5{margin:0 0 .25rem;font-family:var(--f-head);font-weight:700;font-size:1.1rem;color:var(--navy);display:flex;align-items:center;gap:.45rem}
.sp-timer p,.sp-next p{margin:0;color:var(--ink2);font-size:.9rem}
.sp-future{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-bottom:1.3rem}
.fut{background:#fff;border-radius:var(--r);padding:1rem 1.2rem;box-shadow:0 0 0 1.5px var(--line-s);border:2px dashed transparent;display:flex;flex-direction:column;gap:.15rem}
.fut span{font-family:var(--f-head);font-weight:500;color:var(--navy);font-size:.92rem}
.fut b{font-family:var(--f-head);font-size:2rem;color:var(--line);line-height:1.2}
.fut small{color:#b23a66;font-size:.76rem}
.sp-next{background:repeating-linear-gradient(-45deg,#fff 0 12px,var(--cream-w) 12px 24px);border:2px dashed var(--line);box-shadow:none}
.sp-next>.ic{width:2.6rem;height:2.6rem;color:var(--navy);flex:none}
.sp-samples{flex-direction:column;align-items:stretch;background:#fff;box-shadow:var(--sh),inset 0 0 0 2px var(--pink-l)}
.sp-samples h5 .ic{color:var(--pink-i)}
.sp-samples blockquote{margin:.2rem 0;padding:1rem 1.2rem;border-radius:14px;background:var(--cream-w);font-size:1rem;line-height:1.9;border-inline-start:4px solid var(--pink)}
.smp-nav{display:flex;align-items:center;justify-content:center;gap:.8rem;font-family:var(--f-head);font-weight:700;color:var(--ink2);direction:ltr}
.smp-empty{margin:0;color:var(--ink2);font-size:.88rem;border:1.5px dashed var(--line-s);border-radius:12px;padding:.9rem 1rem}
.idet-bottom{display:flex;justify-content:center;margin:1.6rem 0 .4rem}

@media (max-width:900px){.f-hero{grid-template-columns:1fr}.charts2{grid-template-columns:1fr}.sp-compare{grid-template-columns:1fr}.cmp-arr{transform:rotate(-90deg)}}
@media (max-width:600px){.intro-btns{flex-wrap:wrap}.big-btn{width:calc(50% - 10px)}}
@media (max-width:760px){
  .topbar{flex-wrap:wrap;gap:.6rem}
  .topbar .crumbs{order:5;width:100%}
  .kpis{margin:-4rem .4rem 0}
  .hero{padding:1.6rem 1.4rem 5rem}
  .form{grid-template-columns:1fr}
  .bar-row{grid-template-columns:1fr auto}
  .bar-row .bar-track{grid-column:1/-1;grid-row:2}
  .foot .kh{display:none}
  .kpis{grid-template-columns:repeat(2,1fr);gap:.7rem}
  .kpi{min-height:0;padding:.9rem}
}

.att-pts .ic{width:1em;height:1em;color:var(--pink-i)}
.fb-att .sb-f{color:var(--navy-r);opacity:.8}

.att-hero{padding:2.4rem 2.4rem 2.6rem;min-height:clamp(15rem,30vw,21rem);display:flex;flex-direction:column;justify-content:center;border-top:6px solid var(--pink)}
.att-hero>*:not(.pat):not(.att-art){max-width:min(62%,44rem)}
.att-hero h1{font-size:clamp(1.8rem,3.1vw,3.1rem)}
.att-hero .att-art{position:absolute;left:clamp(.5rem,4%,3.5rem);bottom:-.2rem;height:108%;aspect-ratio:420/540;filter:drop-shadow(0 20px 30px rgba(1,26,74,.35));animation:attIn 1s var(--ease) .1s both}
@keyframes attIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.att-note{display:flex;gap:.6rem;align-items:flex-start;margin:1.2rem 0 0;padding:.85rem 1.1rem;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--pink-l);font-size:.88rem;color:var(--navy-r)}
.att-note .ic{color:var(--pink-i);margin-top:.2em}
.att-note b{font-family:var(--f-head);color:var(--navy)}
.att-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1.2rem;margin-top:1.4rem}
.att-card{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:.7rem;background:#fff;border-radius:26px;padding:1.6rem 1.7rem 1.5rem;box-shadow:var(--sh);border-top:6px solid var(--ac);opacity:0;animation:fadeUp .6s var(--ease) forwards;transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.att-card:nth-child(2){animation-delay:.12s}
.att-card:hover{transform:translateY(-4px);box-shadow:var(--sh-h)}
.att-card::after{content:"";position:absolute;width:13rem;height:13rem;border-radius:50%;left:-4.5rem;top:-4.5rem;background:var(--acs);opacity:.55;pointer-events:none}
.att-card>*{position:relative;z-index:1}
.ac-exc{--ac:var(--pink);--acs:var(--pink-l)}
.ac-wk{--ac:var(--cyan);--acs:#D3F4FE}
.att-ch{display:flex;align-items:center;gap:1rem}
.att-ci{display:grid;place-items:center;width:4rem;height:4rem;border-radius:20px;background:var(--cream-w);color:var(--navy);flex:none;box-shadow:inset 0 0 0 2px var(--acs)}
.att-ci .ic{width:2rem;height:2rem}
.ac-exc .att-ci{color:var(--pink-i)}
.ac-wk .att-ci{color:#0f7f90}
.att-ey{font-family:var(--f-head);font-weight:500;font-size:.8rem;color:var(--ink2)}
.att-card h3{margin:.1rem 0 0;font-family:var(--f-head);font-weight:700;color:var(--navy);font-size:clamp(1.25rem,1.8vw,1.6rem);line-height:1.35}
.att-card p{margin:0;font-size:.98rem;color:var(--navy-r)}
.att-tags{display:flex;flex-wrap:wrap;gap:.4rem;margin:0;padding:0;list-style:none}
.att-tags li{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .7rem;border-radius:10px;background:var(--bg);font-size:.8rem;color:var(--navy)}
.att-tags .ic{width:1em;height:1em;color:var(--ac)}
.att-card .btn{align-self:flex-start;margin-top:auto;padding:.75rem 1.3rem;font-size:.95rem}
.ac-wk .btn{background:var(--cyan);color:var(--navy-r)}
.ac-wk .btn:hover{background:var(--cyan-r)}

.att-steps li.warn .sn{background:var(--pink);color:var(--navy-r);box-shadow:none}
.att-steps li.warn p{font-family:var(--f-head);font-weight:700;color:#b02a5c}
.att-cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.8rem;margin-bottom:1.1rem}
.att-rule{border-radius:var(--r-s);padding:.95rem 1.1rem;background:#fff;box-shadow:0 0 0 1px var(--line-s)}
.att-rule.ex{background:#FFF8FB;box-shadow:none;border:2px dashed var(--pink-s)}
.att-rule .tag{display:inline-flex;align-items:center;gap:.3rem;padding:.08rem .6rem;border-radius:999px;font-family:var(--f-head);font-weight:500;font-size:.72rem;background:rgba(0,51,117,.08);color:var(--navy);margin-bottom:.4rem}
.att-rule.ex .tag{background:var(--pink-l);color:#b02a5c}
.att-rule h5{margin:0 0 .3rem;font-family:var(--f-head);font-weight:700;color:var(--navy);font-size:.98rem}
.att-rule p{margin:0;font-size:.93rem}
.att-alert{display:flex;gap:.6rem;align-items:flex-start;padding:.8rem 1rem;border-radius:var(--r-s);background:var(--pink-l);color:var(--navy-r);font-size:.92rem;margin-bottom:1.1rem}
.att-alert .ic{color:#b02a5c;margin-top:.2em}
.att-alert b{font-family:var(--f-head);color:#8c1f48}
.att-impact{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem;margin:0;padding:0;list-style:none}
.att-impact li{display:flex;gap:.5rem;align-items:flex-start;background:#fff;border-radius:var(--r-s);padding:.6rem .8rem;box-shadow:0 0 0 1px var(--line-s);font-size:.9rem}
.att-impact .ic{color:var(--cyan);margin-top:.2em;flex:none}
.att-dl{display:flex;gap:.9rem;align-items:center;background:var(--navy);color:#fff;border-radius:var(--r-s);padding:1rem 1.2rem;margin-bottom:.5rem}
.att-dl .ic{width:2rem;height:2rem;color:var(--pink-t);flex:none}
.att-dl small{display:block;font-size:.78rem;opacity:.8}
.att-dl b{font-family:var(--f-head);font-weight:700;font-size:1.08rem}
.att-hist{margin:0 0 1.1rem;font-size:.82rem;color:#b02a5c;display:flex;gap:.4rem;align-items:flex-start}
.att-hist .ic{width:1.05em;height:1.05em;margin-top:.25em;flex:none}
.wk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:.6rem;margin:.6rem 0 .7rem}
.wk{display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.75rem .5rem .65rem;border-radius:16px;background:#fff;box-shadow:0 0 0 1.5px var(--line-s);text-decoration:none;color:var(--navy);transition:transform .2s var(--ease),box-shadow .2s,background .2s;opacity:0;animation:fadeUp .45s var(--ease) forwards}
.wk small{font-size:.72rem;color:var(--ink2)}
.wk b{font-family:var(--f-head);font-weight:700;font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.wk span{display:inline-flex;align-items:center;gap:.25rem;font-family:var(--f-head);font-weight:500;font-size:.72rem;color:#0f7f90}
.wk span .ic{width:.95em;height:.95em}
.wk:hover{transform:translateY(-3px);box-shadow:0 0 0 2px var(--cyan),var(--sh-h);background:#F2FBFE}
.wk:active{transform:scale(.95)}
@media (max-width:900px){.att-hero>*:not(.pat):not(.att-art){max-width:100%}.att-hero{padding-bottom:13rem}.att-hero .att-art{height:13rem;left:50%;transform:translateX(-50%);animation:none}}

}

const prefs={sound:true};
let actx=null;
function click(kind){
  if(!prefs.sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended")actx.resume();
    const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain(),f=actx.createBiquadFilter();
    o.type="triangle";
    const f0=kind==="soft"?1250:kind==="back"?900:1650;
    o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f0*.55,t+.06);
    f.type="lowpass";f.frequency.value=3200;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(kind==="soft"?.05:.09,t+.004);g.gain.exponentialRampToValueAtTime(0.0001,t+.075);
    o.connect(f);f.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.09);
  }catch(e){}
}


let modalStack=0;
function openModal(html,onMount){
  const root=document.getElementById("modal-root");
  root.innerHTML=`<div class="overlay" data-overlay><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  modalStack=1;
  const m=root.querySelector(".modal");
  if(onMount)onMount(m);
  setTimeout(()=>{(m.querySelector("[autofocus]")||m.querySelector(".m-close"))?.focus();},30);
}
function closeModal(){const root=document.getElementById("modal-root");if(!root.innerHTML)return false;root.innerHTML="";modalStack=0;return true;}

});
