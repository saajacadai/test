لتلقين، والاختبار"], "answer": 2, "why": "الأسس الثلاثة: القدوة التي تجعل الإيمان حقيقة تُعاش، والعبادة التي تحول المعاني إلى عادة، والحوار الذي يجعل الطفل يفهم لماذا يؤمن.", "ref": "ص 8"}, {"q": "بماذا ينبغي أن تبدأ الأم في بناء إيمان طفلها الصغير؟", "options": ["بحفظ النصوص دون شرح", "بتقديم المحبة والرجاء قبل الخوف: «الله يحبك ويحب الصادقين»", "بتأجيل الحديث عن الله حتى يكبر", "بالتخويف من العقوبة"], "answer": 1, "why": "تقدم الأم المحبة قبل الخوف؛ فالطفل الصغير يبني إيمانه على الحب والرجاء، ثم يأتي الخوف المتوازن مع الوعي.", "ref": "ص 9"}, {"q": "ما الفرق بين الطفل الذي يمتنع عن الخطأ خوفًا من أمه، والذي يمتنع لأن الله يراه؟", "options": ["لا فرق بينهما", "الثاني يحتاج إلى مراقبة أكثر", "الأول يحمل رقيبه معه حيث ذهب", "الأول يفعل الخطأ حين تغيب أمه، والثاني يحمل رقيبه معه حيث ذهب"], "answer": 3, "why": "الطفل الذي يمتنع خوفًا من أمه يفعل الخطأ حين تغيب، والطفل الذي يمتنع لأن الله يراه يحمل رقيبه معه حيث ذهب.", "ref": "ص 11"}, {"q": "ما نتيجة «اللين بلا حزم» في التربية؟", "options": ["طفل لا يصبر ويتعلم أن الإلحاح يكسب", "طفل يحترم القواعد دائمًا", "طفل منضبط من داخله", "طفل يطيع خوفًا ويخالف حين يغيب الرقيب"], "answer": 0, "why": "اللين بلا حزم (القاعدة تتغير بالبكاء والإلحاح) يخرج طفلًا لا يصبر ويتعلم أن الإلحاح يكسب؛ والمطلوب لين مع حزم.", "ref": "ص 19"}], "14": [{"q": "ما الخطر الأساسي في بناء الممارسات التربوية على أخبار غير متثبت منها؟", "options": ["كثرة التجارب", "إضاعة الوقت", "ظلم الطفل الذي يدفع الثمن وهو لا ذنب له", "اختلاف الآراء"], "answer": 2, "why": "من قواعد آية التبين: الجهالة تصيب الأبرياء؛ فحين نربي بخبر غير صحيح فالذي يدفع الثمن هو الطفل وهو لا ذنب له.", "ref": "ص 2"}, {"q": "أي العبارات الآتية أقرب إلى الخرافة التربوية؟", "options": ["ينبغي مراعاة الفروق الفردية", "غالبًا ما يحتاج الطفل إلى الرفق", "كل الأطفال يتعلمون بالطريقة نفسها", "تختلف الحاجات باختلاف العمر"], "answer": 2, "why": "من علامات الخرافة أن صيغتها مطلقة: «دائمًا»، «كل الأطفال»، «أكيد»؛ أما المبدأ الصحيح فصيغته مقيدة: «غالبًا»، «في هذا العمر».", "ref": "ص 3"}, {"q": "ما الموقف الصحيح من الموروث التربوي عن الجدات؟", "options": ["تجاهله تمامًا", "لا نرده لأنه قديم ولا نقبله لأنه قديم، بل نعرضه على الدليل", "رفضه كله لأنه قديم", "قبوله كله لأنه قديم"], "answer": 1, "why": "ليس كل موروث خرافة؛ ففي تراث جداتنا حكمة كثيرة صحيحة، فلا نرد الموروث لأنه قديم كما لا نقبله لأنه قديم.", "ref": "ص 3"}, {"q": "ماذا نتعلم من تصحيح النبي ﷺ لقول الناس: «كسفت الشمس لموت إبراهيم»؟", "options": ["أن الكسوف علامة على الحزن", "أن السكوت أولى في وقت الحزن", "أن الحق أولى من الراحة والمصلحة الشخصية ومجاملة مشاعر الناس", "أن الخرافة مقبولة إذا كانت في صالح صاحبها"], "answer": 2, "why": "صحح النبي ﷺ خرافة كانت في صالحه وهو في لحظة حزن على ابنه؛ فالحق أولى من الراحة والمصلحة ومجاملة مشاعر الناس.", "ref": "ص 4"}, {"q": "ما الذي تقوله الأدلة في عبارة «لا تحمليه كلما بكى، يتعود»؟", "options": ["أن الرضيع يبكي ليتحكم في أمه", "أن البكاء لا يعبر عن حاجة", "أن الاستجابة الدافئة لحاجات الرضيع تبني عنده الشعور بالأمان ولا تفسده", "أن حمل الرضيع يفسده"], "answer": 2, "why": "الرضيع يبكي لأنه لا يملك وسيلة غيرها للتعبير عن حاجته، ودراسات التعلق تشير إلى أن الاستجابة الدافئة تبني عنده الأمان ولا تفسده.", "ref": "ص 4"}, {"q": "ما الخطأ في التفكير الذي وقع فيه الناس حين ربطوا كسوف الشمس بموت إبراهيم؟", "options": ["البحث عن الحل السريع", "الخلط بين التزامن والسببية", "تعميم التجربة الواحدة", "الخوف على الطفل"], "answer": 1, "why": "من أخطاء التفكير الخلط بين التزامن والسببية: حدث الأمران في وقت واحد فظنوا أن أحدهما سبب الآخر.", "ref": "ص 6"}, {"q": "ماذا يعلمنا حديث تأبير النخل «أنتم أعلم بأمر دنياكم»؟", "options": ["أن كل رأي بشري دين", "أن الدين لا علاقة له بالحياة", "أن التجربة لا قيمة لها", "أن ما كان من الوحي نأخذه دينًا، وما كان من شؤون الحياة والتجربة نرجع فيه إلى أهل الخبرة"], "answer": 3, "why": "في الحديث منهج كامل: ما كان من الوحي نأخذه دينًا، وما كان من شؤون الحياة نرجع فيه إلى أهل الخبرة، والخرافة كثيرًا ما تخلط بينهما.", "ref": "ص 7"}, {"q": "ما الذي يتعلمه الطفل حين يُمنع من البكاء لمجرد أنه ذكر؟", "options": ["فهم حزنه", "التعبير عن حاجاته", "ضبط مشاعره", "كتمان مشاعره بدل أن يفهمها"], "answer": 3, "why": "عبارة «الذكر لا يبكي» تعلم الابن أن يكتم مشاعره بدل أن يفهمها، فيكبر وهو لا يعرف كيف يعبر عن حزنه إلا بالغضب أو الانسحاب.", "ref": "ص 12"}, {"q": "ما الذي قد يتعلمه الطفل في الحقيقة من العقاب البدني؟", "options": ["الصدق", "إخفاء أخطائه والخوف من الشخص لا من قبح الفعل", "احترام الآخرين", "ضبط مشاعره دائمًا"], "answer": 1, "why": "يبدو الضرب ناجحًا لأن الطفل يتوقف أمام الضارب، لكنه يتعلم الخوف من الشخص لا قبح الفعل، ويتعلم الإخفاء والكذب، ويتعلم أن القوة تحل المشكلات.", "ref": "ص 10"}, {"q": "ما الأسئلة الثلاثة التي تطرحها الأم الواعية على أي نصيحة تربوية منتشرة؟", "options": ["هل هي سريعة؟ وهل هي رخيصة؟ وهل هي مشهورة؟", "من نشرها؟ وكم عدد المشاهدات؟ وهل أعجبتني؟", "هل هي قديمة؟ وهل جربتها الجارة؟ وهل هي سهلة؟", "ما الدليل؟ ومن القائل وما تخصصه؟ وما مصلحة الطفل؟"], "answer": 3, "why": "الأسئلة الثلاثة: ما الدليل؟ ومن القائل وما تخصصه؟ وما مصلحة الطفل وأسوأ ما يمكن أن يحدث لو كانت خاطئة؟", "ref": "ص 13"}]}};

    st.addEventListener('touchend', onTouchEnd, { passive: true });
    st.addEventListener('touchcancel', function (e) { if (D && D.axis === 'x') cancelDrag(D); D = null; if (P) { P = null; var c = curCanvas(); if (c) c.style.transform = ''; } }, { passive: true });
  }
  /* نقرة الفأرة على الحاسوب: يسار الصفحة للتالية، ويمينها للسابقة (اللمس يعتمد السحب) */
  function tapPage(e, el) {
    if (Date.now() - lastTouch < 800 || R.zoom > 1 || !R.src) return;
    var sel = window.getSelection && window.getSelection();
    if (sel && String(sel).length) return;
    var rc = el.getBoundingClientRect();
    if (e.clientX - rc.left < rc.width / 2) gotoPage(R.page + 1); else gotoPage(R.page - 1);
  }
  document.addEventListener('keydown', function (e) {
    if (view.name !== 'read' || !R.src || e.altKey || e.ctrlKey || e.metaKey) return;
    var tg = e.target, tn = tg && tg.tagName;
    if (tn === 'INPUT' || tn === 'TEXTAREA' || tn === 'SELECT' || (tg && tg.isContentEditable)) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); gotoPage(R.page + 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); gotoPage(R.page - 1); }
  });
  var lastW = 0, resizeT = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeT);
    resizeT = setTimeout(function () {
      if (view.name !== 'read' || !R.src) return;
      var w = layoutW(); if (w === lastW) return; lastW = w;
      var my = R.sess, tok = ++R.tok;
      getCanvas(R.page).then(function (c) { if (my === R.sess && tok === R.tok) { endAnim(); setSheet(c); preload(); } });
    }, 220);
  });

  var DL = null;
  function initDownload() {
    if (!(window.claude && window.claude.use)) {
      DL = { save: function (o) {
        var u = URL.createObjectURL(o.data), a = document.createElement('a');
        a.href = u; a.download = o.filename; document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(u); a.remove(); }, 1500);
        return Promise.resolve();
      } };
      var b0 = document.getElementById('dl-btn'); if (b0) b0.hidden = false;
      return;
    }
    window.claude.use('downloads').then(function (d) {
      DL = d; var b = document.getElementById('dl-btn'); if (b && d) b.hidden = false;
    }, function () {});
  }
  var SNAMES = {"aqida": "العقيدة التربوية", "nabawiya": "التربية النبوية", "usra": "فقه الأسرة", "zawj": "منظومة الحياة الزوجية", "fann": "فن هندسة الأجيال (1)"};
  function downloadSummary() {
    var msg = document.getElementById('dl-msg'); if (!DL) return;
    if (msg) msg.textContent = 'جارٍ التجهيز…';
    var src = summaryPdf(R.file, R.n);
    var ttl = (subj(R.sid).lectures[R.n - 1].title || '').replace(/[\\/:*?"<>|]/g, ' ');
    fetch(src).then(function (r) { if (!r.ok) throw new Error('x'); return r.blob(); })
      .then(function (b) { return DL.save({ filename: 'ملخص ' + SNAMES[R.file.split('_')[0]] + ' - المحاضرة ' + pad2(R.n) + ' - ' + ttl + '.pdf', data: b }); })
      .then(function () { if (msg) msg.textContent = 'تم حفظ الملخص.'; })
      .catch(function (e) { if (msg) msg.textContent = (e && e.code === 'declined') ? '' : 'تعذّر التنزيل الآن.'; });
  }

  /* ---------- الأحداث ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action]');
    if (!t || t.type === 'checkbox') return;
    var a = t.getAttribute('data-action'), sid = t.getAttribute('data-sid'), n = parseInt(t.getAttribute('data-n'), 10);
    if (a === 'open-subject') { subjQuery = ''; go({ name: 'subject', sid: sid }); }
    else if (a === 'open-lecture') {
      subjQuery = ''; go({ name: 'subject', sid: sid });
      setTimeout(function () { var el = document.getElementById('lec-' + n); if (el) el.scrollIntoView({ block: 'center' }); }, 30);
    }
    else if (a === 'home') { go({ name: 'home' }); }
    else if (a === 'read') { openReader(sid, n); }
    else if (a === 'download-summary') { downloadSummary(); }
    else if (a === 'tap-page') { tapPage(e, t); }
    else if (a === 'pg-prev') { gotoPage(R.page - 1); }
    else if (a === 'pg-next') { gotoPage(R.page + 1); }
    else if (a === 'pg-first') { gotoPage(1); }
    else if (a === 'zoom-in') { setZoom(R.zoom + 0.25); }
    else if (a === 'zoom-out') { setZoom(R.zoom - 0.25); }
    else if (a === 'reader-retry') { R.src = null; startReader(); }
    else if (a === 'done-read') { setL(R.sid, R.n, { summary: true }); go({ name: 'subject', sid: R.sid }); setTimeout(function () { var el = document.getElementById('lec-' + R.n); if (el) el.scrollIntoView({ block: 'center' }); }, 30); }
    else if (a === 'quiz-from-read') { startQuiz(R.sid, R.n); }
    else if (a === 'back-subject') { go({ name: 'subject', sid: R.sid }); }
    else if (a === 'quiz') { startQuiz(sid, n); }
    else if (a === 'demo') { startDemo(); }
    else if (a === 'check') { if (Q.picked[Q.i] != null) { Q.checked = true; render(); } }
    else if (a === 'next-q') {
      if (Q.i < Q.qs.length - 1) { Q.i++; Q.checked = false; render(); window.scrollTo(0, 0); } else finishQuiz();
    }
    else if (a === 'quit-quiz') { if (Q.demo) go({ name: 'home' }); else { go({ name: 'subject', sid: Q.sid }); } }
    else if (a === 'retry') { Q.i = 0; Q.picked = []; Q.checked = false; go({ name: 'quiz' }); }
    else if (a === 'review') { go({ name: 'review' }); }
    else if (a === 'to-result') { go({ name: 'result' }); }
    else if (a === 'next-lecture') { if (nextWithQuestions()) startQuiz(Q.sid, Q.n + 1); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.name === 'opt' && Q && !Q.checked) {
      Q.picked[Q.i] = parseInt(t.value, 10);
      var btn = document.getElementById('check-btn'); if (btn) btn.disabled = false;
    } else if (t.getAttribute && t.getAttribute('data-action') === 'toggle-summary') {
      setL(t.getAttribute('data-sid'), parseInt(t.getAttribute('data-n'), 10), { summary: t.checked });
      refreshList();
    }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'home-search') renderHomeResults(e.target.value);
    else if (e.target.id === 'subj-search') {
      subjQuery = e.target.value;
      var s = subj(view.sid), el = document.getElementById('lecture-list');
      if (s && el) el.innerHTML = lectureList(s);
    }
  });

  var m0 = /^#subject-(s[1-5])$/.exec(location.hash);
  view = m0 ? { name: 'subject', sid: m0[1] } : { name: 'home' };
  render();
})();
</script>
