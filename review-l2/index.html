"ص 4"}, {"q": "على ماذا يدل اشتراط المحرم لسفر المرأة؟", "options": ["عدم الثقة بها", "كمال الشريعة واعتنائها بالمرأة وحفظها مما قد يؤذيها", "منعها من الحج", "التضييق عليها"], "answer": 1, "why": "اشتراط المحرم في سفر المرأة صورة من صور حفظ الإسلام لها ورعايته، ودليل على كمال الشريعة واعتنائها بها.", "ref": "ص 5"}, {"q": "من الصنفان من أهل النار اللذان لم يرهما النبي ﷺ؟", "options": ["الحكام والعلماء", "التجار والزراع", "قوم معهم سياط كأذناب البقر يضربون بها الناس، ونساء كاسيات عاريات مائلات مميلات", "الأغنياء والفقراء"], "answer": 2, "why": "قال ﷺ: «صنفان من أهل النار لم أرهما: قوم معهم سياط كأذناب البقر... ونساء كاسيات عاريات مائلات مميلات».", "ref": "ص 6"}, {"q": "من شروط اللباس الشرعي للمرأة:", "options": ["أن يكون ضيقًا ساترًا للون", "أن يغطي الرأس فقط", "أن يكون لباس شهرة", "أن يكون ساترًا لجميع البدن واسعًا صفيقًا لا يصف ولا يشبه لباس الرجال ولا يكون مطيّبًا عند الخروج"], "answer": 3, "why": "من شروط اللباس الشرعي: أن يكون ساترًا لجميع البدن، واسعًا صفيقًا لا يصف، ولا يشبه لباس الرجال ولا الكافرات، وليس لباس شهرة ولا مطيّبًا.", "ref": "ص 8"}, {"q": "لماذا نُهيت المرأة عن الخروج متعطرة؟", "options": ["لأنها فتنة للرجل، والشريعة وضعت حواجز تمنع الفساد بين الرجال والنساء", "لأن العطر غالي الثمن", "لأنه يضر بالصحة", "لا نهي في ذلك"], "answer": 0, "why": "المرأة فتنة للرجل، فجاءت الشريعة بحواجز تمنع الفساد، ومنها النهي عن خروج المرأة متعطرة.", "ref": "ص 9"}, {"q": "ما حكم استعمال مزيلات العرق ذات الرائحة العطرية القوية عند الخروج؟", "options": ["واجبة للنظافة", "حكمها حكم العطر، أما ضعيفة الرائحة فيُرجى ألا مانع منها", "جائزة مطلقًا", "مستحبة"], "answer": 1, "why": "بعض الكريمات ومزيلات العرق ذات الرائحة القوية استعمالها عند الخروج كاستعمال العطر، أما ضعيفة الرائحة فيرجى ألا مانع منها.", "ref": "ص 10"}, {"q": "بماذا ردّ النبي ﷺ على عائشة حين قالت عن صفية: «حسبك من صفية كذا وكذا»؟", "options": ["«لقد قلتِ كلمة لو مُزجت بماء البحر لمزجته»", "وافقها على قولها", "قال: صدقتِ", "سكت عنها"], "answer": 0, "why": "قال ﷺ: «لقد قلت كلمة لو مزجت بماء البحر لمزجته»، تحذيرًا من الغيبة.", "ref": "ص 12"}], "10": [{"q": "أكملي الحديث: «ليس منا من لم يرحم صغيرنا و...»", "options": ["يوقّر كبيرنا", "يطعم جائعنا", "يعلّم جاهلنا", "يزور مريضنا"], "answer": 0, "why": "قال ﷺ: «ليس منا من لم يرحم صغيرنا ويوقر كبيرنا».", "ref": "ص 2"}, {"q": "ما المقصود بقوله ﷺ «ليس منا» في الحديث؟", "options": ["أنه ليس من قبيلة النبي ﷺ", "خروج صاحب الفعل عن هدي النبي ﷺ القويم", "أنه ليس من الصحابة", "خروجه من ملة الإسلام"], "answer": 1, "why": "المقصود خروج صاحب الفعل عن هدي النبي ﷺ القويم، لا خروجه من ملة الإسلام.", "ref": "ص 10"}, {"q": "ما تمام الرحمة بالطفل كما بيّنت المحاضرة؟", "options": ["وضع الأجهزة الذكية بين يديه طول الوقت", "عدم تعليمه الصلاة والفرائض", "تدليله وتعويده على الالتزام بالأحكام الشرعية كأمره بالصلاة لسبع وضربه عليها لعشر", "تدليله وإعطاؤه كل ما يريد"], "answer": 2, "why": "الرحمة الحقيقية بالطفل لا تكون بالتدليل والملاعبة فقط، بل من تمامها تعويده على الالتزام بالأحكام الشرعية.", "ref": "ص 3"}, {"q": "ما فكرة نشاط «حزم ورحمة»؟", "options": ["معاقبة الطفل في كل موقف", "ترك الطفل يفعل ما يشاء", "مكافأة الطفل على كل طلب", "تحديد كيف تعبّر الأم عن الرحمة في مواقف مثل رفض الصلاة أو الإصرار على الهاتف دون الوقوع في التدليل الزائد"], "answer": 3, "why": "يتأمل النشاط مواقف كرفض الصلاة والإصرار على الهاتف والبكاء للحصول على ما يريد، وكيف تُظهر الأم الرحمة دون تدليل زائد.", "ref": "ص 4"}, {"q": "ماذا قال النبي ﷺ للأقرع بن حابس حين أنكر تقبيله الحسن بن علي؟", "options": ["«ليس منا من لم يوقر كبيرنا»", "«قبّلهم كما أقبّل»", "«من لا يَرحم لا يُرحم»", "«إن لك عشرة من الولد»"], "answer": 2, "why": "لما قال الأقرع إن له عشرة من الولد ما قبّل منهم أحدًا قال ﷺ: «من لا يرحم لا يرحم».", "ref": "ص 5"}, {"q": "لماذا أطال النبي ﷺ السجود في صلاة العشاء كما في حديث شداد بن الهاد؟", "options": ["لأنه كان يدعو لأمر عظيم", "لأن ابنه -الحسن أو الحسين- ارتحله فكره أن يعجله حتى يقضي حاجته", "لأن الوحي نزل عليه", "لأنه نام في السجود"], "answer": 1, "why": "قال ﷺ: «إن ابني ارتحلني فكرهت أن أعجله حتى يقضي حاجته»، فدل على ملاعبة الأولاد ورحمتهم.", "ref": "ص 6"}, {"q": "ماذا يدل عليه حمل النبي ﷺ أمامة بنت زينب في الصلاة؟", "options": ["جواز حمل الأطفال في الصلاة، ورحمته ﷺ بهم", "أن ذلك خاص بالنافلة", "بطلان الصلاة بالحركة", "وجوب حمل الأطفال"], "answer": 0, "why": "كان ﷺ يصلي وهو حامل أمامة، فإذا سجد وضعها وإذا قام حملها، وفيه جواز حمل الأطفال في الصلاة ورحمته بهم.", "ref": "ص 7"}, {"q": "ما الأولى للمرأة التي ترعى طفلًا قد يشوّش على المصلين؟", "options": ["الذهاب بالطفل للمسجد دائمًا", "صلاتها في بيتها ورعايتها لطفلها أولى وأسلم من ذهابها للمسجد", "ترك الطفل وحده", "ترك الصلاة"], "answer": 1, "why": "صلاة المرأة في المسجد غير واجبة، فصلاتها في بيتها ورعايتها لطفلها حتى لا يشوش على المصلين أولى وأسلم.", "ref": "ص 8"}, {"q": "ماذا قال النبي ﷺ ممازحًا لأخي أنس الصغير؟", "options": ["«يا غلام سمِّ الله»", "«يا أبا هريرة»", "«يا أبا عمير، ما فعل النُّغَير؟»", "«يا ذا الأذنين»"], "answer": 2, "why": "كان ﷺ يمازح أخا أنس الصغير فيقول: «يا أبا عمير ما فعل النغير؟» إدخالًا للسرور عليه.", "ref": "ص 8"}, {"q": "من فوائد تكنية الصبي في صغره:", "options": ["لا فائدة لها", "إكرامه، والتفاؤل له بأن يكون أبًا، والتعجيل بالكنية الحسنة", "تمييزه عن إخوته بالتفضيل", "تحقيره"], "answer": 1, "why": "ينبغي أن يُكنى الصبي في صغره لثلاث فوائد: إكرامه، والتفاؤل له بأن يكون أبًا، والتعجيل بالكنية الحسنة.", "ref": "ص 9"}], "11": [{"q": "متى يكتمل إيمان المرء كما جاء في حديث أنس؟", "options": ["عندما يكون النبي ﷺ أحب إليه من ماله فقط", "عندما يزور مسجده", "عندما يحفظ أحاديثه", "عندما يكون النبي ﷺ أحب إليه من ولده ووالده والناس أجمعين"], "answer": 3, "why": "قال ﷺ: «لا يؤمن أحدكم حتى أكون أحب إليه من ولده ووالده والناس أجمعين».", "ref": "ص 2"}, {"q": "ما أعظم مواطن اختبار محبة النبي ﷺ؟", "options": ["أن يمدحه في المجالس", "أن يزور مسجده", "أن يحتفل بمولده", "أن يقبل على الإنسان أمر يحبه وتهواه نفسه ثم يعلم أن النبي ﷺ نهى عنه، فيقدّم أمره"], "answer": 3, "why": "من أعظم مواطن الاختبار أن يقبل على العبد أمر يحبه وتهواه نفسه ثم يعلم أن النبي ﷺ نهى عنه، فيقدّم أمر النبي على هواه.", "ref": "ص 3"}, {"q": "من تمام محبة النبي ﷺ:", "options": ["نصر سنته ونشرها بين الناس وتمنّي رؤيته ولو بفقد الأهل والمال", "ترك سنته", "الغلو فيه بصرف العبادة له", "الاكتفاء بالمحبة القلبية دون عمل"], "answer": 0, "why": "من تمام محبته ﷺ نصر سنته ونشرها، وتمني رؤيته ولو فقد الإنسان في مقابل ذلك أهله وماله.", "ref": "ص 5"}, {"q": "ماذا فعل النبي ﷺ حين طرق عليًّا وفاطمة ليلًا؟", "options": ["أيقظهما للسفر", "حثّهما على قيام الليل فقال: «ألا تصليان؟»", "أحضر لهما طعامًا", "علّمهما أذكار النوم"], "answer": 1, "why": "طرقهما ﷺ ليلًا فقال: «ألا تصليان؟»، وهذا قدوة عملية في الحث على العبادة.", "ref": "ص 6"}, {"q": "ماذا تعلمنا قصة نوم الصحابة عن صلاة الفجر حين قال بلال: «أنا أوقظكم»؟", "options": ["أن بلالًا قصّر عمدًا", "أن ترك الصلاة لا شيء فيه", "الأخذ بالأسباب لعدم تفويت الصلاة مع العلم أن الأمر بيد الله", "النهي عن السفر ليلًا"], "answer": 2, "why": "خشي ﷺ أن يناموا عن الصلاة فتكفل بلال بإيقاظهم ثم غلبه النوم، وفيه الحرص على العبادة والأخذ بالأسباب.", "ref": "ص 7"}, {"q": "ما المقصود بالفاحشة في قوله تعالى: ﴿والذين إذا فعلوا فاحشة﴾ بحسب المحاضرة؟", "options": ["ترك النوافل", "كل خطأ صغير", "اسم للمنكرات العظيمة وليست للمعاصي العادية", "الكلام الكثير"], "answer": 2, "why": "الفاحشة اسم للمنكرات العظيمة وليست للمعاصي العادية.", "ref": "ص 9"}, {"q": "ما الذي يُربَّى عليه الطفل من قوله ﷺ: «واعلم أن ما أصابك لم يكن ليخطئك»؟", "options": ["ترك الأسباب", "التعلق بالله ومعرفته واستحضار أن كل شيء بيده", "اليأس عند المصائب", "الاعتماد على الناس"], "answer": 1, "why": "الحديث فيه تربية على التعلق بالله ومعرفته واستحضار أن كل شيء بيده، وأن النصر مع الصبر والفرج مع الكرب.", "ref": "ص 10"}, {"q": "لماذا ينبغي للمؤمن أن يحرص على دعاء: ﴿ربنا لا تزغ قلوبنا بعد إذ هديتنا﴾؟", "options": ["لأنه دعاء السفر", "لأن أكثر ما يقلق منه المؤمن أن يُسلب الإيمان فيزيغ قلبه بعد الهداية", "لأنه خاص بالأنبياء", "لأنه دعاء للرزق"], "answer": 1, "why": "أكثر ما يقلق المؤمن أن يسلبه الله الإيمان فيزيغ قلبه بعد الهداية، فيحرص على هذا الدعاء.", "ref": "ص 11"}, {"q": "ما معنى قوله ﷺ: «تعرّف إلى الله في الرخاء يعرفك في الشدة»؟", "options": ["أن نتعرف إلى الله بطاعته ودعائه في حال الصحة والأمن والغنى، فيعيننا عند الشدائد", "أن نلجأ إلى الله في الشدة فقط", "أن نترك الدعاء في الرخاء", "أن الرخاء لا يحتاج إلى عبادة"], "answer": 0, "why": "في حال الرخاء من صحة وأمن وغنى نتعرف إلى الله بالطاعة والدعاء، فيعرفنا في الشدة فيعيننا وينجينا.", "ref": "ص 13"}, {"q": "ما معنى عدم سؤال الناس في وصية «إذا سألت فاسأل الله»؟", "options": ["لا معنى تربويًا له", "يجب سؤال الناس عند كل حاجة", "ليس على التحريم بل على معنى الكمال بتعليق القلب بالله وعدم الاعتماد على الخلق", "يحرم سؤال الناس مطلقًا"], "answer": 2, "why": "المقصود بعدم السؤال ليس التحريم بل الكمال، بتعليق القلب بالله وحده، فما نستطيع فعله بأنفسنا لا نطلبه من غيرنا.", "ref": "ص 12"}], "12": [{"q": "متى يؤمر الأولاد بالصلاة ومتى يُضربون عليها؟", "options": ["يؤمرون لعشر ويضربون لخمس عشرة", "يؤمرون لسبع ويُضربون عليها لعشر، ويُفرّق بينهم في المضاجع", "يؤمرون عند البلوغ", "يضربون لسبع"], "answer": 1, "why": "قال ﷺ: «مروا أولادكم بالصلاة وهم أبناء سبع، واضربوهم عليها وهم أبناء عشر، وفرقوا بينهم في المضاجع».", "ref": "ص 2"}, {"q": "ما الطريقة الأكمل في تعليم الأطفال الصلاة؟", "options": ["أن يؤدوها أمام أحد الوالدين فيصحح لهم، ثم يراقبهم دون أن يشعروا، مع عدم الاستغناء عن القدوة", "الاكتفاء بالأمر الشفهي", "معاقبتهم عند كل خطأ", "إعطاؤهم كتابًا عن الصلاة فقط"], "answer": 0, "why": "الأكمل أن يؤمر الولد بأداء الصلاة أمام أحد الوالدين فيصحح له ويكرر، ثم يراقبه دون أن يشعر، مع التعليم بالقدوة قبله وأثناءه.", "ref": "ص 3"}, {"q": "لماذا كان ترك الصلاة شرًّا من سائر المعاصي كالزنا والسرقة وشرب الخمر؟", "options": ["لأنها أخف المعاصي", "لأنه لا عقوبة عليه", "لأن الصلاة سنة", "لأن الصلاة من أوجب الواجبات، وتركها يدل على شر من هذه المعاصي عدا الكفر"], "answer": 3, "why": "الصلاة من أوجب الواجبات، وتركها يدل على شر من المعاصي عمومًا كالزنا والسرقة وشرب الخمر عدا الكفر.", "ref": "ص 4"}, {"q": "ما سبب التفريق بين الأولاد في المضاجع في سن العاشرة مع أنه غالبًا ليس سن البلوغ؟", "options": ["لأن هذا السن بداية الدخول في مرحلة البلوغ", "من باب التشدد في الدين", "لأنهم يتشاجرون", "حتى لا تُكتب عليهم السيئات"], "answer": 0, "why": "سن العاشرة هو بداية الدخول في مرحلة البلوغ، فيُفرّق بينهم احتياطًا.", "ref": "ص 12"}, {"q": "إذا اضطر الأولاد للنوم في غرفة واحدة، فما الشرط؟", "options": ["أن يكون عمرهم أقل من عشرين", "لا شرط في ذلك", "أن تكون البنات في أبعد مكان من الأولاد ومستترات باللباس الساتر وغطاء النوم", "أن يناموا في فراش واحد"], "answer": 2, "why": "لا بأس بكونهم في غرفة واحدة بشرط أن تكون البنات في أبعد مكان عن الأولاد ومستترات باللباس الساتر وغطاء النوم.", "ref": "ص 6"}, {"q": "أكملي الحديث: «عليكم بالصدق، فإن الصدق يهدي إلى البر، وإن البر يهدي إلى...»", "options": ["الرزق", "الصحة", "الشهرة", "الجنة"], "answer": 3, "why": "قال ﷺ: «عليكم بالصدق فإن الصدق يهدي إلى البر وإن البر يهدي إلى الجنة».", "ref": "ص 6"}, {"q": "ما المقصود بأن من ثواب الحسنة الحسنة بعدها؟", "options": ["أن الحسنات لا تتكرر", "أن الحسنة تمحو كل الذنوب", "أن الصدق يوفق الإنسان إلى أن يكون من أهل الطاعات المتتابعة، وكذلك السيئة تجر السيئة", "أن الثواب في الدنيا فقط"], "answer": 2, "why": "من ثواب الحسنة الحسنة بعدها، ومن عقوبة السيئة السيئة بعدها، فالصدق يوفق صاحبه لمزيد من الخير.", "ref": "ص 7"}, {"q": "كيف تتعامل الأم مع طفل يكثر الكذب؟", "options": ["تتجاهل كذبه", "تفضحه أمام الناس", "تكذّبه في كل ما يقول", "لا تكذّبه في كل شيء، فقد يصدق أحيانًا فتظلمه"], "answer": 3, "why": "عند العلم بكثرة كذب الطفل لا يصح أن نكذّبه في كل شيء، فقد يصدق أحيانًا فنظلمه ونقع في خطأ تربوي.", "ref": "ص 9"}, {"q": "ما رأي أكثر العلماء في صيغة «لعّان» في حديث «ليس المؤمن بالطعان ولا اللعان»؟", "options": ["المراد نفي اللعن عن الكافر", "لا علاقة له بالمؤمن", "المراد أن اللعن القليل جائز", "ليس المراد نفي الكثرة فقط، لأن اللعن محرم قليله وكثيره"], "answer": 3, "why": "أكثر العلماء يرون أنه ليس المراد نفي كثرة اللعن فقط، لأن اللعن محرم في الشريعة قليله وكثيره.", "ref": "ص 10"}, {"q": "من أهم الوسائل المعينة على تربية الأولاد على حفظ اللسان:", "options": ["الاكتفاء بالعقاب", "اختيار البيئة الحسنة الصالحة لهم وإبعادهم عن البيئات السيئة", "تركهم مع أي رفقة", "منعهم من الكلام"], "answer": 1, "why": "من أهم ما يعين على ذلك اختيار البيئة الصالحة لهم من مدرسة وجيران وأقارب، وإبعادهم عن البيئات السيئة.", "ref": "ص 11"}], "13": [{"q": "ماذا قال النبي ﷺ لبشير والد النعمان حين أراد أن يُشهده على عطية لابنه دون إخوته؟", "options": ["«أعطه وحده»", "«لا بأس بذلك»", "«أعطِ الكبير دون الصغير»", "«اتقوا الله واعدلوا بين أولادكم»"], "answer": 3, "why": "سأله ﷺ: أعطيت سائر ولدك مثل هذا؟ قال: لا، قال: «فاتقوا الله واعدلوا بين أولادكم».", "ref": "ص 2"}, {"q": "ماذا كان السلف يستحبون في العدل بين الأولاد كما نقل إبراهيم النخعي؟", "options": ["لا شيء من ذلك", "أن يفضّل الكبير", "أن يفضّل الذكور", "أن يعدل الرجل بين ولده حتى في القُبَل"], "answer": 3, "why": "قال النخعي: كانوا يستحبون أن يعدل الرجل بين ولده حتى في القبل، حتى لا يقع في نفس الطفل شيء.", "ref": "ص 3"}, {"q": "هل يجوز للأب أن يعطي ابنه الذي يعمل معه في تجارته شيئًا دون إخوته؟", "options": ["يجوز للبنات فقط", "نعم، لأنه مقابل عمله فهو أشبه بالأجرة لا الهدية", "يجوز إذا كان الأكبر", "لا يجوز مطلقًا"], "answer": 1, "why": "يجوز لأن ذلك مقابل عمله الذي عمله وليس هدية، فهو أشبه بالأجير الذي يأخذ أجرة عمله.", "ref": "ص 4"}, {"q": "ماذا يدل عليه حديث خروج النبي ﷺ إلى فناء بيت فاطمة يسأل: «أثمّ لُكَع؟»", "options": ["الشدة في التربية", "عدم الاهتمام بالأطفال", "النهي عن زيارة الأقارب", "إشباع حاجات الطفل العاطفية بالاحتضان والتقبيل"], "answer": 3, "why": "جاء الحسن يشتد حتى عانقه النبي ﷺ وقبّله، وفيه إشباع حاجات الطفل العاطفية.", "ref": "ص 5"}, {"q": "هل يؤدي الحنان والتدليل المعتدل إلى ضعف شخصية الطفل؟", "options": ["نعم دائمًا", "يجوز مع البنات فقط", "لا، فالحسن والحسين مع شدة حب النبي ﷺ لهما كانا من أقوى الناس شخصية ورجولة", "يُضعف الذكور فقط"], "answer": 2, "why": "القول بأن هذا الدلال يضعف الشخصية مردود؛ فالحسن والحسين كانا من أقوى الناس شخصية مع شدة حب النبي ﷺ لهما وتلطفه بهما.", "ref": "ص 6"}, {"q": "ما حقيقة الرفق؟", "options": ["الشدة المستمرة", "الضعف أمام الأبناء", "ترك التوجيه تمامًا", "اللين في القول والفعل: في القول بعدم الغلظة والسب، وفي الفعل بعدم الشدة والتعجل"], "answer": 3, "why": "حقيقة الرفق اللين في القول والفعل؛ ففي القول بعدم الغلظة والشتم والسب، وفي الفعل بالأناة وعدم الشدة والتعجل.", "ref": "ص 7"}, {"q": "ما التوجيه بشأن كثرة المنهيات في تربية الطفل؟", "options": ["النهي دون تعليل", "أن يكون التوجيه المبني على المنع قليلًا، والأكثر الحث والترغيب", "أن تكون التربية كلها منهيات", "ترك النهي تمامًا"], "answer": 1, "why": "التوجيه المبني على المنع ينبغي أن يكون قليلًا، والأكثر التوجيه المبني على الحث والترغيب، لأن نفس الطفل لا تتقبل كثرة المناهي.", "ref": "ص 8"}, {"q": "ما معنى قوله ﷺ: «ولن يشادّ الدين أحد إلا غلبه»؟", "options": ["من تشدد في الدين وتعمق وكلف نفسه ما لا تطيق انقطع في الغالب", "أن الدين يُغلب", "أن التشدد مطلوب", "أن العبادة لا حد لها"], "answer": 0, "why": "من غالى في الدين وتشدد وكلف نفسه ما لا تطيق فإنه يمل ويتعب فينقطع، وهذا بيان لوسطية الدين.", "ref": "ص 9"}, {"q": "كيف نتعامل مع الأولاد في النوافل والمستحبات؟", "options": ["بإلزامهم بالنوافل كلها", "بمطالبتهم جميعًا بالدرجة نفسها", "بالرفق وعدم مطالبتهم بما فيه مشقة حتى لا ينفروا، مع مراعاة تفاوت قدراتهم", "بمعاقبتهم على تركها"], "answer": 2, "why": "نتعامل معهم بالرفق خاصة في النوافل، فلا نطالبهم بما فيه مشقة حتى لا ينفروا، ونراعي تفاوت قدرتهم.", "ref": "ص 10"}, {"q": "الرفق تقتصر ثماره على الآخرة فقط:", "options": ["خطأ، فالله يعطي على الرفق ما لا يعطي على العنف في الدنيا والآخرة", "صحيح", "صحيح في التربية فقط", "خطأ في العبادة فقط"], "answer": 0, "why": "العبارة خطأ؛ قال ﷺ: «ويعطي على الرفق ما لا يعطي على العنف»، وثماره في الدنيا والآخرة.", "ref": "ص 7"}], "14": [{"q": "ما الشرط الذي ذكرته المقدمة لغرس القيم والأخلاق في نفوس الأولاد؟", "options": ["أن نكثر من المواعظ", "أن نتحلى بها نحن أولًا، ففاقد الشيء لا يعطيه", "أن نعاقبهم على كل خطأ", "أن نكلف المدرسة بذلك"], "answer": 1, "why": "لا يمكن غرس القيم في نفوس الأولاد إلا بعد أن نتحلى بها نحن، فلا يغرس القيمة من يفتقدها.", "ref": "ص 2"}, {"q": "ما المقصود بـ«آية المنافق» في الحديث؟", "options": ["آية من القرآن نزلت في المنافقين", "علامته التي يُستدل بها على النفاق الذي هو أمر قلبي باطن", "صفة خاصة بالكفار", "اسم منافق معين"], "answer": 1, "why": "«آية» أي علامة، أراد النبي ﷺ إخبارنا بعلامات المنافقين ليُستدل بها لأن النفاق أمر قلبي باطن.", "ref": "ص 3"}, {"q": "متى لا يُلام من أخلف الوعد؟", "options": ["لا يُعذر أبدًا", "إذا عزم على الوفاء ثم منعه عذر قاهر، وينبغي له إبداء عذره", "إذا نسي وعده تهاونًا", "إذا وعد وهو ينوي الإخلاف"], "answer": 1, "why": "من عزم على الوفاء ثم منعه عذر قاهر فهو غير ملوم ولا مذنب، وينبغي له إبداء عذره حال إخلافه.", "ref": "ص 4"}, {"q": "من صور الفجور في الخصومة:", "options": ["الصلح بين الطرفين", "العفو عن الخصم", "طلب الحق بالبينة", "أن يدّعي الشخص ما ليس له، والإتيان بشهود الزور"], "answer": 3, "why": "من صور الفجور في الخصومة أن يدعي ما ليس له، أو يأتي بشاهدي زور، كما يحصل في بعض خصومات الزوجين في المحاكم.", "ref": "ص 5"}, {"q": "ماذا قال ابن أبي مليكة عن الصحابة رضي الله عنهم؟", "options": ["كانوا يتهمون غيرهم بالنفاق", "أدركتُ ثلاثين من أصحاب النبي ﷺ كلهم يخاف النفاق على نفسه", "لم يكن فيهم من يخاف", "كانوا لا يخافون النفاق"], "answer": 1, "why": "قال: أدركت ثلاثين من أصحاب النبي ﷺ كلهم يخاف النفاق على نفسه، فما بالنا نحن؟!", "ref": "ص 6"}, {"q": "ما أدنى شعب الإيمان كما في الحديث؟", "options": ["إماطة الأذى عن الطريق", "شهادة التوحيد", "الحياء", "الصلاة"], "answer": 0, "why": "أدنى شعب الإيمان إماطة الأذى عن الطريق، أي إبعاد ما يؤذي الناس من حجر أو شوك أو قمامة.", "ref": "ص 7"}, {"q": "أي مما يلي من الحياء المذموم؟", "options": ["الحياء في اللباس", "أن يمنع الحياءُ المسلمَ من تعلم شيء من أحكام دينه", "الحياء من الله", "الحياء من فعل المعاصي"], "answer": 1, "why": "من الحياء المذموم أن يمنع المسلم من تعلم أحكام دينه، أو من الأمر بالمعروف والنهي عن المنكر حال وجوبه.", "ref": "ص 8"}, {"q": "من القوي حقيقة كما بيّنت المحاضرة؟", "options": ["من ينتصر في كل خصومة", "من يتحكم في غضبه فيغلب نفسه ويكظم غيظه", "شديد البدن", "من يرفع صوته"], "answer": 1, "why": "القوي حقيقة من يتحكم في غضبه فيغلب نفسه ويقهرها ويكظم غيظه، لا شديد البدن.", "ref": "ص 9"}, {"q": "من الوسائل النبوية لعلاج الغضب:", "options": ["رفع الصوت", "الرد بالمثل", "السكوت، وتغيير الهيئة كالجلوس إن كان قائمًا", "الخروج من البيت بعنف"], "answer": 2, "why": "من الوسائل قوله ﷺ: «إذا غضب أحدكم فليسكت»، و«إذا غضب أحدكم وهو قائم فليجلس».", "ref": "ص 10"}, {"q": "ما جزاء من كظم غيظًا وهو قادر على إنفاذه؟", "options": ["يُرفع له في الدنيا فقط", "لا أجر له", "يُعطى مالًا", "يدعوه الله على رؤوس الخلائق يوم القيامة حتى يخيّره من الحور ما شاء"], "answer": 3, "why": "قال ﷺ: «من كظم غيظًا وهو قادر على أن ينفذه دعاه الله على رؤوس الخلائق يوم القيامة حتى يخيره من الحور ما شاء».", "ref": "ص 11"}], "15": [{"q": "بماذا دعا النبي ﷺ لأنس بن مالك حين طلبت أمه أم سليم ذلك؟", "options": ["«اللهم علمه الكتاب»", "«اللهم أكثر ماله وولده، وبارك له فيما أعطيته»", "«اللهم اجعله من أهل الجنة»", "«اللهم فقهه في الدين»"], "answer": 1, "why": "قالت أم سليم: خادمك أنس ادع الله له، فقال ﷺ: «اللهم أكثر ماله وولده وبارك له فيما أعطيته».", "ref": "ص 2"}, {"q": "ما الذي يدل عليه دعاء النبي ﷺ لأنس بكثرة المال والولد؟", "options": ["جواز الدعاء بكثرة المال والولد، فالشريعة جاءت لإصلاح الدين والدنيا معًا", "أن الدعاء لا يستجاب", "أن المال شر مطلق", "تحريم طلب الدنيا"], "answer": 0, "why": "في الحديث جواز الدعاء بكثرة المال والولد، فلا حرج من طلب الدنيا من الله، والشريعة جاءت لإصلاح الدين والدنيا.", "ref": "ص 3"}, {"q": "كيف ظهر أثر دعاء النبي ﷺ في أنس رضي الله عنه؟", "options": ["لم يظهر أثر", "صار خليفة", "طال عمره فقط", "كثر ماله وولده حتى دفن من صلبه مائة وخمسة وعشرين، وكانت أرضه تثمر مرتين في السنة"], "answer": 3, "why": "هذا من دلائل النبوة؛ فقد كثر مال أنس وولده حتى دفن من صلبه مائة وخمسة وعشرين، وكانت أرضه تثمر في السنة مرتين.", "ref": "ص 3"}, {"q": "من دعاء عباد الرحمن في أواخر سورة الفرقان:", "options": ["﴿ربنا آتنا في الدنيا حسنة﴾", "﴿رب اشرح لي صدري﴾", "﴿ربنا هب لنا من أزواجنا وذرياتنا قرة أعين واجعلنا للمتقين إمامًا﴾", "﴿رب اغفر لي ولوالدي﴾"], "answer": 2, "why": "من دعوات عباد الرحمن: ﴿ربنا هب لنا من أزواجنا وذرياتنا قرة أعين واجعلنا للمتقين إمامًا﴾.", "ref": "ص 4"}, {"q": "ما المقصود بالفتنة في قوله تعالى: ﴿إنما أموالكم وأولادكم فتنة﴾؟", "options": ["العذاب", "المنحة والجائزة", "الشر المحض", "الابتلاء والاختبار"], "answer": 3, "why": "المقصود أن المال والأولاد ابتلاء من الله للإنسان هل يقوم بما يجب عليه نحوهم أم لا، وليس المعنى أنهم شر.", "ref": "ص 5"}, {"q": "ما معنى «الهامّة» في حديث تعويذ الحسن والحسين؟", "options": ["كل ذات سم يقتل كالحيات والعقارب، وقد يراد بها كل ما يدب على الأرض ويؤذي", "الريح", "الطيور", "النباتات"], "answer": 0, "why": "الهامة يراد بها كل ذات سم يقتل كالحيات والعقارب، وقد يراد بها كل ما يدب على الأرض ويؤذي.", "ref": "ص 6"}, {"q": "ما الذي يستفاد من تعويذ النبي ﷺ الحسن والحسين؟", "options": ["أن التعويذ خاص بالأنبياء", "تعليق التمائم", "أن الرقية لا تكون إلا بعد المرض", "أن يعوّذ الوالد أولاده صباحًا ومساءً تحصينًا من العين والشياطين والهوام قبل وقوعها"], "answer": 3, "why": "ينبغي للوالد أن يعوذ أولاده صباحًا ومساء بهذه الكلمات ففيها تحصين ضد العين والشياطين والهوام قبل وقوعها.", "ref": "ص 6"}, {"q": "بماذا دعا النبي ﷺ لابن عباس حين وضع له وضوءه؟", "options": ["بالملك", "بالفقه في الدين", "بكثرة المال", "بطول العمر"], "answer": 1, "why": "لما وضع له ابن عباس وضوءه قال ﷺ: «من وضع هذا؟» ثم دعا له بالفقه في الدين، وفيه الدعاء للأولاد بالهداية والعلم.", "ref": "ص 6"}, {"q": "ما الآداب التي علّمها النبي ﷺ لعمر بن أبي سلمة حين كانت يده تطيش في الصحفة؟", "options": ["«يا غلام، سمّ الله، وكُل بيمينك، وكُل مما يليك»", "«كُل بيدك اليسرى»", "«لا تأكل مع الكبار»", "«كُل بسرعة»"], "answer": 0, "why": "قال ﷺ: «يا غلام سم الله، وكل بيمينك، وكل مما يليك»، وفيه تربية الأولاد على الآداب.", "ref": "ص 7"}, {"q": "إذا حضر جماعة الطعام وسمّى أحدهم دون الآخرين، فهل تسقط التسمية عن الآخرين؟", "options": ["لا تشرع التسمية", "تسقط عن الصغار فقط", "لا، فعلى كل واحد أن يسمّي", "نعم تسقط عن الجميع"], "answer": 2, "why": "العبارة خطأ؛ فالتسمية مشروعة لكل آكل، والشيطان يأكل مع من لم يسم كما في الحديث.", "ref": "ص 9"}]}, "s3": {"1": [{"q": "ما تعريف فقه الأسرة؟", "options": ["أحكام العبادات فقط", "قواعد التربية الحديثة", "مجموعة الأحكام التي تنظم العلاقات بين أفراد الأسرة الواحدة من بداية تكوينها إلى ما يطرأ عليها", "أحكام البيع والشراء"], "answer": 2, "why": "فقه الأسرة أحد فروع الفقه الإسلامي، وهو مجموعة الأحكام التي تنظم العلاقات بين أفراد الأسرة الواحدة.", "ref": "ص 2"}, {"q": "ما الاسم الآخر الذي يُطلق على فقه الأسرة؟", "options": ["فقه الأحوال الشخصية", "فقه المعاملات", "فقه الجنايات", "فقه العبادات"], "answer": 0, "why": "يطلق على هذا الباب من الفقه أيضًا «فقه الأحوال الشخصية».", "ref": "ص 3"}, {"q": "ما حكم تعلّم فقه الأسرة لمن تزوج أو أقبل على الزواج؟", "options": ["مباح", "مكروه", "مستحب", "فرض عين"], "answer": 3, "why": "تعلّم فقه الأسرة فرض عين على كل مسلم ومسلمة تزوجا أو أقبلا على الزواج، لأن أحكامه تمس حياتهما اليومية.", "ref": "ص 3"}, {"q": "من ثمار الوعي بفقه الأسرة:", "options": ["تعطيل الأدوار الشرعية", "زيادة الخلافات", "الاستغناء عن المودة", "الوقاية من موجات التغريب والتيارات المنحرفة التي تستهدف إضعاف روابط الأسرة"], "answer": 3, "why": "من ثمار فقه الأسرة الوقاية من موجات التغريب والتيارات التي تستهدف إضعاف روابط الأسرة ونشر المفاهيم الدخيلة.", "ref": "ص 4"}, {"q": "ما المعيار الذي جعله الإسلام أساس اختيار الزوج؟", "options": ["الجمال", "الجاه", "المال", "الدين والخلق"], "answer": 3, "why": "قال ﷺ: «إذا خطب إليكم من ترضون دينه وخلقه فزوجوه، إلا تفعلوا تكن فتنة في الأرض وفساد عريض».", "ref": "ص 5"}, {"q": "ليس من المعايير التي حددها النبي ﷺ لاختيار الزوج:", "options": ["لا شيء مما ذكر", "المال", "الدين", "الخلق"], "answer": 1, "why": "حدد النبي ﷺ معيار الدين والخلق في اختيار الزوج، وليس المال من معاييره.", "ref": "ص 8"}, {"q": "من حقوق الزوجة على زوجها:", "options": ["المهر والنفقة والمعاشرة بالمعروف", "أن تطيعه في المعصية", "لا حقوق لها", "أن يتصرف في مالها كما يشاء"], "answer": 0, "why": "من حقوق الزوجة المهر ﴿وآتوا النساء صدقاتهن نحلة﴾، والنفقة ﴿وعلى المولود له رزقهن وكسوتهن بالمعروف﴾، والمعاشرة بالمعروف.", "ref": "ص 6"}, {"q": "ما الذي يفيده عقد الزواج؟", "options": ["الإجارة", "نقل ملكية", "حل العشرة بين الرجل والمرأة وتعاونهما، ويحدد ما لكليهما من حقوق وما عليه من واجبات", "الشراكة التجارية"], "answer": 2, "why": "عقد الزواج عقد يفيد حل العشرة بين الرجل والمرأة وتعاونهما ويحدد حقوق كل منهما وواجباته.", "ref": "ص 8"}, {"q": "من حقوق الأولاد على والديهم:", "options": ["الإنفاق دون تربية", "التربية الإيمانية والأخلاقية كالأمر بالصلاة، والرعاية الشاملة", "تركهم لأنفسهم", "التفريق بينهم في العطايا"], "answer": 1, "why": "من حقوق الأولاد التربية الإيمانية والأخلاقية كأمرهم بالصلاة لسبع، والرعاية الشاملة لقوله ﷺ: «كلكم راع».", "ref": "ص 7"}, {"q": "قوامة الرجل على المرأة تحمل معاني منها:", "options": ["الإهمال", "التسلط فقط", "التحكم في عبادتها", "القيادة والرعاية والمسؤولية جميعًا"], "answer": 3, "why": "قوامة الرجل تحمل معاني كثيرة منها القيادة والرعاية والمسؤولية.", "ref": "ص 8"}], "2": [{"q": "ما حكم الزواج لمن ابتغى به وجه الله؟", "options": ["مباح لا ثواب فيه", "عادة اجتماعية فقط", "مكروه", "عبادة يُثاب عليها"], "answer": 3, "why": "الزواج عبادة خالصة يُثاب عليها من ابتغى بها وجه الله، وقد حث عليها الشرع في نصوص كثيرة.", "ref": "ص 2"}, {"q": "ما المقصد الأول من مقاصد الزواج؟", "options": ["تحقيق المكاسب المالية", "الشهرة الاجتماعية", "حفظ النسل وهو حفظ النوع الإنساني", "السفر"], "answer": 2, "why": "المقصد الأول حفظ النسل، أي حفظ النوع الإنساني لاستمرار العبادة، ولا سبيل لذلك إلا بالزواج الشرعي.", "ref": "ص 3"}, {"q": "مقصد حفظ النسل:", "options": ["خاص بالرجال", "يتعارض مع العفاف", "يعني حفظ النوع الإنساني، وهو من الضروريات التي جاءت الشريعة بحفظها، ومطلب فطري", "ليس من مقاصد الشريعة"], "answer": 2, "why": "حفظ النسل يعني حفظ النوع الإنساني، وهو من الضروريات التي اتفقت الشرائع على حفظها، ومطلب فطري.", "ref": "ص 10"}, {"q": "بماذا رغّب النبي ﷺ في الزواج في حديث أبي أمامة؟", "options": ["«الرهبانية أفضل»", "«الزواج للأغنياء»", "«لا تتزوجوا إلا بعد الأربعين»", "«تزوجوا فإني مكاثر بكم الأمم، ولا تكونوا كرهبانية النصارى»"], "answer": 3, "why": "قال ﷺ: «تزوجوا فإني مكاثر بكم الأمم ولا تكونوا كرهبانية النصارى».", "ref": "ص 4"}, {"q": "ما المقصد الثاني من مقاصد الزواج؟", "options": ["الهروب من المسؤولية", "حفظ العرض وصيانة العفاف بالطريق الشرعي لإشباع الغريزة", "زيادة الدخل", "إرضاء المجتمع"], "answer": 1, "why": "المقصد الثاني حفظ العرض وصيانة العفاف، فالزواج الطريق الشرعي الوحيد لإشباع الميل الفطري بين الذكر والأنثى.", "ref": "ص 4"}, {"q": "بأي آية عبّر القرآن عن مقصد السكن النفسي؟", "options": ["﴿فانكحوا ما طاب لكم من النساء﴾", "﴿وأنكحوا الأيامى منكم﴾", "﴿الرجال قوامون على النساء﴾", "﴿ومن آياته أن خلق لكم من أنفسكم أزواجًا لتسكنوا إليها وجعل بينكم مودة ورحمة﴾"], "answer": 3, "why": "عبّر القرآن عن مقصد السكن بقوله: ﴿ومن آياته أن خلق لكم من أنفسكم أزواجًا لتسكنوا إليها وجعل بينكم مودة ورحمة﴾.", "ref": "ص 5"}, {"q": "ما الذي يدل عليه حديث «رحم الله رجلًا قام من الليل فصلى وأيقظ امرأته»؟", "options": ["النهي عن إيقاظ النائم", "أن قيام الليل واجب", "أن ذلك خاص بالرجال", "تعاون الزوجين على الطاعة من مقاصد الزواج"], "answer": 3, "why": "الحديث يدل على أن من مقاصد الزواج تعاون الزوجين على الطاعة وإعانة كل منهما الآخر على الخير.", "ref": "ص 6"}, {"q": "من النيات الصالحة في الزواج:", "options": ["التفاخر أمام الناس", "التقليد", "تحقيق مصالح مادية فقط", "إعفاف النفس والزوج وصيانتهما عن الحرام، واتباع سنة النبي ﷺ"], "answer": 3, "why": "من النيات الصالحة أن ينوي بزواجه إعفاف نفسه وزوجه وصيانتهما عن الحرام، واتباع سنة النبي ﷺ.", "ref": "ص 7"}, {"q": "لماذا لا يُبنى الزواج على العواطف وحدها؟", "options": ["لأن العاطفة محرمة", "لأن العاطفة تتقلب وقد تخبو مع ضغوط الحياة، وإنما تستقيم الحياة بحسن العشرة والقيام بالمسؤوليات", "لأن العاطفة تزيد مع الوقت دائمًا", "لأن الزواج لا يحتاج عاطفة"], "answer": 1, "why": "العاطفة تتقلب وربما تخبو مع ضغوط الحياة، وإنما تستقيم الحياة بحسن العشرة ورعاية الحقوق، ومعها تنمو العواطف.", "ref": "ص 9"}, {"q": "رفض تزويج المرأة إذا وُجد الكفء المناسب لها يُعتبر شرعًا:", "options": ["لا حكم له", "أمرًا مستحبًّا", "فسادًا في الأرض", "حقًّا مطلقًا للولي"], "answer": 2, "why": "رفض تزويج المرأة من الكفء يعتبر فسادًا في الأرض، لقوله ﷺ: «إلا تفعلوا تكن فتنة في الأرض وفساد عريض».", "ref": "ص 10"}], "3": [{"q": "لماذا جاء الشرع بإرساء قواعد البيت المسلم وأسسه القيمية والسلوكية؟", "options": ["لأن البيت شأن خاص لا علاقة له بالأمة", "لتقليل عدد الأسر", "لزيادة الأعباء على الزوجين", "لعظم أهمية البيت المسلم في بناء الأمة وتخريج رجالها، وحمايته من المخاطر الهدامة"], "answer": 3, "why": "لما كان البيت المسلم عظيم الأهمية في بناء الأمة وتخريج رجالها، جاء الشرع بإرساء قواعده القيمية والسلوكية وحمايته.", "ref": "ص 3"}, {"q": "ما معنى المعاشرة بالمعروف كما فسّرها ابن كثير؟", "options": ["ترك النصح", "طيّبوا أقوالكم لهن وحسّنوا أفعالكم وهيئاتكم بحسب قدرتكم كما تحب ذلك منها", "توفير المال فقط", "السكوت عن كل شيء"], "answer": 1, "why": "قال ابن كثير: طيبوا أقوالكم لهن وحسنوا أفعالكم وهيئاتكم بحسب قدرتكم، كما تحب ذلك منها فافعل أنت بها مثله.", "ref": "ص 4"}, {"q": "ما فكرة نشاط «هل جزاء الإحسان إلا الإحسان»؟", "options": ["تعداد أخطاء الزوج", "تحديد ثلاثة أفعال يحسن بها الزوج أو الولي، وصياغة رسالة شكر لكل منها", "كتابة قائمة طلبات", "مقارنة الزوج بغيره"], "answer": 1, "why": "يطلب النشاط تحديد ثلاثة أفعال يحسن بها إليكِ زوجك أو وليك، وصياغة رسالة شكر لكل فعل مجازاةً للإحسان.", "ref": "ص 5"}, {"q": "لماذا كان اختيار الزوج الصالح والزوجة الصالحة من الأسس السلوكية لقيام البيوت؟", "options": ["لأن الجمال يكفي", "لأن الزوج الفاسد يهدم ولا يبني، و«خير متاع الدنيا المرأة الصالحة»", "لأن الصلاح غير مؤثر", "لأن المال أهم"], "answer": 1, "why": "لا بد أن يراعي المقبل على الزواج الصلاح، لأن الفاسد يهدم ولا يبني، وقد قال ﷺ: «الدنيا متاع وخير متاعها المرأة الصالحة».", "ref": "ص 6"}, {"q": "من أعظم الناس حقًّا على المرأة كما في حديث عائشة رضي الله عنها؟", "options": ["أمها", "زوجها", "أخوها", "أبوها"], "answer": 1, "why": "سألت عائشة النبي ﷺ: أي الناس أعظم حقًا على المرأة؟ قال: «زوجها».", "ref": "ص 7"}, {"q": "ما الأساس السلوكي الثالث لقيام البيوت؟", "options": ["السفر المستمر", "جمع المال", "كثرة الأثاث", "التربية الصالحة للأولاد على الإيمان والأخلاق الإسلامية"], "answer": 3, "why": "من الأسس السلوكية التربية الصالحة للأولاد، فعلى الوالدين تربيتهم على الإيمان وتعويدهم الأخلاق الإسلامية: «كلكم راع».", "ref": "ص 8"}, {"q": "ما أثر التقوى في نجاح الأسرة كما بيّنت المحاضرة؟", "options": ["تضعف الروابط", "التقوى أمان عظيم وحصن حصين للذرية، كما في قوله تعالى: ﴿وليخش الذين لو تركوا من خلفهم ذرية ضعافًا﴾", "تخص الفرد دون أسرته", "لا أثر لها"], "answer": 1, "why": "التقوى أمان عظيم وحصن حصين للذرية، وقد افتتح الله سورة النساء بالأمر بالتقوى قبل تفصيل أحكام الأسرة.", "ref": "ص 9"}, {"q": "ما المبدأ الإيماني الذي منع ابنة بائعة اللبن من خلط اللبن بالماء؟", "options": ["طاعة ولي الأمر فقط", "خشيتها من رب العالمين ولو لم يعلم بمعصيتها البشر", "خوفها من عمر بن الخطاب", "خوفها من أمها"], "answer": 1, "why": "قالت لأمها: والله ما كنت لأطيعه في الملأ وأعصيه في الخلاء، فكانت خشيتها من الله وإن لم يرها أحد.", "ref": "ص 12"}, {"q": "ماذا كانت نتيجة قصة ابنة بائعة اللبن؟", "options": ["لم يُعرف عنها شيء", "طردها من المدينة", "زوّجها عمر لابنه عاصم، فكان من نسلها عمر بن عبد العزيز", "عاقبها عمر"], "answer": 2, "why": "أعجب عمر بتقواها فزوجها ابنه عاصمًا، فكان من ذريتها عمر بن عبد العزيز، وهذا من بركة التقوى في الذرية.", "ref": "ص 10"}, {"q": "كيف عرّف الغزالي المعاشرة بالمعروف للزوجة؟", "options": ["التغافل عن أخطائها وعدم نصحها", "ترك الحوار", "احتمال الأذى منها والحلم عن طيشها وغضبها اقتداءً برسول الله ﷺ", "التوسعة في النفقة فقط"], "answer": 2, "why": "عرّفها الغزالي بأنها احتمال الأذى منها والحلم عن طيشها وغضبها اقتداء برسول الله ﷺ.", "ref": "ص 11"}], "4": [{"q": "ما المحرمات على التأبيد من النساء؟", "options": ["المطلقات", "اللاتي يحرمن لمدة محددة", "المتزوجات فقط", "اللاتي سبب تحريمهن وصف غير قابل للزوال: بالنسب والمصاهرة والرضاع"], "answer": 3, "why": "المحرمات على التأبيد من يكون سبب تحريمهن وصفًا غير قابل للزوال، وهن ثلاثة أنواع: بالنسب والمصاهرة والرضاع.", "ref": "ص 3"}, {"q": "متى تحرم أم الزوجة؟", "options": ["بعد الدخول بالبنت فقط", "لا تحرم", "بعد الطلاق", "بمجرد العقد على البنت"], "answer": 3, "why": "أم الزوجة وجداتها تحرم بمجرد العقد على البنت، لقوله تعالى: ﴿وأمهات نسائكم﴾.", "ref": "ص 4"}, {"q": "ما القاعدة الفقهية التي تفرق بين تحريم أم الزوجة وتحريم الربيبة؟", "options": ["العقد على الأمهات يحرم البنات", "لا فرق بينهما", "الدخول بالبنات يحرم الأمهات فقط", "العقد على البنات يحرم الأمهات، والدخول بالأمهات يحرم البنات"], "answer": 3, "why": "القاعدة: العقد على البنات يحرم الأمهات، والدخول بالأمهات يحرم البنات.", "ref": "ص 14"}, {"q": "من المحرمات بالرضاع: العمة من الرضاع، وهي:", "options": ["زوجة الأخ", "أخت الزوج", "التي رضعت مع الأب", "التي رضعت مع الأم"], "answer": 2, "why": "العمة من الرضاع هي التي رضعت مع الأب، والخالة من الرضاع هي التي رضعت مع الأم.", "ref": "ص 5"}, {"q": "لماذا حرّم الجمع بين الأختين؟", "options": ["لأنه يزيد النفقة", "لأنه يخالف العرف فقط", "لأن الجمع بينهما يؤدي إلى العداوة وقطع الرحم", "لا علة لذلك"], "answer": 2, "why": "قال الشيرازي: لأن الجمع بينهما يؤدي إلى العداوة وقطع الرحم، ويبطل العقد إذا جمع بينهما في عقد واحد.", "ref": "ص 7"}, {"q": "ما حكم الجمع بين المرأة وعمتها أو خالتها؟", "options": ["محرم لأنه يزرع الغيرة المؤذية ويحول الأخوة إلى قطيعة", "جائز", "مكروه فقط", "جائز بإذن الزوجة الأولى"], "answer": 0, "why": "الجمع بين المرأة وعمتها أو خالتها محرم، لأنه يزرع الغيرة التي تفسد المودة وتحول الأخوة إلى قطيعة.", "ref": "ص 11"}, {"q": "من المحرمات على التأقيت:", "options": ["الزيادة على أربع زوجات، والمرأة ذات الزوج", "البنت", "الأخت من الرضاع", "الأم"], "answer": 0, "why": "من المحرمات على التأقيت الجمع بين الأختين، والزيادة على الأربع، والمرأة ذات الزوج حتى تفارقه وتنقضي عدتها.", "ref": "ص 10"}, {"q": "ما الحكمة من تحريم ذات الزوج؟", "options": ["حفظ الأنساب ومنع اختلاطها", "زيادة العداوة", "لا حكمة لذلك", "منع الزواج عمومًا"], "answer": 0, "why": "من مقاصد التحريم حفظ الأنساب ومنع الاشتباه، فالمرأة ذات الزوج محرمة على غيره.", "ref": "ص 11"}, {"q": "من آثار الاختلاط المحرم على المجتمع:", "options": ["تقوية الأسر", "تنامي ظواهر مثل الزواج العرفي والتفكك الأسري وضعف المجتمعات", "زيادة الترابط", "انتشار العفاف"], "answer": 1, "why": "من عواقب الاختلاط تنامي ظواهر الزواج العرفي والتفكك الأسري وضعف المجتمعات.", "ref": "ص 13"}, {"q": "من وسائل حماية النفس والأهل من خطر الاختلاط:", "options": ["لزوم المرأة بيتها إلا لحاجة، والخروج بلا فتنة، وغض البصر", "ترك غض البصر", "الخروج المستمر بزينة", "التساهل في الحديث مع الأجانب"], "answer": 0, "why": "على المسلم أن يحمي نفسه وأهله بلزوم المرأة بيتها إلا لحاجة، وألا تخرج على حال تثير الفتنة، والحرص على غض البصر.", "ref": "ص 13"}], "5": [{"q": "ما تعريف الخِطبة؟", "options": ["تسليم المهر", "عقد الزواج نفسه", "التماس الخاطب النكاح من جهة المخطوبة", "الوليمة"], "answer": 2, "why": "الخطبة -بكسر الخاء- التماس الخاطب النكاح من جهة المخطوبة، أي إظهار رغبته في الزواج من امرأة معينة خالية من الموانع.", "ref": "ص 2"}, {"q": "أي العبارات تمثل الخطبة الصريحة؟", "options": ["التصريح بالرغبة في الزواج من فتاة معينة، كقوله: أريد الزواج من فلانة", "قوله: إنك جديرة بالزواج", "السؤال عن الفتيات عمومًا", "قوله: أبحث عن فتاة لائقة"], "answer": 0, "why": "الخطبة الصريحة أن يقول الرجل: أريد الزواج من فلانة، أما التعريض فما يُفهم ضمنًا.", "ref": "ص 2"}, {"q": "ما المقصود بالخطبة بالتعريض؟", "options": ["التصريح باسم المخطوبة", "إبرام العقد", "دفع المهر", "التعبير عن الرغبة بما يُفهم ضمنًا دون تصريح، كقوله: إنك جديرة بالزواج"], "answer": 3, "why": "الخطبة بالتعريض أو القرائن ما يفهم ضمنًا، كأن يقول للمرأة: إنك جديرة بالزواج، أو أبحث عن فتاة مثلك.", "ref": "ص 2"}, {"q": "من مقاصد تشريع الخطبة:", "options": ["تأجيل الزواج", "التعارف المنضبط واختبار التوافق في القيم والطباع تحت إشراف الأهل", "إباحة الخلوة", "إقامة علاقة عاطفية"], "answer": 1, "why": "من مقاصد الخطبة إتاحة التعارف المنضبط واختبار التوافق في القيم والطباع، تحت إشراف الأهل وبقدر الحاجة.", "ref": "ص 3"}, {"q": "ما المأذون بالنظر إليه من المخطوبة؟", "options": ["الشعر فقط", "لا يجوز النظر", "جميع البدن", "الوجه والكفان"], "answer": 3, "why": "المأذون به في النظر الوجه والكفان؛ فالوجه يدل على الجمال والكفان يدلان على خصوبة البدن.", "ref": "ص 4"}, {"q": "لماذا يُحذَّر من الارتباط العاطفي قبل العقد؟", "options": ["لأنه مستحب", "لأنه لا يؤثر", "لأنه محرم ويعرض المخطوبة لضرر بالغ في سمعتها إن فُسخت الخطبة", "لأنه يقوي العلاقة"], "answer": 2, "why": "السعي للارتباط العاطفي قبل العقد محرم، ويلحق بالمخطوبة ضررًا بالغًا في سمعتها إن فسخت الخطبة فيتردد الخاطبون.", "ref": "ص 5"}, {"q": "ما حكم خطبة الرجل على خطبة أخيه؟", "options": ["منهي عنها", "جائزة", "جائزة إذا كان أغنى", "مستحبة"], "answer": 0, "why": "من المحظورات تقدم غير الخاطب لخطبة المخطوبة، لنهي النبي ﷺ أن يخطب الرجل على خطبة أخيه.", "ref": "ص 5"}, {"q": "ما الذي يميز الخطبة عن عقد الزواج؟", "options": ["أن الخطبة تسقط أحكام الأجنبية", "أن الخطبة وعد بالزواج وليست عقدًا ملزمًا", "لا فرق بينهما", "أن الخطبة تثبت جميع حقوق الزوجية"], "answer": 1, "why": "الخطبة وعد بالزواج لا عقد، فيجوز لكلا الطرفين الرجوع عنها إذا وجد ما يدعو لذلك.", "ref": "ص 6"}, {"q": "إذا دفع الخاطب المهر أو جزءًا منه ثم فُسخت الخطبة، فما الحكم؟", "options": ["له الحق في استرداد ما دفعه، فإن صُرف استرد مثله أو قيمته", "يذهب للمخطوبة", "لا يسترد شيئًا", "يسترد نصفه"], "answer": 0, "why": "إذا فُسخت الخطبة فللخاطب استرداد ما دفعه من المهر، وإن صرفته المخطوبة استرد مثله أو قيمته.", "ref": "ص 6"}, {"q": "ما حكم اتخاذ الدبلة في الخطبة كما بيّنت المحاضرة؟", "options": ["واجبة", "شرط لصحة الخطبة", "سنة مؤكدة", "ليست من سنن الخطبة، ويجب اجتناب ما يرتبط بها من اعتقادات باطلة، ولا يُلبسها الخاطب مخطوبته قبل العقد"], "answer": 3, "why": "اتخاذ الدبلة ليس من سنن الخطبة، ويجتنب اعتقاد أن بقاءها سبب لدوام المودة، ولا يلبسها الخاطب لمخطوبته قبل العقد.", "ref": "ص 7"}], "6": [{"q": "ما معنى النكاح في اللغة؟", "options": ["الوصية", "العقد فقط", "الهبة", "الضم والجمع"], "answer": 3, "why": "النكاح لغةً الضم والجمع، يقال: تناكحت الأشجار إذا تمايلت وانضم بعضها إلى بعض.", "ref": "ص 2"}, {"q": "ما تعريف النكاح شرعًا؟", "options": ["وصية", "عقد بيع", "هبة", "عقد يتضمن إباحة استمتاع كل من الزوجين بالآخر على الوجه المشروع"], "answer": 3, "why": "النكاح شرعًا عقد يتضمن إباحة استمتاع كل من الزوجين بالآخر على الوجه المشروع.", "ref": "ص 2"}, {"q": "ما أركان عقد النكاح؟", "options": ["المهر والوليمة", "الخطبة والمهر", "الشهود فقط", "الصيغة والزوجة والزوج والولي"], "answer": 3, "why": "أركان النكاح أربعة: الصيغة (الإيجاب والقبول)، والزوجة، والزوج، والولي.", "ref": "ص 2"}, {"q": "ما حكم المرأة التي نكحت بغير إذن وليها؟", "options": ["يصح إذا رضيت", "نكاحها باطل، فإن دخل بها فلها مهر المثل بما استحل من فرجها", "نكاحها صحيح", "نكاحها مكروه فقط"], "answer": 1, "why": "قال ﷺ: «أيما امرأة نكحت بغير إذن وليها فنكاحها باطل... فإن دخل بها فلها المهر بما استحل من فرجها».", "ref": "ص 3"}, {"q": "ما نكاح الشغار؟", "options": ["الزواج بغير ولي", "زواج المسافر", "الزواج المؤقت", "أن يزوج الرجل ابنته على أن يزوجه الآخر ابنته، وليس بينهما صداق"], "answer": 3, "why": "نكاح الشغار أن يقول الولي: زوجتك ابنتي على أن تزوجني ابنتك، وليس بينهما صداق، بل بضع كل واحدة مهر الأخرى.", "ref": "ص 3"}, {"q": "من الحقوق المشتركة بين الزوجين:", "options": ["حل الاستمتاع، والمعاشرة بالمعروف", "النفقة", "المهر", "حق التأديب"], "answer": 0, "why": "من الحقوق المشتركة حل استمتاع كل من الزوجين بالآخر، والمعاشرة بالمعروف من الصحبة الجميلة وكف الأذى.", "ref": "ص 4"}, {"q": "متى يجب الكف عن تأديب الزوجة؟", "options": ["إذا تحققت الطاعة، لقوله تعالى: ﴿فإن أطعنكم فلا تبغوا عليهن سبيلًا﴾", "بعد الضرب مباشرة", "عند السفر", "لا يجب الكف أبدًا"], "answer": 0, "why": "للزوج حق التأديب عند النشوز بالوعظ ثم الهجر ثم الضرب بضوابطه، فإن تحققت الطاعة وجب الكف.", "ref": "ص 5"}, {"q": "ما حقوق الزوجة غير المالية؟", "options": ["إحسان العشرة والمعاملة الطيبة والعدل", "السكن", "المهر", "النفقة"], "answer": 0, "why": "للزوجة حقوق مالية هي المهر والنفقة، وحقوق غير مالية هي إحسان العشرة والمعاملة الطيبة والعدل.", "ref": "ص 6"}, {"q": "إذا كان للرجل أكثر من زوجة، فما الواجب عليه؟", "options": ["التفضيل", "التفويض", "العدل بينهن في المبيت والنفقة", "التخيير"], "answer": 2, "why": "يجب على من له أكثر من زوجة العدل بين النسوة في المبيت والنفقة.", "ref": "ص 6"}, {"q": "من السنن المتعلقة بالزواج:", "options": ["ترك الإعلان", "الوليمة وإعلان النكاح بالضرب بالدف", "تأخير المهر دائمًا", "كتمان العقد"], "answer": 1, "why": "سن الإسلام وليمة الزواج شكرًا لله، وأباح إظهار الفرح بالضرب على الدف والغناء المناسب لإعلان النكاح.", "ref": "ص 7"}], "7": [{"q": "من هما العاقدان في عقد الزواج؟", "options": ["الزوجة والشهود", "الزوج والولي", "الولي والشاهدان", "الزوج والزوجة فقط"], "answer": 1, "why": "أركان العقد الصيغة والزوجة والزوج والولي، والزوج والولي هما العاقدان، والمعقود عليه الاستمتاع.", "ref": "ص 2"}, {"q": "ما حكم المهر والشهود في عقد النكاح؟", "options": ["شرطان، وجعلهما ركنًا مجرد اصطلاح لبعض الفقهاء", "ركنان أساسيان باتفاق", "لا علاقة لهما بالعقد", "مستحبان"], "answer": 0, "why": "المهر والشهود شرطان في النكاح، وجعلهما ركنًا مجرد اصطلاح لبعض الفقهاء.", "ref": "ص 2"}, {"q": "ما المقصود بالصيغة في عقد النكاح؟", "options": ["الإيجاب والقبول الدالان على الرضا بالزواج", "المهر والشهود", "موافقة أهل الزوجة", "حضور الزوج والولي"], "answer": 0, "why": "الصيغة هي الإيجاب والقبول، كقول الولي: «زوجتك ابنتي» وقول الزوج: «قبلت».", "ref": "ص 11"}, {"q": "ما الحكمة من تشريع الصيغة؟", "options": ["أن الرضا أمر خفي، فاعتبر الشرع الصيغة دليلًا ظاهرًا عليه", "التطويل في العقد", "إظهار الفصاحة", "لا حكمة لها"], "answer": 0, "why": "لما كان عقد الزواج لا بد فيه من رضا العاقدين، والرضا أمر خفي، اعتبر الشرع الصيغة دليلًا ظاهرًا عليه.", "ref": "ص 3"}, {"q": "بأي لفظ يصح عقد النكاح عند الشافعية كما في المحاضرة؟", "options": ["بالإشارة مع القدرة على النطق", "بالكتابة فقط", "بأي لفظ كالهبة والبيع", "بلفظ التزويج أو الإنكاح وما يشتق منهما"], "answer": 3, "why": "يشترط أن تكون الصيغة بلفظ التزويج أو الإنكاح وما يشتق منهما لأنهما الواردان في القرآن.", "ref": "ص 4"}, {"q": "ما معنى الولاية شرعًا؟", "options": ["تنفيذ القول على الغير والإشراف على شؤونه", "التملك", "الوصاية على المال فقط", "المحبة فقط"], "answer": 0, "why": "الولاية لغةً المحبة والنصرة، وشرعًا تنفيذ القول على الغير والإشراف على شؤونه.", "ref": "ص 5"}, {"q": "من شروط الولي في النكاح:", "options": ["الغنى", "الإسلام والعدالة، فلا يزوج الكافر المسلمة", "أن يكون متزوجًا", "أن يكون أكبر الأقارب سنًا فقط"], "answer": 1, "why": "يشترط في الولي الإسلام لقوله تعالى: ﴿ولن يجعل الله للكافرين على المؤمنين سبيلًا﴾، والعدالة وغيرهما.", "ref": "ص 6"}, {"q": "من شروط شهود النكاح:", "options": ["أن يكونوا أغنياء", "أن يكونوا من أقارب الزوجة فقط", "الحرية والذكورة والعدالة والسمع والبصر، وألا يكون الولي المتعين شاهدًا", "لا شروط لهم"], "answer": 2, "why": "يشترط في الشهود الحرية والذكورة والعدالة والسمع والبصر، وكون الشاهد غير الولي المتعين.", "ref": "ص 7"}, {"q": "ما أثر الزواج الباطل؟", "options": ["يثبت به النسب والعدة", "يُعتبر صحيحًا بعد الدخول", "تترتب عليه جميع الحقوق", "لا يترتب عليه أثر من آثار الزواج الصحيح ولو بعد الدخول، ويُعتبر في منزلة العدم"], "answer": 3, "why": "الزواج الباطل لا يترتب عليه أثر من آثار الزواج الصحيح ولو بعد الدخول، فلا يثبت به النسب ولا تجب العدة.", "ref": "ص 8"}, {"q": "متى يسقط خيار الفسخ بالعيب؟", "options": ["إذا أمكن إزالة العيب بالعلاج وزال فعلًا", "لا يسقط أبدًا", "إذا رضي الولي فقط", "بعد سنة من الزواج"], "answer": 0, "why": "إذا أمكن إزالة العيب كالرتق بعملية أو زال الجنون والبرص بالتداوي سقط حق الفسخ لزوال المقتضي.", "ref": "ص 10"}], "8": [{"q": "ما تعريف الصداق؟", "options": ["الهدية من أهل الزوجة", "الوليمة", "المال الذي وجب على الزوج دفعه لزوجته بسبب عقد النكاح", "نفقة الأولاد"], "answer": 2, "why": "الصداق المال الذي وجب على الزوج دفعه لزوجته بسبب عقد النكاح، وسمي صداقًا لإشعاره بصدق رغبة باذله.", "ref": "ص 2"}, {"q": "كم عدد أسماء المهر التي ذكرتها المحاضرة؟", "options": ["اسمان", "سبعة أسماء", "ثلاثة أسماء", "عشرة أسماء"], "answer": 1, "why": "للمهر سبعة أسماء منها الصداق والنحلة والأجر والفريضة.", "ref": "ص 3"}, {"q": "ما حكم تسمية المهر في العقد؟", "options": ["تسن تسميته لأن النبي ﷺ لم يخل نكاحًا عنه، ولأنه أدفع للخصومة", "محرمة", "واجبة لصحة العقد", "مكروهة"], "answer": 0, "why": "تسن تسمية المهر في العقد لأن النبي ﷺ لم يخل نكاحًا عنه، ولأنه أدفع للخصومة.", "ref": "ص 4"}, {"q": "هل للمهر حد أقصى؟", "options": ["يجب أن يكون كبيرًا", "نعم، حدده الشرع", "حده ما يعادل نفقة سنة", "لا، ويسن تخفيفه وعدم المغالاة فيه"], "answer": 3, "why": "ليس للمهر حد أقصى لقوله تعالى: ﴿وآتيتم إحداهن قنطارًا﴾، ويسن تخفيفه وعدم المغالاة فيه.", "ref": "ص 4"}, {"q": "ما المهر المسمى؟", "options": ["ما سُمي واتُّفق عليه صراحة في العقد أو فُرض بعده بالتراضي أو فرضه الحاكم", "هدايا الخطبة", "مهر نساء العائلة", "النفقة الشهرية"], "answer": 0, "why": "المهر المسمى ما سمي واتفق عليه صراحة في العقد، أو فرض للزوجة بعده بالتراضي، أو فرضه الحاكم.", "ref": "ص 5"}, {"q": "بماذا يُقاس مهر المثل؟", "options": ["بعدد الأولاد", "بدين الزوج", "بالسن والبكارة والثيوبة ونحوها من صفات المرأة مقارنةً بنظيراتها", "بمال الزوج فقط"], "answer": 2, "why": "يقاس مهر المثل باعتبار صفات المرأة كالسن والبكارة والثيوبة مقارنة بمثيلاتها.", "ref": "ص 9"}, {"q": "متى يكون للزوجة الحق في حبس نفسها عن زوجها حتى تقبض مهرها؟", "options": ["إذا أغضبها زوجها", "إذا كان مؤجلًا", "إذا كان المهر معجّلًا", "في كل حال"], "answer": 2, "why": "إذا كان المهر معجلًا فلها حبس نفسها حتى تقبضه، أما إذا كان مؤجلًا فلا حق لها لأنها رضيت بالتأجيل.", "ref": "ص 6"}, {"q": "ما شرط تأجيل المهر؟", "options": ["أن يكون الأجل محددًا", "لا يجوز تأجيله", "إذن القاضي", "ألا يزيد على شهر"], "answer": 0, "why": "يصح تعجيل المهر وتأجيله كله أو بعضه، بشرط أن يكون الأجل محددًا، لأن المهر ملك الزوجة.", "ref": "ص 6"}, {"q": "ما أسباب وجوب النفقة على الإنسان لغيره؟", "options": ["لا تجب نفقة لغير النفس", "الزمالة في العمل", "الزوجية والقرابة الخاصة والملك", "الصداقة والجوار"], "answer": 2, "why": "النفقة لغير الإنسان أسباب وجوبها ثلاثة: الزوجية والقرابة الخاصة والملك.", "ref": "ص 7"}, {"q": "بمن أمر النبي ﷺ أن يبدأ الإنسان في النفقة؟", "options": ["«ابدأ بنفسك فتصدق عليها، فإن فضل شيء فلأهلك، ثم لذي قرابتك»", "بالأصدقاء", "بالفقراء قبل الأهل", "بالأبعد ثم الأقرب"], "answer": 0, "why": "قال ﷺ: «ابدأ بنفسك فتصدق عليها، فإن فضل شيء فلأهلك، فإن فضل عن أهلك شيء فلذي قرابتك».", "ref": "ص 7"}], "9": [{"q": "ما تعريف الطلاق شرعًا؟", "options": ["تأجيل الزواج", "حل عقدة النكاح بلفظ الطلاق ونحوه", "ترك المبيت", "فسخ الخطبة"], "answer": 1, "why": "الطلاق لغةً الحل والانحلال، وشرعًا حل عقدة النكاح بلفظ الطلاق ونحوه.", "ref": "ص 2"}, {"q": "ما الأصل في الزواج، وماذا قال النبي ﷺ عن الطلاق؟", "options": ["الأصل استمرار الحياة الزوجية، و«أبغض الحلال إلى الله الطلاق»", "الأصل الطلاق عند أدنى خلاف", "لا أصل في ذلك", "الطلاق مستحب"], "answer": 0, "why": "الأصل في الزواج استمرار الحياة الزوجية، وفي الحديث: «أبغض الحلال إلى الله تعالى الطلاق».", "ref": "ص 2"}, {"q": "الطلاق الواقع في الحيض يسمى:", "options": ["رجعيًّا دائمًا", "بدعيًّا", "سنيًّا", "بائنًا"], "answer": 1, "why": "الطلاق في الحيض أو في طهر جامعها فيه طلاق بدعي، والسني ما كان في طهر لم يجامعها فيه.", "ref": "ص 3"}, {"q": "ما المستحب لمن طلق زوجته طلاقًا بدعيًّا كما في حديث ابن عمر؟", "options": ["أن يطلقها ثانية فورًا", "لا شيء عليه", "أن يراجعها ثم يتركها حتى تحيض وتطهر، ثم إن شاء أمسك وإن شاء طلق", "أن يتركها بلا مراجعة"], "answer": 2, "why": "يستحب له أن يراجعها ثم يتركها حتى تحيض ثم تطهر ثم تحيض، فإذا طهرت فإن شاء طلق وإن شاء أمسك.", "ref": "ص 4"}, {"q": "إذا طلق الرجل زوجته طلقة واحدة وله حق مراجعتها في العدة فهو:", "options": ["طلاق بائن", "خلع", "بدعي", "طلاق رجعي"], "answer": 3, "why": "الطلاق الرجعي ما يملك فيه الزوج مراجعة زوجته أثناء العدة دون عقد جديد.", "ref": "ص 9"}, {"q": "ما البينونة الكبرى؟", "options": ["الخلع", "الطلقة الأولى", "انتهاء العدة من الطلقة الأولى", "الطلاق المكمل للثلاث، فلا تحل له حتى تنكح زوجًا غيره نكاحًا شرعيًا"], "answer": 3, "why": "البينونة الكبرى بالطلقة الثالثة، فلا تحل له حتى تنكح زوجًا غيره نكاحًا شرعيًا دائمًا ويدخل بها.", "ref": "ص 5"}, {"q": "متى يقع الطلاق المعلق بشرط؟", "options": ["لا يقع أبدًا", "فور التلفظ", "عند تحقق الشرط", "بعد سنة"], "answer": 2, "why": "الطلاق المعلق بصفة أو شرط يقع عند تحقق الشرط.", "ref": "ص 9"}, {"q": "من آداب الطلاق في الإسلام:", "options": ["الطلاق ثلاثًا دفعة واحدة", "الإضرار بالزوجة", "رعاية المصلحة في إيقاعه بعد التروي والتحاكم إلى حكمين", "إخراجها من البيت فورًا"], "answer": 2, "why": "من آداب الطلاق رعاية المصلحة بعد التروي والتحاكم إلى حكمين من أهله وأهلها لعلهما يصلحان.", "ref": "ص 6"}, {"q": "لماذا عدّ ابن القيم إيقاع الطلاق الثلاث دفعة واحدة مخالفًا لكتاب الله؟", "options": ["لأنه أفضل أنواع الطلاق", "لأنه خالف قوله تعالى: ﴿الطلاق مرتان﴾ والمرتان تكون مرة بعد مرة", "لأنه لا يقع أصلًا", "لأنه يحتاج قاضيًا"], "answer": 1, "why": "قال ابن القيم: إيقاع الثلاث دفعة مخالف لقوله تعالى: ﴿الطلاق مرتان﴾، والمرتان في اللغة مرة بعد مرة.", "ref": "ص 7"}, {"q": "من آثار الطلاق على الأسرة:", "options": ["زيادة المودة", "استقرار الأولاد", "تشتت الأسرة والتباغض بين الأسرتين وتأثر الأولاد", "قوة الروابط"], "answer": 2, "why": "من آثار الطلاق تشتت الأسرة، والتباغض بين الأسرتين، وتأثر الأولاد بسماع الإساءات وكثرة الخصومات.", "ref": "ص 8"}], "10": [{"q": "ما المسائل التي سماها العلماء «مشبهات الطلاق»؟", "options": ["الخطبة والعقد", "الخلع والفسخ والعدة", "النفقة والحضانة", "الإيلاء والظهار واللعان"], "answer": 3, "why": "من المسائل التي تشبه الطلاق في نتائجها أو قد تؤول إليه ثلاث سماها العلماء مشبهات الطلاق: الإيلاء والظهار واللعان.", "ref": "ص 2"}, {"q": "ما الإيلاء اصطلاحًا؟", "options": ["تشبيه الزوجة بمحرمة", "اتهام الزوجة بالزنا", "حلف الزوج على ترك جماع زوجته مطلقًا أو مدة تزيد على أربعة أشهر", "امتناع الزوجة عن الطاعة"], "answer": 2, "why": "الإيلاء لغةً الحلف، واصطلاحًا حلف زوج يصح طلاقه ألا يجامع زوجته مطلقًا أو مدة تزيد على أربعة أشهر.", "ref": "ص 3"}, {"q": "ما صورة الظهار الأصلية؟", "options": ["أن يطلقها ثلاثًا", "أن يحلف ألا يقربها", "أن يقول الزوج لزوجته: أنت عليّ كظهر أمي", "أن يتهمها بالزنا"], "answer": 2, "why": "الظهار مأخوذ من الظهر، وصورته الأصلية أن يقول الزوج لزوجته: أنت علي كظهر أمي.", "ref": "ص 4"}, {"q": "ما حكم الظهار؟", "options": ["جائز إذا لم يقصد الطلاق", "مكروه فقط", "حرام بالإجماع وكبيرة من الكبائر", "مباح عند الغضب"], "answer": 2, "why": "الظهار حرام بالإجماع وكبيرة من الكبائر لقوله تعالى: ﴿وإنهم ليقولون منكرًا من القول وزورًا﴾.", "ref": "ص 4"}, {"q": "في أي امرأة نزلت آيات الظهار في أول سورة المجادلة؟", "options": ["زينب بنت جحش", "عائشة رضي الله عنها", "خولة بنت ثعلبة التي ظاهر منها زوجها فجاءت تشتكي إلى الله", "أم سلمة"], "answer": 2, "why": "نزلت في التي ظاهر منها زوجها فجاءت تشتكي إلى الله: ﴿قد سمع الله قول التي تجادلك في زوجها وتشتكي إلى الله﴾.", "ref": "ص 5"}, {"q": "متى يجب على الزوج أن ينفي الولد باللعان؟", "options": ["إذا اختلف معها في النفقة", "لا يجب أبدًا", "إذا حملت زوجته بولد وهو يعلم أنه ليس منه، لأن استلحاق من ليس منه حرام", "إذا كان الولد أنثى"], "answer": 2, "why": "إذا حملت الزوجة بولد والزوج يعلم أنه ليس منه وجب عليه نفيه باللعان، لأن استلحاق من ليس منه حرام.", "ref": "ص 6"}, {"q": "ما أقل مدة للحمل؟", "options": ["أربعة أشهر", "ستة أشهر", "سنة", "تسعة أشهر"], "answer": 1, "why": "من طرق علم الزوج أن الولد ليس منه أن تأتي به لدون ستة أشهر من الوطء، وهي أقل مدة للحمل.", "ref": "ص 6"}, {"q": "في أي حالة يشرع اللعان؟", "options": ["إذا رفضت الانتقال لبيته", "إذا اختلفا في النفقة", "إذا امتنع عن الصيام", "إذا اتهم الزوج زوجته بالزنا ولم يكن له شهود"], "answer": 3, "why": "يشرع اللعان إذا رمى الزوج زوجته بالزنا ولم يكن له شهداء إلا نفسه، كما في آيات سورة النور.", "ref": "ص 11"}, {"q": "من شروط صحة اللعان:", "options": ["تبديل الألفاظ بما يناسب", "أن تبدأ الزوجة", "تقدم القذف، وتقدم لعان الزوج على لعان الزوجة، والالتزام بنص الكلمات الواردة والموالاة بينها", "أن يكون بلا حاكم"], "answer": 2, "why": "من شروط اللعان تقدم القذف، وتقدم لعان الزوج، والتزام نص الكلمات الواردة، والموالاة بين الشهادات الخمس.", "ref": "ص 8"}, {"q": "ما عدة المتوفى عنها زوجها إذا كانت غير حامل؟", "options": ["ثلاثة قروء", "أربعة أشهر وعشرة أيام", "حتى تضع حملها", "ثلاثة أشهر"], "answer": 1, "why": "عدة المتوفى عنها غير الحامل أربعة أشهر وعشرة أيام لقوله تعالى: ﴿يتربصن بأنفسهن أربعة أشهر وعشرًا﴾.", "ref": "ص 9"}], "11": [{"q": "لماذا تجب النفقة للمعتدة من طلاق رجعي على زوجها؟", "options": ["لاحتباسها لحقه، فتجب لها النفقة كاملة كنفقة الزوجة", "لا تجب لها نفقة", "تبرعًا منه", "لأنها مطلقة بائنًا"], "answer": 0, "why": "المعتدة من طلاق رجعي تجب لها النفقة كاملة أثناء العدة كنفقة الزوجة تمامًا، لاحتباسها لحقه.", "ref": "ص 2"}, {"q": "يدخل في نفقة المعتدة من طلاق رجعي:", "options": ["الطعام والكساء والمسكن", "الميراث فقط", "المهر والهدايا فقط", "العلاج والتعليم فقط"], "answer": 0, "why": "يجب للمعتدة من طلاق رجعي على الزوج الطعام والكساء والمسكن كالزوجة.", "ref": "ص 10"}, {"q": "متى تجب النفقة للمعتدة من طلاق بائن أو خلع؟", "options": ["إذا كانت حاملًا", "إذا تزوجت بعده", "إذا كانت غير حامل", "إذا تجاوزت العدة"], "answer": 0, "why": "المعتدة من طلاق بائن أو خلع تجب لها النفقة إذا كانت حاملًا.", "ref": "ص 10"}, {"q": "ما أثر الامتناع عن النفقة بعد الانفصال؟", "options": ["يجعل الطلاق امتدادًا للخلاف ويبقي مشاعر الغضب والمرارة حاضرة بين الطرفين", "ينهي الخلاف تمامًا", "يقوي العلاقة", "لا أثر له"], "answer": 0, "why": "الطلاق لا ينهي كل ما بين الزوجين، والامتناع عن النفقة يجعل الانفصال امتدادًا للخلاف ويبقي الغضب والمرارة.", "ref": "ص 3"}, {"q": "ما تعريف الحضانة اصطلاحًا؟", "options": ["النفقة على الطفل فقط", "حفظ من لا يستقل بأمر نفسه وتربيته بمختلف وجوه التنمية والإصلاح", "تعليم الطفل القراءة", "الولاية على المال"], "answer": 1, "why": "الحضانة حفظ من لا يستقل بأمر نفسه وتربيته بمختلف وجوه التنمية والإصلاح، ولغةً من الحضن وهو الجنب.", "ref": "ص 4"}, {"q": "ماذا يحدث لحق الأم في الحضانة إذا تزوجت بأجنبي عن الطفل؟", "options": ["يبقى حقها كما هو", "ينتقل الطفل إلى زوجها", "يسقط حقها في الحضانة", "يتضاعف حقها"], "answer": 2, "why": "من شروط الحضانة الخلو من زوج أجنبي، فإذا تزوجت الأم سقط حقها في الحضانة.", "ref": "ص 5"}, {"q": "إذا سافرت الأم صاحبة الحضانة سفر حاجة كالحج، فما الحكم؟", "options": ["لا تُمكَّن من أخذ الطفل، ويُسلّم إلى جدته حتى تعود", "ينتقل إلى الأب نهائيًا", "تأخذه معها", "يُترك وحده"], "answer": 0, "why": "من شروط الحضانة الإقامة، فلو سافرت الأم سفر حاجة كحج أو نزهة لم تمكن من أخذ الطفل ويسلّم لجدته حتى تعود.", "ref": "ص 5"}, {"q": "من يلي الأم في ترتيب الحضانة من الإناث؟", "options": ["العمة", "الأخت الشقيقة", "الخالة", "أم الأم وإن علت"], "answer": 3, "why": "إذا لم توجد الأم أو رفضت انتقل الحق إلى أم الأم وإن علت، ثم أم الأب، ثم الأخت الشقيقة.", "ref": "ص 6"}, {"q": "لماذا يبقى حق الحضانة في الإناث مقدّمًا؟", "options": ["لا علة لذلك", "لأنهن أغنى", "لأنهن أوفر شفقة وأقدر على تربية الصغار", "لأنهن أكثر عددًا"], "answer": 2, "why": "يبقى حق الحضانة مقدمًا في الإناث لأنهن أوفر شفقة وأقدر على تربية الطفل.", "ref": "ص 6"}, {"q": "ما المعيار الذي توزن به القرارات المتعلقة بالطفل أثناء الحضانة؟", "options": ["رغبة الحاضنة", "مراعاة الأصلح للطفل، فلا تقدَّم رغبات الأبوين أو الحاضن على مصلحته", "رغبة الأم", "رغبة الأب"], "answer": 1, "why": "المعيار في كل القرارات المتعلقة بالطفل مراعاة الأصلح له، فلا تقدم رغبات الأبوين ومصالحهما الشخصية على مصلحته.", "ref": "ص 9"}], "12": [{"q": "ما أثر الزواج في الذمة المالية للمرأة؟", "options": ["تنتقل ملكية مالها إلى زوجها", "تبقى لها ذمة مالية مستقلة ولها كامل الحرية في التصرف في مالها", "تفقد حقها في التصرف بمالها", "تصبح أموال الزوجين مشتركة تلقائيًا"], "answer": 1, "why": "الزواج لا يجعل المرأة ولا ما تملك ملكًا لزوجها، فلها ذمة مالية مستقلة وكامل الحرية في التصرف في مالها.", "ref": "ص 3"}, {"q": "هل يجب على الزوجة أن تنفق على زوجها من مالها الخاص؟", "options": ["يجب عليها", "يحرم عليها", "لا يجب، ويجوز لها مساعدته إذا كان صالحًا ولها أجر مضاعف", "يجب إذا كان غنيًا"], "answer": 2, "why": "للزوجة ملكية مستقلة لمالها، ويجوز لها أن تساعد به زوجها الصالح، ويكون لها في ذلك أجر مضاعف.", "ref": "ص 4"}, {"q": "على من تجب نفقة الزوجة وكسوتها ومسكنها؟", "options": ["على أهلها", "على الزوجة نفسها", "على الزوج، لقوله تعالى: ﴿لينفق ذو سعة من سعته﴾", "بالتساوي بينهما"], "answer": 2, "why": "أمر الله الرجل أن يتولى نفقة زوجته وكسوتها ومسكنها: ﴿لينفق ذو سعة من سعته﴾ و﴿وعلى المولود له رزقهن وكسوتهن بالمعروف﴾.", "ref": "ص 5"}, {"q": "ما المعاني التي تثبت حق المرأة في التصرف المالي؟", "options": ["أنها تابعة لزوجها", "أن لها أهلية معتبرة، ومالًا مصونًا، ومشاورة نافعة", "أنها لا تملك", "أن مالها لأبيها"], "answer": 1, "why": "هناك ثلاثة معانٍ تثبت حقها: أن لها أهلية معتبرة، وأن لها مالًا مصونًا، وأن لها مشاورة نافعة.", "ref": "ص 6"}, {"q": "ماذا يعلمنا حديث ميمونة رضي الله عنها حين أعتقت وليدتها؟", "options": ["ألا تستشير أحدًا", "أهمية الاستشارة قبل التصرف، فإعطاؤها لأخوالها كان أعظم لأجرها", "أن المرأة لا تتصرف في مالها", "أن العتق محرم"], "answer": 1, "why": "بين لها النبي ﷺ أن إعطاءها لأخوالها كان أعظم لأجرها، ففيه أهمية النصيحة والاستشارة التي تحسّن القرار.", "ref": "ص 7"}, {"q": "إذا مات زوج المرأة وترك مالًا لأولاده، فكيف تتصرف فيه؟", "options": ["تعطيه لأهلها", "في حدود ولايتها عليهم بما يحقق مصلحتهم ويحفظ أموالهم", "تتصدق به كله", "كيفما شاءت لأنه صار ملكها"], "answer": 1, "why": "مال الأولاد لا يصبح ملكًا للأم، بل تتصرف فيه في حدود ولايتها بما يحقق مصلحتهم ويحفظ أموالهم.", "ref": "ص 8"}, {"q": "إذا قدم الزوج لزوجته هدية وقبضتها، فهل يجوز له استردادها عند الخصومة؟", "options": ["يجوز دائمًا", "يجوز إذا كانت هي المخطئة", "لا يجوز، فالهدية بعد القبض ملك لها", "يجوز بنصفها"], "answer": 2, "why": "العبارة خطأ؛ فالهدية إذا قبضتها الزوجة صارت ملكًا لها ولا يجوز استردادها عند الخصومة.", "ref": "ص 16"}, {"q": "إذا بذلت الزوجة مالًا لزوجها بنية المساعدة والتبرع، فهل لها المطالبة به دينًا؟", "options": ["نعم بعد الطلاق", "لا، ما دامت بذلته على سبيل المساعدة والتبرع", "نعم دائمًا", "نعم بضعف قيمته"], "answer": 1, "why": "إذا قالت: كانت نيتي أن أساعد زوجي، فليس لها حق المطالبة بهذا المال دينًا لأنها بذلته تبرعًا.", "ref": "ص 11"}, {"q": "ما الأصل الذي يحفظ الاستقرار الأسري عند مشاركة الزوجة في ثمن مسكن يُسجَّل باسم الزوج؟", "options": ["توثيق الحقوق وبيان طبيعة المال، كما في آية الدَّين: ﴿إذا تداينتم بدين إلى أجل مسمى فاكتبوه﴾", "الثقة دون توثيق", "ترك الأمر للظروف", "تسجيله باسم الأولاد"], "answer": 0, "why": "المشكلة لا تظهر في أوقات الصفاء بل الجفاء، والأصل الذي يحفظ الاستقرار التوثيق وبيان طبيعة المال كما في آية الدين.", "ref": "ص 12"}, {"q": "لماذا ينبغي بيان طبيعة المال الذي تدفعه الزوجة في البيت؟", "options": ["لإظهار الفضل على الزوج", "لتتضح الملكية والالتزامات: هل هو هبة أم قرض أم مشاركة", "لأنه يضعف الثقة", "لا حاجة لذلك"], "answer": 1, "why": "عندما تدفع الزوجة مالًا في البيت لا بد من بيان طبيعته: هبة أم قرض أم مشاركة، ليترتب على ذلك وضوح الملكية والالتزامات.", "ref": "ص 13"}], "13": [{"q": "ما الذي ينبغي أن يدعو به المسلم عند طلب الذرية كما كان دعاء الأنبياء؟", "options": ["أن يرزقه الذكور فقط", "أن يرزقه الله الذرية الصالحة، لا مجرد الذرية", "أن يرزقه الكثرة فقط", "لا يدعو بذلك"], "answer": 1, "why": "أول ما ينبغي أن يدعو الله أن يرزقه الذرية الصالحة كما كان دعاء الأنبياء، لا أن يطلب مجرد الذرية.", "ref": "ص 4"}, {"q": "ماذا تلفت إليه آية ﴿المال والبنون زينة الحياة الدنيا والباقيات الصالحات خير﴾؟", "options": ["أن الأولاد أهم من العمل الصالح", "أن كثرة الأولاد غاية", "أن يكون الأولاد عونًا على طاعة الله، فقد يُرزق الإنسان أولادًا ثم يقصر بسببهم في حق الله", "أن المال أفضل من الأولاد"], "answer": 2, "why": "الآية تلفت إلى أن يكون الأولاد عونًا على طاعة الله، فقد يرزق الإنسان أولادًا كثيرين ثم يقصر بسببهم في حقوق الله.", "ref": "ص 3"}, {"q": "على أي أساس ينبغي أن يقوم تنظيم الحمل؟", "options": ["انفراد أحد الزوجين بالقرار", "رأي الأهل", "التشاور والتراضي بين الزوجين لأن قرار الإنجاب تترتب عليه مسؤوليات مشتركة", "استعمال أي وسيلة متاحة دون ضابط"], "answer": 2, "why": "ينبغي أن يقوم تنظيم الحمل على التشاور والتراضي، فالحمل والولادة تتعلق بالزوجة، والرعاية مشتركة، والنفقة على الزوج.", "ref": "ص 6"}, {"q": "إذا أفطرت الحامل أو المرضع خوفًا على نفسها، فما الواجب عليها؟", "options": ["لا شيء عليها", "القضاء فقط، وتُعامل معاملة المريض", "الكفارة فقط", "صيام شهرين متتابعين"], "answer": 1, "why": "إذا كان خوفها على نفسها فتعامل معاملة المريض بلا خلاف، وعليها القضاء عندما يتيسر لها.", "ref": "ص 8"}, {"q": "ما أكثر مدة النفاس على المشهور عند العلماء؟", "options": ["سبعة أيام", "ستون يومًا", "أربعون يومًا", "عشرون يومًا"], "answer": 2, "why": "المشهور أن أكثر النفاس أربعون يومًا، لقول أم سلمة: كانت النفساء تقعد على عهد النبي ﷺ بعد نفاسها أربعين يومًا.", "ref": "ص 9"}, {"q": "ما مدة تمام الرضاعة بنص القرآن؟", "options": ["عام واحد", "ثلاث سنوات", "حولان كاملان لمن أراد إتمام الرضاعة", "ستة أشهر"], "answer": 2, "why": "مدة تمام الرضاعة حولان كاملان بنص الآية لمن أراد أن يتم الرضاعة.", "ref": "ص 10"}, {"q": "على من أوجب الله نفقة الأم وكسوتها خلال فترة الرضاعة؟", "options": ["على الأب (الزوج) بالمعروف", "على الأم نفسها", "على الدولة", "على أهلها"], "answer": 0, "why": "أوجب الله على الأب توفير رزق الأم وكسوتها بالمعروف خلال فترة الرضاعة.", "ref": "ص 10"}, {"q": "لماذا غيّر النبي ﷺ اسم «حرب» الذي سمّى به عليٌّ ابنه الحسن؟", "options": ["لأن من حق المولود أن يُسمّى اسمًا حسنًا لا يُعيَّر به", "لأنه اسم أعجمي", "لأنه اسم طويل", "لأنه اسم نبي"], "answer": 0, "why": "سماه علي حربًا فقال ﷺ: «بل هو حسن»، فمن حق المولود الاسم الحسن الذي لا يعير به.", "ref": "ص 11"}, {"q": "ما حكم تعليق التميمة على المولود بدعوى حفظه؟", "options": ["مستحب", "جائز", "أمر خطير ومن وسائل الشرك: «من علق تميمة فقد أشرك»", "سنة عند الولادة"], "answer": 2, "why": "تعليق التميمة على المولود أمر خطير ومن وسائل الشرك، لقوله ﷺ: «من علق تميمة فقد أشرك».", "ref": "ص 12"}, {"q": "ما الذي يجعل دعاء الولد نافعًا لوالديه بعد موتهما؟", "options": ["كثرة أولاده", "كثرة ماله", "مكانته بين الناس", "صلاحه ودعاؤه لهما"], "answer": 3, "why": "صلاح الولد ودعاؤه لوالديه هو النافع لهما بعد موتهما: «أو ولد صالح يدعو له».", "ref": "ص 18"}], "14": [{"q": "لماذا عدّ العلماء علم الفرائض (المواريث) نصف العلم؟", "options": ["لأنه يدرس في نصف سنوات الطلب", "لأن العلم قسمان: قسم يتعلق بالحياة، وقسم يتعلق بما بعد الممات وهو المواريث", "لأن الفقهاء اختلفوا فيه أكثر من غيره", "لأن أحكامه أكثر من نصف أحكام الفقه"], "answer": 1, "why": "أولى الإسلام علم الفرائض عناية فائقة حتى عدّه العلماء نصف العلم؛ لأن العلم قسمان: قسم يتعلق بالحياة، وقسم يتعلق بما بعد الممات وهو علم المواريث.", "ref": "ص 2"}, {"q": "ماذا يدل عليه قوله تعالى ﴿نصيبًا مفروضًا﴾ في حق المرأة؟", "options": ["أن نصيبها يتوقف على رضا إخوتها", "أنه يسقط إذا كانت غنية", "أنه هبة يتفضل بها الورثة", "أنه حق لازم لا يسقط بكونها متزوجة أو ميسورة الحال"], "answer": 3, "why": "﴿نصيبًا مفروضًا﴾ حق لازم للمرأة لا يتوقف على رضا الإخوة، ولا يسقط بكونها متزوجة أو ميسورة الحال.", "ref": "ص 3"}, {"q": "ما الذي تدل عليه قصة امرأة سعد بن الربيع التي جاءت ببنتيها إلى النبي ﷺ؟", "options": ["أن مطالبة المرأة بحقها وحق بناتها إقامة لأمر الله وليست قطيعة للرحم", "أن البنات لا يرثن مع وجود العم", "أن الميراث كله للعم عند وجود البنات", "أن مطالبة المرأة بحقها تخدش الحياء"], "answer": 0, "why": "قضى النبي ﷺ للبنتين بالثلثين وللأم بالثمن والباقي للعم؛ فدل ذلك على أن مطالبة المرأة بحقها ليست خادشة للحياء ولا مفسدة للرحم، بل هي إقامة لأمر الله.", "ref": "ص 3"}, {"q": "ما أول الحقوق المتعلقة بالتركة قبل تقسيمها؟", "options": ["توزيع الأنصبة على الورثة", "تجهيز الميت ودفنه بالمعروف", "تنفيذ الوصية", "سداد الديون"], "answer": 1, "why": "ترتيب الحقوق الواجبة قبل توزيع الميراث: تجهيز الميت ودفنه بالمعروف، ثم سداد الديون، ثم تنفيذ الوصية، ثم توزيع الباقي على الورثة.", "ref": "ص 3"}, {"q": "كيف يُعامل مؤخر صداق الزوجة الثابت عند قسمة التركة؟", "options": ["يسقط إذا أخذت نصيبها من الميراث", "يُوزع مناصفة بينها وبين الأولاد", "يُسدد دينًا أولًا قبل تقسيم التركة", "يُسدد بعد قسمة التركة على الورثة"], "answer": 2, "why": "مؤخر صداق الزوجة من ديون العباد؛ فهو دين يخرج أولًا قبل التقسيم ولا يسقط بالميراث.", "ref": "ص 4"}, {"q": "ما حدود الوصية الشرعية التي تُنفذ من التركة؟", "options": ["في حدود الثلث لغير وارث", "بلا حد ما دام الميت أوصى بها", "في حدود النصف لأي شخص", "في حدود الربع للورثة فقط"], "answer": 0, "why": "تُنفذ الوصية الشرعية في حدود الثلث لغير وارث، قال تعالى: ﴿من بعد وصية يوصي بها أو دين﴾.", "ref": "ص 4"}, {"q": "ما أسباب الإرث الثلاثة التي ذكرها الدرس؟", "options": ["الولاء، والكفالة، والهبة", "الزوجية، والجوار، والصداقة", "الزوجية، والنسب، والولاء", "النسب، والحاجة، والوصية"], "answer": 2, "why": "أسباب الإرث: الزوجية بالنكاح الصحيح، والنسب (القرابة)، والولاء لمن أعتق رقيقًا.", "ref": "ص 4"}, {"q": "كم ترث الزوجة عند وجود الولد للمتوفى؟", "options": ["الربع", "النصف", "السدس", "الثمن"], "answer": 3, "why": "الزوجة ترث الربع عند عدم وجود الولد، والثمن عند وجود الولد.", "ref": "ص 5"}, {"q": "كم تستحق البنت الصلبية الواحدة المنفردة من تركة أبيها؟", "options": ["الثلث", "النصف فرضًا", "الباقي تعصيبًا فقط", "الربع"], "answer": 1, "why": "البنت الصلبية ترث النصف إذا كانت واحدة منفردة، والثلثين إن كن اثنتين فأكثر، وترث بالتعصيب مع أخيها.", "ref": "ص 5"}, {"q": "أيٌّ مما يلي من الصور الشائعة للظلم المحرم في ميراث المرأة؟", "options": ["توثيق حق المرأة قانونيًا", "تقسيم التركة فور سداد الديون", "حرمان المرأة بحجة أنها متزوجة أو مستورة الحال", "تحكيم عقلاء العائلة عند النزاع"], "answer": 2, "why": "من صور الظلم المحرم: حرمان المرأة بحجة أنها متزوجة أو مستورة الحال، ومنع قسمة الأراضي، ومساومتها على التنازل، وتأخير القسمة عمدًا.", "ref": "ص 6"}], "15": [{"q": "ما الخطر الذي قد ينشأ عن استخدام مصطلحات جذابة دون التحقق من معانيها ومقاصدها؟", "options": ["تعدد الآراء حول القضايا الأسرية", "صعوبة فهم القضايا الاجتماعية", "تمرير تصورات تؤثر في الأسرة وتعمل على تفكيكها", "ضعف الاهتمام بالقوانين المحلية"], "answer": 2, "why": "كثيرًا ما تخفي العبارات الجميلة والشعارات البراقة وراءها قوانين وتوجهات تستهدف الأسرة وتعمل على تفكيكها، فلا بد من النظر في معانيها وآثارها.", "ref": "ص 2"}, {"q": "ما الذي يدل عليه حديث «ليشربن ناس من أمتي الخمر يسمونها بغير اسمها» في موضوع الدرس؟", "options": ["أن تغيير الأسماء لا يغير الحقائق ولا أثر له", "أن المصطلحات الحديثة كلها مقبولة", "أن هدم الثوابت قد يبدأ بتغيير المصطلحات والمفاهيم والتعريفات", "أن الحديث خاص بالخمر فقط"], "answer": 2, "why": "بيّن النبي ﷺ أن الهدم قد يكون بتغيير المصطلحات؛ فضياع الأسرة وتفكيكها قد يبدأ بتغيير بعض المفاهيم والتعريفات.", "ref": "ص 2"}, {"q": "ما الذي يميز المعاهدات الدولية عن الإعلانات وبرامج العمل؟", "options": ["أنها تنشئ التزامات على الدول الأطراف فيها", "أنها تقتصر على تقديم التوصيات", "أنها لا تؤثر في السياسات والتشريعات", "أنها لا تتضمن أي التزامات"], "answer": 0, "why": "المعاهدات تنشئ التزامات على الدول الأطراف فيها، أما الإعلان فليس معاهدة في ذاته ولا تلتزم به الدول بالطريقة نفسها، لكنه يؤثر في السياسات والتشريعات.", "ref": "ص 3"}, {"q": "ما الذي تتضمنه بعض القوانين الغربية المتعلقة بحماية الطفل ويستدعي الانتباه؟", "options": ["منع الأطفال من التعليم", "إلزام الآباء بتعليم أبنائهم الدين", "منح الدولة الحق في سحب الأطفال من آبائهم وأمهاتهم والتدخل في تربيتهم", "إلزام الأمهات بالبقاء في البيت"], "answer": 2, "why": "رغم جمال عنوان «حماية الطفل»، فإن بعض هذه القوانين يمنح الدولة الحق في سحب الأطفال من آبائهم لتتولى هي تربيتهم، ويسمح لها بالتدخل في تربية الأولاد.", "ref": "ص 4"}, {"q": "متى تتحول الاختلافات في المسؤوليات الزوجية إلى وسيلة لإحداث الصراع بين الزوجين؟", "options": ["عندما يتعاونان في مواجهة التحديات", "عندما يتشاور الزوجان في توزيع المسؤوليات", "عندما يُصوَّر كل تنازل متبادل على أنه ظلم وإهانة", "عندما يراعي كل طرف ظروف الآخر"], "answer": 2, "why": "من مظاهر التغريب تحويل العلاقة بين الزوجين إلى صراع دائم، حين يُقدَّم كل اختلاف في المسؤوليات على أنه قهر، وكل يراث"], "answer": 3, "why": "كثيرًا ما ينفر الناس من الشريعة بسبب عادات مخالفة لها، مثل حرمان البنت من الميراث أو الاستيلاء على مال الزوجة؛ وهي عادات حاربتها الشريعة ورفضتها.", "ref": "ص 12"}]}, "s4": {"1": [{"q": "من النيات التي يجب استحضارها في الزواج:", "options": ["إرضاء المجتمع", "الكسب المادي فقط", "الاقتداء بالأنبياء والمرسلين، وغض البصر وتحصين الفرج", "التفاخر"], "answer": 2, "why": "من النيات: الاقتداء بالأنبياء والمرسلين، فالزواج سنتهم، وغض البصر وتحصين الفرج.", "ref": "ص 2"}, {"q": "ماذا قال النبي ﷺ للرهط الذين تقالّوا عبادته وقال أحدهم: لا أتزوج النساء أبدًا؟", "options": ["«افعلوا ما شئتم»", "«...وأتزوج النساء، فمن رغب عن سنتي فليس مني»", "«العزوبة أفضل للعبادة»", "«أحسنتم»"], "answer": 1, "why": "قال ﷺ: «أما والله إني لأخشاكم لله وأتقاكم له، لكني أصوم وأفطر وأصلي وأرقد وأتزوج النساء، فمن رغب عن سنتي فليس مني».", "ref": "ص 2"}, {"q": "ما العبرة من قصة ولادة صلاح الدين الأيوبي التي ذُكرت في الإضاءة؟", "options": ["أن أمه استحضرت نية صالحة في الزواج والذرية فبلّغها الله إياها", "أن أباه كان ملكًا", "أن الولادة كانت في القدس", "أنه وُلد وحيدًا"], "answer": 0, "why": "وُلد مع صلاح الدين آلاف الأطفال في يوم واحد، لكن أمه استحضرت نية صالحة فبلغها الله إياها فكان فاتحًا لبيت المقدس.", "ref": "ص 3"}, {"q": "أي الدنانير أعظم أجرًا كما في الحديث؟", "options": ["الدينار الذي أنفقته على أهلك", "الذي تصدقت به على مسكين", "الذي أنفقته في رقبة", "الذي أنفقته في سبيل الله"], "answer": 0, "why": "قال ﷺ: «دينار أنفقته في سبيل الله... ودينار أنفقته على أهلك، أعظمها أجرًا الذي أنفقته على أهلك».", "ref": "ص 4"}, {"q": "كيف وصف الله الزواج في قوله: ﴿ومن آياته أن خلق لكم من أنفسكم أزواجًا﴾؟", "options": ["أنه آية من آيات الله التي يجب التفكر فيها", "أنه عادة اجتماعية", "أنه أمر ثانوي", "أنه مباح فقط"], "answer": 0, "why": "الزواج من آيات الله التي يجب التفكر فيها، فجعل بين الزوجين مودة ورحمة.", "ref": "ص 4"}, {"q": "من مقاصد الزواج في التصور الإسلامي:", "options": ["تحقيق المكانة الاجتماعية فقط", "تكثير الأمة وتقويتها، وحفظ الدين والعفاف", "الترف فقط", "إشباع الغرائز فقط"], "answer": 1, "why": "من مقاصد الزواج تكثير الأمة وتقويتها، وحفظ الدين والعفاف وغض البصر، وتحقيق السعادة بطرق مشروعة.", "ref": "ص 5"}, {"q": "ما النظرة المادية للزواج؟", "options": ["أن يرى الإنسان في الزواج راحة وإشباعًا للغرائز وتحقيقًا للمكانة الاجتماعية فقط", "أنه حفظ للنسل", "أنه عبادة ورسالة", "أنه سكن ومودة"], "answer": 0, "why": "النظرة المادية ترى الزواج راحة وإشباعًا للغرائز وتحقيقًا للمكانة الاجتماعية، فتنتج أسرًا غير مستقرة وطلاقًا كثيرًا.", "ref": "ص 6"}, {"q": "ما الخلاصة التي قررتها المحاضرة في المقارنة بين الرؤيتين؟", "options": ["لا فرق بينهما", "الرؤية الإسلامية تهمل الحاجات", "كلما بُني الزواج على هدف ورسالة كان صامدًا وقت الخلاف، وكلما قام على المنفعة المادية انهار عند أول اختبار", "الرؤية المادية أكثر استقرارًا"], "answer": 2, "why": "كلما كان الزواج مبنيًا على هدف ورسالة كان صامدًا وقت الخلاف، وكلما قام على المنفعة المادية انهار عند أول اختبار.", "ref": "ص 6"}, {"q": "ما الاحتياج المهم للزوج الذي نبّهت المحاضرة المرأة ألا تغفل عنه؟", "options": ["كثرة الطلبات", "المقارنة بغيره", "الصمت الدائم", "التقدير، فتبديه وتعبّر عنه وتربي أبناءها عليه"], "answer": 3, "why": "التقدير من أهم احتياجات الزوج، فلا ينبغي للمرأة أن تغفل عنه بل تبديه وتعبر عنه وتربي أبناءها على ذلك.", "ref": "ص 7"}, {"q": "لماذا تُعدّ الرحمة صمام الأمان في الحياة الزوجية؟", "options": ["لأنها خاصة بالأولاد", "لأنها تغني عن المودة", "لأنها تبقى عند سقوط المودة المؤقت، فيرحم كل منهما ضعف الآخر وتقصيره", "لأنها تلغي الحقوق"], "answer": 2, "why": "الرحمة صمام الأمان عند سقوط المودة المؤقت، فيرحم كل من الزوجين ضعف الآخر وتقصيره واختلافه.", "ref": "ص 7"}], "2": [{"q": "بأي آية استدلت المحاضرة على أن الله قدّم الإنسان على أنه خليفة في الأرض؟", "options": ["﴿الرجال قوامون على النساء﴾", "﴿وإذ قال ربك للملائكة إني جاعل في الأرض خليفة﴾", "﴿وعاشروهن بالمعروف﴾", "﴿هو الذي خلقكم من نفس واحدة﴾"], "answer": 1, "why": "قدّم الله الإنسان على أنه خليفة في الأرض: ﴿وإذ قال ربك للملائكة إني جاعل في الأرض خليفة﴾، والزوج والزوجة جزء من هذا الاستخلاف.", "ref": "ص 2"}, {"q": "كيف ينبغي أن يُقبل الإنسان على  بين الرجل والمرأة.", "ref": "ص 4"}, {"q": "ما المقصود بـ«سكن النفوس» من أنواع السكن؟", "options": ["التحاور الفكري", "عدم الاستهزاء", "عدم السخرية", "أن كل طرف مقبول غير مهدد، فلا يهدد الرجل زوجته بالطلاق ولا تهدد المرأة زوجها بتركه"], "answer": 3, "why": "سكن النفوس أن كل طرف مقبول غير مهدد؛ فلا يهدد الرجل زوجته بالطلاق ولا تهدد المرأة زوجها بتركه.", "ref": "ص 6"}, {"q": "ما الفرق بين المودة والرحمة كما عرّفتهما المحاضرة؟", "options": ["المودة الحب الواعي المتبادل يظهر في التعامل والاهتمام، والرحمة تظهر عند المرض والضعف والخطأ والفتور", "لا فرق بينهما", "الرحمة في الرخاء والمودة في الشدة", "المودة للأولاد والرحمة للزوجين"], "answer": 0, "why": "المودة الحب الواعي المتبادل يظهر في التعامل والكلام، والرحمة تظهر عند المرض والضعف والخطأ والفتور، وهي الغطاء الذي يحمي البيت.", "ref": "ص 6"}, {"q": "ما العلاقة بين الاستخلاف والسكن؟", "options": ["لا علاقة بينهما", "لا استخلاف بلا سكن، ولا رسالة بلا سكن، فالبيت الذي يحمل الرسالة يجب أن تكون فيه روح السكن", "السكن يغني عن الرسالة", "الاستخلاف يغني عن السكن"], "answer": 1, "why": "لا استخلاف في الأرض بلا سكن، ولا رسالة بلا سكن؛ فالبيت الذي يحمل الرسالة يجب أن تكون فيه روح السكن.", "ref": "ص 6"}], "3": [{"q": "لماذا تُعدّ مرحلة الخطوبة مهمة في حياة الزوجين؟", "options": ["لأنها لا تؤثر في الزواج", "لأنها مرحلة تخطيط ومعرفة للطرف الآخر ودافعه نحو الزواج، فكثير من حالات الطلاق تحدث لاختلاف الدوافع", "لأنها ترف فكري", "لأنها مرحلة احتفالات فقط"], "answer": 1, "why": "الخطوبة ليست ترفًا فكريًا بل مرحلة تخطيط ومعرفة للطرف الآخر ودافعه، فكثير من حالات الطلاق تحدث لاختلاف الدوافع.", "ref": "ص 2"}, {"q": "على أي أساس يجب أن يُبنى قرار الزواج؟", "options": ["على العاطفة وحدها", "على رأي الأصدقاء", "على العقل لا على العاطفة", "على المظاهر"], "answer": 2, "why": "قرار الزواج يعتبر أخطر قرار، ويجب أن ينبني على العقل لا على العاطفة.", "ref": "ص 2"}, {"q": "ميل الرجل لبناء بيت وتكوين أسرة، وميل المرأة للإنجاب والأمومة من الدوافع:", "options": ["الفطرية", "المادية", "الاجتماعية", "المضطربة"], "answer": 0, "why": "الدوافع الفطرية: الرجل من فطرته الميل لبناء بيت وتكوين أسرة، والمرأة تميل بفطرتها للإنجاب وشعور الأمومة.", "ref": "ص 2"}, {"q": "زواج الرجل بحثًا عن امرأة موظفة لتحسين مستواه المعيشي من الدوافع:", "options": ["المادية", "الدينية", "الفطرية", "دوافع الأبوة"], "answer": 0, "why": "الدوافع المادية أن يتزوج الرجل لتحسين مستواه المعيشي كالبحث عن امرأة موظفة، أو تتزوج المرأة غنيًّا هربًا من الفقر.", "ref": "ص 3"}, {"q": "ما الدوافع الصحيحة للزواج؟", "options": ["الخضوع لضغط المجتمع", "التي يثاب عليها العبد ويُبنى بها بيت، كالعفة وتحقيق السكن", "الهروب من المشكلات الأسرية", "تعويض حرمان عاطفي"], "answer": 1, "why": "الدوافع الصحيحة هي التي يثاب عليها العبد ويبنى بها الزواج، كالعفة وتحقيق السكن والمودة وتربية أبناء صالحين.", "ref": "ص 3"}, {"q": "إشباع الغريزة بالزواج من الدوافع:", "options": ["المضطربة", "غير المعتبرة", "المحرمة", "المشروعة"], "answer": 3, "why": "إشباع الغريزة عن طريق الزواج من الدوافع المشروعة.", "ref": "ص 7"}, {"q": "كيف تعرف الفتاة دوافع الخاطب في النظرة الشرعية؟", "options": ["بسؤاله مباشرة: لماذا تتزوج؟", "بالسؤال عن ماله فقط", "بالانتباه إلى حضور كلمات مفتاحية كالمسؤولية والاستقرار والتربية والمودة والرحمة في حديثه، دون أسئلة مباشرة", "لا يمكن معرفتها"], "answer": 2, "why": "لا ينبغي سؤال الخاطب مباشرة لماذا تتزوج، بل ينتبه إلى حضور كلمات كالمسؤولية والاستقرار والتربية والمودة والرحمة.", "ref": "ص 4"}, {"q": "ما أثر النية الصالحة في الزواج على الزوجين؟", "options": ["لا أثر لها", "تجعل الزواج أصعب", "تخص الزوج وحده", "تجعل الزوج أرحم عند القدرة وأعدل عند الغضب، والزوجة صبورة حكيمة، لأن كلًا منهما يعامل الله في الآخر"], "answer": 3, "why": "النية تجعل الزوج أرحم وأعدل وأوفى وأصبر، والزوجة صبورة حكيمة؛ لأن كل طرف يعامل الله تعالى في الطرف الآخر.", "ref": "ص 5"}, {"q": "من سبل تزكية دوافع الزواج:", "options": ["مشاهدة المسلسلات", "الدعاء والصحبة الصالحة ومجاهدة النفس وحضور الجلسات الإرشادية", "الاستعجال", "الاعتماد على العاطفة"], "answer": 1, "why": "من سبل تزكية الدوافع الدعاء، والصحبة الصالحة، ومجاهدة النفس، وحضور الجلسات الإرشادية التي تكشف الدوافع الخفية.", "ref": "ص 6"}, {"q": "أول ما يستقي منه الأولاد دوافعهم عن الزواج:", "options": ["المسلسلات", "الأسرة", "الأصدقاء", "المدرسة"], "answer": 1, "why": "الأسرة أول ما يستقي منه الأولاد دوافعهم عن الزواج، كما في أسئلة التقويم.", "ref": "ص 7"}], "4": [{"q": "ما الخطأ الذي يقع فيه بعض الشباب عند الإقبال على الزواج؟", "options": ["تعلم فقه الزواج", "اعتباره علاقة عاطفية محضة وحصره في القدرة المالية والرغبة في الاستقرار دون النضج النفسي ومهارات التواصل", "الاهتمام بالتهيئة النفسية", "فهم الذات"], "answer": 1, "why": "يدخل بعض الشباب الزواج باعتباره علاقة عاطفية محضة ويحصرونه في القدرة المالية دون النظر إلى النضج النفسي ومهارات التواصل.", "ref": "ص 2"}, {"q": "لماذا كانت التهيئة النفسية ضرورية للمتزوجين أيضًا؟", "options": ["لأنها تمنع الزواج من أن يفقد أهم معانيه أو يتحول إلى صراع والرحمة إلى قسوة", "لأنها تغني عن المودة", "لأنها ترف", "لا حاجة لها بعد الزواج"], "answer": 0, "why": "التهيئة النفسية ضرورية للمتزوجين أيضًا لأنها تمنع الزواج من أن يتحول إلى صراع، والرحمة إلى قسوة.", "ref": "ص 2"}, {"q": "ما التصور الصحيح عن الزواج كما بيّنت المحاضرة؟", "options": ["الزواج محطة راحة", "الزواج ليس محطة راحة، وإنما مشروع كبير طويل المدى فيه مسؤوليات وتضحيات", "الزواج علاقة مثالية بلا أخطاء", "الزواج هروب من المشكلات"], "answer": 1, "why": "من دخل الزواج بنية الهروب صُدم بثقل المسؤوليات؛ فالزواج ليس محطة راحة بل مشروع كبير طويل المدى.", "ref": "ص 3"}, {"q": "ما المقصود بأن الزواج علاقة بشرية وليست مثالية؟", "options": ["أنه علاقة لا تحتاج جهدًا", "أنه بين طرفين بطباع مختلفة ومشاعر مستقلة ونقاط قوة وضعف", "أنه علاقة كاملة من أول يوم", "أنه لا يتأثر بالطباع"], "answer": 1, "why": "الزواج علاقة بشرية بين طرفين لكل منهما طباع مختلفة ومشاعر مستقلة ونقاط قوة ونقاط ضعف.", "ref": "ص 3"}, {"q": "بماذا شبّهت المحاضرة من ينتظر استقرار زواجه من أول أيامه؟", "options": ["بمن يشتري بلا مال", "بمن يبني بيتًا في يوم", "بمن يزرع اليوم وينتظر الثمرة غدًا", "بمن يسافر بلا زاد"], "answer": 2, "why": "من ينتظر استقرار زواجه من أول أيامه كمن يزرع اليوم وينتظر الثمرة غدًا، فأول سنة للتعلم واكتشاف الطرف الآخر.", "ref": "ص 4"}, {"q": "من أسس التهيئة الاجتماعية للزوجين:", "options": ["معرفة الله", "تعلم فقه الزواج", "ضبط الحدود وتوزيع الأدوار والتعامل الحكيم مع أهل الزوجين", "ختمة القرآن"], "answer": 2, "why": "التهيئة الاجتماعية تكون بتوزيع الأدوار، وضبط الحدود، والتعامل الحكيم مع أهل الزوجين، فلا تُدخل الأطراف في الخلافات.", "ref": "ص 4"}, {"q": "ما المقصود بالوعي بالذات في التهيئة؟", "options": ["أن يهتم بمظهره فقط", "أن يطالب الآخر بالتغير", "أن يقارن نفسه بغيره", "أن يفهم كل طرف نفسه ومشاعره ورغباته وتصوره عن نفسه قبل غيره"], "answer": 3, "why": "الوعي بالذات أن يفهم كل طرف نفسه ومشاعره ورغباته وتصوره عن نفسه قبل أن يطلب من الآخر أن يتغير.", "ref": "ص 5"}, {"q": "من مظاهر غياب التهيئة النفسية للزوجين:", "options": ["الإقدام على الزواج بدوافع خاطئة، وحدوث صدمات نفسية، وتعاظم المشكلات", "الاستقرار", "التفاهم", "حسن التواصل"], "answer": 0, "why": "من مظاهر غياب التهيئة الإقدام على الزواج بدوافع خاطئة كالعاطفة وحدها أو الهروب، وحدوث صدمات وتعاظم المشكلات.", "ref": "ص 5"}, {"q": "تحتاج المرأة إلى تهيئة خاصة تنقلها من:", "options": ["السكن إلى الاستقلال", "التعلق إلى السكن والطمأنينة، وأنها شريكة تابعة لزوجها لا قائدة", "الاستقلال إلى القوامة", "لا تحتاج تهيئة خاصة"], "answer": 1, "why": "بطبع المرأة التعلق، فتحتاج تهيئة من التعلق إلى السكن، وأنها شريكة في تحقيق الطمأنينة وتابعة لزوجها لا قائدة.", "ref": "ص 6"}, {"q": "تحتاج تهيئة الرجل إلى أن ينتقل من:", "options": ["القوامة إلى الاستقلال", "الاستقلال إلى القوامة: المسؤولية والقيادة والإنجاز والقدوة", "التعلق إلى السكن", "لا يحتاج تهيئة"], "answer": 1, "why": "يتحول الرجل من الاستقلال إلى القوامة، فيُهيأ من باب المسؤولية والقيادة والإنجاز والقدوة.", "ref": "ص 6"}], "5": [{"q": "لماذا لم تترك الشريعة أمر الزواج للأذواق والأهواء؟", "options": ["لأنه لا يؤثر في المجتمع", "لأن الحب يكفي", "لأنه أساس تكوين الأسرة اللبنة الأولى في بناء المجتمع، وعبادة عظيمة ذات مقاصد كحفظ الدين والنفس والعرض والنسل", "لأنه أمر شخصي بحت"], "answer": 2, "why": "الزواج أساس تكوين الأسرة اللبنة الأولى للمجتمع، فأحاطته الشريعة بأحكام ومقاصد عظيمة كحفظ الدين والنفس والعرض والنسل.", "ref": "ص 2"}, {"q": "هل الحب وحده يكفي لبناء أسرة مستقرة؟", "options": ["يكفي إذا كان قويًا", "لا، فالحب على أهميته لا يكفي لبناء أسرة مستقرة تدوم", "نعم يكفي", "يكفي في السنوات الأولى"], "answer": 1, "why": "الزواج ليس علاقة عاطفية تقوم على الحب وحده؛ فالحب على أهميته لا يكفي لبناء أسرة مستقرة تدوم.", "ref": "ص 2"}, {"q": "إذا كان الخاطب صالحًا في نفسه لكن بيئته غير صالحة، فما التوجيه؟", "options": ["يُرد فورًا", "لا يُرد بشرط أن يكون ذا شخصية قوية لا يسمح لأحد بالتدخل في حياته وإفسادها", "يجب أن يقطع أهله", "يُقبل دون شرط"], "answer": 1, "why": "إن لم تكن بيئته طيبة وكان صالحًا ملتزمًا فلا يُرد، بشرط أن يكون ذا شخصية قوية لا تسمح بإفساد حياته.", "ref": "ص 3"}, {"q": "ما أصل الكفاءة في الزواج؟", "options": ["الكفاءة الاجتماعية", "الكفاءة المالية", "الكفاءة العلمية", "الكفاءة الدينية"], "answer": 3, "why": "الكفاءة الدينية أصل الكفاءة، ولا بد أن يكون الرجل مكافئًا للمرأة اجتماعيًا وعلميًا وماليًا ودينيًا.", "ref": "ص 4"}, {"q": "ما الخطر الذي تقع فيه بعض المتدينات بسبب قلة فرص الزواج؟", "options": ["رفض كل الخاطبين", "التمسك بالمعايير", "الزواج المبكر", "التنازل عن بعض المعايير الدينية كقبول رجل لا يحافظ على الصلاة"], "answer": 3, "why": "قد تقع المتدينة في حيرة بسبب قلة الفرص فتفكر في التنازل عن معايير دينية، كقبول رجل لا يحافظ على الصلاة.", "ref": "ص 4"}, {"q": "من المعايير المجتمعية الخاطئة في الاختيار:", "options": ["رفض الزواج بالمطلق أو المطلقة بحجج لا أساس لها في الدين", "الرؤية الشرعية", "السؤال عن الخاطب", "اشتراط الدين والخلق"], "answer": 0, "why": "من المعايير الخاطئة رفض الزواج من المطلقة أو المطلق بحجج لا أساس لها في الدين، مما عطّل كثيرًا من الزيجات.", "ref": "ص 5"}, {"q": "من الأسئلة التي تطرحها الفتاة على نفسها عند الاختيار:", "options": ["هل يشبه الممثلين؟", "هل سيعينني على الطاعة؟ وهل يصلح شريكًا لي في العبادة والتربية؟", "كم يملك من المال؟", "هل هو مشهور؟"], "answer": 1, "why": "من الأسئلة: هل سيعينني على الطاعة ويأخذ بيدي إلى العبادات؟ وهل يصلح أن يكون شريكًا في العبادة والتربية؟", "ref": "ص 6"}, {"q": "ما فكرة نشاط «اختيار ع
