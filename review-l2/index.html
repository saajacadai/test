  --bg: #023373;
  --on-dark: #FFFFFF;
  --on-dark-soft: #CFE0F5;
  --on-dark-pink: #FBC4D8;
  --surface: #FDEFF4;
  --surface-2: #FFF8FB;
  --ink: #023373;
  --ink-soft: #4A5F86;
  --line: #F2C2D5;
  --navy-tint: #DCE3F0;
  --pink: #F280AA;
  --pink-ink: #B03A67;
  --pink-tint: #F9C9DB;
  --cyan: #38B5DA;
  --cyan-ink: #0B6F93;
  --cyan-tint: #D8EFF8;
  --btn-pink: #F9C9DB;
  --btn-pink-hover: #F5B5CC;
  --btn-cyan: #BDE5F3;
  --btn-cyan-hover: #A6DBEE;
  --ok: #1E7A55;
  --ok-tint: #E4F5EC;
  --bad: #A33A3A;
  --bad-tint: #FBE6E6;
  --f-head: 'Alexandria', 'Tajawal', system-ui, sans-serif;
  --f-body: 'Tajawal', 'Alexandria', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.8;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));

}

#root { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding-block: 20px 40px; }
h1, h2, h3 { font-family: var(--f-head); margin: 0; text-wrap: balance; line-height: 1.5; }
p { margin: 0; }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--btn-cyan); outline-offset: 2px; border-radius: 6px; }

/* شريط علوي */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 6px 18px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-head); font-weight: 700; font-size: 17px; color: var(--on-dark); }
.brand img { height: 44px; width: auto; }
.topbar .slogan { color: var(--on-dark-pink); font-family: var(--f-head); font-weight: 500; font-size: 14px; }

/* هيرو على الخلفية الزرقاء مباشرة */
.hero { position: relative; padding: 28px 4px 10px; }
.hero::before {
  content: ""; position: absolute; inset-block-start: 4px; inset-inline-start: 0;
  width: 150px; height: 96px;
  background-image: radial-gradient(var(--cyan) 1.6px, transparent 1.7px);
  background-size: 16px 16px; opacity: .6; pointer-events: none;
}
.hero h1 { position: relative; color: var(--on-dark); font-weight: 700; font-size: clamp(30px, 6vw, 50px); }
.hero .lead { position: relative; margin-top: 10px; max-width: 46ch; color: var(--on-dark-soft); font-size: 18px; }
.hero .motto { position: relative; margin-top: 14px; font-family: var(--f-head); font-weight: 500; color: var(--on-dark-pink); font-size: 17px; }
.hero .rule { position: relative; width: 72px; height: 5px; background: var(--pink); border-radius: 3px; margin-top: 18px; }

/* بحث */
.search { position: relative; margin-top: 22px; max-width: 560px; }
.search label { display: block; font-family: var(--f-head); font-weight: 500; font-size: 15px; margin-bottom: 6px; }
.hero .search label { color: var(--on-dark); }
.search input {
  width: 100%; padding: 12px 16px; border-radius: 12px;
  border: 1.5px solid #E4DFC8; color: var(--ink); min-height: 48px;
  background-color: #F2EFE2;

  var QBANK = {"s1": {"1": [{"q": "ما معنى العقيدة في اللغة كما ورد في المحاضرة؟", "options": ["العبادة الظاهرة", "المعرفة النظرية المجردة", "الاتباع والتقليد", "العقد والربط والإبرام والإحكام"], "answer": 3, "why": "العقيدة في اللغة من العقد والربط والإبرام والإحكام، وهي الحكم الذي لا يقبل الشك لدى معتقده.", "ref": "ص 2"}, {"q": "متى يكون ما عقد الإنسان عليه قلبه اعتقادًا صحيحًا؟", "options": ["إذا ورثه عن آبائه", "إذا كان معتقده جازمًا به فقط", "إذا اعتقده أكثر الناس", "إذا كان موافقًا للواقع"], "answer": 3, "why": "كل ما عقد الإنسان عليه قلبه جازمًا به فهو عقيدة، فإن كان موافقًا للواقع فهو اعتقاد صحيح، وإن كان مخالفًا له فهو اعتقاد فاسد.", "ref": "ص 2"}, {"q": "لماذا كانت العقيدة السليمة أعظم المطالب وأولاها بالتقديم؟", "options": ["لأنها تتعلق بالآخرة فقط", "لأنها تُغني عن العمل", "لأنها الغاية من الوجود كله، وبها صلاح الناس أفرادًا وجماعات", "لأنها خاصة بالعلماء"], "answer": 2, "why": "العقيدة السليمة هي الغاية من الوجود كله، وبها صلح الناس فرادى وجماعات، وهي الصلة الحقيقية بين الإنسان وخالقه.", "ref": "ص 3"}, {"q": "بأي آية استدلت المحاضرة على أن التوحيد يعين على تكوين الشخصية المتزنة الموحدة الغاية؟", "options": ["﴿ألا بذكر الله تطمئن القلوب﴾", "﴿هو الذي أنزل السكينة في قلوب المؤمنين﴾", "﴿ونبلوكم بالشر والخير فتنة﴾", "﴿أأرباب متفرقون خير أم الله الواحد القهار﴾"], "answer": 3, "why": "استشهدت المحاضرة بقول يوسف عليه السلام: ﴿أأرباب متفرقون خير أم الله الواحد القهار﴾ على أن الموحِّد له إله واحد يتجه إليه في الخلوة والجلوة.", "ref": "ص 4"}, {"q": "من آثار العقيدة الصحيحة على النفس:", "options": ["الانشغال بإرضاء الآخرين", "انشراح الصدر وطمأنينة القلب", "كثرة التعلق بالناس", "الخوف الدائم من المستقبل"], "answer": 1, "why": "من آثار العقيدة على النفس انشراح الصدر وطمأنينة القلب، لقوله تعالى: ﴿أفمن شرح الله صدره للإسلام فهو على نور من ربه﴾.", "ref": "ص 5"}, {"q": "ما معنى أن التوحيد «تحرير للإنسان»؟", "options": ["تحريره من كل عبودية إلا لربه الذي خلقه فسواه", "تحريره من التكاليف الشرعية", "تحريره من الأسرة والمسؤوليات", "تحريره من الحاجة إلى العلم"], "answer": 0,  الإسلام، والإيمان الصادق يرسّخ بنيان الأسر فلا تهزها رياح الفتن.", "ref": "ص 2"}, {"q": "على أي شيء يدل قوله تعالى: ﴿ولهن مثل الذي عليهن بالمعروف﴾ في ضوء المحاضرة؟", "options": ["أن الله لم يترك العلاقة الزوجية لأهواء البشر وأعرافهم بل ضبطها بميزان إلهي حكيم", "أن العشرة بالمعروف مستحبة فقط", "أن العلاقة الزوجية متروكة لأعراف كل مجتمع", "أن الحقوق بين الزوجين غير متقابلة"], "answer": 0, "why": "الله سبحانه لم يترك العلاقة الزوجية لأهواء البشر وأعرافهم، بل ضبطها بميزان إلهي حكيم، فلهن من الحقوق مثل ما عليهن بالمعروف.", "ref": "ص 3"}, {"q": "العشرة بالمعروف بين الزوجين:", "options": ["فضل وإحسان لا يجب", "تكون في حال البقاء فقط دون المفارقة", "أمر إلهي يشمل المعاشرة القولية والفعلية", "تخص الزوج دون الزوجة"], "answer": 2, "why": "العشرة بالمعروف أمر إلهي ﴿وعاشروهن بالمعروف﴾، وتشمل المعاشرة القولية والفعلية، وتكون في حال البقاء وحتى عند المفارقة.", "ref": "ص 4"}, {"q": "ما معنى قوله ﷺ: «لا يفرك مؤمن مؤمنة، إن كره منها خلقًا رضي منها آخر»؟", "options": ["لا يبغضها بغضًا كليًا يحمله على فراقها، بل يغفر سيئاتها لحسناتها", "يجب أن يفارقها إذا كره منها خلقًا", "الحديث خاص بالخِطبة", "لا يجوز له أن يكره منها شيئًا"], "answer": 0, "why": "المعنى: لا يبغضها بغضًا كليًا يحمله على فراقها، بل يغفر سيئاتها لحسناتها ويتغاضى عما يكره لما يحب، وكذلك تفعل المرأة مع زوجها.", "ref": "ص 5"}, {"q": "ما العلاقة بين تقوى الوالدين وحال الذرية كما بينت المحاضرة؟", "options": ["تقوى الوالدين وقولهم السديد سبب في حفظ الذرية وصلاحها", "صلاح الذرية يتوقف على المال فقط", "لا علاقة بينهما", "التقوى تنفع الوالدين دون أولادهم"], "answer": 0, "why": "مداومة الوالدين على التقوى ورعاية القول السديد سبب في حفظ الذرية وصلاحها لقوله تعالى: ﴿وليخش الذين لو تركوا من خلفهم ذرية ضعافًا...﴾.", "ref": "ص 5"}, {"q": "ماذا قال النبي ﷺ للأقرع بن حابس حين تعجب من تقبيله الحسن؟", "options": ["«اتقوا الله واعدلوا بين أولادكم»", "«خيركم خيركم لأهله»", "«من لا يَرحم لا يُرحم»", "«استوصوا بالنساء خيرًا»"], "answer": 2, "why": "لما أخبره الأقرع أن له عشرة من الولد ما قبّل منهم أحدًا قال ﷺ: «من لا يَرحم لا يُرحم»، فالعقيدة تحث على الرحمة.", "ref": "ص 6"}, {"q": "عند حصول الخلاف بين الزوجين، ما الرابطة الأسبق التي ينبغي أن يتذكراها؟", "options": ["رابطة القرابة", "رابطة الإيمان", "رابطة المصلحة", "رابطة الجوار"], "answer": 1, "why": "على الزوجين أن يتذكرا أن هناك رابطة أسبق من رابطة الزواج هي رابطة الإيمان، ولكل منهما حقوق تُستحضر عند معالجة المشكلة.", "ref": "ص 7"}, {"q": "ما الذي يعلمه الإيمان للزوجين عن غاية الشيطان؟", "options": ["أنه لا يتدخل في الحياة الزوجية", "أن غايته صرف الأبناء فقط", "أن غايته إفساد المال", "أن من أعظم أمانيه التحريش والتفريق بين الزوجين"], "answer": 3, "why": "في الحديث أن إبليس يدني منه من يقول: ما تركته حتى فرقت بينه وبين امرأته، فعلى الزوجين قطع طريقه بالإصلاح والاستعاذة بالله.", "ref": "ص 8"}, {"q": "كيف يعزز الإيمان الأمن المالي في الأسرة؟", "options": ["بإسقاط حق الزوجة في المهر", "بمنع الادخار", "بحفظ حق الزوجة ومهرها، وحق الأسرة في النفقة، وحفظ الحقوق بعد الوفاة بأحكام الميراث والوصية", "بجعل المال كله بيد الزوجة"], "answer": 2, "why": "الإيمان يعزز الأمن المالي بحفظ مهر الزوجة وحقوق الزوج، وحق الأسرة في النفقة والكفاية، ويحفظ ذلك حتى بعد الوفاة بأحكام الميراث والوصية.", "ref": "ص 9"}, {"q": "من مظاهر البيت الغافل ضعيف العقيدة في المقارنة التي عرضتها المحاضرة:", "options": ["مركزية الدنيا غالبة ومركزية الآخرة مهمشة، والانتصار للذات عند الخلاف", "الرجوع إلى الله ورسوله عند الخلاف", "أن الزواج عنده عبادة وقربة", "رد الإساءة بالإحسان"], "answer": 0, "why": "البيت الغافل تغلب فيه مركزية الدنيا وتُهمّش الآخرة، ومرجعيته عند الخلاف الهوى والأنانية والانتصار للذات، فيتفكك لأوهن عارض.", "ref": "ص 13"}], "3": [{"q": "ما تعريف الإيمان بالله تعالى (التوحيد) كما ورد في المحاضرة؟", "options": ["الإيمان بوحدانية الله سبحانه في ربوبيته وألوهيته وأسمائه وصفاته", "أداء العبادات الظاهرة", "الإيمان بوجود الله فقط", "الإقرار بأن الله هو الخالق الرازق فقط"], "answer": 0, "why": "الإيمان بالله (التوحيد) هو الإيمان بوحدانية الله سبحانه في ربوبيته وألوهيته وأسمائه وصفاته، وهو أصل أصول الإيمان.", "ref": "ص 2"}, {"q": "ما الغرض من تقسيم التوحيد إلى ثلاثة أقسام؟", "options": ["التفريق بين أقسام لا علاقة بينها", "إحداث أمر جديد في الدين", "تقليد مناهج الفلاسفة", "تقسيم اصطلاحي علمي لتيسير التعلم وفهم النصوص، أُخذ بالاستقراء التام لنصوص الكتاب والسنة"], "answer": 3, "why": "التقسيم الثلاثي اصطلاحي علمي لتسهيل الفهم، أخذه أهل العلم بالاستقراء التام والتتبع الدقيق لنصوص الكتاب والسنة.", "ref": "ص 4"}, {"q": "ما معنى قوله تعالى: ﴿وما يؤمن أكثرهم بالله إلا وهم مشركون﴾ كما فسّره ابن عباس؟", "options": ["أنهم يعبدون الله وحده", "أنهم ينكرون وجود الله", "أنهم لا يعرفون من خلق السماوات", "أنهم يقرّون بأن الله الخالق الرازق، ثم يشركون معه غيره في العبادة"], "answer": 3, "why": "إذا قيل لهم من خلق السماء والأرض قالوا: الله، وهم مع ذلك يشركون معه في العبادة الأوثان والأصنام.", "ref": "ص 5"}, {"q": "لماذا لم يُدخل إقرارُ المشركين بالربوبية في الإسلام؟", "options": ["لأن الربوبية ليست من التوحيد", "لأن إقرارهم كان كاذبًا", "لأنهم لم يحققوا لازم توحيد الربوبية وهو توحيد الله في العبادة", "لأنهم لم يعرفوا أسماء الله"], "answer": 2, "why": "مع إقرارهم العام بالربوبية حكم الله بأنهم مشركون لأنهم لم يحققوا لازمه وهو إفراد الله بالعبادة.", "ref": "ص 6"}, {"q": "من النشاط العملي في المحاضرة: إعادة صياغة عبارات شائعة في البيت مثل:", "options": ["«لولا فلان» و«الحظ» و«الصدفة» صياغةً عقدية تربط الأمر بالله", "عبارات التحية", "عبارات الشكر والثناء", "أسماء الأطفال"], "answer": 0, "why": "النشاط يطلب تدوين عبارات شائعة مثل «لولا فلان، الحظ، الصدفة» وإعادة صياغتها صياغة عقدية صحيحة تربط الأمر بالله.", "ref": "ص 7"}, {"q": "ماذا تسمى الطريقة الثانية في الاستدلال على الربوبية بالنظر في آيات الله في خلق الكون؟", "options": ["دلالة الإجماع", "دلالة القياس", "دلالة الآفاق", "دلالة الأنفس"], "answer": 2, "why": "النظر في آيات الله في خلق الكون يُعرف بدلالة الآفاق، لقوله تعالى: ﴿سنريهم آياتنا في الآفاق وفي أنفسهم﴾.", "ref": "ص 9"}, {"q": "أي العبارتين صحيحة في العلاقة بين نوعي التوحيد؟", "options": ["توحيد الربوبية يغني عن الألوهية", "توحيد الألوهية مستلزم لتوحيد الربوبية فقط", "لا علاقة بين الربوبية والألوهية", "توحيد الربوبية مستلزم لتوحيد الألوهية"], "answer": 3, "why": "توحيد الربوبية مستلزم لتوحيد الألوهية؛ فمن أقر بأن الله وحده الخالق المالك الرازق لزمه ألا يعبد إلا الله وحده.", "ref": "ص 10"}, {"q": "بماذا استشهدت المحاضرة على أن تربية الأبناء على التوحيد دأب الأنبياء؟", "options": ["بقصة قارون", "بقصة أصحاب الكهف", "بقصة موسى مع فرعون", "بدعاء إبراهيم عليه السلام: ﴿ربنا واجعلنا مسلمين لك ومن ذريتنا أمة مسلمة لك﴾"], "answer": 3, "why": "كان ذلك دأب الأنبياء، ومنه قول إبراهيم عليه السلام: ﴿ربنا واجعلنا مسلمين لك ومن ذريتنا أمة مسلمة لك﴾.", "ref": "ص 11"}, {"q": "ما المعاني التي بيّنها لقمان لابنه في قوله: ﴿يا بني إنها إن تك مثقال حبة من خردل...﴾؟", "options": ["أحكام الميراث", "معاني الربوبية من عظمة الخالق وقدرته وعلمه الذي لا تخفى عليه خافية", "أحكام الصلاة", "آداب الطعام"], "answer": 1, "why": "بيّن لقمان لابنه معاني الربوبية: عظمة الخالق في خلقه وملكه وقدرته وعلمه، فلا يعزب عنه مثقال ذرة.", "ref": "ص 12"}, {"q": "كيف تربط الأم النعم اليومية بتوحيد الربوبية عند طفلها؟", "options": ["بأن تبيّن له أن المنعم على الحقيقة هو الله، وتذكّره بحمده عند تجدد النعمة", "بأن تكتفي بشراء الهدايا", "بأن تنسب النعم إلى جهدها وحدها", "بأن تؤجل الحديث عن الله حتى يكبر"], "answer": 0, "why": "تبيّن الأم للطفل في كل نعمة أن المنعم على الحقيقة هو الله، فإذا لبس جديدًا وفرح به ذكّره أهله بحمد الله.", "ref": "ص 14"}], "4": [{"q": "ما معنى الألوهية التي اشتق منها توحيد الألوهية؟", "options": ["الملك الرازق", "صاحب الأسماء الحسنى فقط", "الخالق المدبر", "المعبود المطاع الذي تألهه القلوب وتخضع له وتذل"], "answer": 3, "why": "الألوهية مشتقة من اسم الإله، أي المعبود المطاع الذي يجب أن تألهه القلوب وتخضع له وتذل.", "ref": "ص 2"}, {"q": "ما محور الخصومة بين الرسل وأممهم كما بيّنت المحاضرة؟", "options": ["توحيد العبادة (الألوهية)", "توحيد الربوبية", "أمور الدنيا", "أحكام المعاملات"], "answer": 0, "why": "توحيد العبادة محور دعوات الرسل جميعًا، فما من رسول إلا كان أول ما يدعو إليه توحيد الله، فكانت الخصومة في ذلك.", "ref": "ص 4"}, {"q": "ما شرطا قبول العبادة؟", "options": ["الإخلاص والمتابعة للرسول ﷺ", "الكثرة والمداومة", "النية والاجتماع", "العلم والجهر بها"], "answer": 0, "why": "العبادة لا تُقبل إلا بشرطين: الإخلاص لله تعالى، والمتابعة للرسول ﷺ.", "ref": "ص 5"}, {"q": "تنقسم العبادة بحسب ما تقوم به من الأعضاء إلى:", "options": ["عبادات فردية وجماعية", "عبادات القلب، وعبادات اللسان، وعبادات الجوارح", "عبادات مالية وبدنية فقط", "فرائض ونوافل فقط"], "answer": 1, "why": "العبادة بحسب الأعضاء ثلاثة أقسام: عبادات القلب كالمحبة والخوف، وعبادات اللسان كالذكر، وعبادات الجوارح كالصلاة والصيام.", "ref": "ص 6"}, {"q": "ما المعنى العام للشرك في الشرع؟", "options": ["ترك النوافل", "تسوية غير الله بالله فيما هو من خصائصه سبحانه، في الربوبية أو الألوهية أو الأسماء والصفات", "مخالفة العادات", "كثرة الذنوب"], "answer": 1, "why": "الشرك لغةً التسوية بين الشيئين، ومعناه العام شرعًا: تسوية غير الله بالله فيما هو من خصائصه سبحانه.", "ref": "ص 7"}, {"q": "من أطاع المخلوقين في تحليل ما حرم الله أو تحريم ما أحل الله معتقدًا ذلك بقلبه، فقد وقع في:", "options": ["الشرك الأصغر", "البدعة الإضافية", "نفاق العمل", "شرك الطاعة"], "answer": 3, "why": "شرك الطاعة أن يطيع المخلوقين في تحليل ما حرم الله أو تحريم ما أحل الله ويعتقد ذلك بقلبه، وهو من الشرك الأكبر.", "ref": "ص 8"}, {"q": "من الفروق بين الشرك الأكبر والأصغر:", "options": ["الأكبر مخرج من الملة ومحبط لجميع الأعمال، والأصغر لا يخرج من الملة ولا يحبط إلا العمل الذي قارنه", "الأكبر لا يُخلَّد صاحبه في النار", "الأصغر يُحبط جميع الأعمال", "لا فرق بينهما في الحكم"], "answer": 0, "why": "الشرك الأكبر محبط لجميع الأعمال مخرج من الملة وصاحبه خالد في النار، أما الأصغر فلا يحبط إلا العمل الذي قارنه ولا يخرج من الملة.", "ref": "ص 9"}, {"q": "النفاق العملي:", "options": ["كفر أصغر لا ينقل من الملة، لكنه جرم كبير", "ليس من الذنوب", "كفر أكبر ناقل عن الملة", "هو تكذيب الرسول ﷺ"], "answer": 0, "why": "النفاق ضربان: نفاق اعتقاد وهو كفر أكبر، ونفاق عملي وهو كفر أصغر لا ينقل من الملة لكنه جرم عظيم.", "ref": "ص 10"}, {"q": "لماذا شُرعت زيارة القبور بعد النهي عنها؟", "options": ["للتبرك بالتراب", "لأنها ترقّ القلب وتدمع العين وتذكّر الآخرة", "لاتخاذها عيدًا", "لطلب الحاجات من الأموات"], "answer": 1, "why": "قال ﷺ: «كنت نهيتكم عن زيارة القبور ألا فزوروها؛ فإنها ترق القلب وتدمع العين وتذكر الآخرة، ولا تقولوا هجرًا».", "ref": "ص 13"}, {"q": "من التوسل المشروع:", "options": ["التوسل بالأموات وطلب الدعاء منهم", "التوسل بالقبور", "التوسل بالتمائم", "التوسل إلى الله بعمل صالح قام به العبد، كأن يقول: اللهم بإيماني بك اغفر لي"], "answer": 3, "why": "من التوسل المشروع التوسل إلى الله بعمل صالح قام به العبد، كقول: «اللهم بإيماني بك ومحبتي لك واتباعي لرسولك اغفر لي».", "ref": "ص 15"}], "5": [{"q": "ما تعريف توحيد الأسماء والصفات؟", "options": ["التوقف في معاني الصفات كلها", "إثبات ما أثبته الله لنفسه وما أثبته له رسوله ﷺ، ونفي ما نفياه، مع الإقرار بمعانيها الصحيحة واستشعار آثارها", "الإيمان بالأسماء دون الصفات", "تأويل الصفات بما يوافق العقل"], "answer": 1, "why": "توحيد الأسماء والصفات إثبات ما أثبته الله لنفسه وأثبته له رسوله ﷺ ونفي ما نفياه، مع الإقرار بمعانيها الصحيحة واستشعار آثارها.", "ref": "ص 2"}, {"q": "لماذا كان توحيد الأسماء والصفات شاملًا للنوعين الآخرين معًا؟", "options": ["لأنه يغني عن العبادة", "لأنه خاص بالعلماء", "لأنه أسهل الأنواع", "لأنه يقوم على إفراد الله بكل ما له من الأسماء الحسنى والصفات العلى، ومنها الرب والخالق والرازق والملك"], "answer": 3, "why": "توحيد الأسماء والصفات شامل للنوعين لأنه يقوم على إفراد الله بكل أسمائه وصفاته، ومن جملتها الرب والخالق والرازق والملك.", "ref": "ص 3"}, {"q": "لماذا لا يمكن لأحد أن يعبد الله على الوجه الأكمل دون علم بأسمائه وصفاته؟", "options": ["لأن العبادة تكون على بصيرة بمعرفة الأسماء والصفات، قال تعالى: ﴿ولله الأسماء الحسنى فادعوه بها﴾", "لا علاقة بين العبادة ومعرفة الأسماء", "لأن الصفات خاصة بالآخرة", "لأن الأسماء تغني عن العبادات"], "answer": 0, "why": "لا يمكن أن يعبد الله على الوجه الأكمل حتى يكون على علم بأسمائه وصفاته ليعبده على بصيرة: ﴿فادعوه بها﴾.", "ref": "ص 4"}, {"q": "تفسير «استوى» في قوله تعالى: ﴿الرحمن على العرش استوى﴾ بـ«استولى» من أمثلة:", "options": ["التحريف اللفظي", "التمثيل", "التكييف", "التحريف المعنوي"], "answer": 0, "why": "التحريف اللفظي يكون بالزيادة أو النقص أو تغيير الحركة في الكلمة، كتحريف «استوى» إلى «استولى».", "ref": "ص 7"}, {"q": "من فسّر «اليد» لله تعالى بالقوة أو النعمة فقد وقع في:", "options": ["التحريف المعنوي", "الإثبات الصحيح", "التحريف اللفظي", "التفويض المشروع"], "answer": 0, "why": "التحريف المعنوي تفسير اللفظ على غير مراد الله ورسوله منه، كتفسير اليد بالقوة أو النعمة، وهو تفسير باطل.", "ref": "ص 7"}, {"q": "لماذا يُقطع الطمع عن إدراك كيفية صفات الله تعالى؟", "options": ["لأن إدراك المخلوق لكيفيتها مستحيل", "لأن ذلك يحتاج إلى وقت طويل", "لأن الصفات غير ثابتة", "لأن معانيها مجهولة تمامًا"], "answer": 0, "why": "من القواعد قطع الطمع عن إدراك حقيقة كيفية صفات الله لأن إدراك المخلوق لذلك مستحيل.", "ref": "ص 8"}, {"q": "ما معنى أن أسماء الله كلها حسنى؟", "options": ["أنها بالغة في الحسن والجمال والكمال غايته، متضمنة لصفات كاملة لا نقص فيها", "أنها تُعرف بالعقل وحده", "أنها كثيرة العدد", "أنها مشتقة من أسماء المخلوقين"], "answer": 0, "why": "أسماء الله كلها حسنى أي بالغة في الحسن والكمال غايته، لدلالتها على أشرف مسمى وتضمنها صفات كاملة لا نقص فيها.", "ref": "ص 8"}, {"q": "قال الإمام أحمد رحمه الله في منهج إثبات الصفات:", "options": ["يُتوقف في جميع الصفات", "لا يوصف الله إلا بما وصف به نفسه أو وصفه به رسوله، لا يتجاوز القرآن والحديث", "يُوصف الله بما يراه العقل حسنًا", "تُثبت الأسماء وتُنفى الصفات"], "answer": 1, "why": "قال الإمام أحمد: «لا يوصف الله إلا بما وصف به نفسه أو وصفه به رسوله، لا يتجاوز القرآن والحديث».", "ref": "ص 9"}, {"q": "كيف نقرّب للطفل معنى اسمَي الله «الرحمن الرحيم»؟", "options": ["بتخويفه من العقاب", "بتأجيل ذلك حتى البلوغ", "بتحفيظه التعريف دون شرح", "بمشهد بصري لصورة من صور الرحمة كأم تعطف على أولادها، ونخبره أن الله أرحم بنا من الأم بولدها"], "answer": 3, "why": "نستخدم وصفًا أو مشهدًا بصريًا لصورة من صور الرحمة كأم تعطف على أولادها، ونخبره أن الله أرحم بنا من الأم بولدها.", "ref": "ص 11"}, {"q": "ما التوجيه في الموازنة بين الترغيب والترهيب في مرحلة الطفولة؟", "options": ["الإكثار من الحديث عن العذاب والنار", "يغلب جانب الترغيب، مع الإشارة إلى عدل الله دون قرن ذكره بالقسوة والتعذيب", "الاقتصار على الترهيب", "عدم ذكر الله للطفل"], "answer": 1, "why": "يراعى أن تُذكر للطفل معاني الأسماء والصفات من خلال مواقف محببة، فيغلب جانب الترغيب، دون إغفال الإشارة إلى عدل الله.", "ref": "ص 14"}], "6": [{"q": "من أي شيء أُخذت كلمة «الملائكة» لغةً؟", "options": ["من المُلك", "من الألوك وهي الرسالة", "من الملاحة", "من التمليك"], "answer": 1, "why": "الملائكة جمع مَلَك، أُخذ من «الألوك» وهي الرسالة.", "ref": "ص 2"}, {"q": "من صفات الملائكة كما عرّفتهم المحاضرة:", "options": ["يتناسلون كالبشر", "خُلقوا من نار", "لهم أجسام نورانية لطيفة قادرة على التشكل والتمثل بالصور الكريمة", "لهم اختيار في عصيان الله"], "answer": 2, "why": "الملائكة خلق من مخلوقات الله، لهم أجسام نورانية لطيفة قادرة على التشكل والتمثل والتصور بالصور الكريمة، ولهم قوى عظيمة.", "ref": "ص 2"}, {"q": "ماذا أخبر النبي ﷺ عن ملك من حملة العرش؟", "options": ["أن له جناحين فقط", "أن ما بين شحمة أذنه إلى عاتقه مسيرة سبعمائة عام", "أنه يسكن الأرض", "أنه أصغر الملائكة"], "answer": 1, "why": "قال ﷺ: «أُذن لي أن أحدث عن ملك من ملائكة الله من حملة العرش، إن ما بين شحمة أذنه إلى عاتقه مسيرة سبعمائة عام».", "ref": "ص 3"}, {"q": "أين مساكن الملائكة؟", "options": ["في السماء، ويهبطون إلى الأرض تنفيذًا لأمر الله", "بين الناس دائمًا", "في الأرض", "في البحار"], "answer": 0, "why": "من خصائص الملائكة أن مساكنهم في السماء، وإنما يهبطون إلى الأرض تنفيذًا لأمر الله فيما أُسند إليهم.", "ref": "ص 4"}, {"q": "ما منزلة الإيمان بالملائكة؟", "options": ["ركن من أركان الإيمان لا يتحقق الإيمان إلا به", "خاص بالعلماء", "مستحب لا يجب", "من فروع الفقه"], "answer": 0, "why": "الإيمان بالملائكة ركن من أركان الإيمان لا يتحقق الإيمان إلا به، لقوله تعالى: ﴿كل آمن بالله وملائكته وكتبه ورسله﴾.", "ref": "ص 5"}, {"q": "هل يجوز صرف شيء من العبادة للملائكة لعلو منزلتهم؟", "options": ["يجوز دعاؤهم فقط", "يجوز في الشدائد", "نعم، لقربهم من الله", "لا، بل يجب إخلاص العبادة لخالقهم وخالق الخلق أجمعين"], "answer": 3, "why": "لا يجوز صرف شيء من أنواع العبادة للملائكة، قال تعالى: ﴿ولا يأمركم أن تتخذوا الملائكة والنبيين أربابًا﴾.", "ref": "ص 7"}, {"q": "من الملك الموكل بالنفخ في الصور؟", "options": ["جبريل عليه السلام", "ميكائيل عليه السلام", "إسرافيل عليه السلام", "مالك خازن النار"], "answer": 2, "why": "إسرافيل عليه السلام هو الموكل بالصور، وهو قرن عظيم يُنفخ فيه، وبه تعود الأرواح إلى أجسادها.", "ref": "ص 8"}, {"q": "الملكان الموكلان بسؤال العباد في قبورهم هما:", "options": ["منكر ونكير", "رقيب وعتيد", "هاروت وماروت", "جبريل وميكائيل"], "answer": 0, "why": "من الملائكة الموكلون بفتنة القبر وسؤال العباد فيها، وهما منكر ونكير.", "ref": "ص 10"}, {"q": "من ثمرات الإيمان بالملائكة:", "options": ["طلب الحوائج منهم", "التأسي بهم في دوام طاعتهم لله، وطمع المؤمن في دعائهم واستغفارهم له", "الخوف منهم دون الله", "الاستغناء عن العمل"], "answer": 1, "why": "من الثمرات التأسي بالملائكة في دوام طاعتهم وحسن عبادتهم، وطمع المؤمن في دعائهم واستغفارهم للمؤمنين.", "ref": "ص 11"}, {"q": "الملك الموكل بالقطر والنبات هو:", "options": ["إسرافيل عليه السلام", "جبريل عليه السلام", "ملك الموت", "ميكائيل عليه السلام"], "answer": 3, "why": "ميكائيل عليه السلام هو الملك الموكل بالقطر والنبات، وجبريل ملك الوحي، وإسرافيل الموكل بالنفخ في الصور.", "ref": "ص 15"}], "7": [{"q": "ما معنى الوحي في اللغة؟", "options": ["الخطاب العلني", "الكتابة المطوّلة", "الإعلام السريع الخفي", "الرؤيا المنامية فقط"], "answer": 2, "why": "الوحي في اللغة الإعلام السريع الخفي، ويطلق على الإشارة والكتابة والرسالة والإلهام.", "ref": "ص 2"}, {"q": "هل يختص الوحي بمعناه اللغوي بالأنبياء؟", "options": ["يختص بالعلماء", "نعم لا يكون إلا للأنبياء", "لا، فهو لا يختص بالأنبياء ولا بكونه من عند الله", "يختص بالملائكة"], "answer": 2, "why": "الوحي بمعناه اللغوي لا يختص بالأنبياء ولا بكونه من عند الله، فكل ما ألقيته على غيرك حتى علمه فهو وحي.", "ref": "ص 2"}, {"q": "في أي آية بيّن الله طرق تلقي الوحي؟", "options": ["﴿آمن الرسول بما أنزل إليه﴾", "﴿إنا نحن نزلنا الذكر﴾", "﴿وما كان لبشر أن يكلمه الله إلا وحيًا أو من وراء حجاب أو يرسل رسولًا﴾", "﴿اقرأ باسم ربك﴾"], "answer": 2, "why": "بيّن الله طرق تكليمه للبشر في سورة الشورى: ﴿وما كان لبشر أن يكلمه الله إلا وحيًا أو من وراء حجاب أو يرسل رسولًا﴾.", "ref": "ص 3"}, {"q": "من ثمرات الإيمان بالكتب:", "options": ["التشكيك في القرآن", "الاستغناء عن الرسل", "ظهور حكمة الله إذ شرع لكل أمة ما يناسبها، وكان القرآن خاتمها مناسبًا لجميع الخلق", "الاكتفاء بالكتب السابقة"], "answer": 2, "why": "من ثمرات الإيمان بالكتب شكر الله على لطفه، وظهور حكمته إذ شرع لكل أمة ما يناسبها، وكان خاتمها القرآن مناسبًا لكل عصر.", "ref": "ص 5"}, {"q": "ما العلاقة بين كتب الله كما قررت المحاضرة؟", "options": ["ينقض بعضها بعضًا في العقائد", "يصدّق بعضها بعضًا فلا تناقض بينها ولا تعارض", "لا علاقة بينها", "بينها تعارض في الأصول"], "answer": 1, "why": "من الإيمان بالكتب الإيمان بأن كتب الله يصدق بعضها بعضًا فلا تناقض بينها، والقرآن مصدق لما بين يديه ومهيمن عليه.", "ref": "ص 6"}, {"q": "أين ورد ذكر صحف إبراهيم وموسى في القرآن؟", "options": ["في سورتي النجم والأعلى", "في سورة الكهف", "في سورتي البقرة وآل عمران", "في سورة يوسف"], "answer": 0, "why": "ورد ذكر صحف إبراهيم وموسى في موضعين: سورة النجم ﴿أم لم ينبأ بما في صحف موسى﴾ وسورة الأعلى ﴿صحف إبراهيم وموسى﴾.", "ref": "ص 7"}, {"q": "لماذا غضب النبي ﷺ حين رأى مع عمر كتابًا من بعض أهل الكتاب؟", "options": ["لأنه كان مكتوبًا بغير العربية", "لأن الكتاب كان قديمًا", "لأنه ﷺ جاء بالشريعة بيضاء نقية، ونهى عن سؤال أهل الكتاب لئلا يُكذَّب حق أو يُصدَّق باطل", "لأن عمر لم يستأذن"], "answer": 2, "why": "قال ﷺ: «لقد جئتكم بها بيضاء نقية، لا تسألوهم عن شيء فيخبروكم بحق فتكذبوا به أو بباطل فتصدقوا به».", "ref": "ص 8"}, {"q": "ما الذي يميّز القرآن من بين الكتب الإلهية في الحفظ؟", "options": ["أنه أقدمها نزولًا", "أنه نزل على أمة واحدة", "أنه لم يُكتب", "أنه الكتاب الوحيد الذي تكفل الله بحفظه"], "answer": 3, "why": "القرآن هو الكتاب الوحيد من بين الكتب الإلهية الذي تكفل الله بحفظه، بخلاف التوراة والإنجيل اللذين دخلهما التحريف.", "ref": "ص 10"}, {"q": "ما سر الفرق بين القرآن والكتب السماوية الأخرى في الحفظ؟", "options": ["أن الكتب السابقة لم تكن من عند الله", "أن القرآن نزل جملة واحدة", "أن القرآن أقصر", "أن الكتب السابقة جاءت على التوقيت، والقرآن جاء على التأبيد مصدقًا لما قبله ومهيمنًا عليه"], "answer": 3, "why": "سائر الكتب السماوية جيء بها على التوقيت لا التأبيد، أما القرآن فجيء به مصدقًا لما قبله ومهيمنًا عليه، فكان سادًّا مسدها.", "ref": "ص 13"}, {"q": "كيف تربي الأم أولادها على التعامل مع القرآن؟", "options": ["بتركه للكبار فقط", "بتبجيله وإكرامه وصيانته وألا يمسوه إلا على طهارة، وجعله مرجعًا لإجاباتهم", "بقراءته في المناسبات فقط", "بحفظه دون فهم أو توقير"], "answer": 1, "why": "نعلمهم تبجيل القرآن وإكرامه وصيانته وألا يمسوه إلا على طهارة، ونعوّدهم البحث عن إجاباتهم فيه.", "ref": "ص 16"}], "8": [{"q": "ما حكم من كذّب بالرسل أو بأحد منهم؟", "options": ["معذور بجهله دائمًا", "كافر بالله العظيم كفرًا صريحًا مخرجًا من الملة", "عاصٍ لا يكفر", "مبتدع فقط"], "answer": 1, "why": "الإيمان بالرسل ركن من أركان الإيمان، ومن كذب بالرسل أو بأحد منهم فهو كافر بالله العظيم كفرًا صريحًا مخرجًا من الملة.", "ref": "ص 3"}, {"q": "من ثمرات الإيمان بالرسل:", "options": ["عبادة الرسل", "العلم برحمة الله وعنايته بخلقه حيث أرسل إليهم الرسل لهدايتهم", "الاستغناء عن العبادة", "ترك اتباعهم بعد موتهم"], "answer": 1, "why": "من ثمرات الإيمان بالرسل العلم برحمة الله وعنايته بخلقه حيث أرسل إليهم الرسل يهدونهم إلى صراطه.", "ref": "ص 3"}, {"q": "ما أرجح الأقوال في الفرق بين النبي والرسول؟", "options": ["النبي من أوحي إليه بشرع يعمل به ويأمر به المؤمنين، والرسول من أوحي إليه وأُرسل إلى من خالف أمر الله ليبلغه", "لا فرق بينهما", "الرسول لا يوحى إليه", "النبي من الملائكة والرسول من البشر"], "answer": 0, "why": "الأرجح أن النبي من أوحى الله إليه بما يفعله ويأمر به المؤمنين، والرسول من أوحى الله إليه وأرسله إلى من خالف أمر الله.", "ref": "ص 4"}, {"q": "كم عدد الأنبياء والرسل المذكورين في القرآن؟", "options": ["أربعون", "خمسة وعشرون", "عشرة", "ثلاثمائة وثلاثة عشر"], "answer": 1, "why": "المذكورون في القرآن من الأنبياء والرسل خمسة وعشرون، ويُؤمن بهم إيمانًا مفصلًا.", "ref": "ص 6"}, {"q": "من هم أولو العزم من الرسل على القول المشهور؟", "options": ["داود وسليمان ويونس", "آدم ونوح وإدريس", "يوسف ويعقوب وإسحاق", "نوح وإبراهيم وموسى وعيسى ومحمد عليهم الصلاة والسلام"], "answer": 3, "why": "أولو العزم ذوو الحزم والصبر، وقيل هم خمسة: نوح وإبراهيم وموسى وعيسى ومحمد عليهم الصلاة والسلام.", "ref": "ص 8"}, {"q": "من خصائص نبينا محمد ﷺ:", "options": ["أنه لم يُؤمر بالبلاغ", "أن رسالته لقومه خاصة", "أنه لا شفاعة له", "عموم رسالته لكافة الثقلين من الجن والإنس"], "answer": 3, "why": "من خصائصه ﷺ عموم رسالته للثقلين: ﴿وما أرسلناك إلا كافة للناس بشيرًا ونذيرًا﴾.", "ref": "ص 9"}, {"q": "ما الشفاعة العظمى التي اختص بها النبي ﷺ؟", "options": ["شفاعته في دخول الجنة بلا حساب فقط", "شفاعته لأهل الموقف أن يقضي بينهم ربهم بعد أن يتدافعها أفضل الرسل، وهي المقام المحمود", "شفاعته للملائكة", "شفاعته لعمه أبي طالب"], "answer": 1, "why": "الشفاعة العظمى شفاعته ﷺ لأهل الموقف أن يقضي بينهم ربهم بعد أن يتدافعها الرسل، وهي المقام المحمود.", "ref": "ص 10"}, {"q": "ما منزلة محبة النبي ﷺ؟", "options": ["مستحبة فقط", "تتساوى مع محبة سائر الناس", "خاصة بالصحابة", "واجبة ومقدمة على محبة الناس كلهم من الأبناء والآباء بل على محبة المرء لنفسه"], "answer": 3, "why": "محبته ﷺ واجبة مقدمة على محبة الناس كلهم، بل على محبة المرء لنفسه.", "ref": "ص 11"}, {"q": "لماذا ينبغي ملء حاجة الأولاد إلى القدوة بسير الأنبياء؟", "options": ["لأن الأطفال لا يقتدون بأحد", "لأن الاقتداء حاجة مركوزة في فطرهم، والأنبياء أحق الناس بالتأسي", "لأن ذلك يغني عن تعليم الصلاة", "لأن القصص للتسلية فقط"], "answer": 1, "why": "نفوس الأولاد متطلعة إلى الاقتداء وهي حاجة مركوزة في فطرهم، فإذا ملئت بسير الأنبياء تعلموا أنهم أحق الناس بالتأسي.", "ref": "ص 12"}, {"q": "من الوسائل العملية المقترحة لمتابعة تطبيق الأولاد للسنن:", "options": ["الاكتفاء بالموعظة مرة واحدة", "معاقبتهم عند النسيان", "«دفتر السنن» اليومي ولوحة إنجازات أسبوعية مع مكافآت رمزية", "مقارنتهم بغيرهم"], "answer": 2, "why": "من الوسائل «دفتر السنن» اليومي يسجل فيه الطفل السنن التي طبقها، ولوحة إنجازات أسبوعية مع مكافآت رمزية.", "ref": "ص 18"}], "9": [{"q": "ما معنى الإيمان باليوم الآخر؟", "options": ["انتظار الموت دون عمل", "الإيمان بالجنة دون النار", "التصديق الجازم بإتيانه لا محالة والعمل بموجب ذلك، ويدخل فيه الإيمان بأشراط الساعة وما بعد الموت", "معرفة أن الدنيا ستنتهي فقط"], "answer": 2, "why": "الإيمان باليوم الآخر التصديق الجازم بإتيانه لا محالة والعمل بموجب ذلك، ويدخل فيه أشراط الساعة وفتنة القبر وما بعدها.", "ref": "ص 2"}, {"q": "لماذا سمي اليوم الآخر بهذا الاسم كما قال ابن عثيمين؟", "options": ["لأنه لا يوم بعده، فهو آخر مراحل بني آدم الأربع", "لأنه يأتي بعد الربيع", "لأنه آخر أيام الحج", "لأنه آخر أيام الأسبوع"], "answer": 0, "why": "سمي آخرًا لأنه لا يوم بعده؛ فللإنسان أربع دور: بطن أمه، والدنيا، والبرزخ، ويوم القيامة وهو آخرها.", "ref": "ص 3"}, {"q": "من آثار الإيمان باليوم الآخر على الفرد:", "options": ["يقطع صلته بالدنيا تمامًا", "يدفعه إلى الكسل", "يجعله يرتع في حياته بلا رادع", "يجعل لحياته هدفًا وغاية، ويُعليه على رغبات نفسه ويكبح جماحها"], "answer": 3, "why": "الإيمان باليوم الآخر يجعل لحياة المرء هدفًا وغاية، ويعليه على رغبات نفسه ويجعلها قادرة على مواجهة الإغراءات.", "ref": "ص 4"}, {"q": "من أشراط الساعة التي وقعت: خروج نار من أرض الحجاز، ومن صفتها في الحديث:", "options": ["تحرق مكة", "تضيء لها أعناق الإبل ببصرى", "تخرج من اليمن", "تسوق الناس إلى المحشر"], "answer": 1, "why": "قال ﷺ: «لا تقوم الساعة حتى تخرج نار من أرض الحجاز تضيء أعناق الإبل ببصرى»، وقد خرجت كما أخبر.", "ref": "ص 6"}, {"q": "المهدي الذي أخبر به النبي ﷺ من صفته:", "options": ["رجل من بني إسرائيل", "رجل من أهل بيته يواطئ اسمه اسم النبي ﷺ واسم أبيه اسم أبيه، يملأ الأرض قسطًا وعدلًا", "ملك من الملائكة", "نبي يأتي بشريعة جديدة"], "answer": 1, "why": "في الحديث: رجل من أهل بيتي يواطئ اسمه اسمي واسم أبيه اسم أبي، يملأ الأرض قسطًا وعدلًا كما ملئت ظلمًا وجورًا.", "ref": "ص 7"}, {"q": "من علامات الساعة الكبرى «الدخان»، وهو:", "options": ["انبعاث دخان عظيم من السماء يغشى الناس ويعمهم", "دخان الحروب", "غبار الرياح", "دخان المصانع"], "answer": 0, "why": "الدخان دخان عظيم ينبعث من السماء يغشى الناس ويعمهم، لقوله تعالى: ﴿فارتقب يوم تأتي السماء بدخان مبين﴾.", "ref": "ص 8"}, {"q": "كيف تقع أشراط الساعة الكبرى بحسب الحديث؟", "options": ["لا ترتيب لها ولا تتابع", "كلها في يوم واحد", "متفرقة بين كل واحدة وأخرى قرون", "متتابعة كتتابع الخرز في النظام، إذا ظهرت إحداها تبعتها الأخرى"], "answer": 3, "why": "قال ﷺ: «خروج الآيات بعضها على إثر بعض يتتابعن كما تتابع الخرز في النظام».", "ref": "ص 9"}, {"q": "على أي شيء يقع نعيم القبر وعذابه؟", "options": ["لا يقع شيء في القبر", "على الجسد وحده", "على الروح وحدها", "على الروح والجسد جميعًا"], "answer": 3, "why": "دلت الأحاديث على وقوع النعيم أو العذاب في القبر على الروح والجسد جميعًا، فلفظ «العبد» مسمى للروح والجسد.", "ref": "ص 11"}, {"q": "كيف يكون البعث كما جاء في السنة؟", "options": ["يُخلق الناس خلقًا جديدًا لا صلة له بالأول", "تعود الأرواح دون الأجساد", "ينزل الله من السماء ماء فينبت به أهل القبور كما ينبت البقل", "يكون البعث للمؤمنين فقط"], "answer": 2, "why": "جاء في حديث أبي هريرة أن الله ينزل من السماء ماء فينبتون كما ينبت البقل، وأن ما بين النفختين أربعون.", "ref": "ص 13"}, {"q": "بأي دليل رد الله على من قال: ﴿من يحيي العظام وهي رميم﴾؟", "options": ["﴿اقتربت الساعة وانشق القمر﴾", "﴿قل يحييها الذي أنشأها أول مرة﴾", "﴿إذا زلزلت الأرض زلزالها﴾", "﴿ونضع الموازين القسط﴾"], "answer": 1, "why": "رد الله عليه بدليل شرعي عقلي: ﴿قل يحييها الذي أنشأها أول مرة﴾، و﴿وهو الذي يبدأ الخلق ثم يعيده وهو أهون عليه﴾.", "ref": "ص 14"}], "10": [{"q": "على أي حال يُحشر العباد إلى أرض المحشر؟", "options": ["بثيابهم التي ماتوا فيها", "على مراكب", "حفاة عراة غُرلًا", "متفرقين بلا حشر"], "answer": 2, "why": "دلت النصوص على حشر العباد بعد بعثهم إلى أرض المحشر حفاة عراة غرلًا.", "ref": "ص 2"}, {"q": "كيف يُحشر الكفار إلى النار؟", "options": ["مع المؤمنين", "يمشون على أقدامهم مبصرين", "ركبانًا", "على وجوههم عُميًا وبُكمًا وصُمًّا"], "answer": 3, "why": "الكفار يحشرون إلى النار على وجوههم عميًا وبكمًا وصمًّا: ﴿ونحشرهم يوم القيامة على وجوههم عميًا وبكمًا وصمًّا﴾.", "ref": "ص 3"}, {"q": "ما صفة الميزان الذي يجب الإيمان به؟", "options": ["هو العدل فقط", "ميزان حقيقي له لسان وكفتان توزن فيه أعمال العباد", "ميزان معنوي لا حقيقة له", "ميزان خاص بالكفار"], "answer": 1, "why": "الميزان ميزان حقيقي له لسان وكفتان، توزن فيه أعمال العباد فيرجح بمثقال ذرة من خير أو شر.", "ref": "ص 4"}, {"q": "ما الذي دل عليه حديث ساقي ابن مسعود الدقيقتين؟", "options": ["أن الصحابة كانوا أقوياء الأجسام", "أن الميزان للأعمال فقط", "أن العامل نفسه يوزن، وأن ساقيه في الميزان أثقل من جبل أُحد", "أن الأجسام لا توزن"], "answer": 2, "why": "ضحك الصحابة من دقة ساقيه فقال ﷺ: «والذي نفسي بيده لهما أثقل في الميزان من أحد»، فدل على وزن العامل نفسه.", "ref": "ص 5"}, {"q": "من شروط الشفاعة يوم القيامة:", "options": ["كثرة مال المشفوع له", "لا شروط لها", "رضا الله عن المشفوع له، ولا يرضى إلا لأهل التوحيد", "نسبه وقرابته"], "answer": 2, "why": "من شروط الشفاعة رضا الله عن المشفوع له: ﴿ولا يشفعون إلا لمن ارتضى﴾، ولا يرضى إلا لأهل التوحيد.", "ref": "ص 6"}, {"q": "أي أنواع شفاعة النبي ﷺ تخص عمه أبا طالب؟", "options": ["شفاعته في دخول الجنة بغير حساب", "شفاعته لأهل الموقف", "شفاعته في رفع الدرجات", "شفاعته في تخفيف العذاب عمن كان يستحقه"], "answer": 3, "why": "من شفاعاته ﷺ تخفيف العذاب عمن كان يستحقه كشفاعته في عمه أبي طالب.", "ref": "ص 7"}, {"q": "كيف يمر الناس على الصراط؟", "options": ["لا يمر عليه أحد", "يمر المؤمنون فقط", "على قدر أعمالهم: كطرف العين وكالبرق وكالريح وكأجاويد الخيل، فناجٍ مسلم ومخدوش ومكدوس في النار", "يمرون جميعًا بسرعة واحدة"], "answer": 2, "why": "يمر الناس على الصراط بقدر أعمالهم كطرف العين وكالبرق وكالريح وكأجاويد الخيل، فناجٍ مسلم ومخدوش مرسل ومكدوس في نار جهنم.", "ref": "ص 8"}, {"q": "من عقيدة أهل السنة في الجنة والنار:", "options": ["اعتقاد دوامهما وبقائهما وأنهما لا تفنيان ولا يفنى من فيهما", "أنهما لم تخلقا بعد", "أنهما تفنيان بعد زمن", "أنهما معنويتان"], "answer": 0, "why": "من الإيمان بالجنة والنار اعتقاد دوامهما وبقائهما وأنهما لا تفنيان ولا يفنى من فيهما: ﴿خالدين فيها أبدًا﴾.", "ref": "ص 10"}, {"q": "ما أعلى النعيم وأغلاه في الجنة؟", "options": ["الحور العين", "الطعام والشراب", "رؤية وجه الله الكريم في الآخرة ونيل رضوانه", "القصور والأنهار"], "answer": 2, "why": "أعظم النعيم وأغلاه رؤية وجه الله الكريم في الآخرة ونيل رضوانه.", "ref": "ص 13"}, {"q": "ما التوجيه في عرض مفهوم النار للأطفال؟", "options": ["تقديمها كتحذير وعدل إلهي بلغة مناسبة، مع غرس الرهبة دون ترهيب مفرط ولا تهوين", "عدم ذكرها مطلقًا", "تهديدهم بها عند كل خطأ", "إغراقهم في تفاصيل العذاب منذ الصغر"], "answer": 0, "why": "نعرّف الطفل بالنار بلغة تناسب فهمه كتحذير وعدل إلهي، ونغرس الرهبة منها دون ترهيب مفرط، ولا نقلل من خطرها.", "ref": "ص 14"}], "11": [{"q": "ما معنى القضاء شرعًا؟", "options": ["اختيار العبد لأفعاله", "علم الله السابق فقط", "ما قضى به الله سبحانه في خلقه من إيجاد أو إعدام أو تغيير", "ما يحكم به القاضي"], "answer": 2, "why": "القضاء لغةً الحكم والفصل، وشرعًا ما قضى به الله في خلقه من إيجاد أو إعدام أو تغيير.", "ref": "ص 2"}, {"q": "ما معنى القدر في الشرع؟", "options": ["ما قدّره الله تعالى في الأزل أن يكون في خلقه بناءً على علمه السابق", "حظ الإنسان من الدنيا", "قدرة الإنسان", "المصادفة"], "answer": 0, "why": "القدر شرعًا ما قدّره الله تعالى في الأزل أن يكون في خلقه بناءً على علمه السابق بذلك.", "ref": "ص 2"}, {"q": "من أدلة إثبات القدر من القرآن:", "options": ["﴿يا أيها الذين آمنوا اتقوا الله﴾", "﴿إنا كل شيء خلقناه بقدر﴾", "﴿وأقيموا الصلاة﴾", "﴿ولا تقربوا الزنى﴾"], "answer": 1, "why": "من أدلة القدر قوله تعالى: ﴿إنا كل شيء خلقناه بقدر﴾ و﴿وكان أمر الله قدرًا مقدورًا﴾.", "ref": "ص 3"}, {"q": "الإيمان بالقضاء والقدر على درجتين، فما الدرجة الواجبة؟", "options": ["حفظ أدلة القدر", "الإيمان بالمراتب الأربع تفصيلًا", "الإيمان الإجمالي بأن كل ما يحدث بتقدير الله وأن الله يعلم كل شيء", "الخوض في أسرار القدر"], "answer": 2, "why": "الدرجة الواجبة الإيمان الإجمالي بأن كل ما يحدث في الكون بتقدير الله وأنه يعلم كل شيء، والمستحبة الإيمان المفصل بالمراتب الأربع.", "ref": "ص 4"}, {"q": "المرتبة الرابعة من مراتب القدر هي:", "options": ["العلم", "الكتابة", "المشيئة", "الخلق والإيجاد"], "answer": 3, "why": "المرتبة الرابعة خلق الله تعالى للأشياء وإيجادها؛ فهو خالق كل عامل وعمله: ﴿والله خلقكم وما تعملون﴾.", "ref": "ص 5"}, {"q": "من ثمرات الإيمان بالقدر:", "options": ["طرد القلق والضجر عند فوات المراد أو حصول المكروه، والصبر والاحتساب", "الإعجاب بالنفس عند النجاح", "ترك الأخذ بالأسباب", "الاحتجاج بالقدر على المعاصي"], "answer": 0, "why": "من ثمرات الإيمان بالقدر طرد القلق والضجر عند فوات المراد لأن ذلك بقضاء الله، فيصبر ويحتسب.", "ref": "ص 6"}, {"q": "بماذا تُربي الأم طفلها على الإيمان بالقدر عمليًا؟", "options": ["بتجاهل أسئلته", "بتعليمه أن يسأل الله وحده ويستعين به ويتوكل عليه ويصبر على قضائه", "بتعليمه الاحتجاج بالقدر", "بإخباره أن كل شيء صدفة"], "answer": 1, "why": "تربي الطفل على طلب السؤال من الله وحده والاستعانة به والتوكل عليه والصبر على قضائه وقدره.", "ref": "ص 7"}, {"q": "إذا سأل الطفل: هل نحن مجبرون؟ فما الجواب الذي قدمته المحاضرة؟", "options": ["الإنسان مختار في كل شيء خارج إرادة الله", "مجبر في أشياء كالولادة والموت، ومختار في أخرى كالصلاة والإيمان، واختياره ضمن إرادة الله", "الإنسان مجبر في كل شيء", "لا جواب لهذا السؤال"], "answer": 1, "why": "الإنسان مجبر على الولادة والموت ومن هم آباؤه، ومختار في أن يصلي أو لا يصلي ويؤمن أو يكفر، ومع ذلك فإرادته ضمن إرادة الله.", "ref": "ص 10"}, {"q": "ما معنى الهداية في قوله تعالى: ﴿وهديناه النجدين﴾؟", "options": ["هداية التوفيق الخاصة بالأنبياء", "هداية البيان والإرشاد التي توضح للناس طريق الحق والباطل مع ترك حرية الاختيار", "هداية الحيوان إلى طعامه", "هداية الطريق في السفر"], "answer": 1, "why": "هدى الله الناس جميعًا هداية بيان توضح الطريق المستقيم، فيصبح الحق واضحًا والباطل واضحًا، وترك لهم حرية الاختيار.", "ref": "ص 11"}, {"q": "هل يعني الإيمان بالقدر الكسل وترك العمل؟", "options": ["نعم، لأن كل شيء مكتوب", "لا، بل هو أعظم دافع للعمل والسعي، كما في حديث «احرص على ما ينفعك واستعن بالله ولا تعجز»", "لا يتعلق القدر بالعمل", "نعم في أمور الدنيا فقط"], "answer": 1, "why": "الإيمان بالقدر لا يعني الكسل والتواكل بل هو أعظم دافع للعمل، ونعلمهم: «احرص على ما ينفعك واستعن بالله ولا تعجز».", "ref": "ص 12"}], "12": [{"q": "ما التعريف الدقيق لمراقبة الله؟", "options": ["علم القلب بيقين بقرب الرب سبحانه واطلاعه", "حفظ القرآن وتجويده", "أداء الصلاة في وقتها", "الخوف من عقاب الله فقط"], "answer": 0, "why": "المراقبة علم القلب بيقين بقرب الرب سبحانه واطلاعه على العبد في كل أحواله.", "ref": "ص 16"}, {"q": "متى تبدأ تربية الأطفال على مراقبة الله؟", "options": ["عند الزواج", "منذ نعومة أظفارهم ثم تنمو وتترسخ مع الأعوام", "عند دخول المدرسة الثانوية", "بعد البلوغ"], "answer": 1, "why": "تربية الأطفال على مراقبة الله تبدأ منذ نعومة أظفارهم ثم تنمو وتترسخ على مر الأعوام، وإن كان الطفل غير مكلف.", "ref": "ص 2"}, {"q": "من ثمرات علم الطفل بأن الله مطلع عليه ويحفظه:", "options": ["الاتكال على الوالدين", "قوة في النفس وشجاعة في مواجهة الصعاب، وحماية وجدانه من الاضطراب", "الخوف من الناس", "الانطواء والعزلة"], "answer": 1, "why": "العلم بأن الله مطلع عليه ويحفظه يورث الطفل قوة في النفس وشجاعة، ويحمي وجدانه من الاضطراب.", "ref": "ص 3"}, {"q": "ما القصة التي ذكرتها المحاضرة مثالًا يُحتذى في المراقبة زمن عمر بن الخطاب؟", "options": ["قصة الغلام والملك", "قصة أصحاب الجنة", "قصة بائعة اللبن التي رفضت خلط اللبن بالماء لأن الله يراها", "قصة أصحاب الأخدود"], "answer": 2, "why": "سمع عمر رضي الله عنه في جوف الليل فتاة بائعة لبن ترفض خلط اللبن بالماء لأن الله يراها وإن لم يرها أمير المؤمنين.", "ref": "ص 4"}, {"q": "من مؤشرات نجاح غرس المراقبة في الطفل:", "options": ["كثرة خوفه من العقاب", "تحسن أدائه لمهامه وعباداته غيبًا دون حاجة إلى إلحاح خارجي", "التزامه بالسلوك في حضور الوالدين فقط", "تجنبه الحديث مع والديه"], "answer": 1, "why": "من المؤشرات الانتباه إلى تحسن أداء الطفل لمهامه وعباداته غيبًا دون حاجة إلى إلحاح خارجي.", "ref": "ص 5"}, {"q": "كيف نربط مراقبة الله بأسمائه الحسنى عند الطفل؟", "options": ["بتقريب معاني السميع والبصير والعليم والرقيب والخبير والمحيط وتبسيطها", "بتحفيظه الأسماء دون معانٍ", "بتأجيل ذلك حتى يكبر", "بربطها بالعقاب فقط"], "answer": 0, "why": "نقرّب مفهوم «الله يراني» بتعليمه معاني أسماء مثل السميع والبصير والعليم والرقيب والخبير والمحيط مع تبسيطها.", "ref": "ص 7"}, {"q": "من هم الصادقون الذين نعلم الطفل أن الله يحبهم؟", "options": ["الذين لا يخطئون أبدًا", "الذين يكثرون الكلام", "الذين يحسنون أمام الناس فقط", "الذين استوى ظاهرهم وباطنهم وسرهم وعلانيتهم"], "answer": 3, "why": "الصادقون هم الذين استوى ظاهرهم وباطنهم، فلا يظهرون للناس بوجه حسن ثم يسيئون في الخفاء.", "ref": "ص 8"}, {"q": "ما أول وسيلة لغرس المراقبة في نفوس الأبناء؟", "options": ["العقوبة الشديدة", "المحاضرات الطويلة", "المراقبة بالكاميرات", "وجود القدوة الحية الملموسة أمامهم في سلوك الوالدين"], "answer": 3, "why": "أول وسيلة لغرس المراقبة وجود القدوة الحية الملموسة أمام الأبناء متمثلة في سلوكيات المحيطين بهم.", "ref": "ص 9"}, {"q": "ما التوجيه بشأن أسلوب تذكير الطفل بأن الله يراه؟", "options": ["ذكر ذلك مرة واحدة فقط", "استعمال خطاب معقد مليء بالتخويف", "استعمال عبارات بسيطة متكررة مثل «الله معنا» و«الله يرانا» دون تهديد", "تهديده بالعقاب دائمًا"], "answer": 2, "why": "نؤكد العبارات البسيطة المتكررة مثل «الله معنا» و«الله يرانا»، دون التهديد بالعقاب أو التأديب.", "ref": "ص 13"}, {"q": "كيف تتابع الأم الحكيمة سلوك أولادها بعد غرس المراقبة؟", "options": ["بمتابعة يسيرة عفوية دون تكلف ولا تربص، مع تعزيز السلوك الإيجابي", "بنصب الفخاخ واختبارهم دائمًا", "بتركهم دون متابعة", "بمعاقبتهم على كل خطأ"], "answer": 0, "why": "المرأة الحكيمة لا تنصب الفخاخ لأولادها ولا تشعرهم أنهم دائمًا تحت الامتحان، بل تجعل المتابعة يسيرة عفوية مع تعزيز السلوك الإيجابي.", "ref": "ص 14"}], "13": [{"q": "ما خير ما يملأ به المسلم قلبه وقلب أولاده كما ذكرت المحاضرة؟", "options": ["حب الله تعالى", "حب الشهرة", "حب المال", "حب اللعب"], "answer": 0, "why": "يمكن أن يُملأ القلب بالعواطف الشريفة أو بالهوى، وخير ما يملأ به المسلم قلبه وقلب أولاده حب الله تعالى.", "ref": "ص 2"}, {"q": "لماذا يُعدّ تعلق الأطفال بالله وحبهم له ضرورة؟", "options": ["لأنه يجعلهم ينعزلون عن الناس", "لأنه الحي القيوم الباقي معهم أينما كانوا، يحفظهم ويرعاهم أكثر من والديهم، فيعرفون أن لهم سندًا قويًا", "لأنه يمنعهم من اللعب", "لأنه يغنيهم عن الوالدين"], "answer": 1, "why": "الله هو الحي القيوم الدائم الباقي، معهم أينما كانوا ويحفظهم أكثر من والديهم، فتعلقهم به ضرورة ليعرفوا أن لهم سندًا قويًا.", "ref": "ص 3"}, {"q": "ما أثر محبة الأطفال لله على سلوكهم؟", "options": ["يقل اهتمامهم بالآخرين", "يحبون القرآن ويحرصون على الصلاة، ويعملون كل جميل إذا علموا أن الله جميل يحب الجمال", "يتركون الدراسة", "لا أثر لها"], "answer": 1, "why": "إذا أحبوا الله أحبوا القرآن وحرصوا على الصلاة، وإذا علموا أن الله جميل يحب الجمال عملوا كل ما هو جميل.", "ref": "ص 3"}, {"q": "كيف نعلم الطفل الذي بلغ سن فقه الواجبات شكر الله؟", "options": ["بتأجيل ذلك إلى البلوغ", "بأن يشكر عند النعم الكبيرة فقط", "بشكر الله عند كل نعمة صغيرة أو كبيرة بالقول والفعل، وألا يستعمل النعم في معصية", "بأن يشكر بلسانه دون عمل"], "answer": 2, "why": "نعلمه شكر الله عند كل نعمة صغيرة أو كبيرة، وأن النعم تستوجب الحمد والشكر بالقول والفعل وألا تُستعمل في معصية.", "ref": "ص 5"}, {"q": "ما فكرة نشاط «صندوق نعم الله»؟", "options": ["يضع الطفل يوميًا ورقة فيها شيء أحبه في يومه مع إخباره أن الله هو الذي يسّره له", "صندوق لجمع المال", "صندوق لعقاب الطفل", "صندوق للهدايا فقط"], "answer": 0, "why": "في النشاط يضع الطفل يوميًا ورقة بها شيء أحبه في يومه، مع إخباره أن الله هو الذي يسّره له، لتحويل المشاعر إلى فعل ملموس.", "ref": "ص 7"}, {"q": "كيف يربي الوالدان على محبة الله بالقدوة؟", "options": ["بإخفاء عباداتهما عنه", "إذا سأل الطفل عن سبب إقامتهما الصلاة أو إعراضهما عن الحرام ضمّنا الجواب ذكر محبة الله وطاعته", "بعدم إجابة أسئلته", "بإجباره على العبادة دون تعليل"], "answer": 1, "why": "حين يشاهد الطفل الأبوين يقيمان الفرائض أو يعرضان عن المحرمات ويسأل عن السبب، يتضمن جوابهما ذكر محبة الله وطاعته.", "ref": "ص 8"}, {"q": "كيف نستثمر طلبات الطفل الدنيوية البسيطة في تحبيب الله إليه؟", "options": ["بتلبيتها فورًا دون ربط بالله", "بتأجيلها حتى يكبر", "بتوجيهه أولًا ليطلبها من الله «الودود»، ثم مساعدته مع تذكيره بأن الله سخّر له الاستجابة", "برفض طلباته دائمًا"], "answer": 2, "why": "نوجه الطفل أولًا ليطلب حاجته من الله الودود المجيب، ثم نساعده مع تذكيره بأن الله هو الذي سخّر له الاستجابة حبًّا فيه.", "ref": "ص 9"}, {"q": "كيف نصف أماكن الطاعة ومواسمها للطفل؟", "options": ["بعدم الحديث عنها", "بأنها للكبار فقط", "بالأوصاف الحسنة المحببة: المسجد مستراح المؤمن، ورمضان موسم الفرح بنفحات الله", "بأنها أماكن للتعب والمشقة"], "answer": 2, "why": "نصف أماكن الطاعة ومواسمها بالأوصاف المحببة: المسجد مستراح المؤمن، ورمضان موسم الفرح، والحج ركن تهفو إليه النفوس.", "ref": "ص 10"}, {"q": "من وسائل غرس الاعتزاز بالإسلام في نفوس الأولاد:", "options": ["الاكتفاء بالأوامر", "مقارنتهم بغير المسلمين بازدراء", "توضيح القيم الجميلة في الإسلام بما يناسب أعمارهم، ورواية قصص السلف في الاعتزاز بالدين", "إخفاء هويتهم الدينية"], "answer": 2, "why": "من الوسائل توضيح محاسن الإسلام بما يناسب أعمارهم، ورواية قصص السلف كبلال وخبيب وربعي بن عامر في الاعتزاز بالدين.", "ref": "ص 12"}, {"q": "بماذا ترتبط محبة الله عند الطفل لتقريب معناها؟", "options": ["بحب الألعاب", "بالمحبات التي يفقهها كمحبة والديه وإخوته، مع بيان أن الله أحب إليه من نفسه", "بالخوف فقط", "لا يمكن تقريبها"], "answer": 1, "why": "نربط هذه المحبة بالمحبات التي يفقهها الطفل كمحبة والديه وإخوته وأصدقائه، وأن الله أحب إليه من أنفسهم جميعًا.", "ref": "ص 11"}], "14": [{"q": "لماذا فُطر الطفل على حب التساؤل؟", "options": ["للتسلية واللعب", "لإزعاج الوالدين", "لتضييع الوقت", "ليزوّد عقله بأقصى ما يمكنه من المعارف والمعلومات"], "answer": 3, "why": "فطر الله الطفل على حب التساؤل ليزود عقله بأقصى ما يمكن من المعارف، ومرحلة الطفولة مرحلة التساؤل.", "ref": "ص 2"}, {"q": "ما أول ما نراعيه في التعامل مع أسئلة الطفل العقدية؟", "options": ["تأجيل كل الأسئلة", "توجيهه إلى غيرنا", "الإقبال عليه والاهتمام به وحسن الإنصات لأسئلته دون تقليل منها", "الإجابة السريعة"], "answer": 2, "why": "أول ما نراعيه ليس الإجابة ذاتها بل ما قبلها: الإقبال على الطفل والاهتمام به وحسن الإنصات إلى أسئلته.", "ref": "ص 3"}, {"q": "إذا كانت الأم مشغولة فعلًا وسألها طفلها سؤالًا عقديًا، فماذا تفعل؟", "options": ["تجيبه بأي جواب لتتخلص منه", "تُفهمه برفق أن الوقت لا يناسب، وتحرص على مبادرته بالإجابة فور فراغها", "تنهره عن السؤال", "تتجاهله"], "answer": 1, "why": "إذا كانت مشغولة فعليها إفهامه برفق أن الوقت لا يناسب، وأن تحرص على مبادرته بالإجابة فور فراغها.", "ref": "ص 4"}, {"q": "ما أهمية الصدق في الإجابة عن أسئلة الطفل؟", "options": ["صحة الأجوبة وواقعيتها مدار ثقة الطفل بأمه، فلا تكذب عليه هروبًا من الحرج", "يجوز الكذب لتهدئته", "يكفي أي جواب يسكته", "الصدق غير مهم مع الأطفال"], "answer": 0, "why": "على الأم أن تكون صادقة ولا تكذب على طفلها هروبًا من الحرج ولا تمده بمعلومة خاطئة، فصحة الأجوبة مدار ثقته بها.", "ref": "ص 6"}, {"q": "إذا كانت الألفاظ الشرعية في الإجابة أكبر من إدراك الطفل فما العمل؟", "options": ["نلقيها كما هي ونطالبه بحفظها", "نستعمل مرادفًا متدرجًا يقرّب المعنى، وإلا أعطيناه من الإجابة قدر ما يطيق وأجّلنا تمام المعرفة", "نغيّر الموضوع", "نرفض الإجابة"], "answer": 1, "why": "إن وجدنا ما يرادف الألفاظ الشرعية متدرجًا لتقريب المعنى فهو الأجدر، وإلا أعطيناه قدر ما يطيق وأجلنا تمام المعرفة.", "ref": "ص 7"}, {"q": "ماذا تفعل الأم إذا تظاهر طفلها الذكي بالاقتناع حتى لا يثقل عليها؟", "options": ["تتجاهل الأمر", "تنتهي من الحوار", "تتنبه لذلك وتُظهر له الرغبة في المزيد من الحوار والأسئلة", "تعاقبه على التظاهر"], "answer": 2, "why": "بعض الأطفال يتظاهر بالاقتناع حتى لا يثقل على المسؤول، فتتنبه الأم وتظهر له الرغبة في المزيد من الحوار.", "ref": "ص 9"}, {"q": "ما الأثر التربوي لقول الأم بصدق: «لا أعلم.. سنسأل أهل العلم ونبحث معًا»؟", "options": ["يضعف ثقة الطفل بها", "يجعله يتوقف عن السؤال", "يغرس قيمة رفع قدر أهل العلم والعلماء في نفسه منذ الصغر", "لا أثر له"], "answer": 2, "why": "نشاط «فاسألوا أهل الذكر» يبيّن أن صدق الأم بقول «لا أعلم» يغرس قيمة رفع قدر أهل العلم في نفس الطفل.", "ref": "ص 10"}, {"q": "ما التوجيه عند ظهور شك أو شبهة لدى الطفل؟", "options": ["توبيخه على الشك", "تجاهل الأمر", "تحفيزه على ذكر الله تعالى بعد كل شك وطلب الهداية منه", "تركه يبحث وحده في الإنترنت"], "answer": 2, "why": "نحفز الطفل على ذكر الله بعد كل شك، فالهداية للعقيدة السليمة من الله يطلبها العبد منه.", "ref": "ص 11"}, {"q": "من وسائل حماية الطفل بعد معالجة الشبهة:", "options": ["ترك الأجهزة بلا ضابط", "عزله عن الناس", "منعه من السؤال مستقبلًا", "الرقابة الواعية لما يشاهده في وسائل الإعلام واستبعاد المحتوى المثير للشكوك"], "answer": 3, "why": "نحميه من المؤثرات الخارجية التي تضعف يقينه برقابة واعية لما يشاهده، واستبعاد المحتويات التي تثير الشكوك.", "ref": "ص 12"}, {"q": "أفضل طريقة لتعليم الأطفال الأمور العقدية بحسب أسئلة التقويم:", "options": ["الحفظ الآلي", "الحوار", "القراءة الصامتة", "الإلقاء المباشر"], "answer": 1, "why": "الحوار وسيلة فعالة لتعليم الأطفال الأمور العقدية، إذ يوسع مداركهم ويراعي تساؤلاتهم.", "ref": "ص 16"}], "15": [{"q": "ما المقصود بـ«منهجية التدرج» في تعليم العقيدة؟", "options": ["تأجيل العقيدة حتى البلوغ", "تقديم العلم للطفل بقدر يناسب عمره ومرحلته، فالعلم كالترياق له قدر", "تعليم كل شيء دفعة واحدة", "الاكتفاء بالحفظ"], "answer": 1, "why": "العلم كالترياق له قدر، فيُقدّم للطفل بما يناسب عمره ومرحلته متدرجًا.", "ref": "ص 2"}, {"q": "بماذا نبدأ أولًا في المرحلة الأولى؟", "options": ["بالأدلة العقلية المعقدة", "بإذكاء الفطرة بتعليم كلمة التوحيد وتدعيم الإيمان بأركانه وأهمها الإيمان بالله", "بتفاصيل أهوال القيامة", "بالردود على الشبهات"], "answer": 1, "why": "نبدأ بإذكاء الفطرة: تعليم كلمة التوحيد، وتدعيم الإيمان بأركانه الستة وأهمها الإيمان بالله ومحبته.", "ref": "ص 3"}, {"q": "ما الذي نستخدمه مع الطفل الأكبر لتقرير إيمانه بالأدلة؟", "options": ["الأدلة التي تخاطب العقل كالسببية، والحوار مع احترام رأيه وحسن الاستماع إليه", "التخويف", "التلقين فقط", "الأوامر دون تعليل"], "answer": 0, "why": "نستخدم معه الأدلة العقلية كالسببية، ونستخدم الحوار مع احترام رأيه وذاته وحسن الاستماع إليه.", "ref": "ص 4"}, {"q": "ما الذي ينبغي التأكيد عليه في الإيمان بالغيب؟", "options": ["أن الغيب يُعرف من مواقع التواصل", "أن بعض الناس يعلمون الغيب", "أن الغيب لا يعلمه إلا الله، وقد أطلعنا على يسير منه، ومن أعلى مراتب الإيمان التصديق بالغيب", "أن الغيب لا يجب الإيمان به"], "answer": 2, "why": "نؤكد أن الغيب لا يعلمه إلا الله، وقد أطلعنا على أشياء يسيرة منه، ومن أعلى مراتب الإيمان التصديق بالغيب، مع الحذر من مواقع التواصل مصدرًا.", "ref": "ص 5"}, {"q": "في المرحلة الأولى (ما قبل التمييز) أي الأسماء والصفات نعرّف الطفل بها؟", "options": ["صفات العقاب فقط", "تفاصيل مسائل الصفات الخلافية", "الأسماء والصفات المحببة التي تطرق سمعه كثيرًا كالرحمة والرزق والجمال، بإجمال وربط بآثارها", "لا نعرّفه بشيء منها"], "answer": 2, "why": "في المرحلة الأولى نعرّف الصغير ببعض الأسماء والصفات المحببة كالرحمة والرزق والجمال إجمالًا مع ربطها بآثارها.", "ref": "ص 6"}, {"q": "لماذا لا تكفي العاطفة وحدها في مرحلة المراهقة؟", "options": ["لأن العاطفة ضارة", "لأن المراهق لا عاطفة له", "لأنه لا بد من العلم والاستدلال لتحصينهم أمام التيارات والأفكار المختلفة", "لأن المراهقة لا تحتاج تعليمًا"], "answer": 2, "why": "في هذه المرحلة لا تكفي العاطفة وحدها، بل لا بد من العلم والاستدلال لتحصينهم تجاه التيارات والأفكار المختلفة.", "ref": "ص 8"}, {"q": "ما الوسيلة المناسبة لتعليم العقيدة للأطفال الصغار؟", "options": ["اللعب والقصص والوسائل الحسية كالصور والبرامج", "الامتحانات", "المحاضرات الطويلة", "الكتب المتخصصة للكبار"], "answer": 0, "why": "مع الصغار نستخدم اللعب والقصص والوسائل الحسية المبسطة التي تشد انتباههم وتثير فضولهم.", "ref": "ص 9"}, {"q": "ما فكرة نشاط «صنع الله»؟", "options": ["صناعة لعبة من الورق", "رسم لوحة فنية", "صندوق فيه أشياء من صنع الإنسان وأخرى من خلق الله، وحوار يفرق بين صناعة البشر وخلق الله لترسيخ صفة الخالق", "زيارة مصنع"], "answer": 2, "why": "يُعد صندوق فيه أشياء من صنع الإنسان كاللعبة وأشياء من خلق الله كالثمرة، مع حوار يفرق بينهما لترسيخ صفة الخالق.", "ref": "ص 12"}, {"q": "كيف تكون الأم نموذجًا عمليًا في العقيدة لأبنائها؟", "options": ["بإخفاء مشاعرها", "بأن يروا توكلها على ربها وتفويضها أمورها إليه ورضاها بأقدار الله", "بالشكوى عند الشدائد", "بكثرة الكلام النظري"], "answer": 1, "why": "يجد الأبناء في أمهم أنموذجًا يقتدون به في توكلها على ربها وتفويضها أمورها إليه ورضاها بأقداره.", "ref": "ص 13"}, {"q": "العلم الذي ينفع الكبير قد يضر الصغير إذا قُدّم بأسلوب لا يلائم عمره:", "options": ["خطأ في العقيدة", "خطأ", "صحيح في الفقه فقط", "صحيح"], "answer": 3, "why": "هذا صحيح، ولذلك وجبت مراعاة التدرج في تعليم العقيدة بحسب الأعمار المختلفة.", "ref": "ص 16"}]}, "s2": {"1": [{"q": "ما الهدف من مادة الأحاديث النبوية التربوية كما في مقدمة المحاضرة؟", "options": ["تعلم اللغة العربية", "دراسة التاريخ السياسي", "حفظ الأسانيد فقط", "التعرف إلى هدي النبي ﷺ في التربية واستنباط المعاني التربوية من سنته وسيرته"], "answer": 3, "why": "تهدف المادة إلى التعرف إلى هدي النبي ﷺ في التربية، واستنباط المعاني والتوجيهات التربوية من سنته وسيرته العطرة.", "ref": "ص 2"}, {"q": "إلى من ينتسب النبي ﷺ من الأنبياء؟", "options": ["إلى إسماعيل بن إبراهيم عليهما السلام", "إلى موسى عليه السلام", "إلى إسحاق عليه السلام", "إلى يعقوب عليه السلام"], "answer": 0, "why": "النبي ﷺ محمد بن عبد الله بن عبد المطلب بن هاشم، وهو من ولد إسماعيل بن إبراهيم عليهما السلام.", "ref": "ص 3"}, {"q": "بمن تلتقي آمنة بنت وهب أم النبي ﷺ بنسب أبيه؟", "options": ["لا تلتقي معه", "في جده الخامس كلاب بن مرة", "في هاشم", "في عبد المطلب"], "answer": 1, "why": "أمه آمنة بنت وهب بن عبد مناف بن زهرة بن كلاب بن مرة، فهي تلتقي بنسب أبيه في الجد الخامس.", "ref": "ص 3"}, {"q": "إلى أين خرج النبي ﷺ بعد وفاة خديجة وعمه، ومن كان معه؟", "options": ["إلى الطائف ومعه زيد بن حارثة", "إلى الشام ومعه ميسرة", "إلى الحبشة ومعه جعفر", "إلى المدينة ومعه أبو بكر"], "answer": 0, "why": "بعد فقد من كان يحميه ومن كانت تؤنسه، خرج ﷺ إلى الطائف ومعه زيد بن حارثة رضي الله عنه يدعو إلى الإسلام.", "ref": "ص 4"}, {"q": "في جوار من رجع النبي ﷺ إلى مكة بعد رحلة الطائف؟", "options": ["أبي سفيان", "العباس", "أبي طالب", "المطعم بن عدي"], "answer": 3, "why": "رجع ﷺ إلى مكة في جوار المطعم بن عدي وحمايته بعد أن آذاه أهل الطائف أشد الإيذاء.", "ref": "ص 4"}, {"q": "من خصائص زواج النبي ﷺ بخديجة رضي الله عنها:", "options": ["كانت آخر زوجاته", "لم تنجب له", "تزوجها بعد البعثة", "لم يتزوج عليها غيرها في حياتها، وهي أول من آمن به، وجميع أولاده منها إلا إبراهيم"], "answer": 3, "why": "خديجة أول زوجاته ولم يتزوج عليها في حياتها، وهي أول امرأة آمنت به، وجميع أولاده منها إلا إبراهيم فمن مارية.", "ref": "ص 5"}, {"q": "من زوجات النبي ﷺ التي ثبتت على دينها بعد أن تنصّر زوجها الأول في الحبشة، وأصدقها النجاشي عنه ﷺ؟", "options": ["سودة بنت زمعة", "حفصة بنت عمر", "أم حبيبة رملة بنت أبي سفيان", "ميمونة بنت الحارث"], "answer": 2, "why": "أم حبيبة هاجرت مع زوجها الأول إلى الحبشة فتنصّر وثبتت هي، فبعث النبي ﷺ من يخطبها وأصدق عنه النجاشي.", "ref": "ص 6"}, {"q": "أي زوجات النبي ﷺ أُعتق بسبب زواجها منه أكثر من مائة أهل بيت من قومها؟", "options": ["عائشة بنت أبي بكر", "جويرية بنت الحارث", "زينب بنت جحش", "صفية بنت حيي"], "answer": 1, "why": "جويرية من بني المصطلق كانت ذات فضل على قومها، فأُعتق بسبب زواجها من النبي ﷺ أكثر من مائة أهل بيت.", "ref": "ص 7"}, {"q": "ما الصفات التي كلّفنا بمعرفتها والاقتداء بها من صفات النبي ﷺ؟", "options": ["الصفات الخَلقية الجسدية", "صفات لباسه فقط", "صفات بيته", "الصفات الخُلُقية"], "answer": 3, "why": "الصفات الخُلُقية للنبي ﷺ هي التي كُلّفنا بمعرفتها والاقتداء بها.", "ref": "ص 9"}, {"q": "ماذا قال أنس رضي الله عنه في خُلق النبي ﷺ وقد خدمه؟", "options": ["ما قال لي لشيء صنعته: لِمَ صنعته؟ ولا لشيء لم أصنعه: ألا صنعته؟", "كان شديدًا في التأديب", "كان يكثر الأمر والنهي", "كان يعاتبني على كل خطأ"], "answer": 0, "why": "من أعظم ما ورد في خلقه ﷺ قول أنس: ما قال لي لشيء صنعته لم صنعته؟ ولا لشيء لم أصنعه ألا صنعته؟", "ref": "ص 10"}], "2": [{"q": "ما معنى السنة إذا أُطلقت في اللغة؟", "options": ["الأمر الواجب فقط", "القرآن الكريم", "الطريقة، سواء كانت حسنة أو قبيحة", "العادة الحسنة فقط"], "answer": 2, "why": "السنة في اللغة الطريقة حسنة كانت أو قبيحة، كما في حديث: «من سنّ في الإسلام سنة حسنة... ومن سنّ في الإسلام سنة سيئة».", "ref": "ص 2"}, {"q": "كيف كان حال الصحابة رضي الله عنهم مع هدي النبي ﷺ؟", "options": ["يعملون بالقرآن دون السنة", "لا يبالون به", "يسألون عن آية تدل على ما قاله ﷺ قبل العمل", "يسارعون إلى الامتثال والاقتداء به دون تردد، ولا يفرّقون في أوامره بين ما في القرآن وما في السنة"], "answer": 3, "why": "كان الصحابة يرون أفعاله ويسمعون كلامه ويسارعون للاقتداء به، ولا يفرّقون فيما يأمرهم به بين ما جاء في القرآن وما جاء في السنة.", "ref": "ص 3"}, {"q": "بماذا توعّد الله الذين يخالفون عن أمر النبي ﷺ؟", "options": ["لا وعيد عليهم", "بنقص المال فقط", "بالحرمان من الولد", "﴿أن تصيبهم فتنة أو يصيبهم عذاب أليم﴾"], "answer": 3, "why": "قال تعالى: ﴿فليحذر الذين يخالفون عن أمره أن تصيبهم فتنة أو يصيبهم عذاب أليم﴾.", "ref": "ص 5"}, {"q": "بماذا أجاب ابن مسعود المرأة التي قالت إنها قرأت المصحف فلم تجد لعن النامصة؟", "options": ["قرأ عليها: ﴿وما آتاكم الرسول فخذوه وما نهاكم عنه فانتهوا﴾", "قال: ليس في القرآن فلا يحرم", "سكت عنها", "قال: هذا رأيي"], "answer": 0, "why": "قال لها: لئن كنتِ قرأتيه لقد وجدتيه، ثم قرأ: ﴿وما آتاكم الرسول فخذوه وما نهاكم عنه فانتهوا﴾.", "ref": "ص 6"}, {"q": "ما المراد بـ«الحكمة» المقرونة بالكتاب في القرآن؟", "options": ["سنة رسول الله ﷺ", "أقوال الحكماء", "علم الطب", "الفلسفة"], "answer": 0, "why": "المراد بالحكمة سنة رسول الله ﷺ، وقد قال: «ألا إني أوتيت القرآن ومثله معه».", "ref": "ص 7"}, {"q": "ما الفرق بين نزول جبريل بالقرآن ونزوله بالسنة كما رُوي عن بعض التابعين؟", "options": ["السنة لم تنزل بها الملائكة مطلقًا", "السنة نزلت لفظًا والقرآن معنى", "لا فرق بينهما", "القرآن نزل لفظًا ومعنى، والسنة كان ينزل بها معنى ويبيّنها النبي ﷺ بلفظه"], "answer": 3, "why": "كان جبريل ينزل بالسنة معنى لا لفظًا فيبيّنها النبي ﷺ بلفظه، بينما كان نزوله بالقرآن نزول لفظ.", "ref": "ص 7"}, {"q": "ما الواجب على المسلم فيما أخبر به النبي ﷺ من أمور غائبة؟", "options": ["أن يتوقف فيه", "أن يكذّب ما لم يرد في القرآن", "أن يصدّقه في كل ذلك اعتقادًا، لأنه ﴿وما ينطق عن الهوى إن هو إلا وحي يوحى﴾", "أن يصدّق ما يوافق عقله فقط"], "answer": 2, "why": "يجب تصديقه ﷺ في كل ما أخبر به من أمور الغيب الماضية والمستقبلة، لأنه ﴿وما ينطق عن الهوى﴾.", "ref": "ص 8"}, {"q": "من الأحكام التي ثبتت بالسنة وليس في القرآن آية تأمر بها:", "options": ["وجوب الصيام", "تحريم الخمر", "التوجه في الصلاة إلى بيت المقدس قبل تحويل القبلة", "وجوب الصلاة"], "answer": 2, "why": "مما يدل على حجية السنة أن المسلمين استقبلوا بيت المقدس رغم أنه ليس في القرآن آية تأمر باتباع قبلة بيت المقدس.", "ref": "ص 9"}, {"q": "كيف دلّ حفظ الله للقرآن على حفظ السنة؟", "options": ["لأن السنة كُتبت كلها في عهده ﷺ", "لأن حفظ اللفظ دون المعنى ليس حفظًا، ومعاني القرآن إنما عُرفت من السنة، فحفظه متضمن لحفظها", "لا علاقة بينهما", "لأن السنة جزء من المصحف"], "answer": 1, "why": "تكفل الله بحفظ القرآن لفظًا ومعنى، ومعانيه إنما عرفناها من السنة، فحفظ القرآن متضمن لحفظ السنة المبينة له.", "ref": "ص 10"}, {"q": "ما علاقة السنة النبوية بالقرآن الكريم؟", "options": ["مفسّرة له ومبيّنة", "مستقلة عنه تمامًا", "متناقضة معه", "لا علاقة بينهما"], "answer": 0, "why": "السنة مفسرة للقرآن ومبينة له: ﴿وأنزلنا إليك الذكر لتبين للناس ما نزل إليهم﴾.", "ref": "ص 11"}], "3": [{"q": "ما تعريف الحديث النبوي الشريف؟", "options": ["كلام العلماء في الفقه", "ما رواه الصحابة من آرائهم", "أقوال التابعين", "ما أضيف إلى النبي ﷺ من قول أو فعل أو تقرير أو وصف"], "answer": 3, "why": "الحديث الشريف يطلق على ما أضيف إلى النبي ﷺ من قول أو فعل أو تقرير أو وصف.", "ref": "ص 2"}, {"q": "أيهما أعم: الخبر أم الحديث؟", "options": ["لا علاقة بينهما", "الخبر أعم؛ إذ يشمل ما أضيف للنبي ﷺ وما أضيف للصحابة والتابعين", "هما سواء في كل حال", "الحديث أعم"], "answer": 1, "why": "الخبر أعم من الحديث؛ إذ يشمل ما أضيف إلى النبي ﷺ وما أضيف إلى الصحابة والتابعين.", "ref": "ص 2"}, {"q": "إذا قال الصحابي: «فعلنا في عهد النبي ﷺ كذا» دون ذكر علمه ﷺ، فما حكمه؟", "options": ["رأي شخصي للصحابي", "حديث ضعيف", "لا يُحتج به", "له حكم الرفع، لأنه لو كان ممنوعًا لنزل الوحي بإنكاره"], "answer": 3, "why": "إذا أضاف الصحابي شيئًا إلى عهد النبي ﷺ فهو من الإقرار الذي له حكم الرفع، لأنه لو كان ممنوعًا لنزل الوحي ببيانه.", "ref": "ص 3"}, {"q": "حديث «من كذب عليّ متعمدًا فليتبوأ مقعده من النار» مثال على:", "options": ["المتواتر لفظًا ومعنى", "الحديث الغريب", "الحديث الضعيف", "المتواتر معنى فقط"], "answer": 0, "why": "هذا الحديث متواتر لفظًا ومعنى، رواه أكثر من ستين صحابيًا منهم العشرة المبشرون بالجنة.", "ref": "ص 4"}, {"q": "ما تعريف الحديث الصحيح لذاته؟", "options": ["ما اشتهر على ألسنة الناس", "الضعيف إذا كثرت طرقه", "ما رواه عدل خفيف الضبط", "ما رواه عدل تام الضبط بسند متصل وسلم من الشذوذ والعلة القادحة"], "answer": 3, "why": "الصحيح لذاته ما رواه عدل تام الضبط بسند متصل، وسلم من الشذوذ والعلة القادحة.", "ref": "ص 5"}, {"q": "ما الحسن لغيره؟", "options": ["الموضوع", "الصحيح إذا كثرت طرقه", "ما رواه عدل تام الضبط", "الضعيف إذا كثرت طرقه"], "answer": 3, "why": "الحسن لغيره هو الضعيف إذا كثرت طرقه، أما الصحيح لغيره فهو الحسن لذاته إذا كثرت طرقه.", "ref": "ص 5"}, {"q": "من طرق معرفة الحديث الضعيف:", "options": ["روايته عن العشرة المبشرين", "كثرة طرقه الصحيحة", "وروده في صحيح البخاري", "انفراد مصنفات معينة بإخراجه كالعقيلي وابن عدي والخطيب وابن عساكر ومسند الفردوس"], "answer": 3, "why": "من طرق معرفته أن تنفرد بإخراجه مصنفات معينة كالعقيلي وابن عدي والخطيب البغدادي وابن عساكر ومسند الفردوس للديلمي.", "ref": "ص 6"}, {"q": "لماذا لم يُدوَّن الحديث في عهد النبي ﷺ وأصحابه بشكل عام؟", "options": ["لقلة الكتّاب فقط", "مخافة أن يختلط بالقرآن", "لأنه كان محفوظًا في الكتب السابقة", "لعدم أهميته"], "answer": 1, "why": "لم يُدوَّن الحديث في عهده ﷺ ولا في عهد أصحابه مخافة أن يختلط بالقرآن، حتى أمر عمر بن عبد العزيز بكتابته.", "ref": "ص 7"}, {"q": "من الخليفة الذي أمر بجمع حديث رسول الله ﷺ خوفًا من ضياعه؟", "options": ["أبو بكر الصديق", "عمر بن عبد العزيز", "هارون الرشيد", "عثمان بن عفان"], "answer": 1, "why": "لما كانت خلافة عمر بن عبد العزيز خاف من ضياع الحديث، فكتب إلى أبي بكر بن حزم: انظر ما كان من حديث رسول الله ﷺ فاكتبه.", "ref": "ص 7"}, {"q": "كم تقريبًا عدد أحاديث صحيح البخاري، ومن كم حديث انتقاها؟", "options": ["نحو أربعين ألفًا من مليون", "نحو سبعة آلاف وأربعمائة، انتقاها من أكثر من ستمائة ألف حديث", "نحو ألف حديث من عشرة آلاف", "نحو مائة ألف"], "answer": 1, "why": "انتقى البخاري جامعه الصحيح من أكثر من ستمائة ألف حديث، فاستخرج منها نحو سبعة آلاف وأربعمائة حديث.", "ref": "ص 8"}], "4": [{"q": "ما القضية الأساسية التي ينبغي أن تغرسها المرأة في نفسها في أول دروس التربية النبوية للمرأة في نفسها؟", "options": ["التسليم لله تعالى ولرسوله ﷺ", "طلب الرزق", "كثرة الأسفار", "الاهتمام بالمظهر"], "answer": 0, "why": "ينبغي لكل امرأة أن تغرس في نفسها قضية التسليم لله ولرسوله ﷺ، فما سُمّيت المسلمة مسلمة إلا لأنها تسلم لحكمهما.", "ref": "ص 2"}, {"q": "لماذا سُمّي أبو بكر رضي الله عنه «الصديق»؟", "options": ["لصدقه في التجارة", "لتصديقه النبي ﷺ في حادثة الإسراء والمعراج", "في حادثة الإفك", "لأنه أول من صلى"], "answer": 1, "why": "لما أخبره المشركون بالإسراء قال: لئن كان قال ذلك لقد صدق، إني لأصدقه فيما هو أبعد من ذلك، فسمي الصديق.", "ref": "ص 3"}, {"q": "ما معنى «مستنطقات» في وصف الأنامل في الحديث؟", "options": ["أنها تعدّ التسبيح فقط", "أن الأصابع تُسأل وتُستنطق يوم القيامة عن الأعمال التي عملت بها", "أنها تتكلم في الدنيا", "أنها لا تشهد"], "answer": 1, "why": "الأنامل مسؤولات مستنطقات، أي تُسأل يوم القيامة عن الأعمال التي عملت بها وتنطق بها.", "ref": "ص 4"}, {"q": "هل المقصود بالتسبيح والتهليل والتقديس في الحديث هذه الألفاظ الثلاثة فقط؟", "options": ["نعم لا يجزئ غيرها", "المراد قراءة القرآن فقط", "المراد التسبيح فقط", "لا، المراد عموم ذكر الله بأي لفظ كان"], "answer": 3, "why": "ليس المراد الألفاظ الثلاثة فقط بل عموم ذكر الله بأي لفظ، كسبحان الله وبحمده وسبحان الله العظيم والحمد لله.", "ref": "ص 4"}, {"q": "ما الذي ينبغي أن تستحضره المرأة لتردعها عن الذنوب كما بيّنت المحاضرة؟", "options": ["خسارة المال", "نظرة الناس إليها فقط", "مشهد يوم القيامة حين تنطق أعضاؤها التي استترت بها وتشهد عليها", "عقوبة الدنيا فقط"], "answer": 2, "why": "كما تكره أن يطلع الناس على معصيتها، عليها أن تستحضر مشهد يوم القيامة حين تنطق أعضاؤها وتشهد عليها فتفضحها.", "ref": "ص 5"}, {"q": "من المعاني المستنبطة من حديث «رُبّ كاسية في الدنيا عارية في الآخرة»:", "options": ["أن الحديث خاص بزمن النبي ﷺ", "أن الفقر خير مطلق", "أن اللباس لا قيمة له", "أن الفتن مقرونة بفتح الخزائن والدنيا، وأن الغنى والفقر قد يسببان الفتنة في الدين"], "answer": 3, "why": "أعلم الله رسوله ﷺ أنه سيُفتح على أمته من الخزائن وأن الفتن مقرونة بذلك، والغنى والفقر قد يسببان الفتنة.", "ref": "ص 6"}, {"q": "ما التنبيه الذي ذكرته المحاضرة بشأن ثقافة الحجاب في المجتمعات المسلمة؟", "options": ["أن الحجاب خاص بالصلاة", "أن الاستعمار غرس حصر الحجاب في تغطية الرأس والشعر، فتلبس بعضهن ما يصف الجسم وتظن أنها محجبة", "أن الحجاب عادة اجتماعية", "أن تغطية الرأس تكفي"], "answer": 1, "why": "غرس الاستعمار ثقافة حصر الحجاب في تغطية الرأس، فصارت المرأة تظن نفسها محجبة ولو لبست ما يصف جسمها، فيُخشى دخولها في الكاسيات العاريات.", "ref": "ص 7"}, {"q": "أكملي الحديث: «إن الرفق لا يكون في شيء إلا ... ولا يُنزع من شيء إلا ...»", "options": ["نفعه - ضره", "زانه - شانه", "شانه - زانه", "زانه - أفسده"], "answer": 1, "why": "قال ﷺ: «إن الرفق لا يكون في شيء إلا زانه، ولا ينزع من شيء إلا شانه»، والأخلاق الفاضلة مفتاح كل خير.", "ref": "ص 8"}, {"q": "طاعة المرأة لزوجها مقارنةً بطاعتها لأبويها:", "options": ["غير واجبة", "مساوية لها", "أوجب عليها من طاعة أبويها", "أقل وجوبًا من طاعة أبويها"], "answer": 2, "why": "من المعاني المستنبطة أن طاعة المرأة لزوجها أوجب عليها من طاعتها لأبويها.", "ref": "ص 9"}, {"q": "ما حكم طاعة الزوجة لزوجها بحسب المحاضرة؟", "options": ["مستحبة فقط", "واجبة في المعروف ما لم يأمر بمعصية", "على حسب هواها", "واجبة بأي حال ولو في معصية"], "answer": 1, "why": "طاعة الزوج واجبة في المعروف، فخير متاع الدنيا المرأة الصالحة التي إن أمرها أطاعته، ولا طاعة في معصية.", "ref": "ص 9"}], "5": [{"q": "مَن خير النساء كما في حديث أبي هريرة؟", "options": ["أكثرهن مالًا", "أكثرهن خروجًا", "التي تسرّه إذا نظر، وتطيعه إذا أمر، ولا تخالفه في نفسها ولا ماله بما يكره", "أجملهن فقط"], "answer": 2, "why": "قيل: أي النساء خير؟ قال ﷺ: «التي تسره إذا نظر، وتطيعه إذا أمر، ولا تخالفه في نفسها ولا في ماله بما يكره».", "ref": "ص 2"}, {"q": "ما معنى «لا تخالفه في نفسها» في الحديث؟", "options": ["أن تترك عبادتها", "حفظ عرضها والاستجابة له إذا دعاها إلى الفراش", "ألا تخرج من بيتها أبدًا", "ألا تبدي رأيها مطلقًا"], "answer": 1, "why": "عدم المخالفة في النفس متعلق بحفظ عرضها وبالاستجابة لزوجها إذا دعاها إلى الفراش.", "ref": "ص 3"}, {"q": "إذا كان للزوجة مال خاص بها واحتاج زوجها إليه، فما المستحب؟", "options": ["يجب عليها إعطاؤه كله", "أن تعطيه منه من كمال العشرة لا على سبيل الوجوب", "أن تمنعه دائمًا", "يحرم عليها إعطاؤه"], "answer": 1, "why": "إذا كان للزوجة مال خاص فمن كمال العشرة -لا على سبيل الوجوب- أن تعطي زوجها منه إن احتاج إليه ولا تمنعه.", "ref": "ص 4"}, {"q": "ما أعظم الحقوق الدنيوية بين الخلق على الزوجة؟", "options": ["حق الأقارب البعيدين", "حق الجيران", "حق الزوج", "حق الصديقات"], "answer": 2, "why": "أعظم الحقوق الدنيوية على الزوجة حق الزوج، ولولا تحريم السجود لغير الله لكان أحق الناس بالسجود الزوج، بيانًا لعظم حقه.", "ref": "ص 5"}, {"q": "ما المعنى المستنبط من حديث إيقاظ الزوجين بعضهما لقيام الليل؟", "options": ["الحث على تعاون الزوجين على الطاعات، والفرائض من باب أولى", "أن على الزوج وحده القيام", "النهي عن إيقاظ النائم", "أن قيام الليل واجب على الزوجين"], "answer": 0, "why": "الحديث يحث على تعاون الزوجين على الطاعات؛ فإن كان التعاون على قيام الليل مطلوبًا فالتعاون على الفرائض من باب أولى.", "ref": "ص 6"}, {"q": "هل يجوز للزوج منع زوجته من صوم الفريضة كرمضان؟", "options": ["لا يجوز، ولا يجوز لها طاعته إن منعها", "يجوز إذا كانت مسافرة فقط", "يجوز في القضاء مطلقًا", "يجوز له منعها"], "answer": 0, "why": "لا يجوز للزوج منع زوجته من صوم الفريضة اللازم في وقت محدد كرمضان وقضائه إذا ضاق وقته، ولا يجوز لها طاعته إن منعها.", "ref": "ص 7"}, {"q": "في أي الصيام تستأذن المرأة زوجها؟", "options": ["في صيام النفل، وفي الفرض الذي وقته موسّع", "لا تستأذن مطلقًا", "في رمضان", "في كل صيام حتى المضيق"], "answer": 0, "why": "يجوز للزوج منعها من صوم النفل، ويجب عليها أن تستأذنه في صيام الفرض الذي وقته موسّع.", "ref": "ص 7"}, {"q": "ما المقصود بإنفاق المرأة من بيت زوجها «غير مفسدة»؟", "options": ["إنفاق كل المال", "الإنفاق على نفسها فقط", "الإنفاق اليسير الذي لا يضر بميزانية البيت مما جرت به العادة", "الإنفاق دون علم الزوج في الأمور الكبيرة"], "answer": 2, "why": "الإنفاق غير المفسد هو الإنفاق اليسير الذي لا يضر بميزانية البيت ويكون بما جرت به العادة بين الناس.", "ref": "ص 8"}, {"q": "إذا دعا الرجل امرأته إلى فراشه فأبت بلا عذر، فهذا:", "options": ["محرم بالليل دون النهار", "من حقها مطلقًا", "مكروه فقط", "محرم"], "answer": 3, "why": "امتناعها بلا عذر محرم، والأمر لا يتعلق بالليل فقط بل بأي وقت حصل فيه الطلب والامتناع، وذكر الليل لأنه الغالب.", "ref": "ص 9"}, {"q": "لماذا يمدح إبليس من يفرّق بين الزوجين من جنوده؟", "options": ["لأن الفرقة لا ضرر فيها", "لأنه يريد زيادة الزواج", "لمعرفته بالفساد العريض المترتب على ذلك من انقطاع النسل وضياع تربية الأطفال وانتشار البغضاء", "لأنه يحب الزوجين"], "answer": 2, "why": "الشيطان يوسوس للزوجين لإحداث الفرقة لمعرفته بالفساد المترتب عليها من انقطاع النسل وسوء تربية الأطفال وانتشار البغضاء.", "ref": "ص 10"}], "6": [{"q": "ما الجزاء الذي وعد به النبي ﷺ من ابتُلي بشيء من البنات فأحسن إليهن؟", "options": ["كُنّ له سترًا من النار", "رفعة في الدنيا", "طول العمر", "زيادة في الرزق فقط"], "answer": 0, "why": "قال ﷺ: «من يلي من هذه البنات شيئًا فأحسن إليهن كُنّ له سترًا من النار».", "ref": "ص 2"}, {"q": "ماذا فعلت المرأة التي أعطتها عائشة رضي الله عنها تمرة واحدة؟", "options": ["أكلتها وحدها", "أعطتها لجارتها", "ردّتها إلى عائشة", "قسمتها بين ابنتيها ولم تأكل منها"], "answer": 3, "why": "جاءت امرأة ومعها ابنتان فلم تجد عائشة إلا تمرة واحدة فأعطتها إياها، فقسمتها بين ابنتيها ولم تأكل منها.", "ref": "ص 2"}, {"q": "ما أعلى درجات الإيثار على النفس؟", "options": ["إعطاء الفائض عن الحاجة", "الإحسان بالكلام فقط", "الصدقة في المناسبات", "إيثار الناس بما يحتاجه المرء حاجة ماسة"], "answer": 3, "why": "أعلى درجات الإحسان والإيثار أن تؤثر الناس بما تحتاجه أنت حاجة ماسة.", "ref": "ص 3"}, {"q": "لماذا كانت تربية البنات فيها مشقة؟", "options": ["لأنها لا تحتاج إلى نفقة", "لأنها لا تتعلم", "لأن البنت في الأصل تكون في بيتها ولا تعمل، ووليّها تلزمه رعايتها", "لأنها كثيرة الأخطاء"], "answer": 2, "why": "تربية البنات فيها مشقة لأن البنت في الأصل تكون في بيتها ولا تعمل، ووليها من تلزمه رعايتها.", "ref": "ص 3"}, {"q": "بماذا وصف النبي ﷺ صالح نساء قريش؟", "options": ["أكثرهن خروجًا للتجارة", "أجملهن", "أكثرهن مالًا", "أحناه على ولد في صغره، وأرعاه على زوج في ذات يده"], "answer": 3, "why": "قال ﷺ: «خير نساء ركبن الإبل صالح نساء قريش، أحناه على ولد في صغره، وأرعاه على زوج في ذات يده».", "ref": "ص 4"}, {"q": "ما الذي مدحه عمر رضي الله عنه في المرأة؟", "options": ["التي تقارن نفسها بغيرها", "التي تنشغل بالمظاهر", "التي تعين زوجها على الدهر ولا تعين الدهر عليه", "التي تكثر مطالبتها"], "answer": 2, "why": "مدح عمر رضي الله عنه المرأة التي تعين زوجها على الدهر ولا تعين الدهر عليه.", "ref": "ص 5"}, {"q": "ما حكم نفقة المرأة ذات المال على أولادها كما بيّنت المحاضرة؟", "options": ["لا أجر لها فيها", "محرمة", "لا يلزمها، ونفقتها عليهم من باب الإحسان ولها فيها أجر الصدقة إذا احتسبت", "واجبة عليها مطلقًا مع وجود الأب"], "answer": 2, "why": "المرأة لا يلزمها النفقة على أولادها، ونفقتها عليهم من باب الإحسان، وإذا احتسبت فهي لها صدقة.", "ref": "ص 6"}, {"q": "من أنفقت على زوجها الفقير أو أبنائها فلها:", "options": ["أجران: أجر الصدقة وأجر القرابة", "أجر واحد", "لا أجر لها", "أجر الزكاة الواجبة فقط"], "answer": 0, "why": "من أنفقت على زوجها أو أبنائها فلها أجران: أجر الصدقة وأجر القرابة.", "ref": "ص 6"}, {"q": "إذا وعدت الأم صغيرها بأمر وهي عازمة على عدم تحقيقه له، فهذا:", "options": ["مستحب لتهدئته", "جائز للأطفال", "يُعتبر كذبًا لا يجوز", "لا شيء عليها"], "answer": 2, "why": "لا يجوز الكذب على الأطفال، ووعد الطفل بأمر مع العزم على عدم الوفاء به يعد كذبًا، ويمكن إلهاؤه أو وعده بما يُستطاع.", "ref": "ص 7"}, {"q": "مما يربي على الصدق في الأولاد:", "options": ["الكذب عليهم لمصلحتهم", "تجاهل كذبهم", "معاقبتهم على كل خطأ", "حرص آبائهم على الصدق معهم"], "answer": 3, "why": "مما يربي على الصدق في الأولاد حرص آبائهم على الصدق معهم، كما في حديث عبد الله بن عامر.", "ref": "ص 8"}], "7": [{"q": "أي صلاة المرأة أفضل بحسب الحديث؟", "options": ["في المسجد الجامع", "في بيتها، وصلاتها في مخدعها أفضل من صلاتها في بيتها", "في الساحة", "في المسجد الحرام"], "answer": 1, "why": "قال ﷺ: «صلاة المرأة في بيتها أفضل من صلاتها في حجرتها، وصلاتها في مخدعها أفضل من صلاتها في بيتها».", "ref": "ص 2"}, {"q": "ماذا قال النبي ﷺ عن منع النساء من المساجد؟", "options": ["«لا تمنعوا نساءكم المساجد، وبيوتهن خير لهن»", "«امنعوا النساء من المساجد»", "«صلاة المرأة في المسجد أفضل»", "لم يرد في ذلك شيء"], "answer": 0, "why": "قال ﷺ: «لا تمنعوا نساءكم المساجد وبيوتهن خير لهن».", "ref": "ص 2"}, {"q": "لماذا أسقط الله صلاة الجماعة عن المرأة في المسجد؟", "options": ["لأنها لا تُقبل منها", "حماية لها، وبقاؤها في بيتها أفضل من الخروج لعبادات لا تجب عليها", "لأن المساجد للرجال فقط", "لأنها أقل أجرًا دائمًا"], "answer": 1, "why": "الواجب على المرأة أن تستتر، وقد أسقط الله عنها صلاة الجماعة في المسجد حماية لها، وتُمدح بكثرة لزومها بيتها.", "ref": "ص 3"}, {"q": "بأي شروط يكون خروج المرأة لطلب العلم الشرعي أفضل من بقائها؟", "options": ["أن يكون العلم دنيويًا", "أن تخرج متى شاءت", "لا شروط لذلك", "الحجاب الشرعي الكامل، وعدم مزاحمة الرجال أو الاختلاط بهم، وإذن الزوج أو الولي"], "answer": 3, "why": "خروجها لطلب العلم الشرعي أفضل بشروط: الحجاب الكامل، وعدم مزاحمة الرجال والاختلاط بهم، وألا يمنعها زوجها أو وليها.", "ref": "ص 3"}, {"q": "متى لا يجوز للمرأة الإنفاق من مال زوجها؟", "options": ["في إطعام الضيف", "إذا أذن لها", "إذا علمت منه أنه لا يأذن قطعًا", "إذا كان الإنفاق يسيرًا معتادًا"], "answer": 2, "why": "لا يجوز للمرأة أن تنفق من مال زوجها إذا علمت منه أنه لا يأذن قطعًا، وتنال الأجر إذا أنفقت بإذنه.", "ref": "ص 4"}, {"q": "ماذا تعلّمنا المحاضرة عن الصدقة القليلة؟", "options": ["قد تكون سبب النجاة من النار، وقد ترجح الموازين بشق تمرة", "تُكره إذا كانت قليلة", "لا تقبل إلا الكثيرة", "لا قيمة لها"], "answer": 0, "why": "الصدقة القليلة قد تكون سبب النجاة من النار، فلا تحقرن المسلمة من المعروف شيئًا ولو بنصف تمرة.", "ref": "ص 5"}, {"q": "ما أفضل ما يُحسَن به إلى الناس كما في أسئلة التقويم؟", "options": ["بذل النصح لهم", "إطعام الطعام", "زيارتهم", "خدمتهم"], "answer": 1, "why": "أفضل ما يُحسن به إلى الناس إطعامهم الطعام، والحض على ذلك.", "ref": "ص 5"}, {"q": "في حديث «كلكم راع»، على أي شيء المرأة راعية؟", "options": ["في عملها فقط", "في السوق", "على أقاربها البعيدين", "في بيت زوجها، وهي مسؤولة عن رعيتها"], "answer": 3, "why": "قال ﷺ: «والمرأة راعية في بيت زوجها ومسؤولة عن رعيتها».", "ref": "ص 5"}, {"q": "كيف تكون رعاية المرأة لبيت زوجها؟", "options": ["بإنفاق كل ما تملك", "بالتصرف في ماله كما تشاء", "بترك شؤونه للخدم", "بحسن تدبيره فلا تسرف ولا تتصرف في ماله بغير إذنه، ورعاية أولاده"], "answer": 3, "why": "رعاية المرأة لبيت زوجها تكون بحسن التدبير؛ فلا تسرف ولا تتصرف في ماله بغير إذنه، ومن تمام رعايتها أن ترعى أولاده.", "ref": "ص 6"}, {"q": "ما فضل المحافظة على التسبيح والتحميد والتكبير قبل النوم كما في حديث فاطمة رضي الله عنها؟", "options": ["لا يصيبه إعياء فيما يلاقيه من شغله", "يُغني عن الصلاة", "ينام نومًا عميقًا فقط", "لا تأتيه أحلام مزعجة"], "answer": 0, "why": "من حافظ على هذه الكلمات قبل النوم لم يأخذه إعياء فيما يلاقيه من شغل، وهو خير من خادم.", "ref": "ص 7"}], "8": [{"q": "ما الذي نهى عنه النبي ﷺ النساء في حديث «ولو فِرسِن شاة»؟", "options": ["الإهداء إلى الجيران", "زيارة الجارات", "طبخ الطعام", "أن تحتقر إحداهن ما تهديه لجارتها ولو كان شيئًا قليلًا"], "answer": 3, "why": "يخاطب النبي ﷺ النساء ألا تحقرن جارة لجارتها شيئًا تهديه ولو فرسن شاة، أي عظمًا قليل اللحم.", "ref": "ص 2"}, {"q": "ما الدلالة التربوية لحديث «ولو فرسن شاة»؟", "options": ["غرس قيمة البذل ولو بالقليل", "الحث على الكرم المفرط", "ربط العطاء بوفرة المال", "النهي عن تبادل الطعام"], "answer": 0, "why": "الحديث يغرس قيمة البذل والإحسان ولو بالقليل، ويدل على جواز تصدق المرأة باليسير من طعام بيت زوجها ما لم يمنعها.", "ref": "ص 3"}, {"q": "إذا كان الجار مسلمًا قريبًا فكم حقًّا له؟", "options": ["ثلاثة حقوق: حق الجوار وحق أخوة الإسلام وحق القرابة", "حق واحد", "حقان فقط", "لا حق له"], "answer": 0, "why": "الجار له حق الجوار، فإن كان مسلمًا فله حق أخوة الإسلام، وإن كان قريبًا فله حق القرابة أيضًا.", "ref": "ص 3"}, {"q": "لماذا كانت فتنة النساء من أشد الفتن على الرجال كما حذر النبي ﷺ؟", "options": ["لأن تأثير المرأة على الرجل عظيم، فإن صلحت صلح بيتها ومجتمعها وإن فسدت أفسدته", "لا علاقة لذلك بالمجتمع", "لأن الرجال أقوى", "لأن النساء أقل عددًا"], "answer": 0, "why": "المرأة الصالحة من أعظم أسباب صلاح الرجل والمجتمع، أما الفاسدة فتفسد بيتها وزوجها، ولذلك حذّر ﷺ من فتنتهن.", "ref": "ص 4"}, {"q": "ما معنى «استشرفها الشيطان» في حديث «المرأة عورة»؟", "options": ["أخفى زينتها", "حماها من الأذى", "زيّنها في نظر الرجال", "سهّل خروجها"], "answer": 2, "why": "استشرفها الشيطان أي زيّنها في نظر الرجال، وإذا خرجت دعا الشيطان أهل الفسق إلى إغوائها.", "ref": "ص 5"}, {"q": "ما الأصل في المرأة كما يستنبط من الحديث؟", "options": ["لا أصل في ذلك", "أن تعمل خارج البيت دائمًا", "أن تكون قارّة في البيت", "أن تكثر الخروج"], "answer": 2, "why": "الأصل في المرأة أن تكون قارة في بيتها، والصالحات يمدحن بلزومهن البيوت.", "ref": "ص 5"}, {"q": "من المقصود بـ«الحمو» في حديث «الحمو الموت»؟", "options": ["والد الزوجة", "أخ الزوج وقريبه", "الأخ الشقيق للمرأة", "الجار"], "answer": 1, "why": "الحمو أخو الزوج وقريبه، والحديث يحذر من الخلوة به لأن الخطر منه أشد.", "ref": "ص 6"}, {"q": "إذا كان المحرم غير مأمون فما الحكم؟", "options": ["يجوز في السفر القصير", "يجوز مطلقًا لأنه محرم", "يجوز بإذن الزوج", "لا يجوز السفر معه ولا الخلوة به"], "answer": 3, "why": "نبه العلماء إلى أن المحرم إذا كان غير مأمون فلا يجوز السفر معه ولا الخلوة به، والمحرم يجب أن يكون غيورًا حاميًا لها.", "ref": "ص 6"}, {"q": "كيف استجابت نساء الصحابة لأمر النبي ﷺ بالسير في حافات الطريق؟", "options": ["لم يستجبن", "تأخرن في الاستجابة", "سألن عن الحكمة أولًا", "استجابة فورية حتى كانت الواحدة تلتصق بالجدار حتى يتعلق ثوبها به"], "answer": 3, "why": "استجابت نساء الصحابة استجابة فورية، فكانت الواحدة منهن تلتصق بالجدار حتى يلتصق به ثوبها.", "ref": "ص 7"}, {"q": "ما أخطر نتائج تمكين النساء من الاختلاط بالرجال؟", "options": ["انتشار الفواحش والزنا", "قلة التعليم", "زيادة الزحام", "ضعف الاقتصاد"], "answer": 0, "why": "من أخطر نتائج الاختلاط المنهي عنه انتشار الفواحش والزنا، ولذلك جاءت أدلة تحريمه.", "ref": "ص 9"}], "9": [{"q": "ماذا طلبت النساء من النبي ﷺ في حديث أبي سعيد الخدري؟", "options": ["أن يأذن لهن في الجهاد", "أن يجعل لهن يومًا يعلّمهن فيه مما علّمه الله، لأن الرجال غلبوهن عليه", "أن يعطيهن من الغنائم", "أن يأذن لهن بالسفر"], "answer": 1, "why": "قالت امرأة: يا رسول الله ذهب الرجال بحديثك فاجعل لنا من نفسك يومًا نأتيك فيه تعلمنا مما علمك الله، ففعل.", "ref": "ص 2"}, {"q": "لمن يكون الأجر العظيم في فقد الأبناء؟", "options": ["للأب دون الأم", "لمن صبرت واحتسبت، أما من جزعت بمعصية فقد يفوتها هذا الأجر", "لكل من فقد ولدًا ولو جزع", "لا أجر في ذلك"], "answer": 1, "why": "الخطاب لمن صبر واحتسب، أما من جزع بمعصية فقد يفوته هذا الأجر العظيم.", "ref": "ص 3"}, {"q": "ما سبب كون أكثر أهل النار من النساء كما بيّن النبي ﷺ؟", "options": ["كثرة صلاتهن", "خروجهن للعمل", "إكثارهن اللعن وكفران العشير", "قلة عددهن"], "answer": 2, "why": "بيّن ﷺ أنهن يكثرن اللعن ويكفرن العشير، فلا يشكرن أزواجهن ولا يعترفن بفضلهم.", "ref": "ص 4"}, {"q": "ما معنى كفران العشير كما فسّره النبي ﷺ؟", "options": ["الصبر على الزوج", "كثرة الصدقة", "لو أحسن إليها الدهر ثم رأت منه شيئًا قالت: ما رأيت منك خيرًا قط", "طاعة الزوج"], "answer": 2, "why": "فسّره ﷺ بقوله: لو أحسنت إلى إحداهن الدهر ثم رأت منك شيئًا قالت: ما رأيت منك خيرًا قط.", "ref":
