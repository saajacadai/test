لى بصيرة»؟", "options": ["سؤال الخاطب عن راتبه", "تصميم مواقف ذكية أو قصص قصيرة في الرؤية الشرعية لاستدراج رأي الخاطب الحقيقي دون أسئلة مباشرة", "إجراء مقابلة رسمية", "الاكتفاء بسؤال الأهل"], "answer": 1, "why": "يطلب النشاط تصميم مواقف أو قصص قصيرة في جلسة الرؤية لاستدراج قناعات الخاطب الحقيقية دون أسئلة مباشرة.", "ref": "ص 6"}, {"q": "تقدّم شاب ملتحٍ يحافظ على الجماعة، لكنه أظهر في الرؤية انفعالًا حادًا وعدم قدرة على ضبط نفسه عند الاختلاف، فما التقييم الصحيح؟", "options": ["لا بأس به لأن الزواج سيهذب أخلاقه لاحقًا", "يفتقر إلى جوهر الدين الذي يضبط السلوك عند الغضب", "صاحب دين كامل لأن العبرة بالعبادات الظاهرة", "يُقبل فورًا"], "answer": 1, "why": "الدين ليس عبادات ظاهرة فقط؛ فمن لا يضبط سلوكه عند الغضب يفتقر إلى جوهر الدين الذي يضبط السلوك.", "ref": "ص 8"}, {"q": "اهتمام الرجل بهندامه ومظهره أمر لا ينبغي للمرأة الالتفات إليه عند الاختيار:", "options": ["صحيح دائمًا", "صحيح", "خطأ", "لا علاقة له بالاختيار"], "answer": 2, "why": "العبارة خطأ؛ فالاهتمام بالمظهر والهندام من الأمور المعتبرة، مع تقديم الدين والخلق.", "ref": "ص 8"}], "6": [{"q": "ما القوامة في أصلها الشرعي؟", "options": ["تفوق إنساني مطلق للرجل", "سلطة مطلقة", "إلغاء لدور المرأة", "تكليف وتشريف للرجل، يقوم بها على النساء بالنفقة والحماية والرعاية والقيادة الحكيمة"], "answer": 3, "why": "القوامة في أصلها تكليف وتشريف، فالرجل يقوم على النساء بالنفقة والحماية والرعاية والقيادة الحكيمة كما كان النبي ﷺ.", "ref": "ص 2"}, {"q": "ما الذي يؤدي إليه الخلل في فهم تكامل أدوار الرجل والمرأة؟", "options": ["تقوية المودة", "لا أثر له", "تفكك البيت وصراع الأدوار بدل تكاملها", "زيادة الاستقرار"], "answer": 2, "why": "المرأة تكمل دورها كزوجة وأم، وأي خلل في فهم هذا التكامل يؤدي إلى تفكك البيت وصراع الأدوار.", "ref": "ص 2"}, {"q": "ما الوقفة التي ذكرتها المحاضرة عن منكِرات القوامة؟", "options": ["أنهن لا يتأثرن بالأزمات", "أنهن يطالبن بها دائمًا", "أغلبهن ينكرنها وقت الراحة ويطلبنها وقت الشدة والأزمات", "أنهن على حق دائمًا"], "answer": 2, "why": "أغلب من ينكرن القوامة ينكرنها وقت الراحة ويطلبنها وقت الشدة، فيشتكين أن الرجال لا يقومون بأدوارهم.", "ref": "ص 3"}, {"q": "ما نتيجة القوامة بلا رحمة كمن يقول: «أنا رجل البيت ولن أستمع إليكم»؟", "options": ["استقرار البيت", "انكسار الزوجة أو تمردها، فيصبح البيت بلا سكن", "قوة العلاقة", "زيادة الاحترام"], "answer": 1, "why": "القوامة بلا رحمة واتخاذ القرارات دون رأي الزوجة يفقدها الأمان، والنتيجة انكسارها أو تمردها، فيصبح البيت بلا سكن.", "ref": "ص 4"}, {"q": "ماذا يثبت أن النبي ﷺ كان يشاور زوجاته؟", "options": ["أن المشورة واجبة في كل أمر", "أن الزوجة هي القائدة", "أن القوامة تعني إلغاء رأي الزوجة", "أن القوامة قيادة رحيمة لا دكتاتورية أسرية"], "answer": 3, "why": "كان ﷺ -وهو أعظم مثال في القوامة- يشاور زوجاته، فالقوامة قيادة رحيمة لا دكتاتورية أسرية.", "ref": "ص 4"}, {"q": "ما البعد التربوي للقوامة؟", "options": ["التحكم في كل التفاصيل", "الإنفاق فقط", "حماية الأسرة ماديًا فقط", "أن الرجل قيّم البيت يقوم بدور القدوة الحسنة فيتخلق أهله بالأخلاق الحسنة من خلاله"], "answer": 3, "why": "البعد التربوي أن الرجل قيّم البيت يقوم بدور القدوة الحسنة فيتخلق أهل البيت بالأخلاق الحسنة من خلاله.", "ref": "ص 5"}, {"q": "ما «القوامة الاجتماعية» التي حذرت منها المحاضرة؟", "options": ["قوامة تقوم على العادات والتقاليد لا على النصوص، وكثيرًا ما تخالف الشرع كمسألة الميراث", "خدمة المجتمع", "القوامة الشرعية", "قيادة الرجل في المجتمع"], "answer": 0, "why": "القوامة الاجتماعية نوع خاطئ يقوم على العادات والتقاليد لا على نصوص القرآن، وكثيرًا ما تخالف الشرع كمسألة الميراث.", "ref": "ص 5"}, {"q": "من مقاصد تشريع القوامة:", "options": ["إلغاء دور المرأة", "التسلط", "تنظيم الحياة الزوجية وتحقيق العدالة والتكامل بين الزوجين", "الصراع على الأدوار"], "answer": 2, "why": "من مقاصد القوامة تنظيم الحياة الزوجية، فأي اجتماع لا بد له من قائد، وتحقيق العدالة، والتكامل بين الزوجين.", "ref": "ص 6"}, {"q": "هل تعني مشاورة الزوجة الأخذ برأيها دائمًا؟", "options": ["تعني أن القرار لها", "نعم دائمًا", "لا مشاورة أصلًا", "لا، وإنما هي من حسن العشرة، فقد لا يكون رأيها صائبًا فيضطر الزوج للانفراد برأيه"], "answer": 3, "why": "مشاورة الزوجة لا تعني الأخذ برأيها دائمًا، وإنما هي من حسن العشرة، وقد يضطر الزوج للانفراد برأيه.", "ref": "ص 7"}, {"q": "من أركان القوامة:", "options": ["الإنفاق والمسؤولية", "تبادل الأدوار", "الحنان فقط", "الاستبداد بالرأي"], "answer": 0, "why": "من أركان القوامة ومقوماتها الإنفاق والمسؤولية، وتحقيقها = سكن نفسي + مودة ورحمة + تربية سليمة للأولاد.", "ref": "ص 8"}], "7": [{"q": "ما حقيقة القوامة كما بيّنت المحاضرة؟", "options": ["صفة تلازم كل ذكر بلا شروط", "تفوق مطلق", "صلاحية مطلقة للرجل", "مسؤولية قبل أن تكون صلاحية، وتكليف قبل أن تكون تشريفًا"], "answer": 3, "why": "القوامة مسؤولية قبل أن تكون صلاحية، وتكليف قبل أن تكون تشريفًا، وليست صفة تطلق على كل رجل لكونه ذكرًا.", "ref": "ص 2"}, {"q": "ما فكرة نشاط «غرس حس القوامة» مع الأخ الصغير أو الطفل؟", "options": ["أن يجمع المال", "أن يتولى لمدة أسبوع شراء إحدى احتياجات البيت من ميزانية محددة ويخطط لها", "أن يقرر كل شؤون البيت", "أن يتولى تأديب إخوته"], "answer": 1, "why": "يتولى الطفل لمدة أسبوع شراء احتياج أساسي كالخبز من ميزانية محددة، فيتابع الأسعار ويخطط، فيتدرب على القوامة.", "ref": "ص 3"}, {"q": "ما الذي يدمر القوامة من جهة العلم بالحقوق؟", "options": ["المشاورة", "الجهل بحقوق الزوجة، فالظلم يُسقط القوامة والطاعة ليست عبودية", "العلم بالحقوق", "الإنفاق"], "answer": 1, "why": "الجهل بحقوق الزوجة يدمر القوامة؛ والرجل المؤهل يدرك أن الطاعة ليست عبودية، وأن الظلم يسقط قوامته.", "ref": "ص 4"}, {"q": "ما الفرق بين القوامة والقيادة؟", "options": ["القيادة للزوجة والقوامة للزوج", "القوامة تحمّل المسؤولية، والقيادة الممارسة الراشدة لهذه المسؤولية", "القوامة أسلوب والقيادة مسؤولية", "لا فرق بينهما"], "answer": 1, "why": "القوامة في الإسلام تحمّل مسؤولية قيادة الأسرة، والقيادة كيفية ممارسة هذه المسؤولية.", "ref": "ص 4"}, {"q": "كيف يتصرف القائد الحقيقي للبيت عند الاختلاف؟", "options": ["يترك القرار للأولاد", "يلجأ للعقوبة فورًا", "يتشاور ويحاور، فإن تعذر الاتفاق حسم القرار وتحمل مسؤوليته بالعدل، ويبدأ بالإصلاح قبل العقوبة", "يفرض رأيه دون حوار"], "answer": 2, "why": "عند الاختلاف يتشاور القائد ويحاور، فإن تعذر الاتفاق حسم القرار وتحمل مسؤوليته وحكم بالعدل، ويبدأ بالإصلاح قبل العقوبة.", "ref": "ص 5"}, {"q": "ماذا تحتاج القوامة في اتخاذ القرارات؟", "options": ["ترك القرار للزوجة", "النضج العقلي والحكمة والشورى", "رأي الأقارب", "السرعة والحسم دون مشورة"], "answer": 1, "why": "القوامة تحتاج في اتخاذ القرارات إلى النضج العقلي والحكمة والشورى.", "ref": "ص 9"}, {"q": "من أسباب القوامة:", "options": ["العمر", "قوة البدن فقط", "كثرة المال فقط", "الاستقامة الدينية، والقدرة على النفقة دون منّ، وتحمل المسؤولية، والعدل وحسن الخلق"], "answer": 3, "why": "من أسباب القوامة الاستقامة الدينية، والقدرة على النفقة الواجبة دون من أو أذى، وتحمل المسؤولية، والعدل وحسن الخلق.", "ref": "ص 6"}, {"q": "من شروط طاعة الزوج:", "options": ["أن تكون في المعصية إذا أمر", "أن تكون في كل أمر دون استثناء", "لا شروط لها", "أن تكون في المعروف لا في معصية، وأن يكون قائمًا بواجباته، وألا تكون فيما يضرها"], "answer": 3, "why": "من شروط طاعة الزوج أن تكون في المعروف لا في معصية، وأن يكون قائمًا بواجباته، وألا تكون فيما فيه ضرر عليها: «لا ضرر ولا ضرار».", "ref": "ص 7"}, {"q": "في المقارنة بين القائد والمستبد في التعامل مع الزوجة، ما صفة القائد؟", "options": ["احترامها وحفظ كرامتها وإشراكها في القرار", "تخويفها", "إلغاء دورها", "تهديدها واحتقارها"], "answer": 0, "why": "القائد يحترم زوجته ويحفظ كرامتها ويشركها في القرار، أما المستبد فيهددها ويحتقرها ويلغي دورها.", "ref": "ص 8"}, {"q": "كيف يتعامل القائد مع الخطأ مقارنةً بالمستبد؟", "options": ["لا يعترف بالخطأ", "يطالب بالحقوق ولا يؤدي الواجبات", "يحمّل الزوجة نتائج الفشل", "يتحمل الخطأ ويصلحه ولا يلقي اللوم ويلتمس العذر"], "answer": 3, "why": "القائد يقوم بالواجبات ويتحمل الخطأ ويصلحه ويلتمس العذر، أما المستبد فيطالب بالحقوق ولا يؤدي الواجبات ويلقي اللوم.", "ref": "ص 8"}], "8": [{"q": "لماذا كان توحيد القيادة أمرًا أساسيًا لأمن الأسرة؟", "options": ["لأنه يمنع المشاورة", "لأنه يلغي دور المرأة", "لا علاقة له بالأمن", "لأن اختلاط الأدوار وتداخل المفاهيم أدى إلى الصراعات وتفكك البيوت"], "answer": 3, "why": "في زمن اختلاط الأدوار وتشوه الفطرة ظهرت الصراعات وتفككت البيوت، وتوحيد القيادة أمر أساسي لأمن الأسرة.", "ref": "ص 2"}, {"q": "توحيد القيادة داخل الأسرة من عوامل استقرارها:", "options": ["صحيح", "خطأ", "صحيح في بعض البيوت فقط", "لا علاقة له"], "answer": 0, "why": "العبارة صحيحة؛ فتوحيد القيادة أمر أساسي لأمن الأسرة واستقرارها.", "ref": "ص 8"}, {"q": "هل تعني القوامة تفوقًا إنسانيًا مطلقًا للرجل على المرأة؟", "options": ["تعني تفوق المرأة", "نعم مطلقًا", "لا، فلكل منهما صفات تؤهله لدوره: المرأة لتكون أمًّا وزوجة، والرجل للقيادة ومواجهة الصعاب", "نعم في كل شيء"], "answer": 2, "why": "العبارة خطأ؛ فالله أعطى المرأة صفات تؤهلها لتكون أمًّا وزوجة، والرجل صفات تؤهله للقيادة ومواجهة الصعاب.", "ref": "ص 3"}, {"q": "من صور المورد المالي في النفقة:", "options": ["الادخار فقط", "إعطاء الأولاد ما يريدون دون ضابط", "السكن اللائق الذي لا يؤثر سلبًا على دينهم، والطعام الطيب، واللباس اللائق", "الكماليات فقط"], "answer": 2, "why": "النفقة واجب شرعي تتمثل في السكن اللائق في مكان لا يؤثر سلبًا على دينهم، والطعام الطيب، واللباس اللائق.", "ref": "ص 3"}, {"q": "من الجوانب الإدارية للقوامة داخل البيت:", "options": ["الإنفاق فقط", "ترك الأمور دون تخطيط", "الرحمة فقط", "توزيع الأدوار وإدارة الوقت والأزمات وتخفيف العبء عن الأم"], "answer": 3, "why": "من الجوانب الإدارية إدارة الوقت وتوزيع الأدوار بين أفراد الأسرة وإدارة الأزمات وتخفيف العبء عن الأم.", "ref": "ص 4"}, {"q": "لماذا تحتاج الأسرة إلى أب ثابت عند الأزمات؟", "options": ["لأنها تستمد منه الثبات، فلو انهار عند الصعاب انهارت الأسرة سريعًا", "لأن الأم لا دور لها", "لأن الثبات يغني عن الرحمة", "لا حاجة لذلك"], "answer": 0, "why": "تحتاج الأسرة إلى أب ثابت تستمد منه الثبات، فلو انهار الأب عند الصعاب ستنهار الأسرة سريعًا.", "ref": "ص 4"}, {"q": "ما القوامة بلا حكمة كما وصفتها المحاضرة؟", "options": ["قيادة رشيدة", "مشاورة", "رحمة", "تسلّط وتجبّر"], "answer": 3, "why": "يحتاج الرجل إلى حكمة وحنان لحسن استخدام قوامته، فالزوجة تحتاج إلى احتواء قبل التوجيه، والقوامة بلا حكمة تسلط وتجبر.", "ref": "ص 5"}, {"q": "من العوامل التي تضعف القوامة:", "options": ["غياب القدوة، والصراع داخل البيت، والإعلام والطرح الثقافي المشوّه", "القدوة الحسنة", "الشورى", "التكامل"], "answer": 0, "why": "من العوامل التي تضعف القوامة غياب القدوة الأبوية، والصراع على الأدوار، والإعلام الذي يروّج أن الرجل مستبد.", "ref": "ص 6"}, {"q": "ما حكم إنفاق الرجل على زوجته وأولاده في الشريعة؟", "options": ["مسؤولية مشتركة بالتساوي", "واجب ولو كانت الزوجة غنية", "مباح", "مستحب"], "answer": 1, "why": "من جمال الشريعة أن الرجل ملزم بالنفقة حتى لو كانت الزوجة غنية، بخلاف بيئات تجعلها مسؤولية مشتركة.", "ref": "ص 7"}, {"q": "ما المطلوب في نشاط «إحياء معنى القوامة»؟", "options": ["كتابة قصة خيالية", "اختيار سببين لضعف القوامة وتحليلهما بمثال واقعي ومعالجة شرعية", "مقارنة الأزواج", "تعداد مميزات الرجل"], "answer": 1, "why": "يطلب النشاط اختيار سببين من أسباب ضعف القوامة كالطرح الإعلامي المشوه، وتحليلهما بمثال واقعي ومعالجة شرعية.", "ref": "ص 7"}], "9": [{"q": "لماذا يجب الاهتمام بالأسرة وضبط علاقة الزوجين وفق شرع الله؟", "options": ["لأن الأسرة شأن ثانوي", "لأن المحاكم لا تتدخل", "لأن أغلب المشاكل الاجتماعية وقضايا المحاكم تتعلق بالمشاكل الزوجية", "لا حاجة لذلك"], "answer": 2, "why": "بالنظر في المشاكل الاجتماعية وقضايا المحاكم يتبين أن أغلبها يتعلق بالمشاكل الزوجية، فيجب ضبطها بشرع الله.", "ref": "ص 2"}, {"q": "ماذا قال النبي ﷺ لمعاذ حين سجد له بعد عودته من الشام؟", "options": ["«لو كنت آمرًا أحدًا أن يسجد لغير الله لأمرت المرأة أن تسجد لزوجها»", "«اسجد لأبيك»", "«أحسنت»", "«السجود مباح للتحية»"], "answer": 0, "why": "قال ﷺ: «فلا تفعلوا، فإني لو كنت آمرًا أحدًا أن يسجد لغير الله لأمرت المرأة أن تسجد لزوجها»، بيانًا لعظم حقه.", "ref": "ص 3"}, {"q": "ما معنى «القانتات» في قوله تعالى: ﴿فالصالحات قانتات حافظات للغيب﴾؟", "options": ["العاملات", "المطيعات لأزواجهن", "الكثيرات الصلاة فقط", "الصامتات"], "answer": 1, "why": "القانتات هن المطيعات لأزواجهن كما قال أهل التفسير، وطاعتهن مقيدة بما أمر الله لا في معصيته.", "ref": "ص 4"}, {"q": "الطاعة بالمعروف تعني:", "options": ["تنفيذ كل أمر دون استثناء", "الطاعة ضمن حدود الشرع", "عدم الطاعة", "الطاعة في معصية الله"], "answer": 1, "why": "الطاعة بالمعروف هي الطاعة ضمن حدود الشرع، فلا طاعة في معصية الله.", "ref": "ص 10"}, {"q": "متى يشترط إذن الزوج في صيام النافلة؟", "options": ["لا يشترط أبدًا", "مطلقًا ولو كان غائبًا", "في رمضان", "إذا كان الزوج حاضرًا (شاهدًا)"], "answer": 3, "why": "قال ﷺ: «لا يحل للمرأة أن تصوم وزوجها شاهد إلا بإذنه»، فرضا الزوج شرط في صيام النفل إذا كان حاضرًا.", "ref": "ص 5"}, {"q": "يجوز للمرأة الخروج من بيت زوجها بدون إذنه:", "options": ["خطأ", "صحيح", "صحيح دائمًا", "صحيح إذا كانت غاضبة"], "answer": 0, "why": "العبارة خطأ؛ فمن واجبات الزوجة ألا تخرج من بيتها إلا بإذن زوجها.", "ref": "ص 10"}, {"q": "ما الذي نبّهت إليه «اللفتة» بشأن سكوت الزوجة عن معروف زوجها؟", "options": ["أن السكوت أفضل دائمًا", "أن الزوج لا يحتاج تقديرًا", "أن السكوت قد يعدّ إساءة، فمن واجبها الشكر والتقدير وألا تستغني عن ذلك", "أن الشكر غير مطلوب"], "answer": 2, "why": "السكوت في بعض المواقف قد يعد إساءة لزوجها، فإذا قدم معروفًا لأهل بيته فمن واجبها الشكر والتقدير.", "ref": "ص 6"}, {"q": "بماذا كانت توصي المرأة الصالحة زوجها في ترك المطالبة بما يفوق طاقته؟", "options": ["«إياك وكسب الحرام، فإنا نصبر على الجوع والضر ولا نصبر على النار»", "«لا تهتم بمصدر المال»", "«أكثر من المال بأي طريق»", "«اقترض لتلبية حاجاتنا»"], "answer": 0, "why": "روي عن امرأة صالحة أنها كانت توصي زوجها: إياك وكسب الحرام فإنا نصبر على الجوع والضر ولا نصبر على النار.", "ref": "ص 7"}, {"q": "من واجبات الزوجة تجاه زوجها:", "options": ["حسن العشرة فقط", "كفّ لسانها عنه، وحفظ ماله، وحسن العشرة جميعًا", "لا واجبات عليها", "حفظ ماله فقط"], "answer": 1, "why": "من واجبات الزوجة: الطاعة بالمعروف، وكف لسانها عنه، وحفظ ماله، وحسن العشرة، والإحسان إلى والديه.", "ref": "ص 10"}, {"q": "كيف تتعامل الزوجة مع أهل زوجها؟", "options": ["تتجاهلهم", "تحرضه عليهم", "تحسن إليهم وتحترمهم وتحثه على برّهم وصلتهم", "تقاطعهم"], "answer": 2, "why": "يحب الزوج أن يرى من زوجته احترام أهله والإحسان إليهم، فتحسن إليهم وتحثه على برهم وصلتهم.", "ref": "ص 8"}], "10": [{"q": "ما المراحل الثلاث التي تمر بها الحياة الزوجية كما في المحاضرة؟", "options": ["الخطبة والعقد والزفاف", "الطفولة والشباب والكهولة", "مرحلة العسل (العاطفة)، ومرحلة العمل، ومرحلة الأمل", "التعارف والخلاف والطلاق"], "answer": 2, "why": "تمر الحياة الزوجية بثلاث مراحل: مرحلة العسل (العاطفة)، ومرحلة العمل، ومرحلة الأمل.", "ref": "ص 2"}, {"q": "أي العبارات تعبّر عن مرحلة العسل؟", "options": ["تضخيم الإيجابيات وتصغير السلبيات", "ظهور الاختلافات", "تحول الحب إلى سلوك", "الفهم العميق للطرف الآخر"], "answer": 0, "why": "من سمات مرحلة العسل تغليب العاطفة على العقل، ومن علاماته تضخيم إيجابيات الطرف الآخر وتصغير سلبياته.", "ref": "ص 2"}, {"q": "ما السؤال الذي تطرحه الفتاة على نفسها كلما رأت سلبية في الخاطب؟", "options": ["هل يلاحظ الناس ذلك؟", "هل سيتغير بعد الزواج حتمًا؟", "هل أنا قادرة على تحمّل هذا السلوك طوال حياتي معه؟", "هل أستطيع تغييره؟"], "answer": 2, "why": "تنصح المحاضرة الفتاة أن تسأل نفسها: هل أنا قادرة على تحمل هذا السلوك طوال حياتي معه؟", "ref": "ص 3"}, {"q": "أي مما يلي يعد من الأخطاء الخطرة في الاختيار؟", "options": ["الملاحظة", "النقاش", "التبرير المستمر لأخطاء الطرف الآخر", "السؤال"], "answer": 2, "why": "من سمات مرحلة العسل التجاوز عن الأخطاء وتبريرها باستمرار، وهو من الأخطاء الخطرة في الاختيار.", "ref": "ص 10"}, {"q": "من أسباب المثالية العالية لدى الفتاة قبل الزواج:", "options": ["أفكار خاطئة مستقاة من المسلسلات والقصص والروايات", "الواقعية", "الاستشارة", "التجربة"], "answer": 0, "why": "المثالية العالية أن تتوقع الفتاة زوجًا بلا عيوب، بناءً على أفكار خاطئة من المسلسلات والقصص والروايات.", "ref": "ص 4"}, {"q": "ما الذي يظهر في مرحلة العمل؟", "options": ["تضخيم الإيجابيات", "الاختلافات بسبب اختلاف العادات والطباع", "المثالية العالية", "التعلق العاطفي الزائد"], "answer": 1, "why": "في مرحلة العمل تظهر الاختلافات بسبب اختلاف العادات والطباع، كأن يكون الزوج هادئًا والزوجة انفعالية.", "ref": "ص 5"}, {"q": "ما الصحيح عند تدخل أهل الزوج في العلاقة الزوجية؟", "options": ["أن تفتح الزوجة الموضوع مع زوجها من البداية وتتحاور معه بأدب لتفادي التراكم", "أن تشكو لأهلها", "أن تكتم طويلًا حتى تنفجر", "أن تقاطع أهله"], "answer": 0, "why": "الصحيح أن تفتح الموضوع مع زوجها من البداية وتتحاور معه بأدب واحترام لتفادي التراكم الذي يؤدي إلى الكره.", "ref": "ص 6"}, {"q": "لماذا كانت السنة الأولى من الزواج أكثر المراحل تعرضًا للطلاق؟", "options": ["لتدخل الجيران", "لكثرة الأولاد", "لتفسير الزوجين اختلافاتهما على أنها فشل في الحب وأنهما غير مناسبين", "لقلة المال"], "answer": 2, "why": "أول سنة أكثر مرحلة معرضة للطلاق بسبب تفسير الزوجين اختلافاتهما على أنها فشل في الحب وعدم تناسب.", "ref": "ص 7"}, {"q": "المشكلة في الاختلافات بين الزوجين في مرحلة العمل ليست في:", "options": ["وجودها", "فهمها", "إدارتها", "التعامل معها"], "answer": 0, "why": "الاختلافات طبيعية، والمشكلة ليست في وجودها بل في فهمها وإدارتها والتعامل معها.", "ref": "ص 10"}, {"q": "ما الخلاصة التي ختمت بها المحاضرة عن المراحل الثلاث؟", "options": ["العمل مرحلة الطلاق", "الأمل مرحلة المثالية", "العسل حب الصورة، والعمل الاصطدام بالحقيقة، والأمل العيش بوعي واتزان", "العسل أفضل المراحل"], "answer": 2, "why": "مرحلة العسل حب الصورة، ومرحلة العمل الاصطدام بالحقيقة، ومرحلة الأمل العيش بوعي واتزان، فتحبين زوجك كما هو لا كما تتخيلين.", "ref": "ص 9"}], "11": [{"q": "ما المنظومة الوجدانية العاطفية في الحياة الزوجية؟", "options": ["القوانين الأسرية", "الحقوق المالية", "المشاعر والتعبيرات والسلوكيات العاطفية المتبادلة القائمة على المودة والرحمة", "الأحكام الفقهية فقط"], "answer": 2, "why": "المنظومة الوجدانية هي المشاعر والتعبيرات والسلوكيات العاطفية التي يتبادلها الزوجان القائمة على المودة والرحمة.", "ref": "ص 2"}, {"q": "ما الذي يدل عليه مسابقة النبي ﷺ لعائشة وشربه من موضع شربها ونداؤها «يا عائش»؟", "options": ["أن العاطفة غير مهمة", "أن الجانب العاطفي بين الزوجين ليس ترفًا بل من السنة التي تحيي القلوب والبيوت", "أنه خاص بالنبي ﷺ", "أن ذلك للتسلية فقط"], "answer": 1, "why": "مواقفه ﷺ مع عائشة تدل على أن الجانب العاطفي بين الزوجين ليس ترفًا وإنما من السنة التي تحيي القلوب والبيوت.", "ref": "ص 3"}, {"q": "من مظاهر الفتور العاطفي:", "options": ["المفاجآت", "جفاف الكلام وغياب الاهتمام والروتين", "الهدايا", "التواصل المستمر"], "answer": 1, "why": "من مظاهر الفتور العاطفي جفاف الكلام، وغياب الاهتمام كعدم الاتصال للاطمئنان، والروتين القاتل.", "ref": "ص 4"}, {"q": "ما أثر الاتصال القصير بين الزوجين أثناء العمل للاطمئنان؟", "options": ["لا يأخذ أكثر من دقيقة لكنه يصنع فرقًا في العلاقة", "لا أثر له", "يزعج الطرف الآخر", "يضيع الوقت"], "answer": 0, "why": "سؤال الزوجة زوجها عن حاله أو سؤاله عنها فعل لا يأخذ أكثر من دقيقة لكنه يصنع فرقًا.", "ref": "ص 4"}, {"q": "من أفكار نشاط «إحياء العاطفة»:", "options": ["مقارنته بغيره", "مراقبة هاتفه", "مقاطعة الزوج", "جلسة مصارحة هادئة بسؤال الزوج: ما أكثر شيء يسعدك عندما أفعله؟ وقضاء يوم كامل دون هاتف"], "answer": 3, "why": "من أفكار النشاط جلسة مصارحة: ما أكثر شيء يسعدك عندما أفعله؟ والاتفاق على يوم دون هاتف، ودعوة إلى عشاء.", "ref": "ص 5"}, {"q": "ما أركان المنظومة الأخلاقية الشرعية؟", "options": ["العادات والتقاليد", "القوانين المدنية", "المرجعية الشرعية، والقيم الأخلاقية، والتطبيق العملي اليومي داخل البيت", "المال والجاه والجمال"], "answer": 2, "why": "تقوم المنظومة الأخلاقية على ثلاثة أركان: المرجعية الشرعية، والقيم الأخلاقية كالرحمة والعدل، والتطبيق العملي اليومي.", "ref": "ص 6"}, {"q": "من القيم التي تقوم عليها المنظومة الأخلاقية:", "options": ["رفع الصوت", "الانتقام", "حسن الكلام، وكظم الغيظ والعفو، وحفظ الأسرار", "نشر خصوصيات البيت"], "answer": 2, "why": "من القيم حسن الكلام ﴿وقولوا للناس حسنًا﴾، وكظم الغيظ والعفو، وحفظ الأسرار وعدم نشر خصوصيات البيت.", "ref": "ص 7"}, {"q": "ما آثار الغريزة الفطرية في إطار الزواج؟", "options": ["لا أثر لها", "زيادة الخلافات", "الابتعاد بين الزوجين", "تحقيق الانجذاب والألفة بين الزوجين، واستقرار العلاقة والحماية من الشهوات غير المشروعة"], "answer": 3, "why": "من آثار الغريزة الفطرية في إطار الزواج تحقيق الانجذاب والألفة، واستقرار العلاقة والحماية من الشهوات غير المشروعة.", "ref": "ص 8"}, {"q": "أهم ما يحتاجه الزوج غالبًا:", "options": ["الهدايا", "التقدير والاحترام", "التعبير بالكلام فقط", "المال"], "answer": 1, "why": "أهم ما يحتاجه الزوج غالبًا التقدير والاحترام.", "ref": "ص 9"}, {"q": "العاطفة وحدها كافية لنجاح العلاقة الزوجية:", "options": ["صحيح دائمًا", "صحيح في السنة الأولى", "صحيح", "خطأ"], "answer": 3, "why": "العبارة خطأ؛ فالحياة الزوجية تقوم على ثلاث منظومات (وجدانية وأخلاقية وفطرية)، واجتماعها يحقق الاستقرار.", "ref": "ص 9"}], "12": [{"q": "ما المقصود باختلاف الطباع بين الزوجين؟", "options": ["التباين في الصفات الشخصية والميول والانفعالات وطرق التفكير والسلوكيات", "وجود خلل في العلاقة", "الخيانة", "الكره بين الزوجين"], "answer": 0, "why": "اختلاف الطباع وجود تباين في الصفات والميول والانفعالات وطرق التفكير والسلوكيات، فيرى كل منهما الأمور من زاوية مختلفة.", "ref": "ص 2"}, {"q": "هل يدل اختلاف الطباع بين الزوجين غالبًا على خلل في العلاقة؟", "options": ["يدل على عدم الحب", "نعم إذا كان كبيرًا", "نعم دائمًا", "لا، وإنما هو جزء طبيعي من الفروق البشرية"], "answer": 3, "why": "العبارة خطأ؛ فاختلاف الطباع ليس خطأ من أي منهما وإنما جزء طبيعي من الفروق بين البشر.", "ref": "ص 9"}, {"q": "من أسباب اختلاف الطباع:", "options": ["لون البيت", "نوع الطعام", "التجارب السابقة المؤلمة، والنشأة، وضغوط العمل", "الطقس"], "answer": 2, "why": "من أسباب اختلاف الطباع التجارب السابقة المؤلمة، والنشأة في بيت لا يُعبَّر فيه عن المشاعر، وضغوط العمل.", "ref": "ص 3"}, {"q": "ما الفرق بين الاختلاف الطبيعي والاختلاف المؤذي؟", "options": ["الطبيعي ليس فيه مشكلات أبدًا", "المؤذي فيه مشاعر أكثر", "لا فرق بينهما", "الطبيعي لا يفسد الاحترام ويمكن التعايش معه، والمؤذي يؤدي إلى صراع دائم وإهانات"], "answer": 3, "why": "الاختلاف الطبيعي لا يفسد الاحترام ويمكن أن يكون سببًا للتكامل، أما المؤذي فيؤدي إلى صراع دائم وإهانات وغياب الأمان.", "ref": "ص 4"}, {"q": "من مظاهر الاختلاف المؤذي:", "options": ["الاختلاف في تنظيم الوقت", "الاختلاف في الطعام المفضل", "الاختلاف في الهوايات", "دوام السخرية من الطرف الآخر وأسلوبه وطريقة كلامه"], "answer": 3, "why": "من مظاهر الاختلاف المؤذي أن يكون أحد الطرفين دائم السخرية من الآخر، ما يجرح الكرامة.", "ref": "ص 4"}, {"q": "من مهارات إدارة الخلاف الواعي:", "options": ["رفع الصوت", "تجاهل المشكلة", "الرد السريع", "التوقف المؤقت قبل الرد، وخفض نبرة الصوت، وتأجيل النقاش"], "answer": 3, "why": "من المهارات التوقف قبل الرد ولو لثوانٍ، وخفض نبرة الصوت لأن الصوت العالي تصعيد تلقائي، وتأجيل النقاش.", "ref": "ص 5"}, {"q": "ماذا قررت الإضاءة بشأن الخلاف بين الزوجين؟", "options": ["الخلاف يهدم البيت دائمًا", "الخلاف دليل فشل", "يجب تجنب أي خلاف", "الخلاف لا يهدم العلاقة، لكن الطريقة التي نختلف بها قد تبني البيت أو تهدمه"], "answer": 3, "why": "الخلاف بين الزوجين لا يهدم العلاقة، غير أن الطريقة التي نختلف بها قد تبني البيت أو تهدمه.", "ref": "ص 6"}, {"q": "ماذا فعل النبي ﷺ حين كسرت إحدى زوجاته صحفة الطعام غيرةً؟", "options": ["غضب وعاقبها", "احتوى الموقف بهدوء وجمع الطعام وقال: «غارت أمكم»", "طلّقها", "تركها دون كلام"], "answer": 1, "why": "من الأساليب النبوية احتواء الغضب لا مقابلته بالغضب، فجمع ﷺ الطعام في الصحفة وقال: «غارت أمكم».", "ref": "ص 6"}, {"q": "ما الهدف الأهم من إدارة الخلاف الزوجي؟", "options": ["الانتصار للرأي", "إنهاء النقاش بأي طريقة", "إثبات الخطأ على الآخر", "الحفاظ على الود ومصلحة العلاقة لا الانتصار للرأي"], "answer": 3, "why": "من مبادئ الحكمة تقديم مصلحة العلاقة على الانتصار في الخلاف، فالهدف الحفاظ على الود لا إثبات صحة الرأي.", "ref": "ص 7"}, {"q": "ما الذي تنبه إليه نشاط «لا تتركي الأثر ينمو»؟", "options": ["تسجيل أخطاء الزوج", "أن العلاقات لا تنهار من الخلاف نفسه بل من تراكم آثاره، فتبادر الزوجة بخطوة صغيرة كاعتذار أو كلمة لطيفة", "تجاهل آثار الخلاف", "انتظار أن يبدأ الزوج"], "answer": 1, "why": "العلاقات لا تنهار من الخلاف نفسه بل من تراكم آثاره، فتختار الزوجة خطوة صغيرة: كلمة لطيفة أو اعتذارًا أو رسالة.", "ref": "ص 8"}], "13": [{"q": "ما المنظومة الكاملة لبناء البيت المسلم التي توضحها آية ﴿ومن آياته أن خلق لكم من أنفسكم أزواجًا﴾؟", "options": ["الإنجاب فقط", "السكن والمودة والرحمة، وإذا اختل أحدها اختل البناء", "المال والجمال والنسب", "الطاعة والقوامة فقط"], "answer": 1, "why": "الآية توضح المنظومة الكاملة لبناء البيت المسلم: السكن والمودة والرحمة، وإذا اختل أحد هذه المعايير اختل البناء.", "ref": "ص 2"}, {"q": "ما المحرك الحقيقي للمودة والرحمة في البيت المسلم؟", "options": ["توافق الطباع فقط", "الدافع الإيماني والتعبد لله تعالى في معاملة الطرف الآخر", "المصلحة المادية", "العادات الاجتماعية"], "answer": 1, "why": "المحرك الإيماني أن يتعبد كل طرف لله في معاملته للآخر، فينتقل بالعلاقة من جسدية إلى روحية.", "ref": "ص 3"}, {"q": "المودة في مفهومها الصحيح هي:", "options": ["هدايا في المناسبات", "سلوكيات عملية تعبّر عن الحب", "تعبير عن الحب بالكلام فقط", "شعور عاطفي داخلي فقط"], "answer": 1, "why": "المودة سلوكيات عملية تعبر عن الحب في الأقوال والأفعال والمواقف.", "ref": "ص 8"}, {"q": "الرحمة بين الزوجين تظهر عند:", "options": ["أوقات الفرح فقط", "حال الضعف والتقصير والاختلاف", "حال القوة والاستقرار فقط", "المناسبات"], "answer": 1, "why": "الرحمة تظهر في حال الضعف والتقصير والاختلاف.", "ref": "ص 8"}, {"q": "من صور الحب العملي والمودة في الأفعال:", "options": ["الشكوى فور عودته", "أن يجد الزوج عند عودته الطعام جاهزًا والبيت مرتبًا وزوجته متفرغة له", "تأجيل شؤون البيت", "انشغال الزوجة بالهاتف عند عودته"], "answer": 1, "why": "من صور الحب العملي الاهتمام بنظافة البيت وأن يجد الزوج عند عودته الطعام جاهزًا والبيت نظيفًا وزوجته متفرغة له.", "ref": "ص 4"}, {"q": "كيف تتعامل الزوجة الحريصة على المودة مع زوجها عند الخلاف؟", "options": ["تذكر عيوبه أمام الناس", "ترفع صوتها", "لا تقلل من قيمته وتحفظ كرامته", "تقارنه بغيره"], "answer": 2, "why": "الزوجة الحريصة على المودة والرحمة لا تقلل من قيمة زوجها عند الخلاف وتحفظ كرامته.", "ref": "ص 4"}, {"q": "ما القدوة التي ضربتها المحاضرة في «الاحتواء لا النقد»؟", "options": ["حفصة", "عائشة في حادثة الإفك", "خديجة رضي الله عنها حين طمأنت النبي ﷺ: «كلا، والله لا يخزيك الله أبدًا»", "أم سلمة في الحديبية"], "answer": 2, "why": "لما جاء النبي ﷺ ترجف بوادره احتوته خديجة فقالت: «كلا والله لا يخزيك الله أبدًا، إنك لتصل الرحم...».", "ref": "ص 5"}, {"q": "ما الفرق بين الاحتواء والنقد المستمر في أثرهما على القلوب؟", "options": ["النقد يفتح القلوب", "لا فرق", "الاحتواء يفتح القلوب، والنقد المستمر يغلقها", "كلاهما يغلق القلوب"], "answer": 2, "why": "الاحتواء يفتح القلوب، بينما النقد المستمر يغلق القلوب ولا يفتحها.", "ref": "ص 5"}, {"q": "بماذا تستبدل الزوجة الجمل المنفّرة مثل «كعادتك» و«أنت لا تهتم»؟", "options": ["بالصمت التام", "بجمل أشد لومًا", "بالشكوى لأهلها", "بجمل جذب ذكية تمنحه الأمان وتقدّر مجهوده رغم التقصير مثل «لعله خير، وجودك أهم»"], "answer": 3, "why": "تستبدل الجمل المنفرة المليئة باللوم بجمل جذب تمنحه الأمان وتقدر مجهوده مثل: لعله خير، لا بأس، وجودك أهم.", "ref": "ص 7"}, {"q": "العلاقة الزوجية الناجحة تقوم على المطالبة بالحقوق:", "options": ["صحيح", "خطأ، بل تقوم على السكن والمودة والرحمة والعطاء", "صحيح للزوجة فقط", "صحيح للزوج فقط"], "answer": 1, "why": "العبارة خطأ؛ فالعلاقة الناجحة تقوم على السكن والمودة والرحمة والعطاء لا على مجرد المطالبة بالحقوق.", "ref": "ص 8"}], "14": [{"q": "لماذا يُعدّ تحديد الأدوار داخل الأسرة أكثر من مسألة تنظيمية؟", "options": ["لأنه يحقق المقاصد الشرعية من الزواج، فيحل التوازن وتقل النزاعات حين يؤدي كل طرف دوره", "لأنه شأن ثانوي", "لأنه يزيد الأعباء", "لأنه يلغي التعاون"], "answer": 0, "why": "تحديد الأدوار يحقق المقاصد الشرعية من الزواج؛ فإذا أدى كل من الزوجين دوره حل التوازن النفسي والاجتماعي وقلت النزاعات.", "ref": "ص 2"}, {"q": "ما الفرق بين الدور والوظيفة؟", "options": ["الدور للزوج والوظيفة للزوجة", "الدور عنوان عام، والوظيفة كيفية تنزيله عمليًا", "لا فرق بينهما", "الدور مجموعة مهام والوظيفة عنوان عام"], "answer": 1, "why": "الدور عام كالقيادة أو السكن، والوظيفة هي كيفية تنزيله عمليًا إلى سلوكيات واضحة.", "ref": "ص 9"}, {"q": "من القواعد التي ضبط بها الشرع توزيع المسؤوليات داخل البيت:", "options": ["ترك الأمر للأقوى", "المساواة المطلقة في كل مهمة", "العدل، فلا تُعطى الزوجة مهام الزوج ولا العكس", "الفوضى"], "answer": 2, "why": "حدد الشرع توزيع المسؤوليات وفق قواعد مرنة منضبطة أهمها العدل، فلا تُعطى الزوجة مهام الزوج أو العكس.", "ref": "ص 3"}, {"q": "اعتبار المساواة المطلقة معيارًا لتوزيع الأدوار داخل الأسرة يؤدي غالبًا إلى:", "options": ["الصراع والخلل في الأدوار بدل التكامل", "الاستقرار", "تحقيق العدل", "توزيع المسؤوليات بدقة شرعية"], "answer": 0, "why": "المعيار الشرعي العدل لا المساواة المطلقة، واعتماد المساواة المطلقة يؤدي غالبًا إلى الصراع حول الأدوار.", "ref": "ص 9"}, {"q": "ما الخطأ الذي حذرت منه المحاضرة في استعمال الأدوار؟", "options": ["التعاون فيها", "تحويلها إلى صدام أو وسيلة ضغط، كتحويل الرجل قوامته إلى سلاح سلطة، أو إقصاء الزوجة دور الأب", "تصحيح الأخطاء", "تولي كل طرف مهامه"], "answer": 1, "why": "من الخطأ تحويل الأدوار إلى صدام أو ضغط، كأن يجعل الرجل قوامته سلاح سلطة، أو تقصي الزوجة دور الأب في شؤون الأولاد.", "ref": "ص 4"}, {"q": "هل الأدوار في الإسلام داخل الأسرة امتيازات؟", "options": ["نعم امتيازات للمرأة", "لا، بل مسؤوليات، وفهم ذلك يحول العلاقة من ساحة مطالبة إلى ساحة عطاء", "نعم امتيازات للرجل", "لا علاقة لها بالمسؤولية"], "answer": 1, "why": "الأدوار في الإسلام ليست امتيازات بل مسؤوليات، وكلما فهم الزوجان ذلك تحولت العلاقة من ساحة مطالبة إلى ساحة عطاء.", "ref": "ص 5"}, {"q": "ما الأدوار الأساسية للمرأة المسلمة كما ذكرت المحاضرة؟", "options": ["عبادة الله حق العبادة، وأن تكون زوجة صالحة، وأمًّا مربية", "لا أدوار محددة", "العمل خارج البيت فقط", "القيادة والإنفاق"], "answer": 0, "why": "من أدوار المرأة: عبادة الله حق العبادة، وأن تكون زوجة صالحة، وأن تكون أمًّا مربية.", "ref": "ص 6"}, {"q": "التخلي عن الأدوار وتعدّي طرف على دور الآخر يؤديان إلى:", "options": ["تكامل الأدوار", "الإهمال والتسلط والشعور بالظلم واختلال التوازن", "زيادة المودة", "الاستقرار"], "answer": 1, "why": "التخلي عن الأدوار نوع من الإهمال، والتعدي على دور الآخر نوع من التسلط، مما يؤدي إلى الشعور بالظلم واختلال التوازن.", "ref": "ص 6"}, {"q": "من مظاهر الأسرة المنظمة في المقارنة:", "options": ["توتر دائم", "غموض المسؤوليات", "التعاون والحوار والمرونة والاحترام المتبادل", "أوامر دون نقاش"], "answer": 2, "why": "الأسرة المنظمة أدوارها واضحة ومظاهرها التعاون والحوار والمرونة والاحترام، ونتيجتها الاستقرار والتربية السليمة.", "ref": "ص 7"}, {"q": "من مفاتيح الاستقرار في الحياة الزوجية:", "options": ["الجمود في الأدوار", "فرض الرأي بالقوة", "الحوار، والمرونة في تبادل الأدوار عند الحاجة كمرض الزوجة، ومعرفة كل طرف ما له وما عليه", "التوقعات العالية"], "answer": 2, "why": "من مفاتيح الاستقرار اعتماد الحوار، والمرونة في تبادل الأدوار عند الحاجة، ومعرفة كل طرف ما له وما عليه بوضوح.", "ref": "ص 8"}], "15": [{"q": "ما البيت الصالح الذي امتنّ الله به على عباده؟", "options": ["البيت الكثير الأثاث", "البيت الفخم", "البيت الواسع", "البيت الذي يأوي الإنسان سكنًا لا صراعًا، وطمأنينة وأمنًا لا توترًا، ورحمة لا قسوة"], "answer": 3, "why": "من أعظم النعم بعد الإيمان البيت الصالح الذي يأوي الإنسان سكنًا وطمأنينة ورحمة.", "ref": "ص 2"}, {"q": "ما معنى شكر الزوجة لزوجها كما بيّنت المحاضرة؟", "options": ["واجب على الزوج فقط", "اعتراف بفضل الله الذي أجرى الخير على يديه، وجرعة دعم نفسي له، لا مجرد مجاملة", "مجاملة لفظية", "لا أهمية له"], "answer": 1, "why": "قال ﷺ: «لا يشكر الله من لا يشكر الناس»، والشكر للزوج اعتراف بفضل الله الذي أجرى الخير على يديه، وجرعة دعم نفسي.", "ref": "ص 3"}, {"q": "ما قيمة الهدية بين الزوجين؟", "options": ["تكون في المناسبات فقط", "لا قيمة لها", "قيمتها في رمزيتها المعنوية، فهي رسالة اهتمام تكسر الحواجز النفسية الناتجة عن الخلافات", "قيمتها المادية فقط"], "answer": 2, "why": "قال ﷺ: «تهادوا تحابوا»، والهدية ليست بقيمتها المادية بل برمزيتها، فهي رسالة اهتمام تكسر الحواجز النفسية.", "ref": "ص 4"}, {"q": "من مهارات التواصل: مناداة الزوج بأحب الأسماء إليه، ودليلها:", "options": ["أن النبي ﷺ كان يُكنّي زوجاته ويتلطف في خطابهن وينادي عائشة: «يا عائش»", "أنه عادة اجتماعية", "أنها خاصة بالأطفال", "لا دليل عليها"], "answer": 0, "why": "كان النبي ﷺ يكني زوجاته ويتلطف في خطابهن، وينادي عائشة: «يا عائش»، فتحرص الزوجة على مناداة زوجها بما يحب.", "ref": "ص 5"}, {"q": "ماذا تفعل الزوجة الصالحة تجاه أهل زوجها؟", "options": ["تحرضه عليهم", "تصطدم بهم", "تحسن التودد لهم والإحسان إليهم، يقينًا أن الإحسان لا يضيع وأنه من أسباب الألفة", "تتجاهلهم"], "answer": 2, "why": "الصدام مع أهل الزوج من أسرع أسباب اضطراب الحياة الزوجية، والزوجة الصالحة تحسن التودد لأهل زوجها والإحسان إليهم.", "ref": "ص 7"}, {"q": "ماذا يدل عليه حديث جابر: «أمهلوا حتى ندخل ليلًا كي تمتشط الشعثة وتستحدّ المغيبة»؟", "options": ["النهي عن التزين", "تأخير الدخول بلا سبب", "النهي عن السفر", "عناية الصحابيات بالتزين لأزواجهن، ومراعاة حال الزوجة"], "answer": 3, "why": "دلت السنة على عناية الصحابيات بالتزين استعدادًا لاستقبال أزواجهن، وفيه مراعاة حال الزوجة.", "ref": "ص 8"}, {"q": "ما أثر التركيز على إيجابيات الزوج؟", "options": ["يبني رصيدًا من المشاعر الطيبة، أما التركيز على السلبيات فيولد العناد والاندفاعية", "يجعله يتمادى في الخطأ", "يزيد المشكلات", "لا أثر له"], "answer": 0, "why": "التركيز على الإيجابيات من تمام الإنصاف ويبني رصيدًا من المشاعر الطيبة، أما التركيز على السلبيات فيولد العناد.", "ref": "ص 9"}, {"q": "من مهارات الحوار بين الزوجين:", "options": ["الاتهام المباشر", "عدم المقاطعة، وحسن الظن بمراد الآخر، ومخاطبته بلين بعبارات مثل «أنا أشعر..» بدل «أنت مهمل»", "سوء الظن", "المقاطعة المستمرة"], "answer": 1, "why": "من مهارات الحوار عدم المقاطعة، وفهم مراد الآخر بحسن الظن، ومخاطبته بلين: «أنا أشعر أنك مشغول» بدل «أنت مهمل».", "ref": "ص 10"}, {"q": "ما المبدأ الذي وصفه الإمام أحمد بأن العافية في تسعة أجزاء منه؟", "options": ["التغافل", "المراقبة", "الكتمان", "المعاتبة"], "answer": 0, "why": "التغافل مبدأ مهم في العلاقة الزوجية، وقد وصف الإمام أحمد العافية بأن تسعة أعشارها في التغافل.", "ref": "ص 12"}, {"q": "ما المهارة التي تُعدّ «صمام الأمان» داخل البيت كما في أسئلة التقويم؟", "options": ["النقد الصريح", "عدم الشكوى وحسن التعامل مع المشكلات", "رفع الصوت", "كثرة العتاب"], "answer": 1, "why": "من مهارات التعامل التي تحفظ البيت عدم كثرة الشكوى والعتاب، بخلاف رفع الصوت والنقد الصريح.", "ref": "ص 12"}]}, "s5": {"1": [{"q": "ماذا فعل النبي ﷺ حين أخذ الحسن بن علي تمرة من تمر الصدقة وهو صغير؟", "options": ["عاقبه بالضرب", "أعطاه تمرة أخرى", "بادر فأخرجها من فيه وقال: «كخ كخ، أما علمت أنا لا نأكل الصدقة؟»", "تركه لأنه صغير"], "answer": 2, "why": "بادر النبي ﷺ فأخرج التمرة من فيه وقال: «كخ كخ، أما علمت أنا لا نأكل الصدقة؟»، فجعل الموقف الصغير درسًا في الأمانة.", "ref": "ص 2"}, {"q": "ماذا ترسم آية ﴿قوا أنفسكم وأهليكم نارًا﴾ للمؤمن؟", "options": ["أن الأهل مسؤولون عن أنفسهم", "أن النار للكفار فقط", "دائرة مسؤوليته، فلا يكتمل حرصه على نجاته حتى يحرص على نجاة من استرعاه الله عليهم", "أن المسؤولية فردية فقط"], "answer": 2, "why": "بدأت الآية بالنفس ثم بالأهل، وكأنها ترسم دائرة مسؤولية المؤمن فلا يكتمل حرصه حتى يحرص على نجاة أهله.", "ref": "ص 3"}, {"q": "هل يقتصر دور الراعي في حديث «كلكم راع» على توفير الطعام والشراب؟", "options": ["نعم يقتصر على ذلك", "لا، بل يحفظ ويوجّه ويقوّم ويأخذ بيد من تحت رعايته إلى الخير", "يقتصر على الحماية", "يقتصر على التعليم"], "answer": 1, "why": "الراعي لا يقتصر دوره على الطعام والشراب، بل يحفظ ويوجه ويقوم ويأخذ بيد من تحت رعايته إلى طريق الخير.", "ref": "ص 3"}, {"q": "لماذا كان السلف ينظرون إلى التربية على أنها مشروع العمر؟", "options": ["لأنها مسؤولية المدرسة", "لأنها مرحلة مؤقتة", "لأنها تنتهي بالبلوغ", "لأن ما تغرسه الأم من صلاة وصدق ومراقبة قد يمتد أجره سنوات بعد وفاتها"], "answer": 3, "why": "الأم حين تعلم طفلها الصلاة أو الصدق لا تبني حاضرًا فقط، بل عملًا قد يمتد أجره سنوات بعد وفاتها، فالتربية مشروع العمر.", "ref": "ص 4"}, {"q": "بماذا كان السلف يقيسون نجاح التربية؟", "options": ["بما يظهر على سلوك الأولاد من خشية الله وحسن الخلق وصدق اللسان وبر الوالدين", "بالدرجات المدرسية", "بكثرة ما يحفظ الأولاد", "بالمال"], "answer": 0, "why": "لم يكن السلف يقيسون نجاح التربية بكثرة المحفوظ، بل بما يظهر على السلوك من خشية الله وحسن الخلق وصدق اللسان والبر.", "ref": "ص 5"}, {"q": "ما القاعدة التي ذكرتها المحاضرة عن الأخلاق؟", "options": ["الأخلاق تأتي بعد العلم دائمًا", "الأخلاق أمر ثانوي", "الأخلاق ليست إضافة تجميلية، بل الثمرة التي تدل على نجاح التربية", "الأخلاق فطرية لا تحتاج تربية"], "answer": 2, "why": "قاعدة: إن الأخلاق ليست إضافة تجميلية في شخصية المسلم، بل هي الثمرة التي تدل على نجاح التربية.", "ref": "ص 5"}, {"q": "متى تظهر التربية الناجحة كما قال المربون؟", "options": ["عند الامتحانات", "عندما يكون الطفل وحده ثم يختار الصواب لأنه صار جزءًا من شخصيته", "عندما يكون تحت نظر والديه فقط", "عند الكبر فقط"], "answer": 1, "why": "التربية الناجحة لا تظهر والطفل تحت نظر والديه، وإنما حين يكون وحده فيختار الصواب لأنه صار جزءًا من شخصيته.", "ref": "ص 7"}, {"q": "قال ابن القيم: «فمن أهمل تعليم ولده ما ينفعه وتركه سدى...»", "options": ["«فلا شيء عليه»", "«فقد أساء إليه غاية الإساءة»", "«فقد أحسن إليه»", "«فقد أدى ما عليه»"], "answer": 1, "why": "قال ابن القيم: «فمن أهمل تعليم ولده ما ينفعه وتركه سدى فقد أساء إليه غاية الإساءة».", "ref": "ص 7"}, {"q": "ما المقصود بالتربية المقصودة؟", "options": ["الانتظار حتى يخطئ الطفل", "كثرة الأوامر", "وضوح الوجهة واستثمار المواقف اليومية لغرس القيم قبل الحاجة إليها، لا كثرة الأوامر", "ردود الأفعال"], "answer": 2, "why": "التربية المقصودة لا تعني كثرة الأوامر بل وضوح الوجهة؛ فالأم تستثمر المواقف لترسيخ القيمة قبل أن يحتاج إليها، وتصنع الأفعال قبل وقوعها.", "ref": "ص 9"}, {"q": "ماذا قالت أسماء بنت أبي بكر لابنها عبد الله بن الزبير حين اشتد عليه الحصار؟", "options": ["«اهرب من مكة»", "«يا بني، إن كنت تعلم أنك على الحق فاصبر عليه»", "«استسلم واحفظ نفسك»", "«تنازل عن الحق»"], "answer": 1, "why": "قالت: «يا بني إن كنت تعلم أنك على الحق فاصبر عليه»، فكانت ثمرة تربية امتدت سنوات لا عاطفة أم مجردة.", "ref": "ص 11"}], "2": [{"q": "ماذا ترى الأم حين تنظر إلى طفلها كما في المدخل؟", "options": ["مشروعًا دراسيًا", "صغيرًا يحتاج طعامًا وملبسًا فقط", "عبئًا يوميًا", "إنسانًا يتكوّن أمام عينيها كل يوم، تتشكل مشاعره ومداركه وصورته عن نفسه والناس"], "answer": 3, "why": "الأم لا ترى مجرد صغير يحتاج إلى طعام وملبس، بل إنسانًا يتكون أمامها كل يوم تتشكل مشاعره ومداركه وصورته عن نفسه.", "ref": "ص 2"}, {"q": "ما الوظيفة الأكبر للأم في التربية؟", "options": ["تنظيم اليوم فقط", "صناعة إنسان، وما الإطعام ومتابعة الدراسة إلا جزء منها", "متابعة الدراسة فقط", "الإطعام فقط"], "answer": 1, "why": "إطعام الطفل ومتابعة دراسته وتنظيم يومه أعمال مهمة لكنها جزء من وظيفة أكبر هي صناعة إنسان.", "ref": "ص 3"}, {"q": "حين تعلّم الأم ابنها أن يختار ردًّا يحفظ كرامته دون سب أو ضرب، فأي وظيفة تؤدي؟", "options": ["وظيفة مادية", "وظيفة أخلاقية واجتماعية", "وظيفة جسدية", "لا وظيفة"], "answer": 1, "why": "حين تعينه على اختيار رد يحفظ كرامته من غير سب أو ضرب فهي تؤدي وظيفة أخلاقية واجتماعية، وتبني فهمه العقلي للموقف.", "ref": "ص 4"}, {"q": "ما الذي تمنحه الوظيفة الروحية للتربية؟", "options": ["معناها ووجهتها، بأن يرى الطفل أثر الإيمان في حياته اليومية", "المتعة فقط", "الشهرة", "التفوق الدراسي"], "answer": 0, "why": "الوظيفة الروحية تمنح التربية معناها ووجهتها، حين تساعد الأم ولدها أن يرى أثر الإيمان في الصدق والرحمة والأمانة.", "ref": "ص 5"}, {"q": "من صور تدريب الطفل على المسؤولية:", "options": ["أن يُعاقب دون توضيح", "أن يرتب ألعابه بعد اللعب، وأن يُصلح أثر خطئه بالاعتذار أو إعادة ما أخذ", "أن تقوم الأم بكل شيء عنه", "أن يُترك بلا مهام"], "answer": 1, "why": "من صور التدريب أن يشارك الطفل في ترتيب ألعابه، وأن يُطلب منه إصلاح أثر خطئه كالاعتذار أو إعادة ما أخذه.", "ref": "ص 6"}, {"q": "ما السؤال الذي تراجع به الأم فهمها للعلاقة الآمنة؟", "options": ["هل يخاف مني؟", "حين يمر أحد أبنائي بموقف مربك: هل يراني أول شخص يلجأ إليه، أم آخر شخص يخشى أن يعرف؟", "هل يطيعني دائمًا؟", "هل درجاته مرتفعة؟"], "answer": 1, "why": "تسأل الأم نفسها: هل يراني أول شخص يمكن أن يلجأ إليه، أم آخر شخص يخشى أن يعرف؟ لتفهم العلاقة كما يراها الطفل.", "ref": "ص 9"}, {"q": "كيف يرى الطفل أمه في العلاقة الآمنة؟", "options": ["يخشاها دائمًا", "يراها محبة قريبة، ويدرك أنها قد تتعب أو تخطئ، فلا يحمل صورة مثالية زائفة", "يراها كاملة لا تخطئ", "لا يهتم بها"], "answer": 1, "why": "الطفل في العلاقة الآمنة لا يحمل صورة مثالية زائفة؛ يراها محبة قريبة ويدرك أنها قد تتعب أو تخطئ، فتنمو العلاقة.", "ref": "ص 10"}, {"q": "من الممارسات التي تدعم المصداقية بين الأم وولدها:", "options": ["تقليل الوعود والحرص على تنفيذها، والاعتراف عند العجز عن الوفاء، وعدم استخدام أسراره ضده", "إفشاء أسرار الطفل للأقارب", "استدعاء أخطائه القديمة عند كل غضب", "كثرة التهديدات التي لا تُطبّق"], "answer": 0, "why": "من الممارسات الداعمة تقليل الوعود وتنفيذها، والاعتراف عند العجز، وعدم تحويل أسرار الأبناء إلى حديث أمام الأقارب.", "ref": "ص 12"}, {"q": "كيف تتعامل الأم مع طفل في الخامسة يصرخ لأنه يريد شراء لعبة؟", "options": ["تكثر من الشرح المطوّل", "تنزل إلى مستواه وتسمّي شعوره بصوت ثابت وتثبت القرار دون جدال طويل", "تصرخ عليه", "تشتري له اللعبة فورًا"], "answer": 1, "why": "الأنسب أن تنزل إلى مستواه وتقول بصوت ثابت: أعرف أنك تريدها وأنت غاضب... فتسمّي شعوره وتثبت القرار دون جدال.", "ref": "ص 15"}, {"q": "ما المقصود بالاحتواء العاطفي؟", "options": ["السخرية من خوفه", "تجاهل مشاعره", "إلغاء الألم وحل كل مشكلة فورًا", "أن يشعر الطفل أن انفعاله يمكن أن يوجد داخل العلاقة دون أن يبتلعها، وتبقى الأم قريبة متزنة"], "answer": 3, "why": "الاحتواء ليس إلغاء للألم ولا حلًا سريعًا لكل مشكلة، بل أن يشعر الطفل أن انفعاله يمكن أن يوجد داخل العلاقة وتبقى الأم متزنة.", "ref": "ص 16"}], "3": [{"q": "ما الذي يميّز التربية عن الرعاية؟", "options": ["الرعاية مؤقتة والتربية سريعة", "الرعاية تعليم والتربية علاج", "الرعاية تحفظ الحياة، والتربية تبني الشخصية", "الرعاية عقاب والتربية توجيه"], "answer": 2, "why": "الرعاية تحفظ الحياة بالطعام والملبس، والتربية تبني الشخصية وتربط الحرية بالمسؤولية، فتتحول الأسرة من مكان للخدمة إلى ميدان للتكوين.", "ref": "ص 20"}, {"q": "متى تتحول الأسرة من مكان للخدمة إلى ميدان للتكوين؟", "options": ["حين توفر الطعام والملبس فقط", "حين تكثر الأوامر", "حين تبني الشخصية وتربط حرية الولد بالمسؤولية", "حين تتابع الدرجات فقط"], "answer": 2, "why": "حين تبني الأسرة الشخصية وتربط حرية الولد بالمسؤولية تتحول من مكان للخدمة إلى ميدان للتكوين.", "ref": "ص 4"}, {"q": "هل كثرة الأوامر مثل «رتب غرفتك، لا تجادل» تعني أن الأم تربي؟", "options": ["نعم إذا نفذ الطفل", "نعم، فالتربية هي الأوامر", "لا علاقة للأوامر بالتربية", "لا، فالتربية مساعدة الابن على اكتساب المهارة لا مجرد إسكاته أو دفعه للتنفيذ"], "answer": 3, "why": "قد تظن أم أنها تربي لأنها تكثر من الأوامر، لكن التربية أن تعيد صياغة تدخلها ليساعد ابنها على اكتساب المهارة.", "ref": "ص 4"}, {"q": "كيف تتكامل جوانب التربية في مثال الانضباط؟", "options": ["بتأجيل التدريب حتى البلوغ", "بالعقاب الموحد", "بتقسيم المهارة إلى خطوات تناسب العمر: طفل الرابعة يضع حذاءه في مكانه، والبالغ يفي بموعد اتفق عليه", "بمطالبة الجميع بالمستوى نفسه"], "answer": 2, "why": "الانضباط يحتاج متابعة هادئة وتقسيم المهارة إلى خطوات تناسب العمر، فكل واحد يتدرب بصورة تلائم مرحلته.", "ref": "ص 6"}, {"q": "ما معنى أن التربية توجيه إلهي؟", "options": ["أن التربية لا تحتاج اجتهادًا", "أن الله خلق الإنسان وأودع فيه حاجاته وحدد له الغاية، لا أن كل تفصيل يومي ورد فيه نص خاص", "أن كل تفصيل يومي فيه نص خاص", "أنه لا يُستفاد من أي علم آخر"], "answer": 1, "why": "قولنا إن التربية توجيه إلهي يعني أن الله خلق الإنسان وأودع فيه حاجاته وحدد له الغاية، لا أن كل تفصيل يومي ورد فيه نص.", "ref": "ص 7"}, {"q": "هل كون أصل التربية إلهيًا يلغي الاستفادة من علم النفس والدراسات التربوية؟", "options": ["لا علاقة لها بالتربية", "هي المصدر الوحيد للتربية", "نعم يلغيها تمامًا", "لا، فهي تساعد في فهم الوسائل لكنها لا تستقل بتحديد الغاية النهائية"], "answer": 3, "why": "كون أصل التربية إلهيًا لا يلغي الاستفادة من علم النفس والدراسات؛ فهي تساعد في فهم الوسائل لكنها لا تحدد الغاية النهائية.", "ref": "ص 8"}, {"q": "من أصول منهجية المربية: «الاستمداد»، ومعناه:", "options": ["الاستمداد من المسلسلات", "الاستمداد من آراء الناس", "الاعتماد على التجربة الشخصية فقط", "الرجوع إلى هدي الله في تحديد ما ينبغي غرسه، لا جعل المزاج الاجتماعي مصدرًا وحيدًا"], "answer": 3, "why": "من الأصول الأربعة الاستمداد: الرجوع إلى هدي الله في تحديد ما ينبغي غرسه، والتدرج لأن البناء الإنساني ينمو خطوة خطوة.", "ref": "ص 9"}, {"q": "ما معنى الرضا بقدر الله في قدرات الأولاد؟", "options": ["ألا تسعى لتطويره", "أن تقبل كل أخطائه دون تصحيح", "أن تقارنه بإخوته دائمًا", "أن تستقبل الأم ولدها كما هو ثم تعينه ليصير أفضل نسخة من نفسه، لا أن تطارده بصورة طفل آخر"], "answer": 3, "why": "الرضا بقدر الله أن تستقبل الأم ولدها كما هو ثم تعينه ليصير أفضل نسخة ممكنة من نفسه، لا أن تطارده بصورة طفل آخر.", "ref": "ص 11"}, {"q": "ما البديل الصحيح عن مقارنة الطفل بإخوته أو أقرانه؟", "options": ["المقارنة بالدرجات فقط", "المقارنة بالأكثر تفوقًا", "المقارنة بالنمو الشخصي: ماذا كان يستطيع قبل شهر وما الذي تحسن الآن", "عدم متابعة تقدمه"], "answer": 2, "why": "البديل المقارنة بالنمو الشخصي؛ فإذا قرأ ابنها خمس صفحات بعد أن كان يتوقف عند صفحتين فهذا تقدم يستحق الملاحظة.", "ref": "ص 15"}, {"q": "كيف تتعامل الأم المربية مع خلاف بين الإخوة في ظل التربية المتوازنة؟", "options": ["تساعدهما على تحديد موضع النزاع وما يخص كل واحد وكيف يعالج أثره بدل إصدار حكم سريع", "تحكم فورًا قبل سماع الطرفين", "تتجاهل الخلاف", "تعاقب الأكبر دائمًا"], "answer": 0, "why": "بدل أن تسارع الأم إلى الحكم قبل سماع الطرفين، تساعدهما على تحديد موضع النزاع وكيفية معالجة الأثر، فيتعلمون أن النزاع موقف يحتاج إلى حل.", "ref": "ص 17"}], "4": [{"q": "هل يشترط أن تجتمع الصفات التربوية في الأم بمستوى واحد؟", "options": ["تكفي صفة واحدة", "نعم يجب أن تكتمل كلها", "لا، المهم أن ترى شخصيتها على حقيقتها وتعمل على ما تحتاج إلى تنميته", "لا حاجة لهذه الصفات"], "answer": 2, "why": "لا يشترط اجتماع الصفات بمستوى واحد؛ فقد تكون جادة وتحتاج مساحة من البهجة، والمهم أن ترى شخصيتها على حقيقتها.", "ref": "ص 4"}, {"q": "ما العلاقة بين الصبر والحكمة في شخصية الأم؟", "options": ["الحكمة تعطي الصبر وجهته وتضع كل صفة في موضعها الملائم", "الحكمة تلغي الصبر", "الصبر يغني عن الحكمة", "لا علاقة بينهما"], "answer": 0, "why": "الصبر وفاء للمسؤولية ولو لم تسمع شكرًا، والحكمة تعطي الصبر وجهته لأنها تضع كل صفة في موضعها الملائم.", "ref": "ص 5"}, {"q": "ما الذي يحوّل الصفات التربوية إلى أداء عملي؟", "options": ["المعرفة وحدها", "المهارة", "الموهبة", "الحماس"], "answer": 1, "why": "المهارة هي التي تحول الصفات التربوية إلى أداء عملي.", "ref": "ص 13"}, {"q": "بماذا يكتمل الوعي التربوي كما في نشاط التوافق بين المربين؟", "options": ["بكثرة المعلومات", "بحسن توظيف المعرفة بما يحفظ استقرار البيت ويجمع المربين على مصلحة الطفل", "بالانتصار في الرأي", "بالتنافس بين المربين"], "answer": 1, "why": "الوعي التربوي لا يكتمل بكثرة ما تعرفه الأم، وإنما بحسن توظيف معرفتها بما يحفظ استقرار البيت ويجمع المربين على مصلحة الطفل.", "ref": "ص 6"}, {"q": "ما المقصود بمهارة «تصميم البيئة»؟", "options": ["تغيير الأثاث باستمرار", "ترتيب المكان والأدوات بطريقة تجعل السلوك المرغوب أيسر وتخفف العوائق", "تزيين البيت فقط", "شراء الألعاب"], "answer": 1, "why": "تصميم البيئة أن ترتب الأم المكان والأدوات بطريقة تجعل السلوك المرغوب أيسر وتخفف العوائق التي تستنزف إرادة الطفل والأم.", "ref": "ص 7"}, {"q": "لماذا وُصفت البيئة المنزلية السوية بأنها «شريك صامت في التربية»؟", "options": ["لأنها مكان للنوم فقط", "لأنها لا تؤثر", "لأن المكان يؤثر في سلوك الطفل دون كلام", "لأنها تغني عن الأم"], "answer": 2, "why": "البيئة المنزلية السوية شريك صامت في التربية لأن المكان نفسه يؤثر في سلوك الطفل ويسهّل الصواب أو يصعّبه.", "ref": "ص 7"}, {"q": "ما فكرة نشاط «جولة بعين طفلك»؟", "options": ["النظر إلى البيت من مستوى نظر الطفل واختيار سلوك تكثر مطالبته به وتعديل البيئة لتسهيله", "معاقبة الطفل على الفوضى", "تفتيش غرفة الطفل", "شراء أثاث جديد"], "answer": 0, "why": "تقوم الأم بجولة في بيتها من مستوى نظر أحد أبنائها، وتختار سلوكًا تكثر مطالبته به مثل ترتيب ألعابه، لتعدل البيئة بما يسهله.", "ref": "ص 8"}, {"q": "من أشد الأخطاء التربوية نفاذًا:", "options": ["التناقض بين القول والفعل، فيسمع الطفل قيمة ثم يرى في البيت ما يناقضها", "القدوة الحسنة", "الثبات على القيم", "الحوار"], "answer": 0, "why": "من أشد الأخطاء نفاذًا التناقض بين القول والفعل، وقد نبّه القرآن إلى قبحه: ﴿يا أيها الذين آمنوا لم تقولون ما لا تفعلون﴾.", "ref": "ص 10"}, {"q": "ما الذي تراعيه صناعة الجيل الرسالي؟", "options": ["الاكتفاء بالشعارات الكبيرة", "حرمانهم من الفرح والراحة", "أعمار الأطفال، وحمايتهم من هموم تفوق طاقتهم، وإعداد حقيقي يتجاوز ترديد الشعارات", "تحميلهم هموم الأمة كلها منذ الصغر"], "answer": 2, "why": "صناعة الجيل الرسالي تراعي أعمار الأطفال وتحميهم من هموم تفوق طاقتهم، وتحتاج إعدادًا حقيقيًا يتجاوز ترديد الشعارات.", "ref": "ص 11"}, {"q": "كيف تتحول القيم إلى «ذاكرة حياة» عند الأولاد؟", "options": ["بحفظ التعريفات فقط", "بالمحاضرات الطويلة", "بالعقاب", "أن تختار الأم كل شهر معنى واحدًا وتجمع حوله قصة من الأسرة وموقفًا من الحاضر وسؤالًا يناسب أعمارهم"], "answer": 3, "why": "تختار الأم كل شهر معنى واحدًا وتجمع حوله قصة من الأسرة وموقفًا من الحاضر وسؤالًا مناسبًا، فتخرج الهوية من التعريفات إلى سرد عائلي.", "ref": "ص 12"}], "5": [{"q": "هل الحكمة مجرد هدوء الأم أو طول خبرتها؟", "options": ["نعم، الهدوء هو الحكمة", "لا، فالحكمة أوسع من ذلك، وهي وضع الأمر في موضعه الصحيح", "الحكمة لا علاقة لها بالتربية", "نعم، الخبرة الطويلة هي الحكمة"], "answer": 1, "why": "قد نصف أمًّا بالحكمة لأنها هادئة أو صاحبة خبرة، لكن الحكمة أوسع من ذلك.", "ref": "ص 3"}, {"q": "ما المقصود بـ«حكمة الفهم»؟", "options": ["أن ترى الأم الموقف كاملًا قبل أن تحكم، فالسلوك الظاهر جزء صغير من الصورة", "أن تسأل الآخرين دائمًا", "أن تحكم بسرعة", "أن تكتفي بالظاهر"], "answer": 0, "why": "حكمة الفهم أن تحاول الأم رؤية الموقف كاملًا قبل أن تبني حكمها، فخلف السلوك الظاهر أسباب وظروف.", "ref": "ص 4"}, {"q": "ما المقصود بـ«حكمة التقدير»؟", "options": ["أن تتجاهل الأخطاء", "أن تهوّل كل خطأ", "أن تعاقب على كل خطأ بالقدر نفسه", "أن تعطي كل أمر حجمه الحقيقي، فتفرّق بين خطأ عابر ومشكلة متكررة"], "answer": 3, "why": "حكمة التقدير أن تعطي كل أمر حجمه الحقيقي، فتفرق بين خطأ عابر ومشكلة تحتاج معالجة.", "ref": "ص 4"}, {"q": "تأخرت ابنة الخامسة عشرة عن موعد متفق عليه بسبب ظرف لم يكن في حسابها، فما التصرف الحكيم؟", "options": ["تلغي الاتفاقات كلها", "تتجاهل الأمر تمامًا", "ألا تكتفي الأم بترديد القاعدة، بل تنظر: هل كان في استطاعة ابنتها الالتزام فعلًا؟", "تعاقبها فورًا لأن الاتفاق ملزم"], "answer": 2, "why": "الأم تعلم أن الوفاء بالاتفاقات مهم، لكن الحكمة لا تكتفي بترديد القاعدة بل تنظر في ظرف ابنتها وقدرتها على الالتزام.", "ref": "ص 5"}, {"q": "من مظاهر الحكمة في تعامل الأم مع الزوج:", "options": ["أن تعارضه أمام الأولاد", "أن تفرّق بين اختلاف الأسلوب والاختلاف في المبدأ، فكلاهما يحب الأولاد وقد يختلفان في الطريقة", "أن تتخذ القرارات وحدها", "أن تتجاهل رأيه"], "answer": 1, "why": "التربية تجمع شخصين يحبان أولادهما وقد يختلفان في طريقة النظر والتصرف، فتفرّق الأم الحكيمة بين اختلاف الأسلوب والمبدأ.", "ref": "ص 7"}, {"q": "ما الذي تنظر إليه الأم الحكيمة عند توجيه ولدها؟", "options": ["رفع الصوت", "طول الكلام", "ليس صحة ما ستقوله فقط، بل مقدار ما يحتاج إلى سماعه وطريقته ومكانه", "صحة الكلام فقط"], "answer": 2, "why": "حكمة الأم مع أولادها أنها لا تنظر فقط إلى صحة ما ستقوله، بل إلى مقدار ما يحتاج إلى سماعه وطريقته والمكان الذي يقال فيه.", "ref": "ص 8"}, {"q": "ماذا يعني أن تعطي الأم كل موقف فرصة جديدة؟", "options": ["أن تتجاهل الأخطاء المتكررة", "أن تذكره بكل أخطائه السابقة", "ألا تحاكم كل موقف لاحق بالتاريخ القديم للطفل", "أن تلغي القواعد"], "answer": 2, "why": "إذا سبق للطفل أن أخطأ فلا تحاكم الأم كل موقف لاحق بالتاريخ القديم، فقد يكون السبب هذه المرة مختلفًا.", "ref": "ص 9"}, {"q": "ما دور العلم في تغذية الحكمة التربوية؟", "options": ["يمنع التجربة من أن تتحول إلى انطباعات شخصية أو تعميم سلوك طفل واحد على الجميع", "يجعل الأم تتجاهل أطفالها", "يغني عن الخبرة", "لا دور له"], "answer": 0, "why": "العلم يمنع التجربة من التحول إلى انطباعات شخصية، كأن تنجح طريقة مصادفة فتظنها قاعدة أو تعمم سلوك طفل على الجميع.", "ref": "ص 10"}, {"q": "ما الاستشارة التربوية الحكيمة؟", "options": ["سؤال كل من حولها", "حسن اختيار من يُستشار ممن يفهم ظروف الأم، لا سؤال كل من حولها", "عدم الاستشارة مطلقًا", "الاعتماد على تجارب الآخرين كقانون عام"], "answer": 1, "why": "الاستشارة الحكيمة لا تعني سؤال كل من حولها، فكثرة الآراء قد تزيد الحيرة، بل حسن اختيار من يفهم ظروفها.", "ref": "ص 12"}, {"q": "متى يكون التصرف الصحيح من حيث الأصل غير حكيم؟", "options": ["عندما يحتاج وقتًا أطول", "عندما تراجع الأم قرارها", "عندما يختلف عن عادة الأسرة", "عندما يطبّق في توقيت أو بصورة لا تناسب الموقف"], "answer": 3, "why": "قد يكون التصرف صحيحًا من حيث الأصل لكنه لا يكون حكيمًا إذا طُبّق في توقيت أو بصورة لا تناسب الموقف.", "ref": "ص 16"}], "6": [{"q": "ماذا تجد الأم حين تقرأ سيرة امرأة صالحة أحسنت تربية أبنائها؟", "options": ["حكاية بعيدة لا علاقة لها ببيتها", "تسلية فقط", "تاريخًا لا ينفع اليوم", "قد تجد جوابًا لسؤال تعيشه اليوم وطريقة في الصبر والحزم والتوجيه"], "answer": 3, "why": "الأم لا تقرأ حكاية بعيدة عن بيتها، فقد تجد في موقف مضى منذ قرون جوابًا لسؤال تعيشه اليوم.", "ref": "ص 2"}, {"q": "ما الذي يميّز القدوة عن مجرد تقديم النصيحة؟", "options": ["أنها تفترض كمال المربي في كل المواقف", "أنها تجعل القيمة سلوكًا يراه الابن أمامه", "أنها تغني الابن عن التوجيه نهائيًا", "أنها تركز على النتائج دون الوسائل"], "answer": 1, "why": "القدوة أن يرى الابن المعنى الذي نريد تعليمه وقد صار سلوكًا أمام عينيه، وهذا يتجاوز تقديم النصيحة.", "ref": "ص 13"}, {"q": "كيف يكتسب سلوك احترام الوقت معناه عند ابنة الرابعة عشرة؟", "options": ["حين تحفظ حديثًا عنه", "حين تُعاقب على التأخر", "حين ترى من حولها يستعدون للمواعيد ويعتذرون إذا تأخروا ولا يستخفون بأوقات الآخرين", "حين تسمع محاضرة عنه"], "answer": 2, "why": "المعنى يختلف حين ترى من حولها يستعدون للمواعيد ويعتذرون إذا تأخروا، فيصبح السلوك جزءًا طبيعيًا من طريقة إدارة الحياة.", "ref": "ص 4"}, {"q": "كيف تصل القيمة إلى الطفل في المواقف التي لا يكون طرفًا فيها؟", "options": ["حين يرى أمه تشكر من خدمها أو تلتزم بالنظام مع أن أحدًا لا يراقبها", "بالعقاب", "لا تصل أبدًا", "بالأوامر المباشرة فقط"], "answer": 0, "why": "حين ترى البنت أمها تشكر من قدم لها خدمة أو تلتزم بنظام مكان عام دون رقيب، تصل القيمة في صورتها الطبيعية.", "ref": "ص 5"}, {"q": "ماذا فعلت أم أيمن حين توفيت آمنة بنت وهب في طريق العودة من الأبواء؟", "options": ["بقيت في الأبواء", "عادت وحدها", "تركته مع القافلة", "احتضنت النبي ﷺ وعادت به إلى مكة وسلّمته إلى جده، فصار الحنان مسؤولية كاملة"], "answer": 3, "why": "وجدت أم أيمن نفسها أمام طفل فقد أمه بعيدًا عن مكة، فاحتضنته وعادت به إلى مكة وسلمته إلى جده.", "ref": "ص 6"}, {"q": "أي مرحلة من الأمومة تمثلها أسماء بنت أبي بكر رضي الله عنها؟", "options": ["أمومة اليتيم", "أمومة الطفل الصغير", "أمومة الرضيع", "أمومة ابن بلغ من العمر والمكانة ما بلغ وصار رجلًا يقود ويتحمل تبعات قراراته"], "answer": 3, "why": "تعطينا أسماء صورة من مرحلة مختلفة من الأمومة، فابنها عبد الله بن الزبير صار رجلًا يقود ويتحمل تبعات قراراته.", "ref": "ص 7"}, {"q": "من الصفات المشتركة بين نماذج الأمهات الصالحات كأم أيمن وأم سليم وأسماء:", "options": ["الغنى", "الشهرة", "الانطلاق من قيمة تتجاوز الراحة الآنية كالوفاء والرعاية والثبات على الحق", "التشابه في الظروف"], "answer": 2, "why": "من أعمق ما تشترك فيه هذه النماذج أن تصرفهن لم يكن محكومًا بما هو أيسر في اللحظة، بل كان وراءه معنى أكبر.", "ref": "ص 9"}, {"q": "ماذا تكتشف الأم حين تقرأ عن أم أحسنت اختيار من يتعلم منه ولدها؟", "options": ["أن تمنع ولدها من المعلمين", "أن عليها أن تكون المصدر الوحيد", "أن جودة التربية قد تظهر في حسن فتح الأبواب، لا في أن تبقى هي المصدر الأول لكل شيء", "أن التعليم ليس مهمًا"], "answer": 2, "why": "قد تكتشف الأم أن جودة التربية تظهر أحيانًا في حسن اختيار من يتعلم منه ولدها، لا في أن تبقى المصدر الأول لكل شيء.", "ref": "ص 11"}, {"q": "ما فائدة تقديم نماذج السلف للأولاد؟", "options": ["توسيع عالمهم، فلا تبقى الشخصيات المؤثرة في وجدانهم محصورة في مشاهير الشاشات", "حفظ الأسماء", "المقارنة بين الأولاد", "التسلية فقط"], "answer": 0, "why": "حين تحسن الأم تقديم هذه النماذج توسع عالم أولادها، فلا تبقى الشخصيات المؤثرة محصورة في المشاهير الذين تضعهم الشاشات أمامهم.", "ref": "ص 12"}, {"q": "هل المسافة بين عالم السلف وعالمنا تجعل نماذجهم غير صالحة اليوم؟", "options": ["نعم لا تصلح", "تصلح للرجال فقط", "لا، فمع اختلاف التفاصيل هناك أوجه شبه في التحديات التربوية قديمًا وحديثًا", "تصلح للكبار فقط"], "answer": 2, "why": "قد نشعر أن المسافة بين عالمهم وعالمنا واسعة وهذا صحيح في التفاصيل، لكن هناك أوجه شبه في التحديات التربوية قديمًا وحديثًا.", "ref": "ص 10"}], "7": [{"q": "متى يبدأ الاستعداد للتربية؟", "options": ["عند المراهقة", "قبل أن تسأل الأم: ماذا أفعل مع هذا السلوك؟ لأنه يتعلق بالحالة التي تدخل بها إلى التربية", "عند ظهور المشكلات فقط", "بعد دخول المدرسة"], "answer": 1, "why": "الاستعداد للتربية يبدأ قبل سؤال: ماذا أفعل مع هذا السلوك؟ لأنه يتعلق بالحالة التي تدخل بها الأم إلى التربية.", "ref": "ص 3"}, {"q": "الرغبة في الأمومة وحبها كافيان لتلبية متطلباتها:", "options": ["صحيح دائمًا", "صحيح", "خطأ", "صحيح في السنوات الأولى"], "answer": 2, "why": "العبارة خطأ؛ فالرغبة تسأل: ماذا ستضيف الأمومة إلى حياتي؟ أما الاستعداد فيسأل أيضًا: ماذا ستطلب مني الأمومة؟", "ref": "ص 15"}, {"q": "ما الفرق بين الرغبة والاستعداد للأمومة؟", "options": ["الرغبة تسأل ماذا ستضيف الأمومة إلي، والاستعداد يضيف: ماذا ستطلب مني من وقت وتغيير أولويات", "الاستعداد أقل أهمية", "الرغبة تكفي", "لا فرق بينهما"], "answer": 0, "why": "الرغبة تنشغل بسؤال: ماذا ستضيف الأمومة إلى حياتي؟ والاستعداد يضيف: ماذا ستطلب مني؟ وقتًا وتغيير أولويات.", "ref": "ص 5"}, {"q": "لماذا ينبغي للأم أن تستقبل شخصية طفلها الحقيقية؟", "options": ["لتغيره ليطابق خيالها", "لتقارنه بغيره", "لا حاجة لذلك", "لتربيه وفق احتياجاته لا وفق الصورة التي رسمتها له في ذهنها"], "answer": 3, "why": "على الأم أن تستقبل شخصية طفلها الحقيقية وتربيه وفق احتياجاته، لا وفق الصورة التي رسمتها له في ذهنها.", "ref": "ص 4"}, {"q": "من مظاهر ضعف التوازن النفسي للمربية: «استعجال النتائج»، ومعناه:", "options": ["الصبر على النتائج", "التخطيط الطويل", "توقع استجابة سريعة دائمًا للتوجيه، فيصبح بطء التغيير مصدرًا للغضب والتنقل بين الأساليب", "الاستمرار في الأسلوب المناسب"], "answer": 2, "why": "حين تتوقع الأم استجابة سريعة دائمًا يصبح بطء التغيير مصدرًا للغضب واليأس، ومن التوازن احتمال المسافة بين الجهد والنتيجة.", "ref": "ص 6"}, {"q": "ما معنى مرونة التوقعات لدى الأم؟", "options": ["خفض مستوى الطموح", "التخلي عن التربية", "ترك الطفل لاختياراته", "قبول اختلاف الأولاد"], "answer": 3, "why": "مرونة التوقعات تعني قبول اختلاف الأولاد وقبول أن اليوم لن يكون دائمًا كما خُطط له.", "ref": "ص 15"}, {"q": "بماذا يواسي الأمَ ما ورد من أن الهم بالعيال يكفّر الذنوب؟", "options": ["بأن التعب لا قيمة له", "بأن عليها ترك أولادها", "بأن تعبها في الأعمال التي لا يراها أحد مأجور ولو لم تسمع ثناءً", "بأن الثناء أهم من الأجر"], "answer": 2, "why": "قال ﷺ: «ما يصيب المسلم من نصب ولا هم... إلا كفر الله بها من خطاياه»، وقال بعض السلف: من الذنوب ذنوب لا يكفرها إلا الهم بالعيال.", "ref": "ص 8"}, {"q": "ما المقصود بالاستعداد المعرفي للأم؟", "options": ["أن تصبح متخصصة في علم النفس", "أن تحفظ المصطلحات والنظريات", "ألا تقرأ شيئًا", "أن تمتلك من المعرفة ما يمنعها من دخول المواقف المهمة وهي لا تعرف طبيعتها، لا أن تصبح متخصصة"], "answer": 3, "why": "الاستعداد المعرفي لا يعني أن تتحول الأم إلى متخصصة، بل أن تمتلك ما يمنعها من دخول المواقف المهمة دون معرفة بطبيعتها.", "ref": "ص 9"}, {"q": "إذا قضى الابن وقتًا طويلًا في لعبة جماعية عبر الإنترنت، فما الذي ينبغي للأم معرفته أولًا؟", "options": ["معاقبته", "المنع الفوري دون فهم", "السماح المطلق", "طبيعة هذه البيئة: مع من يتواصل، وما الذي يجذبه، وما المخاطر، قبل أن يكون موقفها مجرد منع أو سماح"], "answer": 3, "why": "من المهم أن تعرف الأم طبيعة البيئة: مع من يتواصل وما الذي يجذبه وما المخاطر، قبل أن يكون موقفها مجرد منع أو سماح.", "ref": "ص 10"}, {"q": "لماذا كان التعلم المستمر للمربية ضرورة؟", "options": ["لأن الأولاد يكبرون والبيئة تتغير، فما نجح مع ابن السادسة قد لا يكفي في الثانية عشرة", "لأن المعرفة لا تتغير", "لأن التربية لا تحتاج تعلمًا", "للحصول على شهادات"], "answer": 0, "why": "الأم التي تعلمت ما يناسب طفلها في السادسة لا تملك كل ما تحتاجه حين يصبح في الثانية عشرة، لأن الأولاد يكبرون والبيئة تتغير.", "ref": "ص 11"}], "8": [{"q": "ما المقصود بالخلفية الشرعية للمربية؟", "options": ["امتلاك أصول شرعية تضبط القرارات التربوية", "حفظ أكبر عدد من الأحكام الفقهية", "تحويل كل موقف إلى درس ديني", "الإكثار من المواعظ في كل موقف"], "answer": 0, "why": "الخلفية الشرعية امتلاك أصول شرعية تضبط القرارات التربوية، لا مجرد الإكثار من الاستشهاد بالنصوص.", "ref": "ص 19"}, {"q": "ما «الميزان الخفي» الذي تحمله الأم في مواقف التربية؟", "options": ["معيار تحاكم به ما ترى وتختار ما تقبل وترفض، وقد تصوغه العادة أو التجربة أو الشرع", "لا ميزان لها", "رأي الجيران", "ميزان المال"], "answer": 0, "why": "تدخل الأم مواقف التربية وفي داخلها ميزان خفي تحاكم به ما ترى، وقد تصوغه العادة أو التجربة الشخصية أو آراء الناس، والمطلوب أن يكون شرعيًا.", "ref": "ص 2"}, {"q": "كيف يفرّق الفهم الشرعي بين حق الأم ورغبتها الشخصية؟", "options": ["يفرّق بين حقها في البر والطاعة بالمعروف، ورغبتها في أن يكون الولد نسخة من اختياراتها", "لا يفرّق بينهما", "يجعل كل رغباتها حقوقًا", "يلغي حقها في البر"], "answer": 0, "why": "قد ترى أم أن نجاحها أن يكون ابنها مطيعًا في كل ما تريد، بينما يدفعها الفهم الشرعي إلى التفريق بين حقها في البر بالمعروف ورغبتها الشخصية.", "ref": "ص 4"}, {"q": "ما القاعدة البسيطة قبل أن تنقل الأم معلومة دينية لأولادها؟", "options": ["هل قالها أحد المشاهير؟", "هل هي منتشرة على المواقع؟", "هل أعجبتني؟", "من أين أخذت هذا؟ هل ثبت النص؟ وهل أفهمه في سياقه الصحيح؟"], "answer": 3, "why": "قبل نقل معلومة دينية تسأل: من أين أخذت هذا؟ هل ثبت النص؟ وهل أفهمه في سياقه؟ وإن بقي تردد فالسؤال قوة لا نقص.", "ref": "ص 6"}, {"q": "هل تحتاج الأم أن تلاحق كل ما يُنشر باسم الدين؟", "options": ["لا تحتاج إلى أي مرجع", "نعم، من وسائل التواصل خاصة", "لا، فوفرة المحتوى قد تربك، والأجدى أن يكون لها رصيد موثوق وجهة علمية معتبرة ترجع إليها", "نعم، كلما قرأت أكثر كان أفضل"], "answer": 2, "why": "لا تحتاج الأم إلى ملاحقة كل ما ينشر باسم الدين؛ فوفرة المحتوى قد تربك، والأجدى أن يكون لها رصيد موثوق ومرجع علمي معتبر.", "ref": "ص 5"}, {"q": "في تقسيم الناس في آية فاطر، من هو «الظالم لنفسه» عند أهل العلم؟", "options": ["الكافر", "من وقع منه تقصير ببعض الواجبات أو ارتكاب بعض المحرمات مع بقاء أصل الإيمان", "السابق بالخيرات", "المقتصد"], "answer": 1, "why": "يعرض القرآن تفاوت الناس: ﴿فمنهم ظالم لنفسه ومنهم مقتصد ومنهم سابق بالخيرات﴾، والظالم لنفسه من وقع منه تقصير مع بقاء أصل الإيمان.", "ref": "ص 8"}, {"q": "ما أثر غياب الخلفية الشرعية رغم حرص الأم على أولادها؟", "options": ["يزيد نجاح التربية", "لا أثر له ما دامت حريصة", "قد يقود الحرص بلا ميزان إلى أخطاء تبدو في ظاهرها تربية وهي مخالفة", "يقوي الهوية"], "answer": 2, "why": "ضعف الخلفية الشرعية لا يعني أن الأم لا تحب الخير لأولادها، لكن الحرص بلا ميزان واضح قد يقود إلى أخطاء تبدو تربية.", "ref": "ص 9"}, {"q": "ما العلاقة بين العلم الشرعي والعلم النفسي التربوي؟", "options": ["تعارض", "الشرعي يغني عن النفسي تمامًا", "النفسي يغني عن الشرعي", "تكامل: الشرعي يحدد ما يُعظَّم وما يجب ويحرم والغاية، والنفسي يعين على فهم النمو والوسائل"], "answer": 3, "why": "الخلفية الشرعية لا تغني عن فهم النفس والنمو؛ فالعلم الشرعي يحدد الواجب والمحرم والغاية، والنفسي يجيب عن أسئلة الوسائل.", "ref": "ص 10"}, {"q": "ما المحرمات التربوية في الأسلوب التي ينبه إليها نشاط «أراقب لغتي التربوية»؟", "options": ["الحوار", "الثواب", "المدح", "السب والإهانة والدعاء على الولد ونسبة حكم شرعي دون علم"], "answer": 3, "why": "يطلب النشاط مراقبة العبارات عند خطأ الأولاد التي قد تتضمن سبًا أو إهانة أو دعاء عليهم أو نسبة حكم شرعي دون علم.", "ref": "ص 13"}, {"q": "ما الخلل الذي يحدث حين تعامل الأم المستحب معاملة الواجب؟", "options": ["لا خلل في ذلك", "تحقق التوازن", "تقوي التزامهم", "تجعل مسألة اجتهادية أو أمرًا وسّع الشرع فيه ميدانًا للصدام مع أولادها"], "answer": 3, "why": "يحدث الخلل حين تعامل الأم المستحب كالواجب أو تجعل مسألة اجتهادية ميدان صدام، كالإصرار على لون لباس مباح معين، فتخلط بين الحكم الشرعي وذوقها.", "ref": "ص 17"}], "9": [{"q": "مما ينبغي أن تنطلق منه الأم عند تفسير سلوك طفلها:", "options": ["مقارنته بإخوته", "افتراض أن كل سلوك مزعج دليل سوء تربية", "الحكم على السلوك من أثره الظاهر", "فهم مرحلته العمرية وما يستطيع إدراكه"], "answer": 3, "why": "بدل أن تسارع الأم إلى وصفه بالمدلل أو العنيد، تنطلق من فهم مرحلته العمرية وما يستطيع إدراكه.", "ref": "ص 18"}, {"q": "كيف ينظر الإسلام إلى الطفل؟", "options": ["لا يتأثر بالتربية", "كامل المعرفة", "شرير بطبعه", "مخلوق على فطرة سوية، يدخل الحياة قليل الخبرة محدود المعرفة ثم تنمو مداركه"], "answer": 3, "why": "الطفل مخلوق على فطرة سوية، ويدخل الحياة قليل الخبرة محدود المعرفة، ثم تنمو مداركه تدريجيًا.", "ref": "ص 3"}, {"q": "ما مهمة التربية في ضوء الفطرة النقية؟", "options": ["رعاية الأصل السليم وتنميته، فبدايات الخير موجودة في صور صغيرة كالتعاطف والندم", "قمع مشاعر الطفل", "صناعة الخير من الصفر", "تغيير الفطرة"], "answer": 0, "why": "إذا كانت الفطرة نقطة البداية فالتربية رعاية للأصل السليم وتنميته؛ فقد تجد الأم بدايات الخير موجودة كالتعاطف والندم.", "ref": "ص 4"}, {"q": "ما الذي يحمله قوله تعالى: ﴿وأمر أهلك بالصلاة واصطبر عليها﴾ تربويًا؟", "options": ["معنى الصبر والاستمرار في التوجيه، فعدم الاستقرار من أول توجيه ليس دليلًا على فشل التربية", "العقاب الفوري", "ترك الأمر بالصلاة", "أن التوجيه مرة واحدة يكفي"], "answer": 0, "why": "﴿واصطبر عليها﴾ يحمل معنى الصبر والاستمرار؛ فبعض المعاني لا تستقر من أول توجيه، وليس ذلك دليلًا على فشل التربية.", "ref": "ص 5"}, {"q": "ما معنى حاجة الطفل إلى «الانتماء»؟", "options": ["أن يشعر أن البيت جماعة هو جزء منها، حين يكون له دور يناسب عمره ويُسأل عن رأيه", "أن يعيش في البيت فقط", "أن يتبع الأوامر دون مشاركة", "أن يُترك وحده"], "answer": 0, "why": "الانتماء أن يشعر الطفل أن البيت جماعة هو جزء منها، كطفل الثامنة يساعد في تجهيز المائدة فيكتسب مكانًا ودورًا.", "ref": "ص 7"}, {"q": "ما الإحساس الداخلي الذي يتكوّن حين تُشبع حاجات الطفل النفسية بتوازن؟", "options": ["«قيمتي في درجاتي فقط»", "«يجب أن أرضي الجميع»", "«لا أحد يهتم بي»", "«أنا محبوب، ولي مكان وقيمة، وأستطيع أن أتعلم وأحاول»"], "answer": 3, "why": "إشباع الحاجات النفسية بتوازن يتحول إلى إحساس داخلي: أنا محبوب ولي مكان ولي قيمة وأستطيع أن أتعلم، وهو من جذور الأمان.", "ref": "ص 8"}, {"q": "كيف يتحقق التوازن في إشباع حاجات الطفل؟", "options": ["الحدود دون حنان", "الحنان مع حدود تحميه من أن يصبح أسير رغباته، والقبول مع معرفة أن بعض أفعاله مرفوضة", "التقدير المشروط بتصفيق الجميع", "الحنان المطلق دون حدود"], "answer": 1, "why": "الطفل يحتاج إلى الحنان ومعه حدود، وإلى القبول مع معرفة أن بعض أفعاله مرفوضة، وإلى التقدير دون أن تتوقف قيمته على تصفيق الجميع.", "ref": "ص 9"}, {"q": "ما الذي يميز مرحلة 7-10 سنوات؟", "options": ["لا يتأثر بالأقران", "يحتاج تذكيرًا مستمرًا بكل شيء", "لا يفهم سبب القواعد", "يتسع العالم خارج البيت، وتنمو حاجته إلى الشعور بأنه قادر ومنتج، ويقارن أداءه بغيره"], "answer": 3, "why": "في مرحلة 7-10 يتسع العالم خارج البيت، وتصبح المدرسة والإنجاز أكثر حضورًا، وتنمو حاجته للشعور بأنه قادر ومنتج.", "ref": "ص 10"}, {"q": "لماذا قد يبكي طفل الرابعة بكاءً شديدًا عند رفض شراء حلوى؟", "options": ["لأن شعوره سبق قدرته على ضبطه، لا لأن الحلوى عنده كارثة", "لأنه مدلل بطبعه", "لأن تربيته فاشلة", "لأنه عنيد"], "answer": 0, "why": "قد يتحول رفض الحلوى عند طفل الرابعة إلى بكاء شديد لأن شعوره سبق قدرته على ضبطه، وضبط الانفعال ما زال في طور البناء.", "ref": "ص 11"}, {"q": "إذا رفض ابن العاشرة المشاركة في نشاط مدرسي جديد، فما الأنسب؟", "options": ["فهم حالته، فقد يكون الرفض بعد موقف محرج يخشى تكراره، بدل الحكم بأنه كسل", "تجاهل الأمر", "الحكم بأنه كسول", "إجباره فورًا"], "answer": 0, "why": "قد يكشف فهم حالته أن المشكلة بدأت بعد موقف محرج أمام زملائه، فيكون المطلوب فهمه لا الإلحاح على: يجب أن تكون شجاعًا.", "ref": "ص 14"}], "10": [{"q": "ما الآية المحورية التي بدأ بها درس الفروق بين تربية الذكور والإناث؟", "options": ["﴿يهب لمن يشاء إناثًا﴾", "﴿الرجال قوامون على النساء﴾", "﴿وليس الذكر كالأنثى﴾", "﴿للذكر مثل حظ الأنثيين﴾"], "answer": 2, "why": "يبدأ الدرس من قوله تعالى: ﴿وليس الذكر كالأنثى﴾ [آل عمران: 36]، وهي دليل على أن هناك فرقًا بين الذكر والأنثى.", "ref": "ص 2"}, {"q": "ما الدوائر الثلاث التي ينبغي التمييز بينها عند فهم الفروق التربوية بين الجنسين؟", "options": ["الخلقة، والتوجيه الشرعي، والتوقع الاجتماعي", "العمر، والذكاء، والتحصيل", "الأسرة، والمدرسة، والمجتمع", "المشاعر، والاهتمامات، والسلوك"], "answer": 0, "why": "تحتاج الأم إلى التمييز بين ثلاث دوائر: حقيقة تتصل بالخلقة، وحكم يقرره الشرع، وتوقع تصنعه البيئة الاجتماعية.", "ref": "ص 2"}, {"q": "هل يسمح وجود فرق جسدي بين الذكر والأنثى باستنتاج فرق في الذكاء؟", "options": ["نعم، فالفرق الجسدي يحدد الذكاء", "نعم، عند الاقتراب من البلوغ فقط", "لا يمكن معرفة ذلك", "لا، فوجود فرق جسدي لا يسمح وحده باستنتاج فرق في الذكاء أو الحكم على الطبع"], "answer": 3, "why": "وجود فرق جسدي لا يسمح وحده باستنتاج فرق في الذكاء، أو تحديد ما يستطيع كل منهما تعلمه، أو إصدار حكم على طبعه.", "ref": "ص 3"}, {"q": "ماذا تقرر البحوث النفسية عن الفروق بين الأطفال الذكور والإناث في التعبير عن المشاعر؟", "options": ["أن الذكور لا يشعرون بالحزن", "أنها صغيرة جدًا في المتوسط وتتبدل بحسب العمر والموقف", "أن البنات وحدهن يعبرن عن المشاعر", "أنها فروق كبيرة وثابتة"], "answer": 1, "why": "أثبتت دراسة علمية أن الفروق العامة في التعبير عن المشاعر صغيرة جدًا في المتوسط، وأنها تتبدل بحسب العمر والأشخاص الحاضرين وطبيعة الموقف.", "ref": "ص 4"}, {"q": "ما الذي يساعد على كشف اهتمامات الأبناء بصورة أدق؟", "options": ["إتاحة الفرص والخبرات المتنوعة", "تحديد الأنشطة بحسب الجنس", "منع تجربة الأنشطة غير المعتادة", "الاعتماد على توقعات الأسرة"], "answer": 0, "why": "الفرصة تكشف ما لا تكشفه التوقعات؛ فإذا حُصر كل طفل في نوع واحد من الأعمال صعب معرفة ما يعود إلى الميل الأصلي وما صنعته الخبرة المتاحة.", "ref": "ص 5"}, {"q": "ما الذي ينبغي الاحتراز منه عند الحديث عن الفطرة؟", "options": ["الحديث عن الفطرة الإنسانية المشتركة", "إطلاق كلمة «فطري» على كل سلوك يتكرر في مجتمع معين", "مراعاة الحقائق الجسدية", "تعليم الأبناء أحكام البلوغ"], "answer": 1, "why": "ينبغي الاحتراز من إطلاق كلمة فطري على كل سلوك يتكرر في مجتمع معين؛ فشيوع صورة ما لا يخبرنا وحده كيف نشأت.", "ref": "ص 6"}, {"q": "ما الأسلوب الذي اقترحه الدرس مع صبي دفعه زميله في التدريب؟", "options": ["أن تقول له أمه: كان يجب أن تضربه", "أن يترك التدريب نهائيًا", "أن يتدرب على رد قصير وحازم والابتعاد وطلب تدخل المدرب", "أن تتجاهل الأم ما حدث"], "answer": 2, "why": "تسأله أمه عما حدث، ثم تتدرب معه على رد قصير وحازم: «لا تدفعني»، وعلى الابتعاد وطلب تدخل المدرب إن استمر الاعتداء، دون ربط شجاعته بإيذاء غيره.", "ref": "ص 8"}, {"q": "ما المهارة التي تتعلمها الفتاة حين تُسأل أسئلة شخصية في مجلس عائلي؟", "options": ["أن ترد بحدة على السائلة", "أن احترام الكبير يلزمها بالإجابة عن كل شيء", "أن احترام الكبير لا يلزمها بكشف خصوصياتها، فتعتذر بعبارة مهذبة واضحة", "أن تغادر المجلس دون كلام"], "answer": 2, "why": "تعرض عليها الأم عبارات مهذبة مثل «هذا موضوع خاص بي»، لتتعلم أن احترام الكبير لا يلزمها بكشف خصوصياتها.", "ref": "ص 9"}, {"q": "لماذا يُعدّ تحويل المساواة إلى تطابق دائم في المعاملة خطأً تربويًا؟", "options": ["لأن القواعد المشتركة لا تصلح أبدًا", "لأنه يقلل من احترام الأبناء لأمهم", "لأنه قد يحجب احتياجًا حقيقيًا لأحد الأبناء", "لأن العدل بين الأبناء غير مطلوب"], "answer": 2, "why": "تصلح القاعدة المشتركة في أمور كثيرة، لكن تحويل التطابق إلى شرط دائم قد يحجب احتياجًا حقيقيًا لأحدهم؛ فالمساواة في الكرامة لا تقتضي تماثل المتطلبات دائمًا.", "ref": "ص 11"}, {"q": "ما موقف الدرس من تبرير خطأ الطفل بجنسه (مثل: «ولد يحب السيطرة»)؟", "options": ["أنه تفسير مقبول لطبيعة الطفل", "أنه يقوّي شخصية الطفل", "أنه يصلح للبنين دون البنات", "أن الجنس ليس تفسيرًا كافيًا للخطأ ولا عذرًا يعفي صاحبه من إصلاح أثره"], "answer": 3, "why": "حين يُبرر الخطأ باسم الطبيعة يفقد الطفل فرصة إدراك مسؤولية فعله؛ فالجنس ليس تفسيرًا كافيًا للخطأ، ولا عذرًا يعفي صاحبه من إصلاح أثره.", "ref": "ص 13"}], "11": [{"q": "ما المفارقة التي بدأ بها الدرس في تعامل الأم مع طفليها (ابن الثالثة وابن الثانية عشرة)؟", "options": ["أنها تهمل الصغير وتهتم بالكبير فقط", "أنها تترك الاثنين دون توجيه", "أنها تعامل الاثنين بالأسلوب نفسه تمامًا", "أنها تطالب الصغير بما لم يكتمل عنده، وتحرم الكبير مما اكتمل عنده"], "answer": 3, "why": "الصغير نطالبه بما لم يكتمل عنده فنرى محاولته خطأ، والكبير نحرمه مما اكتمل عنده فنرى قدرته عجزًا؛ فالأم تعامل كل واحد منهما بعمر غير عمره.", "ref": "ص 2"}, {"q": "ما الطرفان اللذان يقع فيهما الناس في التعامل مع نمو الأطفال؟", "options": ["طرف يعاقب، وطرف يكافئ", "طرف يعلّم القرآن، وطرف يعلّم اللغة", "طرف يستعجل النمو، وطرف يؤخر النمو", "طرف يهتم بالجسد، وطرف يهتم بالعقل"], "answer": 2, "why": "طرف يستعجل النمو فيريد من الصغير ما لا يطيق، وطرف يؤخره فيعامل ابن الثانية عشرة كابن خمس ويحمل عنه كل مسؤولية؛ والقرآن يعطي كل مرحلة حقها.", "ref": "ص 3"}, {"q": "ماذا نستفيد من قوله تعالى ﴿الله الذي خلقكم من ضعف ثم جعل من بعد ضعف قوة﴾ في التربية؟", "options": ["أن النمو يحدث مصادفة", "أن القوة تولد مع الطفل كاملة", "أن الضعف عيب يجب علاجه سريعًا", "أن البداية ضعف وهو أصل الخلقة، فلا نغضب من ضعف الطفل"], "answer": 3, "why": "البداية ضعف؛ والطفل يبدأ ضعيفًا في جسده وعلمه ومشاعره، وهذا ليس عيبًا فيه بل أصل خلقته، فالمربي الذي يغضب من ضعف الطفل يغضب من سنة الله فيه.", "ref": "ص 4"}, {"q": "بماذا يتميز مفهوم النمو في التصور الإسلامي عن علم النفس الحديث؟", "options": ["بتسريع مراحله لتكليف الصبي مبكرًا", "باعتماده على الوراثة وحدها", "بربطه بغاية تعبدية وبعد روحي (الفطرة)", "بحصره في المظهر الجسدي"], "answer": 2, "why": "يضاف في التصور الإسلامي أن النمو بتقدير، وله غاية هي بلوغ الأشد والتأهل للتكليف والعبادة، ويشمل الروح والفطرة.", "ref": "ص 5"}, {"q": "ما مجالات النمو الأربعة التي ينمو فيها الطفل في وقت واحد؟", "options": ["الديني، والدراسي، والرياضي، والفني", "اللغوي، والحركي، والمالي، والمهني", "البيتي، والمدرسي، والمسجدي، والعائلي", "الجسدي، والعقلي، والانفعالي، والاجتماعي"], "answer": 3, "why": "الطفل ينمو في أربعة مجالات متشابكة: جسده، وعقله، ومشاعره، وعلاقاته، وكل مجال يؤثر في الآخر.", "ref": "ص 6"}, {"q": "طالب في السابعة لا يركز ويكثر الحركة، ثم اتضح أنه ينام بعد منتصف الليل. ماذا يعلمنا هذا المثال؟", "options": ["أن المشكلة قد تظهر في مجال وجذرها في مجال آخر", "أن المشكلة في مجال واحد لا تتأثر بغيره", "أن الحل هو عقاب الطفل", "أن التركيز لا علاقة له بالنوم"], "answer": 0, "why": "المشكلة ظهرت في المجال العقلي (التركيز)، وجذرها في المجال الجسدي (النوم)؛ فإذا رأيتِ مشكلة في مجال فابحثي عن جذرها في مجال آخر.", "ref": "ص 8"}, {"q": "ما الذي يدل عليه حديث «مروا أولادكم بالصلاة وهم أبناء سبع» بالنسبة لما قبل السابعة؟", "options": ["أنها مرحلة تهيئة بالقدوة والمحبة والمشاهدة", "أنها مرحلة لا تربية فيها", "أنها مرحلة أوامر وتكليف صارم", "أنها مرحلة عقاب على ترك الصلاة"], "answer": 0, "why": "جعل النبي ﷺ السابعة بداية الأمر بالصلاة؛ فما قبلها مرحلة تهيئة بالقدوة والمحبة والمشاهدة، لا مرحلة أوامر وتكليف.", "ref": "ص 11"}, {"q": "كيف ينبغي أن تفهم الأم أخذ ابن الثالثة لعبة أخيه؟", "options": ["أنه يتعمد الظلم ويستحق العقاب الشديد", "أنه دليل على تأخر عقلي", "أنه تمركز حول الذات لم ينضج معه بعد إدراك حق الآخر، ويُعلَّم بالصبر", "أنه علامة على سوء الخلق الدائم"], "answer": 2, "why": "ابن الثالثة لا يستطيع بعد أن يرى الأمور من عين غيره؛ فحين يأخذ لعبة أخيه لا يقصد الظلم، وهذا يُعلَّم بالصبر لا يُعاقب بالشدة.", "ref": "ص 11"}, {"q": "ما الأسلوب الأنسب لعمر ابن الثالث حين يقترب من الفرن؟", "options": ["شرح طويل لخمس دقائق عن الحرارة والحروق", "إبعاده بهدوء مع كلمة واحدة «حار!» ووضع حاجز وإعطاؤه بديلًا", "معاقبته بالضرب", "تركه يجرب حتى يتعلم"], "answer": 1, "why": "الكلام الطويل للصغير ضجيج؛ والأسلوب الأنسب أن تبعده بهدوء، وتقول كلمة واحدة «حار!»، وتضع حاجزًا، وتعطيه شيئًا آخر يلعب به.", "ref": "ص 17"}, {"q": "ماذا يستفاد من قوله تعالى ﴿وابتلوا اليتامى حتى إذا بلغوا النكاح﴾ في شأن الرشد؟", "options": ["أن الرشد ينحصر في إدارة المال فقط", "أن الرشد يُبنى بالتدريب والاختبار التدريجي قبل البلوغ", "أن الرشد يكتمل فجأة عند البلوغ", "أن الرشد يظهر في وقت واحد عند جميع الأبناء"], "answer": 1, "why": "الرشد لا يأتي فجأة عند البلوغ، بل يُختبر ويُدرَّب عليه تدريجيًا قبله؛ فأعطي ابنك مسؤولية صغيرة ليصبح راشدًا.", "ref": "ص 20"}], "12": [{"q": "ما المقصود بسنوات التأسيس في التربية؟", "options": ["السنة الأولى من عمر الطفل فقط", "السنوات من العاشرة إلى البلوغ", "السنوات السبع الأولى تقريبًا من الولادة إلى سن التمييز", "سنوات المرحلة الابتدائية كاملة"], "answer": 2, "why": "سنوات التأسيس هي السنوات السبع الأولى تقريبًا، من الولادة إلى سن التمييز، وفيها تتكون أسس الشخصية: الأمان، والعادات، وصورة الطفل عن نفسه وعن ربه وعن الناس.", "ref": "ص 4"}, {"q": "ما معنى القاعدة «الطفل يبدأ صفحة سليمة لا فارغة»؟", "options": ["أن الطفل لا يحمل أي استعداد عند الولادة", "أن التربية تبدأ بعد سن السابعة", "أن فيه فطرة تميل إلى الحق وأدوات تنتظر من يغذيها، فالتربية رعاية لا صناعة من عدم", "أن الطفل يتعلم وحده دون حاجة إلى أحد"], "answer": 2, "why": "الطفل فيه فطرة تميل إلى الحق، وأدوات تنتظر من يغذيها؛ فالتربية في هذه السنوات رعاية لما أودعه الله فيه، لا صناعة من عدم.", "ref": "ص 3"}, {"q": "أيّ المراحل العمرية تُسمّى «مرحلة الأمان»؟", "options": ["من الثانية إلى الرابعة", "من الولادة إلى السنتين", "من السابعة إلى العاشرة", "من الرابعة إلى السابعة"], "answer": 1, "why": "من الولادة إلى السنتين مرحلة الأمان، يتعلم فيها الطفل أن العالم آمن أو مخيف من خلال استجابة أمه لبكائه وجوعه وخوفه.", "ref": "ص 5"}, {"q": "ماذا نتعلم من مداعبة النبي ﷺ لأبي عمير وسؤاله: «يا أبا عمير، ما فعل النغير؟»", "options": ["أن نمنع الأطفال من اقتناء الحيوانات", "أن ننتظر حتى يكبر الطفل لنحدثه", "أن نكثر من المواعظ الطويلة للصغار", "أن ننزل إلى عالم الطفل لنرفعه، لا أن نطالبه بالصعود إلى عالمنا قبل أوانه"], "answer": 3, "why": "أعظم الخلق دخل عالم طفل صغير وسأله عن طائره الذي يهمه؛ وهذا فقه مرحلة التأسيس: أن ننزل إلى عالم الطفل لنرفعه.", "ref": "ص 5"}, {"q": "لماذا لا تعني عبارة «كن مؤدبًا» شيئًا للطفل الصغير؟", "options": ["لأنه يفكر بالمحسوس، فالمفاهيم الكبيرة تصل إليه بالقصة والمثال والموقف", "لأنه لا يحب الأدب", "لأن الأدب لا يُعلَّم في الصغر", "لأنه لا يسمع كلام أمه"], "answer": 0, "why": "من خصائص المرحلة التفكير الحسي؛ فعبارة «قل: شكرًا لجدتك» يفهمها، أما المفاهيم الكبيرة فتصل إليه بالقصة والمثال والموقف لا بالتعريف.", "ref": "ص 6"}, {"q": "ما الأسلوب الذي استعمله النبي ﷺ حين أخذ الحسن تمرة من تمر الصدقة؟", "options": ["تجاهل الخطأ لأنه صغير", "كلمة يفهمها «كخ كخ»، وأمر عملي «ارم بها»، وتعليل قصير", "التوبيخ أمام الناس", "محاضرة طويلة عن أحكام الزكاة"], "answer": 1, "why": "كلمة يفهمها الطفل «كخ»، ثم أمر عملي واضح «ارم بها»، ثم تعليل قصير بلغة «نحن»: «إنا لا نأكل الصدقة»، دون محاضرة ولا توبيخ ولا تجاهل.", "ref": "ص 7"}, {"q": "ما الأدوات الخمس للتربية الفاعلة في السنوات الأولى؟", "options": ["العقاب، والمكافأة، والتهديد، والمقارنة، والمراقبة", "الشاشة، والألعاب، والحلوى، والنزهة، والهدايا", "الحفظ، والتلقين، والاختبار، والتكرار، والعقوبة", "الحب الظاهر، والحضور، والروتين الثابت، والقصة، والتوجيه القصير الواضح"], "answer": 3, "why": "الطفل الصغير لا يُربى بالأوامر وحدها، بل بخمس أدوات تعمل معًا: الحب الظاهر، والحضور، والروتين الثابت، والقصة، والتوجيه القصير الواضح.", "ref": "ص 9"}, {"q": "ماذا يعلمنا حديث «أما إنك لو لم تعطيه شيئًا كُتبت عليك كذبة»؟", "options": ["أن الطفل لا يميز الصدق من الكذب", "أن الوعد الصغير للطفل يُحسب صدقًا أو كذبًا، فيتعلم الصدق من وفاء أمه", "أن الوعد للطفل لا يُحاسب عليه", "أن إعطاء الطفل التمر واجب"], "answer": 1, "why": "حتى الوعد الصغير لطفل صغير يُحسب صدقًا أو كذبًا؛ فالطفل يتعلم الصدق من وفاء أمه بوعودها الصغيرة قبل أن يتعلمه من القصص.", "ref": "ص 11"}, {"q": "أي صور التشجيع التالية أنفع للطفل؟", "options": ["«شاطر» دون تحديد", "«أنت ذكي» على كل شيء", "تشجيع محدد على الجهد مثل: «حاولت كثيرًا حتى نجحت»", "تأجيل المديح إلى نهاية الأسبوع"], "answer": 2, "why": "التشجيع النافع يكون محددًا، وعلى الجهد لا على الذكاء، وفوريًا قريبًا من الفعل؛ فـ«حاولت كثيرًا حتى نجحت» تبني طفلًا يصبر.", "ref": "ص 13"}, {"q": "ما الذي يتعلمه الطفل حين يتناقض الوالدان (تمنع الأم ويسمح الأب)؟", "options": ["أن يتوقف عن الطلب", "أن يحترم الأب أكثر من الأم", "أن القاعدة ثابتة لا تتغير", "أن القاعدة تتغير حسب من يسأله، فيتعلم التلاعب بينهما"], "answer": 3, "why": "من الأخطاء الشائعة تناقض الوالدين؛ فيتعلم الطفل أن القاعدة تتغير حسب من يسأله، ويتعلم التلاعب بينهما.", "ref": "ص 15"}], "13": [{"q": "ماذا يعني قوله تعالى ﴿يا يحيى خذ الكتاب بقوة﴾ في مفهوم القوة؟", "options": ["أن القوة في القرآن صفة في طريقة الأخذ: بجد وعزيمة واجتهاد", "أن يحفظ الكتاب حفظًا فقط", "أن القوة لا تكون إلا للكبار", "أن القوة صفة في الجسد قبل كل شيء"], "answer": 0, "why": "لم يقل الله ليحيى «احفظ الكتاب»، بل ﴿خذ الكتاب بقوة﴾؛ فالقوة في القرآن صفة في طريقة الأخذ قبل أن تكون صفة في الجسد.", "ref": "ص 2"}, {"q": "لماذا قرنت ابنة صاحب مدين القوة بالأمانة في قولها ﴿إن خير من استأجرت القوي الأمين﴾؟", "options": ["لأن القوة بلا أمانة خطر، والأمانة بلا قوة عجز", "لأن الأمانة لا تهم في العمل", "لأن موسى كان أمينًا فقط", "لأن القوة تغني عن الأمانة"], "answer": 0, "why": "قرنت ابنة صاحب مدين القوة بالأمانة؛ فالقوة بلا أمانة خطر، والأمانة بلا قوة عجز.", "ref": "ص 3"}, {"q": "ما أخطر ما نقع فيه عند تربية الأبناء على القوة؟", "options": ["أن نختزل القوة في نوع واحد كقوة البدن أو التفوق الدراسي", "أن نهتم بصحة البدن", "أن نعلمهم التوكل على الله", "أن نعلمهم ضبط النفس"], "answer": 0, "why": "أخطر ما نقع فيه أن نختزل القوة في نوع واحد؛ فنحتفي بالولد الذي يضرب من ضربه، وننسى أن النبي ﷺ جعل الشديد هو من يملك نفسه.", "ref": "ص 4"}, {"q": "من هو الشديد كما في قوله ﷺ «ليس الشديد بالصرعة»؟", "options": ["الذي لا يبكي مهما حدث", "الذي يتفوق على أقرانه في كل مجال", "الذي يملك نفسه عند الغضب", "الذي يصرع الناس في المصارعة"], "answer": 2, "why": "«ليس الشديد بالصرعة، إنما الشديد الذي يملك نفسه عند الغضب»؛ فملك النفس من أهم أنواع القوة.", "ref": "ص 4"}, {"q": "أي تصرف يعبر عن اجتماع الجوانب الثلاثة للقوة في حديث «احرص على ما ينفعك واستعن بالله ولا تعجز»؟", "options": ["الاعتماد على النفس وطلب المدح عند النجاح", "تحديد هدف، ودعاء الله، والعمل لتحقيقه", "انتظار الفرصة وتجنب المخاطرة", "تمني النجاح والندم الطويل عند الإخفاق"], "answer": 1, "why": "الحديث يرسم ثلاثة جوانب متكاملة: نفسي يحرص على النافع، وروحي يستعين بالله، وسلوكي لا يعجز بل يعمل.", "ref": "ص 4"}, {"q": "ما الميزان الثابت الذي يضعه حديث «عجبًا لأمر المؤمن» لبناء الشخصية المتزنة؟", "options": ["في النعمة فرح دائم، وفي المصيبة حزن دائم", "في النعمة شكر، وفي المصيبة صبر", "ألا يفرح ولا يحزن أبدًا", "أن يعتمد على مدح الناس"], "answer": 1, "why": "الشخصية المتزنة تفرح وتحزن دون أن تفقد توازنها؛ والحديث يضع للمؤمن ميزانًا ثابتًا: في النعمة شكر، وفي المصيبة صبر.", "ref": "ص 6"}, {"q": "ما الأسس الثلاثة للإيمان العميق التي ذكرها الدرس؟", "options": ["العقاب، والمكافأة، والمراقبة", "المدرسة، والمسجد، والأصدقاء", "القدوة، والعبادة، والحوار", "الحفظ، وا
