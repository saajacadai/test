/* Layout: خلفية زرقاء بصورة باهتة من دليل الهوية على اليسار، عناوين بيضاء مباشرة عليها، وبطاقات وردية فاتحة للمحتوى. أزرار وردية وسماوية فاتحة. */
:root {
  --bg: #023373;
  --on-dark: #FFFFFF;
  --on-dark-soft: #CFE0F5;
  --on-dark-pink: #FBC4D8;
  --surface: #FDEFF4;
  --surface-2: #FFF8FB;
  --ink: #023373;
  --ink-soft: #4A5F86;
  --line: #F2C2D5;
  --navy-tint: #DCE3F0;
  --pink: #F280AA;
  --pink-ink: #B03A67;
  --pink-tint: #F9C9DB;
  --cyan: #38B5DA;
  --cyan-ink: #0B6F93;
  --cyan-tint: #D8EFF8;
  --btn-pink: #F9C9DB;
  --btn-pink-hover: #F5B5CC;
  --btn-cyan: #BDE5F3;
  --btn-cyan-hover: #A6DBEE;
  --ok: #1E7A55;
  --ok-tint: #E4F5EC;
  --bad: #A33A3A;
  --bad-tint: #FBE6E6;
  --f-head: 'Alexandria', 'Tajawal', system-ui, sans-serif;
  --f-body: 'Tajawal', 'Alexandria', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.8;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

#root { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding-block: 20px 40px; }
h1, h2, h3 { font-family: var(--f-head); margin: 0; text-wrap: balance; line-height: 1.5; }
p { margin: 0; }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--btn-cyan); outline-offset: 2px; border-radius: 6px; }

/* شريط علوي */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 6px 18px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-head); font-weight: 700; font-size: 17px; color: var(--on-dark); }
.brand img { height: 44px; width: auto; }
.topbar .slogan { color: var(--on-dark-pink); font-family: var(--f-head); font-weight: 500; font-size: 14px; }

/* هيرو على الخلفية الزرقاء مباشرة */
.hero { position: relative; padding: 28px 4px 10px; }
.hero::before {
  content: ""; position: absolute; inset-block-start: 4px; inset-inline-start: 0;
  width: 150px; height: 96px;
  background-image: radial-gradient(var(--cyan) 1.6px, transparent 1.7px);
  background-size: 16px 16px; opacity: .6; pointer-events: none;
}
.hero h1 { position: relative; color: var(--on-dark); font-weight: 700; font-size: clamp(30px, 6vw, 50px); }
.hero .lead { position: relative; margin-top: 10px; max-width: 46ch; color: var(--on-dark-soft); font-size: 18px; }
.hero .motto { position: relative; margin-top: 14px; font-family: var(--f-head); font-weight: 500; color: var(--on-dark-pink); font-size: 17px; }
.hero .rule { position: relative; width: 72px; height: 5px; background: var(--pink); border-radius: 3px; margin-top: 18px; }

/* بحث */
.search { position: relative; margin-top: 22px; max-width: 560px; }
.search label { display: block; font-family: var(--f-head); font-weight: 500; font-size: 15px; margin-bottom: 6px; }
.hero .search label { color: var(--on-dark); }
.search input {
  width: 100%; padding: 12px 16px; border-radius: 12px;
  border: 1.5px solid #E4DFC8; color: var(--ink); min-height: 48px;
  background-color: #F2EFE2;

  /* تكتمل المحاضرة بتأكيد مراجعة الملخص وأداء الاختبار؛ ولا يكفي فتح الملخص.

  function isComplete(s, n) {

  function pctOf(a, b) { return b ? Math.round(a / b * 100) : 0; }

  function renderHomeResults(q) {

  /* ---------- صفحة المادة ---------- */
  function lectureCard(s, i) {

    var title = has ? '<h3>' + esc(l.title) + '</h3>' : '<h3 class="todo">ستُضاف قريبًا</h3>';
    var sum = has && l.file
      ? '<button class="btn btn-blue" data-action="read" data-sid="' + s.id + '" data-n="' + n + '">الملخص المعتمد</button>'

  function lectureList(s) {

  /* ---------- قارئ الملخص (العارض المدمج لملف PDF الأصلي) ---------- */
  function openReader(sid, n) {
    var s = subj(sid), l = s.lectures[n - 1];

  }

  var PC = {};            /* ذاكرة مؤقتة لصفحات الملخصات */
  var RD = { page: 1, pages: 0 };
  function pagesOf(id) { return (window.PAGE_COUNTS && window.PAGE_COUNTS[id]) || 0; }
  function renderReader() {
    var s = subj(R.sid), l = s.lectures[R.n - 1], rec = getL(R.sid, R.n);

      '<div class="reader-nav" style="justify-content:center"><span class="pg" id="pg-label"></span></div></section>' +
      '<div class="page-wrap" id="page-wrap"><p class="loading" id="pdf-msg">جارٍ تحميل الصفحة…</p><img id="pdf-img" data-action="tap-page" alt="صفحة من الملخص المعتمد" hidden></div>' +
      '<div class="reader-nav" style="margin-top:12px"><button class="btn btn-soft" id="pg-next" data-action="pg-next">التالي ←</button><button class="btn btn-soft" id="pg-prev" data-action="pg-prev">→ السابق</button></div>' +
      '<p class="page-note">المسي يسار الصفحة للانتقال إلى التالية، ويمينها للرجوع إلى السابقة. الملخص معروض كما اعتُمد دون أي تعديل.</p>' +
      '<div class="reader-actions">' +
      '<label class="check" style="color:#fff"><input type="checkbox" data-action="toggle-summary-reader"' + (rec.summary ? ' checked' : '') + '>تمت مراجعة الملخص ✓</label>' +
      (hasQ(l) ? '<button class="btn btn-primary" data-action="quiz" data-sid="' + s.id + '" data-n="' + R.n + '">الأسئلة الاستيعابية</button>' : '') +
      '<button class="btn btn-pink" id="dl-btn" data-action="download-summary" hidden>تنزيل الملخص</button><span class="note" id="dl-msg" role="status" style="color:#CFE0F5"></span></div>' +
      '<div class="reader-actions">' +
      (prev ? '<button class="btn btn-ghost btn-sm" data-action="read-go" data-n="' + prev + '">→ المحاضرة السابقة</button>' : '') +

      '</div></div>' + footer();
    paintReader();
    initDownload();
  }
  function paintReader() {
    var msg = document.getElementById('pdf-msg'), im = document.getElementById('pdf-img');
    if (!msg || !im) return;
    var l = subj(R.sid).lectures[R.n - 1], f = l.file;
    var lab = document.getElementById('pg-label'); if (lab) lab.textContent = 'صفحة ' + RD.page + ' من ' + RD.pages;
    var pv = document.getElementById('pg-prev'), nx = document.getElementById('pg-next');
    if (pv) pv.disabled = RD.page <= 1; if (nx) nx.disabled = RD.page >= RD.pages;
    im.hidden = true; msg.hidden = false; msg.textContent = 'جارٍ تحميل الصفحة…';
    var want = RD.page, n0 = R.n;
    im.onload = function () { if (want === RD.page && n0 === R.n) { im.hidden = false; msg.hidden = true; } };
    im.onerror = function () { msg.textContent = 'تعذّر عرض الصفحة هنا، حاولي مرة أخرى بعد قليل.'; };
    var show = function () { if (want === RD.page && n0 === R.n && PC[f]) im.src = PC[f][RD.page - 1]; };
    if (PC[f]) show();
    else fetch('summaries/pages/' + f + '.json').then(function (r) { if (!r.ok) throw new Error('x'); return r.json(); })
      .then(function (arr) { PC[f] = arr; show(); }).catch(function () { im.onerror(); });

  function gotoPage(p) { if (p < 1 || p > RD.pages) return; RD.page = p; paintReader(); window.scrollTo(0, 0); }
  var DL = null;

    if (!(window.claude && window.claude.use)) return;

    }, function () {});
  }
  function downloadSummary() {
    var msg = document.getElementById('dl-msg'); if (!DL) return;

      .then(function (b) { return DL.save({ filename: 'ملخص ' + s.name + ' - المحاضرة ' + pad2(R.n) + ' - ' + ttl + '.pdf', data: b }); })
      .then(function () { if (msg) msg.textContent = 'تم حفظ الملخص.'; })
      .catch(function (e) { if (msg) msg.textContent = (e && e.code === 'declined') ? '' : 'تعذّر التنزيل الآن.'; });
  }

  /* ---------- الاختبار ---------- */
  function startQuiz(sid, n) {
    var s = subj(sid), l = s.lectures[n - 1];
    if (!hasQ(l)) return;
    setLast(sid, n);
    Q = { sid: sid, n: n, name: s.name, title: l.title, qs: l.questions, i: 0, picked: [], checked: false };
    go({ name: 'quiz' });
  }
  function renderQuiz() {
    var q = Q.qs[Q.i], total = Q.qs.length, picked = Q.picked[Q.i];
    var opts = q.options.map(function (o, k) {
      var cls = 'opt';
      if (Q.checked) { cls += ' locked'; if (k === q.answer) cls += ' ok'; else if (k === picked) cls += ' bad'; }
      return '<label class="' + cls + '"><input type="radio" name="opt" value="' + k + '"' + (picked === k ? ' checked' : '') + (Q.checked ? ' disabled' : '') + '>' +
        '<span class="letter">' + LETTERS[k] + '</span><span class="txt">' + esc(o) + '</span></label>';
    }).join('');
    var fb = '';
    if (Q.checked) {
      var right = picked === q.answer;
      fb = '<div class="feedback ' + (right ? 'ok' : 'bad') + '" role="status"><span class="head">' + (right ? 'أحسنتِ، إجابتكِ صحيحة' : 'راجعي هذه الفكرة، فبالمراجعة يثبت العلم') + '</span>' +
        '<span>الإجابة الصحيحة: <b>' + LETTERS[q.answer] + ') ' + esc(q.options[q.answer]) + '</b></span>' +
        (q.why ? '<span>' + esc(q.why) + '</span>' : '') + (q.ref ? '<span class="ref">المرجع في الملخص: ' + esc(q.ref) + '</span>' : '') + '</div>';
    }
    var last = Q.i === total - 1;
    var act = Q.checked
      ? '<button class="btn btn-blue" data-action="next-q">' + (last ? 'عرض النتيجة' : 'السؤال التالي') + '</button>'
      : '<button class="btn btn-pink" data-action="check" id="check-btn"' + (picked == null ? ' disabled' : '') + '>تحققي من إجابتي</button>';
    $root.innerHTML = topbar() + '<div class="quiz-wrap">' +
      '<div class="back"><button class="btn btn-ghost btn-sm" data-action="quit-quiz">→ العودة إلى المادة</button></div>' +
      '<section class="quiz-head"><span class="crumb">' + esc(Q.name) + '</span><h1>المحاضرة (' + pad2(Q.n) + ') · ' + esc(Q.title) + '</h1>' +
      '<div class="bar-row"><span>السؤال ' + (Q.i + 1) + ' من ' + total + '</span><b>' + pctOf(Q.i, total) + '%</b></div>' + bar(pctOf(Q.i, total)) + '</section>' +
      '<section class="qcard"><span class="qnum">السؤال ' + (Q.i + 1) + '</span><p class="qtext">' + esc(q.q) + '</p>' +
      '<div class="opts" role="radiogroup" aria-label="الخيارات">' + opts + '</div>' + fb + '<div class="qactions">' + act + '</div></section></div>';
  }
  function score() { var c = 0; Q.qs.forEach(function (q, k) { if (Q.picked[k] === q.answer) c++; }); return c; }
  function finishQuiz() {
    var c = score(), total = Q.qs.length, rec = getL(Q.sid, Q.n);

    go({ name: 'result' });
  }
  function message(pct) {

    if (pct >= 70) return 'مراجعة موفقة! بقيت بعض التفاصيل التي تستحق منكِ مزيدًا من التثبيت';
    if (pct >= 50) return 'خطوة طيبة، أعيدي النظر في الأفكار التي أشكلت عليكِ';
    return 'لا بأس، فالمراجعة فرصة للفهم والتثبيت. عودي إلى الملخص ثم أعيدي المحاولة';
  }
  function nextLectureWithQuiz() {

  }
  function renderResult() {

    $root.innerHTML = topbar() + '<div class="quiz-wrap"><section class="score-card"><span class="crumb">' + esc(Q.name) + ' · المحاضرة (' + pad2(Q.n) + ')</span>' +
      '<div class="score-big">' + c + ' <small>من ' + total + '</small></div><div>النسبة المئوية: <b>' + pct + '%</b></div>' + bar(pct) +
      '<p class="score-msg">' + message(pct) + '</p><div class="result-actions">' +
      '<button class="btn btn-blue" data-action="review">مراجعة الأخطاء</button>' +
      '<button class="btn btn-pink" data-action="retry">إعادة الاختبار</button>' +
      '<button class="btn btn-ghost" data-action="quit-quiz">العودة إلى المحاضرات</button>' +
      '<button class="btn btn-blue" data-action="next-lecture"' + (nx ? '' : ' disabled') + '>الانتقال إلى المحاضرة التالية</button>' +
      '</div></section></div>' + footer();
  }
  function renderReview() {
    var items = '', wrong = 0;
    Q.qs.forEach(function (q, k) {
      var p = Q.picked[k], ok = p === q.answer;
      if (!ok) wrong++;
      if (reviewOnlyWrong && ok) return;
      items += '<article class="review-item"><span class="qnum">السؤال ' + (k + 1) + ' · <span class="' + (ok ? 'tag-ok' : 'tag-bad') + '">' + (ok ? 'صحيحة' : 'تحتاج مراجعة') + '</span></span>' +
        '<p class="qtext" style="font-size:17px">' + esc(q.q) + '</p>' +
        '<p class="ans">إجابتكِ: ' + (p == null ? 'لم تُجيبي' : LETTERS[p] + ') ' + esc(q.options[p])) + '</p>' +
        (ok ? '' : '<p class="ans">الإجابة الصحيحة: <b>' + LETTERS[q.answer] + ') ' + esc(q.options[q.answer]) + '</b></p>') +
        (q.why ? '<p class="ans">' + esc(q.why) + '</p>' : '') + (q.ref ? '<p class="note">المرجع في الملخص: ' + esc(q.ref) + '</p>' : '') + '</article>';
    });
    if (!items) items = '<p class="empty-note">لا أخطاء في هذا الاختبار، أحسنتِ!</p>';
    $root.innerHTML = topbar() + '<div class="quiz-wrap"><div class="back"><button class="btn btn-ghost btn-sm" data-action="back-result">→ العودة إلى النتيجة</button> ' +
      '<button class="btn btn-blue btn-sm" data-action="toggle-wrong">' + (reviewOnlyWrong ? 'عرض كل الأسئلة' : 'عرض الأخطاء فقط (' + wrong + ')') + '</button></div>' +
      '<div class="review-list">' + items + '</div></div>' + footer();
  }

  /* ---------- صفحة التقدم ---------- */
  function renderProgress() {
    var tot = { reviewed: 0, quizzes: 0, complete: 0 };
    var per = SUBJECTS.map(function (s) {
      var c = subjectCounts(s); tot.reviewed += c.reviewed; tot.quizzes += c.quizzes; tot.complete += c.complete;
      return { s: s, c: c };
    });
    var overall = pctOf(tot.complete, TOTAL);
    var last = store._last, lastBtn = '';
    if (last && subj(last.sid) && subj(last.sid).lectures[last.n - 1].title) {
      var ls = subj(last.sid);
      lastBtn = '<button class="btn btn-pink" data-action="resume">العودة إلى آخر محاضرة: ' + esc(ls.name) + ' · المحاضرة (' + pad2(last.n) + ')</button>';
    }
    var subjBars = per.map(function (x) {
      var p = pctOf(x.c.complete, x.s.total);
      return '<div class="subj-prog"><div class="bar-row"><span>' + esc(x.s.name) + '</span><b>' + x.c.complete + ' من ' + x.s.total + ' · ' + p + '%</b></div>' + bar(p) + '</div>';
    }).join('');
    var todo = '';
    per.forEach(function (x) {
      var items = '';
      x.s.lectures.forEach(function (l, i) {
        if (l.title && !isComplete(x.s, i + 1)) {
          var st = status(x.s.id, i + 1);
          items += '<div class="todo-item"><span><b>المحاضرة (' + pad2(i + 1) + ')</b> · ' + esc(l.title) + ' <span class="chip ' + st.cls + '">' + st.text + '</span></span>' +
            '<button class="btn btn-blue btn-sm" data-action="open-lecture" data-sid="' + x.s.id + '" data-n="' + (i + 1) + '">انتقلي إليها</button></div>';
        }
      });
      if (items) todo += '<div class="grp">' + esc(x.s.name) + '</div>' + items;
    });
    $root.innerHTML = topbar() +
      '<div class="back"><button class="btn btn-ghost btn-sm" data-action="home">→ الصفحة الرئيسية</button></div>' +
      '<section class="hero" style="padding-top:4px"><h1>رحلتي في المراجعة</h1><p class="lead">تُحسب المحاضرة مكتملة بإنهاء اختبارها وتأكيد مراجعة ملخصها، ولا يكفي فتح الملخص.</p></section>' +
      '<div class="progress-grid">' +
      stat(TOTAL, 'إجمالي المحاضرات') + stat(tot.reviewed, 'محاضرات تمت مراجعتها') + stat(TOTAL - tot.complete, 'محاضرات متبقية') +
      stat(tot.quizzes, 'اختبارات أُنجزت') + stat(tot.complete, 'محاضرات مكتملة') + stat(overall + '%', 'نسبة التقدم الإجمالية') + '</div>' +
      '<section class="panel"><h2>التقدم العام</h2>' + bar(overall) + lastBtn + '</section>' +
      '<section class="panel"><h2>التقدم في كل مادة</h2>' + subjBars + '</section>' +
      '<section class="panel"><h2>المحاضرات المتبقية</h2><div class="todo-list">' + (todo || '<p class="empty-note">لا توجد محاضرات متبقية بين المحاضرات المضافة حتى الآن.</p>') + '</div></section>' +
      '<p class="note" style="margin-top:10px">يُحفظ تقدمكِ على هذا الجهاز وفي هذا المتصفح، فلا يظهر على جهاز آخر.</p>' + footer();
  }
  function stat(v, k) { return '<div class="stat-card"><div class="v">' + v + '</div><div class="k">' + k + '</div></div>'; }

  /* ---------- الرسم ---------- */
  function render() {
    if (view.name === 'home') renderHome();
    else if (view.name === 'subject') renderSubject();
    else if (view.name === 'read') renderReader();
    else if (view.name === 'quiz') renderQuiz();
    else if (view.name === 'result') renderResult();
    else if (view.name === 'review') renderReview();
    else if (view.name === 'progress') renderProgress();
  }
  function openLecture(sid, n) {
    subjQuery = '';
    go({ name: 'subject', sid: sid });
    var el = document.getElementById('lec-' + n);
    if (el) { el.scrollIntoView({ block: 'center' }); el.classList.add('flash'); }
  }

  /* ---------- الأحداث ---------- */
  $root.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action]');
    if (!t || t.tagName === 'INPUT') return;
    var a = t.getAttribute('data-action'), sid = t.getAttribute('data-sid'), n = parseInt(t.getAttribute('data-n'), 10);
    if (a === 'home') { subjQuery = ''; go({ name: 'home' }); }
    else if (a === 'progress') go({ name: 'progress' });
    else if (a === 'open-subject') { subjQuery = ''; go({ name: 'subject', sid: sid }); }
    else if (a === 'open-lecture') openLecture(sid, n);
    else if (a === 'read') openReader(sid, n);
    else if (a === 'read-go') openReader(R.sid, n);
    else if (a === 'download-summary') downloadSummary();
    else if (a === 'pg-prev') gotoPage(RD.page - 1);
    else if (a === 'pg-next') gotoPage(RD.page + 1);
    else if (a === 'tap-page') { var rc = t.getBoundingClientRect(); if (e.clientX - rc.left < rc.width / 2) gotoPage(RD.page + 1); else gotoPage(RD.page - 1); }
    else if (a === 'back-subject') go({ name: 'subject', sid: R.sid }, { keepScroll: true });
    else if (a === 'quiz') startQuiz(sid, n);
    else if (a === 'check') { Q.checked = true; render(); }
    else if (a === 'next-q') { if (Q.i === Q.qs.length - 1) finishQuiz(); else { Q.i++; Q.checked = false; render(); window.scrollTo(0, 0); } }
    else if (a === 'quit-quiz') go({ name: 'subject', sid: Q.sid });
    else if (a === 'retry') { Q.i = 0; Q.picked = []; Q.checked = false; go({ name: 'quiz' }); }
    else if (a === 'review') { reviewOnlyWrong = true; go({ name: 'review' }); }
    else if (a === 'toggle-wrong') { reviewOnlyWrong = !reviewOnlyWrong; render(); }
    else if (a === 'back-result') go({ name: 'result' });
    else if (a === 'next-lecture') { var nx = nextLectureWithQuiz(); if (nx) startQuiz(Q.sid, nx); }
    else if (a === 'resume') { var l = store._last; if (l) openReader(l.sid, l.n); }
  });
  $root.addEventListener('change', function (e) {
    var t = e.target, a = t.getAttribute('data-action');
    if (t.name === 'opt' && Q && !Q.checked) {
      Q.picked[Q.i] = parseInt(t.value, 10);
      var b = document.getElementById('check-btn'); if (b) b.disabled = false;
      return;
    }
    if (a === 'toggle-summary') {
      var sid = t.getAttribute('data-sid'), n = parseInt(t.getAttribute('data-n'), 10);
      setL(sid, n, { summary: t.checked });
      var y = window.scrollY; render(); window.scrollTo(0, y);
    } else if (a === 'toggle-summary-reader') {
      setL(R.sid, R.n, { summary: t.checked });
    }
  });
  $root.addEventListener('input', function (e) {
    if (e.target.id === 'home-search') renderHomeResults(e.target.value);
    else if (e.target.id === 'subj-search') {
      subjQuery = e.target.value;
      var box = document.getElementById('lecture-list'), s = subj(view.sid);
      if (box && s) box.innerHTML = lectureList(s);
    }
  });

  view = fromHash() || { name: 'home' };
  render();
})();

</script>
